<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jira-Style Pro Roadmap & Tasks</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            jira: {
              bg: '#0B0F19',
              card: '#151C2C',
              border: '#232D42',
              accent: '#3B82F6',
              purple: '#8B5CF6'
            }
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Yjs + y-webrtc pour Temps Réel WebRTC -->
  <script src="https://cdn.jsdelivr.net/npm/yjs@13/dist/yjs.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/y-webrtc@10/dist/y-webrtc.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0B0F19; }
    ::-webkit-scrollbar-thumb { background: #232D42; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
  </style>
</head>
<body class="bg-jira-bg text-slate-100 font-sans antialiased min-h-screen overflow-hidden selection:bg-blue-500/30">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Helpers Utf8 <-> Base64 pour l'API GitHub
    const utf8_to_b64 = (str) => window.btoa(unescape(encodeURIComponent(str)));
    const b64_to_utf8 = (str) => decodeURIComponent(escape(window.atob(str)));

    const TOTAL_DAYS = 30;
    const COLUMN_WIDTH = 52; // Largeur d'une journée en px

    const INITIAL_TASKS = [
      {
        id: '1',
        title: 'Refonte Architecture Cloud & K8s',
        category: 'Infrastructure',
        status: 'IN_PROGRESS',
        assignee: 'Alexandre M.',
        startDay: 2,
        duration: 8,
        color: 'from-blue-600 to-indigo-600',
        subtasks: [
          { id: '1-1', title: 'Provisionner clusters Terraform', done: true },
          { id: '1-2', title: 'Configuration Ingress Controller', done: true },
          { id: '1-3', title: 'Migration microservices auth', done: false }
        ]
      },
      {
        id: '2',
        title: 'Design System & composants Figma',
        category: 'Frontend / UI',
        status: 'IN_PROGRESS',
        assignee: 'Sophie T.',
        startDay: 5,
        duration: 12,
        color: 'from-purple-600 to-pink-600',
        subtasks: [
          { id: '2-1', title: 'Création des Tokens de couleur', done: true },
          { id: '2-2', title: 'Composants de formulaires avancés', done: false }
        ]
      },
      {
        id: '3',
        title: 'Optimisation Performances API REST',
        category: 'Backend',
        status: 'TODO',
        assignee: 'Lucas R.',
        startDay: 16,
        duration: 9,
        color: 'from-emerald-600 to-teal-600',
        subtasks: [
          { id: '3-1', title: 'Mise en place de Redis Cache', done: false },
          { id: '3-2', title: 'Indexation bases PostgreSQL', done: false }
        ]
      }
    ];

    function RoadmapApp() {
      // 1. États Principaux
      const [tasks, setTasks] = useState(() => {
        const saved = localStorage.getItem('jira_roadmap_tasks');
        return saved ? JSON.parse(saved) : INITIAL_TASKS;
      });

      const [selectedTaskId, setSelectedTaskId] = useState('1');
      const [isCreateModalOpen, setIsCreateModalOpen] = useState(false);
      const [newSubtaskTitle, setNewSubtaskTitle] = useState('');

      // Formulaire nouvelle tâche
      const [newTaskForm, setNewTaskForm] = useState({
        title: '',
        category: 'Tech',
        status: 'TODO',
        assignee: 'Non assigné',
        startDay: 1,
        duration: 5,
        color: 'from-blue-600 to-indigo-600'
      });

      // États pour le Drag & Resize de précision
      const [dragState, setDragState] = useState(null); // { taskId, action: 'move'|'resize-left'|'resize-right', startX, initialStartDay, initialDuration }
      const [dragPreview, setDragPreview] = useState(null); // Feedback visuel temps réel

      // Configuration GitHub API & WebRTC
      const [ghConfig, setGhConfig] = useState(() => {
        const saved = localStorage.getItem('gh_config');
        return saved ? JSON.parse(saved) : { owner: '', repo: '', path: 'data.json', token: '' };
      });
      const [syncStatus, setSyncStatus] = useState('');
      const [connectedPeers, setConnectedPeers] = useState(1);
      const yDocRef = useRef(null);

      // Persistance locale
      useEffect(() => {
        localStorage.setItem('jira_roadmap_tasks', JSON.stringify(tasks));
      }, [tasks]);

      useEffect(() => {
        localStorage.setItem('gh_config', JSON.stringify(ghConfig));
      }, [ghConfig]);

      // --- INITIALISATION WEBRTC P2P (YJS) ---
      useEffect(() => {
        if (!window.Y || !window.YWebrtc) return;
        const WebrtcProvider = window.YWebrtc.WebrtcProvider;
        const ydoc = new window.Y.Doc();

        const provider = new WebrtcProvider('jira-premium-roadmap-room', ydoc, {
          signaling: [
            'wss://signaling.yjs.dev',
            'wss://y-webrtc-signaling-eu.herokuapp.com'
          ]
        });

        const yTasks = ydoc.getArray('tasks');

        yTasks.observe(() => {
          const remoteTasks = yTasks.toArray();
          if (remoteTasks.length > 0) setTasks(remoteTasks);
        });

        provider.on('peers', (e) => {
          setConnectedPeers(e.webrtcPeers.length + 1);
        });

        yDocRef.current = { ydoc, yTasks, provider };

        return () => {
          provider.destroy();
          ydoc.destroy();
        };
      }, []);

      const broadcastTasks = (newTasks) => {
        setTasks(newTasks);
        if (yDocRef.current && yDocRef.current.yTasks) {
          const { ydoc, yTasks } = yDocRef.current;
          ydoc.transact(() => {
            yTasks.delete(0, yTasks.length);
            yTasks.insert(0, newTasks);
          });
        }
      };

      // --- DRAG & DROP + RESIZE ENGINE ---
      const handleMouseDown = (e, taskId, action) => {
        e.stopPropagation();
        e.preventDefault();
        const task = tasks.find(t => t.id === taskId);
        if (!task) return;

        setDragState({
          taskId,
          action,
          startX: e.clientX,
          initialStartDay: task.startDay,
          initialDuration: task.duration
        });

        setDragPreview({
          taskId,
          startDay: task.startDay,
          duration: task.duration
        });
      };

      useEffect(() => {
        const handleMouseMove = (e) => {
          if (!dragState) return;

          const deltaX = e.clientX - dragState.startX;
          const dayDelta = Math.round(deltaX / COLUMN_WIDTH);

          let newStartDay = dragState.initialStartDay;
          let newDuration = dragState.initialDuration;

          if (dragState.action === 'move') {
            newStartDay = Math.max(1, Math.min(TOTAL_DAYS - newDuration + 1, dragState.initialStartDay + dayDelta));
          } else if (dragState.action === 'resize-left') {
            const maxDelta = dragState.initialDuration - 1;
            const actualDelta = Math.min(dayDelta, maxDelta);
            newStartDay = Math.max(1, dragState.initialStartDay + actualDelta);
            newDuration = dragState.initialDuration - (newStartDay - dragState.initialStartDay);
          } else if (dragState.action === 'resize-right') {
            newDuration = Math.max(1, Math.min(TOTAL_DAYS - dragState.initialStartDay + 1, dragState.initialDuration + dayDelta));
          }

          setDragPreview({ taskId: dragState.taskId, startDay: newStartDay, duration: newDuration });
        };

        const handleMouseUp = () => {
          if (dragState && dragPreview) {
            const updated = tasks.map(t => t.id === dragState.taskId ? { ...t, startDay: dragPreview.startDay, duration: dragPreview.duration } : t);
            broadcastTasks(updated);
          }
          setDragState(null);
          setDragPreview(null);
        };

        if (dragState) {
          window.addEventListener('mousemove', handleMouseMove);
          window.addEventListener('mouseup', handleMouseUp);
        }

        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseup', handleMouseUp);
        };
      }, [dragState, dragPreview, tasks]);

      // --- AJOUT DE TÂCHE & SOUS-TÂCHE ---
      const handleCreateTask = (e) => {
        e.preventDefault();
        if (!newTaskForm.title.trim()) return;

        const newTask = {
          id: Date.now().toString(),
          ...newTaskForm,
          startDay: Number(newTaskForm.startDay),
          duration: Number(newTaskForm.duration),
          subtasks: []
        };

        const updated = [...tasks, newTask];
        broadcastTasks(updated);
        setSelectedTaskId(newTask.id);
        setIsCreateModalOpen(false);
        setNewTaskForm({
          title: '',
          category: 'Tech',
          status: 'TODO',
          assignee: 'Non assigné',
          startDay: 1,
          duration: 5,
          color: 'from-blue-600 to-indigo-600'
        });
      };

      const handleAddSubtask = (e) => {
        e.preventDefault();
        if (!newSubtaskTitle.trim() || !selectedTaskId) return;

        const updated = tasks.map(t => {
          if (t.id !== selectedTaskId) return t;
          return {
            ...t,
            subtasks: [
              ...t.subtasks,
              { id: `${t.id}-${Date.now()}`, title: newSubtaskTitle.trim(), done: false }
            ]
          };
        });

        broadcastTasks(updated);
        setNewSubtaskTitle('');
      };

      const toggleSubtask = (taskId, subtaskId) => {
        const updated = tasks.map(t => {
          if (t.id !== taskId) return t;
          return {
            ...t,
            subtasks: t.subtasks.map(st => st.id === subtaskId ? { ...st, done: !st.done } : st)
          };
        });
        broadcastTasks(updated);
      };

      const deleteTask = (taskId) => {
        if (confirm("Supprimer cette tâche et toutes ses sous-tâches ?")) {
          const updated = tasks.filter(t => t.id !== taskId);
          broadcastTasks(updated);
          if (selectedTaskId === taskId) setSelectedTaskId(updated[0]?.id || null);
        }
      };

      // --- SYNC GITHUB REST API ---
      const saveToGitHub = async () => {
        if (!ghConfig.owner || !ghConfig.repo || !ghConfig.token) {
          alert("Veuillez remplir les informations de configuration GitHub.");
          return;
        }
        setSyncStatus('Sauvegarde en cours...');
        try {
          const url = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${ghConfig.path}`;
          const headers = {
            'Authorization': `token ${ghConfig.token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          };

          let currentSha = null;
          const getRes = await fetch(url, { headers });
          if (getRes.ok) {
            const data = await getRes.json();
            currentSha = data.sha;
          }

          const body = {
            message: `Update roadmap: ${new Date().toLocaleString('fr-FR')}`,
            content: utf8_to_b64(JSON.stringify(tasks, null, 2)),
            ...(currentSha && { sha: currentSha })
          };

          const putRes = await fetch(url, { method: 'PUT', headers, body: JSON.stringify(body) });
          if (!putRes.ok) throw new Error(`Erreur HTTP: ${putRes.status}`);

          setSyncStatus('✅ Synchronisé sur GitHub');
          setTimeout(() => setSyncStatus(''), 3000);
        } catch (err) {
          console.error(err);
          setSyncStatus('❌ Erreur de sauvegarde');
        }
      };

      const loadFromGitHub = async () => {
        if (!ghConfig.owner || !ghConfig.repo || !ghConfig.token) {
          alert("Veuillez saisir votre Token GitHub.");
          return;
        }
        setSyncStatus('Chargement...');
        try {
          const res = await fetch(`https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${ghConfig.path}`, {
            headers: { 'Authorization': `token ${ghConfig.token}` }
          });
          if (!res.ok) throw new Error("Fichier introuvable");
          const data = await res.json();
          const loadedTasks = JSON.parse(b64_to_utf8(data.content));
          broadcastTasks(loadedTasks);
          setSyncStatus('✅ Données chargées');
          setTimeout(() => setSyncStatus(''), 3000);
        } catch (err) {
          console.error(err);
          setSyncStatus('❌ Échec de chargement');
        }
      };

      const selectedTask = tasks.find(t => t.id === selectedTaskId);

      return (
        <div className="flex flex-col h-screen overflow-hidden">
          {/* Top Bar / Header Jira Style */}
          <header className="bg-jira-card border-b border-jira-border px-6 py-3 flex items-center justify-between shrink-0">
            <div className="flex items-center gap-4">
              <div className="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-black text-white text-lg tracking-wider">
                J
              </div>
              <div>
                <h1 className="text-base font-bold text-slate-100 flex items-center gap-2">
                  Projets & Roadmap Produit
                  <span className="text-xs font-normal px-2 py-0.5 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20">
                    Jira Premium Edition
                  </span>
                </h1>
                <p className="text-xs text-slate-400">Vue Gantt temps réel & suivi des sous-tâches</p>
              </div>
            </div>

            <div className="flex items-center gap-3">
              {/* Badge WebRTC Status */}
              <div className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-900 border border-jira-border text-xs text-emerald-400">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>{connectedPeers} utilisateur(s) P2P</span>
              </div>

              {/* Action Principal : Nouvelle Tâche */}
              <button 
                onClick={() => setIsCreateModalOpen(true)}
                className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-xl transition shadow-lg shadow-blue-600/20 flex items-center gap-2"
              >
                <span className="text-base leading-none">+</span> Créer Tâche
              </button>
            </div>
          </header>

          {/* Configuration GitHub Toolbar */}
          <div className="bg-slate-900/80 border-b border-jira-border px-6 py-2 flex items-center justify-between text-xs text-slate-400 shrink-0">
            <div className="flex items-center gap-3">
              <span className="font-semibold text-slate-300">GitHub Sync:</span>
              <input 
                type="text" placeholder="Owner" value={ghConfig.owner} 
                onChange={e => setGhConfig({...ghConfig, owner: e.target.value})}
                className="bg-jira-bg px-2.5 py-1 rounded border border-jira-border w-24 text-slate-200 focus:outline-none focus:border-blue-500"
              />
              <input 
                type="text" placeholder="Repo" value={ghConfig.repo} 
                onChange={e => setGhConfig({...ghConfig, repo: e.target.value})}
                className="bg-jira-bg px-2.5 py-1 rounded border border-jira-border w-28 text-slate-200 focus:outline-none focus:border-blue-500"
              />
              <input 
                type="password" placeholder="GitHub Token (PAT)" value={ghConfig.token} 
                onChange={e => setGhConfig({...ghConfig, token: e.target.value})}
                className="bg-jira-bg px-2.5 py-1 rounded border border-jira-border w-36 text-slate-200 focus:outline-none focus:border-blue-500"
              />
              <button onClick={loadFromGitHub} className="px-2.5 py-1 bg-jira-card hover:bg-slate-800 text-slate-200 rounded border border-jira-border transition">
                Charger
              </button>
              <button onClick={saveToGitHub} className="px-2.5 py-1 bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 hover:bg-indigo-600/40 rounded transition font-medium">
                Commiter data.json
              </button>
            </div>
            {syncStatus && <span className="font-medium">{syncStatus}</span>}
          </div>

          {/* Core Body : Split Screen (Left Tasks Hierarchy / Right Timeline Gantt Grid) */}
          <div className="flex-1 flex overflow-hidden">
            
            {/* Left Sidebar : Task Hierarchy List */}
            <div className="w-80 border-r border-jira-border bg-jira-card flex flex-col shrink-0">
              <div className="h-12 border-b border-jira-border px-4 flex items-center justify-between text-xs font-bold text-slate-400 uppercase tracking-wider bg-slate-900/50">
                <span>Tâches ({tasks.length})</span>
                <span>Sous-tâches</span>
              </div>

              <div className="flex-1 overflow-y-auto divide-y divide-jira-border/50">
                {tasks.map(task => {
                  const completedSubs = task.subtasks.filter(s => s.done).length;
                  const totalSubs = task.subtasks.length;
                  const isSelected = task.id === selectedTaskId;

                  return (
                    <div 
                      key={task.id} 
                      onClick={() => setSelectedTaskId(task.id)}
                      className={`h-16 px-4 flex items-center justify-between cursor-pointer transition-colors ${
                        isSelected ? 'bg-blue-600/10 border-l-4 border-blue-500' : 'hover:bg-slate-800/40'
                      }`}
                    >
                      <div className="truncate pr-2">
                        <div className="flex items-center gap-2">
                          <span className={`w-2 h-2 rounded-full bg-gradient-to-r ${task.color}`}></span>
                          <span className="text-xs font-semibold text-slate-200 truncate">{task.title}</span>
                        </div>
                        <div className="text-[10px] text-slate-400 mt-1 flex items-center gap-2">
                          <span>{task.category}</span>
                          <span>•</span>
                          <span className="text-slate-500">{task.assignee}</span>
                        </div>
                      </div>

                      <div className="flex items-center gap-2 shrink-0">
                        <span className={`text-[10px] font-mono px-2 py-0.5 rounded-full ${
                          totalSubs > 0 && completedSubs === totalSubs 
                            ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' 
                            : 'bg-slate-800 text-slate-400'
                        }`}>
                          {completedSubs}/{totalSubs}
                        </span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Right Main Panel : Jira Interactive Gantt Timeline */}
            <div className="flex-1 flex flex-col overflow-x-auto bg-jira-bg relative">
              
              {/* Timeline Day/Week Header */}
              <div className="h-12 border-b border-jira-border flex items-center shrink-0 bg-slate-900/60 sticky top-0 z-10" style={{ width: `${TOTAL_DAYS * COLUMN_WIDTH}px` }}>
                {Array.from({ length: TOTAL_DAYS }).map((_, i) => {
                  const dayNum = i + 1;
                  const isWeekend = dayNum % 7 === 6 || dayNum % 7 === 0;
                  const isToday = dayNum === 8; // Simulé aujourd'hui à J8

                  return (
                    <div 
                      key={i} 
                      style={{ width: `${COLUMN_WIDTH}px` }}
                      className={`h-full border-r border-jira-border/60 flex flex-col justify-center items-center text-[10px] ${
                        isToday ? 'bg-blue-500/10 text-blue-400 font-bold border-b-2 border-blue-500' : isWeekend ? 'bg-slate-950/40 text-slate-600' : 'text-slate-400'
                      }`}
                    >
                      <span className="uppercase text-[9px] text-slate-500">J{dayNum}</span>
                      <span>{isToday ? 'Auj.' : `Août ${dayNum}`}</span>
                    </div>
                  );
                })}
              </div>

              {/* Gantt Rows & Draggable Bars */}
              <div className="flex-1 relative" style={{ width: `${TOTAL_DAYS * COLUMN_WIDTH}px` }}>
                
                {/* Visual Background Grid Lines */}
                <div className="absolute inset-0 flex pointer-events-none">
                  {Array.from({ length: TOTAL_DAYS }).map((_, i) => {
                    const isWeekend = (i + 1) % 7 === 6 || (i + 1) % 7 === 0;
                    return (
                      <div 
                        key={i} 
                        style={{ width: `${COLUMN_WIDTH}px` }} 
                        className={`h-full border-r border-jira-border/30 ${isWeekend ? 'bg-slate-950/20' : ''}`}
                      />
                    );
                  })}
                </div>

                {/* Task Bars List */}
                <div className="relative">
                  {tasks.map(task => {
                    const isSelected = task.id === selectedTaskId;
                    const isDraggingThis = dragState && dragState.taskId === task.id;

                    const displayStartDay = isDraggingThis ? dragPreview.startDay : task.startDay;
                    const displayDuration = isDraggingThis ? dragPreview.duration : task.duration;

                    const completedSubs = task.subtasks.filter(s => s.done).length;
                    const totalSubs = task.subtasks.length;
                    const pct = totalSubs ? Math.round((completedSubs / totalSubs) * 100) : 0;

                    return (
                      <div key={task.id} className="h-16 border-b border-jira-border/40 relative flex items-center px-1">
                        
                        {/* Interactive Task Block */}
                        <div
                          style={{
                            left: `${(displayStartDay - 1) * COLUMN_WIDTH}px`,
                            width: `${displayDuration * COLUMN_WIDTH}px`
                          }}
                          onMouseDown={(e) => handleMouseDown(e, task.id, 'move')}
                          onClick={() => setSelectedTaskId(task.id)}
                          className={`absolute h-10 rounded-lg bg-gradient-to-r ${task.color} shadow-lg cursor-grab active:cursor-grabbing flex items-center justify-between group border border-white/20 transition-shadow select-none ${
                            isSelected ? 'ring-2 ring-blue-400 ring-offset-2 ring-offset-jira-bg' : 'hover:brightness-110'
                          }`}
                        >
                          {/* Left Resize Handle */}
                          <div 
                            onMouseDown={(e) => handleMouseDown(e, task.id, 'resize-left')}
                            className="absolute left-0 top-0 bottom-0 w-2.5 cursor-ew-resize bg-white/20 opacity-0 group-hover:opacity-100 rounded-l-lg hover:bg-white/60 transition"
                            title="Étirer / Rétrécir le début"
                          />

                          {/* Content Label */}
                          <div className="truncate px-3 pointer-events-none flex items-center justify-between w-full">
                            <span className="text-xs font-bold text-white truncate">{task.title}</span>
                            <span className="text-[10px] text-white/90 font-mono ml-2 bg-black/20 px-1.5 py-0.5 rounded">
                              {pct}%
                            </span>
                          </div>

                          {/* Right Resize Handle */}
                          <div 
                            onMouseDown={(e) => handleMouseDown(e, task.id, 'resize-right')}
                            className="absolute right-0 top-0 bottom-0 w-2.5 cursor-ew-resize bg-white/20 opacity-0 group-hover:opacity-100 rounded-r-lg hover:bg-white/60 transition"
                            title="Étirer / Rétrécir la fin"
                          />

                          {/* Live Dragging Precision Tooltip */}
                          {isDraggingThis && (
                            <div className="absolute -top-9 left-1/2 -translate-x-1/2 bg-slate-900 text-slate-100 border border-blue-500 text-[10px] font-mono px-2.5 py-1 rounded-md shadow-xl whitespace-nowrap z-30">
                              J{displayStartDay} → J{displayStartDay + displayDuration - 1} ({displayDuration} jours)
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

            {/* Right Drawer Panel : Task Inspector & Subtasks Creator */}
            {selectedTask && (
              <div className="w-80 border-l border-jira-border bg-jira-card p-5 flex flex-col justify-between shrink-0 overflow-y-auto">
                <div>
                  <div className="flex items-center justify-between mb-4">
                    <span className="text-xs font-semibold px-2.5 py-1 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20">
                      {selectedTask.category}
                    </span>
                    <button 
                      onClick={() => deleteTask(selectedTask.id)}
                      className="text-xs text-rose-400 hover:text-rose-300 transition"
                      title="Supprimer la tâche"
                    >
                      Supprimer
                    </button>
                  </div>

                  <h2 className="text-base font-bold text-slate-100 mb-2">{selectedTask.title}</h2>
                  
                  <div className="grid grid-cols-2 gap-2 text-xs text-slate-400 bg-jira-bg p-3 rounded-xl border border-jira-border mb-6">
                    <div>
                      <span className="block text-[10px] text-slate-500 uppercase">Début</span>
                      <span className="font-semibold text-slate-200">Jour {selectedTask.startDay}</span>
                    </div>
                    <div>
                      <span className="block text-[10px] text-slate-500 uppercase">Durée</span>
                      <span className="font-semibold text-slate-200">{selectedTask.duration} jours</span>
                    </div>
                    <div className="col-span-2 mt-1">
                      <span className="block text-[10px] text-slate-500 uppercase">Assigné à</span>
                      <span className="font-semibold text-slate-200">{selectedTask.assignee}</span>
                    </div>
                  </div>

                  {/* Section Sous-tâches */}
                  <div>
                    <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">
                      Sous-tâches ({selectedTask.subtasks.filter(s => s.done).length}/{selectedTask.subtasks.length})
                    </h3>

                    {/* Liste des sous-tâches */}
                    <div className="space-y-2 mb-4">
                      {selectedTask.subtasks.map(st => (
                        <label 
                          key={st.id} 
                          className="flex items-center gap-3 p-2.5 bg-jira-bg rounded-xl border border-jira-border/80 cursor-pointer hover:border-slate-700 transition"
                        >
                          <input 
                            type="checkbox" 
                            checked={st.done}
                            onChange={() => toggleSubtask(selectedTask.id, st.id)}
                            className="rounded accent-blue-600 w-4 h-4 cursor-pointer"
                          />
                          <span className={`text-xs ${st.done ? 'line-through text-slate-500' : 'text-slate-200'}`}>
                            {st.title}
                          </span>
                        </label>
                      ))}
                    </div>

                    {/* Formulaire ajout sous-tâche */}
                    <form onSubmit={handleAddSubtask} className="flex gap-2">
                      <input 
                        type="text" 
                        placeholder="+ Nouvelle sous-tâche..." 
                        value={newSubtaskTitle}
                        onChange={e => setNewSubtaskTitle(e.target.value)}
                        className="flex-1 bg-jira-bg text-xs px-3 py-2 rounded-xl border border-jira-border text-slate-200 focus:outline-none focus:border-blue-500"
                      />
                      <button 
                        type="submit"
                        className="px-3 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-xl transition"
                      >
                        Ajouter
                      </button>
                    </form>
                  </div>
                </div>
              </div>
            )}
          </div>

          {/* Modal de création de tâche */}
          {isCreateModalOpen && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-jira-card border border-jira-border rounded-2xl p-6 w-full max-w-md shadow-2xl">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-lg font-bold text-slate-100">Créer une nouvelle Tâche</h3>
                  <button onClick={() => setIsCreateModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={handleCreateTask} className="space-y-4">
                  <div>
                    <label className="block text-xs text-slate-400 mb-1 font-medium">Titre de la tâche</label>
                    <input 
                      type="text" required placeholder="ex: Refonte API REST V2"
                      value={newTaskForm.title}
                      onChange={e => setNewTaskForm({...newTaskForm, title: e.target.value})}
                      className="w-full bg-jira-bg text-xs p-3 rounded-xl border border-jira-border text-slate-200 focus:outline-none focus:border-blue-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs text-slate-400 mb-1 font-medium">Catégorie</label>
                      <input 
                        type="text" placeholder="ex: Tech, UI"
                        value={newTaskForm.category}
                        onChange={e => setNewTaskForm({...newTaskForm, category: e.target.value})}
                        className="w-full bg-jira-bg text-xs p-3 rounded-xl border border-jira-border text-slate-200 focus:outline-none focus:border-blue-500"
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-1 font-medium">Assigné à</label>
                      <input 
                        type="text" placeholder="ex: Julien K."
                        value={newTaskForm.assignee}
                        onChange={e => setNewTaskForm({...newTaskForm, assignee: e.target.value})}
                        className="w-full bg-jira-bg text-xs p-3 rounded-xl border border-jira-border text-slate-200 focus:outline-none focus:border-blue-500"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs text-slate-400 mb-1 font-medium">Jour de début (1-30)</label>
                      <input 
                        type="number" min="1" max="30" required
                        value={newTaskForm.startDay}
                        onChange={e => setNewTaskForm({...newTaskForm, startDay: e.target.value})}
                        className="w-full bg-jira-bg text-xs p-3 rounded-xl border border-jira-border text-slate-200 focus:outline-none focus:border-blue-500"
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-1 font-medium">Durée (jours)</label>
                      <input 
                        type="number" min="1" max="30" required
                        value={newTaskForm.duration}
                        onChange={e => setNewTaskForm({...newTaskForm, duration: e.target.value})}
                        className="w-full bg-jira-bg text-xs p-3 rounded-xl border border-jira-border text-slate-200 focus:outline-none focus:border-blue-500"
                      />
                    </div>
                  </div>

                  <div className="flex justify-end gap-3 pt-4 border-t border-jira-border">
                    <button 
                      type="button" onClick={() => setIsCreateModalOpen(false)}
                      className="px-4 py-2 bg-jira-bg hover:bg-slate-800 text-xs font-semibold rounded-xl border border-jira-border text-slate-300"
                    >
                      Annuler
                    </button>
                    <button 
                      type="submit"
                      className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-xs font-semibold rounded-xl text-white transition shadow-lg shadow-blue-600/20"
                    >
                      Créer la tâche
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<RoadmapApp />);
  </script>
</body>
</html>
