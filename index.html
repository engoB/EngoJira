<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jira Enterprise - Roadmap & Kanban</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            jira: {
              bg: '#0B0F19',
              card: '#151C2C',
              border: '#232D42',
              accent: '#3B82F6'
            }
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Yjs + y-webrtc (Collaboration temps réel P2P) -->
  <script src="https://cdn.jsdelivr.net/npm/yjs@13/dist/yjs.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/y-webrtc@10/dist/y-webrtc.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0B0F19; }
    ::-webkit-scrollbar-thumb { background: #232D42; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #3B82F6; }
  </style>
</head>
<body class="bg-jira-bg text-slate-100 font-sans antialiased min-h-screen overflow-hidden selection:bg-blue-500/30">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- HELPERS DATES & ENCODAGE ---
    const utf8_to_b64 = (str) => window.btoa(unescape(encodeURIComponent(str)));
    const b64_to_utf8 = (str) => decodeURIComponent(escape(window.atob(str)));

    const parseDate = (str) => new Date(str + 'T00:00:00');
    const formatDateIso = (d) => d.toISOString().split('T')[0];
    const addDays = (d, days) => { const r = new Date(d); r.setDate(r.getDate() + days); return r; };
    const diffDays = (d1, d2) => Math.round((d1 - d2) / (1000 * 60 * 60 * 24));

    const COLOR_OPTIONS = [
      { name: 'Bleu Jira', value: 'from-blue-600 to-indigo-600' },
      { name: 'Violet Cyber', value: 'from-purple-600 to-pink-600' },
      { name: 'Émeraude Tech', value: 'from-emerald-600 to-teal-600' },
      { name: 'Ambre Chaud', value: 'from-amber-500 to-orange-600' },
      { name: 'Rose Néon', value: 'from-rose-600 to-red-600' },
      { name: 'Cyan Futur', value: 'from-cyan-500 to-blue-500' }
    ];

    const TODAY_STR = formatDateIso(new Date());

    const INITIAL_TASKS = [
      {
        id: '1',
        title: 'Refonte Architecture Cloud & K8s',
        category: 'Infrastructure',
        status: 'IN_PROGRESS',
        assignee: 'Alexandre M.',
        startDate: TODAY_STR,
        duration: 12,
        color: 'from-blue-600 to-indigo-600',
        subtasks: [
          { id: '1-1', title: 'Provisionner clusters Terraform', done: true, assignee: 'Lucas R.', duration: 4 },
          { id: '1-2', title: 'Configuration Ingress Controller', done: false, assignee: 'Alexandre M.', duration: 5 }
        ]
      },
      {
        id: '2',
        title: 'Design System & Composants React',
        category: 'Frontend',
        status: 'TODO',
        assignee: 'Sophie T.',
        startDate: formatDateIso(addDays(new Date(), 3)),
        duration: 10,
        color: 'from-purple-600 to-pink-600',
        subtasks: [
          { id: '2-1', title: 'Tokens de couleurs & Figma', done: true, assignee: 'Sophie T.', duration: 3 },
          { id: '2-2', title: 'Composants Formulaires', done: false, assignee: 'Sophie T.', duration: 8 } // Provoque un warning volontaire (3+8 = 11 > 10)
        ]
      },
      {
        id: '3',
        title: 'Optimisation API & Cache Redis',
        category: 'Backend',
        status: 'IN_REVIEW',
        assignee: 'Thomas L.',
        startDate: formatDateIso(addDays(new Date(), -4)),
        duration: 8,
        color: 'from-emerald-600 to-teal-600',
        subtasks: [
          { id: '3-1', title: 'Mise en place Redis Cache', done: true, assignee: 'Thomas L.', duration: 3 }
        ]
      }
    ];

    function RoadmapApp() {
      // 1. États Généraux
      const [tasks, setTasks] = useState(() => {
        const saved = localStorage.getItem('jira_enterprise_tasks');
        return saved ? JSON.parse(saved) : INITIAL_TASKS;
      });

      const [activeTab, setActiveTab] = useState('roadmap'); // 'roadmap' | 'kanban'
      const [selectedTaskId, setSelectedTaskId] = useState('1');
      const [columnWidth, setColumnWidth] = useState(48); // Pixel width par jour (Zoom)
      const [isCreateModalOpen, setIsCreateModalOpen] = useState(false);

      // États formulaire Sous-tâche dans le panneau
      const [newSubtask, setNewSubtask] = useState({ title: '', assignee: '', duration: 2 });

      // États Formulaire Nouvelle Tâche
      const [newTaskForm, setNewTaskForm] = useState({
        title: '',
        category: 'Tech',
        status: 'TODO',
        assignee: 'Alexandre M.',
        startDate: TODAY_STR,
        duration: 7,
        color: 'from-blue-600 to-indigo-600'
      });

      // Drag / Resize
      const [dragState, setDragState] = useState(null);
      const [dragPreview, setDragPreview] = useState(null);

      // Configuration GitHub API & WebRTC
      const [ghConfig, setGhConfig] = useState(() => {
        const saved = localStorage.getItem('gh_config');
        return saved ? JSON.parse(saved) : { owner: '', repo: '', path: 'data.json', token: '' };
      });
      const [syncStatus, setSyncStatus] = useState('');
      const [connectedPeers, setConnectedPeers] = useState(1);
      const yDocRef = useRef(null);

      // Calcul de la plage de dates globale de la timeline
      const timelineStartDate = useMemo(() => {
        if (tasks.length === 0) return new Date();
        const dates = tasks.map(t => parseDate(t.startDate).getTime());
        const minDate = new Date(Math.min(...dates, new Date().getTime()));
        return addDays(minDate, -5); // Marge de 5 jours avant
      }, [tasks]);

      const TOTAL_TIMELINE_DAYS = 45;

      // Persistance
      useEffect(() => localStorage.setItem('jira_enterprise_tasks', JSON.stringify(tasks)), [tasks]);
      useEffect(() => localStorage.setItem('gh_config', JSON.stringify(ghConfig)), [ghConfig]);

      // WebRTC P2P Yjs Sync
      useEffect(() => {
        if (!window.Y || !window.YWebrtc) return;
        const ydoc = new window.Y.Doc();
        const provider = new window.YWebrtc.WebrtcProvider('jira-enterprise-room-2026', ydoc);
        const yTasks = ydoc.getArray('tasks');

        yTasks.observe(() => {
          const remote = yTasks.toArray();
          if (remote.length > 0) setTasks(remote);
        });

        provider.on('peers', (e) => setConnectedPeers(e.webrtcPeers.length + 1));
        yDocRef.current = { ydoc, yTasks, provider };

        return () => { provider.destroy(); ydoc.destroy(); };
      }, []);

      const broadcastTasks = (updated) => {
        setTasks(updated);
        if (yDocRef.current && yDocRef.current.yTasks) {
          const { ydoc, yTasks } = yDocRef.current;
          ydoc.transact(() => {
            yTasks.delete(0, yTasks.length);
            yTasks.insert(0, updated);
          });
        }
      };

      // --- LOGIQUE DE WARNING DEPASSEMENT SOUS-TACHES ---
      const checkSubtaskOverflow = (task) => {
        if (!task.subtasks || task.subtasks.length === 0) return false;
        const totalSubDuration = task.subtasks.reduce((sum, st) => sum + Number(st.duration || 0), 0);
        return totalSubDuration > task.duration;
      };

      // --- DRAG & DROP / RESIZE ENGINE ---
      const handleMouseDown = (e, taskId, action) => {
        e.stopPropagation();
        e.preventDefault();
        const task = tasks.find(t => t.id === taskId);
        if (!task) return;

        setDragState({
          taskId,
          action,
          startX: e.clientX,
          initialStartDate: task.startDate,
          initialDuration: task.duration
        });

        setDragPreview({ taskId, startDate: task.startDate, duration: task.duration });
      };

      useEffect(() => {
        const handleMouseMove = (e) => {
          if (!dragState) return;
          const deltaX = e.clientX - dragState.startX;
          const dayDelta = Math.round(deltaX / columnWidth);

          let newStartDate = dragState.initialStartDate;
          let newDuration = dragState.initialDuration;

          if (dragState.action === 'move') {
            newStartDate = formatDateIso(addDays(parseDate(dragState.initialStartDate), dayDelta));
          } else if (dragState.action === 'resize-left') {
            const actualDays = Math.min(dayDelta, dragState.initialDuration - 1);
            newStartDate = formatDateIso(addDays(parseDate(dragState.initialStartDate), actualDays));
            newDuration = dragState.initialDuration - actualDays;
          } else if (dragState.action === 'resize-right') {
            newDuration = Math.max(1, dragState.initialDuration + dayDelta);
          }

          setDragPreview({ taskId: dragState.taskId, startDate: newStartDate, duration: newDuration });
        };

        const handleMouseUp = () => {
          if (dragState && dragPreview) {
            const updated = tasks.map(t => t.id === dragState.taskId ? { ...t, startDate: dragPreview.startDate, duration: dragPreview.duration } : t);
            broadcastTasks(updated);
          }
          setDragState(null);
          setDragPreview(null);
        };

        if (dragState) {
          window.addEventListener('mousemove', handleMouseMove);
          window.addEventListener('mouseup', handleMouseUp);
        }
        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseup', handleMouseUp);
        };
      }, [dragState, dragPreview, columnWidth, tasks]);

      // --- AJOUT DE TÂCHES / SOUS-TÂCHES ---
      const handleCreateTask = (e) => {
        e.preventDefault();
        if (!newTaskForm.title.trim()) return;

        const newTask = {
          id: Date.now().toString(),
          ...newTaskForm,
          duration: Number(newTaskForm.duration),
          subtasks: []
        };

        broadcastTasks([...tasks, newTask]);
        setSelectedTaskId(newTask.id);
        setIsCreateModalOpen(false);
      };

      const handleAddSubtask = (e) => {
        e.preventDefault();
        if (!newSubtask.title.trim() || !selectedTaskId) return;

        const updated = tasks.map(t => {
          if (t.id !== selectedTaskId) return t;
          return {
            ...t,
            subtasks: [
              ...t.subtasks,
              {
                id: `${t.id}-${Date.now()}`,
                title: newSubtask.title.trim(),
                assignee: newSubtask.assignee || t.assignee,
                duration: Number(newSubtask.duration) || 1,
                done: false
              }
            ]
          };
        });

        broadcastTasks(updated);
        setNewSubtask({ title: '', assignee: '', duration: 2 });
      };

      const toggleSubtask = (taskId, subtaskId) => {
        const updated = tasks.map(t => {
          if (t.id !== taskId) return t;
          return {
            ...t,
            subtasks: t.subtasks.map(st => st.id === subtaskId ? { ...st, done: !st.done } : st)
          };
        });
        broadcastTasks(updated);
      };

      const updateTaskStatus = (taskId, newStatus) => {
        const updated = tasks.map(t => t.id === taskId ? { ...t, status: newStatus } : t);
        broadcastTasks(updated);
      };

      const deleteTask = (taskId) => {
        if (confirm("Supprimer cette tâche ?")) {
          const updated = tasks.filter(t => t.id !== taskId);
          broadcastTasks(updated);
          if (selectedTaskId === taskId) setSelectedTaskId(updated[0]?.id || null);
        }
      };

      // Fit All (Vue d'ensemble)
      const fitAllTasks = () => {
        const container = document.getElementById('gantt-container');
        if (!container) return;
        const newWidth = Math.max(20, Math.floor(container.clientWidth / TOTAL_TIMELINE_DAYS));
        setColumnWidth(newWidth);
      };

      // GitHub REST API Commit
      const saveToGitHub = async () => {
        if (!ghConfig.owner || !ghConfig.repo || !ghConfig.token) return alert("Remplissez Owner, Repo et Token");
        setSyncStatus('Commit...');
        try {
          const url = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${ghConfig.path}`;
          const headers = { 'Authorization': `token ${ghConfig.token}`, 'Accept': 'application/vnd.github.v3+json' };
          
          let currentSha = null;
          const getRes = await fetch(url, { headers });
          if (getRes.ok) currentSha = (await getRes.json()).sha;

          const putRes = await fetch(url, {
            method: 'PUT',
            headers: { ...headers, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: `Update Roadmap ${new Date().toLocaleString('fr-FR')}`,
              content: utf8_to_b64(JSON.stringify(tasks, null, 2)),
              ...(currentSha && { sha: currentSha })
            })
          });

          if (!putRes.ok) throw new Error();
          setSyncStatus('✅ Commité');
          setTimeout(() => setSyncStatus(''), 2500);
        } catch {
          setSyncStatus('❌ Erreur');
        }
      };

      const selectedTask = tasks.find(t => t.id === selectedTaskId);

      return (
        <div className="flex flex-col h-screen overflow-hidden">
          {/* Top Header Jira */}
          <header className="bg-jira-card border-b border-jira-border px-6 py-3 flex items-center justify-between shrink-0">
            <div className="flex items-center gap-6">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-black text-white text-lg">J</div>
                <h1 className="text-base font-bold text-slate-100">Jira Enterprise</h1>
              </div>

              {/* Navigation Onglets (Roadmap vs Kanban) */}
              <div className="flex bg-jira-bg p-1 rounded-xl border border-jira-border text-xs font-semibold">
                <button 
                  onClick={() => setActiveTab('roadmap')}
                  className={`px-4 py-1.5 rounded-lg transition ${activeTab === 'roadmap' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}`}
                >
                  📊 Roadmap Gantt
                </button>
                <button 
                  onClick={() => setActiveTab('kanban')}
                  className={`px-4 py-1.5 rounded-lg transition ${activeTab === 'kanban' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}`}
                >
                  📋 Tableau Kanban
                </button>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <div className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-jira-bg border border-jira-border text-xs text-emerald-400">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>{connectedPeers} P2P</span>
              </div>

              <button 
                onClick={() => setIsCreateModalOpen(true)}
                className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-xl transition shadow-lg shadow-blue-600/20"
              >
                + Créer Tâche
              </button>
            </div>
          </header>

          {/* Controls Bar : GitHub Config + Zoom */}
          <div className="bg-slate-900/90 border-b border-jira-border px-6 py-2 flex items-center justify-between text-xs text-slate-400 shrink-0">
            <div className="flex items-center gap-3">
              <span className="font-semibold text-slate-300">GitHub API:</span>
              <input type="text" placeholder="Owner" value={ghConfig.owner} onChange={e => setGhConfig({...ghConfig, owner: e.target.value})} className="bg-jira-bg px-2 py-1 rounded border border-jira-border w-20 text-slate-200" />
              <input type="text" placeholder="Repo" value={ghConfig.repo} onChange={e => setGhConfig({...ghConfig, repo: e.target.value})} className="bg-jira-bg px-2 py-1 rounded border border-jira-border w-24 text-slate-200" />
              <input type="password" placeholder="Token PAT" value={ghConfig.token} onChange={e => setGhConfig({...ghConfig, token: e.target.value})} className="bg-jira-bg px-2 py-1 rounded border border-jira-border w-32 text-slate-200" />
              <button onClick={saveToGitHub} className="px-3 py-1 bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 hover:bg-indigo-600/40 rounded transition font-medium">
                Commiter data.json
              </button>
              {syncStatus && <span className="font-medium text-blue-400">{syncStatus}</span>}
            </div>

            {/* Zoom Controls (Uniquement en mode Roadmap) */}
            {activeTab === 'roadmap' && (
              <div className="flex items-center gap-3">
                <span>Zoom:</span>
                <input 
                  type="range" min="24" max="90" value={columnWidth} 
                  onChange={e => setColumnWidth(Number(e.target.value))}
                  className="w-28 accent-blue-500 cursor-pointer"
                />
                <button 
                  onClick={fitAllTasks}
                  className="px-2.5 py-1 bg-jira-card hover:bg-slate-800 rounded border border-jira-border text-slate-300 transition"
                >
                  Vue d'ensemble
                </button>
              </div>
            )}
          </div>

          {/* MAIN CONTENT AREA */}
          <div className="flex-1 flex overflow-hidden">

            {/* VUE 1 : ROADMAP GANTT */}
            {activeTab === 'roadmap' && (
              <>
                {/* Left Task Hierarchy */}
                <div className="w-80 border-r border-jira-border bg-jira-card flex flex-col shrink-0">
                  <div className="h-12 border-b border-jira-border px-4 flex items-center justify-between text-xs font-bold text-slate-400 uppercase tracking-wider bg-slate-900/50">
                    <span>Tâches ({tasks.length})</span>
                    <span>Statut / Warning</span>
                  </div>

                  <div className="flex-1 overflow-y-auto divide-y divide-jira-border/50">
                    {tasks.map(task => {
                      const hasOverflow = checkSubtaskOverflow(task);
                      const isSelected = task.id === selectedTaskId;

                      return (
                        <div 
                          key={task.id}
                          onClick={() => setSelectedTaskId(task.id)}
                          className={`h-16 px-4 flex items-center justify-between cursor-pointer transition-colors ${
                            isSelected ? 'bg-blue-600/10 border-l-4 border-blue-500' : 'hover:bg-slate-800/40'
                          }`}
                        >
                          <div className="truncate pr-2">
                            <div className="flex items-center gap-2">
                              <span className={`w-2 h-2 rounded-full bg-gradient-to-r ${task.color}`}></span>
                              <span className="text-xs font-semibold text-slate-200 truncate">{task.title}</span>
                            </div>
                            <div className="text-[10px] text-slate-400 mt-1 flex items-center gap-2">
                              <span>{task.startDate}</span>
                              <span>•</span>
                              <span>{task.duration}j</span>
                            </div>
                          </div>

                          {hasOverflow && (
                            <span className="px-2 py-0.5 rounded bg-rose-500/20 text-rose-400 border border-rose-500/30 text-[10px] font-bold animate-pulse" title="Les sous-tâches dépassent la durée globale">
                              ⚠️ Dépassement
                            </span>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Right Interactive Gantt */}
                <div id="gantt-container" className="flex-1 flex flex-col overflow-x-auto bg-jira-bg relative">
                  
                  {/* Calendar Days Header */}
                  <div className="h-12 border-b border-jira-border flex items-center shrink-0 bg-slate-900/60 sticky top-0 z-10" style={{ width: `${TOTAL_TIMELINE_DAYS * columnWidth}px` }}>
                    {Array.from({ length: TOTAL_TIMELINE_DAYS }).map((_, i) => {
                      const dayDate = addDays(timelineStartDate, i);
                      const dayStr = formatDateIso(dayDate);
                      const isToday = dayStr === TODAY_STR;
                      const isWeekend = dayDate.getDay() === 0 || dayDate.getDay() === 6;

                      return (
                        <div 
                          key={i}
                          style={{ width: `${columnWidth}px` }}
                          className={`h-full border-r border-jira-border/60 flex flex-col justify-center items-center text-[10px] ${
                            isToday ? 'bg-blue-500/10 text-blue-400 font-bold border-b-2 border-blue-500' : isWeekend ? 'bg-slate-950/40 text-slate-600' : 'text-slate-400'
                          }`}
                        >
                          <span className="uppercase text-[9px] text-slate-500">
                            {dayDate.toLocaleDateString('fr-FR', { weekday: 'narrow' })}
                          </span>
                          <span>{dayDate.getDate()}/{dayDate.getMonth() + 1}</span>
                        </div>
                      );
                    })}
                  </div>

                  {/* Gantt Bars & Grid */}
                  <div className="flex-1 relative" style={{ width: `${TOTAL_TIMELINE_DAYS * columnWidth}px` }}>
                    {/* Background Day Columns */}
                    <div className="absolute inset-0 flex pointer-events-none">
                      {Array.from({ length: TOTAL_TIMELINE_DAYS }).map((_, i) => (
                        <div key={i} style={{ width: `${columnWidth}px` }} className="h-full border-r border-jira-border/20" />
                      ))}
                    </div>

                    {/* Task Rows */}
                    <div className="relative">
                      {tasks.map(task => {
                        const isDraggingThis = dragState && dragState.taskId === task.id;
                        const displayStartDate = isDraggingThis ? dragPreview.startDate : task.startDate;
                        const displayDuration = isDraggingThis ? dragPreview.duration : task.duration;

                        const offsetDays = diffDays(parseDate(displayStartDate), timelineStartDate);
                        const isSelected = task.id === selectedTaskId;
                        const endDateStr = formatDateIso(addDays(parseDate(displayStartDate), displayDuration - 1));

                        return (
                          <div key={task.id} className="h-16 border-b border-jira-border/40 relative flex items-center">
                            
                            <div
                              style={{
                                left: `${offsetDays * columnWidth}px`,
                                width: `${displayDuration * columnWidth}px`
                              }}
                              onMouseDown={(e) => handleMouseDown(e, task.id, 'move')}
                              onClick={() => setSelectedTaskId(task.id)}
                              className={`absolute h-10 rounded-lg bg-gradient-to-r ${task.color} shadow-lg cursor-grab active:cursor-grabbing flex items-center justify-between group border border-white/20 select-none ${
                                isSelected ? 'ring-2 ring-blue-400 ring-offset-2 ring-offset-jira-bg' : ''
                              }`}
                            >
                              <div onMouseDown={(e) => handleMouseDown(e, task.id, 'resize-left')} className="absolute left-0 top-0 bottom-0 w-3 cursor-ew-resize bg-white/20 opacity-0 group-hover:opacity-100 rounded-l-lg hover:bg-white/50" />
                              
                              <div className="truncate px-3 pointer-events-none flex items-center justify-between w-full">
                                <span className="text-xs font-bold text-white truncate">{task.title}</span>
                                <span className="text-[10px] text-white/90 font-mono ml-2 bg-black/30 px-1.5 py-0.5 rounded">
                                  {displayDuration}j
                                </span>
                              </div>

                              <div onMouseDown={(e) => handleMouseDown(e, task.id, 'resize-right')} className="absolute right-0 top-0 bottom-0 w-3 cursor-ew-resize bg-white/20 opacity-0 group-hover:opacity-100 rounded-r-lg hover:bg-white/50" />

                              {/* Tooltip dynamique en direct */}
                              {isDraggingThis && (
                                <div className="absolute -top-10 left-1/2 -translate-x-1/2 bg-slate-900 border border-blue-500 text-slate-100 text-[10px] font-mono px-3 py-1 rounded-lg shadow-2xl z-30 whitespace-nowrap">
                                  📅 {displayStartDate} → {endDateStr} ({displayDuration} jours)
                                </div>
                              )}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              </>
            )}

            {/* VUE 2 : TABLEAU KANBAN */}
            {activeTab === 'kanban' && (
              <div className="flex-1 p-6 bg-jira-bg overflow-x-auto">
                <div className="grid grid-cols-4 gap-6 min-w-[1000px] h-full">
                  {[
                    { id: 'TODO', title: 'À faire', color: 'border-slate-600' },
                    { id: 'IN_PROGRESS', title: 'En cours', color: 'border-blue-500' },
                    { id: 'IN_REVIEW', title: 'En revue', color: 'border-purple-500' },
                    { id: 'DONE', title: 'Terminé', color: 'border-emerald-500' }
                  ].map(col => {
                    const colTasks = tasks.filter(t => t.status === col.id);

                    return (
                      <div key={col.id} className="bg-jira-card border border-jira-border rounded-2xl p-4 flex flex-col h-full">
                        <div className={`flex items-center justify-between border-b-2 ${col.color} pb-3 mb-4`}>
                          <h3 className="font-bold text-sm text-slate-200">{col.title}</h3>
                          <span className="text-xs font-mono bg-jira-bg border border-jira-border px-2 py-0.5 rounded-full text-slate-400">
                            {colTasks.length}
                          </span>
                        </div>

                        <div className="flex-1 overflow-y-auto space-y-3 pr-1">
                          {colTasks.map(task => {
                            const hasOverflow = checkSubtaskOverflow(task);

                            return (
                              <div 
                                key={task.id}
                                className="bg-jira-bg border border-jira-border/80 hover:border-slate-600 p-4 rounded-xl shadow-lg transition flex flex-col justify-between gap-3"
                              >
                                <div>
                                  <div className="flex items-center justify-between mb-2">
                                    <span className="text-[10px] font-semibold px-2 py-0.5 rounded bg-blue-500/10 text-blue-400 border border-blue-500/20">
                                      {task.category}
                                    </span>
                                    {hasOverflow && <span className="text-[10px] text-rose-400 font-bold">⚠️ Warning</span>}
                                  </div>
                                  <h4 className="text-xs font-bold text-slate-100 mb-1">{task.title}</h4>
                                  <p className="text-[10px] text-slate-400">📅 {task.startDate} ({task.duration}j)</p>
                                </div>

                                <div className="flex items-center justify-between pt-2 border-t border-jira-border/50 text-[10px] text-slate-400">
                                  <span>👤 {task.assignee}</span>
                                  {/* Select de changement de statut rapide */}
                                  <select 
                                    value={task.status}
                                    onChange={e => updateTaskStatus(task.id, e.target.value)}
                                    className="bg-jira-card border border-jira-border text-[10px] rounded px-1.5 py-0.5 text-slate-200"
                                  >
                                    <option value="TODO">À faire</option>
                                    <option value="IN_PROGRESS">En cours</option>
                                    <option value="IN_REVIEW">En revue</option>
                                    <option value="DONE">Terminé</option>
                                  </select>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* PANNEAU INSPECTEUR ET GESTION DES SOUS-TÂCHES (À Droite) */}
            {selectedTask && (
              <div className="w-80 border-l border-jira-border bg-jira-card p-5 flex flex-col justify-between shrink-0 overflow-y-auto">
                <div>
                  <div className="flex items-center justify-between mb-4">
                    <span className="text-xs font-semibold px-2.5 py-1 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20">
                      {selectedTask.category}
                    </span>
                    <button onClick={() => deleteTask(selectedTask.id)} className="text-xs text-rose-400 hover:text-rose-300">
                      Supprimer
                    </button>
                  </div>

                  <h2 className="text-sm font-bold text-slate-100 mb-4">{selectedTask.title}</h2>

                  {/* Warning Box si dépassement */}
                  {checkSubtaskOverflow(selectedTask) && (
                    <div className="mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs">
                      ⚠️ <strong>Attention :</strong> La somme des durées des sous-tâches ({selectedTask.subtasks.reduce((s, st) => s + Number(st.duration || 0), 0)}j) dépasse la durée totale de la tâche ({selectedTask.duration}j).
                    </div>
                  )}

                  {/* Édition rapide dates & couleur */}
                  <div className="space-y-3 bg-jira-bg p-3 rounded-xl border border-jira-border mb-6 text-xs">
                    <div>
                      <label className="block text-[10px] text-slate-400 uppercase mb-1">Date de début</label>
                      <input 
                        type="date" 
                        value={selectedTask.startDate}
                        onChange={e => {
                          const updated = tasks.map(t => t.id === selectedTask.id ? { ...t, startDate: e.target.value } : t);
                          broadcastTasks(updated);
                        }}
                        className="w-full bg-jira-card border border-jira-border rounded p-1.5 text-slate-200"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-[10px] text-slate-400 uppercase mb-1">Durée (jours)</label>
                        <input 
                          type="number" min="1"
                          value={selectedTask.duration}
                          onChange={e => {
                            const updated = tasks.map(t => t.id === selectedTask.id ? { ...t, duration: Number(e.target.value) } : t);
                            broadcastTasks(updated);
                          }}
                          className="w-full bg-jira-card border border-jira-border rounded p-1.5 text-slate-200"
                        />
                      </div>
                      <div>
                        <label className="block text-[10px] text-slate-400 uppercase mb-1">Couleur</label>
                        <select 
                          value={selectedTask.color}
                          onChange={e => {
                            const updated = tasks.map(t => t.id === selectedTask.id ? { ...t, color: e.target.value } : t);
                            broadcastTasks(updated);
                          }}
                          className="w-full bg-jira-card border border-jira-border rounded p-1.5 text-slate-200"
                        >
                          {COLOR_OPTIONS.map(c => <option key={c.value} value={c.value}>{c.name}</option>)}
                        </select>
                      </div>
                    </div>
                  </div>

                  {/* Liste & Formulaire des Sous-tâches */}
                  <div>
                    <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">
                      Sous-tâches & Durées
                    </h3>

                    <div className="space-y-2 mb-4">
                      {selectedTask.subtasks.map(st => (
                        <div key={st.id} className="p-2.5 bg-jira-bg rounded-xl border border-jira-border flex items-center justify-between text-xs">
                          <label className="flex items-center gap-2 cursor-pointer flex-1 truncate pr-2">
                            <input 
                              type="checkbox" checked={st.done} 
                              onChange={() => toggleSubtask(selectedTask.id, st.id)}
                              className="accent-blue-600 rounded"
                            />
                            <span className={st.done ? 'line-through text-slate-500' : 'text-slate-200'}>{st.title}</span>
                          </label>
                          <span className="text-[10px] font-mono text-slate-400 bg-jira-card px-2 py-0.5 rounded border border-jira-border">
                            👤 {st.assignee} ({st.duration}j)
                          </span>
                        </div>
                      ))}
                    </div>

                    {/* Formulaire Sous-tâche complète */}
                    <form onSubmit={handleAddSubtask} className="space-y-2 bg-jira-bg p-3 rounded-xl border border-jira-border">
                      <input 
                        type="text" placeholder="Titre sous-tâche..." required
                        value={newSubtask.title}
                        onChange={e => setNewSubtask({...newSubtask, title: e.target.value})}
                        className="w-full bg-jira-card text-xs p-2 rounded border border-jira-border text-slate-200"
                      />
                      <div className="grid grid-cols-2 gap-2">
                        <input 
                          type="text" placeholder="Assigné à"
                          value={newSubtask.assignee}
                          onChange={e => setNewSubtask({...newSubtask, assignee: e.target.value})}
                          className="bg-jira-card text-xs p-2 rounded border border-jira-border text-slate-200"
                        />
                        <input 
                          type="number" min="1" placeholder="Durée (j)"
                          value={newSubtask.duration}
                          onChange={e => setNewSubtask({...newSubtask, duration: e.target.value})}
                          className="bg-jira-card text-xs p-2 rounded border border-jira-border text-slate-200"
                        />
                      </div>
                      <button type="submit" className="w-full py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded transition">
                        + Ajouter sous-tâche
                      </button>
                    </form>
                  </div>
                </div>
              </div>
            )}
          </div>

          {/* Modal Création de Tâche */}
          {isCreateModalOpen && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-jira-card border border-jira-border rounded-2xl p-6 w-full max-w-md shadow-2xl">
                <h3 className="text-lg font-bold text-slate-100 mb-4">Créer une Tâche</h3>
                <form onSubmit={handleCreateTask} className="space-y-4">
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Titre</label>
                    <input type="text" required value={newTaskForm.title} onChange={e => setNewTaskForm({...newTaskForm, title: e.target.value})} className="w-full bg-jira-bg text-xs p-3 rounded-xl border border-jira-border text-slate-200" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Date de début</label>
                      <input type="date" required value={newTaskForm.startDate} onChange={e => setNewTaskForm({...newTaskForm, startDate: e.target.value})} className="w-full bg-jira-bg text-xs p-3 rounded-xl border border-jira-border text-slate-200" />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Durée (jours)</label>
                      <input type="number" min="1" required value={newTaskForm.duration} onChange={e => setNewTaskForm({...newTaskForm, duration: e.target.value})} className="w-full bg-jira-bg text-xs p-3 rounded-xl border border-jira-border text-slate-200" />
                    </div>
                  </div>
                  <div className="flex justify-end gap-3 pt-4 border-t border-jira-border">
                    <button type="button" onClick={() => setIsCreateModalOpen(false)} className="px-4 py-2 bg-jira-bg text-xs text-slate-300 rounded-xl">Annuler</button>
                    <button type="submit" className="px-4 py-2 bg-blue-600 text-xs font-semibold rounded-xl text-white">Créer</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<RoadmapApp />);
  </script>
</body>
</html>
