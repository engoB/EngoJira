<script type="text/babel" data-presets="react">
/* =========================================================================
   AuraPlan Studio — fichier unique (React 18 + Babel + Tailwind)
   Vues : Roadmap (projet › tâche › sous-tâche), Kanban, Planning 0,5 j, Notes
   ========================================================================= */
const { useState, useEffect, useRef, useMemo, useCallback } = React;

const STORAGE_KEY = 'auraplan_data_v21';
const GH_KEY = 'auraplan_gh_v21';
const PREFS_KEY = 'auraplan_prefs_v21';

const DEFAULT_COLOR = 'from-indigo-500 to-violet-600';
const STATUSES = ['TODO', 'IN_PROGRESS', 'IN_REVIEW', 'DONE'];
const PRIORITIES = ['LOW', 'MEDIUM', 'HIGH', 'URGENT'];

const STATUS_META = {
  TODO: { label: 'À faire', dot: 'bg-slate-400', bar: 'bg-slate-500', tint: 'bg-slate-500/10 border-slate-500/30 text-slate-300' },
  IN_PROGRESS: { label: 'En cours', dot: 'bg-indigo-400', bar: 'bg-indigo-500', tint: 'bg-indigo-500/10 border-indigo-500/30 text-indigo-300' },
  IN_REVIEW: { label: 'En revue', dot: 'bg-fuchsia-400', bar: 'bg-fuchsia-500', tint: 'bg-fuchsia-500/10 border-fuchsia-500/30 text-fuchsia-300' },
  DONE: { label: 'Terminé', dot: 'bg-emerald-400', bar: 'bg-emerald-500', tint: 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300' }
};

const PRIORITY_META = {
  LOW: { label: 'Basse', cls: 'text-sky-300 bg-sky-500/10 border-sky-500/30', icon: '↓' },
  MEDIUM: { label: 'Moyenne', cls: 'text-amber-300 bg-amber-500/10 border-amber-500/30', icon: '=' },
  HIGH: { label: 'Haute', cls: 'text-orange-300 bg-orange-500/10 border-orange-500/30', icon: '↑' },
  URGENT: { label: 'Urgente', cls: 'text-rose-300 bg-rose-500/10 border-rose-500/30', icon: '⇈' }
};

const COLOR_OPTIONS = [
  { name: 'Indigo', value: 'from-indigo-500 to-violet-600' },
  { name: 'Violet', value: 'from-purple-500 to-fuchsia-600' },
  { name: 'Émeraude', value: 'from-emerald-500 to-teal-600' },
  { name: 'Ambre', value: 'from-amber-500 to-orange-600' },
  { name: 'Rose', value: 'from-rose-500 to-pink-600' },
  { name: 'Cyan', value: 'from-cyan-500 to-blue-600' },
  { name: 'Ardoise', value: 'from-slate-500 to-slate-700' }
];

const NOTE_COLORS = [
  { name: 'Indigo', value: 'indigo', bar: 'bg-indigo-500' },
  { name: 'Émeraude', value: 'emerald', bar: 'bg-emerald-500' },
  { name: 'Ambre', value: 'amber', bar: 'bg-amber-500' },
  { name: 'Rose', value: 'rose', bar: 'bg-rose-500' },
  { name: 'Cyan', value: 'cyan', bar: 'bg-cyan-500' }
];
const noteBar = (v) => (NOTE_COLORS.find((c) => c.value === v) || NOTE_COLORS[0]).bar;

const MONTHS_FR = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];

const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
const uid = (p) => p + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);

const parseDate = (str) => { const d = new Date(String(str) + 'T00:00:00'); return isNaN(d.getTime()) ? new Date() : d; };
const formatDateIso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (d, n) => { const r = new Date(d.getTime()); r.setDate(r.getDate() + n); return r; };
const diffDays = (a, b) => Math.round((a.getTime() - b.getTime()) / 86400000);
const TODAY_STR = formatDateIso(new Date());
const formatDateFr = (iso) => parseDate(iso).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
const formatDayShort = (iso) => parseDate(iso).toLocaleDateString('fr-FR', { weekday: 'short', day: '2-digit', month: 'short' });

const getMonday = (d) => { const x = new Date(d.getTime()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); x.setHours(0, 0, 0, 0); return x; };
const getWeekNumber = (d) => {
  const date = new Date(d.getTime());
  date.setHours(0, 0, 0, 0);
  date.setDate(date.getDate() + 3 - ((date.getDay() + 6) % 7));
  const week1 = new Date(date.getFullYear(), 0, 4);
  return 1 + Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
};

// Fin incluse : une tâche d'un jour commence et finit le même jour.
const endFromDuration = (startIso, duration) => formatDateIso(addDays(parseDate(startIso), Math.max(0, Math.ceil(Number(duration) || 1) - 1)));
const durationFromEnd = (startIso, endIso, step) => {
  const d = diffDays(parseDate(endIso), parseDate(startIso)) + 1;
  return Math.max(step || 1, d);
};

const isIsoDate = (s) => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(new Date(s + 'T00:00:00').getTime());
const safeDate = (s) => (isIsoDate(s) ? s : TODAY_STR);
const safeNum = (v, fallback, min, step) => {
  const n = Number(v);
  if (!Number.isFinite(n) || n < min) return fallback;
  return step ? Math.round(n / step) * step : n;
};
const safeText = (v, fallback) => { const s = typeof v === 'string' ? v.trim() : ''; return s ? s.slice(0, 200) : fallback; };
const rawText = (v, max) => (typeof v === 'string' ? v.slice(0, max || 400) : '');

const triggerConfetti = () => {
  try { if (typeof window.confetti === 'function') window.confetti({ particleCount: 160, spread: 95, origin: { y: 0.6 }, disableForReducedMotion: true }); }
  catch (e) { /* no-op */ }
};

const initials = (name) => String(name || '?').split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();

// Couleurs proposées pour identifier chacun d'un coup d'œil.
const COULEURS_MEMBRE = [
  { valeur: 'indigo', classe: 'bg-indigo-600' },
  { valeur: 'violet', classe: 'bg-violet-600' },
  { valeur: 'fuchsia', classe: 'bg-fuchsia-600' },
  { valeur: 'rose', classe: 'bg-rose-600' },
  { valeur: 'amber', classe: 'bg-amber-600' },
  { valeur: 'emerald', classe: 'bg-emerald-600' },
  { valeur: 'teal', classe: 'bg-teal-600' },
  { valeur: 'cyan', classe: 'bg-cyan-600' },
  { valeur: 'slate', classe: 'bg-slate-600' }
];
const classeCouleur = (v) => (COULEURS_MEMBRE.find((c) => c.valeur === v) || COULEURS_MEMBRE[0]).classe;

// Couleurs retenues pour l'équipe, tenues à jour par l'application.
const PALETTE_EQUIPE = {};

const avatarColor = (name) => {
  const choisie = PALETTE_EQUIPE[String(name || '').toLowerCase()];
  if (choisie) return classeCouleur(choisie);
  let h = 0; const s = String(name || '');
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return COULEURS_MEMBRE[h % COULEURS_MEMBRE.length].classe;
};

const b64encode = (str) => {
  try { return window.btoa(String.fromCharCode.apply(null, Array.from(new TextEncoder().encode(str)))); }
  catch (e) { return window.btoa(unescape(encodeURIComponent(str))); }
};
const b64decode = (str) => {
  try {
    const bin = window.atob(String(str).replace(/\s/g, ''));
    return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
  } catch (e) { return ''; }
};

/* ------------------------ Normalisation défensive ------------------------ */
const normalizeSubtask = (s, fallbackDate) => {
  const o = s && typeof s === 'object' ? s : {};
  return {
    id: o.id ? String(o.id) : uid('st'),
    title: safeText(o.title, 'Sous-tâche'),
    assignee: safeText(o.assignee, 'Non assigné'),
    status: STATUSES.includes(o.status) ? o.status : 'TODO',
    startDate: safeDate(o.startDate || fallbackDate),
    duration: safeNum(o.duration, 1, 0.5, 0.5),
    notes: rawText(o.notes, 2000)
  };
};

const normalizeCommentaire = (c) => {
  const o = c && typeof c === 'object' ? c : {};
  return {
    id: o.id ? String(o.id) : uid('c'),
    auteur: safeText(o.auteur, 'Quelqu’un'),
    texte: rawText(o.texte, 4000),
    date: typeof o.date === 'string' ? o.date : new Date().toISOString()
  };
};

const normalizeEvenement = (e) => {
  const o = e && typeof e === 'object' ? e : {};
  return {
    id: o.id ? String(o.id) : uid('a'),
    auteur: safeText(o.auteur, 'Quelqu’un'),
    texte: safeText(o.texte, 'a modifié la tâche'),
    date: typeof o.date === 'string' ? o.date : new Date().toISOString()
  };
};

const normalizeTask = (t, index) => {
  const o = t && typeof t === 'object' ? t : {};
  const startDate = safeDate(o.startDate);
  return {
    ref: typeof o.ref === 'string' && /^[A-Z]+-\d+$/.test(o.ref) ? o.ref : '',
    commentaires: Array.isArray(o.commentaires) ? o.commentaires.slice(-100).map(normalizeCommentaire) : [],
    journal: Array.isArray(o.journal) ? o.journal.slice(-30).map(normalizeEvenement) : [],
    bloquePar: Array.isArray(o.bloquePar) ? o.bloquePar.filter((x) => typeof x === 'string').slice(0, 10) : [],
    id: o.id ? String(o.id) : uid('t'),
    title: safeText(o.title, 'Tâche sans titre'),
    assignee: safeText(o.assignee, 'Non assigné'),
    startDate,
    duration: safeNum(o.duration, 1, 0.5, 0.5),
    status: STATUSES.includes(o.status) ? o.status : 'TODO',
    priority: PRIORITIES.includes(o.priority) ? o.priority : 'MEDIUM',
    rank: Number.isFinite(Number(o.rank)) ? Number(o.rank) : (index || 0),
    notes: rawText(o.notes, 4000),
    subtasks: Array.isArray(o.subtasks) ? o.subtasks.map((s) => normalizeSubtask(s, startDate)) : []
  };
};

const normalizeProject = (p) => {
  const o = p && typeof p === 'object' ? p : {};
  return {
    id: o.id ? String(o.id) : uid('proj'),
    title: safeText(o.title, 'Projet sans titre'),
    category: safeText(o.category, 'Général'),
    startDate: safeDate(o.startDate),
    duration: safeNum(o.duration, 10, 1, 1),
    color: typeof o.color === 'string' && o.color.startsWith('from-') ? o.color : DEFAULT_COLOR,
    tasks: Array.isArray(o.tasks) ? o.tasks.map(normalizeTask) : []
  };
};

const normalizeEntry = (e) => {
  const o = e && typeof e === 'object' ? e : {};
  return {
    id: o.id ? String(o.id) : uid('pe'),
    title: safeText(o.title, 'Entrée'),
    tag: safeText(o.tag, 'Général'),
    color: typeof o.color === 'string' && o.color.startsWith('from-') ? o.color : DEFAULT_COLOR,
    assignee: safeText(o.assignee, 'Non assigné'),
    startDate: safeDate(o.startDate),
    slot: o.slot === 'PM' ? 'PM' : 'AM',
    duration: safeNum(o.duration, 0.5, 0.5, 0.5),
    notes: rawText(o.notes, 2000)
  };
};

const normalizeNote = (n) => {
  const o = n && typeof n === 'object' ? n : {};
  return {
    id: o.id ? String(o.id) : uid('note'),
    title: rawText(o.title, 160),
    body: rawText(o.body, 40000),
    color: NOTE_COLORS.some((c) => c.value === o.color) ? o.color : 'indigo',
    projectId: o.projectId ? String(o.projectId) : '',
    pinned: !!o.pinned,
    updatedAt: typeof o.updatedAt === 'string' ? o.updatedAt : new Date().toISOString()
  };
};

const normalizeMembre = (m, index) => {
  const o = m && typeof m === 'object' ? m : { nom: m };
  const couleur = COULEURS_MEMBRE.some((c) => c.valeur === o.couleur)
    ? o.couleur
    : COULEURS_MEMBRE[(index || 0) % COULEURS_MEMBRE.length].valeur;
  return {
    id: o.id ? String(o.id) : uid('m'),
    nom: safeText(o.nom, 'Sans nom'),
    role: safeText(o.role, ''),
    couleur
  };
};

const normalizeEquipe = (raw) => {
  const liste = Array.isArray(raw) ? raw.map((m, i) => normalizeMembre(m, i)) : [];
  const vus = new Set();
  return liste.filter((m) => { const k = m.nom.toLowerCase(); if (vus.has(k)) return false; vus.add(k); return true; });
};

const normalizeColumnLabels = (raw) => {
  const o = raw && typeof raw === 'object' ? raw : {};
  const out = {};
  STATUSES.forEach((s) => { out[s] = safeText(o[s], STATUS_META[s].label); });
  return out;
};

const DEFAULT_EVENT = { date: formatDateIso(addDays(new Date(), 90)), label: 'Échéance' };

// Identité du tableau : tout ce qui était figé devient un réglage.
const DEFAULT_BOARD = { titre: 'Mon tableau', prefixe: 'TSK' };

const normalizeBoard = (raw) => {
  const o = raw && typeof raw === 'object' ? raw : {};
  const prefixe = String(o.prefixe || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 6);
  return { titre: safeText(o.titre, DEFAULT_BOARD.titre), prefixe: prefixe || DEFAULT_BOARD.prefixe };
};

const normalizeEvent = (raw) => {
  const o = raw && typeof raw === 'object' ? raw : {};
  return {
    date: isIsoDate(o.date) ? o.date : DEFAULT_EVENT.date,
    label: safeText(o.label, DEFAULT_EVENT.label),
    actif: o.actif !== false
  };
};

// Référence courte et stable : TSK-1, TSK-2… le préfixe est celui du tableau.
const attribuerReferences = (projects, prefixe) => {
  const p = prefixe || DEFAULT_BOARD.prefixe;
  const motif = new RegExp('^' + p + '-(\\d+)$');
  let max = 0;
  projects.forEach((pr) => pr.tasks.forEach((t) => {
    const m = motif.exec(t.ref || '');
    if (m) max = Math.max(max, Number(m[1]));
  }));
  projects.forEach((pr) => pr.tasks.forEach((t) => { if (!t.ref || !motif.test(t.ref)) { max += 1; t.ref = p + '-' + max; } }));
  return projects;
};

const normalizeData = (raw) => {
  const o = raw && typeof raw === 'object' ? raw : {};
  const board = normalizeBoard(o.board);
  return {
    board,
    equipe: normalizeEquipe(o.equipe),
    columnLabels: normalizeColumnLabels(o.columnLabels),
    event: normalizeEvent(o.event),
    projects: attribuerReferences(Array.isArray(o.projects) ? o.projects.map(normalizeProject) : [], board.prefixe),
    planning: Array.isArray(o.planning) ? o.planning.map(normalizeEntry)
      : Array.isArray(o.planningEntries) ? o.planningEntries.map(normalizeEntry) : [],
    notes: Array.isArray(o.notes) ? o.notes.map(normalizeNote) : []
  };
};

/* ------------------------ Tableau de démarrage ------------------------ */
// Tableau de départ, volontairement neutre : il montre chaque fonction
// et se remplace par le vôtre au fur et à mesure.
const jour = (n) => formatDateIso(addDays(new Date(), n));

const SEED_RAW = {
  board: { titre: 'Mon tableau', prefixe: 'TSK' },
  equipe: [
    { id: 'm-moi', nom: 'Moi', role: '' },
    { id: 'm-camille', nom: 'Camille', role: 'exemple — renommez ou retirez' }
  ],
  event: { date: jour(90), label: 'Échéance', actif: true },
  projects: [
    {
      id: 'demo-prise-en-main', title: 'Prise en main', category: 'Découverte',
      startDate: jour(0), duration: 21, color: 'from-indigo-500 to-violet-600',
      tasks: [
        { id: 'demo-t1', title: 'Faites glisser cette barre à la souris', assignee: 'Moi',
          startDate: jour(0), duration: 5, status: 'IN_PROGRESS', priority: 'MEDIUM',
          notes: 'Attrapez ses bords pour changer la durée. Le clic maintenu sur la grille fait défiler le temps.',
          subtasks: [] },
        { id: 'demo-t2', title: 'Dépliez-moi avec le bouton +', assignee: 'Moi',
          startDate: jour(3), duration: 8, status: 'TODO', priority: 'HIGH',
          notes: 'Une tâche peut contenir autant de sous-tâches que nécessaire.',
          subtasks: [
            { id: 'demo-t2-s1', title: 'Voici une sous-tâche', assignee: 'Moi', status: 'DONE', startDate: jour(3), duration: 2 },
            { id: 'demo-t2-s2', title: 'Cochez-la pour la valider', assignee: 'Moi', status: 'TODO', startDate: jour(5), duration: 3 },
            { id: 'demo-t2-s3', title: "L'avancement du projet suit tout seul", assignee: 'Camille', status: 'TODO', startDate: jour(8), duration: 3 }
          ] },
        { id: 'demo-t3', title: 'Ouvrez-moi pour découvrir les échanges', assignee: 'Camille',
          startDate: jour(8), duration: 6, status: 'TODO', priority: 'LOW',
          notes: 'Chaque tâche a une référence courte, un fil de discussion et un historique.',
          subtasks: [] }
      ]
    },
    {
      id: 'demo-projet', title: 'Projet exemple', category: 'Exemple',
      startDate: jour(7), duration: 60, color: 'from-emerald-500 to-teal-600',
      tasks: [
        { id: 'demo-p1', title: 'Cadrage', assignee: 'Moi', startDate: jour(7), duration: 14,
          status: 'IN_PROGRESS', priority: 'HIGH', notes: '',
          subtasks: [
            { id: 'demo-p1-s1', title: 'Définir le besoin', assignee: 'Moi', status: 'DONE', startDate: jour(7), duration: 5 },
            { id: 'demo-p1-s2', title: 'Chiffrer', assignee: 'Camille', status: 'IN_PROGRESS', startDate: jour(12), duration: 9 }
          ] },
        { id: 'demo-p2', title: 'Réalisation', assignee: 'Camille', startDate: jour(21), duration: 28,
          status: 'TODO', priority: 'MEDIUM', notes: '', bloquePar: ['demo-p1'],
          subtasks: [
            { id: 'demo-p2-s1', title: 'Première étape', assignee: 'Camille', status: 'TODO', startDate: jour(21), duration: 14 },
            { id: 'demo-p2-s2', title: 'Seconde étape', assignee: 'Moi', status: 'TODO', startDate: jour(35), duration: 14 }
          ] },
        { id: 'demo-p3', title: 'Recette et livraison', assignee: 'Moi', startDate: jour(49), duration: 18,
          status: 'TODO', priority: 'URGENT', notes: '', bloquePar: ['demo-p2'],

const SEED = normalizeData(SEED_RAW);

const loadJson = (key, fallback) => {
  try {
    const raw = window.localStorage.getItem(key);
    if (!raw) return fallback;
    const parsed = JSON.parse(raw);
    return parsed && typeof parsed === 'object' ? parsed : fallback;
  } catch (e) {
    try { window.localStorage.removeItem(key); } catch (e2) { /* no-op */ }
    return fallback;
  }
};
const saveJson = (key, value) => { try { window.localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; } };

// Un tableau vide mais valide : le nom, l'équipe et les colonnes sont conservés.
const tableauVide = (base) => normalizeData({
  board: (base && base.board) || undefined,
  equipe: (base && base.equipe) || undefined,
  columnLabels: (base && base.columnLabels) || undefined,
  event: (base && base.event) || undefined,
  projects: [], planning: [], notes: []
});

const loadData = () => {
  const stored = loadJson(STORAGE_KEY, null);
  if (!stored) return SEED;
  const clean = normalizeData(stored);
  if (clean.projects.length === 0 && clean.planning.length === 0 && clean.notes.length === 0) return SEED;
  return clean;
};

/* ------------------------- Partage via GitHub -------------------------
   Le tableau est un fichier chiffré déposé dans votre dépôt. Chaque appareil
   le relit régulièrement et y réécrit ses modifications. Rien d'autre.
   -------------------------------------------------------------------- */
// Le chiffrement du navigateur n'existe qu'en https (ou sur localhost).
const pageSecurisee = () => {
  try {
    if (window.isSecureContext) return true;
    const h = window.location.hostname;
    return h === 'localhost' || h === '127.0.0.1';
  } catch (e) { return false; }
};

const SYNC_KEY = 'auraplan_sync_v22';
const PASS_KEY = 'auraplan_pass_v22';
const FICHIER = 'tableau.json';

// Les données vivent sur leur propre branche : la branche du site n'est jamais
// touchée, donc GitHub Pages ne reconstruit pas le site à chaque enregistrement.
const BRANCHE_DONNEES = 'auraplan-donnees';

// Un enregistrement = un commit. On regroupe donc les modifications rapprochées
// au lieu d'écrire à chaque frappe.
const DELAI_ENVOI = 2500;        // on laisse retomber la salve
const INTERVALLE_MINI = 20000;   // et jamais plus d'un commit toutes les 20 s

// Le dépôt se déduit de l'adresse : https://compte.github.io/tableau/ -> compte / tableau
const detecterDepot = () => {
  try {
    const hote = String(window.location.hostname || '');
    const m = /^([^.]+)\.github\.io$/i.exec(hote);
    if (!m) return { owner: '', repo: '' };
    const segments = String(window.location.pathname || '').split('/').filter(Boolean);
    return { owner: m[1], repo: segments.length ? segments[0] : m[1] + '.github.io' };
  } catch (e) { return { owner: '', repo: '' }; }
};

const idAppareil = () => {
  try {
    let v = window.localStorage.getItem('auraplan_appareil');
    if (!v) { v = Math.random().toString(36).slice(2, 10); window.localStorage.setItem('auraplan_appareil', v); }
    return v;
  } catch (e) { return 'appareil'; }
};

const subtle = () => {
  const c = (typeof window !== 'undefined' && window.crypto) || (typeof globalThis !== 'undefined' && globalThis.crypto);
  return c && c.subtle ? c.subtle : null;
};
const alea = (n) => {
  const c = (typeof window !== 'undefined' && window.crypto) || globalThis.crypto;
  const out = new Uint8Array(n); c.getRandomValues(out); return out;
};
const versBase64 = (bytes) => {
  let bin = ''; const pas = 0x8000;
  for (let i = 0; i < bytes.length; i += pas) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + pas));
  return window.btoa(bin);
};
const depuisBase64 = (str) => Uint8Array.from(window.atob(String(str).replace(/\s/g, '')), (c) => c.charCodeAt(0));

const deriverCle = async (motDePasse, sel) => {
  const sub = subtle();
  if (!sub) throw new Error('chiffrement indisponible (page non sécurisée ?)');
  const base = await sub.importKey('raw', new TextEncoder().encode(String(motDePasse)), 'PBKDF2', false, ['deriveKey']);
  return sub.deriveKey({ name: 'PBKDF2', salt: new TextEncoder().encode('auraplan:' + sel), iterations: 60000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
};
// Le texte est compressé avant d'être chiffré : le fichier déposé est
// bien plus léger, ce qui allège d'autant l'historique du dépôt.
const traverserFlux = async (flux, octets) => {
  const ecrivain = flux.writable.getWriter();
  ecrivain.write(octets);
  ecrivain.close();
  const lecteur = flux.readable.getReader();
  const morceaux = []; let total = 0;
  for (;;) {
    const { done, value } = await lecteur.read();
    if (done) break;
    morceaux.push(value); total += value.length;
  }
  const sortie = new Uint8Array(total);
  let position = 0;
  morceaux.forEach((m) => { sortie.set(m, position); position += m.length; });
  return sortie;
};

const compresser = async (texte) => {
  const octets = new TextEncoder().encode(texte);
  const CS = (typeof window !== 'undefined' && window.CompressionStream) || (typeof globalThis !== 'undefined' && globalThis.CompressionStream);
  if (typeof CS !== 'function') return { octets, compresse: false };
  try { return { octets: await traverserFlux(new CS('gzip'), octets), compresse: true }; }
  catch (e) { return { octets, compresse: false }; }
};

const decompresser = async (octets, compresse) => {
  if (!compresse) return new TextDecoder().decode(octets);
  const DS = (typeof window !== 'undefined' && window.DecompressionStream) || (typeof globalThis !== 'undefined' && globalThis.DecompressionStream);
  return new TextDecoder().decode(await traverserFlux(new DS('gzip'), octets));
};

const chiffrerTexte = async (cle, texte) => {
  const { octets, compresse } = await compresser(texte);
  const iv = alea(12);
  const ct = new Uint8Array(await subtle().encrypt({ name: 'AES-GCM', iv }, cle, octets));
  const out = new Uint8Array(12 + ct.length); out.set(iv, 0); out.set(ct, 12);
  return { charge: versBase64(out), compresse };
};

const dechiffrerTexte = async (cle, b64, compresse) => {
  const brut = depuisBase64(b64);
  const clair = await subtle().decrypt({ name: 'AES-GCM', iv: brut.subarray(0, 12) }, cle, brut.subarray(12));
  return decompresser(new Uint8Array(clair), !!compresse);
};

const COLLECTIONS = ['projects', 'planning', 'notes'];

// Représentation fichier : chaque fiche est une entrée repérée par son identifiant,
// ce qui permet de fusionner deux versions sans rien écraser à l'aveugle.
const versFichier = (data) => {
  const out = { meta: { board: data.board, equipe: data.equipe, columnLabels: data.columnLabels, event: data.event } };
  COLLECTIONS.forEach((c) => {
    const m = {};
    (data[c] || []).forEach((item, i) => { m[item.id] = { ...item, __ordre: i }; });
    out[c] = m;
  });
  return out;
};

const depuisFichier = (brut) => {
  const o = brut && typeof brut === 'object' ? brut : {};
  const meta = o.meta || {};
  const out = { board: meta.board, equipe: meta.equipe, columnLabels: meta.columnLabels, event: meta.event };
  COLLECTIONS.forEach((c) => {
    const liste = [];
    Object.keys(o[c] || {}).forEach((id) => { if (o[c][id]) liste.push(o[c][id]); });
    liste.sort((a, b) => (a.__ordre || 0) - (b.__ordre || 0));
    out[c] = liste.map((x) => { const y = { ...x }; delete y.__ordre; return y; });
  });
  return normalizeData(out);
};

// Fusion : pour chaque fiche, la version la plus récemment modifiée gagne ;
// une suppression ne revient pas si elle est postérieure à la dernière retouche.
const fusionner = (local, distant) => {
  const res = { contenu: { meta: null }, majs: { meta: 0 }, supprimes: {}, presence: {} };
  const lm = (local && local.majs) || {}; const dm = (distant && distant.majs) || {};
  const lc = (local && local.contenu) || {}; const dc = (distant && distant.contenu) || {};
  const ls = (local && local.supprimes) || {}; const ds = (distant && distant.supprimes) || {};

  res.contenu.meta = (dm.meta || 0) >= (lm.meta || 0) ? (dc.meta || lc.meta) : (lc.meta || dc.meta);
  res.majs.meta = Math.max(lm.meta || 0, dm.meta || 0);

  COLLECTIONS.forEach((c) => {
    res.contenu[c] = {}; res.majs[c] = {}; res.supprimes[c] = {};
    const suppr = {};
    Object.keys(ls[c] || {}).forEach((id) => { suppr[id] = Math.max(suppr[id] || 0, ls[c][id]); });
    Object.keys(ds[c] || {}).forEach((id) => { suppr[id] = Math.max(suppr[id] || 0, ds[c][id]); });
    res.supprimes[c] = suppr;

    const ids = new Set(Object.keys(lc[c] || {}).concat(Object.keys(dc[c] || {})));
    ids.forEach((id) => {
      const tl = (lm[c] && lm[c][id]) || 0;
      const td = (dm[c] && dm[c][id]) || 0;
      const gagnant = td >= tl ? ((dc[c] || {})[id] || (lc[c] || {})[id]) : ((lc[c] || {})[id] || (dc[c] || {})[id]);
      const quand = Math.max(tl, td);
      if (!gagnant) return;
      if (suppr[id] && suppr[id] >= quand) return;      // supprimée après sa dernière retouche
      res.contenu[c][id] = gagnant;
      res.majs[c][id] = quand;
    });
  });

  const pl = (local && local.presence) || {}; const pd = (distant && distant.presence) || {};
  Object.keys(pl).concat(Object.keys(pd)).forEach((id) => {
    const a = pl[id] || {}; const b = pd[id] || {};
    res.presence[id] = (b.vu || 0) > (a.vu || 0) ? b : a;
  });
  return res;
};

function ChoixMembre({ valeur, membres, onChange, onGerer, T, inputCls }) {
  const [libre, setLibre] = React.useState(false);
  const connu = membres.includes(valeur);
  if (libre || (!connu && valeur && valeur !== 'Non assigné')) {
    return (
      <div className="flex gap-1.5">
        <input className={inputCls} autoFocus={libre} value={valeur} onChange={(e) => onChange(e.target.value)} placeholder="Nom" />
        <button type="button" className={`shrink-0 rounded-xl border px-2 text-[11px] font-bold ${T.border} ${T.hover} ${T.muted}`}
          title="Revenir à la liste" onClick={() => { setLibre(false); onChange(membres[0] || 'Non assigné'); }}>Liste</button>
      </div>
    );
  }
  return (
    <div className="flex items-center gap-1.5">
      <select className={inputCls} value={connu ? valeur : 'Non assigné'}
        onChange={(e) => {
          if (e.target.value === '__AUTRE__') { setLibre(true); onChange(''); return; }

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error('AuraPlan — erreur de rendu :', error, info); }
  render() {
    if (this.state.error) {
      return (
        <div className="mx-auto mt-24 max-w-xl rounded-2xl border border-rose-500/40 bg-slate-900 p-8 text-slate-100">
          <h1 className="mb-2 text-lg font-extrabold">L'affichage s'est interrompu</h1>
          <p className="mb-4 text-sm text-slate-400">Une donnée locale est probablement corrompue. Réinitialisez le stockage pour repartir d'une base saine.</p>
          <pre className="mb-4 max-h-40 overflow-auto rounded-lg bg-black/40 p-3 text-[11px] text-rose-300">{String(this.state.error && this.state.error.message)}</pre>
          <button className="rounded-xl bg-indigo-600 px-4 py-2 text-xs font-bold text-white"
            onClick={() => { try { window.localStorage.removeItem(STORAGE_KEY); } catch (e) { /* no-op */ } window.location.reload(); }}>
            Réinitialiser et recharger
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

function AuraPlanApp() {
  const prefs = useRef(loadJson(PREFS_KEY, {})).current;

  const [isDark, setIsDark] = useState(prefs.isDark !== false);
  const [activeTab, setActiveTab] = useState(['roadmap', 'kanban', 'planning', 'notes'].includes(prefs.tab) ? prefs.tab : 'roadmap');
  const [columnWidth, setColumnWidth] = useState(clamp(Number(prefs.columnWidth) || 110, 1.5, 240));
  const [grouperPar, setGrouperPar] = useState(() => (prefs.grouperPar === 'assignee' || prefs.grouperPar === 'priority' ? prefs.grouperPar : 'status'));

  const [data, setData] = useState(loadData);
  const dataRef = useRef(data);
  const undoStack = useRef([]);

  const projects = data.projects;
  const planning = data.planning;
  const notes = data.notes;
  const columnLabels = data.columnLabels;
  const event = data.event;
  const daysToEvent = diffDays(parseDate(event.date), parseDate(TODAY_STR));
  const statusLabel = useCallback((s) => (columnLabels && columnLabels[s]) || STATUS_META[s].label, [columnLabels]);

  const [toasts, setToasts] = useState([]);
  const pushToast = useCallback((message, tone) => {
    const id = uid('toast');
    setToasts((prev) => [...prev.slice(-3), { id, message, tone: tone || 'info' }]);
    window.setTimeout(() => setToasts((prev) => prev.filter((t) => t.id !== id)), 4200);
  }, []);
  const dismissToast = useCallback((id) => setToasts((prev) => prev.filter((t) => t.id !== id)), []);

  const commit = useCallback((mutator, label) => {
    const prev = dataRef.current;
    const next = normalizeData(typeof mutator === 'function' ? mutator(prev) : mutator);
    undoStack.current.push(prev);
    if (undoStack.current.length > 60) undoStack.current.shift();
    dataRef.current = next;
    setData(next);
    if (label) pushToast(label, 'success');
    return next;
  }, [pushToast]);

  // Écriture sans point d'annulation (frappe au clavier dans les notes)
  const applyQuiet = useCallback((mutator) => {
    const prev = dataRef.current;
    const next = normalizeData(typeof mutator === 'function' ? mutator(prev) : mutator);
    dataRef.current = next;
    setData(next);
  }, []);

  const undo = useCallback(() => {
    const prev = undoStack.current.pop();
    if (!prev) { pushToast('Rien à annuler', 'info'); return; }
    dataRef.current = prev; setData(prev);
    pushToast('Dernière action annulée', 'info');
  }, [pushToast]);

  useEffect(() => { dataRef.current = data; saveJson(STORAGE_KEY, data); }, [data]);
  useEffect(() => { saveJson(PREFS_KEY, { isDark, tab: activeTab, columnWidth }); }, [isDark, activeTab, columnWidth]);
  useEffect(() => { document.body.classList.toggle('theme-light', !isDark); }, [isDark]);

  /* ------------------------------- Nuances ------------------------------- */
  const T = useMemo(() => (isDark ? {
    app: 'bg-[#05080F] text-slate-100',
    rail: 'bg-[#0A1019]',
    panel: 'bg-[#0E1626] border-[#1C2740]',
    raise: 'bg-[#141F35] border-[#26334F]',
    inset: 'bg-black/25',
    border: 'border-[#1C2740]',
    grid: 'border-slate-700/25',
    muted: 'text-slate-400',
    faint: 'text-slate-500',
    input: 'bg-[#0A1220] border-[#28344F] text-slate-100 placeholder-slate-500',
    hover: 'hover:bg-white/5'
  } : {
    app: 'bg-[#EEF1F6] text-slate-900',
    rail: 'bg-white',
    panel: 'bg-white border-slate-200',

    let maxEnd = parseDate(p.startDate);
    p.tasks.forEach((t) => {
      const e = addDays(parseDate(t.startDate), t.duration);
      if (e > maxEnd) maxEnd = e;
      t.subtasks.forEach((s) => { const se = addDays(parseDate(s.startDate), s.duration); if (se > maxEnd) maxEnd = se; });
    });
    const delta = diffDays(maxEnd, end);
    if (delta > 0) return { tone: 'danger', label: `Dépassement de ${delta} j` };
    if (delta < 0) return { tone: 'success', label: `${Math.abs(delta)} j de marge` };

  const { timelineStart, totalDays } = useMemo(() => {
    let min = parseDate(TODAY_STR);

    const consider = (startIso, duration) => {
      const s = parseDate(startIso);
      const e = addDays(s, Math.ceil(duration));
      if (s < min) min = s;
      if (e > max) max = e;
    };
    if (activeTab === 'planning') planning.forEach((e) => consider(e.startDate, e.duration));
    else projects.forEach((p) => {
      // On ne tient compte que des lignes visibles : replier un projet resserre la frise.
      consider(p.startDate, p.duration);
      if (!openProjects[p.id]) return;
      p.tasks.forEach((t) => {
        consider(t.startDate, t.duration);
        if (!openTasks[t.id]) return;
        t.subtasks.forEach((sb) => consider(sb.startDate, sb.duration));
      });
    });
    const ev = parseDate(event.date);
    if (activeTab !== 'planning') { if (ev < min) min = ev; if (ev > max) max = ev; }
    const start = getMonday(addDays(min, -3));
    return { timelineStart: start, totalDays: clamp(diffDays(addDays(max, 5), start), 28, 900) };
  }, [projects, planning, activeTab, event.date, openProjects, openTasks]);

  const timelineWeeks = useMemo(() => {
    const weeks = []; let current = null;
    for (let i = 0; i < totalDays; i++) {
      const d = addDays(timelineStart, i);
      const w = getWeekNumber(d);
      if (!current || current.weekNum !== w) { current = { weekNum: w, days: 0 }; weeks.push(current); }
      current.days++;
    }
    return weeks;
  }, [timelineStart, totalDays]);

  const timelineMonths = useMemo(() => {
    const months = []; let current = null; let key = '';
    for (let i = 0; i < totalDays; i++) {
      const d = addDays(timelineStart, i);
      const k = `${d.getFullYear()}-${d.getMonth()}`;
      if (k !== key) { key = k; current = { label: `${MONTHS_FR[d.getMonth()]} ${d.getFullYear()}`, days: 0 }; months.push(current); }
      current.days++;
    }
    return months;
  }, [timelineStart, totalDays]);

  const todayOffset = diffDays(parseDate(TODAY_STR), timelineStart);
  const eventOffset = diffDays(parseDate(event.date), timelineStart);

  /* ------------------------------ Planning ------------------------------ */
  const filteredPlanning = useMemo(() => {
    const q = search.trim().toLowerCase();
    return planning.filter((e) => {
      if (assigneeFilter !== 'ALL' && e.assignee !== assigneeFilter) return false;

      return (e.title + ' ' + e.tag + ' ' + e.assignee).toLowerCase().includes(q);
    });
  }, [planning, search, assigneeFilter]);

  const planningRows = useMemo(() => {
    const people = assigneeFilter === 'ALL' ? collaborators : collaborators.filter((c) => c === assigneeFilter);
    return people.map((person) => {
      const entries = filteredPlanning.filter((e) => e.assignee === person).map((e) => {
        const startHalf = diffDays(parseDate(e.startDate), timelineStart) * 2 + (e.slot === 'PM' ? 1 : 0);
        return { ...e, startHalf, lenHalf: Math.max(1, Math.round(e.duration * 2)) };
      }).sort((a, b) => a.startHalf - b.startHalf);

      const lanes = []; const load = new Map();
      entries.forEach((e) => {
        let lane = lanes.findIndex((freeAt) => freeAt <= e.startHalf);
        if (lane === -1) { lane = lanes.length; lanes.push(e.startHalf + e.lenHalf); } else lanes[lane] = e.startHalf + e.lenHalf;
        e.lane = lane;
        for (let h = e.startHalf; h < e.startHalf + e.lenHalf; h++) load.set(h, (load.get(h) || 0) + 1);
      });
      const laneCount = Math.max(1, lanes.length);
      const conflicts = [];
      load.forEach((n, half) => { if (n > 1) conflicts.push({ half }); });
      return { person, entries, laneCount, load, conflicts, workload: entries.reduce((s, e) => s + e.lenHalf, 0) / 2, height: Math.max(66, laneCount * 30 + 22) };
    });
  }, [filteredPlanning, collaborators, assigneeFilter, timelineStart]);

    });

  }, [filteredPlanning, timelineStart]);

  /* ------------------------------- Kanban ------------------------------- */
  const kanbanTasks = useMemo(() => {

    const next = commit((prev) => {
      let moved = null;

      if (!moved) return prev;

      const column = [];
      prev.projects.forEach((p) => p.tasks.forEach((t) => { if (t.status === status) column.push(t); }));
      column.sort((a, b) => a.rank - b.rank || a.title.localeCompare(b.title, 'fr'));

      const currentIndex = column.findIndex((t) => t.id === taskId);
      const without = column.filter((t) => t.id !== taskId);
      let target = clamp(Number.isFinite(index) ? index : without.length, 0, without.length);
      if (currentIndex !== -1 && currentIndex < target) target -= 1;
      without.splice(target, 0, moved);

    }
    e.preventDefault();

      const p = panRef.current;
      if (!p) return;
      p.lastX = event.clientX;
      p.lastY = event.clientY;
      if (frame) return;
      frame = window.requestAnimationFrame(() => {
        frame = null;
        const cur = panRef.current;
        if (!cur) return;
        const dx = cur.lastX - cur.x;
        const dy = cur.lastY - cur.y;
        if (Math.abs(dx) > 2 || Math.abs(dy) > 2) cur.moved = true;
        // Écriture directe dans le DOM : aucun rendu React pendant le geste.
        cur.el.scrollLeft = cur.left - dx;
        cur.el.scrollTop = cur.top - dy;
      });
    };
    const onUp = () => {
      if (frame) { window.cancelAnimationFrame(frame); frame = null; }
      panRef.current = null;
      setPanning(false);
      syncViewport();   // une seule mise à jour, à la fin du geste
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    return () => { window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); };
  }, [panning, syncViewport]);

  const fitAll = useCallback(() => {

      const dispo = vp.clientWidth - nameColRef.current - 4;

  /* --------------------- Glisser-déposer des barres --------------------- */
  const [drag, setDrag] = useState(null);
  const dragRef = useRef(null);
  const movedRef = useRef(false);
  const rafRef = useRef(null);
  const colWidthRef = useRef(columnWidth);
  const rowRefs = useRef({});
  const survolRefs = useRef({});
  useEffect(() => { colWidthRef.current = columnWidth; }, [columnWidth]);

  const updateDrag = useCallback((next) => { dragRef.current = next; setDrag(next); }, []);

  const startDrag = (e, payload) => {
    if (e.button !== 0) return;
    e.stopPropagation(); e.preventDefault();
    movedRef.current = false;
    updateDrag({ ...payload, startX: e.clientX, deltaX: 0, snapStart: payload.startUnits, snapLen: payload.lenUnits, targetPerson: payload.person || null });
  };

  const personAtY = (clientY) => {
    const map = rowRefs.current;
    const keys = Object.keys(map);
    for (let i = 0; i < keys.length; i++) {
      const el = map[keys[i]];
      if (!el || !el.getBoundingClientRect) continue;
      const r = el.getBoundingClientRect();
      if (r.height > 0 && clientY >= r.top && clientY <= r.bottom) return keys[i];
    }
    return null;
  };

  useEffect(() => {
    const onMove = (event) => {
      const d = dragRef.current;
      if (!d) return;
      const dx = event.clientX - d.startX;
      if (Math.abs(dx) > 3) movedRef.current = true;
      if (rafRef.current) window.cancelAnimationFrame(rafRef.current);
      rafRef.current = window.requestAnimationFrame(() => {
        const cur = dragRef.current;
        if (!cur) return;
        const unitPx = colWidthRef.current * cur.unit;
        const steps = Math.round(dx / unitPx);
        let snapStart = cur.startUnits;
        let snapLen = cur.lenUnits;
        if (cur.action === 'move') snapStart = Math.max(0, cur.startUnits + steps);
        else if (cur.action === 'resize-right') snapLen = Math.max(1, cur.lenUnits + steps);
        else if (cur.action === 'resize-left') {
          const shift = Math.min(steps, cur.lenUnits - 1);
          snapStart = Math.max(0, cur.startUnits + shift);
          snapLen = cur.lenUnits - (snapStart - cur.startUnits);
        }
        let targetPerson = cur.targetPerson;
        if (cur.kind === 'entry' && cur.action === 'move') {
          const hovered = personAtY(event.clientY);
          if (hovered) { targetPerson = hovered; if (hovered !== cur.person) movedRef.current = true; }
        }
        updateDrag({ ...cur, deltaX: dx, snapStart, snapLen, targetPerson });
      });
    };

    const onUp = () => {
      const d = dragRef.current;
      if (rafRef.current) window.cancelAnimationFrame(rafRef.current);
      updateDrag(null);
      if (!d || !movedRef.current) return;
      const personChanged = d.kind === 'entry' && d.targetPerson && d.targetPerson !== d.person;
      if (d.snapStart === d.startUnits && d.snapLen === d.lenUnits && !personChanged) return;

      if (d.kind === 'entry') {
        const startDate = formatDateIso(addDays(timelineStart, Math.floor(d.snapStart / 2)));
        const slot = d.snapStart % 2 === 1 ? 'PM' : 'AM';
        const duration = d.snapLen / 2;
        const assignee = d.targetPerson || d.person;

        commit((prev) => ({ ...prev, projects: prev.projects.map((p) => (p.id === d.id ? { ...p, startDate, duration: d.snapLen } : p)) }));
      } else if (d.kind === 'task') {
        const startDate = formatDateIso(addDays(timelineStart, d.snapStart));
        commit((prev) => ({ ...prev, projects: prev.projects.map((p) => ({ ...p, tasks: p.tasks.map((t) => (t.id === d.id ? { ...t, startDate, duration: d.snapLen } : t)) })) }));
      } else if (d.kind === 'subtask') {

          ...prev,

        }));
      }
    };

    window.addEventListener('mouseup', onUp);
    return () => {

  const [syncEtatBrut, setSyncEtatBrut] = useState({ etat: 'inactif', message: '', dernier: 0, participants: [], ecritures: 0, lectures: 0 });

  const supprRef = useRef(loadJson('auraplan_suppr_v22', { projects: {}, planning: {}, notes: {} }));
  const dernierFichier = useRef(null);           // { contenu, majs, supprimes, presence }
  const dernierDistant = useRef(null);           // dernière version connue du dépôt

  const peutEcrire = partageActif && !!sync.token;

  // À chaque changement local, on note l'heure de retouche de chaque fiche :
  // c'est ce qui permet de fusionner proprement avec la version du dépôt.
  useEffect(() => {
    const avant = dernierFichier.current ? dernierFichier.current.contenu : null;

    const maintenant = Date.now();
    if (avant && !appliqueDistant.current) {
      if (JSON.stringify(avant.meta) !== JSON.stringify(apres.meta)) majsRef.current.meta = maintenant;
      COLLECTIONS.forEach((c) => {
        Object.keys(apres[c]).forEach((id) => {
          if (JSON.stringify(avant[c][id]) !== JSON.stringify(apres[c][id])) {
            majsRef.current[c][id] = maintenant;

          }
        });
        Object.keys(avant[c]).forEach((id) => {
          if (!apres[c][id]) { supprRef.current[c][id] = maintenant; delete majsRef.current[c][id]; }
        });
      });
