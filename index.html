                          <div key={task.id} className={`flex items-center gap-2 rounded-xl border px-2.5 py-2 ${T.border} ${isDark ? 'bg-black/25' : 'bg-white'}`}>
                            <input type="checkbox" checked={task.status === 'DONE'} onChange={(e) => setTaskStatus(task.id, e.target.checked ? 'DONE' : 'IN_PROGRESS')} className="h-4 w-4 shrink-0 rounded accent-emerald-500" aria-label={`Valider ${task.title}`} />
                            <button type="button" onClick={() => setEditingTask({ ...task, projectId: selectedProject.id })} className="min-w-0 flex-1 text-left">
                              <div className={`truncate text-[11px] ${task.status === 'DONE' ? 'text-slate-500 line-through' : 'font-semibold'}`}>{task.title}</div>
                              <div className={`truncate text-[10px] ${T.faint}`}>{task.assignee} · {task.subtasks.length ? `${task.subtasks.filter((s) => s.status === 'DONE').length}/${task.subtasks.length} sous-tâches` : `${task.duration} j`}</div>
                            </button>
                            <span className={`shrink-0 rounded border px-1.5 py-0.5 text-[9px] font-bold ${PRIORITY_META[task.priority].cls}`}>{PRIORITY_META[task.priority].icon}</span>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="flex gap-2">
                      <button type="button" className={`flex-1 ${btnSecondary}`} onClick={() => setProjectForm({ ...selectedProject })}>Modifier</button>
                      <button type="button" className={`flex-1 ${btnDanger}`} onClick={() => deleteProject(selectedProject.id)}>Supprimer</button>
                    </div>
                    <button type="button" className={`w-full ${btnQuiet}`} onClick={() => createNote({ title: `Notes — ${selectedProject.title}`, projectId: selectedProject.id })}>Ouvrir un bloc-notes pour ce projet</button>
                  </div>
                ) : <p className={`text-xs ${T.faint}`}>Sélectionnez un projet.</p>}
              </aside>
            ) : null}
          </>
        ) : null}

        {/* ============================== KANBAN ============================== */}
        {activeTab === 'kanban' ? (
          <div className={`flex-1 overflow-auto p-5 ${isDark ? 'bg-[#05080F]' : 'bg-[#EEF1F6]'}`}>
            <div className="flex h-full gap-4" style={{ minWidth: `${colonnesKanban.length * 268}px` }}>
              {colonnesKanban.map((colonne) => {
                const colTasks = kanbanTasks.filter(colonne.filtre);
                const isOver = dropTarget && dropTarget.status === colonne.id;
                const repere = (i) => (isOver && dropTarget.index === i && draggingTaskId
                  ? <div key={`ph-${i}`} className="h-1.5 rounded-full bg-indigo-500 shadow-[0_0_12px_2px_rgba(99,102,241,.5)]" /> : null);
                const enAjout = ajoutRapide && ajoutRapide.colonne === colonne.id;
                return (
                  <section key={colonne.id}
                    onDragOver={(e) => handleColumnDragOver(e, colonne.id, colTasks.length)}

                    className={`flex h-full w-[258px] shrink-0 flex-col overflow-hidden rounded-2xl border transition ${T.panel} ${isOver ? 'border-indigo-500 ring-2 ring-indigo-500/25' : ''}`}>

                    <div className={`flex items-center justify-between gap-2 border-b px-3 py-2.5 ${T.border} ${T.inset}`}>
                      {editingColumn === colonne.id ? (
                        <input autoFocus value={columnDraft}
                          onChange={(e) => setColumnDraft(e.target.value)}
                          onBlur={() => saveColumnLabel(colonne.statut)}
                          onKeyDown={(e) => { if (e.key === 'Enter') saveColumnLabel(colonne.statut); if (e.key === 'Escape') setEditingColumn(null); }}
                          className={`min-w-0 flex-1 rounded-lg border px-2 py-1 text-xs font-extrabold outline-none focus:border-indigo-500 ${isDark ? 'bg-[#0A1220] border-[#28344F] text-slate-100' : 'bg-white border-slate-300 text-slate-900'}`} />
                      ) : (
                        <h3 className="flex min-w-0 items-center gap-2 text-xs font-extrabold">
                          {colonne.avatar ? <Avatar name={colonne.avatar} size="sm" /> : <span className={`h-2 w-2 shrink-0 rounded-full ${colonne.point || 'bg-slate-400'}`} />}
                          {colonne.statut ? (
                            <button type="button" title="Cliquez pour renommer la colonne"
                              onClick={() => { setColumnDraft(colonne.titre); setEditingColumn(colonne.id); }}
                              className="truncate rounded px-0.5 hover:text-indigo-400">{colonne.titre}</button>
                          ) : <span className="truncate">{colonne.titre}</span>}
                          <span className={`shrink-0 rounded-full px-2 py-0.5 font-mono text-[10px] ${T.raise} ${T.muted}`}>{colTasks.length}</span>
                        </h3>
                      )}
                      <button type="button" title={`Ajouter dans « ${colonne.titre} »`}
                        onClick={() => setAjoutRapide({ colonne: colonne.id, texte: '' })}

                    <div className={`h-1 ${colonne.barre}`} />

                      {colTasks.map((task, index) => {
                        const bloqueurs = (task.bloquePar || []).map((id) => allTasks.find((x) => x.id === id)).filter(Boolean);
                        const enAttente = bloqueurs.filter((b) => b.status !== 'DONE');
                        return (
                          <React.Fragment key={task.id}>
                            {repere(index)}
                            <article draggable
                              onDragStart={(e) => handleCardDragStart(e, task.id)}
                              onDragEnd={handleDragEnd}
                              onDragOver={(e) => handleCardDragOver(e, colonne.id, index)}
                              onClick={() => setEditingTask({ ...task, projectId: task.project.id })}
                              className={`cursor-grab rounded-xl border p-3 shadow-sm transition active:cursor-grabbing ${T.raise} hover:border-indigo-500/50 ${draggingTaskId === task.id ? 'opacity-40' : ''}`}>
                              <div className="mb-2 flex items-center justify-between gap-2">
                                <span className={`truncate rounded bg-gradient-to-r px-2 py-0.5 text-[9px] font-bold text-white ${task.project.color}`}>{task.project.title}</span>
                                <span className={`shrink-0 rounded border px-1.5 py-0.5 text-[9px] font-bold ${PRIORITY_META[task.priority].cls}`}>{PRIORITY_META[task.priority].icon}</span>
                              </div>
                              <h4 className="mb-2 text-xs font-bold leading-snug">{task.title}</h4>
                              {task.subtasks.length ? (
                                <div className={`mb-2 h-1.5 w-full overflow-hidden rounded-full ${T.inset}`}>
                                  <div className="h-full rounded-full bg-emerald-500" style={{ width: `${Math.round(taskProgress(task) * 100)}%` }} />
                                </div>
                              ) : null}
                              {enAttente.length ? (
                                <div className="mb-2 rounded-lg border border-amber-500/40 bg-amber-500/10 px-1.5 py-0.5 text-[9px] font-bold text-amber-300">
                                  En attente de {enAttente.map((b) => b.ref).join(', ')}
                                </div>
                              ) : null}
                              <div className={`flex items-center justify-between border-t pt-2 text-[10px] ${T.border} ${T.faint}`}>
                                <span className="flex items-center gap-1.5">
                                  <Avatar name={task.assignee} size="sm" />
                                  <span className="font-mono font-bold">{task.ref}</span>
                                </span>
                                <span className="flex items-center gap-2 font-mono">
                                  {(task.commentaires || []).length ? <span title="commentaires">{(task.commentaires || []).length} 💬</span> : null}
                                  {task.subtasks.length ? `${task.subtasks.filter((sb) => sb.status === 'DONE').length}/${task.subtasks.length}` : formatDayShort(task.startDate)}
                                </span>
                              </div>
                            </article>
                          </React.Fragment>
                        );
                      })}
                      {repere(colTasks.length)}

                      {enAjout ? (
                        <div className={`rounded-xl border p-2 ${T.border} ${T.raise}`}>

                            onChange={(e) => setAjoutRapide({ ...ajoutRapide, texte: e.target.value })}
                            onKeyDown={(e) => {
                              if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); creerDepuisColonne(colonne, ajoutRapide.texte); }
                              if (e.key === 'Escape') setAjoutRapide(null);

                            placeholder="Titre de la tâche, puis Entrée"
                            className={`w-full resize-none rounded-lg border px-2 py-1.5 text-xs outline-none focus:border-indigo-500 ${isDark ? 'bg-[#0A1220] border-[#28344F] text-slate-100' : 'bg-white border-slate-300 text-slate-900'}`} />
                          <div className="mt-1.5 flex items-center justify-between">
                            <span className={`text-[10px] ${T.faint}`}>Entrée pour ajouter · Échap pour fermer</span>
                            <button type="button" className="text-[11px] font-bold text-indigo-400" onClick={() => creerDepuisColonne(colonne, ajoutRapide.texte)}>Ajouter</button>
                          </div>
                        </div>
                      ) : (
                        <button type="button" onClick={() => setAjoutRapide({ colonne: colonne.id, texte: '' })}
                          className={`w-full rounded-xl border border-dashed py-2.5 text-center text-[11px] ${T.border} ${T.faint} hover:border-indigo-500/50 hover:text-indigo-400`}>
                          {isOver ? 'Déposez ici' : '+ Ajouter une tâche'}
                        </button>
                      )}
                    </div>
                  </section>
                );
              })}
            </div>
          </div>
        ) : null}

        {/* ============================== PLANNING ============================== */}
        {activeTab === 'planning' ? (
          <div id="timeline-viewport" onMouseDown={startPan} onScroll={onTimelineScroll}
            className={`flex-1 overflow-auto ${panning ? 'cursor-grabbing select-none' : ''} ${isDark ? 'bg-[#05080F]' : 'bg-[#EEF1F6]'}`}>
            <div style={{ width: `${timelineWidth + 240}px`, minWidth: '100%' }}>

              <div className={`sticky top-0 z-30 flex h-7 border-b ${T.rail} ${T.border}`}>
                <div style={{ width: '240px' }} className={`sticky left-0 z-40 flex items-center border-r px-4 text-[10px] font-bold uppercase tracking-wide ${T.rail} ${T.border} ${T.faint}`}>Semaines</div>
                <div className="flex">
                  {timelineWeeks.map((w, i) => (
                    <div key={i} style={{ width: `${w.days * columnWidth}px` }}
                      className={`flex h-full items-center justify-center border-r border-indigo-500/20 text-[10px] font-extrabold uppercase text-indigo-400 ${i % 2 === 0 ? 'bg-indigo-500/[0.07]' : ''}`}>
                      {w.days * columnWidth > 110 ? `Semaine ${w.weekNum}` : w.days * columnWidth > 24 ? `S${w.weekNum}` : ''}
                    </div>
                  ))}
                </div>
              </div>

              <div className={`sticky top-7 z-30 flex h-12 border-b ${T.rail} ${T.border}`}>
                <div style={{ width: '240px' }} className={`sticky left-0 z-40 flex items-center justify-between border-r px-4 ${T.rail} ${T.border}`}>
                  <span className="text-[11px] font-extrabold">Collaborateurs</span>

                      <div style={{ width: '240px' }} className={`sticky left-0 z-20 flex items-center gap-3 border-r px-4 ${T.panel}`}>
                        <Avatar name={row.person} />
                        <div className="min-w-0 flex-1">
                          <div className="truncate text-xs font-bold">{row.person}</div>
                          <div className={`text-[10px] ${T.faint}`}>{row.entries.length} entrée(s) · {row.workload} j</div>
                        </div>
                        {isDropTarget ? <span className="rounded bg-indigo-600 px-1.5 py-0.5 text-[9px] font-bold text-white">ici</span> : null}
                      </div>

                      <div className="relative" style={{ width: `${timelineWidth}px` }}>

                            déduite de la position du clic (des milliers de boutons sinon). */}
                        <div className="absolute inset-0" style={gridStyle} />
                        <div className="pointer-events-none absolute inset-0 flex">
                          {row.conflicts.map((c) => (
                            <div key={c.half} className="conflict-cell absolute inset-y-0"
                              style={{ left: `${c.half * (columnWidth / 2)}px`, width: `${columnWidth / 2}px` }} />
                          ))}
                        </div>
                        {todayOffset >= 0 ? (
                          <div className="pointer-events-none absolute inset-y-0 bg-indigo-500/[0.08]"
                            style={{ left: `${todayOffset * columnWidth}px`, width: `${columnWidth}px` }} />
                        ) : null}
                        <div
                          className="absolute inset-0"
                          onMouseMove={(e) => {
                            const survol = survolRefs.current[row.person];
                            if (!survol) return;
                            const rect = e.currentTarget.getBoundingClientRect();
                            const demi = Math.max(0, Math.floor((e.clientX - rect.left) / (columnWidth / 2)));
                            survol.style.display = 'block';
                            survol.style.left = `${demi * (columnWidth / 2)}px`;
                            survol.style.width = `${columnWidth / 2}px`;
                          }}
                          onMouseLeave={() => { const h = survolRefs.current[row.person]; if (h) h.style.display = 'none'; }}
                          onClick={(e) => {
                            if (movedRef.current) return;
                            const rect = e.currentTarget.getBoundingClientRect();
                            const demi = Math.max(0, Math.floor((e.clientX - rect.left) / (columnWidth / 2)));
                            openEntryCreator(row.person, Math.floor(demi / 2), demi % 2 === 1 ? 'PM' : 'AM');
                          }}
                          title={`Cliquez une demi-journée pour planifier ${row.person}`} />
                        <div ref={(el) => { survolRefs.current[row.person] = el; }}
                          className="pointer-events-none absolute inset-y-0 hidden bg-indigo-500/20" />

                        {isDropTarget ? (
                          <div className="pointer-events-none absolute" style={{ left: `${drag.snapStart * (columnWidth / 2)}px`, width: `${drag.snapLen * (columnWidth / 2)}px`, top: '10px' }}>
                            <div className="h-6 rounded-md border-2 border-dashed border-indigo-400 bg-indigo-500/20" />
                          </div>
                        ) : null}

                        <div className="pointer-events-none relative h-full">
                          {row.entries.map((entry) => {
                            const dragging = drag && drag.kind === 'entry' && drag.id === entry.id;
                            const halfPx = columnWidth / 2;
                            let left = entry.startHalf * halfPx;
                            let width = entry.lenHalf * halfPx;
                            if (dragging) {
                              if (drag.action === 'move') left += drag.deltaX;
                              else if (drag.action === 'resize-left') { left += drag.deltaX; width -= drag.deltaX; }
                              else width += drag.deltaX;
                            }
                            const top = entry.lane * 30 + 10;
                            const shownWidth = Math.max(halfPx * 0.8, width);
                            const tiny = shownWidth < 54;      // le titre ne tient pas dedans
                            const compact = shownWidth < 96;   // pas la place pour l'icône et le badge
                            return (
                              <React.Fragment key={entry.id}>
                                {dragging && (!drag.targetPerson || drag.targetPerson === row.person) ? (
                                  <div style={{ left: `${drag.snapStart * halfPx}px`, width: `${drag.snapLen * halfPx}px`, top: `${top}px` }}
                                    className="absolute h-6 rounded-md border-2 border-dashed border-indigo-400 bg-indigo-500/10" />
                                ) : null}
                                <div
                                  style={{ left: `${left}px`, width: `${Math.max(halfPx * 0.8, width)}px`, top: `${top}px` }}
                                  data-nopan
                                  onMouseDown={(e) => startDrag(e, { kind: 'entry', id: entry.id, action: 'move', unit: 0.5, startUnits: entry.startHalf, lenUnits: entry.lenHalf, person: row.person })}
                                  onClick={(e) => { if (movedRef.current) { e.preventDefault(); return; } setEditingEntry(entry); }}
                                  title={`${entry.title} — ${formatDateFr(entry.startDate)} ${entry.slot} · ${entry.duration} j`}
                                  className={`group pointer-events-auto absolute flex h-6 cursor-grab items-center rounded-md border border-white/20 bg-gradient-to-r ${entry.color} px-1.5 text-[10px] font-bold text-white shadow-md transition hover:brightness-110 active:cursor-grabbing ${dragging ? 'z-[15] ring-2 ring-indigo-300' : 'z-10'}`}>
                                  <div onMouseDown={(e) => startDrag(e, { kind: 'entry', id: entry.id, action: 'resize-left', unit: 0.5, startUnits: entry.startHalf, lenUnits: entry.lenHalf, person: row.person })} className="absolute inset-y-0 left-0 w-2 cursor-ew-resize rounded-l-md bg-white/40 opacity-0 group-hover:opacity-100" />
                                  <div className="pointer-events-none flex w-full items-center justify-between gap-1 px-1">
                                    <span className="truncate">{tiny || compact ? '' : (entry.slot === 'PM' ? '☾ ' : '☀ ')}{entry.title}</span>
                                    {!compact && entry.lenHalf >= 2 ? <span className="shrink-0 rounded bg-black/35 px-1 font-mono text-[9px]">{entry.duration} j</span> : null}
                                  </div>

                                  <div onMouseDown={(e) => startDrag(e, { kind: 'entry', id: entry.id, action: 'resize-right', unit: 0.5, startUnits: entry.startHalf, lenUnits: entry.lenHalf, person: row.person })} className="absolute inset-y-0 right-0 w-2 cursor-ew-resize rounded-r-md bg-white/40 opacity-0 group-hover:opacity-100" />
                                  {dragging ? (
                                    <div className="pointer-events-none absolute -top-7 left-0 whitespace-nowrap rounded-md border border-indigo-500 bg-slate-900 px-2 py-1 font-mono text-[10px] text-slate-100 shadow-xl">
                                      {formatDateFr(formatDateIso(addDays(timelineStart, Math.floor(drag.snapStart / 2))))} · {drag.snapStart % 2 === 1 ? 'PM' : 'AM'} · {drag.snapLen / 2} j
                                      {drag.targetPerson && drag.targetPerson !== row.person ? ` → ${drag.targetPerson}` : ''}
                                    </div>
                                  ) : null}
                                </div>
                              </React.Fragment>
                            );
                          })}
                        </div>
                      </div>
                    </div>
                  );
                })}
                {planningRows.length === 0 ? <div className={`px-8 py-16 text-center text-sm ${T.faint}`}>Aucun collaborateur ne correspond au filtre.</div> : null}
              </div>
            </div>
          </div>
        ) : null}

        {/* =============================== NOTES =============================== */}
        {activeTab === 'notes' ? (
          <div className="flex flex-1 overflow-hidden">
            <aside className={`flex w-72 shrink-0 flex-col border-r ${T.panel}`}>
              <div className={`flex items-center justify-between border-b px-4 py-3 ${T.border} ${T.inset}`}>
                <h2 className="text-[11px] font-extrabold uppercase tracking-wide">Bloc-notes</h2>
                <button type="button" onClick={() => createNote(null)} className={`rounded-lg px-2 py-1 text-sm font-bold ${T.raise} ${T.muted} hover:text-indigo-400`}>+</button>
              </div>
              <div className="flex-1 overflow-y-auto p-2">
                {sortedNotes.length === 0 ? <p className={`p-4 text-[11px] ${T.faint}`}>Aucune note. Utilisez cet espace pour vos devis, questions et comparatifs.</p> : null}
                {sortedNotes.map((note) => {
                  const proj = projects.find((p) => p.id === note.projectId);
                  return (
                    <button key={note.id} type="button" onClick={() => setSelectedNoteId(note.id)}
                      className={`mb-1.5 flex w-full gap-2 rounded-xl border px-3 py-2.5 text-left transition ${note.id === selectedNoteId ? `border-indigo-500/60 ${isDark ? 'bg-indigo-500/10' : 'bg-indigo-50'}` : `${T.border} ${T.hover}`}`}>
                      <span className={`mt-0.5 h-full w-1 shrink-0 rounded-full ${noteBar(note.color)}`} />
                      <span className="min-w-0 flex-1">
                        <span className="flex items-center gap-1.5">
                          {note.pinned ? <span className="text-[10px]">📌</span> : null}
                          <span className="truncate text-[12px] font-bold">{note.title || 'Note sans titre'}</span>
                        </span>
                        <span className={`mt-0.5 block truncate text-[10px] ${T.faint}`}>{proj ? proj.title + ' · ' : ''}{(note.body || '').split('\n')[0] || 'Vide'}</span>
                      </span>
                    </button>
                  );
                })}
              </div>
            </aside>

            <section className={`flex flex-1 flex-col overflow-hidden ${isDark ? 'bg-[#05080F]' : 'bg-[#EEF1F6]'}`}>
              {selectedNote ? (
                <>
                  <div className={`flex flex-wrap items-center gap-2 border-b px-5 py-3 ${T.border} ${T.rail}`}>
                    <input value={selectedNote.title} placeholder="Titre de la note"
                      onChange={(e) => patchNote(selectedNote.id, { title: e.target.value }, true)}
                      onBlur={(e) => patchNote(selectedNote.id, { title: e.target.value })}
                      className={`min-w-0 flex-1 bg-transparent text-base font-extrabold outline-none ${isDark ? 'placeholder-slate-600' : 'placeholder-slate-400'}`} />
                    <select value={selectedNote.projectId} onChange={(e) => patchNote(selectedNote.id, { projectId: e.target.value })} className={`w-44 ${inputCls}`}>
                      <option value="">Sans projet</option>
                      {projects.map((p) => <option key={p.id} value={p.id}>{p.title}</option>)}
                    </select>
                    <select value={selectedNote.color} onChange={(e) => patchNote(selectedNote.id, { color: e.target.value })} className={`w-28 ${inputCls}`}>
                      {NOTE_COLORS.map((c) => <option key={c.value} value={c.value}>{c.name}</option>)}
                    </select>
                    <button type="button" onClick={() => patchNote(selectedNote.id, { pinned: !selectedNote.pinned })} className={selectedNote.pinned ? btnPrimary : btnSecondary}>📌</button>
                    <button type="button" onClick={() => deleteNote(selectedNote.id)} className={btnDanger}>Supprimer</button>
                  </div>
                  <textarea
                    value={selectedNote.body}
                    onChange={(e) => patchNote(selectedNote.id, { body: e.target.value }, true)}
                    onBlur={(e) => patchNote(selectedNote.id, { body: e.target.value })}
                    placeholder="Devis, contacts, questions à poser, comparatifs… Tout ce qui encombrerait la roadmap va ici."
                    className={`flex-1 resize-none bg-transparent p-6 font-mono text-[13px] leading-relaxed outline-none ${isDark ? 'placeholder-slate-600' : 'placeholder-slate-400'}`} />
                  <div className={`border-t px-5 py-2 text-[10px] ${T.border} ${T.faint}`}>
                    Sauvegarde automatique · modifiée le {new Date(selectedNote.updatedAt).toLocaleString('fr-FR')}
                  </div>
                </>
              ) : (
                <div className="flex flex-1 items-center justify-center">
                  <button type="button" onClick={() => createNote(null)} className={btnPrimary}>Créer votre première note</button>
                </div>
              )}
            </section>
          </div>
        ) : null}
      </main>

      {/* ------------------------------- Modales ------------------------------- */}
      {entryForm ? (
        <Modal T={T} title={entryForm.id ? 'Modifier l’entrée' : 'Planifier une entrée'}
          subtitle={`${entryForm.assignee} · ${formatDayShort(entryForm.startDate)} · ${entryForm.slot === 'PM' ? 'après-midi' : 'matin'}`}
          onClose={() => setEntryForm(null)}
          footer={<>
            <span className={`text-[11px] ${T.faint}`}>Durée minimale : 0,5 jour</span>
            <div className="flex gap-2">
              <button type="button" className={btnSecondary} onClick={() => setEntryForm(null)}>Annuler</button>
              <button type="button" className={btnPrimary} onClick={() => saveEntry(entryForm)}>{entryForm.id ? 'Enregistrer' : 'Planifier'}</button>
            </div>
          </>}>
          <div className="space-y-3">
            <div className={`rounded-xl border p-3 ${T.raise}`}>
              <Field T={T} label="Reprendre un projet, une tâche ou une sous-tâche" hint="Remplit le titre, l'étiquette et la couleur en un clic.">
                <select className={inputCls} value=""
                  onChange={(e) => {
                    const v = e.target.value;
                    if (!v) return;
                    const [type, id] = v.split(':');
                    if (type === 'proj') { const p = projects.find((x) => x.id === id); if (p) setEntryForm({ ...entryForm, title: p.title, tag: p.category, color: p.color }); }
                    else if (type === 'task') { const t = allTasks.find((x) => x.id === id); if (t) setEntryForm({ ...entryForm, title: t.title, tag: t.project.category, color: t.project.color }); }
                    else {
                      let found = null; let parent = null;
                      allTasks.forEach((t) => t.subtasks.forEach((s) => { if (s.id === id) { found = s; parent = t; } }));
                      if (found) setEntryForm({ ...entryForm, title: found.title, tag: parent.title, color: parent.project.color, assignee: entryForm.assignee });
                    }
                  }}>
                  <option value="">Choisir un modèle…</option>
                  <optgroup label="Projets">{projects.map((p) => <option key={p.id} value={`proj:${p.id}`}>{p.title}</option>)}</optgroup>
                  <optgroup label="Tâches">{allTasks.map((t) => <option key={t.id} value={`task:${t.id}`}>{t.title}</option>)}</optgroup>
                  <optgroup label="Sous-tâches">
                    {allTasks.flatMap((t) => t.subtasks.map((s) => <option key={s.id} value={`sub:${s.id}`}>{t.title} › {s.title}</option>))}
                  </optgroup>
                </select>
              </Field>
            </div>
            <Field T={T} label="Titre"><input className={inputCls} value={entryForm.title} autoFocus onChange={(e) => setEntryForm({ ...entryForm, title: e.target.value })} placeholder="Ex. Visite du domaine" /></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field T={T} label="Étiquette"><input className={inputCls} value={entryForm.tag} onChange={(e) => setEntryForm({ ...entryForm, tag: e.target.value })} /></Field>
              <Field T={T} label="Couleur">
                <select className={inputCls} value={entryForm.color} onChange={(e) => setEntryForm({ ...entryForm, color: e.target.value })}>
                  {COLOR_OPTIONS.map((c) => <option key={c.value} value={c.value}>{c.name}</option>)}
                </select>
              </Field>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <Field T={T} label="Collaborateur"><input className={inputCls} list="collab-list" value={entryForm.assignee} onChange={(e) => setEntryForm({ ...entryForm, assignee: e.target.value })} /></Field>
              <Field T={T} label="Durée (jours)"><input type="number" step="0.5" min="0.5" className={inputCls} value={entryForm.duration} onChange={(e) => setEntryForm({ ...entryForm, duration: e.target.value })} /></Field>
            </div>
            <div className="grid grid-cols-3 gap-3">
              <Field T={T} label="Date"><input type="date" className={inputCls} value={entryForm.startDate} onChange={(e) => setEntryForm({ ...entryForm, startDate: e.target.value })} /></Field>
              <Field T={T} label="Créneau">
                <select className={inputCls} value={entryForm.slot} onChange={(e) => setEntryForm({ ...entryForm, slot: e.target.value })}>
                  <option value="AM">☀ Matin</option><option value="PM">☾ Après-midi</option>
                </select>
              </Field>
              <Field T={T} label="Fin (incluse)">
                <input type="date" className={inputCls} min={entryForm.startDate} value={endFromDuration(entryForm.startDate, entryForm.duration)}
                  onChange={(e) => { if (!isIsoDate(e.target.value)) return; setEntryForm({ ...entryForm, duration: durationFromEnd(entryForm.startDate, e.target.value, 0.5) }); }} />
              </Field>
            </div>
          </div>
        </Modal>
      ) : null}

      {editingEntry ? (
        <Modal T={T} title="Entrée de planning" subtitle={`${editingEntry.assignee} · ${formatDayShort(editingEntry.startDate)}`} onClose={() => setEditingEntry(null)}
          footer={<>
            <button type="button" className="text-xs font-bold text-rose-400" onClick={() => deleteEntry(editingEntry.id)}>Supprimer</button>
            <div className="flex gap-2">
              <button type="button" className={btnSecondary} onClick={() => duplicateEntry(editingEntry)}>Dupliquer</button>
              <button type="button" className={btnPrimary} onClick={() => saveEntry(editingEntry)}>Enregistrer</button>
            </div>
          </>}>
          <div className="space-y-3">
            <Field T={T} label="Titre"><input className={inputCls} value={editingEntry.title} onChange={(e) => setEditingEntry({ ...editingEntry, title: e.target.value })} /></Field>
            <div className={`rounded-xl border p-3 ${T.raise}`}>
              <Field T={T} label="Basculer vers un autre collaborateur" hint="Vous pouvez aussi glisser le bloc vers une autre ligne du planning.">
                <div className="flex flex-wrap gap-1.5">
                  {collaborators.map((c) => (
                    <button key={c} type="button" onClick={() => { reassignEntry(editingEntry.id, c); setEditingEntry({ ...editingEntry, assignee: c }); }}
                      className={`flex items-center gap-1.5 rounded-lg border px-2 py-1 text-[10px] font-bold transition ${c === editingEntry.assignee ? 'border-indigo-500 bg-indigo-600 text-white' : `${T.border} ${T.hover} ${T.muted}`}`}>
                      <Avatar name={c} size="sm" />{c}
                    </button>
                  ))}
                </div>
              </Field>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <Field T={T} label="Date"><input type="date" className={inputCls} value={editingEntry.startDate} onChange={(e) => setEditingEntry({ ...editingEntry, startDate: e.target.value })} /></Field>
              <Field T={T} label="Créneau">
                <select className={inputCls} value={editingEntry.slot} onChange={(e) => setEditingEntry({ ...editingEntry, slot: e.target.value })}>
                  <option value="AM">☀ Matin</option><option value="PM">☾ Après-midi</option>
                </select>
              </Field>
            </div>
            <div className="grid grid-cols-3 gap-3">
              <Field T={T} label="Fin (incluse)">
                <input type="date" className={inputCls} min={editingEntry.startDate} value={endFromDuration(editingEntry.startDate, editingEntry.duration)}
                  onChange={(e) => { if (!isIsoDate(e.target.value)) return; setEditingEntry({ ...editingEntry, duration: durationFromEnd(editingEntry.startDate, e.target.value, 0.5) }); }} />
              </Field>
              <Field T={T} label="Durée (jours)"><input type="number" step="0.5" min="0.5" className={inputCls} value={editingEntry.duration} onChange={(e) => setEditingEntry({ ...editingEntry, duration: Number(e.target.value) })} /></Field>
              <Field T={T} label="Couleur">
                <select className={inputCls} value={editingEntry.color} onChange={(e) => setEditingEntry({ ...editingEntry, color: e.target.value })}>
                  {COLOR_OPTIONS.map((c) => <option key={c.value} value={c.value}>{c.name}</option>)}
                </select>
              </Field>
            </div>
            {editingEntry.duration > 0.5 ? <button type="button" className={`w-full ${btnSecondary}`} onClick={() => openSplit(editingEntry)}>Scinder en tranches de 0,5 j</button> : null}
          </div>
        </Modal>
      ) : null}

      {splitEntry ? (
        <Modal T={T} title="Scinder l’entrée" subtitle={`${splitEntry.title} · ${splitEntry.duration} j`} onClose={() => setSplitEntry(null)}
          footer={<>
            <button type="button" className="text-[11px] font-bold text-indigo-400" onClick={() => setSplitSegments([...splitSegments, 0.5])}>+ Ajouter une tranche</button>
            <div className="flex gap-2">
              <button type="button" className={btnSecondary} onClick={() => setSplitEntry(null)}>Annuler</button>
              <button type="button" className={btnPrimary} onClick={applySplit}>Scinder</button>
            </div>
          </>}>
          <div className="space-y-2">
            {splitSegments.map((seg, idx) => (
              <div key={idx} className={`flex items-center gap-2 rounded-xl border px-3 py-2 ${T.raise}`}>
                <span className={`w-16 text-[11px] font-bold ${T.faint}`}>Tranche {idx + 1}</span>
                <input type="number" step="0.5" min="0.5" className={`${inputCls} flex-1 font-mono`} value={seg}
                  onChange={(e) => { const next = [...splitSegments]; next[idx] = Number(e.target.value); setSplitSegments(next); }} />
                {splitSegments.length > 2 ? <button type="button" className="px-2 text-xs font-bold text-rose-400" onClick={() => setSplitSegments(splitSegments.filter((_, i) => i !== idx))}>✕</button> : null}
              </div>
            ))}
            {(() => {
              const sum = splitSegments.reduce((a, b) => a + Number(b), 0);
              const ok = Math.abs(sum - splitEntry.duration) < 0.001;
              return (
                <div className={`flex items-center justify-between rounded-xl border px-3 py-2 text-[11px] ${T.raise}`}>
                  <span className={T.faint}>Total</span>
                  <span className={`font-mono font-bold ${ok ? 'text-emerald-400' : 'text-rose-400'}`}>{sum} / {splitEntry.duration} j</span>
                </div>
              );
            })()}
          </div>
        </Modal>
      ) : null}

      {projectForm ? (
        <Modal T={T} title={projectForm.id ? 'Modifier le projet' : 'Nouveau projet'} onClose={() => setProjectForm(null)}
          footer={<><span className={`text-[11px] ${T.faint}`}>Les barres restent déplaçables à la souris.</span>
            <div className="flex gap-2">
              <button type="button" className={btnSecondary} onClick={() => setProjectForm(null)}>Annuler</button>
              <button type="button" className={btnPrimary} onClick={() => saveProject(projectForm)}>{projectForm.id ? 'Enregistrer' : 'Créer le projet'}</button>
            </div></>}>
          <div className="space-y-3">
            <Field T={T} label="Nom du projet"><input className={inputCls} autoFocus value={projectForm.title} onChange={(e) => setProjectForm({ ...projectForm, title: e.target.value })} placeholder="Ex. Mariage — prestataires" /></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field T={T} label="Catégorie"><input className={inputCls} value={projectForm.category} onChange={(e) => setProjectForm({ ...projectForm, category: e.target.value })} /></Field>
              <Field T={T} label="Couleur">
                <select className={inputCls} value={projectForm.color} onChange={(e) => setProjectForm({ ...projectForm, color: e.target.value })}>
                  {COLOR_OPTIONS.map((c) => <option key={c.value} value={c.value}>{c.name}</option>)}
                </select>
              </Field>
            </div>
            <div className="grid grid-cols-3 gap-3">
              <Field T={T} label="Début"><input type="date" className={inputCls} value={projectForm.startDate} onChange={(e) => setProjectForm({ ...projectForm, startDate: e.target.value })} /></Field>
              <Field T={T} label="Fin (incluse)">
                <input type="date" className={inputCls} min={projectForm.startDate} value={endFromDuration(projectForm.startDate, projectForm.duration)}
                  onChange={(e) => { if (!isIsoDate(e.target.value)) return; setProjectForm({ ...projectForm, duration: durationFromEnd(projectForm.startDate, e.target.value, 1) }); }} />
              </Field>
              <Field T={T} label="Durée (jours)"><input type="number" min="1" className={inputCls} value={projectForm.duration} onChange={(e) => setProjectForm({ ...projectForm, duration: e.target.value })} /></Field>
            </div>
          </div>
        </Modal>
      ) : null}

      {(taskForm || editingTask) ? (() => {
        const form = taskForm || editingTask;
        const setForm = taskForm ? setTaskForm : setEditingTask;
        const parent = form.id ? projects.find((p) => p.tasks.some((t) => t.id === form.id)) : null;
        const liveTask = parent ? parent.tasks.find((t) => t.id === form.id) : null;
        return (
          <Modal T={T} size="lg" title={form.id ? `${form.ref || 'Tâche'} · ${form.title}` : 'Nouvelle tâche'}
            subtitle={parent ? `${parent.title}${liveTask ? ` · créée ${liveTask.journal && liveTask.journal[0] ? new Date(liveTask.journal[0].date).toLocaleDateString('fr-FR') : ''}` : ''}` : null}
            onClose={() => { setTaskForm(null); setEditingTask(null); }}
            footer={<>
              {form.id ? <button type="button" className="text-xs font-bold text-rose-400" onClick={() => deleteTask(form.id)}>Supprimer</button> : <span />}
              <div className="flex gap-2">

                        return (

                            <button type="button" className="opacity-60 hover:opacity-100"

                  </span>

                        <span className={`font-mono text-[10px] ${minutes < 5 ? 'text-emerald-400' : T.faint}`}>
                          {minutes < 1 ? 'à l’instant' : minutes < 5 ? `il y a ${minutes} min` : minutes < 60 ? `il y a ${minutes} min` : `il y a ${Math.round(minutes / 60)} h`}
                        </span>
                      </div>
                    );
                  })}
                </div>

                  <input className={inputCls} value={sync.nom} onChange={(e) => setSync({ ...sync, nom: e.target.value.slice(0, 40) })} />

                <Field T={T} label="Mot de passe du tableau" hint="Il chiffre le fichier.">

              </Field>

                  </div>

                  <input className={inputCls} value={event.label} onChange={(e) => commit((prev) => ({ ...prev, event: { ...prev.event, label: e.target.value } }))} />

            <li><strong>2.</strong> Dans la colonne de gauche, descendez jusqu'à <strong>Developer settings</strong>, le dernier élément.</li>
            <li><strong>3.</strong> <strong>Personal access tokens</strong> › <strong>Fine-grained tokens</strong> › bouton <strong>Generate new token</strong>.</li>
            <li><strong>4.</strong> Donnez-lui un nom (« tableau mariage »), une expiration longue, puis dans <strong>Repository access</strong> choisissez <em>Only select repositories</em> et cochez votre dépôt <span className="font-mono">{sync.repo || 'mariage'}</span>.</li>
            <li><strong>5.</strong> Dans <strong>Repository permissions</strong>, cherchez la ligne <strong>Contents</strong> et mettez-la sur <strong>Read and write</strong>. Ne touchez à rien d'autre.</li>
            <li><strong>6.</strong> <strong>Generate token</strong>, puis copiez la longue chaîne affichée — elle ne sera plus jamais montrée.</li>
            <li><strong>7.</strong> Collez-la dans le champ « Jeton GitHub » de la fenêtre précédente. C'est terminé.</li>

          <div className={`mt-4 rounded-xl border p-3 text-[11px] leading-relaxed ${T.border} ${T.inset} ${T.muted}`}>

            Le même jeton peut être collé sur vos deux ordinateurs et sur celui de Magalie.

          </div>
        </Modal>

      {isHelpOpen ? (
        <Modal T={T} title="Prise en main" onClose={() => setIsHelpOpen(false)}

            <li><strong>Se déplacer dans le temps</strong> — clic maintenu sur la grille pour la faire glisser, flèches <span className="font-mono">←</span> <span className="font-mono">→</span> pour avancer d'une semaine, molette du milieu enfoncée aussi. Le repère rose marque le Jour J ; s'il est hors écran, une pastille discrète apparaît sur le bord.</li>
            <li><strong>Planning</strong> — cliquez une demi-case pour planifier. Glissez un bloc horizontalement pour changer de date, verticalement pour le confier à un autre collaborateur.</li>
            <li><strong>Kanban</strong> — tapez un titre dans une colonne et faites Entrée : la tâche est créée au bon endroit, et vous pouvez enchaîner. « Grouper par » réorganise le tableau par statut, par personne ou par priorité. Les cartes se réordonnent à la souris.</li>
            <li><strong>Chaque tâche a une référence</strong> (MAR-12) : pratique pour se dire « regarde MAR-12 ». La recherche la reconnaît.</li>
            <li><strong>Échanges et historique</strong> — ouvrez une tâche : vous pouvez vous y répondre par écrit, et l'application consigne qui a fait quoi.</li>
            <li><strong>Tâches préalables</strong> — indiquez qu'une tâche en attend une autre. La carte affiche « En attente de MAR-3 », et la roadmap signale ⚠ si les dates se contredisent.</li>
            <li><strong>Notes</strong> — l'endroit pour les devis, contacts et comparatifs, afin de garder les autres vues lisibles. Une note peut être rattachée à un projet.</li>
            <li><strong>À plusieurs</strong> — envoyez l'adresse du site et le mot de passe. Le tableau est enregistré, chiffré, dans votre dépôt GitHub : chacun le retrouve depuis n'importe quel ordinateur, à tout moment. Pour pouvoir enregistrer ses propres modifications, il faut aussi coller un jeton (bouton « Partager », guide fourni).</li>
            <li className="pt-2"><strong>Raccourcis</strong> — <span className="font-mono">1 2 3 4</span> changent de vue, <span className="font-mono">T</span> recentre sur aujourd'hui, <span className="font-mono">F</span> affiche toute la période, <span className="font-mono">Ctrl+Z</span> annule, <span className="font-mono">Échap</span> ferme.</li>
          </ul>
        </Modal>
      ) : null}

      <datalist id="collab-list">{collaborators.map((c) => <option key={c} value={c} />)}</datalist>
      <Toasts items={toasts} onDismiss={dismissToast} />
    </div>
  );
}

(function mount() {
  const root = document.getElementById('root');
  if (!root) return;
  try {
    ReactDOM.createRoot(root).render(<ErrorBoundary><AuraPlanApp /></ErrorBoundary>);
  } catch (err) {
    root.innerHTML = '<div class="boot-error"><h1 style="font-size:18px;font-weight:800;margin:0 0 8px">Démarrage impossible</h1>'
      + '<p style="color:#94A3B8;font-size:13px;margin:0">' + String(err && err.message) + '</p></div>';
  }
})();
</script>

<script>
  window.setTimeout(function () {
    var root = document.getElementById('root');
    if (!root || root.childElementCount > 0) return;
    var missing = [];
    if (!window.React) missing.push('React');
    if (!window.ReactDOM) missing.push('ReactDOM');
    if (!window.Babel) missing.push('Babel');
    if (!window.tailwind) missing.push('Tailwind');
    root.innerHTML = '<div class="boot-error">'
      + '<h1 style="font-size:18px;font-weight:800;margin:0 0 8px;color:#E2E8F0">L\'application n\'a pas pu démarrer</h1>'
      + '<p style="color:#94A3B8;font-size:13px;line-height:1.6;margin:0 0 12px">'
      + (missing.length
        ? 'Ces bibliothèques n\'ont pas pu être téléchargées : <strong>' + missing.join(', ') + '</strong>. Vérifiez votre connexion ou un bloqueur de scripts.'
        : 'Le script a échoué au démarrage. Ouvrez la console du navigateur pour voir le détail.')
      + '</p><p style="color:#64748B;font-size:12px;margin:0">Astuce : ouvrez le fichier via une URL http(s) plutôt qu\'en double-clic si votre navigateur restreint les fichiers locaux.</p></div>';
  }, 6000);
</script>
