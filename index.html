<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraPlan Studio - Operating System pour Projets & Planning</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            aura: {
              bg: '#080C14',
              card: '#111827',
              border: '#1F293D',
              accent: '#6366F1',
              cyan: '#06B6D4',
              purple: '#A855F7'
            }
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Yjs + y-webrtc (Temps réel P2P sans serveur) -->
  <script src="https://cdn.jsdelivr.net/npm/yjs@13/dist/yjs.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/y-webrtc@10/dist/y-webrtc.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #080C14; }
    ::-webkit-scrollbar-thumb { background: #1F293D; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #6366F1; }
    .dragging-active { cursor: grabbing !important; user-select: none !important; }
  </style>
</head>
<body class="bg-aura-bg text-slate-100 font-sans antialiased min-h-screen overflow-hidden selection:bg-indigo-500/30">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // --- HELPERS DATES & ENCODAGE ---
    const utf8_to_b64 = (str) => window.btoa(unescape(encodeURIComponent(str)));
    const b64_to_utf8 = (str) => decodeURIComponent(escape(window.atob(str)));

    const parseDate = (str) => new Date(str + 'T00:00:00');
    const formatDateIso = (d) => d.toISOString().split('T')[0];
    const addDays = (d, days) => { const r = new Date(d); r.setDate(r.getDate() + days); return r; };
    const diffDays = (d1, d2) => Math.round((d1 - d2) / (1000 * 60 * 60 * 24));

    const formatDateFr = (isoStr) => {
      if (!isoStr) return '';
      const d = parseDate(isoStr);
      return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    };

    const MONTH_NAMES_FR = [
      'Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin',
      'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'
    ];

    const COLOR_OPTIONS = [
      { name: 'Indigo Aura', value: 'from-indigo-600 to-violet-600' },
      { name: 'Cyber Neon', value: 'from-purple-600 to-fuchsia-600' },
      { name: 'Émeraude Deep', value: 'from-emerald-500 to-teal-600' },
      { name: 'Ambre Chaud', value: 'from-amber-500 to-orange-600' },
      { name: 'Rose Flash', value: 'from-rose-600 to-pink-600' },
      { name: 'Cyan Futur', value: 'from-cyan-500 to-blue-600' }
    ];

    const TODAY_STR = formatDateIso(new Date());

    // DONNÉES INITIALES
    const INITIAL_PROJECTS = [
      {
        id: 'proj-1',
        title: 'Refonte Microservices Cloud',
        category: 'Infrastructure',
        startDate: TODAY_STR,
        duration: 14,
        color: 'from-indigo-600 to-violet-600',
        tasks: [
          { id: 't-1-1', title: 'Infra Terraform Cluster', assignee: 'Alexandre M.', startDate: TODAY_STR, slot: 'AM', duration: 3.5, status: 'DONE' },
          { id: 't-1-2', title: 'Configuration Ingress & SSL', assignee: 'Lucas R.', startDate: formatDateIso(addDays(new Date(), 3)), slot: 'PM', duration: 4.5, status: 'IN_PROGRESS' },
          { id: 't-1-3', title: 'Migration Gateway Auth', assignee: 'Alexandre M.', startDate: formatDateIso(addDays(new Date(), 8)), slot: 'AM', duration: 6, status: 'TODO' }
        ]
      },
      {
        id: 'proj-2',
        title: 'Design System & UI React',
        category: 'Frontend',
        startDate: formatDateIso(addDays(new Date(), 2)),
        duration: 12,
        color: 'from-purple-600 to-fuchsia-600',
        tasks: [
          { id: 't-2-1', title: 'Tokens Figma & Couleurs', assignee: 'Sophie T.', startDate: formatDateIso(addDays(new Date(), 2)), slot: 'AM', duration: 2.5, status: 'DONE' },
          { id: 't-2-2', title: 'Composants Formulaires', assignee: 'Sophie T.', startDate: formatDateIso(addDays(new Date(), 4)), slot: 'PM', duration: 5, status: 'IN_PROGRESS' },
          { id: 't-2-3', title: 'Tests Accessibilité WCAG', assignee: 'Sophie T.', startDate: formatDateIso(addDays(new Date(), 4)), slot: 'AM', duration: 3, status: 'TODO' } // Tâche parallèle
        ]
      },
      {
        id: 'proj-3',
        title: 'Optimisation API & Cache',
        category: 'Backend',
        startDate: formatDateIso(addDays(new Date(), -4)),
        duration: 10,
        color: 'from-emerald-500 to-teal-600',
        tasks: [
          { id: 't-3-1', title: 'Cluster Redis In-Memory', assignee: 'Thomas L.', startDate: formatDateIso(addDays(new Date(), -4)), slot: 'AM', duration: 4.5, status: 'IN_REVIEW' }
        ]
      }
    ];

    function AuraPlanApp() {
      // 1. États Généraux
      const [projects, setProjects] = useState(() => {
        const saved = localStorage.getItem('auraplan_projects_v1');
        return saved ? JSON.parse(saved) : INITIAL_PROJECTS;
      });

      const [activeTab, setActiveTab] = useState('roadmap'); // 'roadmap' | 'kanban' | 'planning'
      const [selectedProjectId, setSelectedProjectId] = useState('proj-1');
      const [editingTask, setEditingTask] = useState(null);
      const [splittingTask, setSplittingTask] = useState(null);
      const [splitPart1Duration, setSplitPart1Duration] = useState(1);
      const [columnWidth, setColumnWidth] = useState(52);

      // Kanban Drag & Ghosting
      const [draggingKanbanTaskId, setDraggingKanbanTaskId] = useState(null);
      const [dragOverColumn, setDragOverColumn] = useState(null);

      // Modales & Config
      const [isProjectModalOpen, setIsProjectModalOpen] = useState(false);
      const [isConfigModalOpen, setIsConfigModalOpen] = useState(false);

      // Formulaires
      const [newProjectForm, setNewProjectForm] = useState({
        title: '', category: 'Tech', startDate: TODAY_STR, duration: 10, color: 'from-indigo-600 to-violet-600'
      });
      const [newTaskForm, setNewTaskForm] = useState({
        title: '', assignee: 'Alexandre M.', startDate: TODAY_STR, slot: 'AM', duration: 2, status: 'TODO'
      });

      // Drag Engine State
      const [dragState, setDragState] = useState(null);
      const dragAnimRef = useRef(null);

      // GitHub REST API & WebRTC P2P
      const [ghConfig, setGhConfig] = useState(() => {
        const saved = localStorage.getItem('gh_config');
        return saved ? JSON.parse(saved) : { owner: '', repo: '', path: 'data.json', token: '' };
      });
      const [syncStatus, setSyncStatus] = useState('');
      const [connectedPeers, setConnectedPeers] = useState(1);
      const yDocRef = useRef(null);

      // --- CALCUL DYNAMIQUE DE LA TIMELINE INFINIE & BORNES EXACTES ---
      const { timelineStartDate, totalTimelineDays } = useMemo(() => {
        let minDate = parseDate(TODAY_STR);
        let maxDate = addDays(parseDate(TODAY_STR), 30);

        projects.forEach(p => {
          const pStart = parseDate(p.startDate);
          const pEnd = addDays(pStart, Math.ceil(p.duration));
          if (pStart < minDate) minDate = pStart;
          if (pEnd > maxDate) maxDate = pEnd;

          (p.tasks || []).forEach(t => {
            const tStart = parseDate(t.startDate || p.startDate);
            const tEnd = addDays(tStart, Math.ceil(t.duration));
            if (tStart < minDate) minDate = tStart;
            if (tEnd > maxDate) maxDate = tEnd;
          });
        });

        const start = addDays(minDate, -2);
        const requiredDays = diffDays(maxDate, start) + 20; // Buffer automatique
        return { timelineStartDate: start, totalTimelineDays: Math.max(45, requiredDays) };
      }, [projects]);

      // Calcul des mois pour l'en-tête
      const timelineMonths = useMemo(() => {
        const monthsMap = [];
        let currentMonthKey = '';
        let currentMonthObj = null;

        for (let i = 0; i < totalTimelineDays; i++) {
          const dayDate = addDays(timelineStartDate, i);
          const monthKey = `${dayDate.getFullYear()}-${dayDate.getMonth()}`;

          if (monthKey !== currentMonthKey) {
            currentMonthKey = monthKey;
            currentMonthObj = {
              name: `${MONTH_NAMES_FR[dayDate.getMonth()]} ${dayDate.getFullYear()}`,
              daysCount: 0
            };
            monthsMap.push(currentMonthObj);
          }
          currentMonthObj.daysCount++;
        }
        return monthsMap;
      }, [timelineStartDate, totalTimelineDays]);

      // Flat list de toutes les tâches avec leur projet parent
      const allFlatTasks = useMemo(() => {
        const list = [];
        projects.forEach(p => {
          (p.tasks || []).forEach(t => {
            list.push({ ...t, project: p });
          });
        });
        return list;
      }, [projects]);

      // Collaborateurs uniques
      const collaborators = useMemo(() => {
        const set = new Set();
        allFlatTasks.forEach(t => { if (t.assignee) set.add(t.assignee); });
        if (set.size === 0) set.add('Alexandre M.');
        return Array.from(set);
      }, [allFlatTasks]);

      // Persistance LocalStorage
      useEffect(() => localStorage.setItem('auraplan_projects_v1', JSON.stringify(projects)), [projects]);
      useEffect(() => localStorage.setItem('gh_config', JSON.stringify(ghConfig)), [ghConfig]);

      // Sync WebRTC P2P (Yjs)
      useEffect(() => {
        if (!window.Y || !window.YWebrtc) return;
        const ydoc = new window.Y.Doc();
        const provider = new window.YWebrtc.WebrtcProvider('auraplan-studio-room-2026', ydoc);
        const yProjects = ydoc.getArray('projects');

        yProjects.observe(() => {
          const remote = yProjects.toArray();
          if (remote.length > 0) setProjects(remote);
        });

        provider.on('peers', (e) => setConnectedPeers(e.webrtcPeers.length + 1));
        yDocRef.current = { ydoc, yProjects, provider };

        return () => { provider.destroy(); ydoc.destroy(); };
      }, []);

      const broadcastProjects = useCallback((updated) => {
        setProjects(updated);
        if (yDocRef.current && yDocRef.current.yProjects) {
          const { ydoc, yProjects } = yDocRef.current;
          ydoc.transact(() => {
            yProjects.delete(0, yProjects.length);
            yProjects.insert(0, updated);
          });
        }
      }, []);

      // PROGRESSION (%) PROJET
      const getProjectProgress = (project) => {
        if (!project.tasks || project.tasks.length === 0) return 0;
        const doneCount = project.tasks.filter(t => t.status === 'DONE').length;
        return Math.round((doneCount / project.tasks.length) * 100);
      };

      // HEALTH CHECK
      const getProjectHealth = (project) => {
        if (!project.tasks || project.tasks.length === 0) {
          return { status: 'NEUTRAL', label: '⚪ Non planifié', delay: 0 };
        }

        const projectTargetEnd = addDays(parseDate(project.startDate), Math.ceil(project.duration) - 1);
        let latestTaskEnd = parseDate(project.startDate);

        project.tasks.forEach(t => {
          const tStart = parseDate(t.startDate || project.startDate);
          const tEnd = addDays(tStart, Math.ceil(t.duration || 1) - 1);
          if (tEnd > latestTaskEnd) latestTaskEnd = tEnd;
        });

        const delay = diffDays(latestTaskEnd, projectTargetEnd);

        if (delay > 0) {
          return { status: 'DANGER', label: `🔴 Retard +${delay}j`, delay };
        } else if (delay < 0) {
          return { status: 'SUCCESS', label: `🟢 Avance ${Math.abs(delay)}j`, delay };
        } else {
          return { status: 'SUCCESS', label: '🟢 Dans les temps', delay: 0 };
        }
      };

      // RE-BASELINER
      const rebaselineProject = (projectId) => {
        const proj = projects.find(p => p.id === projectId);
        if (!proj || !proj.tasks || proj.tasks.length === 0) return;

        let earliestStart = parseDate(proj.tasks[0].startDate || proj.startDate);
        let latestEnd = addDays(earliestStart, Math.ceil(proj.tasks[0].duration) - 1);

        proj.tasks.forEach(t => {
          const tStart = parseDate(t.startDate || proj.startDate);
          const tEnd = addDays(tStart, Math.ceil(t.duration || 1) - 1);
          if (tStart < earliestStart) earliestStart = tStart;
          if (tEnd > latestEnd) latestEnd = tEnd;
        });

        const newStartDate = formatDateIso(earliestStart);
        const newDuration = diffDays(latestEnd, earliestStart) + 1;

        const updated = projects.map(p => p.id === projectId ? { ...p, startDate: newStartDate, duration: newDuration } : p);
        broadcastProjects(updated);
      };

      // ALGORITHME DE SUPERPOSITION INTEL (MULTI-TÂCHES PAR COLLABORATEUR)
      const calculateCollaboratorLanes = (personTasks) => {
        // Trie les tâches par date de début
        const sorted = [...personTasks].sort((a, b) => {
          const tA = parseDate(a.startDate || a.project.startDate).getTime() + (a.slot === 'PM' ? 43200000 : 0);
          const tB = parseDate(b.startDate || b.project.startDate).getTime() + (b.slot === 'PM' ? 43200000 : 0);
          return tA - tB;
        });

        const lanes = []; // Tableau contenant le timestamp de fin libre de chaque ligne

        const placedTasks = sorted.map(task => {
          const startDays = diffDays(parseDate(task.startDate || task.project.startDate), timelineStartDate) + (task.slot === 'PM' ? 0.5 : 0);
          const endDays = startDays + Number(task.duration);

          // Trouve la première ligne libre
          let laneIndex = lanes.findIndex(freeDay => freeDay <= startDays);
          if (laneIndex === -1) {
            laneIndex = lanes.length;
            lanes.push(endDays);
          } else {
            lanes[laneIndex] = endDays;
          }

          return { ...task, laneIndex, startDays, endDays };
        });

        return { placedTasks, totalLanes: Math.max(1, lanes.length) };
      };

      // ENGINE DRAG & RESIZE FLUIDE
      const handleMouseDown = (e, projectId, action) => {
        e.stopPropagation();
        e.preventDefault();
        const proj = projects.find(p => p.id === projectId);
        if (!proj) return;

        setDragState({
          projectId, action, startX: e.clientX,
          initialStartDate: proj.startDate, initialDuration: proj.duration,
          currentStartDate: proj.startDate, currentDuration: proj.duration
        });
      };

      useEffect(() => {
        const handleMouseMove = (e) => {
          if (!dragState) return;

          if (dragAnimRef.current) cancelAnimationFrame(dragAnimRef.current);

          dragAnimRef.current = requestAnimationFrame(() => {
            const deltaX = e.clientX - dragState.startX;
            const dayDelta = Math.round(deltaX / columnWidth);

            let newStart = dragState.initialStartDate;
            let newDur = dragState.initialDuration;

            if (dragState.action === 'move') {
              newStart = formatDateIso(addDays(parseDate(dragState.initialStartDate), dayDelta));
            } else if (dragState.action === 'resize-left') {
              const actualDays = Math.min(dayDelta, dragState.initialDuration - 1);
              newStart = formatDateIso(addDays(parseDate(dragState.initialStartDate), actualDays));
              newDur = dragState.initialDuration - actualDays;
            } else if (dragState.action === 'resize-right') {
              newDur = Math.max(1, dragState.initialDuration + dayDelta);
            }

            setDragState(prev => prev ? { ...prev, currentStartDate: newStart, currentDuration: newDur } : null);
          });
        };

        const handleMouseUp = () => {
          if (dragState) {
            const updated = projects.map(p => p.id === dragState.projectId ? { ...p, startDate: dragState.currentStartDate, duration: dragState.currentDuration } : p);
            broadcastProjects(updated);
          }
          setDragState(null);
        };

        if (dragState) {
          window.addEventListener('mousemove', handleMouseMove);
          window.addEventListener('mouseup', handleMouseUp);
        }
        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseup', handleMouseUp);
        };
      }, [dragState, columnWidth, projects, broadcastProjects]);

      // KANBAN DRAG & DROP GHOSTING
      const handleKanbanDragStart = (e, taskId) => {
        setDraggingKanbanTaskId(taskId);
        e.dataTransfer.setData('text/plain', taskId);
        e.dataTransfer.effectAllowed = 'move';
      };

      const handleKanbanDragOver = (e, colId) => {
        e.preventDefault();
        setDragOverColumn(colId);
      };

      const handleKanbanDrop = (e, targetStatus) => {
        e.preventDefault();
        const taskId = e.dataTransfer.getData('text/plain');
        setDraggingKanbanTaskId(null);
        setDragOverColumn(null);
        if (!taskId) return;

        const updatedProjects = projects.map(p => ({
          ...p,
          tasks: (p.tasks || []).map(t => t.id === taskId ? { ...t, status: targetStatus } : t)
        }));
        broadcastProjects(updatedProjects);
      };

      // VUE D'ENSEMBLE INTEGRALE (FIT ALL ULTIME PARTOUT)
      const fitAllTasks = () => {
        const container = document.getElementById('timeline-viewport');
        if (!container) return;

        let earliest = parseDate(TODAY_STR);
        let latest = addDays(parseDate(TODAY_STR), 15);

        projects.forEach(p => {
          const pStart = parseDate(p.startDate);
          const pEnd = addDays(pStart, Math.ceil(p.duration));
          if (pStart < earliest) earliest = pStart;
          if (pEnd > latest) latest = pEnd;

          (p.tasks || []).forEach(t => {
            const tStart = parseDate(t.startDate || p.startDate);
            const tEnd = addDays(tStart, Math.ceil(t.duration));
            if (tStart < earliest) earliest = tStart;
            if (tEnd > latest) latest = tEnd;
          });
        });

        const spanDays = diffDays(latest, earliest) + 4;
        const availableWidth = container.clientWidth - 10;
        const calculatedWidth = Math.max(12, Math.floor(availableWidth / spanDays));

        setColumnWidth(calculatedWidth);
        container.scrollLeft = 0;
      };

      // SCISSION DE TÂCHE AVANCÉE
      const openSplitModal = (task) => {
        if (task.duration <= 0.5) {
          alert("Une tâche de 0.5 jour ne peut pas être découpée davantage.");
          return;
        }
        setSplittingTask(task);
        setSplitPart1Duration(Math.max(0.5, Number((task.duration / 2).toFixed(1))));
      };

      const executeSplitTask = (e) => {
        e.preventDefault();
        if (!splittingTask) return;

        const p1Dur = Number(splitPart1Duration);
        const p2Dur = Number((splittingTask.duration - p1Dur).toFixed(1));

        if (p2Dur <= 0) {
          alert("La durée de la 2nde partie doit être supérieure à 0.");
          return;
        }

        const task1 = { ...splittingTask, duration: p1Dur };
        const p1EndDays = parseDate(splittingTask.startDate);
        const p2Start = formatDateIso(addDays(p1EndDays, Math.floor(p1Dur)));

        const task2 = {
          id: `t-${splittingTask.project.id}-${Date.now()}`,
          title: `${splittingTask.title} (Partie 2)`,
          assignee: splittingTask.assignee,
          startDate: p2Start,
          slot: (p1Dur % 1 !== 0) ? (splittingTask.slot === 'AM' ? 'PM' : 'AM') : splittingTask.slot,
          duration: p2Dur,
          status: splittingTask.status
        };

        const updatedProjects = projects.map(p => {
          if (p.id !== splittingTask.project.id) return p;
          const newTasks = [];
          p.tasks.forEach(t => {
            if (t.id === splittingTask.id) newTasks.push(task1, task2);
            else newTasks.push(t);
          });
          return { ...p, tasks: newTasks };
        });

        broadcastProjects(updatedProjects);
        setSplittingTask(null);
        setEditingTask(null);
      };

      // GESTION PROJETS & TÂCHES
      const handleUpdateProjectField = (projId, field, value) => {
        const updated = projects.map(p => p.id === projId ? { ...p, [field]: value } : p);
        broadcastProjects(updated);
      };

      const handleCreateProject = (e) => {
        e.preventDefault();
        if (!newProjectForm.title.trim()) return;

        const newProj = {
          id: `proj-${Date.now()}`,
          ...newProjectForm,
          duration: Number(newProjectForm.duration),
          tasks: []
        };

        broadcastProjects([...projects, newProj]);
        setSelectedProjectId(newProj.id);
        setIsProjectModalOpen(false);
      };

      const handleAddTask = (e) => {
        e.preventDefault();
        if (!newTaskForm.title.trim() || !selectedProjectId) return;

        const proj = projects.find(p => p.id === selectedProjectId);

        const updated = projects.map(p => {
          if (p.id !== selectedProjectId) return p;
          return {
            ...p,
            tasks: [
              ...(p.tasks || []),
              {
                id: `t-${p.id}-${Date.now()}`,
                title: newTaskForm.title.trim(),
                assignee: newTaskForm.assignee || 'Alexandre M.',
                startDate: newTaskForm.startDate || proj.startDate,
                slot: newTaskForm.slot || 'AM',
                duration: Number(newTaskForm.duration) || 1,
                status: newTaskForm.status || 'TODO'
              }
            ]
          };
        });

        broadcastProjects(updated);
        setNewTaskForm({ title: '', assignee: 'Alexandre M.', startDate: TODAY_STR, slot: 'AM', duration: 2, status: 'TODO' });
      };

      const handleUpdateTask = (updatedTask) => {
        const updatedProjects = projects.map(p => ({
          ...p,
          tasks: (p.tasks || []).map(t => t.id === updatedTask.id ? updatedTask : t)
        }));
        broadcastProjects(updatedProjects);
        setEditingTask(null);
      };

      const handleDeleteTask = (taskId) => {
        const updatedProjects = projects.map(p => ({
          ...p,
          tasks: (p.tasks || []).filter(t => t.id !== taskId)
        }));
        broadcastProjects(updatedProjects);
        setEditingTask(null);
      };

      const deleteProject = (projId) => {
        if (confirm("Supprimer ce projet et toutes ses tâches ?")) {
          const updated = projects.filter(p => p.id !== projId);
          broadcastProjects(updated);
          if (selectedProjectId === projId) setSelectedProjectId(updated[0]?.id || null);
        }
      };

      // SAUVEGARDE GITHUB REST API
      const saveToGitHub = async () => {
        if (!ghConfig.owner || !ghConfig.repo || !ghConfig.token) {
          alert("Veuillez renseigner vos identifiants dans ⚙️ Config GitHub");
          return;
        }
        setSyncStatus('Commit en cours...');
        try {
          const url = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${ghConfig.path}`;
          const headers = { 'Authorization': `token ${ghConfig.token}`, 'Accept': 'application/vnd.github.v3+json' };
          
          let currentSha = null;
          const getRes = await fetch(url, { headers });
          if (getRes.ok) currentSha = (await getRes.json()).sha;

          const putRes = await fetch(url, {
            method: 'PUT',
            headers: { ...headers, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: `Update AuraPlan ${new Date().toLocaleString('fr-FR')}`,
              content: utf8_to_b64(JSON.stringify(projects, null, 2)),
              ...(currentSha && { sha: currentSha })
            })
          });

          if (!putRes.ok) throw new Error();
          setSyncStatus('✅ Commité sur GitHub !');
          setTimeout(() => setSyncStatus(''), 3000);
          setIsConfigModalOpen(false);
        } catch {
          setSyncStatus('❌ Échec de sauvegarde');
        }
      };

      const selectedProject = projects.find(p => p.id === selectedProjectId);

      return (
        <div className={`flex flex-col h-screen overflow-hidden ${dragState ? 'dragging-active' : ''}`}>
          
          {/* BRANDING HEADER */}

                          <button 
                            onClick={() => setEditingTask(task)}
                            className="px-2 py-1 bg-aura-card hover:bg-slate-800 text-[10px] font-semibold text-indigo-400 rounded border border-aura-border shrink-0"
                          >
                            Éditer
                          </button>
                        </div>
                      ))}
                    </div>

                    <form onSubmit={handleAddTask} className="space-y-2 bg-aura-bg p-3 rounded-xl border border-aura-border">
                      <input 
                        type="text" placeholder="Titre de la tâche..." required
                        value={newTaskForm.title}
                        onChange={e => setNewTaskForm({...newTaskForm, title: e.target.value})}
                        className="w-full bg-aura-card text-xs p-2 rounded border border-aura-border text-slate-200"
                      />
                      <div className="grid grid-cols-2 gap-2">
                        <input 
                          type="text" placeholder="Assigné à"
                          value={newTaskForm.assignee}
                          onChange={e => setNewTaskForm({...newTaskForm, assignee: e.target.value})}
                          className="bg-aura-card text-xs p-2 rounded border border-aura-border text-slate-200"
                        />
                        <input 
                          type="date" required
                          value={newTaskForm.startDate}
                          onChange={e => setNewTaskForm({...newTaskForm, startDate: e.target.value})}
                          className="bg-aura-card text-xs p-2 rounded border border-aura-border text-slate-200"
                        />
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <select 
                          value={newTaskForm.slot} 
                          onChange={e => setNewTaskForm({...newTaskForm, slot: e.target.value})}
                          className="bg-aura-card text-xs p-2 rounded border border-aura-border text-slate-200"
                        >
                          <option value="AM">Matin (AM)</option>
                          <option value="PM">Aujourd'hui (PM)</option>
                        </select>
                        <input 
                          type="number" step="0.5" min="0.5" placeholder="Durée (j)"
                          value={newTaskForm.duration}
                          onChange={e => setNewTaskForm({...newTaskForm, duration: e.target.value})}
                          className="bg-aura-card text-xs p-2 rounded border border-aura-border text-slate-200"
                        />
                      </div>
                      <button type="submit" className="w-full py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded transition">
                        + Ajouter Tâche (Précision 0.5j)
                      </button>
                    </form>
                  </div>
                </div>
              </div>
            )}
          </div>

          {/* MODAL 1 : ÉDITION D'UNE TÂCHE */}
          {editingTask && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-aura-card border border-aura-border rounded-2xl p-6 w-full max-w-md shadow-2xl">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-base font-bold text-slate-100">Modifier la Tâche</h3>
                  <button onClick={() => setEditingTask(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="space-y-4">
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Titre de la tâche</label>
                    <input 
                      type="text" 
                      value={editingTask.title} 
                      onChange={e => setEditingTask({...editingTask, title: e.target.value})}
                      className="w-full bg-aura-bg text-xs p-3 rounded-xl border border-aura-border text-slate-200" 
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Date de début</label>
                      <input 
                        type="date" 
                        value={editingTask.startDate || TODAY_STR} 
                        onChange={e => setEditingTask({...editingTask, startDate: e.target.value})}
                        className="w-full bg-aura-bg text-xs p-3 rounded-xl border border-aura-border text-slate-200" 
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Créneau</label>
                      <select 
                        value={editingTask.slot || 'AM'} 
                        onChange={e => setEditingTask({...editingTask, slot: e.target.value})}
                        className="w-full bg-aura-bg text-xs p-3 rounded-xl border border-aura-border text-slate-200"
                      >
                        <option value="AM">Matin (AM)</option>
                        <option value="PM">Après-midi (PM)</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Durée (jours - pas 0.5j)</label>
                      <input 
                        type="number" step="0.5" min="0.5"
                        value={editingTask.duration} 
                        onChange={e => setEditingTask({...editingTask, duration: Number(e.target.value)})}
                        className="w-full bg-aura-bg text-xs p-3 rounded-xl border border-aura-border text-slate-200" 
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Collaborateur assigné</label>
                      <input 
                        type="text" 
                        value={editingTask.assignee} 
                        onChange={e => setEditingTask({...editingTask, assignee: e.target.value})}
                        className="w-full bg-aura-bg text-xs p-3 rounded-xl border border-aura-border text-slate-200" 
                      />
                    </div>
                  </div>

                  {/* Bouton pour déclencher la Scission */}
                  {editingTask.duration > 0.5 && (
                    <div className="p-3 bg-aura-bg rounded-xl border border-aura-border flex items-center justify-between">
                      <span className="text-xs text-slate-300">Scinder en 2 sous-tâches</span>
                      <button 
                        type="button"
                        onClick={() => openSplitModal(editingTask)}
                        className="px-3 py-1.5 bg-indigo-600/20 text-indigo-300 hover:bg-indigo-600/30 border border-indigo-500/30 text-xs font-semibold rounded-lg transition"
                      >
                        ✂️ Scinder Tâche
                      </button>
                    </div>
                  )}

                  <div className="flex justify-between items-center pt-4 border-t border-aura-border">
                    <button onClick={() => handleDeleteTask(editingTask.id)} className="text-xs text-rose-400 font-semibold">Supprimer</button>
                    <div className="flex gap-2">
                      <button onClick={() => setEditingTask(null)} className="px-4 py-2 bg-aura-bg text-xs text-slate-300 rounded-xl">Annuler</button>
                      <button onClick={() => handleUpdateTask(editingTask)} className="px-4 py-2 bg-indigo-600 text-xs font-semibold text-white rounded-xl">Enregistrer</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODAL DE SCISSION DE TÂCHE SUR-MESURE */}
          {splittingTask && (
            <div className="fixed inset-0 bg-black/75 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-aura-card border border-aura-border rounded-2xl p-6 w-full max-w-md shadow-2xl">
                <h3 className="text-base font-bold text-slate-100 mb-2">✂️ Scission de Tâche Sur-Mesure</h3>
                <p className="text-xs text-slate-400 mb-4">Tâche initiale : <strong>{splittingTask.title}</strong> ({splittingTask.duration} jours)</p>

                <form onSubmit={executeSplitTask} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-300 mb-1 font-medium">Durée Partie 1 (jours)</label>
                    <input 
                      type="number" step="0.5" min="0.5" max={splittingTask.duration - 0.5} required
                      value={splitPart1Duration}
                      onChange={e => setSplitPart1Duration(Number(e.target.value))}
                      className="w-full bg-aura-bg p-3 rounded-xl border border-aura-border text-slate-200"
                    />
                  </div>

                  <div className="p-3 bg-aura-bg rounded-xl border border-aura-border space-y-1">
                    <div className="text-slate-400">Durée calculée Partie 2 :</div>
                    <div className="text-sm font-bold text-indigo-400">
                      {(splittingTask.duration - splitPart1Duration).toFixed(1)} jour(s)
                    </div>
                  </div>

                  <div className="flex justify-end gap-3 pt-4 border-t border-aura-border">
                    <button type="button" onClick={() => setSplittingTask(null)} className="px-4 py-2 bg-aura-bg text-slate-300 rounded-xl">Annuler</button>
                    <button type="submit" className="px-4 py-2 bg-indigo-600 text-white font-bold rounded-xl shadow">Confirmer la Scission</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL 2 : CONFIGURATION GITHUB */}
          {isConfigModalOpen && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-aura-card border border-aura-border rounded-2xl p-6 w-full max-w-md shadow-2xl">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-base font-bold text-slate-100">⚙️ Config GitHub Sync</h3>
                  <button onClick={() => setIsConfigModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Propriétaire Dépôt (Owner)</label>
                    <input type="text" placeholder="ex: mon-pseudo" value={ghConfig.owner} onChange={e => setGhConfig({...ghConfig, owner: e.target.value})} className="w-full bg-aura-bg p-3 rounded-xl border border-aura-border text-slate-200" />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Nom du Dépôt (Repo)</label>
                    <input type="text" placeholder="ex: ma-roadmap" value={ghConfig.repo} onChange={e => setGhConfig({...ghConfig, repo: e.target.value})} className="w-full bg-aura-bg p-3 rounded-xl border border-aura-border text-slate-200" />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Token GitHub (PAT)</label>
                    <input type="password" placeholder="github_pat_..." value={ghConfig.token} onChange={e => setGhConfig({...ghConfig, token: e.target.value})} className="w-full bg-aura-bg p-3 rounded-xl border border-aura-border text-slate-200" />
                  </div>

                  {syncStatus && <div className="text-indigo-400 font-semibold">{syncStatus}</div>}

                  <div className="flex justify-end gap-3 pt-4 border-t border-aura-border">
                    <button onClick={() => setIsConfigModalOpen(false)} className="px-4 py-2 bg-aura-bg text-slate-300 rounded-xl">Fermer</button>
                    <button onClick={saveToGitHub} className="px-4 py-2 bg-indigo-600 text-white rounded-xl font-semibold">Commiter data.json</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 3 : CRÉATION DE PROJET */}
          {isProjectModalOpen && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-aura-card border border-aura-border rounded-2xl p-6 w-full max-w-md shadow-2xl">
                <h3 className="text-lg font-bold text-slate-100 mb-4">Créer un Nouveau Projet</h3>
                <form onSubmit={handleCreateProject} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Nom du Projet</label>
                    <input type="text" required value={newProjectForm.title} onChange={e => setNewProjectForm({...newProjectForm, title: e.target.value})} className="w-full bg-aura-bg p-3 rounded-xl border border-aura-border text-slate-200" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Date Cible de début</label>
                      <input type="date" required value={newProjectForm.startDate} onChange={e => setNewProjectForm({...newProjectForm, startDate: e.target.value})} className="w-full bg-aura-bg p-3 rounded-xl border border-aura-border text-slate-200" />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Durée Cible (jours)</label>
                      <input type="number" min="1" required value={newProjectForm.duration} onChange={e => setNewProjectForm({...newProjectForm, duration: e.target.value})} className="w-full bg-aura-bg p-3 rounded-xl border border-aura-border text-slate-200" />
                    </div>
                  </div>
                  <div className="flex justify-end gap-3 pt-4 border-t border-aura-border">
                    <button type="button" onClick={() => setIsProjectModalOpen(false)} className="px-4 py-2 bg-aura-bg text-slate-300 rounded-xl">Annuler</button>
                    <button type="submit" className="px-4 py-2 bg-indigo-600 text-white font-semibold rounded-xl">Créer Projet</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AuraPlanApp />);
  </script>
</body>
</html>
