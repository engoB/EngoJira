const COLOR_OPTIONS = [

  { name: 'Violet', value: 'from-purple-500 to-fuchsia-600' },

];

const NOTE_COLORS = [
  { name: 'Indigo', value: 'indigo', bar: 'bg-indigo-500' },
  { name: 'Émeraude', value: 'emerald', bar: 'bg-emerald-500' },
  { name: 'Ambre', value: 'amber', bar: 'bg-amber-500' },
  { name: 'Rose', value: 'rose', bar: 'bg-rose-500' },
  { name: 'Cyan', value: 'cyan', bar: 'bg-cyan-500' }
];
const noteBar = (v) => (NOTE_COLORS.find((c) => c.value === v) || NOTE_COLORS[0]).bar;

const MONTHS_FR = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];

const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
const uid = (p) => p + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);

const parseDate = (str) => { const d = new Date(String(str) + 'T00:00:00'); return isNaN(d.getTime()) ? new Date() : d; };
const formatDateIso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (d, n) => { const r = new Date(d.getTime()); r.setDate(r.getDate() + n); return r; };
const diffDays = (a, b) => Math.round((a.getTime() - b.getTime()) / 86400000);
const TODAY_STR = formatDateIso(new Date());
const formatDateFr = (iso) => parseDate(iso).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
const formatDayShort = (iso) => parseDate(iso).toLocaleDateString('fr-FR', { weekday: 'short', day: '2-digit', month: 'short' });

const getMonday = (d) => { const x = new Date(d.getTime()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); x.setHours(0, 0, 0, 0); return x; };
const getWeekNumber = (d) => {
  const date = new Date(d.getTime());
  date.setHours(0, 0, 0, 0);
  date.setDate(date.getDate() + 3 - ((date.getDay() + 6) % 7));
  const week1 = new Date(date.getFullYear(), 0, 4);
  return 1 + Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
};

// Fin incluse : une tâche d'un jour commence et finit le même jour.
const endFromDuration = (startIso, duration) => formatDateIso(addDays(parseDate(startIso), Math.max(0, Math.ceil(Number(duration) || 1) - 1)));
const durationFromEnd = (startIso, endIso, step) => {
  const d = diffDays(parseDate(endIso), parseDate(startIso)) + 1;
  return Math.max(step || 1, d);
};

const isIsoDate = (s) => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(new Date(s + 'T00:00:00').getTime());
const safeDate = (s) => (isIsoDate(s) ? s : TODAY_STR);
const safeNum = (v, fallback, min, step) => {
  const n = Number(v);
  if (!Number.isFinite(n) || n < min) return fallback;
  return step ? Math.round(n / step) * step : n;
};
const safeText = (v, fallback) => { const s = typeof v === 'string' ? v.trim() : ''; return s ? s.slice(0, 200) : fallback; };
const rawText = (v, max) => (typeof v === 'string' ? v.slice(0, max || 400) : '');

const triggerConfetti = () => {
  try { if (typeof window.confetti === 'function') window.confetti({ particleCount: 160, spread: 95, origin: { y: 0.6 }, disableForReducedMotion: true }); }
  catch (e) { /* no-op */ }
};

const initials = (name) => String(name || '?').split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
const AVATAR_COLORS = ['bg-indigo-600', 'bg-emerald-600', 'bg-amber-600', 'bg-rose-600', 'bg-cyan-600', 'bg-fuchsia-600', 'bg-teal-600'];
const avatarColor = (name) => {
  let h = 0; const s = String(name || '');
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
};

const b64encode = (str) => {
  try { return window.btoa(String.fromCharCode.apply(null, Array.from(new TextEncoder().encode(str)))); }
  catch (e) { return window.btoa(unescape(encodeURIComponent(str))); }
};
const b64decode = (str) => {
  try {
    const bin = window.atob(String(str).replace(/\s/g, ''));
    return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
  } catch (e) { return ''; }
};

/* ------------------------ Normalisation défensive ------------------------ */
const normalizeSubtask = (s, fallbackDate) => {
  const o = s && typeof s === 'object' ? s : {};
  return {
    id: o.id ? String(o.id) : uid('st'),
    title: safeText(o.title, 'Sous-tâche'),
    assignee: safeText(o.assignee, 'Non assigné'),
    status: STATUSES.includes(o.status) ? o.status : 'TODO',
    startDate: safeDate(o.startDate || fallbackDate),
    duration: safeNum(o.duration, 1, 0.5, 0.5),
    notes: rawText(o.notes, 2000)
  };
};

const normalizeCommentaire = (c) => {
  const o = c && typeof c === 'object' ? c : {};
  return {
    id: o.id ? String(o.id) : uid('c'),
    auteur: safeText(o.auteur, 'Quelqu’un'),
    texte: rawText(o.texte, 4000),
    date: typeof o.date === 'string' ? o.date : new Date().toISOString()
  };
};

const normalizeEvenement = (e) => {
  const o = e && typeof e === 'object' ? e : {};
  return {
    id: o.id ? String(o.id) : uid('a'),
    auteur: safeText(o.auteur, 'Quelqu’un'),
    texte: safeText(o.texte, 'a modifié la tâche'),
    date: typeof o.date === 'string' ? o.date : new Date().toISOString()
  };
};

const normalizeTask = (t, index) => {
  const o = t && typeof t === 'object' ? t : {};
  const startDate = safeDate(o.startDate);
  return {
    ref: typeof o.ref === 'string' && /^[A-Z]+-\d+$/.test(o.ref) ? o.ref : '',
    commentaires: Array.isArray(o.commentaires) ? o.commentaires.slice(-100).map(normalizeCommentaire) : [],
    journal: Array.isArray(o.journal) ? o.journal.slice(-30).map(normalizeEvenement) : [],
    bloquePar: Array.isArray(o.bloquePar) ? o.bloquePar.filter((x) => typeof x === 'string').slice(0, 10) : [],
    id: o.id ? String(o.id) : uid('t'),
    title: safeText(o.title, 'Tâche sans titre'),
    assignee: safeText(o.assignee, 'Non assigné'),
    startDate,
    duration: safeNum(o.duration, 1, 0.5, 0.5),
    status: STATUSES.includes(o.status) ? o.status : 'TODO',
    priority: PRIORITIES.includes(o.priority) ? o.priority : 'MEDIUM',
    rank: Number.isFinite(Number(o.rank)) ? Number(o.rank) : (index || 0),
    notes: rawText(o.notes, 4000),
    subtasks: Array.isArray(o.subtasks) ? o.subtasks.map((s) => normalizeSubtask(s, startDate)) : []
  };
};

const normalizeProject = (p) => {
  const o = p && typeof p === 'object' ? p : {};
  return {
    id: o.id ? String(o.id) : uid('proj'),
    title: safeText(o.title, 'Projet sans titre'),
    category: safeText(o.category, 'Général'),
    startDate: safeDate(o.startDate),
    duration: safeNum(o.duration, 10, 1, 1),
    color: typeof o.color === 'string' && o.color.startsWith('from-') ? o.color : DEFAULT_COLOR,
    tasks: Array.isArray(o.tasks) ? o.tasks.map(normalizeTask) : []
  };
};

const normalizeEntry = (e) => {
  const o = e && typeof e === 'object' ? e : {};
  return {
    id: o.id ? String(o.id) : uid('pe'),
    title: safeText(o.title, 'Entrée'),
    tag: safeText(o.tag, 'Général'),
    color: typeof o.color === 'string' && o.color.startsWith('from-') ? o.color : DEFAULT_COLOR,
    assignee: safeText(o.assignee, 'Non assigné'),
    startDate: safeDate(o.startDate),
    slot: o.slot === 'PM' ? 'PM' : 'AM',
    duration: safeNum(o.duration, 0.5, 0.5, 0.5),
    notes: rawText(o.notes, 2000)
  };
};

const normalizeNote = (n) => {
  const o = n && typeof n === 'object' ? n : {};
  return {
    id: o.id ? String(o.id) : uid('note'),
    title: rawText(o.title, 160),
    body: rawText(o.body, 40000),
    color: NOTE_COLORS.some((c) => c.value === o.color) ? o.color : 'indigo',
    projectId: o.projectId ? String(o.projectId) : '',
    pinned: !!o.pinned,
    updatedAt: typeof o.updatedAt === 'string' ? o.updatedAt : new Date().toISOString()
  };
};

const normalizeColumnLabels = (raw) => {
  const o = raw && typeof raw === 'object' ? raw : {};
  const out = {};
  STATUSES.forEach((s) => { out[s] = safeText(o[s], STATUS_META[s].label); });
  return out;
};

const DEFAULT_EVENT = { date: '2027-07-31', label: 'Jour J' };

const normalizeEvent = (raw) => {
  const o = raw && typeof raw === 'object' ? raw : {};
  return { date: safeDate(o.date) === TODAY_STR && !isIsoDate(o.date) ? DEFAULT_EVENT.date : safeDate(o.date), label: safeText(o.label, DEFAULT_EVENT.label) };
};

// Référence courte façon Jira : MAR-1, MAR-2… stable une fois attribuée.
const attribuerReferences = (projects) => {
  let max = 0;
  projects.forEach((p) => p.tasks.forEach((t) => {
    const m = /^MAR-(\d+)$/.exec(t.ref || '');
    if (m) max = Math.max(max, Number(m[1]));
  }));
  projects.forEach((p) => p.tasks.forEach((t) => { if (!t.ref) { max += 1; t.ref = 'MAR-' + max; } }));
  return projects;
};

const normalizeData = (raw) => {
  const o = raw && typeof raw === 'object' ? raw : {};
  return {
    columnLabels: normalizeColumnLabels(o.columnLabels),
    event: normalizeEvent(o.event),
    projects: attribuerReferences(Array.isArray(o.projects) ? o.projects.map(normalizeProject) : []),
    planning: Array.isArray(o.planning) ? o.planning.map(normalizeEntry)
      : Array.isArray(o.planningEntries) ? o.planningEntries.map(normalizeEntry) : [],
    notes: Array.isArray(o.notes) ? o.notes.map(normalizeNote) : []
  };
};

const SEED = normalizeData(SEED_RAW);

const loadJson = (key, fallback) => {
  try {
    const raw = window.localStorage.getItem(key);
    if (!raw) return fallback;
    const parsed = JSON.parse(raw);
    return parsed && typeof parsed === 'object' ? parsed : fallback;
  } catch (e) {
    try { window.localStorage.removeItem(key); } catch (e2) { /* no-op */ }
    return fallback;
  }
};
const saveJson = (key, value) => { try { window.localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; } };

const loadData = () => {
  const stored = loadJson(STORAGE_KEY, null);

  const clean = normalizeData(stored);
  if (clean.projects.length === 0 && clean.planning.length === 0 && clean.notes.length === 0) return SEED;

};

const detecterDepot = () => {

    return { owner: m[1], repo: segments.length ? segments[0] : m[1] + '.github.io' };
  } catch (e) { return { owner: '', repo: '' }; }
};

const idAppareil = () => {

const subtle = () => {
  const c = (typeof window !== 'undefined' && window.crypto) || (typeof globalThis !== 'undefined' && globalThis.crypto);
  return c && c.subtle ? c.subtle : null;
};
const alea = (n) => {
  const c = (typeof window !== 'undefined' && window.crypto) || globalThis.crypto;
  const out = new Uint8Array(n); c.getRandomValues(out); return out;
};
const versBase64 = (bytes) => {
  let bin = ''; const pas = 0x8000;
  for (let i = 0; i < bytes.length; i += pas) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + pas));
  return window.btoa(bin);
};
const depuisBase64 = (str) => Uint8Array.from(window.atob(String(str).replace(/\s/g, '')), (c) => c.charCodeAt(0));

const deriverCle = async (motDePasse, sel) => {
  const sub = subtle();
  if (!sub) throw new Error('chiffrement indisponible (page non sécurisée ?)');
  const base = await sub.importKey('raw', new TextEncoder().encode(String(motDePasse)), 'PBKDF2', false, ['deriveKey']);
  return sub.deriveKey({ name: 'PBKDF2', salt: new TextEncoder().encode('auraplan:' + sel), iterations: 60000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
};
// Le texte est compressé avant d'être chiffré : le fichier déposé est
// environ dix fois plus léger, ce qui allège aussi l'historique du dépôt.
const traverserFlux = async (flux, octets) => {
  const ecrivain = flux.writable.getWriter();
  ecrivain.write(octets);
  ecrivain.close();
  const lecteur = flux.readable.getReader();
  const morceaux = [];
  let total = 0;
  for (;;) {
    const { done, value } = await lecteur.read();
    if (done) break;
    morceaux.push(value);
    total += value.length;
  }
  const sortie = new Uint8Array(total);
  let position = 0;
  morceaux.forEach((m) => { sortie.set(m, position); position += m.length; });
  return sortie;
};

const compresser = async (texte) => {
  const octets = new TextEncoder().encode(texte);
  const CS = (typeof window !== 'undefined' && window.CompressionStream) || (typeof globalThis !== 'undefined' && globalThis.CompressionStream);
  if (typeof CS !== 'function') return { octets, compresse: false };
  try { return { octets: await traverserFlux(new CS('gzip'), octets), compresse: true }; }
  catch (e) { return { octets, compresse: false }; }
};

const decompresser = async (octets, compresse) => {
  if (!compresse) return new TextDecoder().decode(octets);
  const DS = (typeof window !== 'undefined' && window.DecompressionStream) || (typeof globalThis !== 'undefined' && globalThis.DecompressionStream);
  return new TextDecoder().decode(await traverserFlux(new DS('gzip'), octets));
};

const chiffrerTexte = async (cle, texte) => {
  const { octets, compresse } = await compresser(texte);
  const iv = alea(12);
  const ct = new Uint8Array(await subtle().encrypt({ name: 'AES-GCM', iv }, cle, octets));
  const out = new Uint8Array(12 + ct.length); out.set(iv, 0); out.set(ct, 12);
  return { charge: versBase64(out), compresse };
};

const dechiffrerTexte = async (cle, b64, compresse) => {
  const brut = depuisBase64(b64);
  const clair = await subtle().decrypt({ name: 'AES-GCM', iv: brut.subarray(0, 12) }, cle, brut.subarray(12));
  return decompresser(new Uint8Array(clair), !!compresse);
};

const COLLECTIONS = ['projects', 'planning', 'notes'];

// Représentation fichier : chaque fiche est une entrée repérée par son identifiant,
// ce qui permet de fusionner deux versions sans rien écraser à l'aveugle.
const versFichier = (data) => {
  const out = { meta: { columnLabels: data.columnLabels, event: data.event } };
  COLLECTIONS.forEach((c) => {
    const m = {};
    (data[c] || []).forEach((item, i) => { m[item.id] = { ...item, __ordre: i }; });
    out[c] = m;
  });
  return out;
};

const depuisFichier = (brut) => {
  const o = brut && typeof brut === 'object' ? brut : {};
  const meta = o.meta || {};
  const out = { columnLabels: meta.columnLabels, event: meta.event };
  COLLECTIONS.forEach((c) => {
    const liste = [];
    Object.keys(o[c] || {}).forEach((id) => { if (o[c][id]) liste.push(o[c][id]); });
    liste.sort((a, b) => (a.__ordre || 0) - (b.__ordre || 0));
    out[c] = liste.map((x) => { const y = { ...x }; delete y.__ordre; return y; });
  });
  return normalizeData(out);
};

// Fusion : pour chaque fiche, la version la plus récemment modifiée gagne ;
// une suppression ne revient pas si elle est postérieure à la dernière retouche.
const fusionner = (local, distant) => {
  const res = { contenu: { meta: null }, majs: { meta: 0 }, supprimes: {}, presence: {} };
  const lm = (local && local.majs) || {}; const dm = (distant && distant.majs) || {};
  const lc = (local && local.contenu) || {}; const dc = (distant && distant.contenu) || {};
  const ls = (local && local.supprimes) || {}; const ds = (distant && distant.supprimes) || {};

  res.contenu.meta = (dm.meta || 0) >= (lm.meta || 0) ? (dc.meta || lc.meta) : (lc.meta || dc.meta);
  res.majs.meta = Math.max(lm.meta || 0, dm.meta || 0);

  COLLECTIONS.forEach((c) => {
    res.contenu[c] = {}; res.majs[c] = {}; res.supprimes[c] = {};
    const suppr = {};
    Object.keys(ls[c] || {}).forEach((id) => { suppr[id] = Math.max(suppr[id] || 0, ls[c][id]); });
    Object.keys(ds[c] || {}).forEach((id) => { suppr[id] = Math.max(suppr[id] || 0, ds[c][id]); });
    res.supprimes[c] = suppr;

    const ids = new Set(Object.keys(lc[c] || {}).concat(Object.keys(dc[c] || {})));
    ids.forEach((id) => {
      const tl = (lm[c] && lm[c][id]) || 0;
      const td = (dm[c] && dm[c][id]) || 0;
      const gagnant = td >= tl ? ((dc[c] || {})[id] || (lc[c] || {})[id]) : ((lc[c] || {})[id] || (dc[c] || {})[id]);
      const quand = Math.max(tl, td);
      if (!gagnant) return;
      if (suppr[id] && suppr[id] >= quand) return;      // supprimée après sa dernière retouche
      res.contenu[c][id] = gagnant;
      res.majs[c][id] = quand;
    });
  });

  const pl = (local && local.presence) || {}; const pd = (distant && distant.presence) || {};
  Object.keys(pl).concat(Object.keys(pd)).forEach((id) => {
    const a = pl[id] || {}; const b = pd[id] || {};
    res.presence[id] = (b.vu || 0) > (a.vu || 0) ? b : a;
  });
  return res;
};

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }

  render() {
    if (this.state.error) {
      return (
        <div className="mx-auto mt-24 max-w-xl rounded-2xl border border-rose-500/40 bg-slate-900 p-8 text-slate-100">

      const d = addDays(timelineStart, i);
      const w = getWeekNumber(d);
      if (!current || current.weekNum !== w) { current = { weekNum: w, days: 0 }; weeks.push(current); }

  }, [timelineStart, totalDays]);

  const timelineMonths = useMemo(() => {

      const k = `${d.getFullYear()}-${d.getMonth()}`;
      if (k !== key) { key = k; current = { label: `${MONTHS_FR[d.getMonth()]} ${d.getFullYear()}`, days: 0 }; months.push(current); }
      current.days++;
    }
    return months;
  }, [timelineStart, totalDays]);

  const todayOffset = diffDays(parseDate(TODAY_STR), timelineStart);
  const eventOffset = diffDays(parseDate(event.date), timelineStart);

  /* ------------------------------ Planning ------------------------------ */
  const filteredPlanning = useMemo(() => {
    const q = search.trim().toLowerCase();
    return planning.filter((e) => {
      if (assigneeFilter !== 'ALL' && e.assignee !== assigneeFilter) return false;
      if (!q) return true;
      return (e.title + ' ' + e.tag + ' ' + e.assignee).toLowerCase().includes(q);

  const planningRows = useMemo(() => {
    const people = assigneeFilter === 'ALL' ? collaborators : collaborators.filter((c) => c === assigneeFilter);

        const startHalf = diffDays(parseDate(e.startDate), timelineStart) * 2 + (e.slot === 'PM' ? 1 : 0);
        return { ...e, startHalf, lenHalf: Math.max(1, Math.round(e.duration * 2)) };
      }).sort((a, b) => a.startHalf - b.startHalf);

      const lanes = []; const load = new Map();
      entries.forEach((e) => {
        let lane = lanes.findIndex((freeAt) => freeAt <= e.startHalf);
        if (lane === -1) { lane = lanes.length; lanes.push(e.startHalf + e.lenHalf); } else lanes[lane] = e.startHalf + e.lenHalf;
        e.lane = lane;
        for (let h = e.startHalf; h < e.startHalf + e.lenHalf; h++) load.set(h, (load.get(h) || 0) + 1);
      });
      const laneCount = Math.max(1, lanes.length);
      const conflicts = [];
      load.forEach((n, half) => { if (n > 1) conflicts.push({ half }); });
      return { person, entries, laneCount, load, conflicts, workload: entries.reduce((s, e) => s + e.lenHalf, 0) / 2, height: Math.max(66, laneCount * 30 + 22) };
    });

      const column = [];
      prev.projects.forEach((p) => p.tasks.forEach((t) => { if (t.status === status) column.push(t); }));
      column.sort((a, b) => a.rank - b.rank || a.title.localeCompare(b.title, 'fr'));

      const currentIndex = column.findIndex((t) => t.id === taskId);
      const without = column.filter((t) => t.id !== taskId);
      let target = clamp(Number.isFinite(index) ? index : without.length, 0, without.length);
      if (currentIndex !== -1 && currentIndex < target) target -= 1;
      without.splice(target, 0, moved);

      const ranks = new Map(without.map((t, i) => [t.id, i]));
      return {
        ...prev,
        projects: prev.projects.map((p) => ({
          ...p,
          tasks: p.tasks.map((t) => {

      .filter((n) => !q || (n.title + ' ' + n.body).toLowerCase().includes(q))

  /* ---------------------------- Zoom & cadrage ---------------------------- */

  /* ------------------- Défilement au clic maintenu (pan) ------------------- */
  const panRef = useRef(null);

    const onMove = (event) => {
      const p = panRef.current;
      if (!p) return;
      p.lastX = event.clientX;
      p.lastY = event.clientY;
      if (frame) return;
      frame = window.requestAnimationFrame(() => {
        frame = null;
        const cur = panRef.current;
        if (!cur) return;
        const dx = cur.lastX - cur.x;
        const dy = cur.lastY - cur.y;
        if (Math.abs(dx) > 2 || Math.abs(dy) > 2) cur.moved = true;
        // Écriture directe dans le DOM : aucun rendu React pendant le geste.

        cur.el.scrollTop = cur.top - dy;

    const onUp = () => {

      panRef.current = null;
      setPanning(false);

    };
    window.addEventListener('mousemove', onMove);

  }, [panning, syncViewport]);

  const [drag, setDrag] = useState(null);

  const rowRefs = useRef({});
  const survolRefs = useRef({});

    if (e.button !== 0) return;

    const map = rowRefs.current;

      if (!el || !el.getBoundingClientRect) continue;
      const r = el.getBoundingClientRect();
      if (r.height > 0 && clientY >= r.top && clientY <= r.bottom) return keys[i];
    }
    return null;
  };

  useEffect(() => {
    const onMove = (event) => {
      const d = dragRef.current;
      if (!d) return;
      const dx = event.clientX - d.startX;
      if (Math.abs(dx) > 3) movedRef.current = true;
      if (rafRef.current) window.cancelAnimationFrame(rafRef.current);
      rafRef.current = window.requestAnimationFrame(() => {
        const cur = dragRef.current;
        if (!cur) return;
        const unitPx = colWidthRef.current * cur.unit;
        const steps = Math.round(dx / unitPx);
        let snapStart = cur.startUnits;
        let snapLen = cur.lenUnits;
        if (cur.action === 'move') snapStart = Math.max(0, cur.startUnits + steps);
        else if (cur.action === 'resize-right') snapLen = Math.max(1, cur.lenUnits + steps);
        else if (cur.action === 'resize-left') {
          const shift = Math.min(steps, cur.lenUnits - 1);
          snapStart = Math.max(0, cur.startUnits + shift);
          snapLen = cur.lenUnits - (snapStart - cur.startUnits);
        }
        let targetPerson = cur.targetPerson;
        if (cur.kind === 'entry' && cur.action === 'move') {
          const hovered = personAtY(event.clientY);
          if (hovered) { targetPerson = hovered; if (hovered !== cur.person) movedRef.current = true; }
        }
        updateDrag({ ...cur, deltaX: dx, snapStart, snapLen, targetPerson });
      });
    };

    const onUp = () => {
      const d = dragRef.current;
      if (rafRef.current) window.cancelAnimationFrame(rafRef.current);
      updateDrag(null);
      if (!d || !movedRef.current) return;
      const personChanged = d.kind === 'entry' && d.targetPerson && d.targetPerson !== d.person;
      if (d.snapStart === d.startUnits && d.snapLen === d.lenUnits && !personChanged) return;

      if (d.kind === 'entry') {
        const startDate = formatDateIso(addDays(timelineStart, Math.floor(d.snapStart / 2)));
        const slot = d.snapStart % 2 === 1 ? 'PM' : 'AM';
        const duration = d.snapLen / 2;
        const assignee = d.targetPerson || d.person;
        commit((prev) => ({ ...prev, planning: prev.planning.map((e) => (e.id === d.id ? { ...e, startDate, slot, duration, assignee } : e)) }));
        if (personChanged) pushToast(`Transférée à ${assignee}`, 'success');
      } else if (d.kind === 'project') {
        const startDate = formatDateIso(addDays(timelineStart, d.snapStart));
        commit((prev) => ({ ...prev, projects: prev.projects.map((p) => (p.id === d.id ? { ...p, startDate, duration: d.snapLen } : p)) }));
      } else if (d.kind === 'task') {
        const startDate = formatDateIso(addDays(timelineStart, d.snapStart));
        commit((prev) => ({ ...prev, projects: prev.projects.map((p) => ({ ...p, tasks: p.tasks.map((t) => (t.id === d.id ? { ...t, startDate, duration: d.snapLen } : t)) })) }));
      } else if (d.kind === 'subtask') {
        const startDate = formatDateIso(addDays(timelineStart, d.snapStart));
        commit((prev) => ({
          ...prev,
          projects: prev.projects.map((p) => ({ ...p, tasks: p.tasks.map((t) => ({ ...t, subtasks: t.subtasks.map((s) => (s.id === d.id ? { ...s, startDate, duration: d.snapLen } : s)) })) }))
        }));
      }
    };

    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    return () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      if (rafRef.current) window.cancelAnimationFrame(rafRef.current);
    };
  }, [commit, timelineStart, updateDrag, pushToast]);

  /* ---------------------------- Raccourcis ---------------------------- */
  useEffect(() => {
    const onKey = (e) => {
      const tag = (e.target && e.target.tagName) || '';
      const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(tag) || (e.target && e.target.isContentEditable);
      if (e.key === 'Escape') { closeAllModals(); return; }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
      if (typing || anyModalOpen) return;
      if (e.key === '1') setActiveTab('roadmap');
      if (e.key === '2') setActiveTab('kanban');
      if (e.key === '3') setActiveTab('planning');
      if (e.key === '4') setActiveTab('notes');
      if (e.key.toLowerCase() === 't') scrollToToday();
      if (e.key.toLowerCase() === 'f') fitAll();
      if (e.key === 'ArrowLeft') { e.preventDefault(); scrollTimelineBy(-7); }
      if (e.key === 'ArrowRight') { e.preventDefault(); scrollTimelineBy(7); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [undo, closeAllModals, anyModalOpen, scrollToToday, fitAll, scrollTimelineBy]);

  /* --------------------------- Partage GitHub --------------------------- */
  const [syncEtat, setSyncEtat] = useState({ etat: 'inactif', message: '', dernier: 0, participants: [], ecritures: 0, lectures: 0 });
  const [isGuideOpen, setIsGuideOpen] = useState(false);

  useEffect(() => { saveJson(SYNC_KEY, sync); }, [sync]);

  const majsRef = useRef(loadJson('auraplan_majs_v22', { meta: 0, projects: {}, planning: {}, notes: {} }));
  const supprRef = useRef(loadJson('auraplan_suppr_v22', { projects: {}, planning: {}, notes: {} }));
  const dernierFichier = useRef(null);           // { contenu, majs, supprimes, presence }
  const dernierDistant = useRef(null);           // dernière version connue du dépôt
  const shaRef = useRef(null);
  const etagRef = useRef(null);        // empreinte de la dernière version lue
  const derniereActivite = useRef(Date.now());
  const appliqueDistant = useRef(false);
  const enCours = useRef(false);
  const aEcrire = useRef(false);
  const monAppareil = useRef(idAppareil()).current;

  const partageActif = unlocked && sync.actif && !!password && !!sync.owner && !!sync.repo;
  const peutEcrire = partageActif && !!sync.token;

  // À chaque changement local, on note l'heure de retouche de chaque fiche :
  // c'est ce qui permet de fusionner proprement avec la version du dépôt.
  useEffect(() => {
    const avant = dernierFichier.current ? dernierFichier.current.contenu : null;
    const apres = versFichier(data);
    const maintenant = Date.now();
    if (avant && !appliqueDistant.current) {
      if (JSON.stringify(avant.meta) !== JSON.stringify(apres.meta)) majsRef.current.meta = maintenant;
      COLLECTIONS.forEach((c) => {
        Object.keys(apres[c]).forEach((id) => {
          if (JSON.stringify(avant[c][id]) !== JSON.stringify(apres[c][id])) {
            majsRef.current[c][id] = maintenant;
            delete supprRef.current[c][id];
          }
        });
        Object.keys(avant[c]).forEach((id) => {
          if (!apres[c][id]) { supprRef.current[c][id] = maintenant; delete majsRef.current[c][id]; }
        });
      });
      aEcrire.current = true;
      derniereActivite.current = Date.now();
    } else if (!avant) {
      // Première ouverture : si l'appareil n'a que la démonstration, elle ne doit
      // rien revendiquer, sinon elle écraserait le tableau déjà présent dans le dépôt.
      const seulementDemo = JSON.stringify(versFichier(data)) === JSON.stringify(versFichier(SEED));
      const depart = seulementDemo ? 0 : maintenant;
      majsRef.current.meta = majsRef.current.meta || depart;
      COLLECTIONS.forEach((c) => Object.keys(apres[c]).forEach((id) => {
        majsRef.current[c][id] = majsRef.current[c][id] || depart;
      }));
    }
    dernierFichier.current = { contenu: apres, majs: majsRef.current, supprimes: supprRef.current,
      presence: (dernierFichier.current && dernierFichier.current.presence) || {} };
    saveJson('auraplan_majs_v22', majsRef.current);
    saveJson('auraplan_suppr_v22', supprRef.current);
    appliqueDistant.current = false;
  }, [data]);

  const cheminApi = useCallback(() => `https://api.github.com/repos/${sync.owner}/${sync.repo}/contents/${FICHIER}`, [sync.owner, sync.repo]);

  const lireDistant = useCallback(async (cle) => {
    // Avec un jeton : l'API, toujours fraîche. Sans jeton : le fichier brut, avec anti-cache.
    if (sync.token) {
      const entetes = { Authorization: `Bearer ${sync.token}`, Accept: 'application/vnd.github+json' };
      if (etagRef.current) entetes['If-None-Match'] = etagRef.current;
      const r = await fetch(`${cheminApi()}?ref=${encodeURIComponent(sync.branch)}`, { headers: entetes, cache: 'no-store' });
      if (r.status === 304) return { inchange: true };          // rien n'a bougé : aucun octet transféré
      try { const et = r.headers && r.headers.get && r.headers.get('ETag'); if (et) etagRef.current = et; } catch (e) { /* no-op */ }
      if (r.status === 404) return { absent: true };
      if (r.status === 401 || r.status === 403) throw new Error(r.status === 401 ? 'jeton refusé' : 'accès refusé (droits du jeton ?)');
      if (!r.ok) throw new Error('lecture impossible (' + r.status + ')');
      const j = await r.json();
      shaRef.current = j.sha;
      const texte = new TextDecoder().decode(depuisBase64(j.content || ''));
      return { fichier: JSON.parse(texte) };
    }
    const url = `https://raw.githubusercontent.com/${sync.owner}/${sync.repo}/${sync.branch}/${FICHIER}?t=${Date.now()}`;
    const entetesBrut = etagRef.current ? { 'If-None-Match': etagRef.current } : {};
    const r = await fetch(url, { cache: 'no-store', headers: entetesBrut });
    if (r.status === 304) return { inchange: true };
    try { const et = r.headers && r.headers.get && r.headers.get('ETag'); if (et) etagRef.current = et; } catch (e) { /* no-op */ }
    if (r.status === 404) return { absent: true };
    if (!r.ok) throw new Error('lecture impossible (' + r.status + ')');
    return { fichier: JSON.parse(await r.text()) };
  }, [sync.token, sync.branch, sync.owner, sync.repo, cheminApi]);

  const ecrireDistant = useCallback(async (charge, sha) => {
    const r = await fetch(cheminApi(), {
      method: 'PUT',
      headers: { Authorization: `Bearer ${sync.token}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: `Tableau mis à jour — ${new Date().toLocaleString('fr-FR')}`,
        content: versBase64(new TextEncoder().encode(JSON.stringify(charge))),
        branch: sync.branch,
        ...(sha ? { sha } : {})
      })
    });
    if (r.status === 409 || r.status === 422) return { conflit: true };
    if (r.status === 401) throw new Error('jeton refusé');
    if (r.status === 403) throw new Error('le jeton n’a pas le droit d’écrire');
    if (r.status === 404) throw new Error('dépôt ou branche introuvable');
    if (!r.ok) throw new Error('écriture impossible (' + r.status + ')');
    const j = await r.json();
    shaRef.current = j.content && j.content.sha;
    return { ok: true };
  }, [cheminApi, sync.token, sync.branch]);

  const synchroniser = useCallback(async (forcerEcriture) => {
    if (!partageActif || enCours.current) return;
    enCours.current = true;
    let cle = null;
    try {
      cle = await deriverCle(password, sync.owner + '/' + sync.repo);
      setSyncEtat((p) => ({ ...p, etat: 'travail', message: '' }));

      let distant = null;
      const lu = await lireDistant(cle);
      if (lu.inchange && !aEcrire.current && !forcerEcriture) {
        setSyncEtat((p) => ({ ...p, etat: peutEcrire ? 'ok' : 'lecture', message: '', dernier: Date.now() }));
        enCours.current = false;
        return;
      }
      if (lu.inchange) { distant = dernierDistant.current; }
      else if (!lu.absent) {
        const enveloppe = lu.fichier;
        if (!enveloppe || enveloppe.format !== 'auraplan1') throw new Error('fichier non reconnu');
        let clair = null;
        try { clair = JSON.parse(await dechiffrerTexte(cle, enveloppe.charge, enveloppe.compresse)); }
        catch (e) { throw new Error('mot de passe différent de celui du tableau'); }
        distant = clair;
        dernierDistant.current = clair;
      }

      const local = dernierFichier.current;
      const fusion = distant ? fusionner(local, distant) : { ...local, presence: (local && local.presence) || {} };

      // Ce que le dépôt sait et que nous n'avions pas encore
      const nouveauLocal = depuisFichier(fusion.contenu);
      const changeLocalement = JSON.stringify(versFichier(dataRef.current)) !== JSON.stringify(versFichier(nouveauLocal));
      if (changeLocalement) {
        appliqueDistant.current = true;
        majsRef.current = fusion.majs;
        supprRef.current = fusion.supprimes;
        dataRef.current = nouveauLocal;
        setData(nouveauLocal);
        dernierFichier.current = { contenu: versFichier(nouveauLocal), majs: fusion.majs, supprimes: fusion.supprimes, presence: fusion.presence };
      } else {
        dernierFichier.current = { contenu: versFichier(dataRef.current), majs: fusion.majs, supprimes: fusion.supprimes, presence: fusion.presence };
        majsRef.current = fusion.majs;
        supprRef.current = fusion.supprimes;
      }

      const participants = Object.keys(fusion.presence || {}).map((id) => ({ id, ...fusion.presence[id] }))
        .filter((p) => p && p.nom).sort((a, b) => (b.vu || 0) - (a.vu || 0));

      // Écriture : seulement si nous avons du neuf, ou si le dépôt est vide.
      const distantDiffere = !distant || JSON.stringify(distant.contenu) !== JSON.stringify(fusion.contenu);
      const doitEcrire = peutEcrire && (forcerEcriture || aEcrire.current || !distant || distantDiffere);

      if (doitEcrire) {
        const presence = { ...(fusion.presence || {}) };
        presence[monAppareil] = { nom: sync.nom || collabNomParDefaut, vu: Date.now() };
        const paquet = await chiffrerTexte(cle, JSON.stringify({
          contenu: fusion.contenu, majs: fusion.majs, supprimes: fusion.supprimes, presence
        }));
        const charge = {
          format: 'auraplan1',
          compresse: paquet.compresse,
          modifie: new Date().toISOString(),
          charge: paquet.charge
        };
        const res = await ecrireDistant(charge, shaRef.current);
        if (res && res.conflit) {                       // quelqu'un a écrit entre-temps : on refait un tour
          shaRef.current = null;
          enCours.current = false;
          window.setTimeout(() => synchroniser(true), 400);
          return;
        }
        aEcrire.current = false;
        etagRef.current = null;
        dernierDistant.current = { contenu: fusion.contenu, majs: fusion.majs, supprimes: fusion.supprimes, presence };
        dernierFichier.current.presence = presence;
        setSyncEtat((p) => ({ ...p, etat: 'ok', message: '', dernier: Date.now(), participants, ecritures: p.ecritures + 1 }));
      } else {
        setSyncEtat((p) => ({ ...p, etat: peutEcrire ? 'ok' : 'lecture', message: '', dernier: Date.now(), participants, lectures: p.lectures + 1 }));
      }
    } catch (err) {
      setSyncEtat((p) => ({ ...p, etat: 'erreur', message: String((err && err.message) || err) }));
    } finally {
      enCours.current = false;
    }
  }, [partageActif, peutEcrire, password, sync.owner, sync.repo, sync.nom, lireDistant, ecrireDistant, monAppareil]);

  const collabNomParDefaut = 'Invité';

  // Première synchronisation, puis relève régulière.
  useEffect(() => {
    if (!partageActif) { setSyncEtat((p) => ({ ...p, etat: 'inactif', message: '' })); return undefined; }
    let vivant = true;
    const tour = () => { if (vivant) synchroniser(false); };
    tour();
    const rythme = () => {
      const inactifDepuis = Date.now() - derniereActivite.current;
      if (!sync.token) return 30000;
      if (inactifDepuis < 3 * 60000) return 8000;      // on travaille : relève rapprochée
      if (inactifDepuis < 20 * 60000) return 30000;    // pause courte
      return 120000;                                    // onglet oublié en arrière-plan
    };
    let minuteur = window.setTimeout(function boucle() {
      tour();
      minuteur = window.setTimeout(boucle, rythme());
    }, rythme());
    const surRetour = () => { if (document.visibilityState === 'visible') tour(); };
    document.addEventListener('visibilitychange', surRetour);
    return () => { vivant = false; window.clearTimeout(minuteur); document.removeEventListener('visibilitychange', surRetour); };
  }, [partageActif, synchroniser, sync.token]);

  // Envoi rapide après une modification locale.
  const minuteurEnvoi = useRef(null);
  useEffect(() => {
    if (!peutEcrire) return undefined;
    if (minuteurEnvoi.current) window.clearTimeout(minuteurEnvoi.current);
    minuteurEnvoi.current = window.setTimeout(() => { if (aEcrire.current) synchroniser(true); }, 1500);
    return () => { if (minuteurEnvoi.current) window.clearTimeout(minuteurEnvoi.current); };
  }, [data, peutEcrire, synchroniser]);

  const participantsActifs = useMemo(() => {
    const limite = Date.now() - 5 * 60000;
    return (syncEtat.participants || []).filter((p) => (p.vu || 0) > limite && p.id !== monAppareil);
  }, [syncEtat.participants, monAppareil]);

  const adresseTableau = useMemo(() => {
    try { return window.location.origin + window.location.pathname; } catch (e) { return ''; }
  }, []);

  const copierAdresse = async () => {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(adresseTableau);
      else throw new Error('presse-papiers indisponible');
      pushToast('Adresse copiée', 'success');
    } catch (e) { pushToast('Copiez l’adresse affichée', 'info'); }
  };

  /* --------------------------- Import / export --------------------------- */
  const fileInputRef = useRef(null);
  const exportJson = () => {
    try {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `auraplan-${TODAY_STR}.json`; a.click();
      window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      pushToast('Sauvegarde exportée', 'success');
    } catch (err) { pushToast('Export impossible dans ce navigateur', 'error'); }
  };
  const importJson = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { try { commit(normalizeData(JSON.parse(String(reader.result))), 'Données importées'); } catch (err) { pushToast('Fichier illisible : JSON invalide', 'error'); } };
    reader.onerror = () => pushToast('Lecture du fichier impossible', 'error');
    reader.readAsText(file);
  };

  /* ------------------------------ Écran d'accueil ------------------------------ */
  const [passDraft, setPassDraft] = useState('');
  const [rememberPass, setRememberPass] = useState(true);

  const enterBoard = (value, solo) => {
    const pass = String(value || '').trim();
    if (!solo && !pass) return;
    setPassword(solo ? '' : pass);
    setUnlocked(true);
    if (rememberPass || solo) saveJson(PASS_KEY, solo ? { solo: true, value: '' } : { value: pass });
    else saveJson(PASS_KEY, {});
    if (solo) setSync((c) => ({ ...c, actif: false }));
  };

  const leaveBoard = () => {
    saveJson(PASS_KEY, {});
    setPassword(''); setPassDraft(''); setUnlocked(false);
  };

  const creerDepuisColonne = (colonne, titre) => {
    const propre = String(titre || '').trim();
    if (!propre) return;
    const projet = selectedProject || projects[0];
    if (!projet) { pushToast('Créez d’abord un projet', 'error'); return; }
    const base = { title: propre, assignee: collaborators[0] || monNom(), startDate: TODAY_STR,
      duration: 2, status: 'TODO', priority: 'MEDIUM', notes: '' };
    if (colonne.statut) base.status = colonne.statut;
    if (grouperPar === 'assignee') base.assignee = colonne.titre;
    if (grouperPar === 'priority') base.priority = PRIORITIES.find((pr) => PRIORITY_META[pr].label === colonne.titre) || 'MEDIUM';
    const maxRank = allTasks.filter((t) => t.status === base.status).reduce((m, t) => Math.max(m, t.rank), -1);
    const tache = normalizeTask({ ...base, id: uid('t'), rank: maxRank + 1, subtasks: [],
      journal: [{ id: uid('a'), auteur: monNom(), texte: 'a créé la tâche', date: new Date().toISOString() }] });
    commit((prev) => ({ ...prev, projects: prev.projects.map((p) => (p.id === projet.id ? { ...p, tasks: [...p.tasks, tache] } : p)) }));
    setAjoutRapide({ colonne: colonne.id, texte: '' });
  };

  /* --------------------------------- Rendu --------------------------------- */
  const timelineWidth = totalDays * columnWidth;

  const dense = columnWidth < 34;      // trop étroit pour le jour de la semaine
  const ultra = columnWidth < 16;      // trop étroit pour le moindre chiffre

  const buildDayHeader = (withHalves) => (
    <div className="flex" style={{ width: `${timelineWidth}px` }}>
      {Array.from({ length: totalDays }).map((_, i) => {
        const d = addDays(timelineStart, i);
        const iso = formatDateIso(d);
        const isToday = iso === TODAY_STR;
        const isEvent = iso === event.date;
        const isWeekend = d.getDay() === 0 || d.getDay() === 6;
        const count = dayLoad.get(i) || 0;
        return (
          <div key={i} style={{ width: `${columnWidth}px`, minWidth: `${columnWidth}px` }}
            className={`relative flex h-full flex-col justify-between overflow-visible border-r ${T.grid} ${d.getDay() === 1 ? 'border-l-2 border-l-indigo-500/40' : ''}
              ${isEvent ? 'jour-j-col border-x-2 border-x-rose-400/80 text-rose-300' : isToday ? 'bg-indigo-500/25 text-indigo-300' : isWeekend ? (isDark ? 'bg-white/[0.03] text-slate-500' : 'bg-slate-100 text-slate-400') : T.muted}`}>
            {isEvent ? (
              <span className="jour-j-pin pointer-events-none absolute -top-0.5 left-1/2 z-20 -translate-x-1/2 text-[10px]" title={`${event.label} — ${formatDateFr(event.date)}`}>💍</span>
            ) : null}
            {ultra ? (
              <div className="flex h-full items-end justify-center pb-1">
                {d.getDate() === 1 ? <span className="h-2 w-0.5 rounded bg-indigo-400" /> : null}
              </div>
            ) : (
              <>
                <div className={`flex items-center justify-between pt-1 ${dense ? 'px-0 justify-center' : 'px-1.5'}`}>
                  <span className="flex items-baseline gap-1">
                    {dense ? null : <span className="text-[9px] font-bold uppercase">{d.toLocaleDateString('fr-FR', { weekday: 'short' }).slice(0, 2)}</span>}
                    <span className={`${dense ? 'text-[9px]' : 'text-[11px]'} font-extrabold`}>{d.getDate()}</span>
                  </span>
                  {withHalves && count > 0 && columnWidth >= 62 ? <span className="rounded-full bg-indigo-600 px-1.5 text-[8px] font-extrabold text-white">{count}</span> : null}
                </div>
                {withHalves ? (
                  <div className={`mt-1 flex border-t ${T.grid} text-[8px] font-bold`}>
                    <div className={`w-1/2 border-r ${T.grid} py-0.5 text-center text-amber-400`}>{columnWidth >= 56 ? '☀ AM' : dense ? '' : '☀'}</div>
                    <div className="w-1/2 py-0.5 text-center text-indigo-300">{columnWidth >= 56 ? '☾ PM' : dense ? '' : '☾'}</div>
                  </div>
                ) : <div className="h-1" />}
              </>
            )}
          </div>
        );
      })}
    </div>
  );

  const dayHeaderPlain = useMemo(() => buildDayHeader(false), [columnWidth, totalDays, timelineStart, isDark, event.date]);   // eslint-disable-line react-hooks/exhaustive-deps
  const dayHeaderHalves = useMemo(() => buildDayHeader(true), [columnWidth, totalDays, timelineStart, isDark, event.date, dayLoad]);   // eslint-disable-line react-hooks/exhaustive-deps

  // La grille est peinte en CSS (un seul nœud par ligne) : sans cela le navigateur
  // recalculait des milliers de cellules à chaque image pendant un déplacement.
  const gridStyle = useMemo(() => {
    const col = columnWidth;
    const semaine = col * 7;
    const trait = isDark ? 'rgba(148,163,184,.16)' : 'rgba(100,116,139,.20)';
    const lundi = 'rgba(99,102,241,.28)';
    const weekend = isDark ? 'rgba(255,255,255,.03)' : 'rgba(148,163,184,.13)';
    return {
      backgroundImage: [
        `repeating-linear-gradient(to right, ${lundi} 0 2px, transparent 2px ${semaine}px)`,
        `repeating-linear-gradient(to right, transparent 0 ${col * 5}px, ${weekend} ${col * 5}px ${semaine}px)`,
        `repeating-linear-gradient(to right, transparent 0 ${Math.max(0, col - 1)}px, ${trait} ${Math.max(0, col - 1)}px ${col}px)`
      ].join(','),
      backgroundSize: `${semaine}px 100%, ${semaine}px 100%, ${col}px 100%`,
      backgroundRepeat: 'repeat'
    };
  }, [columnWidth, isDark]);

  const GridBackground = () => (
    <>
      <div className="pointer-events-none absolute inset-0" style={gridStyle} />
      {todayOffset >= 0 && todayOffset < totalDays ? (
        <div className="pointer-events-none absolute inset-y-0 bg-indigo-500/12"
          style={{ left: `${todayOffset * columnWidth}px`, width: `${columnWidth}px` }} />
      ) : null}
      {eventOffset >= 0 && eventOffset < totalDays ? (
        <div className="jour-j-col pointer-events-none absolute inset-y-0 border-x-2 border-rose-400/80"
          style={{ left: `${eventOffset * columnWidth}px`, width: `${columnWidth}px` }} />
      ) : null}
    </>
  );

  const isEventBar = (startIso, duration) => {
    const s = parseDate(startIso);
    const e = addDays(s, Math.max(0, Math.ceil(duration) - 1));
    const ev = parseDate(event.date);
    return ev >= s && ev <= e;
  };

  const barGeometry = (startUnits, lenUnits, isDragging) => {
    let left = startUnits * columnWidth;
    let width = lenUnits * columnWidth;
    if (isDragging) {
      if (drag.action === 'move') left += drag.deltaX;
      else if (drag.action === 'resize-left') { left += drag.deltaX; width -= drag.deltaX; }
      else width += drag.deltaX;
    }
    return { left, width };
  };

  if (!unlocked) {
    return (
      <div className={`flex h-screen items-center justify-center p-6 ${T.app}`}>
        <div className={`w-full max-w-sm rounded-2xl border p-6 shadow-2xl ${T.panel}`}>
          <div className="mb-5 flex items-center gap-3">
            <div className="flex h-11 w-11 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 to-fuchsia-600 text-xl font-black text-white shadow-lg">Δ</div>
            <div>
              <h1 className="text-sm font-extrabold tracking-tight">AuraPlan Studio</h1>
              <p className={`text-[11px] ${T.faint}`}>Le tableau du mariage</p>
            </div>
          </div>

          <form onSubmit={(e) => { e.preventDefault(); enterBoard(passDraft, false); }}>
            <Field T={T} label="Votre prénom" hint="Pour que les autres sachent qui a travaillé sur le tableau.">
              <input className={inputCls} value={sync.nom}
                onChange={(e) => setSync({ ...sync, nom: e.target.value.slice(0, 40) })} placeholder="Ex. Magalie" />
            </Field>
            <div className="mt-3" />
            <Field T={T} label="Mot de passe partagé" hint="Le même pour tout le monde : il ouvre le tableau et chiffre les échanges.">
              <input type="password" autoFocus className={inputCls} value={passDraft}
                onChange={(e) => setPassDraft(e.target.value)} placeholder="••••••••" />
            </Field>
            <label className={`mt-3 flex items-center gap-2 text-[11px] ${T.muted}`}>
              <input type="checkbox" className="h-3.5 w-3.5 accent-indigo-500" checked={rememberPass} onChange={(e) => setRememberPass(e.target.checked)} />
              Retenir sur cet appareil
            </label>
            <button type="submit" disabled={!passDraft.trim()} className={`mt-4 w-full ${btnPrimary} ${!passDraft.trim() ? 'opacity-40' : ''}`}>Ouvrir le tableau</button>
          </form>

          <button type="button" onClick={() => enterBoard('', true)} className={`mt-2 w-full ${btnQuiet}`}>Travailler seul, sur cet appareil</button>

          {!pageSecurisee() ? (
            <div className="mt-4 rounded-xl border border-amber-500/40 bg-amber-500/10 p-3 text-[11px] leading-relaxed text-amber-200">
              Cette page n'est pas ouverte en <strong>https</strong>. Le partage a besoin du chiffrement du navigateur,
              qui n'est disponible qu'en https : ouvrez l'adresse <span className="font-mono">https://…github.io/…</span>
              plutôt que le fichier depuis votre disque. Vous pouvez tout de même travailler seul.
            </div>
          ) : null}

          <p className={`mt-5 border-t pt-4 text-[10px] leading-relaxed ${T.border} ${T.faint}`}>
            Le tableau est conservé, chiffré, dans votre dépôt GitHub. Toute personne ayant cette adresse
            et ce mot de passe le retrouve, depuis n'importe quel ordinateur.
          </p>
        </div>
      </div>
    );
  }

  return (
    <div className={`flex h-screen flex-col overflow-hidden ${T.app} ${drag ? 'is-dragging' : ''}`}>

      {/* ------------------------------ En-tête ------------------------------ */}
      <header className={`flex shrink-0 flex-wrap items-center justify-between gap-3 border-b px-4 py-2.5 ${T.rail} ${T.border}`}>
        <div className="flex items-center gap-5">
          <div className="flex items-center gap-2.5">
            <div className="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 to-fuchsia-600 text-lg font-black text-white shadow-lg shadow-indigo-950/50">Δ</div>
            <div className="leading-tight">
              <div className="text-sm font-extrabold tracking-tight">AuraPlan Studio</div>
              <div className={`text-[10px] font-medium ${T.faint}`}>Projet › tâche › sous-tâche</div>
            </div>
          </div>
          <nav className={`flex rounded-xl border p-1 ${T.raise}`}>
            {[
              { id: 'roadmap', label: 'Roadmap', key: '1' },
              { id: 'kanban', label: 'Kanban', key: '2' },
              { id: 'planning', label: 'Planning', key: '3' },
              { id: 'notes', label: 'Notes', key: '4' }
            ].map((tab) => (
              <button key={tab.id} type="button" onClick={() => setActiveTab(tab.id)}
                className={`rounded-lg px-3.5 py-1.5 text-xs font-bold transition ${activeTab === tab.id ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-950/40' : `${T.muted} hover:text-indigo-400`}`}>
                {tab.label}<span className="ml-1.5 hidden font-mono text-[9px] opacity-50 sm:inline">{tab.key}</span>
              </button>
            ))}
          </nav>
        </div>

        <div className="flex items-center gap-2">
          <input type="search" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Rechercher…"
            className={`hidden w-44 rounded-xl border px-3 py-2 text-xs outline-none focus:border-indigo-500 md:block ${inputCls}`} />
          {activeTab !== 'notes' ? (
            <>
            <button type="button"
              onClick={() => setAssigneeFilter(assigneeFilter === (sync.nom || '') ? 'ALL' : (sync.nom || 'ALL'))}
              title="N'afficher que ce qui m'est assigné"
              className={`hidden shrink-0 rounded-xl px-2.5 py-2 text-xs font-bold transition lg:block
                ${assigneeFilter !== 'ALL' && assigneeFilter === sync.nom ? 'border border-indigo-500 bg-indigo-600 text-white' : btnSecondary}`}>
              Mes tâches
            </button>
            <select value={assigneeFilter} onChange={(e) => setAssigneeFilter(e.target.value)} className={`hidden w-32 lg:block ${inputCls}`}>
              <option value="ALL">Toute l'équipe</option>
              {collaborators.map((c) => <option key={c} value={c}>{c}</option>)}
            </select>
            </>
          ) : null}
          <button type="button" onClick={() => setIsDark(!isDark)} className={btnQuiet} title="Changer de thème">{isDark ? '☀' : '☾'}</button>
          <button type="button" onClick={() => setIsHelpOpen(true)} className={btnQuiet} title="Aide">?</button>
          <button type="button" onClick={() => setIsConfigOpen(true)} className={btnSecondary}
            title={syncEtat.etat === 'erreur' ? `Partage en erreur : ${syncEtat.message}`
              : syncEtat.etat === 'lecture' ? 'Lecture seule — ajoutez un jeton pour enregistrer'
                : syncEtat.etat === 'ok' ? (participantsActifs.length ? `Avec ${participantsActifs.map((p) => p.nom).join(', ')}` : 'Tableau partagé et enregistré')
                  : syncEtat.etat === 'travail' ? 'Synchronisation…' : 'Partage inactif'}>
            <span className="flex items-center gap-1.5">
              <span className={`h-2 w-2 rounded-full ${syncEtat.etat === 'ok' ? 'bg-emerald-400'
                : syncEtat.etat === 'travail' ? 'bg-amber-400 animate-pulse'
                  : syncEtat.etat === 'lecture' ? 'bg-sky-400'
                    : syncEtat.etat === 'erreur' ? 'bg-rose-500' : 'bg-slate-500'}`} />
              {participantsActifs.length ? (
                <span className="flex -space-x-1.5">
                  {participantsActifs.slice(0, 4).map((p) => <Avatar key={p.id} name={p.nom} size="sm" />)}
                </span>
              ) : null}
              {syncEtat.etat === 'ok' ? 'Partagé' : syncEtat.etat === 'lecture' ? 'Lecture seule'
                : syncEtat.etat === 'erreur' ? 'À régler' : syncEtat.etat === 'travail' ? '…' : 'Partager'}
            </span>
          </button>
          <button type="button" className={btnPrimary}
            onClick={() => {
              if (activeTab === 'planning') openEntryCreator(collaborators[0] || 'Moi', Math.max(0, todayOffset), 'AM');
              else if (activeTab === 'notes') createNote(null);
              else if (activeTab === 'kanban') setTaskForm({ id: null, projectId: selectedProjectId || (projects[0] && projects[0].id) || '', title: '', assignee: collaborators[0] || 'Moi', startDate: TODAY_STR, duration: 2, status: 'TODO', priority: 'MEDIUM', notes: '' });
              else setProjectForm({ id: null, title: '', category: 'Général', startDate: TODAY_STR, duration: 30, color: DEFAULT_COLOR });
            }}>
            {activeTab === 'planning' ? 'Planifier' : activeTab === 'notes' ? 'Nouvelle note' : activeTab === 'kanban' ? 'Nouvelle tâche' : 'Nouveau projet'}
          </button>
        </div>
      </header>

      {/* --------------------------- Barre d'outils --------------------------- */}
      {activeTab !== 'notes' ? (
        <div className={`flex shrink-0 flex-wrap items-center justify-between gap-3 border-b px-4 py-2 text-xs ${T.panel}`}>
          <div className="flex flex-wrap items-center gap-2">
            {activeTab === 'roadmap' ? (
              <>
                <button type="button" onClick={() => setIsLeftPanelOpen(!isLeftPanelOpen)} className={btnSecondary}>{isLeftPanelOpen ? 'Réduire la colonne' : 'Afficher la colonne'}</button>
                <button type="button" onClick={() => setIsRightPanelOpen(!isRightPanelOpen)} className={btnSecondary}>{isRightPanelOpen ? 'Masquer le détail' : 'Afficher le détail'}</button>
                <button type="button" onClick={scrollToEvent} className={btnSecondary} title={`Aller au ${event.label}`}>💍 Jour J</button>
                <button type="button" onClick={scrollToToday} className={btnSecondary}>Aujourd'hui</button>
                <span className={`ml-1 hidden text-[11px] 2xl:inline ${T.faint}`}>Clic maintenu sur la grille pour faire défiler · ← → pour avancer d'une semaine</span>
              </>
            ) : null}
            {activeTab === 'planning' ? (
              <>
                <button type="button" onClick={focusSprint} className={btnPrimary}>Sprint 2 semaines</button>
                <button type="button" onClick={scrollToToday} className={btnSecondary}>Aujourd'hui</button>
                <span className={`ml-1 hidden text-[11px] xl:inline ${T.faint}`}>Glissez un bloc vers une autre ligne pour changer de collaborateur</span>
              </>
            ) : null}
            {activeTab === 'kanban' ? (
              <>
                <span className={`text-[11px] font-semibold ${T.faint}`}>Grouper par</span>
                <div className={`flex rounded-xl border p-0.5 ${T.raise}`}>
                  {[{ id: 'status', label: 'Statut' }, { id: 'assignee', label: 'Personne' }, { id: 'priority', label: 'Priorité' }].map((opt) => (
                    <button key={opt.id} type="button" onClick={() => setGrouperPar(opt.id)}
                      className={`rounded-lg px-2.5 py-1 text-[11px] font-bold transition ${grouperPar === opt.id ? 'bg-indigo-600 text-white' : `${T.muted} hover:text-indigo-400`}`}>
                      {opt.label}
                    </button>
                  ))}
                </div>
                <span className={`ml-1 hidden text-[11px] 2xl:inline ${T.faint}`}>Glissez les cartes pour les déplacer et les réordonner</span>
              </>
            ) : null}
          </div>

          <div className="flex items-center gap-3">
            <button type="button" onClick={() => setIsConfigOpen(true)}
              title={`${event.label} — ${formatDateFr(event.date)} (cliquez pour changer la date)`}
              className="flex items-center gap-1.5 rounded-xl border border-rose-500/40 bg-rose-500/10 px-2.5 py-1.5 text-[11px] font-extrabold text-rose-300 transition hover:bg-rose-500/20">
              <span className="jour-j-pin">💍</span>
              {daysToEvent > 0 ? `J-${daysToEvent}` : daysToEvent === 0 ? "C'est aujourd'hui" : `J+${Math.abs(daysToEvent)}`}
              <span className="hidden font-mono font-medium opacity-70 xl:inline">{formatDateFr(event.date)}</span>
            </button>
            <button type="button" onClick={undo} className={btnQuiet} title="Ctrl+Z">Annuler</button>
            {activeTab !== 'kanban' ? (
              <>
                <span className={`font-semibold ${T.faint}`}>Zoom</span>
                <input type="range" min="3" max="240" value={columnWidth} onChange={(e) => setColumnWidth(Number(e.target.value))} className="w-28" aria-label="Zoom" />
                <button type="button" onClick={fitAll} className={btnSecondary}>Tout afficher</button>
              </>
            ) : null}
          </div>
        </div>
      ) : null}

      {/* ------------------------------ Contenu ------------------------------ */}
      <main className="relative flex flex-1 overflow-hidden">

        {/* Rappel discret du Jour J lorsqu'il est hors de l'écran */}
        {activeTab === 'roadmap' && viewport.width > 0 && eventOffset >= 0 ? (() => {
          const eventX = nameColWidth + eventOffset * columnWidth;
          const gauche = eventX < viewport.left + nameColWidth;
          const droite = eventX > viewport.left + viewport.width - 12;
          if (!gauche && !droite) return null;
          return (
            <button type="button" onClick={scrollToEvent}
              title={`${event.label} — ${formatDateFr(event.date)} · cliquez pour y aller`}
              className={`group absolute top-1/2 z-[45] flex -translate-y-1/2 items-center gap-1 rounded-full border border-rose-400/40 bg-rose-500/15 px-2 py-1.5 text-[10px] font-bold text-rose-300 opacity-60 backdrop-blur transition hover:opacity-100
                ${droite ? 'right-2' : 'left-2'} ${isRightPanelOpen && droite ? 'lg:right-[21rem]' : ''}`}>
              {gauche ? <span>‹</span> : null}
              <span className="jour-j-pin">💍</span>
              <span className="hidden font-mono group-hover:inline">{daysToEvent > 0 ? `J-${daysToEvent}` : formatDateFr(event.date)}</span>
              {droite ? <span>›</span> : null}
            </button>
          );
        })() : null}

        {/* ============================= ROADMAP ============================= */}
        {activeTab === 'roadmap' ? (
          <>
            <div id="timeline-viewport" onMouseDown={startPan} onScroll={onTimelineScroll}
              className={`flex-1 overflow-auto ${panning ? 'cursor-grabbing select-none' : 'cursor-grab'} ${isDark ? 'bg-[#05080F]' : 'bg-[#EEF1F6]'}`}>
              <div style={{ width: `${timelineWidth + nameColWidth}px`, minWidth: '100%' }}>

                <div className={`sticky top-0 z-30 flex h-7 border-b ${T.rail} ${T.border}`}>
                  <div style={{ width: `${nameColWidth}px` }} className={`sticky left-0 z-40 flex items-center border-r px-3 text-[10px] font-bold uppercase tracking-wide ${T.rail} ${T.border} ${T.faint}`}>
                    {isLeftPanelOpen ? `${projects.length} projet(s)` : '—'}
                  </div>
                  <div className="flex">
                    {timelineMonths.map((m, i) => (
                      <div key={i} style={{ width: `${m.days * columnWidth}px` }} className={`flex h-full items-center justify-center border-r text-[10px] font-extrabold uppercase tracking-wider ${T.grid} ${T.faint}`}>
                        {m.days * columnWidth > 90 ? m.label : m.days * columnWidth > 26 ? m.label.slice(0, 3) : ''}
                      </div>
                    ))}
                  </div>
                </div>

                <div className={`sticky top-7 z-30 flex h-11 border-b ${T.rail} ${T.border}`}>
                  <div style={{ width: `${nameColWidth}px` }} className={`sticky left-0 z-40 flex items-center justify-between border-r px-3 text-[11px] font-bold ${T.rail} ${T.border}`}>
                    {isLeftPanelOpen ? (<><span>Structure</span><button type="button" onClick={() => setIsLeftPanelOpen(false)} className={`text-[10px] ${T.faint}`}>◀</button></>)
                      : <button type="button" onClick={() => setIsLeftPanelOpen(true)} className="text-[10px] font-bold text-indigo-400">▶</button>}
                  </div>
                  {dayHeaderPlain}
                </div>

                <div className="relative">
                  {/* Repère du Jour J, traversant toutes les lignes */}
                  {eventOffset >= 0 && eventOffset < totalDays ? (
                    <div className="pointer-events-none absolute inset-y-0 z-[8]"
                      style={{ left: `${nameColWidth + eventOffset * columnWidth}px`, width: `${Math.max(3, columnWidth)}px` }}>
                      <div className="jour-j-pin absolute inset-y-0 left-1/2 w-0.5 -translate-x-1/2 bg-rose-400" />
                      <div className="absolute -top-0.5 left-1/2 -translate-x-1/2 whitespace-nowrap rounded-b-lg border border-t-0 border-rose-400/70 bg-rose-500/95 px-2 py-0.5 text-[10px] font-extrabold text-white shadow-lg">
                        💍 {event.label} · {formatDateFr(event.date)}
                      </div>
                    </div>
                  ) : null}
                  {projects.length === 0 ? <div className={`px-8 py-16 text-center text-sm ${T.faint}`}>Aucun projet. Créez-en un pour démarrer votre roadmap.</div> : null}

                  {projects.map((proj) => {
                    const pct = projectProgress(proj);
                    const isOpen = !!openProjects[proj.id];
                    const isSelected = proj.id === selectedProjectId;
                    const dragging = drag && drag.kind === 'project' && drag.id === proj.id;
                    const startUnits = diffDays(parseDate(proj.startDate), timelineStart);
                    const geo = barGeometry(startUnits, proj.duration, dragging);

                    return (
                      <React.Fragment key={proj.id}>
                        {/* Niveau 1 — projet */}
                        <div className={`flex h-14 border-b ${T.border} ${isSelected ? 'bg-indigo-500/[0.07]' : ''}`}>
                          <div style={{ width: `${nameColWidth}px` }}
                            data-nopan className={`sticky left-0 z-20 flex items-center gap-2 border-r px-3 ${T.panel} ${isSelected ? 'shadow-[inset_3px_0_0_0_#6366F1]' : ''}`}>
                            {isLeftPanelOpen ? (
                              <>
                                <button type="button" onClick={() => setOpenProjects({ ...openProjects, [proj.id]: !isOpen })}
                                  className={`flex h-7 w-7 shrink-0 items-center justify-center rounded-lg border text-[12px] font-black leading-none transition
                                    ${isOpen ? 'border-indigo-400/70 bg-indigo-600 text-white shadow-md shadow-indigo-950/40'
                                             : `${T.border} ${isDark ? 'bg-white/10' : 'bg-slate-200'} text-indigo-400 hover:border-indigo-400 hover:bg-indigo-500/20`}`}
                                  aria-label={isOpen ? 'Replier le projet' : 'Déplier le projet'}
                                  title={isOpen ? 'Replier ce projet' : `Déplier ce projet (${proj.tasks.length} tâches)`}>
                                  {isOpen ? '−' : '+'}
                                </button>
                                <button type="button" onClick={() => setSelectedProjectId(proj.id)} className="min-w-0 flex-1 text-left">
                                  <div className="flex items-center gap-2">
                                    <span className={`h-2.5 w-2.5 shrink-0 rounded-full bg-gradient-to-r ${proj.color}`} />
                                    <span className="truncate text-xs font-extrabold">{proj.title}</span>
                                  </div>
                                  <div className={`mt-0.5 truncate text-[10px] ${T.faint}`}>{proj.category} · {proj.tasks.length} tâche(s)</div>
                                </button>
                                <span className={`font-mono text-[11px] font-extrabold ${pct === 100 ? 'text-emerald-400' : 'text-indigo-400'}`}>{pct}%</span>
                              </>
                            ) : <span className={`h-2.5 w-2.5 rounded-full bg-gradient-to-r ${proj.color}`} />}
                          </div>

                          <div className="relative" style={{ width: `${timelineWidth}px` }}>
                            <GridBackground />
                            {dragging ? <div style={{ left: `${drag.snapStart * columnWidth}px`, width: `${drag.snapLen * columnWidth}px` }} className="absolute top-3 h-8 rounded-lg border-2 border-dashed border-indigo-400 bg-indigo-500/10" /> : null}
                            <div style={{ left: `${geo.left}px`, width: `${Math.max(columnWidth * 0.6, geo.width)}px` }}
                                  data-nopan
                              onMouseDown={(e) => startDrag(e, { kind: 'project', id: proj.id, action: 'move', unit: 1, startUnits, lenUnits: proj.duration })}
                              onClick={() => { if (!movedRef.current) { setSelectedProjectId(proj.id); setIsRightPanelOpen(true); } }}
                              className={`group absolute top-3 flex h-8 cursor-grab items-center overflow-hidden rounded-lg border bg-gradient-to-r ${proj.color} shadow-lg active:cursor-grabbing ${isEventBar(proj.startDate, proj.duration) ? 'jour-j-bar border-rose-300/80' : 'border-white/20'} ${dragging ? 'z-[15] ring-2 ring-indigo-400' : 'z-10'}`}>
                              <div className="absolute inset-0 bg-slate-950/60" />
                              <div className={`absolute inset-y-0 left-0 bg-gradient-to-r ${proj.color}`} style={{ width: `${pct}%` }} />
                              <div onMouseDown={(e) => startDrag(e, { kind: 'project', id: proj.id, action: 'resize-left', unit: 1, startUnits, lenUnits: proj.duration })} className="absolute inset-y-0 left-0 z-20 w-2.5 cursor-ew-resize bg-white/40 opacity-0 group-hover:opacity-100" />
                              <div className="pointer-events-none relative flex w-full items-center justify-between gap-2 px-2.5">
                                <span className="truncate text-[11px] font-extrabold text-white drop-shadow">{proj.title}</span>
                                <span className="shrink-0 rounded bg-black/50 px-1.5 py-0.5 font-mono text-[10px] font-bold text-white">{pct}%</span>
                              </div>
                              <div onMouseDown={(e) => startDrag(e, { kind: 'project', id: proj.id, action: 'resize-right', unit: 1, startUnits, lenUnits: proj.duration })} className="absolute inset-y-0 right-0 z-20 w-2.5 cursor-ew-resize bg-white/40 opacity-0 group-hover:opacity-100" />
                            </div>
                            {dragging ? (
                              <div className="pointer-events-none absolute -top-1 z-[15] rounded-lg border border-indigo-500 bg-slate-900 px-2 py-1 font-mono text-[10px] text-slate-100 shadow-xl" style={{ left: `${drag.snapStart * columnWidth}px` }}>
                                {formatDateFr(formatDateIso(addDays(timelineStart, drag.snapStart)))} · {drag.snapLen} j
                              </div>
                            ) : null}
                          </div>
                        </div>

                        {/* Niveau 2 — tâches */}
                        {isOpen ? proj.tasks.map((task) => {
                          const tOpen = !!openTasks[task.id];
                          const tDragging = drag && drag.kind === 'task' && drag.id === task.id;
                          const tStart = diffDays(parseDate(task.startDate), timelineStart);
                          const tGeo = barGeometry(tStart, task.duration, tDragging);
                          const doneSub = task.subtasks.filter((s) => s.status === 'DONE').length;

                                        title={tOpen ? 'Replier les sous-tâches' : `Déplier ${task.subtasks.length} sous-tâches`}>
                                        <span>{tOpen ? '−' : '+'}</span>
                                        <span className="font-mono opacity-80">{task.subtasks.length}</span>
                                      </button>
                                      <input type="checkbox" checked={task.status === 'DONE'} onChange={(e) => setTaskStatus(task.id, e.target.checked ? 'DONE' : 'IN_PROGRESS')}
                                        className="h-3.5 w-3.5 shrink-0 rounded accent-emerald-500" aria-label={`Valider ${task.title}`} />
                                      <button type="button" onClick={() => setEditingTask({ ...task, projectId: proj.id })}
                                        className={`min-w-0 flex-1 truncate text-left text-[11px] ${task.status === 'DONE' ? 'text-slate-500 line-through' : 'font-bold'}`}>{task.title}</button>
                                      {incoherente ? <span className="shrink-0 text-[11px] text-amber-400" title={`Démarre avant la fin de ${incoherente.ref}`}>⚠</span> : null}
                                      {task.subtasks.length ? <span className={`shrink-0 rounded px-1.5 py-0.5 font-mono text-[9px] ${T.raise} ${T.muted}`}>{doneSub}/{task.subtasks.length}</span> : null}
                                      <button type="button" title="Ajouter une sous-tâche"
                                        onClick={() => setSubtaskForm({ id: null, taskId: task.id, projectId: proj.id, title: '', assignee: task.assignee, status: 'TODO', startDate: task.startDate, duration: 1, notes: '' })}

                                </div>
                                <div className="relative" style={{ width: `${timelineWidth}px` }}>

                                  <div style={{ left: `${tGeo.left}px`, width: `${Math.max(columnWidth * 0.5, tGeo.width)}px` }}

                                    onMouseDown={(e) => startDrag(e, { kind: 'task', id: task.id, action: 'move', unit: 1, startUnits: tStart, lenUnits: task.duration })}
                                    onClick={() => { if (!movedRef.current) setEditingTask({ ...task, projectId: proj.id }); }}
                                    className={`group absolute top-2 flex h-6 cursor-grab items-center rounded border bg-gradient-to-r ${proj.color} px-2 text-[10px] font-bold text-white shadow active:cursor-grabbing ${isEventBar(task.startDate, task.duration) ? 'jour-j-bar border-rose-300/80' : 'border-white/20'} ${task.status === 'DONE' ? 'opacity-50' : ''} ${tDragging ? 'z-[15]' : ''}`}>
                                    <div onMouseDown={(e) => startDrag(e, { kind: 'task', id: task.id, action: 'resize-left', unit: 1, startUnits: tStart, lenUnits: task.duration })} className="absolute inset-y-0 left-0 w-2 cursor-ew-resize bg-white/40 opacity-0 group-hover:opacity-100" />

                                  </div>
                                </div>
                              </div>

                              {/* Niveau 3 — sous-tâches */}
                              {tOpen ? task.subtasks.map((sub) => {
                                const sDragging = drag && drag.kind === 'subtask' && drag.id === sub.id;

                                const sGeo = barGeometry(sStart, sub.duration, sDragging);
                                return (
                                  <div key={sub.id} className={`flex h-8 border-b ${T.border} ${isDark ? 'bg-black/20' : 'bg-slate-100/60'}`}>

                                          <button type="button" onClick={() => setSubtaskForm({ ...sub, taskId: task.id, projectId: proj.id })}

                                          <span className={`shrink-0 rounded border px-1 py-0.5 text-[8px] font-bold ${STATUS_META[sub.status].tint}`}>{statusLabel(sub.status)}</span>

                                    </div>
                                    <div className="relative" style={{ width: `${timelineWidth}px` }}>
                                      <GridBackground />
                                      {sDragging ? <div style={{ left: `${drag.snapStart * columnWidth}px`, width: `${drag.snapLen * columnWidth}px` }} className="absolute top-2 h-4 rounded border-2 border-dashed border-indigo-400 bg-indigo-500/10" /> : null}

                                        onMouseDown={(e) => startDrag(e, { kind: 'subtask', id: sub.id, action: 'move', unit: 1, startUnits: sStart, lenUnits: sub.duration })}

                                        <span className="pointer-events-none truncate">{sub.title}</span>
                                        <div onMouseDown={(e) => startDrag(e, { kind: 'subtask', id: sub.id, action: 'resize-right', unit: 1, startUnits: sStart, lenUnits: sub.duration })} className="absolute inset-y-0 right-0 w-2 cursor-ew-resize bg-white/40 opacity-0 group-hover:opacity-100" />
                                      </div>
                                    </div>
                                  </div>
                                );
                              }) : null}
                            </React.Fragment>
                          );
                        }) : null}
                      </React.Fragment>
                    );
                  })}

              </div>
            </div>

            {isRightPanelOpen ? (
              <aside className={`hidden w-80 shrink-0 overflow-y-auto border-l p-4 lg:block ${T.panel}`}>

                  <div className="space-y-4">
                    <div className={`overflow-hidden rounded-2xl border ${T.raise}`}>
                      <div className={`flex items-center justify-between border-b px-4 py-2.5 ${T.border} ${T.inset}`}>

                        <button type="button" onClick={() => setIsRightPanelOpen(false)} className={`text-xs ${T.faint}`}>✕</button>
                      </div>
                      <div className="p-4">
                        <h2 className="text-sm font-extrabold leading-snug">{selectedProject.title}</h2>
                        <div className={`mt-1 text-[11px] ${T.faint}`}>
                          {formatDayShort(selectedProject.startDate)} → {formatDayShort(formatDateIso(addDays(parseDate(selectedProject.startDate), selectedProject.duration)))} · {selectedProject.duration} j

                        <div className={`mt-3 h-2 w-full overflow-hidden rounded-full ${T.inset}`}>
                          <div className={`h-full rounded-full bg-gradient-to-r ${selectedProject.color}`} style={{ width: `${projectProgress(selectedProject)}%` }} />
                        </div>
                        <div className="mt-2 flex items-center justify-between text-[11px]">
                          <span className={`font-bold ${projectProgress(selectedProject) === 100 ? 'text-emerald-400' : 'text-indigo-400'}`}>{projectProgress(selectedProject)} %</span>

                        </div>
                      </div>
                    </div>

                    <div className={`overflow-hidden rounded-2xl border ${T.raise}`}>

                        <button type="button" className="text-[11px] font-bold text-indigo-400"
                          onClick={() => setTaskForm({ id: null, projectId: selectedProject.id, title: '', assignee: collaborators[0] || 'Moi', startDate: selectedProject.startDate, duration: 5, status: 'TODO', priority: 'MEDIUM', notes: '' })}>+ Ajouter</button>
                      </div>
                      <div className="space-y-1.5 p-3">
