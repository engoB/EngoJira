    } else if (!avant) {
      // Première ouverture : si l'appareil n'a que la démonstration, elle ne doit
      // rien revendiquer, sinon elle écraserait le tableau déjà présent dans le dépôt.
      const seulementDemo = JSON.stringify(versFichier(data)) === JSON.stringify(versFichier(SEED));
      const depart = seulementDemo ? 0 : maintenant;
      majsRef.current.meta = majsRef.current.meta || depart;
      COLLECTIONS.forEach((c) => Object.keys(apres[c]).forEach((id) => {
        majsRef.current[c][id] = majsRef.current[c][id] || depart;
      }));
    }
    dernierFichier.current = { contenu: apres, majs: majsRef.current, supprimes: supprRef.current,
      presence: (dernierFichier.current && dernierFichier.current.presence) || {} };
    saveJson('auraplan_majs_v22', majsRef.current);
    saveJson('auraplan_suppr_v22', supprRef.current);
    appliqueDistant.current = false;
  }, [data]);

  const cheminApi = useCallback(() => `https://api.github.com/repos/${sync.owner}/${sync.repo}/contents/${FICHIER}`, [sync.owner, sync.repo]);
  const baseGit = useCallback(() => `https://api.github.com/repos/${sync.owner}/${sync.repo}/git`, [sync.owner, sync.repo]);
  const entetesGit = useCallback(() => ({ Authorization: `Bearer ${sync.token}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }), [sync.token]);

  const brancheVerifiee = useRef(false);

  // Crée la branche de données si elle n'existe pas encore. Une seule fois.
  const assurerBranche = useCallback(async () => {
    if (brancheVerifiee.current || !sync.token || sync.branch === sync.brancheSite) return;
    const r = await fetch(`${baseGit()}/ref/heads/${encodeURIComponent(sync.branch)}`, { headers: entetesGit() });
    if (r.ok) { brancheVerifiee.current = true; return; }
    if (r.status !== 404) { brancheVerifiee.current = true; return; }
    const source = await fetch(`${baseGit()}/ref/heads/${encodeURIComponent(sync.brancheSite)}`, { headers: entetesGit() });
    if (!source.ok) throw new Error('branche du site introuvable (' + sync.brancheSite + ')');
    const info = await source.json();
    const creation = await fetch(`${baseGit()}/refs`, {
      method: 'POST', headers: entetesGit(),
      body: JSON.stringify({ ref: 'refs/heads/' + sync.branch, sha: info.object && info.object.sha })
    });
    if (!creation.ok && creation.status !== 422) throw new Error('création de la branche impossible (' + creation.status + ')');
    brancheVerifiee.current = true;
  }, [sync.token, sync.branch, sync.brancheSite, baseGit, entetesGit]);

  const lireDistant = useCallback(async (cle) => {
    // Avec un jeton : l'API, toujours fraîche. Sans jeton : le fichier brut, avec anti-cache.
    if (sync.token) {
      const entetes = { Authorization: `Bearer ${sync.token}`, Accept: 'application/vnd.github+json' };
      if (etagRef.current) entetes['If-None-Match'] = etagRef.current;
      const r = await fetch(`${cheminApi()}?ref=${encodeURIComponent(sync.branch)}`, { headers: entetes, cache: 'no-store' });
      if (r.status === 304) return { inchange: true };     // rien n'a bougé : aucun octet transféré, et hors quota
      try { const et = r.headers && r.headers.get && r.headers.get('ETag'); if (et) etagRef.current = et; } catch (e) { /* no-op */ }
      if (r.status === 404) return { absent: true };
      if (r.status === 401 || r.status === 403) throw new Error(r.status === 401 ? 'jeton refusé' : 'accès refusé (droits du jeton ?)');
      if (!r.ok) throw new Error('lecture impossible (' + r.status + ')');
      if (r.status === 404 && sync.brancheSite && sync.brancheSite !== sync.branch) {
        const secours = await fetch(`${cheminApi()}?ref=${encodeURIComponent(sync.brancheSite)}`,
          { headers: { Authorization: `Bearer ${sync.token}`, Accept: 'application/vnd.github+json' }, cache: 'no-store' });
        if (secours.ok) {
          const js = await secours.json();
          shaRef.current = null;      // il faudra créer le fichier sur la branche des données
          return { fichier: JSON.parse(new TextDecoder().decode(depuisBase64(js.content || ''))), depuisSite: true };
        }
      }
      const j = await r.json();
      shaRef.current = j.sha;
      const texte = new TextDecoder().decode(depuisBase64(j.content || ''));
      return { fichier: JSON.parse(texte) };
    }
    const lireBrut = async (branche, avecEtag) => {
      const url = `https://raw.githubusercontent.com/${sync.owner}/${sync.repo}/${branche}/${FICHIER}?t=${Date.now()}`;
      const entetes = avecEtag && etagRef.current ? { 'If-None-Match': etagRef.current } : {};
      const r = await fetch(url, { cache: 'no-store', headers: entetes });
      if (r.status === 304) return { inchange: true };
      try { const et = r.headers && r.headers.get && r.headers.get('ETag'); if (et) etagRef.current = et; } catch (e) { /* no-op */ }
      if (r.status === 404) return { absent: true };
      if (!r.ok) throw new Error('lecture impossible (' + r.status + ')');
      return { fichier: JSON.parse(await r.text()) };
    };
    const principal = await lireBrut(sync.branch, true);
    if (!principal.absent) return principal;
    // Les tableaux créés avec les versions précédentes vivent sur la branche du site.
    if (sync.brancheSite && sync.brancheSite !== sync.branch) {
      const secours = await lireBrut(sync.brancheSite, false);
      if (!secours.absent) return { ...secours, depuisSite: true };
    }
    return { absent: true };
  }, [sync.token, sync.branch, sync.brancheSite, sync.owner, sync.repo, cheminApi]);

  const ecrireDistant = useCallback(async (charge, sha) => {
    const r = await fetch(cheminApi(), {
      method: 'PUT',
      headers: { Authorization: `Bearer ${sync.token}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: `Tableau mis à jour — ${new Date().toLocaleString('fr-FR')}`,
        content: versBase64(new TextEncoder().encode(JSON.stringify(charge))),
        branch: sync.branch,
        ...(sha ? { sha } : {})
      })
    });
    if (r.status === 409 || r.status === 422) return { conflit: true };
    if (r.status === 401) throw new Error('jeton refusé');
    if (r.status === 403) throw new Error('le jeton n’a pas le droit d’écrire');
    if (r.status === 404) throw new Error('dépôt ou branche introuvable');
    if (!r.ok) throw new Error('écriture impossible (' + r.status + ')');
    const j = await r.json();
    shaRef.current = j.content && j.content.sha;
    return { ok: true };
  }, [cheminApi, sync.token, sync.branch]);

  const synchroniser = useCallback(async (forcerEcriture) => {
    if (!partageActif || enCours.current) return;
    enCours.current = true;
    let cle = null;
    try {
      cle = await deriverCle(password, sync.owner + '/' + sync.repo);
      setSyncEtat((p) => ({ ...p, etat: 'travail', message: '' }));
      if (peutEcrire) await assurerBranche();

      let distant = null;
      const lu = await lireDistant(cle);
      // Aucun tableau lisible : sans jeton, c'est presque toujours un dépôt privé.
      const messageVide = sync.token
        ? 'Aucun tableau publié pour l’instant dans ce dépôt : le vôtre va y être déposé.'
        : 'Aucun tableau lisible à cette adresse. Soit rien n’a encore été publié, soit le dépôt est privé — dans ce cas il faut un jeton pour le lire.';
      if (lu.inchange && !aEcrire.current && !forcerEcriture) {
        setSyncEtat((p) => ({ ...p, etat: peutEcrire ? 'ok' : 'lecture', message: '', dernier: Date.now() }));
        enCours.current = false;
        return;
      }
      if (lu.inchange) { distant = dernierDistant.current; }
      else if (!lu.absent) {
        const enveloppe = lu.fichier;
        if (!enveloppe || enveloppe.format !== 'auraplan1') throw new Error('fichier non reconnu');
        let clair = null;
        try { clair = JSON.parse(await dechiffrerTexte(cle, enveloppe.charge, enveloppe.compresse)); }
        catch (e) { throw new Error('mot de passe différent de celui du tableau'); }
        distant = clair;
        dernierDistant.current = clair;
      }

      const local = dernierFichier.current;
      // Un appareil qui n'a encore que la démonstration adopte le tableau du groupe
      // en entier : le fusionner ferait cohabiter deux tableaux sans rapport.
      const localEstDemo = JSON.stringify(versFichier(dataRef.current)) === JSON.stringify(versFichier(SEED));
      const fusion = !distant
        ? { ...local, presence: (local && local.presence) || {} }
        : localEstDemo
          ? { contenu: distant.contenu, majs: distant.majs, supprimes: distant.supprimes, presence: distant.presence || {} }
          : fusionner(local, distant);

      // Ce que le dépôt sait et que nous n'avions pas encore
      const nouveauLocal = depuisFichier(fusion.contenu);
      const changeLocalement = JSON.stringify(versFichier(dataRef.current)) !== JSON.stringify(versFichier(nouveauLocal));
      if (changeLocalement) {
        // On garde la frise là où elle était : recevoir une mise à jour ne doit pas
        // ramener l'affichage au début.
        const vp = document.getElementById('timeline-viewport');
        const position = vp ? { gauche: vp.scrollLeft, haut: vp.scrollTop } : null;
        if (position) {
          window.requestAnimationFrame(() => {
            const cible = document.getElementById('timeline-viewport');
            if (!cible) return;
            if (cible.scrollLeft !== position.gauche) cible.scrollLeft = position.gauche;
            if (cible.scrollTop !== position.haut) cible.scrollTop = position.haut;
          });
        }
        appliqueDistant.current = true;
        majsRef.current = fusion.majs;
        supprRef.current = fusion.supprimes;
        dataRef.current = nouveauLocal;
        setData(nouveauLocal);
        dernierFichier.current = { contenu: versFichier(nouveauLocal), majs: fusion.majs, supprimes: fusion.supprimes, presence: fusion.presence };
      } else {
        dernierFichier.current = { contenu: versFichier(dataRef.current), majs: fusion.majs, supprimes: fusion.supprimes, presence: fusion.presence };
        majsRef.current = fusion.majs;
        supprRef.current = fusion.supprimes;
      }

      const participants = Object.keys(fusion.presence || {}).map((id) => ({ id, ...fusion.presence[id] }))
        .filter((p) => p && p.nom).sort((a, b) => (b.vu || 0) - (a.vu || 0));

      // Écriture : seulement si nous avons du neuf, ou si le dépôt est vide.
      const distantDiffere = !distant || JSON.stringify(distant.contenu) !== JSON.stringify(fusion.contenu);
      // Une relève ordinaire n'écrit pas : elle laisse le regroupement faire son travail,
      // sinon chaque passage de 8 s produirait son propre commit.
      const fenetreOuverte = forcerEcriture || (Date.now() - derniereEcriture.current) >= INTERVALLE_MINI;
      const doitEcrire = peutEcrire && fenetreOuverte && (forcerEcriture || aEcrire.current || !distant || distantDiffere);

      if (doitEcrire) {
        const presence = { ...(fusion.presence || {}) };
        presence[monAppareil] = { nom: sync.nom || collabNomParDefaut, vu: Date.now() };
        const paquet = await chiffrerTexte(cle, JSON.stringify({
          contenu: fusion.contenu, majs: fusion.majs, supprimes: fusion.supprimes, presence
        }));
        const charge = { format: 'auraplan1', compresse: paquet.compresse, modifie: new Date().toISOString(), charge: paquet.charge };
        const res = await ecrireDistant(charge, shaRef.current);
        if (res && res.conflit) {                       // quelqu'un a écrit entre-temps : on refait un tour
          shaRef.current = null;
          enCours.current = false;
          window.setTimeout(() => synchroniser(true), 400);
          return;
        }
        aEcrire.current = false;
        derniereEcriture.current = Date.now();
        etagRef.current = null;
        try { setSyncEtat((p) => ({ ...p, poids: JSON.stringify(charge).length })); } catch (e) { /* no-op */ }
        dernierDistant.current = { contenu: fusion.contenu, majs: fusion.majs, supprimes: fusion.supprimes, presence };
        dernierFichier.current.presence = presence;
        setSyncEtat((p) => ({ ...p, etat: 'ok', message: '', dernier: Date.now(), participants, ecritures: p.ecritures + 1 }));
      } else {
        // Un invité qui ne trouve rien doit le savoir : c'est le cas le plus déroutant.
        const rienALire = !distant && !peutEcrire;
        setSyncEtat((p) => ({ ...p, etat: rienALire ? 'vide' : (peutEcrire ? 'ok' : 'lecture'),
          message: rienALire ? messageVide : '', dernier: Date.now(), participants, lectures: p.lectures + 1 }));
      }
    } catch (err) {
      setSyncEtat((p) => ({ ...p, etat: 'erreur', message: String((err && err.message) || err) }));
    } finally {
      enCours.current = false;
    }
  }, [partageActif, peutEcrire, password, sync.owner, sync.repo, sync.nom, lireDistant, ecrireDistant, monAppareil, assurerBranche]);

  const collabNomParDefaut = 'Invité';

  // Réécrit la branche de données avec un unique commit : l'historique des
  // enregistrements repart de zéro, le contenu reste identique.
  const compacterHistorique = useCallback(async () => {
    if (!peutEcrire) { pushToast('Un jeton est nécessaire', 'error'); return; }
    if (sync.branch === sync.brancheSite) { pushToast('Impossible sur la branche du site', 'error'); return; }
    if (!window.confirm('Repartir d’un historique vierge pour les données ?\n\nLe tableau actuel est conservé à l’identique ; seules les anciennes versions enregistrées disparaissent.')) return;
    try {
      setSyncEtat((p) => ({ ...p, etat: 'travail' }));
      const actuel = await fetch(`${cheminApi()}?ref=${encodeURIComponent(sync.branch)}`, { headers: entetesGit() });
      if (!actuel.ok) throw new Error('lecture impossible (' + actuel.status + ')');
      const contenu = (await actuel.json()).content;

      const blob = await fetch(`${baseGit()}/blobs`, { method: 'POST', headers: entetesGit(),
        body: JSON.stringify({ content: String(contenu).replace(/\n/g, ''), encoding: 'base64' }) });
      if (!blob.ok) throw new Error('écriture impossible (' + blob.status + ')');
      const blobSha = (await blob.json()).sha;

      const arbre = await fetch(`${baseGit()}/trees`, { method: 'POST', headers: entetesGit(),
        body: JSON.stringify({ tree: [{ path: FICHIER, mode: '100644', type: 'blob', sha: blobSha }] }) });
      if (!arbre.ok) throw new Error('arborescence impossible (' + arbre.status + ')');
      const arbreSha = (await arbre.json()).sha;

      const commit = await fetch(`${baseGit()}/commits`, { method: 'POST', headers: entetesGit(),
        body: JSON.stringify({ message: `Tableau — historique compacté le ${new Date().toLocaleDateString('fr-FR')}`, tree: arbreSha, parents: [] }) });
      if (!commit.ok) throw new Error('commit impossible (' + commit.status + ')');
      const commitSha = (await commit.json()).sha;

      const ref = await fetch(`${baseGit()}/refs/heads/${encodeURIComponent(sync.branch)}`, { method: 'PATCH', headers: entetesGit(),
        body: JSON.stringify({ sha: commitSha, force: true }) });
      if (!ref.ok) throw new Error('mise à jour impossible (' + ref.status + ')');

      shaRef.current = null; etagRef.current = null;
      pushToast('Historique des données remis à neuf', 'success');
      setSyncEtat((p) => ({ ...p, etat: 'ok', message: '', ecritures: 0 }));
    } catch (err) {
      setSyncEtat((p) => ({ ...p, etat: 'erreur', message: String((err && err.message) || err) }));
    }
  }, [peutEcrire, sync.branch, sync.brancheSite, cheminApi, baseGit, entetesGit, pushToast]);

  // Première synchronisation, puis relève régulière.
  useEffect(() => {
    if (!partageActif) { setSyncEtat((p) => ({ ...p, etat: 'inactif', message: '' })); return undefined; }
    let vivant = true;
    const tour = () => { if (vivant) synchroniser(false); };
    tour();
    const rythme = () => {
      const inactifDepuis = Date.now() - derniereActivite.current;
      if (!sync.token) return 30000;
      if (inactifDepuis < 3 * 60000) return 8000;      // on travaille : relève rapprochée
      if (inactifDepuis < 20 * 60000) return 30000;    // pause courte
      return 120000;                                    // onglet laissé ouvert en arrière-plan
    };
    let minuteur = window.setTimeout(function boucle() {
      tour();
      minuteur = window.setTimeout(boucle, rythme());
    }, rythme());
    const surRetour = () => { if (document.visibilityState === 'visible') tour(); };
    document.addEventListener('visibilitychange', surRetour);
    return () => { vivant = false; window.clearTimeout(minuteur); document.removeEventListener('visibilitychange', surRetour); };
  }, [partageActif, synchroniser, sync.token]);

  // Envoi groupé : une salve de modifications ne produit qu'un seul commit.
  const minuteurEnvoi = useRef(null);
  useEffect(() => {
    if (!peutEcrire) return undefined;
    if (minuteurEnvoi.current) window.clearTimeout(minuteurEnvoi.current);
    const depuis = Date.now() - derniereEcriture.current;
    const attente = Math.max(DELAI_ENVOI, INTERVALLE_MINI - depuis);
    minuteurEnvoi.current = window.setTimeout(() => {
      if (aEcrire.current) { derniereEcriture.current = Date.now(); synchroniser(true); }
    }, attente);
    return () => { if (minuteurEnvoi.current) window.clearTimeout(minuteurEnvoi.current); };
  }, [data, peutEcrire, synchroniser]);

  // Rien ne doit se perdre si l'onglet est fermé pendant l'attente.
  useEffect(() => {
    if (!peutEcrire) return undefined;
    const vider = () => { if (aEcrire.current) { derniereEcriture.current = Date.now(); synchroniser(true); } };
    const surVisibilite = () => { if (document.visibilityState === 'hidden') vider(); };
    window.addEventListener('pagehide', vider);
    document.addEventListener('visibilitychange', surVisibilite);
    return () => { window.removeEventListener('pagehide', vider); document.removeEventListener('visibilitychange', surVisibilite); };
  }, [peutEcrire, synchroniser]);

  const participantsActifs = useMemo(() => {
    const limite = Date.now() - 5 * 60000;
    return (syncEtat.participants || []).filter((p) => (p.vu || 0) > limite && p.id !== monAppareil);
  }, [syncEtat.participants, monAppareil]);

  const adresseTableau = useMemo(() => {
    try { return window.location.origin + window.location.pathname; } catch (e) { return ''; }
  }, []);

  const texteInvitation = () => [
    `Rejoins le tableau « ${data.board.titre} » :`,
    '',
    `1. Ouvre ${adresseTableau}`,
    '2. Mets ton prénom, puis ce mot de passe : ' + (password || '(à te communiquer)'),
    sync.token
      ? '3. Bouton « Partager » en haut à droite, colle ce jeton dans « Jeton GitHub » :\n   ' + sync.token
      : '3. Sans jeton, tu pourras consulter le tableau mais pas enregistrer tes modifications.',
    '',
    'Le tableau est chiffré avec le mot de passe : sans lui, il est illisible.'
  ].join('\n');

  const copierInvitation = async () => {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(texteInvitation());
      else throw new Error('presse-papiers indisponible');
      pushToast('Invitation copiée — collez-la dans un message', 'success');
    } catch (e) { pushToast('Copiez le texte affiché', 'info'); }
  };

  const copierAdresse = async () => {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(adresseTableau);
      else throw new Error('presse-papiers indisponible');
      pushToast('Adresse copiée', 'success');
    } catch (e) { pushToast('Copiez l’adresse affichée', 'info'); }
  };

  /* --------------------------- Import / export --------------------------- */
  const fileInputRef = useRef(null);
  const exportJson = () => {
    try {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `auraplan-${TODAY_STR}.json`; a.click();
      window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      pushToast('Sauvegarde exportée', 'success');
    } catch (err) { pushToast('Export impossible dans ce navigateur', 'error'); }
  };
  const importJson = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { try { commit(normalizeData(JSON.parse(String(reader.result))), 'Données importées'); } catch (err) { pushToast('Fichier illisible : JSON invalide', 'error'); } };
    reader.onerror = () => pushToast('Lecture du fichier impossible', 'error');
    reader.readAsText(file);
  };

  /* ------------------------------ Écran d'accueil ------------------------------ */
  const [passDraft, setPassDraft] = useState('');
  const [rememberPass, setRememberPass] = useState(true);

  const enterBoard = (value, solo) => {
    const pass = String(value || '').trim();
    if (!solo && !pass) return;
    setPassword(solo ? '' : pass);
    setUnlocked(true);
    if (rememberPass || solo) saveJson(PASS_KEY, solo ? { solo: true, value: '' } : { value: pass });
    else saveJson(PASS_KEY, {});
    if (solo) setSync((c) => ({ ...c, actif: false }));
  };

  const leaveBoard = () => {
    saveJson(PASS_KEY, {});
    setPassword(''); setPassDraft(''); setUnlocked(false);
  };

  const creerDepuisColonne = (colonne, titre) => {
    const propre = String(titre || '').trim();
    if (!propre) return;
    const projet = selectedProject || projects[0];
    if (!projet) { pushToast('Créez d’abord un projet', 'error'); return; }
    const base = { title: propre, assignee: collaborators[0] || monNom(), startDate: TODAY_STR,
      duration: 2, status: 'TODO', priority: 'MEDIUM', notes: '' };
    if (colonne.statut) base.status = colonne.statut;
    if (grouperPar === 'assignee') base.assignee = colonne.titre;
    if (grouperPar === 'priority') base.priority = PRIORITIES.find((pr) => PRIORITY_META[pr].label === colonne.titre) || 'MEDIUM';
    const maxRank = allTasks.filter((t) => t.status === base.status).reduce((m, t) => Math.max(m, t.rank), -1);
    const tache = normalizeTask({ ...base, id: uid('t'), rank: maxRank + 1, subtasks: [],
      journal: [{ id: uid('a'), auteur: monNom(), texte: 'a créé la tâche', date: new Date().toISOString() }] });
    commit((prev) => ({ ...prev, projects: prev.projects.map((p) => (p.id === projet.id ? { ...p, tasks: [...p.tasks, tache] } : p)) }));
    setAjoutRapide({ colonne: colonne.id, texte: '' });
  };

  /* --------------------------------- Rendu --------------------------------- */
  const timelineWidth = totalDays * columnWidth;

  const dense = columnWidth < 34;      // trop étroit pour le jour de la semaine
  const ultra = columnWidth < 16;      // trop étroit pour le moindre chiffre

  const buildDayHeader = (withHalves) => (
    <div className="flex" style={{ width: `${timelineWidth}px` }}>
      {Array.from({ length: totalDays }).map((_, i) => {
        const d = addDays(timelineStart, i);
        const iso = formatDateIso(d);
        const isToday = iso === TODAY_STR;
        const isEvent = iso === event.date;
        const isWeekend = d.getDay() === 0 || d.getDay() === 6;
        const count = dayLoad.get(i) || 0;
        return (
          <div key={i} style={{ width: `${columnWidth}px`, minWidth: `${columnWidth}px` }}
            className={`relative flex h-full flex-col justify-between overflow-visible border-r ${T.grid} ${d.getDay() === 1 ? 'border-l-2 border-l-indigo-500/40' : ''}
              ${isEvent ? 'jour-j-col border-x-2 border-x-rose-400/80 text-rose-300' : isToday ? 'bg-indigo-500/25 text-indigo-300' : isWeekend ? (isDark ? 'bg-white/[0.03] text-slate-500' : 'bg-slate-100 text-slate-400') : T.muted}`}>
            {isEvent ? (
              <span className="jour-j-pin pointer-events-none absolute -top-0.5 left-1/2 z-20 -translate-x-1/2 text-[10px]" title={`${event.label} — ${formatDateFr(event.date)}`}>🚩</span>
            ) : null}
            {ultra ? (
              <div className="flex h-full items-end justify-center pb-1">
                {d.getDate() === 1 ? <span className="h-2 w-0.5 rounded bg-indigo-400" /> : null}
              </div>
            ) : (
              <>
                <div className={`flex items-center justify-between pt-1 ${dense ? 'px-0 justify-center' : 'px-1.5'}`}>
                  <span className="flex items-baseline gap-1">
                    {dense ? null : <span className="text-[9px] font-bold uppercase">{d.toLocaleDateString('fr-FR', { weekday: 'short' }).slice(0, 2)}</span>}
                    <span className={`${dense ? 'text-[9px]' : 'text-[11px]'} font-extrabold`}>{d.getDate()}</span>
                  </span>
                  {withHalves && count > 0 && columnWidth >= 62 ? <span className="rounded-full bg-indigo-600 px-1.5 text-[8px] font-extrabold text-white">{count}</span> : null}
                </div>
                {withHalves ? (
                  <div className={`mt-1 flex border-t ${T.grid} text-[8px] font-bold`}>
                    <div className={`w-1/2 border-r ${T.grid} py-0.5 text-center text-amber-400`}>{columnWidth >= 56 ? '☀ AM' : dense ? '' : '☀'}</div>
                    <div className="w-1/2 py-0.5 text-center text-indigo-300">{columnWidth >= 56 ? '☾ PM' : dense ? '' : '☾'}</div>
                  </div>
                ) : <div className="h-1" />}
              </>
            )}
          </div>
        );
      })}
    </div>
  );

  const dayHeaderPlain = useMemo(() => buildDayHeader(false), [columnWidth, totalDays, timelineStart, isDark, event.date]);   // eslint-disable-line react-hooks/exhaustive-deps
  const dayHeaderHalves = useMemo(() => buildDayHeader(true), [columnWidth, totalDays, timelineStart, isDark, event.date, dayLoad]);   // eslint-disable-line react-hooks/exhaustive-deps

  // La grille est peinte en CSS (un seul nœud par ligne) : sans cela le navigateur
  // recalculait des milliers de cellules à chaque image pendant un déplacement.
  const gridStyle = useMemo(() => {
    const col = columnWidth;
    const semaine = col * 7;
    const trait = isDark ? 'rgba(148,163,184,.16)' : 'rgba(100,116,139,.20)';
    const lundi = 'rgba(99,102,241,.28)';
    const weekend = isDark ? 'rgba(255,255,255,.03)' : 'rgba(148,163,184,.13)';
    return {
      backgroundImage: [
        `repeating-linear-gradient(to right, ${lundi} 0 2px, transparent 2px ${semaine}px)`,
        `repeating-linear-gradient(to right, transparent 0 ${col * 5}px, ${weekend} ${col * 5}px ${semaine}px)`,
        `repeating-linear-gradient(to right, transparent 0 ${Math.max(0, col - 1)}px, ${trait} ${Math.max(0, col - 1)}px ${col}px)`
      ].join(','),
      backgroundSize: `${semaine}px 100%, ${semaine}px 100%, ${col}px 100%`,
      backgroundRepeat: 'repeat'
    };
  }, [columnWidth, isDark]);

  // Élément mémorisé, pas composant : défini dans le corps du rendu, React le
  // détruisait et le reconstruisait à chaque mise à jour, sur chaque ligne.
  const fondGrille = useMemo(() => (
    <>
      <div className="pointer-events-none absolute inset-0" style={gridStyle} />
      {todayOffset >= 0 && todayOffset < totalDays ? (
        <div className="pointer-events-none absolute inset-y-0 bg-indigo-500/12"
          style={{ left: `${todayOffset * columnWidth}px`, width: `${columnWidth}px` }} />
      ) : null}
      {eventOffset >= 0 && eventOffset < totalDays ? (
        <div className="jour-j-col pointer-events-none absolute inset-y-0 border-x-2 border-rose-400/80"
          style={{ left: `${eventOffset * columnWidth}px`, width: `${columnWidth}px` }} />
      ) : null}
    </>
  ), [gridStyle, todayOffset, eventOffset, columnWidth, totalDays]);

  const isEventBar = (startIso, duration) => {
    const s = parseDate(startIso);
    const e = addDays(s, Math.max(0, Math.ceil(duration) - 1));
    const ev = parseDate(event.date);
    return ev >= s && ev <= e;
  };

  const barGeometry = (startUnits, lenUnits, isDragging) => {
    let left = startUnits * columnWidth;
    let width = lenUnits * columnWidth;
    if (isDragging) {
      if (drag.action === 'move') left += drag.deltaX;
      else if (drag.action === 'resize-left') { left += drag.deltaX; width -= drag.deltaX; }
      else width += drag.deltaX;
    }
    return { left, width };
  };

  if (!unlocked) {
    return (
      <div className={`flex h-screen items-center justify-center p-6 ${T.app}`}>
        <div className={`w-full max-w-sm rounded-2xl border p-6 shadow-2xl ${T.panel}`}>
          <div className="mb-5 flex items-center gap-3">
            <div className="flex h-11 w-11 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 to-fuchsia-600 text-xl font-black text-white shadow-lg">Δ</div>
            <div>
              <h1 className="text-sm font-extrabold tracking-tight">AuraPlan Studio</h1>
              <p className={`text-[11px] ${T.faint}`}>Roadmap · Kanban · Planning · Notes</p>
            </div>
          </div>

          <form onSubmit={(e) => { e.preventDefault(); enterBoard(passDraft, false); }}>
            <Field T={T} label="Votre prénom" hint="Pour que les autres sachent qui a travaillé sur le tableau.">
              <input className={inputCls} value={sync.nom}
                onChange={(e) => setSync({ ...sync, nom: e.target.value.slice(0, 40) })} placeholder="Ex. Camille" />
            </Field>
            <div className="mt-3" />
            <Field T={T} label="Mot de passe partagé" hint="Le même pour tout le monde : il ouvre le tableau et chiffre les échanges.">
              <input type="password" autoFocus className={inputCls} value={passDraft}
                onChange={(e) => setPassDraft(e.target.value)} placeholder="••••••••" />
            </Field>
            <label className={`mt-3 flex items-center gap-2 text-[11px] ${T.muted}`}>
              <input type="checkbox" className="h-3.5 w-3.5 accent-indigo-500" checked={rememberPass} onChange={(e) => setRememberPass(e.target.checked)} />
              Retenir sur cet appareil
            </label>
            <button type="submit" disabled={!passDraft.trim()} className={`mt-4 w-full ${btnPrimary} ${!passDraft.trim() ? 'opacity-40' : ''}`}>Ouvrir le tableau</button>
          </form>

          <button type="button" onClick={() => enterBoard('', true)} className={`mt-2 w-full ${btnQuiet}`}>Travailler seul, sur cet appareil</button>
          <button type="button" className={`mt-1 w-full ${btnQuiet}`}
            onClick={() => { if (window.confirm('Effacer les réglages de cet appareil (mot de passe, jeton, tableau local) ?\n\nLa copie enregistrée dans le dépôt n’est pas touchée.')) oublierAppareil(); }}>
            Repartir de zéro sur cet appareil
          </button>

          {!pageSecurisee() ? (
            <div className="mt-4 rounded-xl border border-amber-500/40 bg-amber-500/10 p-3 text-[11px] leading-relaxed text-amber-200">
              Cette page n'est pas ouverte en <strong>https</strong>. Le partage a besoin du chiffrement du navigateur,
              qui n'est disponible qu'en https : ouvrez l'adresse <span className="font-mono">https://…github.io/…</span>
              plutôt que le fichier depuis votre disque. Vous pouvez tout de même travailler seul.
            </div>
          ) : null}

          <p className={`mt-5 border-t pt-4 text-[10px] leading-relaxed ${T.border} ${T.faint}`}>
            Le tableau est conservé, chiffré, dans votre dépôt GitHub. Toute personne ayant cette adresse
            et ce mot de passe le retrouve, depuis n'importe quel ordinateur.
          </p>
        </div>
      </div>
    );
  }

  return (
    <div className={`flex h-screen flex-col overflow-hidden ${T.app} ${drag ? 'is-dragging' : ''}`}>

      {/* ------------------------------ En-tête ------------------------------ */}
      <header className={`flex h-14 shrink-0 items-center justify-between gap-3 overflow-hidden border-b px-4 ${T.rail} ${T.border}`}>
        <div className="flex min-w-0 flex-1 items-center gap-4">
          <div className="flex min-w-0 items-center gap-2.5">
            <div className="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 to-fuchsia-600 text-lg font-black text-white shadow-lg shadow-indigo-950/50">Δ</div>
            <div className="hidden min-w-0 leading-tight sm:block">
              <div className="truncate text-sm font-extrabold tracking-tight">{data.board.titre}</div>
              <div className={`truncate text-[10px] font-medium ${T.faint}`}>Projet › tâche › sous-tâche</div>
            </div>
          </div>
          <nav className={`flex shrink-0 rounded-xl border p-1 ${T.raise}`}>
            {[
              { id: 'roadmap', label: 'Roadmap', key: '1' },
              { id: 'kanban', label: 'Kanban', key: '2' },
              { id: 'planning', label: 'Planning', key: '3' },
              { id: 'notes', label: 'Notes', key: '4' }
            ].map((tab) => (
              <button key={tab.id} type="button" onClick={() => setActiveTab(tab.id)}
                className={`whitespace-nowrap rounded-lg px-3.5 py-1.5 text-xs font-bold transition ${activeTab === tab.id ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-950/40' : `${T.muted} hover:text-indigo-400`}`}>
                {tab.label}<span className="ml-1.5 hidden font-mono text-[9px] opacity-50 sm:inline">{tab.key}</span>
              </button>
            ))}
          </nav>
        </div>

        <div className="flex shrink-0 items-center gap-2">
          <input type="search" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Rechercher…"
            className={`hidden w-40 shrink-0 xl:block ${champBase}`} />
          {activeTab !== 'notes' ? (
            <>
            <button type="button"
              onClick={() => setAssigneeFilter(assigneeFilter === (sync.nom || '') ? 'ALL' : (sync.nom || 'ALL'))}
              title="N'afficher que ce qui m'est assigné"
              className={`hidden shrink-0 whitespace-nowrap rounded-xl px-2.5 py-2 text-xs font-bold transition 2xl:block
                ${assigneeFilter !== 'ALL' && assigneeFilter === sync.nom ? 'border border-indigo-500 bg-indigo-600 text-white' : btnSecondary}`}>
              Mes tâches
            </button>
            <select value={assigneeFilter}
              onChange={(e) => { if (e.target.value === '__GERER__') { setIsEquipeOpen(true); return; } setAssigneeFilter(e.target.value); }}
              className={`hidden w-32 shrink-0 xl:block ${champBase}`}>
              <option value="ALL">Toute l'équipe</option>
              {collaborators.map((c) => <option key={c} value={c}>{c}</option>)}
              <option value="__GERER__">Gérer l'équipe…</option>
            </select>
            <button type="button" onClick={() => setIsEquipeOpen(true)} className={btnQuiet}
              title={`Gérer l'équipe (${collaborators.length} personne(s))`}>
              <span className="flex items-center gap-1.5">
                <span className="flex -space-x-1.5">
                  {collaborators.slice(0, 3).map((c) => <Avatar key={c} name={c} size="sm" />)}
                </span>
                <span className="hidden xl:inline">Équipe</span>
              </span>
            </button>
            </>
          ) : null}
          <button type="button" onClick={() => setIsDark(!isDark)} className={btnQuiet} title="Changer de thème">{isDark ? '☀' : '☾'}</button>
          <button type="button" onClick={() => setIsHelpOpen(true)} className={btnQuiet} title="Aide">?</button>
          <button type="button" onClick={() => setIsConfigOpen(true)} className={btnSecondary}
            title={syncEtat.etat === 'erreur' ? `Partage en erreur : ${syncEtat.message}`
              : syncEtat.etat === 'vide' ? syncEtat.message
                : syncEtat.etat === 'lecture' ? 'Lecture seule — ajoutez un jeton pour enregistrer'
                : syncEtat.etat === 'ok' ? (participantsActifs.length ? `Avec ${participantsActifs.map((p) => p.nom).join(', ')}` : 'Tableau partagé et enregistré')
                  : syncEtat.etat === 'travail' ? 'Synchronisation…' : 'Partage inactif'}>
            <span className="flex items-center gap-1.5">
              <span className={`h-2 w-2 shrink-0 rounded-full ${syncEtat.etat === 'ok' ? 'bg-emerald-400'
                : syncEtat.etat === 'travail' ? 'bg-amber-400'
                  : syncEtat.etat === 'lecture' ? 'bg-sky-400'
                    : syncEtat.etat === 'vide' ? 'bg-amber-400'
                      : syncEtat.etat === 'erreur' ? 'bg-rose-500' : 'bg-slate-500'}`} />
              {participantsActifs.length ? (
                <span className="hidden -space-x-1.5 2xl:flex">
                  {participantsActifs.slice(0, 3).map((p) => <Avatar key={p.id} name={p.nom} size="sm" />)}
                </span>
              ) : null}
              <span className="hidden w-[4.5rem] text-left lg:inline">
                {syncEtat.etat === 'ok' ? 'Partagé' : syncEtat.etat === 'lecture' ? 'Lecture'
                  : syncEtat.etat === 'vide' ? 'Vide' : syncEtat.etat === 'erreur' ? 'À régler'
                    : syncEtat.etat === 'travail' ? 'Partagé' : 'Partager'}
              </span>
            </span>
          </button>
          <button type="button" className={btnPrimary}
            onClick={() => {
              if (activeTab === 'planning') openEntryCreator(collaborators[0] || 'Moi', Math.max(0, todayOffset), 'AM');
              else if (activeTab === 'notes') createNote(null);
              else if (activeTab === 'kanban') setTaskForm({ id: null, projectId: selectedProjectId || (projects[0] && projects[0].id) || '', title: '', assignee: collaborators[0] || 'Moi', startDate: TODAY_STR, duration: 2, status: 'TODO', priority: 'MEDIUM', notes: '' });
              else setProjectForm({ id: null, title: '', category: 'Général', startDate: TODAY_STR, duration: 30, color: DEFAULT_COLOR });
            }}>
            {activeTab === 'planning' ? 'Planifier' : activeTab === 'notes' ? 'Nouvelle note' : activeTab === 'kanban' ? 'Nouvelle tâche' : 'Nouveau projet'}
          </button>
        </div>
      </header>

      {/* --------------------------- Barre d'outils --------------------------- */}
      <div className={`flex h-11 shrink-0 items-center justify-between gap-3 overflow-hidden border-b px-4 text-xs ${T.panel}`}>
          <div className="flex min-w-0 items-center gap-2">
            {activeTab === 'roadmap' ? (
              <>
                <button type="button" onClick={() => setIsLeftPanelOpen(!isLeftPanelOpen)} className={`shrink-0 ${btnSecondary}`}>
                  <span className="hidden lg:inline">{isLeftPanelOpen ? 'Réduire la colonne' : 'Afficher la colonne'}</span>
                  <span className="lg:hidden">{isLeftPanelOpen ? '◀' : '▶'}</span>
                </button>
                <button type="button" onClick={() => setIsRightPanelOpen(!isRightPanelOpen)} className={`hidden xl:inline-block ${btnSecondary}`}>{isRightPanelOpen ? 'Masquer le détail' : 'Afficher le détail'}</button>
                <button type="button" onClick={scrollToEvent} className={btnSecondary} title={`Aller à : ${event.label}`}>🚩 {event.label}</button>
                <button type="button" onClick={scrollToToday} className={btnSecondary}>Aujourd'hui</button>
                <span className={`ml-1 hidden text-[11px] 2xl:inline ${T.faint}`}>Clic maintenu sur la grille pour faire défiler · ← → pour avancer d'une semaine</span>
              </>
            ) : null}
            {activeTab === 'planning' ? (
              <>
                <button type="button" onClick={focusSprint} className={btnPrimary}>Sprint 2 semaines</button>
                <button type="button" onClick={scrollToToday} className={btnSecondary}>Aujourd'hui</button>
                <span className={`ml-1 hidden text-[11px] xl:inline ${T.faint}`}>Glissez un bloc vers une autre ligne pour changer de collaborateur</span>
              </>
            ) : null}
            {activeTab === 'notes' ? (
              <>
                <button type="button" className={btnSecondary} onClick={() => createNote(null)}>Nouvelle note</button>
                <span className={`ml-1 hidden text-[11px] xl:inline ${T.faint}`}>Devis, contacts, comparatifs : tout ce qui n'est pas une tâche</span>
              </>
            ) : null}
            {activeTab === 'kanban' ? (
              <>
                <span className={`hidden text-[11px] font-semibold lg:inline ${T.faint}`}>Grouper par</span>
                <div className={`flex rounded-xl border p-0.5 ${T.raise}`}>
                  {[{ id: 'status', label: 'Statut' }, { id: 'assignee', label: 'Personne' }, { id: 'priority', label: 'Priorité' }].map((opt) => (
                    <button key={opt.id} type="button" onClick={() => setGrouperPar(opt.id)}
                      className={`whitespace-nowrap rounded-lg px-2.5 py-1 text-[11px] font-bold transition ${grouperPar === opt.id ? 'bg-indigo-600 text-white' : `${T.muted} hover:text-indigo-400`}`}>
                      {opt.label}
                    </button>
                  ))}
                </div>
                <span className={`ml-1 hidden text-[11px] 2xl:inline ${T.faint}`}>Glissez les cartes pour les déplacer et les réordonner</span>
              </>
            ) : null}
          </div>

          <div className="flex shrink-0 items-center gap-3">
            <button type="button" onClick={() => setIsConfigOpen(true)}
              title={`${event.label} — ${formatDateFr(event.date)} (cliquez pour changer la date)`}
              className="flex items-center gap-1.5 rounded-xl border border-rose-500/40 bg-rose-500/10 px-2.5 py-1.5 text-[11px] font-extrabold text-rose-300 transition hover:bg-rose-500/20">
              <span className="jour-j-pin">🚩</span>
              <span className="w-12 text-left font-mono tabular-nums">
                {daysToEvent > 0 ? `J-${daysToEvent}` : daysToEvent === 0 ? 'Jour J' : `J+${Math.abs(daysToEvent)}`}
              </span>
              <span className="hidden font-mono font-medium opacity-70 2xl:inline">{formatDateFr(event.date)}</span>
            </button>
            <button type="button" onClick={undo} className={btnQuiet} title="Ctrl+Z">Annuler</button>
            {activeTab !== 'kanban' && activeTab !== 'notes' ? (
              <>
                <span className={`hidden font-semibold lg:inline ${T.faint}`}>Zoom</span>
                <input type="range" min="2" max="240" step="1" value={Math.round(columnWidth)}
                  onChange={(e) => { vueEnsemble.current = false; setColumnWidth(Number(e.target.value)); }} className="w-28" aria-label="Zoom" />
                <button type="button" onClick={() => { vueEnsemble.current = true; fitAll(); }} className={btnSecondary}>Tout afficher</button>
              </>
            ) : null}
          </div>
      </div>

      {/* ------------------------------ Contenu ------------------------------ */}
      <main className="relative flex flex-1 overflow-hidden">

        {/* Rappel discret de l'échéance lorsqu'elle est hors de l'écran */}
        {activeTab === 'roadmap' && viewport.width > 0 && eventOffset >= 0 ? (() => {
          const eventX = nameColWidth + eventOffset * columnWidth;
          const gauche = eventX < viewport.left + nameColWidth;
          const droite = eventX > viewport.left + viewport.width - 12;
          if (!gauche && !droite) return null;
          return (
            <button type="button" onClick={scrollToEvent}
              title={`${event.label} — ${formatDateFr(event.date)} · cliquez pour y aller`}
              className={`group absolute top-1/2 z-[45] flex -translate-y-1/2 items-center gap-1 rounded-full border border-rose-400/40 bg-rose-500/15 px-2 py-1.5 text-[10px] font-bold text-rose-300 opacity-60 backdrop-blur transition hover:opacity-100
                ${droite ? 'right-2' : 'left-2'} ${isRightPanelOpen && droite ? 'lg:right-[21rem]' : ''}`}>
              {gauche ? <span>‹</span> : null}
              <span className="jour-j-pin">🚩</span>
              <span className="hidden font-mono group-hover:inline">{daysToEvent > 0 ? `J-${daysToEvent}` : formatDateFr(event.date)}</span>
              {droite ? <span>›</span> : null}
            </button>
          );
        })() : null}

        {/* ============================= ROADMAP ============================= */}
        {activeTab === 'roadmap' ? (
          <>
            <div id="timeline-viewport" onMouseDown={startPan} onScroll={onTimelineScroll}
              className={`flex-1 overflow-auto ${panning ? 'cursor-grabbing select-none' : 'cursor-grab'} ${isDark ? 'bg-[#05080F]' : 'bg-[#EEF1F6]'}`}>
              <div style={{ width: `${timelineWidth + nameColWidth}px`, minWidth: '100%' }}>

                <div className={`sticky top-0 z-30 flex h-7 border-b ${T.rail} ${T.border}`}>
                  <div style={{ width: `${nameColWidth}px` }} className={`sticky left-0 z-40 flex items-center border-r px-3 text-[10px] font-bold uppercase tracking-wide ${T.rail} ${T.border} ${T.faint}`}>
                    {isLeftPanelOpen ? `${projects.length} projet(s)` : '—'}
                  </div>
                  <div className="flex">
                    {timelineMonths.map((m, i) => (
                      <div key={i} style={{ width: `${m.days * columnWidth}px` }} className={`flex h-full items-center justify-center border-r text-[10px] font-extrabold uppercase tracking-wider ${T.grid} ${T.faint}`}>
                        {m.days * columnWidth > 90 ? m.label : m.days * columnWidth > 26 ? m.label.slice(0, 3) : ''}
                      </div>
                    ))}
                  </div>
                </div>

                <div className={`sticky top-7 z-30 flex h-11 border-b ${T.rail} ${T.border}`}>
                  <div style={{ width: `${nameColWidth}px` }} className={`sticky left-0 z-40 flex items-center justify-between border-r px-3 text-[11px] font-bold ${T.rail} ${T.border}`}>
                    {isLeftPanelOpen ? (<><span>Structure</span><button type="button" onClick={() => setIsLeftPanelOpen(false)} className={`text-[10px] ${T.faint}`}>◀</button></>)
                      : <button type="button" onClick={() => setIsLeftPanelOpen(true)} className="text-[10px] font-bold text-indigo-400">▶</button>}
                  </div>
                  {dayHeaderPlain}
                </div>

                <div className="relative">
                  {/* Repère de l'échéance, traversant toutes les lignes */}
                  {eventOffset >= 0 && eventOffset < totalDays ? (
                    <div className="pointer-events-none absolute inset-y-0 z-[8]"
                      style={{ left: `${nameColWidth + eventOffset * columnWidth}px`, width: `${Math.max(3, columnWidth)}px` }}>
                      <div className="jour-j-pin absolute inset-y-0 left-1/2 w-0.5 -translate-x-1/2 bg-rose-400" />
                      <div className="absolute -top-0.5 left-1/2 -translate-x-1/2 whitespace-nowrap rounded-b-lg border border-t-0 border-rose-400/70 bg-rose-500/95 px-2 py-0.5 text-[10px] font-extrabold text-white shadow-lg">
                        🚩 {event.label} · {formatDateFr(event.date)}
                      </div>
                    </div>
                  ) : null}
                  {projects.length === 0 ? (
                    <div className="flex">
                      <div style={{ width: `${nameColWidth}px` }} data-nopan className={`sticky left-0 z-20 shrink-0 border-r px-4 py-10 ${T.panel}`}>
                        <p className={`text-[11px] leading-relaxed ${T.faint}`}>Aucun projet. Le bouton « Nouveau projet », en haut à droite, en crée un.</p>
                      </div>
                      <div className="relative min-h-[12rem] flex-1" style={{ width: `${timelineWidth}px` }}>{fondGrille}</div>
                    </div>
                  ) : null}

                  {projects.map((proj) => {
                    const pct = projectProgress(proj);
                    const isOpen = !!openProjects[proj.id];
                    const isSelected = proj.id === selectedProjectId;
                    const dragging = drag && drag.kind === 'project' && drag.id === proj.id;
                    const startUnits = diffDays(parseDate(proj.startDate), timelineStart);
                    const geo = barGeometry(startUnits, proj.duration, dragging);

                    return (
                      <React.Fragment key={proj.id}>
                        {/* Niveau 1 — projet */}
                        <div className={`flex h-14 border-b ${T.border} ${isSelected ? 'bg-indigo-500/[0.07]' : ''}`}>
                          <div style={{ width: `${nameColWidth}px` }}
                            data-nopan className={`sticky left-0 z-20 flex items-center gap-2 border-r px-3 ${T.panel} ${isSelected ? 'shadow-[inset_3px_0_0_0_#6366F1]' : ''}`}>
                            {isLeftPanelOpen ? (
                              <>
                                <button type="button" onClick={() => setOpenProjects({ ...openProjects, [proj.id]: !isOpen })}
                                  className={`flex h-7 w-7 shrink-0 items-center justify-center rounded-lg border text-[12px] font-black leading-none transition
                                    ${isOpen ? 'border-indigo-400/70 bg-indigo-600 text-white shadow-md shadow-indigo-950/40'
                                             : `${T.border} ${isDark ? 'bg-white/10' : 'bg-slate-200'} text-indigo-400 hover:border-indigo-400 hover:bg-indigo-500/20`}`}
                                  aria-label={isOpen ? 'Replier le projet' : 'Déplier le projet'}
                                  title={isOpen ? 'Replier ce projet' : `Déplier ce projet (${proj.tasks.length} tâches)`}>
                                  {isOpen ? '−' : '+'}
                                </button>
                                <button type="button" onClick={() => setSelectedProjectId(proj.id)} className="min-w-0 flex-1 text-left">
                                  <div className="flex items-center gap-2">
                                    <span className={`h-2.5 w-2.5 shrink-0 rounded-full bg-gradient-to-r ${proj.color}`} />
                                    <span className="truncate text-xs font-extrabold">{proj.title}</span>
                                  </div>
                                  <div className={`mt-0.5 truncate text-[10px] ${T.faint}`}>{proj.category} · {proj.tasks.length} tâche(s)</div>
                                </button>
                                <span className={`font-mono text-[11px] font-extrabold ${pct === 100 ? 'text-emerald-400' : 'text-indigo-400'}`}>{pct}%</span>
                              </>
                            ) : <span className={`h-2.5 w-2.5 rounded-full bg-gradient-to-r ${proj.color}`} />}
                          </div>

                          <div className="relative" style={{ width: `${timelineWidth}px` }}>
                            {fondGrille}
                            {dragging ? <div style={{ left: `${drag.snapStart * columnWidth}px`, width: `${drag.snapLen * columnWidth}px` }} className="absolute top-3 h-8 rounded-lg border-2 border-dashed border-indigo-400 bg-indigo-500/10" /> : null}
                            <div style={{ left: `${geo.left}px`, width: `${Math.max(columnWidth * 0.6, geo.width)}px` }}
                                  data-nopan
                              onMouseDown={(e) => startDrag(e, { kind: 'project', id: proj.id, action: 'move', unit: 1, startUnits, lenUnits: proj.duration })}
