const NOTE_COLORS = [

const MONTHS_FR = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];

const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
const uid = (p) => p + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);

const parseDate = (str) => { const d = new Date(String(str) + 'T00:00:00'); return isNaN(d.getTime()) ? new Date() : d; };
const formatDateIso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (d, n) => { const r = new Date(d.getTime()); r.setDate(r.getDate() + n); return r; };
const diffDays = (a, b) => Math.round((a.getTime() - b.getTime()) / 86400000);
const TODAY_STR = formatDateIso(new Date());
const formatDateFr = (iso) => parseDate(iso).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
const formatDayShort = (iso) => parseDate(iso).toLocaleDateString('fr-FR', { weekday: 'short', day: '2-digit', month: 'short' });

const getMonday = (d) => { const x = new Date(d.getTime()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); x.setHours(0, 0, 0, 0); return x; };
const getWeekNumber = (d) => {
  const date = new Date(d.getTime());
  date.setHours(0, 0, 0, 0);
  date.setDate(date.getDate() + 3 - ((date.getDay() + 6) % 7));
  const week1 = new Date(date.getFullYear(), 0, 4);
  return 1 + Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
};

const isIsoDate = (s) => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(new Date(s + 'T00:00:00').getTime());
const safeDate = (s) => (isIsoDate(s) ? s : TODAY_STR);
const safeNum = (v, fallback, min, step) => {
  const n = Number(v);
  if (!Number.isFinite(n) || n < min) return fallback;
  return step ? Math.round(n / step) * step : n;
};
const safeText = (v, fallback) => { const s = typeof v === 'string' ? v.trim() : ''; return s ? s.slice(0, 200) : fallback; };
const rawText = (v, max) => (typeof v === 'string' ? v.slice(0, max || 400) : '');

const triggerConfetti = () => {
  try { if (typeof window.confetti === 'function') window.confetti({ particleCount: 160, spread: 95, origin: { y: 0.6 }, disableForReducedMotion: true }); }
  catch (e) { /* no-op */ }
};

const initials = (name) => String(name || '?').split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
const AVATAR_COLORS = ['bg-indigo-600', 'bg-emerald-600', 'bg-amber-600', 'bg-rose-600', 'bg-cyan-600', 'bg-fuchsia-600', 'bg-teal-600'];
const avatarColor = (name) => {
  let h = 0; const s = String(name || '');
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
};

const b64encode = (str) => {
  try { return window.btoa(String.fromCharCode.apply(null, Array.from(new TextEncoder().encode(str)))); }
  catch (e) { return window.btoa(unescape(encodeURIComponent(str))); }
};
const b64decode = (str) => {
  try {
    const bin = window.atob(String(str).replace(/\s/g, ''));
    return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
  } catch (e) { return ''; }
};

/* ------------------------ Normalisation défensive ------------------------ */
const normalizeSubtask = (s, fallbackDate) => {
  const o = s && typeof s === 'object' ? s : {};
  return {
    id: o.id ? String(o.id) : uid('st'),
    title: safeText(o.title, 'Sous-tâche'),
    assignee: safeText(o.assignee, 'Non assigné'),
    status: STATUSES.includes(o.status) ? o.status : 'TODO',
    startDate: safeDate(o.startDate || fallbackDate),
    duration: safeNum(o.duration, 1, 0.5, 0.5),
    notes: rawText(o.notes, 2000)
  };
};

const normalizeTask = (t, index) => {
  const o = t && typeof t === 'object' ? t : {};
  const startDate = safeDate(o.startDate);
  return {
    id: o.id ? String(o.id) : uid('t'),
    title: safeText(o.title, 'Tâche sans titre'),
    assignee: safeText(o.assignee, 'Non assigné'),
    startDate,
    duration: safeNum(o.duration, 1, 0.5, 0.5),
    status: STATUSES.includes(o.status) ? o.status : 'TODO',
    priority: PRIORITIES.includes(o.priority) ? o.priority : 'MEDIUM',
    rank: Number.isFinite(Number(o.rank)) ? Number(o.rank) : (index || 0),
    notes: rawText(o.notes, 4000),
    subtasks: Array.isArray(o.subtasks) ? o.subtasks.map((s) => normalizeSubtask(s, startDate)) : []
  };
};

const normalizeProject = (p) => {
  const o = p && typeof p === 'object' ? p : {};
  return {
    id: o.id ? String(o.id) : uid('proj'),
    title: safeText(o.title, 'Projet sans titre'),
    category: safeText(o.category, 'Général'),
    startDate: safeDate(o.startDate),
    duration: safeNum(o.duration, 10, 1, 1),
    color: typeof o.color === 'string' && o.color.startsWith('from-') ? o.color : DEFAULT_COLOR,
    tasks: Array.isArray(o.tasks) ? o.tasks.map(normalizeTask) : []
  };
};

const normalizeEntry = (e) => {
  const o = e && typeof e === 'object' ? e : {};
  return {
    id: o.id ? String(o.id) : uid('pe'),
    title: safeText(o.title, 'Entrée'),
    tag: safeText(o.tag, 'Général'),
    color: typeof o.color === 'string' && o.color.startsWith('from-') ? o.color : DEFAULT_COLOR,
    assignee: safeText(o.assignee, 'Non assigné'),
    startDate: safeDate(o.startDate),
    slot: o.slot === 'PM' ? 'PM' : 'AM',
    duration: safeNum(o.duration, 0.5, 0.5, 0.5),
    notes: rawText(o.notes, 2000)
  };
};

const normalizeNote = (n) => {
  const o = n && typeof n === 'object' ? n : {};
  return {
    id: o.id ? String(o.id) : uid('note'),
    title: rawText(o.title, 160),
    body: rawText(o.body, 40000),
    color: NOTE_COLORS.some((c) => c.value === o.color) ? o.color : 'indigo',
    projectId: o.projectId ? String(o.projectId) : '',
    pinned: !!o.pinned,
    updatedAt: typeof o.updatedAt === 'string' ? o.updatedAt : new Date().toISOString()
  };
};

const normalizeData = (raw) => {
  const o = raw && typeof raw === 'object' ? raw : {};
  return {
    projects: Array.isArray(o.projects) ? o.projects.map(normalizeProject) : [],
    planning: Array.isArray(o.planning) ? o.planning.map(normalizeEntry)
      : Array.isArray(o.planningEntries) ? o.planningEntries.map(normalizeEntry) : [],
    notes: Array.isArray(o.notes) ? o.notes.map(normalizeNote) : []
  };
};

const SEED = normalizeData(SEED_RAW);

const loadJson = (key, fallback) => {
  try {
    const raw = window.localStorage.getItem(key);
    if (!raw) return fallback;
    const parsed = JSON.parse(raw);
    return parsed && typeof parsed === 'object' ? parsed : fallback;
  } catch (e) {
    try { window.localStorage.removeItem(key); } catch (e2) { /* no-op */ }
    return fallback;
  }
};
const saveJson = (key, value) => { try { window.localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; } };

const loadData = () => {
  const stored = loadJson(STORAGE_KEY, null);
  if (!stored) return SEED;
  const clean = normalizeData(stored);
  if (clean.projects.length === 0 && clean.planning.length === 0 && clean.notes.length === 0) return SEED;
  return clean;
};

/* ------------------------------ Composants ------------------------------ */
function Avatar({ name, size }) {
  const s = size === 'sm' ? 'w-6 h-6 text-[9px]' : size === 'lg' ? 'w-10 h-10 text-xs' : 'w-8 h-8 text-[10px]';
  return <span className={`${s} ${avatarColor(name)} rounded-xl flex items-center justify-center font-extrabold text-white shrink-0 shadow-sm`} title={name}>{initials(name)}</span>;
}

function Modal({ title, subtitle, onClose, children, footer, T, size }) {
  const width = size === 'lg' ? 'max-w-2xl' : size === 'sm' ? 'max-w-sm' : 'max-w-lg';
  return (
    <div className="fixed inset-0 z-[80] flex items-start justify-center overflow-y-auto bg-black/70 p-4 backdrop-blur-sm sm:items-center"
      onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className={`w-full ${width} overflow-hidden rounded-2xl border shadow-2xl ${T.panel}`} onMouseDown={(e) => e.stopPropagation()}>
        <div className={`flex items-start justify-between gap-4 border-b px-5 py-4 ${T.border} ${T.rail}`}>
          <div>
            <h3 className="text-sm font-extrabold tracking-tight">{title}</h3>
            {subtitle ? <p className={`mt-0.5 text-[11px] ${T.muted}`}>{subtitle}</p> : null}
          </div>
          <button type="button" onClick={onClose} aria-label="Fermer" className={`rounded-lg px-2 py-1 text-sm ${T.muted} ${T.hover}`}>✕</button>
        </div>
        <div className="max-h-[68vh] overflow-y-auto px-5 py-4">{children}</div>
        {footer ? <div className={`flex items-center justify-between gap-3 border-t px-5 py-4 ${T.border} ${T.rail}`}>{footer}</div> : null}
      </div>
    </div>
  );
}

function Field({ label, hint, children, T }) {
  return (
    <label className="block">
      <span className={`mb-1 block text-[11px] font-semibold uppercase tracking-wide ${T.muted}`}>{label}</span>
      {children}
      {hint ? <span className={`mt-1 block text-[10px] ${T.muted}`}>{hint}</span> : null}
    </label>
  );
}

function Toasts({ items, onDismiss }) {
  return (
    <div className="pointer-events-none fixed bottom-5 right-5 z-[100] flex w-72 flex-col gap-2">
      {items.map((t) => (
        <div key={t.id} onClick={() => onDismiss(t.id)}
          className={`pointer-events-auto cursor-pointer rounded-xl border px-4 py-3 text-xs font-semibold shadow-2xl backdrop-blur
            ${t.tone === 'error' ? 'border-rose-500/40 bg-rose-950/90 text-rose-100'
              : t.tone === 'success' ? 'border-emerald-500/40 bg-emerald-950/90 text-emerald-100'
                : 'border-indigo-500/40 bg-slate-900/95 text-slate-100'}`}>
          {t.message}
        </div>
      ))}
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error('AuraPlan — erreur de rendu :', error, info); }
  render() {
    if (this.state.error) {
      return (
        <div className="mx-auto mt-24 max-w-xl rounded-2xl border border-rose-500/40 bg-slate-900 p-8 text-slate-100">
          <h1 className="mb-2 text-lg font-extrabold">L'affichage s'est interrompu</h1>
          <p className="mb-4 text-sm text-slate-400">Une donnée locale est probablement corrompue. Réinitialisez le stockage pour repartir d'une base saine.</p>
          <pre className="mb-4 max-h-40 overflow-auto rounded-lg bg-black/40 p-3 text-[11px] text-rose-300">{String(this.state.error && this.state.error.message)}</pre>
          <button className="rounded-xl bg-indigo-600 px-4 py-2 text-xs font-bold text-white"
            onClick={() => { try { window.localStorage.removeItem(STORAGE_KEY); } catch (e) { /* no-op */ } window.location.reload(); }}>
            Réinitialiser et recharger
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

/* ------------------------------ Application ------------------------------ */
function AuraPlanApp() {

  const [toasts, setToasts] = useState([]);
  const pushToast = useCallback((message, tone) => {
    const id = uid('toast');
    setToasts((prev) => [...prev.slice(-3), { id, message, tone: tone || 'info' }]);
    window.setTimeout(() => setToasts((prev) => prev.filter((t) => t.id !== id)), 4200);
  }, []);
  const dismissToast = useCallback((id) => setToasts((prev) => prev.filter((t) => t.id !== id)), []);

  const commit = useCallback((mutator, label) => {
    const prev = dataRef.current;
    const next = normalizeData(typeof mutator === 'function' ? mutator(prev) : mutator);
    undoStack.current.push(prev);
    if (undoStack.current.length > 60) undoStack.current.shift();
    dataRef.current = next;
    setData(next);
    if (label) pushToast(label, 'success');
    return next;
  }, [pushToast]);

  // Écriture sans point d'annulation (frappe au clavier dans les notes)

  const btnDanger = 'rounded-xl border border-rose-500/40 bg-rose-500/10 px-3 py-2 text-xs font-bold text-rose-300 transition hover:bg-rose-500/20';

  /* ------------------------------ États UI ------------------------------ */
  const [selectedProjectId, setSelectedProjectId] = useState(() => (SEED.projects[0] ? SEED.projects[0].id : null));
  const [openProjects, setOpenProjects] = useState(() => (prefs.openProjects && typeof prefs.openProjects === 'object' ? prefs.openProjects : {}));
  const [openTasks, setOpenTasks] = useState({});

  const [editingEntry, setEditingEntry] = useState(null);

  const [splitEntry, setSplitEntry] = useState(null);
  const [splitSegments, setSplitSegments] = useState([0.5, 0.5]);
  const [projectForm, setProjectForm] = useState(null);
  const [isConfigOpen, setIsConfigOpen] = useState(false);
  const [isHelpOpen, setIsHelpOpen] = useState(false);
  const [selectedNoteId, setSelectedNoteId] = useState(null);

  const anyModalOpen = !!(editingTask || taskForm || subtaskForm || editingEntry || entryForm || splitEntry || projectForm || isConfigOpen || isHelpOpen);
  const closeAllModals = useCallback(() => {
    setEditingTask(null); setTaskForm(null); setSubtaskForm(null); setEditingEntry(null);
    setEntryForm(null); setSplitEntry(null); setProjectForm(null); setIsConfigOpen(false); setIsHelpOpen(false);
  }, []);

  useEffect(() => { saveJson(PREFS_KEY, { isDark, tab: activeTab, columnWidth, openProjects }); }, [openProjects, isDark, activeTab, columnWidth]);

  useEffect(() => {

  }, [projects, selectedProjectId]);

  const selectedProject = projects.find((p) => p.id === selectedProjectId) || null;

  /* --------------------------- Données dérivées --------------------------- */
  const allTasks = useMemo(() => {
    const list = [];
    projects.forEach((p) => p.tasks.forEach((t) => list.push({ ...t, project: { id: p.id, title: p.title, color: p.color, category: p.category } })));
    return list;
  }, [projects]);

  const collaborators = useMemo(() => {
    const set = new Set();
    planning.forEach((e) => set.add(e.assignee));
    allTasks.forEach((t) => { set.add(t.assignee); t.subtasks.forEach((s) => set.add(s.assignee)); });
    if (set.size === 0) set.add('Moi');
    return Array.from(set).sort((a, b) => a.localeCompare(b, 'fr'));
  }, [planning, allTasks]);

  const taskProgress = useCallback((t) => {
    if (t.subtasks.length) return t.subtasks.filter((s) => s.status === 'DONE').length / t.subtasks.length;
    return t.status === 'DONE' ? 1 : 0;
  }, []);

  const projectProgress = useCallback((p) => {
    if (!p || p.tasks.length === 0) return 0;
    return Math.round((p.tasks.reduce((a, t) => a + taskProgress(t), 0) / p.tasks.length) * 100);
  }, [taskProgress]);

  const projectHealth = useCallback((p) => {
    if (!p || p.tasks.length === 0) return { tone: 'neutral', label: 'Aucune tâche' };
    const end = addDays(parseDate(p.startDate), p.duration);
    let maxEnd = parseDate(p.startDate);
    p.tasks.forEach((t) => {
      const e = addDays(parseDate(t.startDate), t.duration);
      if (e > maxEnd) maxEnd = e;
      t.subtasks.forEach((s) => { const se = addDays(parseDate(s.startDate), s.duration); if (se > maxEnd) maxEnd = se; });
    });
    const delta = diffDays(maxEnd, end);
    if (delta > 0) return { tone: 'danger', label: `Dépassement de ${delta} j` };
    if (delta < 0) return { tone: 'success', label: `${Math.abs(delta)} j de marge` };
    return { tone: 'success', label: 'Dans les temps' };
  }, []);

  /* ---------------------------- Bornes timeline ---------------------------- */
  const { timelineStart, totalDays } = useMemo(() => {
    let min = parseDate(TODAY_STR);
    let max = addDays(parseDate(TODAY_STR), 14);
    const consider = (startIso, duration) => {
      const s = parseDate(startIso);
      const e = addDays(s, Math.ceil(duration));
      if (s < min) min = s;
      if (e > max) max = e;
    };
    if (activeTab === 'planning') planning.forEach((e) => consider(e.startDate, e.duration));
    else projects.forEach((p) => {
      consider(p.startDate, p.duration);
      p.tasks.forEach((t) => { consider(t.startDate, t.duration); t.subtasks.forEach((s) => consider(s.startDate, s.duration)); });
    });
    const start = getMonday(addDays(min, -3));
    return { timelineStart: start, totalDays: clamp(diffDays(addDays(max, 5), start), 28, 900) };
  }, [projects, planning, activeTab]);

  const timelineWeeks = useMemo(() => {
    const weeks = []; let current = null;
    for (let i = 0; i < totalDays; i++) {
      const d = addDays(timelineStart, i);
      const w = getWeekNumber(d);
      if (!current || current.weekNum !== w) { current = { weekNum: w, days: 0 }; weeks.push(current); }
      current.days++;
    }
    return weeks;
  }, [timelineStart, totalDays]);

  const timelineMonths = useMemo(() => {
    const months = []; let current = null; let key = '';
    for (let i = 0; i < totalDays; i++) {
      const d = addDays(timelineStart, i);
      const k = `${d.getFullYear()}-${d.getMonth()}`;
      if (k !== key) { key = k; current = { label: `${MONTHS_FR[d.getMonth()]} ${d.getFullYear()}`, days: 0 }; months.push(current); }
      current.days++;
    }
    return months;
  }, [timelineStart, totalDays]);

  const todayOffset = diffDays(parseDate(TODAY_STR), timelineStart);

  /* ------------------------------ Planning ------------------------------ */
  const filteredPlanning = useMemo(() => {
    const q = search.trim().toLowerCase();
    return planning.filter((e) => {
      if (assigneeFilter !== 'ALL' && e.assignee !== assigneeFilter) return false;
      if (!q) return true;
      return (e.title + ' ' + e.tag + ' ' + e.assignee).toLowerCase().includes(q);
    });
  }, [planning, search, assigneeFilter]);

  const planningRows = useMemo(() => {
    const people = assigneeFilter === 'ALL' ? collaborators : collaborators.filter((c) => c === assigneeFilter);
    return people.map((person) => {
      const entries = filteredPlanning.filter((e) => e.assignee === person).map((e) => {
        const startHalf = diffDays(parseDate(e.startDate), timelineStart) * 2 + (e.slot === 'PM' ? 1 : 0);
        return { ...e, startHalf, lenHalf: Math.max(1, Math.round(e.duration * 2)) };
      }).sort((a, b) => a.startHalf - b.startHalf);

      const lanes = []; const load = new Map();
      entries.forEach((e) => {
        let lane = lanes.findIndex((freeAt) => freeAt <= e.startHalf);
        if (lane === -1) { lane = lanes.length; lanes.push(e.startHalf + e.lenHalf); } else lanes[lane] = e.startHalf + e.lenHalf;
        e.lane = lane;
        for (let h = e.startHalf; h < e.startHalf + e.lenHalf; h++) load.set(h, (load.get(h) || 0) + 1);
      });
      const laneCount = Math.max(1, lanes.length);
      return { person, entries, laneCount, load, workload: entries.reduce((s, e) => s + e.lenHalf, 0) / 2, height: Math.max(66, laneCount * 30 + 22) };
    });
  }, [filteredPlanning, collaborators, assigneeFilter, timelineStart]);

  const dayLoad = useMemo(() => {
    const map = new Map();
    filteredPlanning.forEach((e) => {
      const start = diffDays(parseDate(e.startDate), timelineStart);
      for (let i = 0; i < Math.max(1, Math.ceil(e.duration)); i++) map.set(start + i, (map.get(start + i) || 0) + 1);
    });
    return map;
  }, [filteredPlanning, timelineStart]);

  /* ------------------------------- Kanban ------------------------------- */
  const kanbanTasks = useMemo(() => {
    const q = search.trim().toLowerCase();
    return allTasks.filter((t) => {
      if (assigneeFilter !== 'ALL' && t.assignee !== assigneeFilter) return false;
      if (!q) return true;
      return (t.title + ' ' + t.assignee + ' ' + t.project.title).toLowerCase().includes(q);
    }).sort((a, b) => a.rank - b.rank || a.title.localeCompare(b.title, 'fr'));
  }, [allTasks, search, assigneeFilter]);

  const [draggingTaskId, setDraggingTaskId] = useState(null);
  const [dropTarget, setDropTarget] = useState(null); // { status, index }

  const moveTask = useCallback((taskId, status, index) => {
    let celebrateProjectId = null;
    const next = commit((prev) => {
      let moved = null;
      prev.projects.forEach((p) => p.tasks.forEach((t) => { if (t.id === taskId) { moved = t; celebrateProjectId = p.id; } }));
      if (!moved) return prev;

      const column = [];
      prev.projects.forEach((p) => p.tasks.forEach((t) => { if (t.status === status) column.push(t); }));
      column.sort((a, b) => a.rank - b.rank || a.title.localeCompare(b.title, 'fr'));

      const currentIndex = column.findIndex((t) => t.id === taskId);
      const without = column.filter((t) => t.id !== taskId);
      let target = clamp(Number.isFinite(index) ? index : without.length, 0, without.length);
      if (currentIndex !== -1 && currentIndex < target) target -= 1;
      without.splice(target, 0, moved);

      const ranks = new Map(without.map((t, i) => [t.id, i]));
      return {
        ...prev,
        projects: prev.projects.map((p) => ({
          ...p,
          tasks: p.tasks.map((t) => {
            if (t.id === taskId) return { ...t, status, rank: ranks.get(t.id) };
            return ranks.has(t.id) ? { ...t, rank: ranks.get(t.id) } : t;
          })
        }))
      };
    });
    if (status === 'DONE' && celebrateProjectId) {
      const fresh = next.projects.find((p) => p.id === celebrateProjectId);
      if (fresh && projectProgress(fresh) === 100) { triggerConfetti(); pushToast(`« ${fresh.title} » est bouclé à 100 %`, 'success'); }
    }
  }, [commit, projectProgress, pushToast]);

  const handleCardDragStart = (e, taskId) => {
    try { e.dataTransfer.setData('text/plain', taskId); e.dataTransfer.effectAllowed = 'move'; } catch (err) { /* no-op */ }
    window.setTimeout(() => setDraggingTaskId(taskId), 0);
  };
  const handleCardDragOver = (e, status, index) => {
    e.preventDefault(); e.stopPropagation();
    let after = true;
    try { const r = e.currentTarget.getBoundingClientRect(); after = e.clientY > r.top + r.height / 2; } catch (err) { after = true; }
    const idx = index + (after ? 1 : 0);
    setDropTarget((prev) => (prev && prev.status === status && prev.index === idx ? prev : { status, index: idx }));
  };
  const handleColumnDragOver = (e, status, length) => {
    e.preventDefault();
    setDropTarget((prev) => (prev && prev.status === status ? prev : { status, index: length }));
  };
  const handleDragEnd = () => { setDraggingTaskId(null); setDropTarget(null); };
  const handleColumnDrop = (e, status, length) => {
    e.preventDefault();
    let taskId = '';
    try { taskId = e.dataTransfer.getData('text/plain'); } catch (err) { taskId = ''; }
    if (!taskId) taskId = draggingTaskId || '';
    const index = dropTarget && dropTarget.status === status ? dropTarget.index : length;
    if (taskId) moveTask(taskId, status, index);
    handleDragEnd();
  };

  /* --------------------------- Actions projets --------------------------- */
  const setTaskStatus = useCallback((taskId, status) => {
    let projectId = null;
    const next = commit((prev) => ({
      ...prev,
      projects: prev.projects.map((p) => {
        if (!p.tasks.some((t) => t.id === taskId)) return p;
        projectId = p.id;
        return { ...p, tasks: p.tasks.map((t) => (t.id === taskId ? { ...t, status } : t)) };
      })
    }));
    if (status === 'DONE' && projectId) {
      const fresh = next.projects.find((p) => p.id === projectId);
      if (fresh && projectProgress(fresh) === 100) { triggerConfetti(); pushToast(`« ${fresh.title} » est bouclé à 100 %`, 'success'); }
    }
  }, [commit, projectProgress, pushToast]);

  const setSubtaskStatus = useCallback((subId, status) => {
    let projectId = null;
    const next = commit((prev) => ({
      ...prev,
      projects: prev.projects.map((p) => {
        let touched = false;
        const tasks = p.tasks.map((t) => {
          if (!t.subtasks.some((s) => s.id === subId)) return t;
          touched = true;
          return { ...t, subtasks: t.subtasks.map((s) => (s.id === subId ? { ...s, status } : s)) };
        });
        if (touched) projectId = p.id;
        return touched ? { ...p, tasks } : p;
      })
    }));
    if (status === 'DONE' && projectId) {
      const fresh = next.projects.find((p) => p.id === projectId);
      if (fresh && projectProgress(fresh) === 100) { triggerConfetti(); pushToast(`« ${fresh.title} » est bouclé à 100 %`, 'success'); }
    }
  }, [commit, projectProgress, pushToast]);

  const saveProject = (form) => {
    if (!String(form.title).trim()) { pushToast('Donnez un nom au projet', 'error'); return; }
    if (form.id) commit((prev) => ({ ...prev, projects: prev.projects.map((p) => (p.id === form.id ? { ...p, ...form, duration: Number(form.duration) } : p)) }), 'Projet mis à jour');
    else {
      const created = normalizeProject({ ...form, id: uid('proj'), tasks: [] });
      commit((prev) => ({ ...prev, projects: [...prev.projects, created] }), 'Projet créé');
      setSelectedProjectId(created.id);
    }
    setProjectForm(null);
  };

  const deleteProject = (projectId) => {
    const p = projects.find((x) => x.id === projectId);
    if (!p) return;
    if (!window.confirm(`Supprimer « ${p.title} » et ses ${p.tasks.length} tâche(s) ? Ctrl+Z permet de revenir en arrière.`)) return;
    commit((prev) => ({ ...prev, projects: prev.projects.filter((x) => x.id !== projectId) }), 'Projet supprimé');
  };

  const saveTask = (form) => {
    if (!String(form.title).trim()) { pushToast('Donnez un titre à la tâche', 'error'); return; }
    const projectId = form.projectId || (projects[0] && projects[0].id);
    if (!projectId) { pushToast('Créez d’abord un projet', 'error'); return; }
    if (form.id) {
      commit((prev) => ({ ...prev, projects: prev.projects.map((p) => ({ ...p, tasks: p.tasks.map((t) => (t.id === form.id ? { ...t, ...form, subtasks: t.subtasks } : t)) })) }), 'Tâche mise à jour');
    } else {
      const maxRank = allTasks.filter((t) => t.status === (form.status || 'TODO')).reduce((m, t) => Math.max(m, t.rank), -1);
      const task = normalizeTask({ ...form, id: uid('t'), rank: maxRank + 1, subtasks: [] });
      commit((prev) => ({ ...prev, projects: prev.projects.map((p) => (p.id === projectId ? { ...p, tasks: [...p.tasks, task] } : p)) }), 'Tâche créée');
    }
    setTaskForm(null); setEditingTask(null);
  };

  const deleteTask = (taskId) => {
    commit((prev) => ({ ...prev, projects: prev.projects.map((p) => ({ ...p, tasks: p.tasks.filter((t) => t.id !== taskId) })) }), 'Tâche supprimée');
    setEditingTask(null);
  };

  const saveSubtask = (form) => {
    if (!String(form.title).trim()) { pushToast('Donnez un titre à la sous-tâche', 'error'); return; }
    if (form.id) {
      commit((prev) => ({
        ...prev,
        projects: prev.projects.map((p) => ({ ...p, tasks: p.tasks.map((t) => (t.id === form.taskId ? { ...t, subtasks: t.subtasks.map((s) => (s.id === form.id ? normalizeSubtask({ ...s, ...form }, t.startDate) : s)) } : t)) }))
      }), 'Sous-tâche mise à jour');
    } else {
      commit((prev) => ({
        ...prev,
        projects: prev.projects.map((p) => ({ ...p, tasks: p.tasks.map((t) => (t.id === form.taskId ? { ...t, subtasks: [...t.subtasks, normalizeSubtask({ ...form, id: uid('st') }, t.startDate)] } : t)) }))
      }), 'Sous-tâche ajoutée');
      setOpenTasks((prev) => ({ ...prev, [form.taskId]: true }));
    }
    setSubtaskForm(null);
  };

  const deleteSubtask = (form) => {
    commit((prev) => ({
      ...prev,
      projects: prev.projects.map((p) => ({ ...p, tasks: p.tasks.map((t) => (t.id === form.taskId ? { ...t, subtasks: t.subtasks.filter((s) => s.id !== form.id) } : t)) }))
    }), 'Sous-tâche supprimée');
    setSubtaskForm(null);
  };

  /* ---------------------------- Actions planning ---------------------------- */
  const saveEntry = (form) => {
    if (!String(form.title).trim()) { pushToast('Donnez un titre à l’entrée', 'error'); return; }
    if (form.id) commit((prev) => ({ ...prev, planning: prev.planning.map((e) => (e.id === form.id ? normalizeEntry({ ...e, ...form }) : e)) }), 'Entrée mise à jour');
    else commit((prev) => ({ ...prev, planning: [...prev.planning, normalizeEntry({ ...form, id: uid('pe') })] }), 'Entrée planifiée');
    setEntryForm(null); setEditingEntry(null);
  };

  const deleteEntry = (entryId) => {
    commit((prev) => ({ ...prev, planning: prev.planning.filter((e) => e.id !== entryId) }), 'Entrée supprimée');
    setEditingEntry(null);
  };

  const duplicateEntry = (entry) => {
    commit((prev) => ({ ...prev, planning: [...prev.planning, normalizeEntry({ ...entry, id: uid('pe'), startDate: formatDateIso(addDays(parseDate(entry.startDate), 1)) })] }), 'Entrée dupliquée (J+1)');
    setEditingEntry(null);
  };

  const reassignEntry = (entryId, person) => {
    commit((prev) => ({ ...prev, planning: prev.planning.map((e) => (e.id === entryId ? { ...e, assignee: person } : e)) }), `Transférée à ${person}`);
  };

  const openSplit = (entry) => {
    setEditingEntry(null); setSplitEntry(entry);
    if (entry.duration > 1) {
      const first = Math.min(entry.duration - 0.5, Math.max(0.5, Math.round(entry.duration) / 2));
      setSplitSegments([first, Number((entry.duration - first).toFixed(1))]);
    } else setSplitSegments([0.5, 0.5]);
  };

  const applySplit = () => {
    if (!splitEntry) return;
    const sum = splitSegments.reduce((a, b) => a + Number(b), 0);
    if (Math.abs(sum - splitEntry.duration) > 0.001) { pushToast(`La somme des tranches (${sum} j) doit égaler ${splitEntry.duration} j`, 'error'); return; }
    let date = parseDate(splitEntry.startDate);
    let slot = splitEntry.slot;
    const parts = splitSegments.map((seg, idx) => {
      const part = normalizeEntry({ ...splitEntry, id: uid('pe'), title: `${splitEntry.title} · ${idx + 1}/${splitSegments.length}`, startDate: formatDateIso(date), slot, duration: Number(seg) });
      let halves = Math.round(Number(seg) * 2);
      while (halves > 0) {
        if (slot === 'AM') slot = 'PM';
        else { slot = 'AM'; date = addDays(date, 1); }
        halves--;
      }
      return part;
    });
    commit((prev) => ({ ...prev, planning: prev.planning.filter((x) => x.id !== splitEntry.id).concat(parts) }), `Entrée scindée en ${parts.length} tranches`);
    setSplitEntry(null);
  };

  const openEntryCreator = (person, dayIndex, slot) => {
    setEntryForm({ id: null, title: '', tag: 'Général', color: DEFAULT_COLOR, assignee: person, startDate: formatDateIso(addDays(timelineStart, dayIndex)), slot, duration: 0.5, notes: '' });
  };

  /* ------------------------------- Notes ------------------------------- */
  const sortedNotes = useMemo(() => {
    const q = search.trim().toLowerCase();
    return notes
      .filter((n) => !q || (n.title + ' ' + n.body).toLowerCase().includes(q))
      .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || String(b.updatedAt).localeCompare(String(a.updatedAt)));
  }, [notes, search]);

  useEffect(() => {
    if (activeTab !== 'notes') return;
    if (selectedNoteId && notes.some((n) => n.id === selectedNoteId)) return;
    setSelectedNoteId(sortedNotes[0] ? sortedNotes[0].id : null);
  }, [activeTab, notes, selectedNoteId, sortedNotes]);

  const selectedNote = notes.find((n) => n.id === selectedNoteId) || null;

  const createNote = (preset) => {
    const note = normalizeNote({ id: uid('note'), title: (preset && preset.title) || '', body: (preset && preset.body) || '', color: (preset && preset.color) || 'indigo', projectId: (preset && preset.projectId) || '', updatedAt: new Date().toISOString() });
    commit((prev) => ({ ...prev, notes: [note, ...prev.notes] }), 'Note créée');
    setSelectedNoteId(note.id);
    setActiveTab('notes');
  };

  const patchNote = (id, patch, quiet) => {
    const fn = (prev) => ({ ...prev, notes: prev.notes.map((n) => (n.id === id ? { ...n, ...patch, updatedAt: new Date().toISOString() } : n)) });
    if (quiet) applyQuiet(fn); else commit(fn);
  };

  const deleteNote = (id) => {
    commit((prev) => ({ ...prev, notes: prev.notes.filter((n) => n.id !== id) }), 'Note supprimée');
    setSelectedNoteId(null);
  };

  /* ---------------------------- Zoom & cadrage ---------------------------- */
  const nameColWidth = activeTab === 'planning' ? 240 : (isLeftPanelOpen ? 300 : 44);
  const nameColRef = useRef(nameColWidth);
  useEffect(() => { nameColRef.current = nameColWidth; }, [nameColWidth]);

  const fitAll = useCallback(() => {
    const vp = document.getElementById('timeline-viewport');
    if (!vp) return;
    setColumnWidth(clamp(Math.floor((vp.clientWidth - nameColRef.current - 24) / Math.max(1, totalDays)), 26, 240));
    vp.scrollLeft = 0;
  }, [totalDays]);

  const focusSprint = useCallback(() => {
    const vp = document.getElementById('timeline-viewport');
    if (!vp) return;
    const width = clamp(Math.floor((vp.clientWidth - nameColRef.current - 24) / 14), 48, 240);
    setColumnWidth(width);
    const offset = diffDays(getMonday(new Date()), timelineStart);
    window.requestAnimationFrame(() => { vp.scrollLeft = Math.max(0, offset * width); });
  }, [timelineStart]);

  const scrollToToday = useCallback(() => {
    const vp = document.getElementById('timeline-viewport');
    if (!vp) return;
    vp.scrollTo({ left: Math.max(0, todayOffset * columnWidth - (vp.clientWidth - nameColRef.current) / 3), behavior: 'smooth' });
  }, [todayOffset, columnWidth]);

  useEffect(() => {
    if (activeTab !== 'planning') return;
    const id = window.setTimeout(focusSprint, 60);
    return () => window.clearTimeout(id);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [activeTab]);

  /* --------------------- Glisser-déposer des barres --------------------- */
  const [drag, setDrag] = useState(null);
  const dragRef = useRef(null);
  const movedRef = useRef(false);
  const rafRef = useRef(null);
  const colWidthRef = useRef(columnWidth);
  const rowRefs = useRef({});
  useEffect(() => { colWidthRef.current = columnWidth; }, [columnWidth]);

  const updateDrag = useCallback((next) => { dragRef.current = next; setDrag(next); }, []);

  const startDrag = (e, payload) => {
    if (e.button !== 0) return;
    e.stopPropagation(); e.preventDefault();
    movedRef.current = false;
    updateDrag({ ...payload, startX: e.clientX, deltaX: 0, snapStart: payload.startUnits, snapLen: payload.lenUnits, targetPerson: payload.person || null });
  };

  const personAtY = (clientY) => {
    const map = rowRefs.current;
    const keys = Object.keys(map);
    for (let i = 0; i < keys.length; i++) {
      const el = map[keys[i]];
      if (!el || !el.getBoundingClientRect) continue;
      const r = el.getBoundingClientRect();
      if (r.height > 0 && clientY >= r.top && clientY <= r.bottom) return keys[i];
    }
    return null;
  };

  useEffect(() => {
    const onMove = (event) => {
      const d = dragRef.current;
      if (!d) return;
      const dx = event.clientX - d.startX;
      if (Math.abs(dx) > 3) movedRef.current = true;
      if (rafRef.current) window.cancelAnimationFrame(rafRef.current);
      rafRef.current = window.requestAnimationFrame(() => {
        const cur = dragRef.current;
        if (!cur) return;
        const unitPx = colWidthRef.current * cur.unit;
        const steps = Math.round(dx / unitPx);
        let snapStart = cur.startUnits;
        let snapLen = cur.lenUnits;
        if (cur.action === 'move') snapStart = Math.max(0, cur.startUnits + steps);
        else if (cur.action === 'resize-right') snapLen = Math.max(1, cur.lenUnits + steps);
        else if (cur.action === 'resize-left') {
          const shift = Math.min(steps, cur.lenUnits - 1);
          snapStart = Math.max(0, cur.startUnits + shift);
          snapLen = cur.lenUnits - (snapStart - cur.startUnits);
        }
        let targetPerson = cur.targetPerson;
        if (cur.kind === 'entry' && cur.action === 'move') {
          const hovered = personAtY(event.clientY);
          if (hovered) { targetPerson = hovered; if (hovered !== cur.person) movedRef.current = true; }
        }
        updateDrag({ ...cur, deltaX: dx, snapStart, snapLen, targetPerson });
      });
    };

    const onUp = () => {
      const d = dragRef.current;
      if (rafRef.current) window.cancelAnimationFrame(rafRef.current);
      updateDrag(null);
      if (!d || !movedRef.current) return;
      const personChanged = d.kind === 'entry' && d.targetPerson && d.targetPerson !== d.person;
      if (d.snapStart === d.startUnits && d.snapLen === d.lenUnits && !personChanged) return;

      if (d.kind === 'entry') {
        const startDate = formatDateIso(addDays(timelineStart, Math.floor(d.snapStart / 2)));
        const slot = d.snapStart % 2 === 1 ? 'PM' : 'AM';
        const duration = d.snapLen / 2;
        const assignee = d.targetPerson || d.person;
        commit((prev) => ({ ...prev, planning: prev.planning.map((e) => (e.id === d.id ? { ...e, startDate, slot, duration, assignee } : e)) }));
        if (personChanged) pushToast(`Transférée à ${assignee}`, 'success');
      } else if (d.kind === 'project') {
        const startDate = formatDateIso(addDays(timelineStart, d.snapStart));
        commit((prev) => ({ ...prev, projects: prev.projects.map((p) => (p.id === d.id ? { ...p, startDate, duration: d.snapLen } : p)) }));
      } else if (d.kind === 'task') {
        const startDate = formatDateIso(addDays(timelineStart, d.snapStart));
        commit((prev) => ({ ...prev, projects: prev.projects.map((p) => ({ ...p, tasks: p.tasks.map((t) => (t.id === d.id ? { ...t, startDate, duration: d.snapLen } : t)) })) }));
      } else if (d.kind === 'subtask') {
        const startDate = formatDateIso(addDays(timelineStart, d.snapStart));
        commit((prev) => ({
          ...prev,
          projects: prev.projects.map((p) => ({ ...p, tasks: p.tasks.map((t) => ({ ...t, subtasks: t.subtasks.map((s) => (s.id === d.id ? { ...s, startDate, duration: d.snapLen } : s)) })) }))
        }));
      }
    };

    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    return () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      if (rafRef.current) window.cancelAnimationFrame(rafRef.current);
    };
  }, [commit, timelineStart, updateDrag, pushToast]);

  /* ---------------------------- Raccourcis ---------------------------- */
  useEffect(() => {
    const onKey = (e) => {
      const tag = (e.target && e.target.tagName) || '';
      const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(tag) || (e.target && e.target.isContentEditable);
      if (e.key === 'Escape') { closeAllModals(); return; }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
      if (typing || anyModalOpen) return;
      if (e.key === '1') setActiveTab('roadmap');
      if (e.key === '2') setActiveTab('kanban');
      if (e.key === '3') setActiveTab('planning');
      if (e.key === '4') setActiveTab('notes');
      if (e.key.toLowerCase() === 't') scrollToToday();
      if (e.key.toLowerCase() === 'f') fitAll();
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [undo, closeAllModals, anyModalOpen, scrollToToday, fitAll]);

  /* --------------------------- Import / export --------------------------- */
  const fileInputRef = useRef(null);
  const exportJson = () => {
    try {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `auraplan-${TODAY_STR}.json`; a.click();
      window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      pushToast('Sauvegarde exportée', 'success');
    } catch (err) { pushToast('Export impossible dans ce navigateur', 'error'); }
  };
  const importJson = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { try { commit(normalizeData(JSON.parse(String(reader.result))), 'Données importées'); } catch (err) { pushToast('Fichier illisible : JSON invalide', 'error'); } };
    reader.onerror = () => pushToast('Lecture du fichier impossible', 'error');
    reader.readAsText(file);
  };

  /* -------------------------------- GitHub -------------------------------- */
  const [gh, setGh] = useState(() => {
    const s = loadJson(GH_KEY, {});
    return { owner: s.owner || '', repo: s.repo || '', branch: s.branch || 'main', path: s.path || 'auraplan-data.json', token: s.token || '' };
  });
  const [ghStatus, setGhStatus] = useState('');
  useEffect(() => { saveJson(GH_KEY, gh); }, [gh]);
  const ghUrl = () => `https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/${gh.path}`;
  const ghHeaders = () => ({ Authorization: `Bearer ${gh.token}`, Accept: 'application/vnd.github+json' });

  const ghPush = async () => {
    if (!gh.owner || !gh.repo || !gh.token) { setGhStatus('Renseignez le propriétaire, le dépôt et le jeton.'); return; }
    setGhStatus('Envoi en cours…');
    try {
      let sha = null;
      const head = await fetch(`${ghUrl()}?ref=${encodeURIComponent(gh.branch)}`, { headers: ghHeaders() });
      if (head.ok) sha = (await head.json()).sha;
      const res = await fetch(ghUrl(), {
        method: 'PUT',
        headers: { ...ghHeaders(), 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: `AuraPlan — mise à jour ${new Date().toLocaleString('fr-FR')}`, content: b64encode(JSON.stringify(data, null, 2)), branch: gh.branch, ...(sha ? { sha } : {}) })
      });
      if (!res.ok) throw new Error(`GitHub a répondu ${res.status}`);
      setGhStatus('Enregistré sur GitHub.');
      pushToast('Données envoyées sur GitHub', 'success');
    } catch (err) { setGhStatus(`Échec de l'envoi : ${err.message}`); }
  };

  const ghPull = async () => {
    if (!gh.owner || !gh.repo) { setGhStatus('Renseignez au moins le propriétaire et le dépôt.'); return; }
    setGhStatus('Récupération en cours…');
    try {
      const res = await fetch(`${ghUrl()}?ref=${encodeURIComponent(gh.branch)}`, { headers: gh.token ? ghHeaders() : { Accept: 'application/vnd.github+json' } });
      if (!res.ok) throw new Error(`GitHub a répondu ${res.status}`);
      const json = await res.json();
      commit(normalizeData(JSON.parse(b64decode(json.content || ''))), 'Données récupérées depuis GitHub');
      setGhStatus('Données chargées depuis GitHub.');
    } catch (err) { setGhStatus(`Échec de la récupération : ${err.message}`); }
  };

  /* --------------------------------- Rendu --------------------------------- */
  const timelineWidth = totalDays * columnWidth;

  const DayHeader = ({ withHalves }) => (
    <div className="flex" style={{ width: `${timelineWidth}px` }}>
      {Array.from({ length: totalDays }).map((_, i) => {
        const d = addDays(timelineStart, i);
        const isToday = formatDateIso(d) === TODAY_STR;
        const isWeekend = d.getDay() === 0 || d.getDay() === 6;
        const count = dayLoad.get(i) || 0;
        return (
          <div key={i} style={{ width: `${columnWidth}px`, minWidth: `${columnWidth}px` }}
            className={`flex h-full flex-col justify-between border-r ${T.grid} ${d.getDay() === 1 ? 'border-l-2 border-l-indigo-500/40' : ''}
              ${isToday ? 'bg-indigo-500/15 text-indigo-300' : isWeekend ? (isDark ? 'bg-white/[0.03] text-slate-500' : 'bg-slate-100 text-slate-400') : T.muted}`}>
            <div className="flex items-center justify-between px-1.5 pt-1">
              <span className="flex items-baseline gap-1">
                <span className="text-[9px] font-bold uppercase">{d.toLocaleDateString('fr-FR', { weekday: 'short' }).slice(0, 2)}</span>
                <span className="text-[11px] font-extrabold">{d.getDate()}</span>
              </span>
              {withHalves && count > 0 && columnWidth >= 62 ? <span className="rounded-full bg-indigo-600 px-1.5 text-[8px] font-extrabold text-white">{count}</span> : null}
            </div>
            {withHalves ? (
              <div className={`mt-1 flex border-t ${T.grid} text-[8px] font-bold`}>
                <div className={`w-1/2 border-r ${T.grid} py-0.5 text-center text-amber-400`}>{columnWidth >= 56 ? '☀ AM' : '☀'}</div>
                <div className="w-1/2 py-0.5 text-center text-indigo-300">{columnWidth >= 56 ? '☾ PM' : '☾'}</div>
              </div>
            ) : <div className="h-1" />}
          </div>
        );
      })}
    </div>
  );

  const GridBackground = ({ rowKey }) => (
    <div className="pointer-events-none absolute inset-0 flex">
      {Array.from({ length: totalDays }).map((_, i) => {
        const d = addDays(timelineStart, i);
        const isToday = formatDateIso(d) === TODAY_STR;
        const isWeekend = d.getDay() === 0 || d.getDay() === 6;
        return (
          <div key={rowKey + '-' + i} style={{ width: `${columnWidth}px`, minWidth: `${columnWidth}px` }}
            className={`h-full border-r ${T.grid} ${d.getDay() === 1 ? 'border-l-2 border-l-indigo-500/25' : ''}
              ${isToday ? 'bg-indigo-500/10' : isWeekend ? (isDark ? 'bg-white/[0.03]' : 'bg-slate-100/70') : ''}`} />
        );
      })}
    </div>
  );

  const barGeometry = (startUnits, lenUnits, isDragging) => {
    let left = startUnits * columnWidth;
    let width = lenUnits * columnWidth;
    if (isDragging) {
      if (drag.action === 'move') left += drag.deltaX;
      else if (drag.action === 'resize-left') { left += drag.deltaX; width -= drag.deltaX; }
      else width += drag.deltaX;
    }
    return { left, width };
  };

  return (
    <div className={`flex h-screen flex-col overflow-hidden ${T.app} ${drag ? 'is-dragging' : ''}`}>

      {/* ------------------------------ En-tête ------------------------------ */}
      <header className={`flex shrink-0 flex-wrap items-center justify-between gap-3 border-b px-4 py-2.5 ${T.rail} ${T.border}`}>
        <div className="flex items-center gap-5">
          <div className="flex items-center gap-2.5">
            <div className="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 to-fuchsia-600 text-lg font-black text-white shadow-lg shadow-indigo-950/50">Δ</div>
            <div className="leading-tight">
              <div className="text-sm font-extrabold tracking-tight">AuraPlan Studio</div>
              <div className={`text-[10px] font-medium ${T.faint}`}>Projet › tâche › sous-tâche</div>
            </div>
          </div>
          <nav className={`flex rounded-xl border p-1 ${T.raise}`}>
            {[
              { id: 'roadmap', label: 'Roadmap', key: '1' },
              { id: 'kanban', label: 'Kanban', key: '2' },
              { id: 'planning', label: 'Planning', key: '3' },
              { id: 'notes', label: 'Notes', key: '4' }
            ].map((tab) => (
              <button key={tab.id} type="button" onClick={() => setActiveTab(tab.id)}
                className={`rounded-lg px-3.5 py-1.5 text-xs font-bold transition ${activeTab === tab.id ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-950/40' : `${T.muted} hover:text-indigo-400`}`}>
                {tab.label}<span className="ml-1.5 hidden font-mono text-[9px] opacity-50 sm:inline">{tab.key}</span>
              </button>
            ))}
          </nav>
        </div>

        <div className="flex items-center gap-2">
          <input type="search" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Rechercher…"
            className={`hidden w-44 rounded-xl border px-3 py-2 text-xs outline-none focus:border-indigo-500 md:block ${inputCls}`} />
          {activeTab !== 'notes' ? (
            <select value={assigneeFilter} onChange={(e) => setAssigneeFilter(e.target.value)} className={`hidden w-36 lg:block ${inputCls}`}>
              <option value="ALL">Toute l'équipe</option>
              {collaborators.map((c) => <option key={c} value={c}>{c}</option>)}
            </select>
          ) : null}
          <button type="button" onClick={() => setIsDark(!isDark)} className={btnQuiet} title="Changer de thème">{isDark ? '☀' : '☾'}</button>
          <button type="button" onClick={() => setIsHelpOpen(true)} className={btnQuiet} title="Aide">?</button>
          <button type="button" onClick={() => setIsConfigOpen(true)} className={btnSecondary}>Synchroniser</button>
          <button type="button" className={btnPrimary}
            onClick={() => {
              if (activeTab === 'planning') openEntryCreator(collaborators[0] || 'Moi', Math.max(0, todayOffset), 'AM');
              else if (activeTab === 'notes') createNote(null);
              else if (activeTab === 'kanban') setTaskForm({ id: null, projectId: selectedProjectId || (projects[0] && projects[0].id) || '', title: '', assignee: collaborators[0] || 'Moi', startDate: TODAY_STR, duration: 2, status: 'TODO', priority: 'MEDIUM', notes: '' });
              else setProjectForm({ id: null, title: '', category: 'Général', startDate: TODAY_STR, duration: 30, color: DEFAULT_COLOR });
            }}>
            {activeTab === 'planning' ? 'Planifier' : activeTab === 'notes' ? 'Nouvelle note' : activeTab === 'kanban' ? 'Nouvelle tâche' : 'Nouveau projet'}
          </button>
        </div>
      </header>

      {/* --------------------------- Barre d'outils --------------------------- */}
      {activeTab !== 'notes' ? (
        <div className={`flex shrink-0 flex-wrap items-center justify-between gap-3 border-b px-4 py-2 text-xs ${T.panel}`}>
          <div className="flex flex-wrap items-center gap-2">
            {activeTab === 'roadmap' ? (
              <>
                <button type="button" onClick={() => setIsLeftPanelOpen(!isLeftPanelOpen)} className={btnSecondary}>{isLeftPanelOpen ? 'Réduire la colonne' : 'Afficher la colonne'}</button>
                <button type="button" onClick={() => setIsRightPanelOpen(!isRightPanelOpen)} className={btnSecondary}>{isRightPanelOpen ? 'Masquer le détail' : 'Afficher le détail'}</button>
                <span className={`ml-1 hidden text-[11px] xl:inline ${T.faint}`}>Chaque projet et chaque tâche se plie indépendamment avec ▸</span>
              </>
            ) : null}
            {activeTab === 'planning' ? (
              <>
                <button type="button" onClick={focusSprint} className={btnPrimary}>Sprint 2 semaines</button>
                <button type="button" onClick={scrollToToday} className={btnSecondary}>Aujourd'hui</button>
                <span className={`ml-1 hidden text-[11px] xl:inline ${T.faint}`}>Glissez un bloc vers une autre ligne pour changer de collaborateur</span>
              </>
            ) : null}
            {activeTab === 'kanban' ? (
              <span className={`text-[11px] ${T.faint}`}>Glissez les cartes pour changer de colonne <em>et</em> pour les réordonner dans la colonne</span>

          </div>

          <div className="flex items-center gap-3">
            <button type="button" onClick={undo} className={btnQuiet} title="Ctrl+Z">Annuler</button>
            {activeTab !== 'kanban' ? (
              <>
                <span className={`font-semibold ${T.faint}`}>Zoom</span>
                <input type="range" min="26" max="240" value={columnWidth} onChange={(e) => setColumnWidth(Number(e.target.value))} className="w-28" aria-label="Zoom" />
                <button type="button" onClick={fitAll} className={btnSecondary}>Tout afficher</button>
              </>
            ) : null}
          </div>
        </div>
      ) : null}

      {/* ------------------------------ Contenu ------------------------------ */}
      <main className="relative flex flex-1 overflow-hidden">

        {/* ============================= ROADMAP ============================= */}
        {activeTab === 'roadmap' ? (
          <>
            <div id="timeline-viewport" className={`flex-1 overflow-auto ${isDark ? 'bg-[#05080F]' : 'bg-[#EEF1F6]'}`}>
              <div style={{ width: `${timelineWidth + nameColWidth}px`, minWidth: '100%' }}>

                <div className={`sticky top-0 z-30 flex h-7 border-b ${T.rail} ${T.border}`}>
                  <div style={{ width: `${nameColWidth}px` }} className={`sticky left-0 z-40 flex items-center border-r px-3 text-[10px] font-bold uppercase tracking-wide ${T.rail} ${T.border} ${T.faint}`}>
                    {isLeftPanelOpen ? `${projects.length} projet(s)` : '—'}
                  </div>
                  <div className="flex">
                    {timelineMonths.map((m, i) => (
                      <div key={i} style={{ width: `${m.days * columnWidth}px` }} className={`flex h-full items-center justify-center border-r text-[10px] font-extrabold uppercase tracking-wider ${T.grid} ${T.faint}`}>
                        {m.days * columnWidth > 90 ? m.label : m.label.slice(0, 3)}
                      </div>
                    ))}
                  </div>
                </div>

                <div className={`sticky top-7 z-30 flex h-11 border-b ${T.rail} ${T.border}`}>
                  <div style={{ width: `${nameColWidth}px` }} className={`sticky left-0 z-40 flex items-center justify-between border-r px-3 text-[11px] font-bold ${T.rail} ${T.border}`}>
                    {isLeftPanelOpen ? (<><span>Structure</span><button type="button" onClick={() => setIsLeftPanelOpen(false)} className={`text-[10px] ${T.faint}`}>◀</button></>)
                      : <button type="button" onClick={() => setIsLeftPanelOpen(true)} className="text-[10px] font-bold text-indigo-400">▶</button>}
                  </div>
                  <DayHeader withHalves={false} />
                </div>

                <div className="relative">
                  {projects.length === 0 ? <div className={`px-8 py-16 text-center text-sm ${T.faint}`}>Aucun projet. Créez-en un pour démarrer votre roadmap.</div> : null}

                  {projects.map((proj) => {
                    const pct = projectProgress(proj);
                    const isOpen = !!openProjects[proj.id];
                    const isSelected = proj.id === selectedProjectId;
                    const dragging = drag && drag.kind === 'project' && drag.id === proj.id;
                    const startUnits = diffDays(parseDate(proj.startDate), timelineStart);
                    const geo = barGeometry(startUnits, proj.duration, dragging);

                    return (
                      <React.Fragment key={proj.id}>
                        {/* Niveau 1 — projet */}
                        <div className={`flex h-14 border-b ${T.border} ${isSelected ? 'bg-indigo-500/[0.07]' : ''}`}>
                          <div style={{ width: `${nameColWidth}px` }}
                            className={`sticky left-0 z-20 flex items-center gap-2 border-r px-3 ${T.panel} ${isSelected ? 'shadow-[inset_3px_0_0_0_#6366F1]' : ''}`}>
                            {isLeftPanelOpen ? (
                              <>
                                <button type="button" onClick={() => setOpenProjects({ ...openProjects, [proj.id]: !isOpen })}
                                  className={`flex h-5 w-5 shrink-0 items-center justify-center rounded-md text-[10px] ${T.raise} ${T.muted} hover:text-indigo-400`}
                                  aria-label={isOpen ? 'Replier le projet' : 'Déplier le projet'} title={isOpen ? 'Replier ce projet' : 'Déplier ce projet'}>
                                  {isOpen ? '▾' : '▸'}
                                </button>
                                <button type="button" onClick={() => setSelectedProjectId(proj.id)} className="min-w-0 flex-1 text-left">
                                  <div className="flex items-center gap-2">
                                    <span className={`h-2.5 w-2.5 shrink-0 rounded-full bg-gradient-to-r ${proj.color}`} />
                                    <span className="truncate text-xs font-extrabold">{proj.title}</span>
                                  </div>
                                  <div className={`mt-0.5 truncate text-[10px] ${T.faint}`}>{proj.category} · {proj.tasks.length} tâche(s)</div>

                                <span className={`font-mono text-[11px] font-extrabold ${pct === 100 ? 'text-emerald-400' : 'text-indigo-400'}`}>{pct}%</span>

                              className={`group absolute top-3 flex h-8 cursor-grab items-center overflow-hidden rounded-lg border border-white/15 bg-slate-950/90 shadow-lg active:cursor-grabbing ${dragging ? 'z-[15] ring-2 ring-indigo-400' : 'z-10'}`}>
                              <div className={`absolute inset-y-0 left-0 bg-gradient-to-r ${proj.color}`} style={{ width: `${pct}%` }} />
                              <div onMouseDown={(e) => startDrag(e, { kind: 'project', id: proj.id, action: 'resize-left', unit: 1, startUnits, lenUnits: proj.duration })} className="absolute inset-y-0 left-0 z-20 w-2.5 cursor-ew-resize bg-white/40 opacity-0 group-hover:opacity-100" />
                              <div className="pointer-events-none relative flex w-full items-center justify-between gap-2 px-2.5">
                                <span className="truncate text-[11px] font-extrabold text-white drop-shadow">{proj.title}</span>
                                <span className="shrink-0 rounded bg-black/50 px-1.5 py-0.5 font-mono text-[10px] font-bold text-white">{pct}%</span>
                              </div>
                              <div onMouseDown={(e) => startDrag(e, { kind: 'project', id: proj.id, action: 'resize-right', unit: 1, startUnits, lenUnits: proj.duration })} className="absolute inset-y-0 right-0 z-20 w-2.5 cursor-ew-resize bg-white/40 opacity-0 group-hover:opacity-100" />
                            </div>
                            {dragging ? (
                              <div className="pointer-events-none absolute -top-1 z-[15] rounded-lg border border-indigo-500 bg-slate-900 px-2 py-1 font-mono text-[10px] text-slate-100 shadow-xl" style={{ left: `${drag.snapStart * columnWidth}px` }}>
                                {formatDateFr(formatDateIso(addDays(timelineStart, drag.snapStart)))} · {drag.snapLen} j
                              </div>
                            ) : null}
                          </div>
                        </div>

                        {/* Niveau 2 — tâches */}
                        {isOpen ? proj.tasks.map((task) => {
                          const tOpen = !!openTasks[task.id];
                          const tDragging = drag && drag.kind === 'task' && drag.id === task.id;
                          const tStart = diffDays(parseDate(task.startDate), timelineStart);
                          const tGeo = barGeometry(tStart, task.duration, tDragging);
                          const doneSub = task.subtasks.filter((s) => s.status === 'DONE').length;
                          return (
                            <React.Fragment key={task.id}>
                              <div className={`flex h-10 border-b ${T.border} ${isDark ? 'bg-white/[0.015]' : 'bg-slate-50/60'}`}>
                                <div style={{ width: `${nameColWidth}px` }} className={`sticky left-0 z-20 flex items-center gap-2 border-r pl-6 pr-3 ${T.panel}`}>
                                  {isLeftPanelOpen ? (
                                    <>
                                      <button type="button" onClick={() => setOpenTasks({ ...openTasks, [task.id]: !tOpen })}
                                        className={`flex h-4 w-4 shrink-0 items-center justify-center rounded text-[9px] ${task.subtasks.length ? `${T.raise} ${T.muted} hover:text-indigo-400` : 'opacity-0'}`}
                                        aria-label="Déplier la tâche">{tOpen ? '▾' : '▸'}</button>
                                      <input type="checkbox" checked={task.status === 'DONE'} onChange={(e) => setTaskStatus(task.id, e.target.checked ? 'DONE' : 'IN_PROGRESS')}
                                        className="h-3.5 w-3.5 shrink-0 rounded accent-emerald-500" aria-label={`Valider ${task.title}`} />
                                      <button type="button" onClick={() => setEditingTask({ ...task, projectId: proj.id })}
                                        className={`min-w-0 flex-1 truncate text-left text-[11px] ${task.status === 'DONE' ? 'text-slate-500 line-through' : 'font-bold'}`}>{task.title}</button>
                                      {task.subtasks.length ? <span className={`shrink-0 rounded px-1.5 py-0.5 font-mono text-[9px] ${T.raise} ${T.muted}`}>{doneSub}/{task.subtasks.length}</span> : null}
                                      <button type="button" title="Ajouter une sous-tâche"
                                        onClick={() => setSubtaskForm({ id: null, taskId: task.id, projectId: proj.id, title: '', assignee: task.assignee, status: 'TODO', startDate: task.startDate, duration: 1, notes: '' })}
                                        className={`shrink-0 rounded px-1 text-[11px] font-bold ${T.muted} hover:text-indigo-400`}>+</button>
                                    </>
                                  ) : null}
                                </div>
                                <div className="relative" style={{ width: `${timelineWidth}px` }}>
                                  <GridBackground rowKey={task.id} />
                                  {tDragging ? <div style={{ left: `${drag.snapStart * columnWidth}px`, width: `${drag.snapLen * columnWidth}px` }} className="absolute top-2 h-6 rounded border-2 border-dashed border-indigo-400 bg-indigo-500/10" /> : null}
                                  <div style={{ left: `${tGeo.left}px`, width: `${Math.max(columnWidth * 0.5, tGeo.width)}px` }}
                                    onMouseDown={(e) => startDrag(e, { kind: 'task', id: task.id, action: 'move', unit: 1, startUnits: tStart, lenUnits: task.duration })}
                                    onClick={() => { if (!movedRef.current) setEditingTask({ ...task, projectId: proj.id }); }}
                                    className={`group absolute top-2 flex h-6 cursor-grab items-center rounded border border-white/20 bg-gradient-to-r ${proj.color} px-2 text-[10px] font-bold text-white shadow active:cursor-grabbing ${task.status === 'DONE' ? 'opacity-50' : ''} ${tDragging ? 'z-[15]' : ''}`}>
                                    <div onMouseDown={(e) => startDrag(e, { kind: 'task', id: task.id, action: 'resize-left', unit: 1, startUnits: tStart, lenUnits: task.duration })} className="absolute inset-y-0 left-0 w-2 cursor-ew-resize bg-white/40 opacity-0 group-hover:opacity-100" />
                                    <span className="pointer-events-none truncate">{task.title}</span>
                                    <div onMouseDown={(e) => startDrag(e, { kind: 'task', id: task.id, action: 'resize-right', unit: 1, startUnits: tStart, lenUnits: task.duration })} className="absolute inset-y-0 right-0 w-2 cursor-ew-resize bg-white/40 opacity-0 group-hover:opacity-100" />
                                  </div>
                                </div>
                              </div>

                              {/* Niveau 3 — sous-tâches */}
                              {tOpen ? task.subtasks.map((sub) => {
                                const sDragging = drag && drag.kind === 'subtask' && drag.id === sub.id;
                                const sStart = diffDays(parseDate(sub.startDate), timelineStart);
                                const sGeo = barGeometry(sStart, sub.duration, sDragging);
                                return (
                                  <div key={sub.id} className={`flex h-8 border-b ${T.border} ${isDark ? 'bg-black/20' : 'bg-slate-100/60'}`}>
                                    <div style={{ width: `${nameColWidth}px` }} className={`sticky left-0 z-20 flex items-center gap-2 border-r pl-12 pr-3 ${T.panel}`}>
                                      {isLeftPanelOpen ? (
                                        <>
                                          <input type="checkbox" checked={sub.status === 'DONE'} onChange={(e) => setSubtaskStatus(sub.id, e.target.checked ? 'DONE' : 'TODO')}
                                            className="h-3 w-3 shrink-0 rounded accent-emerald-500" aria-label={`Valider ${sub.title}`} />
                                          <button type="button" onClick={() => setSubtaskForm({ ...sub, taskId: task.id, projectId: proj.id })}
                                            className={`min-w-0 flex-1 truncate text-left text-[10px] ${sub.status === 'DONE' ? 'text-slate-500 line-through' : T.muted}`}>{sub.title}</button>
                                          <span className={`shrink-0 rounded border px-1 py-0.5 text-[8px] font-bold ${STATUS_META[sub.status].tint}`}>{STATUS_META[sub.status].label}</span>
                                        </>
                                      ) : null}
                                    </div>
                                    <div className="relative" style={{ width: `${timelineWidth}px` }}>
                                      <GridBackground rowKey={sub.id} />
                                      {sDragging ? <div style={{ left: `${drag.snapStart * columnWidth}px`, width: `${drag.snapLen * columnWidth}px` }} className="absolute top-2 h-4 rounded border-2 border-dashed border-indigo-400 bg-indigo-500/10" /> : null}
                                      <div style={{ left: `${sGeo.left}px`, width: `${Math.max(columnWidth * 0.4, sGeo.width)}px` }}
                                        onMouseDown={(e) => startDrag(e, { kind: 'subtask', id: sub.id, action: 'move', unit: 1, startUnits: sStart, lenUnits: sub.duration })}
                                        onClick={() => { if (!movedRef.current) setSubtaskForm({ ...sub, taskId: task.id, projectId: proj.id }); }}
                                        className={`group absolute top-2 flex h-4 cursor-grab items-center rounded border px-1.5 text-[9px] font-bold active:cursor-grabbing
                                          ${sub.status === 'DONE' ? 'border-emerald-500/40 bg-emerald-500/20 text-emerald-200' : `${isDark ? 'border-white/15 bg-white/10 text-slate-200' : 'border-slate-300 bg-white text-slate-700'}`} ${sDragging ? 'z-[15]' : ''}`}>
                                        <span className="pointer-events-none truncate">{sub.title}</span>
                                        <div onMouseDown={(e) => startDrag(e, { kind: 'subtask', id: sub.id, action: 'resize-right', unit: 1, startUnits: sStart, lenUnits: sub.duration })} className="absolute inset-y-0 right-0 w-2 cursor-ew-resize bg-white/40 opacity-0 group-hover:opacity-100" />
                                      </div>
                                    </div>
                                  </div>
                                );
                              }) : null}
                            </React.Fragment>
                          );
                        }) : null}
                      </React.Fragment>
                    );
                  })}
                </div>
              </div>
            </div>

            {isRightPanelOpen ? (
              <aside className={`hidden w-80 shrink-0 overflow-y-auto border-l p-4 lg:block ${T.panel}`}>
                {selectedProject ? (
                  <div className="space-y-4">
                    <div className={`overflow-hidden rounded-2xl border ${T.raise}`}>
                      <div className={`flex items-center justify-between border-b px-4 py-2.5 ${T.border} ${T.inset}`}>
                        <span className="rounded-full border border-indigo-500/30 bg-indigo-500/10 px-2.5 py-0.5 text-[10px] font-bold text-indigo-300">{selectedProject.category}</span>
                        <button type="button" onClick={() => setIsRightPanelOpen(false)} className={`text-xs ${T.faint}`}>✕</button>
                      </div>
                      <div className="p-4">
                        <h2 className="text-sm font-extrabold leading-snug">{selectedProject.title}</h2>
                        <div className={`mt-1 text-[11px] ${T.faint}`}>
                          {formatDayShort(selectedProject.startDate)} → {formatDayShort(formatDateIso(addDays(parseDate(selectedProject.startDate), selectedProject.duration)))} · {selectedProject.duration} j
                        </div>
                        <div className={`mt-3 h-2 w-full overflow-hidden rounded-full ${T.inset}`}>
                          <div className={`h-full rounded-full bg-gradient-to-r ${selectedProject.color}`} style={{ width: `${projectProgress(selectedProject)}%` }} />
                        </div>
                        <div className="mt-2 flex items-center justify-between text-[11px]">
                          <span className={`font-bold ${projectProgress(selectedProject) === 100 ? 'text-emerald-400' : 'text-indigo-400'}`}>{projectProgress(selectedProject)} %</span>
                          {(() => { const h = projectHealth(selectedProject); return <span className={`font-semibold ${h.tone === 'danger' ? 'text-rose-400' : h.tone === 'success' ? 'text-emerald-400' : T.faint}`}>{h.label}</span>; })()}
                        </div>
                      </div>
                    </div>

                    <div className={`overflow-hidden rounded-2xl border ${T.raise}`}>
                      <div className={`flex items-center justify-between border-b px-4 py-2.5 ${T.border} ${T.inset}`}>
                        <h3 className="text-[11px] font-extrabold uppercase tracking-wide">Tâches</h3>
                        <button type="button" className="text-[11px] font-bold text-indigo-400"
                          onClick={() => setTaskForm({ id: null, projectId: selectedProject.id, title: '', assignee: collaborators[0] || 'Moi', startDate: selectedProject.startDate, duration: 5, status: 'TODO', priority: 'MEDIUM', notes: '' })}>+ Ajouter</button>
                      </div>
                      <div className="space-y-1.5 p-3">
                        {selectedProject.tasks.length === 0 ? <p className={`px-1 py-2 text-[11px] ${T.faint}`}>Aucune tâche pour l'instant.</p> : null}
                        {selectedProject.tasks.map((task) => (
                          <div key={task.id} className={`flex items-center gap-2 rounded-xl border px-2.5 py-2 ${T.border} ${isDark ? 'bg-black/25' : 'bg-white'}`}>
                            <input type="checkbox" checked={task.status === 'DONE'} onChange={(e) => setTaskStatus(task.id, e.target.checked ? 'DONE' : 'IN_PROGRESS')} className="h-4 w-4 shrink-0 rounded accent-emerald-500" aria-label={`Valider ${task.title}`} />
                            <button type="button" onClick={() => setEditingTask({ ...task, projectId: selectedProject.id })} className="min-w-0 flex-1 text-left">
                              <div className={`truncate text-[11px] ${task.status === 'DONE' ? 'text-slate-500 line-through' : 'font-semibold'}`}>{task.title}</div>
                              <div className={`truncate text-[10px] ${T.faint}`}>{task.assignee} · {task.subtasks.length ? `${task.subtasks.filter((s) => s.status === 'DONE').length}/${task.subtasks.length} sous-tâches` : `${task.duration} j`}</div>
                            </button>
                            <span className={`shrink-0 rounded border px-1.5 py-0.5 text-[9px] font-bold ${PRIORITY_META[task.priority].cls}`}>{PRIORITY_META[task.priority].icon}</span>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="flex gap-2">
                      <button type="button" className={`flex-1 ${btnSecondary}`} onClick={() => setProjectForm({ ...selectedProject })}>Modifier</button>
                      <button type="button" className={`flex-1 ${btnDanger}`} onClick={() => deleteProject(selectedProject.id)}>Supprimer</button>
                    </div>
                    <button type="button" className={`w-full ${btnQuiet}`} onClick={() => createNote({ title: `Notes — ${selectedProject.title}`, projectId: selectedProject.id })}>Ouvrir un bloc-notes pour ce projet</button>
                  </div>
                ) : <p className={`text-xs ${T.faint}`}>Sélectionnez un projet.</p>}
              </aside>
            ) : null}
          </>
        ) : null}

        {/* ============================== KANBAN ============================== */}
        {activeTab === 'kanban' ? (
          <div className={`flex-1 overflow-auto p-5 ${isDark ? 'bg-[#05080F]' : 'bg-[#EEF1F6]'}`}>
            <div className="grid h-full min-w-[1040px] grid-cols-4 gap-4">
              {STATUSES.map((status) => {
                const meta = STATUS_META[status];
                const colTasks = kanbanTasks.filter((t) => t.status === status);
                const isOver = dropTarget && dropTarget.status === status;
                const placeholder = (i) => (isOver && dropTarget.index === i && draggingTaskId
                  ? <div key={`ph-${i}`} className="h-1.5 rounded-full bg-indigo-500 shadow-[0_0_12px_2px_rgba(99,102,241,.5)]" /> : null);
                return (
                  <section key={status}
                    onDragOver={(e) => handleColumnDragOver(e, status, colTasks.length)}
                    onDrop={(e) => handleColumnDrop(e, status, colTasks.length)}
                    className={`flex h-full flex-col overflow-hidden rounded-2xl border transition ${T.panel} ${isOver ? 'border-indigo-500 ring-2 ring-indigo-500/25' : ''}`}>
                    <div className={`flex items-center justify-between border-b px-3 py-2.5 ${T.border} ${T.inset}`}>
                      <h3 className="flex items-center gap-2 text-xs font-extrabold">
                        <span className={`h-2 w-2 rounded-full ${meta.dot}`} />{meta.label}
                        <span className={`rounded-full px-2 py-0.5 font-mono text-[10px] ${T.raise} ${T.muted}`}>{colTasks.length}</span>

                      {colTasks.length === 0 ? (

                    </div>
                  </section>

            </div>
          </div>

        {/* ============================== PLANNING ============================== */}
        {activeTab === 'planning' ? (
          <div id="timeline-viewport" className={`flex-1 overflow-auto ${isDark ? 'bg-[#05080F]' : 'bg-[#EEF1F6]'}`}>
            <div style={{ width: `${timelineWidth + 240}px`, minWidth: '100%' }}>

              <div className={`sticky top-0 z-30 flex h-7 border-b ${T.rail} ${T.border}`}>
                <div style={{ width: '240px' }} className={`sticky left-0 z-40 flex items-center border-r px-4 text-[10px] font-bold uppercase tracking-wide ${T.rail} ${T.border} ${T.faint}`}>Semaines</div>
