  { name: 'Ardoise', value: 'from-slate-500 to-slate-700' }
];

const NOTE_COLORS = [
  { name: 'Indigo', value: 'indigo', bar: 'bg-indigo-500' },
  { name: 'Émeraude', value: 'emerald', bar: 'bg-emerald-500' },
  { name: 'Ambre', value: 'amber', bar: 'bg-amber-500' },
  { name: 'Rose', value: 'rose', bar: 'bg-rose-500' },
  { name: 'Cyan', value: 'cyan', bar: 'bg-cyan-500' }
];
const noteBar = (v) => (NOTE_COLORS.find((c) => c.value === v) || NOTE_COLORS[0]).bar;

const MONTHS_FR = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];

const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
const uid = (p) => p + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);

const parseDate = (str) => { const d = new Date(String(str) + 'T00:00:00'); return isNaN(d.getTime()) ? new Date() : d; };
const formatDateIso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (d, n) => { const r = new Date(d.getTime()); r.setDate(r.getDate() + n); return r; };
const diffDays = (a, b) => Math.round((a.getTime() - b.getTime()) / 86400000);
const TODAY_STR = formatDateIso(new Date());
const formatDateFr = (iso) => parseDate(iso).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
const formatDayShort = (iso) => parseDate(iso).toLocaleDateString('fr-FR', { weekday: 'short', day: '2-digit', month: 'short' });

const getMonday = (d) => { const x = new Date(d.getTime()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); x.setHours(0, 0, 0, 0); return x; };
const getWeekNumber = (d) => {
  const date = new Date(d.getTime());
  date.setHours(0, 0, 0, 0);
  date.setDate(date.getDate() + 3 - ((date.getDay() + 6) % 7));
  const week1 = new Date(date.getFullYear(), 0, 4);
  return 1 + Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
};

// Fin incluse : une tâche d'un jour commence et finit le même jour.
const endFromDuration = (startIso, duration) => formatDateIso(addDays(parseDate(startIso), Math.max(0, Math.ceil(Number(duration) || 1) - 1)));
const durationFromEnd = (startIso, endIso, step) => {
  const d = diffDays(parseDate(endIso), parseDate(startIso)) + 1;
  return Math.max(step || 1, d);
};

const isIsoDate = (s) => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(new Date(s + 'T00:00:00').getTime());
const safeDate = (s) => (isIsoDate(s) ? s : TODAY_STR);
const safeNum = (v, fallback, min, step) => {
  const n = Number(v);
  if (!Number.isFinite(n) || n < min) return fallback;
  return step ? Math.round(n / step) * step : n;
};
const safeText = (v, fallback) => { const s = typeof v === 'string' ? v.trim() : ''; return s ? s.slice(0, 200) : fallback; };
const rawText = (v, max) => (typeof v === 'string' ? v.slice(0, max || 400) : '');

const triggerConfetti = () => {
  try { if (typeof window.confetti === 'function') window.confetti({ particleCount: 160, spread: 95, origin: { y: 0.6 }, disableForReducedMotion: true }); }
  catch (e) { /* no-op */ }
};

const initials = (name) => String(name || '?').split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
const AVATAR_COLORS = ['bg-indigo-600', 'bg-emerald-600', 'bg-amber-600', 'bg-rose-600', 'bg-cyan-600', 'bg-fuchsia-600', 'bg-teal-600'];
const avatarColor = (name) => {
  let h = 0; const s = String(name || '');
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
};

const b64encode = (str) => {
  try { return window.btoa(String.fromCharCode.apply(null, Array.from(new TextEncoder().encode(str)))); }
  catch (e) { return window.btoa(unescape(encodeURIComponent(str))); }
};
const b64decode = (str) => {
  try {
    const bin = window.atob(String(str).replace(/\s/g, ''));
    return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
  } catch (e) { return ''; }
};

/* ------------------------ Normalisation défensive ------------------------ */
const normalizeSubtask = (s, fallbackDate) => {
  const o = s && typeof s === 'object' ? s : {};
  return {
    id: o.id ? String(o.id) : uid('st'),
    title: safeText(o.title, 'Sous-tâche'),
    assignee: safeText(o.assignee, 'Non assigné'),
    status: STATUSES.includes(o.status) ? o.status : 'TODO',
    startDate: safeDate(o.startDate || fallbackDate),
    duration: safeNum(o.duration, 1, 0.5, 0.5),
    notes: rawText(o.notes, 2000)
  };
};

const normalizeTask = (t, index) => {
  const o = t && typeof t === 'object' ? t : {};
  const startDate = safeDate(o.startDate);
  return {
    id: o.id ? String(o.id) : uid('t'),
    title: safeText(o.title, 'Tâche sans titre'),
    assignee: safeText(o.assignee, 'Non assigné'),
    startDate,
    duration: safeNum(o.duration, 1, 0.5, 0.5),
    status: STATUSES.includes(o.status) ? o.status : 'TODO',
    priority: PRIORITIES.includes(o.priority) ? o.priority : 'MEDIUM',
    rank: Number.isFinite(Number(o.rank)) ? Number(o.rank) : (index || 0),
    notes: rawText(o.notes, 4000),
    subtasks: Array.isArray(o.subtasks) ? o.subtasks.map((s) => normalizeSubtask(s, startDate)) : []
  };
};

const normalizeProject = (p) => {
  const o = p && typeof p === 'object' ? p : {};
  return {
    id: o.id ? String(o.id) : uid('proj'),
    title: safeText(o.title, 'Projet sans titre'),
    category: safeText(o.category, 'Général'),
    startDate: safeDate(o.startDate),
    duration: safeNum(o.duration, 10, 1, 1),
    color: typeof o.color === 'string' && o.color.startsWith('from-') ? o.color : DEFAULT_COLOR,
    tasks: Array.isArray(o.tasks) ? o.tasks.map(normalizeTask) : []
  };
};

const normalizeEntry = (e) => {
  const o = e && typeof e === 'object' ? e : {};
  return {
    id: o.id ? String(o.id) : uid('pe'),
    title: safeText(o.title, 'Entrée'),
    tag: safeText(o.tag, 'Général'),
    color: typeof o.color === 'string' && o.color.startsWith('from-') ? o.color : DEFAULT_COLOR,
    assignee: safeText(o.assignee, 'Non assigné'),
    startDate: safeDate(o.startDate),
    slot: o.slot === 'PM' ? 'PM' : 'AM',
    duration: safeNum(o.duration, 0.5, 0.5, 0.5),
    notes: rawText(o.notes, 2000)
  };
};

const normalizeNote = (n) => {
  const o = n && typeof n === 'object' ? n : {};
  return {
    id: o.id ? String(o.id) : uid('note'),
    title: rawText(o.title, 160),
    body: rawText(o.body, 40000),
    color: NOTE_COLORS.some((c) => c.value === o.color) ? o.color : 'indigo',
    projectId: o.projectId ? String(o.projectId) : '',
    pinned: !!o.pinned,
    updatedAt: typeof o.updatedAt === 'string' ? o.updatedAt : new Date().toISOString()
  };
};

const normalizeColumnLabels = (raw) => {
  const o = raw && typeof raw === 'object' ? raw : {};
  const out = {};
  STATUSES.forEach((s) => { out[s] = safeText(o[s], STATUS_META[s].label); });
  return out;
};

const DEFAULT_EVENT = { date: '2027-07-31', label: 'Jour J' };

const normalizeEvent = (raw) => {
  const o = raw && typeof raw === 'object' ? raw : {};
  return { date: safeDate(o.date) === TODAY_STR && !isIsoDate(o.date) ? DEFAULT_EVENT.date : safeDate(o.date), label: safeText(o.label, DEFAULT_EVENT.label) };
};

const normalizeData = (raw) => {
  const o = raw && typeof raw === 'object' ? raw : {};
  return {
    columnLabels: normalizeColumnLabels(o.columnLabels),
    event: normalizeEvent(o.event),
    projects: Array.isArray(o.projects) ? o.projects.map(normalizeProject) : [],
    planning: Array.isArray(o.planning) ? o.planning.map(normalizeEntry)
      : Array.isArray(o.planningEntries) ? o.planningEntries.map(normalizeEntry) : [],
    notes: Array.isArray(o.notes) ? o.notes.map(normalizeNote) : []
  };
};

const SEED = normalizeData(SEED_RAW);

const loadJson = (key, fallback) => {
  try {
    const raw = window.localStorage.getItem(key);
    if (!raw) return fallback;
    const parsed = JSON.parse(raw);
    return parsed && typeof parsed === 'object' ? parsed : fallback;
  } catch (e) {
    try { window.localStorage.removeItem(key); } catch (e2) { /* no-op */ }
    return fallback;
  }
};
const saveJson = (key, value) => { try { window.localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; } };

const loadData = () => {
  const stored = loadJson(STORAGE_KEY, null);
  if (!stored) return SEED;
  const clean = normalizeData(stored);
  if (clean.projects.length === 0 && clean.planning.length === 0 && clean.notes.length === 0) return SEED;
  return clean;
};

// Chaque entité est une entrée distincte du document partagé : deux personnes
// qui modifient deux fiches différentes ne s'écrasent jamais.
const COLLECTIONS = ['projects', 'planning', 'notes'];

const randomRoom = () => 'auraplan-' + Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 6);

const readRoomFromUrl = () => {
  try {
    const h = new URLSearchParams(String(window.location.hash || '').replace(/^#/, ''));
    const room = h.get('room');
    if (!room) return null;
    return { room: room.slice(0, 80), key: (h.get('key') || '').slice(0, 80) };
  } catch (e) { return null; }
};

const dataToShared = (data) => {
  const out = { meta: { columnLabels: data.columnLabels, event: data.event } };
  COLLECTIONS.forEach((c) => {
    const map = {};
    (data[c] || []).forEach((item, index) => { map[item.id] = { ...item, __order: index }; });
    out[c] = map;
  });
  return out;
};

const sharedToData = (doc) => {
  const meta = doc.getMap('meta').get('value') || {};
  const out = { columnLabels: meta.columnLabels, event: meta.event };
  COLLECTIONS.forEach((c) => {
    const list = [];
    doc.getMap(c).forEach((value) => { if (value) list.push(value); });
    list.sort((a, b) => (a.__order || 0) - (b.__order || 0));
    out[c] = list.map((item) => { const copy = { ...item }; delete copy.__order; return copy; });
  });
  return normalizeData(out);
};

/* ------------------------------ Composants ------------------------------ */
function Avatar({ name, size }) {
  const s = size === 'sm' ? 'w-6 h-6 text-[9px]' : size === 'lg' ? 'w-10 h-10 text-xs' : 'w-8 h-8 text-[10px]';
  return <span className={`${s} ${avatarColor(name)} rounded-xl flex items-center justify-center font-extrabold text-white shrink-0 shadow-sm`} title={name}>{initials(name)}</span>;
}

function Modal({ title, subtitle, onClose, children, footer, T, size }) {
  const width = size === 'lg' ? 'max-w-2xl' : size === 'sm' ? 'max-w-sm' : 'max-w-lg';
  return (
    <div className="fixed inset-0 z-[80] flex items-start justify-center overflow-y-auto bg-black/70 p-4 backdrop-blur-sm sm:items-center"
      onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className={`w-full ${width} overflow-hidden rounded-2xl border shadow-2xl ${T.panel}`} onMouseDown={(e) => e.stopPropagation()}>
        <div className={`flex items-start justify-between gap-4 border-b px-5 py-4 ${T.border} ${T.rail}`}>
          <div>
            <h3 className="text-sm font-extrabold tracking-tight">{title}</h3>
            {subtitle ? <p className={`mt-0.5 text-[11px] ${T.muted}`}>{subtitle}</p> : null}
          </div>
          <button type="button" onClick={onClose} aria-label="Fermer" className={`rounded-lg px-2 py-1 text-sm ${T.muted} ${T.hover}`}>✕</button>
        </div>
        <div className="max-h-[68vh] overflow-y-auto px-5 py-4">{children}</div>
        {footer ? <div className={`flex items-center justify-between gap-3 border-t px-5 py-4 ${T.border} ${T.rail}`}>{footer}</div> : null}
      </div>
    </div>
  );
}

function Field({ label, hint, children, T }) {
  return (
    <label className="block">
      <span className={`mb-1 block text-[11px] font-semibold uppercase tracking-wide ${T.muted}`}>{label}</span>
      {children}
      {hint ? <span className={`mt-1 block text-[10px] ${T.muted}`}>{hint}</span> : null}
    </label>
  );
}

function Toasts({ items, onDismiss }) {
  return (
    <div className="pointer-events-none fixed bottom-5 right-5 z-[100] flex w-72 flex-col gap-2">
      {items.map((t) => (
        <div key={t.id} onClick={() => onDismiss(t.id)}
          className={`pointer-events-auto cursor-pointer rounded-xl border px-4 py-3 text-xs font-semibold shadow-2xl backdrop-blur
            ${t.tone === 'error' ? 'border-rose-500/40 bg-rose-950/90 text-rose-100'
              : t.tone === 'success' ? 'border-emerald-500/40 bg-emerald-950/90 text-emerald-100'
                : 'border-indigo-500/40 bg-slate-900/95 text-slate-100'}`}>
          {t.message}
        </div>
      ))}
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error('AuraPlan — erreur de rendu :', error, info); }
  render() {
    if (this.state.error) {
      return (
        <div className="mx-auto mt-24 max-w-xl rounded-2xl border border-rose-500/40 bg-slate-900 p-8 text-slate-100">
          <h1 className="mb-2 text-lg font-extrabold">L'affichage s'est interrompu</h1>
          <p className="mb-4 text-sm text-slate-400">Une donnée locale est probablement corrompue. Réinitialisez le stockage pour repartir d'une base saine.</p>
          <pre className="mb-4 max-h-40 overflow-auto rounded-lg bg-black/40 p-3 text-[11px] text-rose-300">{String(this.state.error && this.state.error.message)}</pre>
          <button className="rounded-xl bg-indigo-600 px-4 py-2 text-xs font-bold text-white"
            onClick={() => { try { window.localStorage.removeItem(STORAGE_KEY); } catch (e) { /* no-op */ } window.location.reload(); }}>
            Réinitialiser et recharger
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

/* ------------------------------ Application ------------------------------ */
function AuraPlanApp() {
  const prefs = useRef(loadJson(PREFS_KEY, {})).current;

  const [isDark, setIsDark] = useState(prefs.isDark !== false);
  const [activeTab, setActiveTab] = useState(['roadmap', 'kanban', 'planning', 'notes'].includes(prefs.tab) ? prefs.tab : 'roadmap');
  const [columnWidth, setColumnWidth] = useState(clamp(Number(prefs.columnWidth) || 110, 3, 240));

  const [data, setData] = useState(loadData);
  const dataRef = useRef(data);
  const undoStack = useRef([]);

  const projects = data.projects;
  const planning = data.planning;
  const notes = data.notes;
  const columnLabels = data.columnLabels;
  const event = data.event;
  const daysToEvent = diffDays(parseDate(event.date), parseDate(TODAY_STR));
  const statusLabel = useCallback((s) => (columnLabels && columnLabels[s]) || STATUS_META[s].label, [columnLabels]);

  const [toasts, setToasts] = useState([]);
  const pushToast = useCallback((message, tone) => {
    const id = uid('toast');
    setToasts((prev) => [...prev.slice(-3), { id, message, tone: tone || 'info' }]);
    window.setTimeout(() => setToasts((prev) => prev.filter((t) => t.id !== id)), 4200);
  }, []);
  const dismissToast = useCallback((id) => setToasts((prev) => prev.filter((t) => t.id !== id)), []);

  const commit = useCallback((mutator, label) => {
    const prev = dataRef.current;
    const next = normalizeData(typeof mutator === 'function' ? mutator(prev) : mutator);
    undoStack.current.push(prev);
    if (undoStack.current.length > 60) undoStack.current.shift();
    dataRef.current = next;
    setData(next);
    if (label) pushToast(label, 'success');
    return next;
  }, [pushToast]);

  // Écriture sans point d'annulation (frappe au clavier dans les notes)
  const applyQuiet = useCallback((mutator) => {
    const prev = dataRef.current;
    const next = normalizeData(typeof mutator === 'function' ? mutator(prev) : mutator);
    dataRef.current = next;
    setData(next);
  }, []);

  const undo = useCallback(() => {
    const prev = undoStack.current.pop();
    if (!prev) { pushToast('Rien à annuler', 'info'); return; }
    dataRef.current = prev; setData(prev);
    pushToast('Dernière action annulée', 'info');
  }, [pushToast]);

  useEffect(() => { dataRef.current = data; saveJson(STORAGE_KEY, data); }, [data]);
  useEffect(() => { saveJson(PREFS_KEY, { isDark, tab: activeTab, columnWidth }); }, [isDark, activeTab, columnWidth]);
  useEffect(() => { document.body.classList.toggle('theme-light', !isDark); }, [isDark]);

  /* ------------------------------- Nuances ------------------------------- */
  const T = useMemo(() => (isDark ? {
    app: 'bg-[#05080F] text-slate-100',
    rail: 'bg-[#0A1019]',
    panel: 'bg-[#0E1626] border-[#1C2740]',
    raise: 'bg-[#141F35] border-[#26334F]',
    inset: 'bg-black/25',
    border: 'border-[#1C2740]',
    grid: 'border-slate-700/25',
    muted: 'text-slate-400',
    faint: 'text-slate-500',
    input: 'bg-[#0A1220] border-[#28344F] text-slate-100 placeholder-slate-500',
    hover: 'hover:bg-white/5'
  } : {
    app: 'bg-[#EEF1F6] text-slate-900',
    rail: 'bg-white',
    panel: 'bg-white border-slate-200',
    raise: 'bg-slate-50 border-slate-200',
    inset: 'bg-slate-100',
    border: 'border-slate-200',
    grid: 'border-slate-200',
    muted: 'text-slate-500',
    faint: 'text-slate-400',
    input: 'bg-white border-slate-300 text-slate-900 placeholder-slate-400',
    hover: 'hover:bg-slate-100'
  }), [isDark]);

  const inputCls = `w-full rounded-xl border px-3 py-2 text-xs font-medium outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/25 ${isDark ? 'bg-[#0A1220] border-[#28344F] text-slate-100 placeholder-slate-500' : 'bg-white border-slate-300 text-slate-900 placeholder-slate-400'}`;
  const btnPrimary = 'rounded-xl bg-indigo-600 px-4 py-2 text-xs font-bold text-white shadow-lg shadow-indigo-950/40 transition hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-400';
  const btnSecondary = `rounded-xl border px-3 py-2 text-xs font-bold transition focus:outline-none focus:ring-2 focus:ring-indigo-400 ${isDark ? 'bg-[#141F35] border-[#2B3A5C] text-slate-100 hover:bg-[#1B2949]' : 'bg-slate-100 border-slate-300 text-slate-800 hover:bg-slate-200'}`;
  const btnQuiet = `rounded-xl border border-transparent px-3 py-2 text-xs font-semibold transition ${T.muted} ${T.hover} focus:outline-none focus:ring-2 focus:ring-indigo-400`;
  const btnDanger = 'rounded-xl border border-rose-500/40 bg-rose-500/10 px-3 py-2 text-xs font-bold text-rose-300 transition hover:bg-rose-500/20';

  /* ------------------------------ États UI ------------------------------ */
  const [selectedProjectId, setSelectedProjectId] = useState(() => (SEED.projects[0] ? SEED.projects[0].id : null));
  const [openProjects, setOpenProjects] = useState(() => (prefs.openProjects && typeof prefs.openProjects === 'object' ? prefs.openProjects : {}));
  const [openTasks, setOpenTasks] = useState({});
  const [isLeftPanelOpen, setIsLeftPanelOpen] = useState(true);
  const [isRightPanelOpen, setIsRightPanelOpen] = useState(true);
  const [search, setSearch] = useState('');
  const [assigneeFilter, setAssigneeFilter] = useState('ALL');

  const [editingTask, setEditingTask] = useState(null);
  const [taskForm, setTaskForm] = useState(null);
  const [subtaskForm, setSubtaskForm] = useState(null);
  const [editingEntry, setEditingEntry] = useState(null);
  const [entryForm, setEntryForm] = useState(null);
  const [splitEntry, setSplitEntry] = useState(null);
  const [splitSegments, setSplitSegments] = useState([0.5, 0.5]);
  const [projectForm, setProjectForm] = useState(null);
  const [isConfigOpen, setIsConfigOpen] = useState(false);
  const [isHelpOpen, setIsHelpOpen] = useState(false);
  const [selectedNoteId, setSelectedNoteId] = useState(null);
  const [editingColumn, setEditingColumn] = useState(null);
  const [columnDraft, setColumnDraft] = useState('');

  const anyModalOpen = !!(editingTask || taskForm || subtaskForm || editingEntry || entryForm || splitEntry || projectForm || isConfigOpen || isHelpOpen);
  const closeAllModals = useCallback(() => {
    setEditingTask(null); setTaskForm(null); setSubtaskForm(null); setEditingEntry(null);
    setEntryForm(null); setSplitEntry(null); setProjectForm(null); setIsConfigOpen(false); setIsHelpOpen(false);
  }, []);

  useEffect(() => { saveJson(PREFS_KEY, { isDark, tab: activeTab, columnWidth, openProjects }); }, [openProjects, isDark, activeTab, columnWidth]);

  useEffect(() => {
    if (projects.length === 0) { setSelectedProjectId(null); return; }
    if (!projects.some((p) => p.id === selectedProjectId)) setSelectedProjectId(projects[0].id);
  }, [projects, selectedProjectId]);

  const selectedProject = projects.find((p) => p.id === selectedProjectId) || null;

  /* --------------------------- Données dérivées --------------------------- */
  const allTasks = useMemo(() => {
    const list = [];
    projects.forEach((p) => p.tasks.forEach((t) => list.push({ ...t, project: { id: p.id, title: p.title, color: p.color, category: p.category } })));
    return list;
  }, [projects]);

  const collaborators = useMemo(() => {
    const set = new Set();
    planning.forEach((e) => set.add(e.assignee));
    allTasks.forEach((t) => { set.add(t.assignee); t.subtasks.forEach((s) => set.add(s.assignee)); });
    if (set.size === 0) set.add('Moi');
    return Array.from(set).sort((a, b) => a.localeCompare(b, 'fr'));
  }, [planning, allTasks]);

  const taskProgress = useCallback((t) => {
    if (t.subtasks.length) return t.subtasks.filter((s) => s.status === 'DONE').length / t.subtasks.length;
    return t.status === 'DONE' ? 1 : 0;
  }, []);

  const projectProgress = useCallback((p) => {
    if (!p || p.tasks.length === 0) return 0;
    return Math.round((p.tasks.reduce((a, t) => a + taskProgress(t), 0) / p.tasks.length) * 100);
  }, [taskProgress]);

  const projectHealth = useCallback((p) => {
    if (!p || p.tasks.length === 0) return { tone: 'neutral', label: 'Aucune tâche' };
    const end = addDays(parseDate(p.startDate), p.duration);
    let maxEnd = parseDate(p.startDate);
    p.tasks.forEach((t) => {
      const e = addDays(parseDate(t.startDate), t.duration);
      if (e > maxEnd) maxEnd = e;
      t.subtasks.forEach((s) => { const se = addDays(parseDate(s.startDate), s.duration); if (se > maxEnd) maxEnd = se; });
    });
    const delta = diffDays(maxEnd, end);
    if (delta > 0) return { tone: 'danger', label: `Dépassement de ${delta} j` };
    if (delta < 0) return { tone: 'success', label: `${Math.abs(delta)} j de marge` };
    return { tone: 'success', label: 'Dans les temps' };
  }, []);

  /* ---------------------------- Bornes timeline ---------------------------- */
  const { timelineStart, totalDays } = useMemo(() => {
    let min = parseDate(TODAY_STR);
    let max = addDays(parseDate(TODAY_STR), 14);
    const consider = (startIso, duration) => {
      const s = parseDate(startIso);
      const e = addDays(s, Math.ceil(duration));
      if (s < min) min = s;
      if (e > max) max = e;
    };
    if (activeTab === 'planning') planning.forEach((e) => consider(e.startDate, e.duration));
    else projects.forEach((p) => {
      consider(p.startDate, p.duration);
      p.tasks.forEach((t) => { consider(t.startDate, t.duration); t.subtasks.forEach((s) => consider(s.startDate, s.duration)); });
    });
    const ev = parseDate(event.date);
    if (activeTab !== 'planning') { if (ev < min) min = ev; if (ev > max) max = ev; }
    const start = getMonday(addDays(min, -3));
    return { timelineStart: start, totalDays: clamp(diffDays(addDays(max, 5), start), 28, 900) };
  }, [projects, planning, activeTab, event.date]);

  const timelineWeeks = useMemo(() => {
    const weeks = []; let current = null;
    for (let i = 0; i < totalDays; i++) {
      const d = addDays(timelineStart, i);
      const w = getWeekNumber(d);
      if (!current || current.weekNum !== w) { current = { weekNum: w, days: 0 }; weeks.push(current); }
      current.days++;
    }
    return weeks;
  }, [timelineStart, totalDays]);

  const timelineMonths = useMemo(() => {
    const months = []; let current = null; let key = '';
    for (let i = 0; i < totalDays; i++) {
      const d = addDays(timelineStart, i);
      const k = `${d.getFullYear()}-${d.getMonth()}`;
      if (k !== key) { key = k; current = { label: `${MONTHS_FR[d.getMonth()]} ${d.getFullYear()}`, days: 0 }; months.push(current); }
      current.days++;
    }
    return months;
  }, [timelineStart, totalDays]);

  const todayOffset = diffDays(parseDate(TODAY_STR), timelineStart);
  const eventOffset = diffDays(parseDate(event.date), timelineStart);

  /* ------------------------------ Planning ------------------------------ */
  const filteredPlanning = useMemo(() => {
    const q = search.trim().toLowerCase();
    return planning.filter((e) => {
      if (assigneeFilter !== 'ALL' && e.assignee !== assigneeFilter) return false;
      if (!q) return true;
      return (e.title + ' ' + e.tag + ' ' + e.assignee).toLowerCase().includes(q);
    });
  }, [planning, search, assigneeFilter]);

  const planningRows = useMemo(() => {
    const people = assigneeFilter === 'ALL' ? collaborators : collaborators.filter((c) => c === assigneeFilter);
    return people.map((person) => {
      const entries = filteredPlanning.filter((e) => e.assignee === person).map((e) => {
        const startHalf = diffDays(parseDate(e.startDate), timelineStart) * 2 + (e.slot === 'PM' ? 1 : 0);
        return { ...e, startHalf, lenHalf: Math.max(1, Math.round(e.duration * 2)) };
      }).sort((a, b) => a.startHalf - b.startHalf);

      const lanes = []; const load = new Map();
      entries.forEach((e) => {
        let lane = lanes.findIndex((freeAt) => freeAt <= e.startHalf);
        if (lane === -1) { lane = lanes.length; lanes.push(e.startHalf + e.lenHalf); } else lanes[lane] = e.startHalf + e.lenHalf;
        e.lane = lane;
        for (let h = e.startHalf; h < e.startHalf + e.lenHalf; h++) load.set(h, (load.get(h) || 0) + 1);
      });
      const laneCount = Math.max(1, lanes.length);
      return { person, entries, laneCount, load, workload: entries.reduce((s, e) => s + e.lenHalf, 0) / 2, height: Math.max(66, laneCount * 30 + 22) };
    });
  }, [filteredPlanning, collaborators, assigneeFilter, timelineStart]);

  const dayLoad = useMemo(() => {
    const map = new Map();
    filteredPlanning.forEach((e) => {
      const start = diffDays(parseDate(e.startDate), timelineStart);
      for (let i = 0; i < Math.max(1, Math.ceil(e.duration)); i++) map.set(start + i, (map.get(start + i) || 0) + 1);
    });
    return map;
  }, [filteredPlanning, timelineStart]);

  /* ------------------------------- Kanban ------------------------------- */
  const kanbanTasks = useMemo(() => {
    const q = search.trim().toLowerCase();
    return allTasks.filter((t) => {
      if (assigneeFilter !== 'ALL' && t.assignee !== assigneeFilter) return false;
      if (!q) return true;
      return (t.title + ' ' + t.assignee + ' ' + t.project.title).toLowerCase().includes(q);
    }).sort((a, b) => a.rank - b.rank || a.title.localeCompare(b.title, 'fr'));
  }, [allTasks, search, assigneeFilter]);

  const [draggingTaskId, setDraggingTaskId] = useState(null);
  const [dropTarget, setDropTarget] = useState(null); // { status, index }

  const moveTask = useCallback((taskId, status, index) => {
    let celebrateProjectId = null;
    const next = commit((prev) => {
      let moved = null;
      prev.projects.forEach((p) => p.tasks.forEach((t) => { if (t.id === taskId) { moved = t; celebrateProjectId = p.id; } }));
      if (!moved) return prev;

      const column = [];
      prev.projects.forEach((p) => p.tasks.forEach((t) => { if (t.status === status) column.push(t); }));
      column.sort((a, b) => a.rank - b.rank || a.title.localeCompare(b.title, 'fr'));

      const currentIndex = column.findIndex((t) => t.id === taskId);
      const without = column.filter((t) => t.id !== taskId);
      let target = clamp(Number.isFinite(index) ? index : without.length, 0, without.length);
      if (currentIndex !== -1 && currentIndex < target) target -= 1;
      without.splice(target, 0, moved);

      const ranks = new Map(without.map((t, i) => [t.id, i]));
      return {
        ...prev,
        projects: prev.projects.map((p) => ({
          ...p,
          tasks: p.tasks.map((t) => {
            if (t.id === taskId) return { ...t, status, rank: ranks.get(t.id) };
            return ranks.has(t.id) ? { ...t, rank: ranks.get(t.id) } : t;
          })
        }))
      };
    });
    if (status === 'DONE' && celebrateProjectId) {
      const fresh = next.projects.find((p) => p.id === celebrateProjectId);
      if (fresh && projectProgress(fresh) === 100) { triggerConfetti(); pushToast(`« ${fresh.title} » est bouclé à 100 %`, 'success'); }
    }
  }, [commit, projectProgress, pushToast]);

  const saveColumnLabel = (status) => {
    const label = columnDraft.trim();
    setEditingColumn(null);
    if (!label || label === statusLabel(status)) return;
    commit((prev) => ({ ...prev, columnLabels: { ...prev.columnLabels, [status]: label } }), 'Colonne renommée');
  };

  const handleCardDragStart = (e, taskId) => {
    try { e.dataTransfer.setData('text/plain', taskId); e.dataTransfer.effectAllowed = 'move'; } catch (err) { /* no-op */ }
    window.setTimeout(() => setDraggingTaskId(taskId), 0);
  };
  const handleCardDragOver = (e, status, index) => {
    e.preventDefault(); e.stopPropagation();
    let after = true;
    try { const r = e.currentTarget.getBoundingClientRect(); after = e.clientY > r.top + r.height / 2; } catch (err) { after = true; }
    const idx = index + (after ? 1 : 0);
    setDropTarget((prev) => (prev && prev.status === status && prev.index === idx ? prev : { status, index: idx }));
  };
  const handleColumnDragOver = (e, status, length) => {
    e.preventDefault();
    setDropTarget((prev) => (prev && prev.status === status ? prev : { status, index: length }));
  };
  const handleDragEnd = () => { setDraggingTaskId(null); setDropTarget(null); };
  const handleColumnDrop = (e, status, length) => {
    e.preventDefault();
    let taskId = '';
    try { taskId = e.dataTransfer.getData('text/plain'); } catch (err) { taskId = ''; }
    if (!taskId) taskId = draggingTaskId || '';
    const index = dropTarget && dropTarget.status === status ? dropTarget.index : length;
    if (taskId) moveTask(taskId, status, index);
    handleDragEnd();
  };

  /* --------------------------- Actions projets --------------------------- */
  const setTaskStatus = useCallback((taskId, status) => {
    let projectId = null;
    const next = commit((prev) => ({
      ...prev,
      projects: prev.projects.map((p) => {
        if (!p.tasks.some((t) => t.id === taskId)) return p;
        projectId = p.id;
        return { ...p, tasks: p.tasks.map((t) => (t.id === taskId ? { ...t, status } : t)) };
      })
    }));
    if (status === 'DONE' && projectId) {
      const fresh = next.projects.find((p) => p.id === projectId);
      if (fresh && projectProgress(fresh) === 100) { triggerConfetti(); pushToast(`« ${fresh.title} » est bouclé à 100 %`, 'success'); }
    }
  }, [commit, projectProgress, pushToast]);

  const setSubtaskStatus = useCallback((subId, status) => {
    let projectId = null;
    const next = commit((prev) => ({
      ...prev,
      projects: prev.projects.map((p) => {
        let touched = false;
        const tasks = p.tasks.map((t) => {
          if (!t.subtasks.some((s) => s.id === subId)) return t;
          touched = true;
          return { ...t, subtasks: t.subtasks.map((s) => (s.id === subId ? { ...s, status } : s)) };
        });
        if (touched) projectId = p.id;
        return touched ? { ...p, tasks } : p;
      })
    }));
    if (status === 'DONE' && projectId) {
      const fresh = next.projects.find((p) => p.id === projectId);
      if (fresh && projectProgress(fresh) === 100) { triggerConfetti(); pushToast(`« ${fresh.title} » est bouclé à 100 %`, 'success'); }
    }
  }, [commit, projectProgress, pushToast]);

  const saveProject = (form) => {
    if (!String(form.title).trim()) { pushToast('Donnez un nom au projet', 'error'); return; }
    if (form.id) commit((prev) => ({ ...prev, projects: prev.projects.map((p) => (p.id === form.id ? { ...p, ...form, duration: Number(form.duration) } : p)) }), 'Projet mis à jour');
    else {
      const created = normalizeProject({ ...form, id: uid('proj'), tasks: [] });
      commit((prev) => ({ ...prev, projects: [...prev.projects, created] }), 'Projet créé');
      setSelectedProjectId(created.id);
    }
    setProjectForm(null);
  };

  const deleteProject = (projectId) => {
    const p = projects.find((x) => x.id === projectId);
    if (!p) return;
    if (!window.confirm(`Supprimer « ${p.title} » et ses ${p.tasks.length} tâche(s) ? Ctrl+Z permet de revenir en arrière.`)) return;
    commit((prev) => ({ ...prev, projects: prev.projects.filter((x) => x.id !== projectId) }), 'Projet supprimé');
  };

  const saveTask = (form) => {
    if (!String(form.title).trim()) { pushToast('Donnez un titre à la tâche', 'error'); return; }
    const projectId = form.projectId || (projects[0] && projects[0].id);
    if (!projectId) { pushToast('Créez d’abord un projet', 'error'); return; }
    if (form.id) {
      commit((prev) => ({ ...prev, projects: prev.projects.map((p) => ({ ...p, tasks: p.tasks.map((t) => (t.id === form.id ? { ...t, ...form, subtasks: t.subtasks } : t)) })) }), 'Tâche mise à jour');
    } else {
      const maxRank = allTasks.filter((t) => t.status === (form.status || 'TODO')).reduce((m, t) => Math.max(m, t.rank), -1);
      const task = normalizeTask({ ...form, id: uid('t'), rank: maxRank + 1, subtasks: [] });
      commit((prev) => ({ ...prev, projects: prev.projects.map((p) => (p.id === projectId ? { ...p, tasks: [...p.tasks, task] } : p)) }), 'Tâche créée');
    }
    setTaskForm(null); setEditingTask(null);
  };

  const deleteTask = (taskId) => {
    commit((prev) => ({ ...prev, projects: prev.projects.map((p) => ({ ...p, tasks: p.tasks.filter((t) => t.id !== taskId) })) }), 'Tâche supprimée');
    setEditingTask(null);
  };

  const saveSubtask = (form) => {
    if (!String(form.title).trim()) { pushToast('Donnez un titre à la sous-tâche', 'error'); return; }
    if (form.id) {
      commit((prev) => ({
        ...prev,
        projects: prev.projects.map((p) => ({ ...p, tasks: p.tasks.map((t) => (t.id === form.taskId ? { ...t, subtasks: t.subtasks.map((s) => (s.id === form.id ? normalizeSubtask({ ...s, ...form }, t.startDate) : s)) } : t)) }))
      }), 'Sous-tâche mise à jour');
    } else {
      commit((prev) => ({
        ...prev,
        projects: prev.projects.map((p) => ({ ...p, tasks: p.tasks.map((t) => (t.id === form.taskId ? { ...t, subtasks: [...t.subtasks, normalizeSubtask({ ...form, id: uid('st') }, t.startDate)] } : t)) }))
      }), 'Sous-tâche ajoutée');
      setOpenTasks((prev) => ({ ...prev, [form.taskId]: true }));
    }
    setSubtaskForm(null);
  };

  const deleteSubtask = (form) => {
    commit((prev) => ({
      ...prev,
      projects: prev.projects.map((p) => ({ ...p, tasks: p.tasks.map((t) => (t.id === form.taskId ? { ...t, subtasks: t.subtasks.filter((s) => s.id !== form.id) } : t)) }))
    }), 'Sous-tâche supprimée');
    setSubtaskForm(null);
  };

  /* ---------------------------- Actions planning ---------------------------- */
  const saveEntry = (form) => {
    if (!String(form.title).trim()) { pushToast('Donnez un titre à l’entrée', 'error'); return; }
    if (form.id) commit((prev) => ({ ...prev, planning: prev.planning.map((e) => (e.id === form.id ? normalizeEntry({ ...e, ...form }) : e)) }), 'Entrée mise à jour');
    else commit((prev) => ({ ...prev, planning: [...prev.planning, normalizeEntry({ ...form, id: uid('pe') })] }), 'Entrée planifiée');
    setEntryForm(null); setEditingEntry(null);
  };

  const deleteEntry = (entryId) => {
    commit((prev) => ({ ...prev, planning: prev.planning.filter((e) => e.id !== entryId) }), 'Entrée supprimée');
    setEditingEntry(null);
  };

  const reassignEntry = (entryId, person) => {

  const openSplit = (entry) => {
    setEditingEntry(null); setSplitEntry(entry);
    if (entry.duration > 1) {
      const first = Math.min(entry.duration - 0.5, Math.max(0.5, Math.round(entry.duration) / 2));

  };

  const applySplit = () => {
    if (!splitEntry) return;
    const sum = splitSegments.reduce((a, b) => a + Number(b), 0);
    if (Math.abs(sum - splitEntry.duration) > 0.001) { pushToast(`La somme des tranches (${sum} j) doit égaler ${splitEntry.duration} j`, 'error'); return; }
    let date = parseDate(splitEntry.startDate);
    let slot = splitEntry.slot;
    const parts = splitSegments.map((seg, idx) => {
      const part = normalizeEntry({ ...splitEntry, id: uid('pe'), title: `${splitEntry.title} · ${idx + 1}/${splitSegments.length}`, startDate: formatDateIso(date), slot, duration: Number(seg) });
      let halves = Math.round(Number(seg) * 2);
      while (halves > 0) {
        if (slot === 'AM') slot = 'PM';
        else { slot = 'AM'; date = addDays(date, 1); }
        halves--;
      }
      return part;
    });
    commit((prev) => ({ ...prev, planning: prev.planning.filter((x) => x.id !== splitEntry.id).concat(parts) }), `Entrée scindée en ${parts.length} tranches`);

  const openEntryCreator = (person, dayIndex, slot) => {

  /* ---------------------------- Zoom & cadrage ---------------------------- */
  const nameColWidth = activeTab === 'planning' ? 240 : (isLeftPanelOpen ? 300 : 44);
  const nameColRef = useRef(nameColWidth);
  useEffect(() => { nameColRef.current = nameColWidth; }, [nameColWidth]);

  /* ------------------- Défilement au clic maintenu (pan) ------------------- */
  const panRef = useRef(null);
  const [panning, setPanning] = useState(false);
  const [viewport, setViewport] = useState({ left: 0, width: 0 });

  const syncViewport = useCallback(() => {
    const vp = document.getElementById('timeline-viewport');
    if (vp) setViewport({ left: vp.scrollLeft, width: vp.clientWidth });
  }, []);

  const startPan = (e) => {
    const vp = e.currentTarget;
    const middle = e.button === 1;
    if (!middle) {
      if (e.button !== 0) return;
      if (e.target && e.target.closest && e.target.closest('button, input, select, textarea, a, [data-nopan]')) return;
    }
    e.preventDefault();
    panRef.current = { el: vp, x: e.clientX, y: e.clientY, left: vp.scrollLeft, top: vp.scrollTop, moved: false };
    setPanning(true);
  };

  useEffect(() => {
    if (!panning) return;
    const onMove = (event) => {
      const p = panRef.current;
      if (!p) return;
      const dx = event.clientX - p.x;
      const dy = event.clientY - p.y;
      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) p.moved = true;
      p.el.scrollLeft = p.left - dx;
      p.el.scrollTop = p.top - dy;
      syncViewport();
    };
    const onUp = () => { panRef.current = null; setPanning(false); };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    return () => { window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); };
  }, [panning, syncViewport]);

  useEffect(() => {

  }, [activeTab, columnWidth, totalDays, syncViewport]);

  const scrollTimelineBy = useCallback((days) => {

  const fitAll = useCallback(() => {

  /* --------------------- Glisser-déposer des barres --------------------- */
  const [drag, setDrag] = useState(null);
  const dragRef = useRef(null);
  const movedRef = useRef(false);
  const rafRef = useRef(null);
  const colWidthRef = useRef(columnWidth);
  const rowRefs = useRef({});
  useEffect(() => { colWidthRef.current = columnWidth; }, [columnWidth]);

  const updateDrag = useCallback((next) => { dragRef.current = next; setDrag(next); }, []);

  const startDrag = (e, payload) => {
    if (e.button !== 0) return;
    e.stopPropagation(); e.preventDefault();
    movedRef.current = false;
    updateDrag({ ...payload, startX: e.clientX, deltaX: 0, snapStart: payload.startUnits, snapLen: payload.lenUnits, targetPerson: payload.person || null });
  };

  const personAtY = (clientY) => {
    const map = rowRefs.current;
    const keys = Object.keys(map);
    for (let i = 0; i < keys.length; i++) {
      const el = map[keys[i]];
      if (!el || !el.getBoundingClientRect) continue;
      const r = el.getBoundingClientRect();
      if (r.height > 0 && clientY >= r.top && clientY <= r.bottom) return keys[i];
    }
    return null;
  };

  useEffect(() => {
    const onMove = (event) => {
      const d = dragRef.current;
      if (!d) return;
      const dx = event.clientX - d.startX;
      if (Math.abs(dx) > 3) movedRef.current = true;
      if (rafRef.current) window.cancelAnimationFrame(rafRef.current);
      rafRef.current = window.requestAnimationFrame(() => {
        const cur = dragRef.current;
        if (!cur) return;
        const unitPx = colWidthRef.current * cur.unit;
        const steps = Math.round(dx / unitPx);
        let snapStart = cur.startUnits;
        let snapLen = cur.lenUnits;
        if (cur.action === 'move') snapStart = Math.max(0, cur.startUnits + steps);
        else if (cur.action === 'resize-right') snapLen = Math.max(1, cur.lenUnits + steps);
        else if (cur.action === 'resize-left') {
          const shift = Math.min(steps, cur.lenUnits - 1);
          snapStart = Math.max(0, cur.startUnits + shift);
          snapLen = cur.lenUnits - (snapStart - cur.startUnits);
        }
        let targetPerson = cur.targetPerson;
        if (cur.kind === 'entry' && cur.action === 'move') {
          const hovered = personAtY(event.clientY);
          if (hovered) { targetPerson = hovered; if (hovered !== cur.person) movedRef.current = true; }
        }
        updateDrag({ ...cur, deltaX: dx, snapStart, snapLen, targetPerson });
      });
    };

    const onUp = () => {
      const d = dragRef.current;
      if (rafRef.current) window.cancelAnimationFrame(rafRef.current);
      updateDrag(null);
      if (!d || !movedRef.current) return;
      const personChanged = d.kind === 'entry' && d.targetPerson && d.targetPerson !== d.person;
      if (d.snapStart === d.startUnits && d.snapLen === d.lenUnits && !personChanged) return;

      if (d.kind === 'entry') {
        const startDate = formatDateIso(addDays(timelineStart, Math.floor(d.snapStart / 2)));
        const slot = d.snapStart % 2 === 1 ? 'PM' : 'AM';
        const duration = d.snapLen / 2;
        const assignee = d.targetPerson || d.person;
        commit((prev) => ({ ...prev, planning: prev.planning.map((e) => (e.id === d.id ? { ...e, startDate, slot, duration, assignee } : e)) }));
        if (personChanged) pushToast(`Transférée à ${assignee}`, 'success');
      } else if (d.kind === 'project') {
        const startDate = formatDateIso(addDays(timelineStart, d.snapStart));
        commit((prev) => ({ ...prev, projects: prev.projects.map((p) => (p.id === d.id ? { ...p, startDate, duration: d.snapLen } : p)) }));
      } else if (d.kind === 'task') {
        const startDate = formatDateIso(addDays(timelineStart, d.snapStart));
        commit((prev) => ({ ...prev, projects: prev.projects.map((p) => ({ ...p, tasks: p.tasks.map((t) => (t.id === d.id ? { ...t, startDate, duration: d.snapLen } : t)) })) }));
      } else if (d.kind === 'subtask') {
        const startDate = formatDateIso(addDays(timelineStart, d.snapStart));
        commit((prev) => ({
          ...prev,
          projects: prev.projects.map((p) => ({ ...p, tasks: p.tasks.map((t) => ({ ...t, subtasks: t.subtasks.map((s) => (s.id === d.id ? { ...s, startDate, duration: d.snapLen } : s)) })) }))
        }));
      }
    };

    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    return () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      if (rafRef.current) window.cancelAnimationFrame(rafRef.current);
    };
  }, [commit, timelineStart, updateDrag, pushToast]);

  /* ---------------------------- Raccourcis ---------------------------- */

    const onKey = (e) => {

      if (e.key === 'Escape') { closeAllModals(); return; }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
      if (typing || anyModalOpen) return;
      if (e.key === '1') setActiveTab('roadmap');
      if (e.key === '2') setActiveTab('kanban');
      if (e.key === '3') setActiveTab('planning');
      if (e.key === '4') setActiveTab('notes');
      if (e.key.toLowerCase() === 't') scrollToToday();
      if (e.key.toLowerCase() === 'f') fitAll();
      if (e.key === 'ArrowLeft') { e.preventDefault(); scrollTimelineBy(-7); }
      if (e.key === 'ArrowRight') { e.preventDefault(); scrollTimelineBy(7); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [undo, closeAllModals, anyModalOpen, scrollToToday, fitAll, scrollTimelineBy]);

  /* --------------------- Collaboration temps réel (P2P) --------------------- */
  const [collab, setCollab] = useState(() => {
    const fromUrl = readRoomFromUrl();
    const stored = loadJson(COLLAB_KEY, {});
    return {
      enabled: fromUrl ? true : !!stored.enabled,
      room: (fromUrl && fromUrl.room) || stored.room || randomRoom(),
      key: (fromUrl && fromUrl.key) || stored.key || '',
      name: stored.name || 'Moi',
      signaling: Array.isArray(stored.signaling) && stored.signaling.length ? stored.signaling : DEFAULT_SIGNALING
    };
  });
  const [collabState, setCollabState] = useState({ status: 'off', peers: 0, names: [], error: '' });
  const [libReady, setLibReady] = useState(() => !!(window.YCollab || window.YCollabError));

  const docRef = useRef(null);
  const applyingRemote = useRef(false);
  const lastPushed = useRef('');

  useEffect(() => { saveJson(COLLAB_KEY, collab); }, [collab]);

  useEffect(() => {
    if (libReady) return;
    const onReady = () => setLibReady(true);
    window.addEventListener('ycollab-ready', onReady);
    return () => window.removeEventListener('ycollab-ready', onReady);
  }, [libReady]);

  useEffect(() => {
    if (!collab.enabled) { setCollabState({ status: 'off', peers: 0, names: [], error: '' }); return undefined; }
    if (!libReady) { setCollabState((p) => ({ ...p, status: 'loading' })); return undefined; }
    if (!window.YCollab) {
      setCollabState({ status: 'error', peers: 0, names: [], error: window.YCollabError || 'Bibliothèque indisponible' });
      return undefined;
    }

    const { Y, WebrtcProvider } = window.YCollab;
    let provider = null;
    let doc = null;

    try {
      doc = new Y.Doc();
      provider = new WebrtcProvider(collab.room, doc, {
        signaling: collab.signaling,
        password: collab.key || null,
        maxConns: 24
      });
    } catch (err) {
      setCollabState({ status: 'error', peers: 0, names: [], error: String(err.message || err) });
      return undefined;
    }

    docRef.current = { doc, provider, Y };
    window.__auraplanDoc = doc;   // utile pour le débogage et les tests
    setCollabState({ status: 'connecting', peers: 0, names: [], error: '' });

    const pushAll = () => {
      const snapshot = dataToShared(dataRef.current);
      doc.transact(() => {
        doc.getMap('meta').set('value', snapshot.meta);
        COLLECTIONS.forEach((c) => {
          const ymap = doc.getMap(c);
          Object.keys(snapshot[c]).forEach((id) => ymap.set(id, snapshot[c][id]));
        });
      }, 'local');
      lastPushed.current = JSON.stringify(snapshot);
    };

    const pullAll = () => {
      applyingRemote.current = true;
      const next = sharedToData(doc);
      dataRef.current = next;
      setData(next);
      lastPushed.current = JSON.stringify(dataToShared(next));
      window.setTimeout(() => { applyingRemote.current = false; }, 0);
    };

    const remoteHasContent = () => COLLECTIONS.some((c) => doc.getMap(c).size > 0);

    // Premier contact : on adopte l'état du groupe s'il existe, sinon on publie le nôtre.
    let joined = false;
    const settle = () => {
      if (joined) return;
      joined = true;
      if (remoteHasContent()) { pullAll(); pushToast('Tableau du groupe récupéré', 'success'); }
      else pushAll();
    };
    const settleTimer = window.setTimeout(settle, 1500);

    const onUpdate = (update, origin) => {
      if (origin === 'local') return;
      if (!joined) { joined = true; window.clearTimeout(settleTimer); }
      pullAll();
    };
    doc.on('update', onUpdate);

    const refreshPeers = () => {
      let names = [];
      try {
        const states = Array.from(provider.awareness.getStates().values());
        names = states.map((st) => (st && st.user && st.user.name) || 'Invité');
      } catch (e) { names = []; }
      setCollabState({
        status: provider.connected ? 'connected' : 'connecting',
        peers: Math.max(0, names.length - 1),
        names, error: ''
      });
    };

    try {
      provider.awareness.setLocalStateField('user', { name: collab.name, color: avatarColor(collab.name) });
      provider.awareness.on('change', refreshPeers);
      provider.on('status', refreshPeers);
      provider.on('peers', refreshPeers);
    } catch (e) { /* no-op */ }
    refreshPeers();

    return () => {
      window.clearTimeout(settleTimer);
      try { doc.off('update', onUpdate); } catch (e) { /* no-op */ }
      try { provider.awareness.off('change', refreshPeers); } catch (e) { /* no-op */ }
      try { provider.destroy(); } catch (e) { /* no-op */ }
      try { doc.destroy(); } catch (e) { /* no-op */ }
      docRef.current = null;
      window.__auraplanDoc = null;
    };
  }, [collab.enabled, collab.room, collab.key, collab.name, collab.signaling, libReady, pushToast]);

  // Publication différentielle : seules les fiches réellement modifiées partent sur le réseau.
  useEffect(() => {
    const ctx = docRef.current;

    const snapshot = dataToShared(data);

    const previous = lastPushed.current ? JSON.parse(lastPushed.current) : { meta: null, projects: {}, planning: {}, notes: {} };
    ctx.doc.transact(() => {
      if (JSON.stringify(previous.meta) !== JSON.stringify(snapshot.meta)) ctx.doc.getMap('meta').set('value', snapshot.meta);
      COLLECTIONS.forEach((c) => {
        const ymap = ctx.doc.getMap(c);
        const before = previous[c] || {};
        Object.keys(snapshot[c]).forEach((id) => {
          if (JSON.stringify(before[id]) !== JSON.stringify(snapshot[c][id])) ymap.set(id, snapshot[c][id]);
        });
        Object.keys(before).forEach((id) => { if (!snapshot[c][id]) ymap.delete(id); });
      });

    lastPushed.current = serialized;
  }, [data]);

  const shareUrl = useMemo(() => {

  const copyShareUrl = async () => {

  };

  /* --------------------------- Import / export --------------------------- */
  const fileInputRef = useRef(null);
  const exportJson = () => {

  };
  const importJson = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { try { commit(normalizeData(JSON.parse(String(reader.result))), 'Données importées'); } catch (err) { pushToast('Fichier illisible : JSON invalide', 'error'); } };
    reader.onerror = () => pushToast('Lecture du fichier impossible', 'error');
    reader.readAsText(file);
  };

  /* -------------------------------- GitHub -------------------------------- */
  const [gh, setGh] = useState(() => {
    const s = loadJson(GH_KEY, {});

  });
  const [ghStatus, setGhStatus] = useState('');
  useEffect(() => { saveJson(GH_KEY, gh); }, [gh]);
  const ghUrl = () => `https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/${gh.path}`;
  const ghHeaders = () => ({ Authorization: `Bearer ${gh.token}`, Accept: 'application/vnd.github+json' });

  const ghPush = async () => {
    if (!gh.owner || !gh.repo || !gh.token) { setGhStatus('Renseignez le propriétaire, le dépôt et le jeton.'); return; }
    setGhStatus('Envoi en cours…');
    try {
      let sha = null;
      const head = await fetch(`${ghUrl()}?ref=${encodeURIComponent(gh.branch)}`, { headers: ghHeaders() });
      if (head.ok) sha = (await head.json()).sha;
      const res = await fetch(ghUrl(), {
        method: 'PUT',
        headers: { ...ghHeaders(), 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: `AuraPlan — mise à jour ${new Date().toLocaleString('fr-FR')}`, content: b64encode(JSON.stringify(data, null, 2)), branch: gh.branch, ...(sha ? { sha } : {}) })
      });
      if (!res.ok) throw new Error(`GitHub a répondu ${res.status}`);
      setGhStatus('Enregistré sur GitHub.');
      pushToast('Données envoyées sur GitHub', 'success');

  };

    if (!gh.owner || !gh.repo) { setGhStatus('Renseignez au moins le propriétaire et le dépôt.'); return; }
    setGhStatus('Récupération en cours…');
    try {
      const res = await fetch(`${ghUrl()}?ref=${encodeURIComponent(gh.branch)}`, { headers: gh.token ? ghHeaders() : { Accept: 'application/vnd.github+json' } });
      if (!res.ok) throw new Error(`GitHub a répondu ${res.status}`);
      const json = await res.json();
      commit(normalizeData(JSON.parse(b64decode(json.content || ''))), 'Données récupérées depuis GitHub');

  /* --------------------------------- Rendu --------------------------------- */
  const timelineWidth = totalDays * columnWidth;

  const DayHeader = ({ withHalves }) => (
    <div className="flex" style={{ width: `${timelineWidth}px` }}>
      {Array.from({ length: totalDays }).map((_, i) => {
        const d = addDays(timelineStart, i);
