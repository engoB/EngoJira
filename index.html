<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
/* =========================================================================
   AuraPlan Studio — application autonome (React 18 + Babel + Tailwind)
   ========================================================================= */
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ----------------------------- Utilitaires ----------------------------- */
const STORAGE_KEY = 'auraplan_data_v20';
const GH_KEY = 'auraplan_gh_v20';
const PREFS_KEY = 'auraplan_prefs_v20';

const DEFAULT_COLOR = 'from-indigo-500 to-violet-600';
const STATUSES = ['TODO', 'IN_PROGRESS', 'IN_REVIEW', 'DONE'];
const PRIORITIES = ['LOW', 'MEDIUM', 'HIGH', 'URGENT'];

const STATUS_META = {
  TODO: { label: 'À faire', accent: 'border-slate-500', dot: 'bg-slate-400' },
  IN_PROGRESS: { label: 'En cours', accent: 'border-indigo-500', dot: 'bg-indigo-400' },
  IN_REVIEW: { label: 'En revue', accent: 'border-fuchsia-500', dot: 'bg-fuchsia-400' },
  DONE: { label: 'Terminé', accent: 'border-emerald-500', dot: 'bg-emerald-400' }
};

const PRIORITY_META = {
  LOW: { label: 'Basse', cls: 'text-sky-300 bg-sky-500/10 border-sky-500/30', icon: '↓' },
  MEDIUM: { label: 'Moyenne', cls: 'text-amber-300 bg-amber-500/10 border-amber-500/30', icon: '=' },
  HIGH: { label: 'Haute', cls: 'text-orange-300 bg-orange-500/10 border-orange-500/30', icon: '↑' },
  URGENT: { label: 'Urgente', cls: 'text-rose-300 bg-rose-500/10 border-rose-500/30', icon: '⇈' }
};

const COLOR_OPTIONS = [
  { name: 'Indigo', value: 'from-indigo-500 to-violet-600' },
  { name: 'Violet néon', value: 'from-purple-500 to-fuchsia-600' },
  { name: 'Émeraude', value: 'from-emerald-500 to-teal-600' },
  { name: 'Ambre', value: 'from-amber-500 to-orange-600' },
  { name: 'Rose', value: 'from-rose-500 to-pink-600' },
  { name: 'Cyan', value: 'from-cyan-500 to-blue-600' },
  { name: 'Ardoise', value: 'from-slate-500 to-slate-700' }
];

const MONTHS_FR = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];

const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
const uid = (p) => p + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);

const parseDate = (str) => {
  const d = new Date(String(str) + 'T00:00:00');
  return isNaN(d.getTime()) ? new Date() : d;
};
const formatDateIso = (d) => {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
};
const addDays = (d, n) => { const r = new Date(d.getTime()); r.setDate(r.getDate() + n); return r; };
const diffDays = (a, b) => Math.round((a.getTime() - b.getTime()) / 86400000);
const TODAY_STR = formatDateIso(new Date());

const formatDateFr = (iso) => parseDate(iso).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
const formatDayShort = (iso) => parseDate(iso).toLocaleDateString('fr-FR', { weekday: 'short', day: '2-digit', month: 'short' });

const getMonday = (d) => {
  const date = new Date(d.getTime());
  const day = date.getDay();
  date.setDate(date.getDate() - ((day + 6) % 7));
  date.setHours(0, 0, 0, 0);
  return date;
};

const getWeekNumber = (d) => {
  const date = new Date(d.getTime());
  date.setHours(0, 0, 0, 0);
  date.setDate(date.getDate() + 3 - ((date.getDay() + 6) % 7));
  const week1 = new Date(date.getFullYear(), 0, 4);
  return 1 + Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
};

const isIsoDate = (s) => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(new Date(s + 'T00:00:00').getTime());
const safeDate = (s) => (isIsoDate(s) ? s : TODAY_STR);
const safeNum = (v, fallback, min, step) => {
  const n = Number(v);
  if (!Number.isFinite(n) || n < min) return fallback;
  return step ? Math.round(n / step) * step : n;
};
const safeText = (v, fallback) => {
  const s = typeof v === 'string' ? v.trim() : '';
  return s ? s.slice(0, 160) : fallback;
};

const triggerConfetti = () => {
  try {
    if (typeof window.confetti === 'function') {
      window.confetti({ particleCount: 160, spread: 95, origin: { y: 0.6 }, disableForReducedMotion: true });
    }
  } catch (e) { /* no-op */ }
};

const initials = (name) => String(name || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
const AVATAR_COLORS = ['bg-indigo-600', 'bg-emerald-600', 'bg-amber-600', 'bg-rose-600', 'bg-cyan-600', 'bg-fuchsia-600', 'bg-teal-600'];
const avatarColor = (name) => {
  let h = 0;
  const s = String(name || '');
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
};

const b64encode = (str) => {
  try { return window.btoa(String.fromCharCode.apply(null, Array.from(new TextEncoder().encode(str)))); }
  catch (e) { return window.btoa(unescape(encodeURIComponent(str))); }
};
const b64decode = (str) => {
  try {
    const bin = window.atob(String(str).replace(/\s/g, ''));
    const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  } catch (e) { return ''; }
};

/* -------------------- Normalisation & persistance sûre -------------------- */
const normalizeTask = (t) => {
  const o = t && typeof t === 'object' ? t : {};
  return {
    id: o.id ? String(o.id) : uid('t'),
    title: safeText(o.title, 'Tâche sans titre'),
    assignee: safeText(o.assignee, 'Non assigné'),
    startDate: safeDate(o.startDate),
    duration: safeNum(o.duration, 1, 0.5, 0.5),
    status: STATUSES.includes(o.status) ? o.status : 'TODO',
    priority: PRIORITIES.includes(o.priority) ? o.priority : 'MEDIUM',
    notes: typeof o.notes === 'string' ? o.notes.slice(0, 2000) : ''
  };
};

const normalizeProject = (p) => {
  const o = p && typeof p === 'object' ? p : {};
  return {
    id: o.id ? String(o.id) : uid('proj'),
    title: safeText(o.title, 'Projet sans titre'),
    category: safeText(o.category, 'Général'),
    startDate: safeDate(o.startDate),
    duration: safeNum(o.duration, 10, 1, 1),
    color: typeof o.color === 'string' && o.color.startsWith('from-') ? o.color : DEFAULT_COLOR,
    tasks: Array.isArray(o.tasks) ? o.tasks.map(normalizeTask) : []
  };
};

const normalizeEntry = (e) => {
  const o = e && typeof e === 'object' ? e : {};
  return {
    id: o.id ? String(o.id) : uid('pe'),
    title: safeText(o.title, 'Entrée'),
    tag: safeText(o.tag, 'Général'),
    color: typeof o.color === 'string' && o.color.startsWith('from-') ? o.color : DEFAULT_COLOR,
    assignee: safeText(o.assignee, 'Non assigné'),
    startDate: safeDate(o.startDate),
    slot: o.slot === 'PM' ? 'PM' : 'AM',
    duration: safeNum(o.duration, 0.5, 0.5, 0.5),
    notes: typeof o.notes === 'string' ? o.notes.slice(0, 2000) : ''
  };
};

const normalizeData = (raw) => {
  const o = raw && typeof raw === 'object' ? raw : {};
  const projects = Array.isArray(o.projects) ? o.projects.map(normalizeProject) : [];
  const planning = Array.isArray(o.planning) ? o.planning.map(normalizeEntry)
    : Array.isArray(o.planningEntries) ? o.planningEntries.map(normalizeEntry) : [];
  return { projects, planning };
};

const SEED = normalizeData({
  projects: [
    {
      id: 'proj-cloud', title: 'Refonte microservices cloud', category: 'Infrastructure',
      startDate: TODAY_STR, duration: 18, color: 'from-indigo-500 to-violet-600',
      tasks: [
        { id: 't-cloud-1', title: 'Provisionner les clusters Kubernetes', assignee: 'Alexandre M.', startDate: TODAY_STR, duration: 4, status: 'DONE', priority: 'HIGH' },
        { id: 't-cloud-2', title: 'Audit sécurité & Ingress Controller', assignee: 'Alexandre M.', startDate: formatDateIso(addDays(new Date(), 4)), duration: 3, status: 'IN_PROGRESS', priority: 'URGENT' },
        { id: 't-cloud-3', title: 'Pipeline CI/CD multi-environnements', assignee: 'Nadia B.', startDate: formatDateIso(addDays(new Date(), 7)), duration: 5, status: 'TODO', priority: 'MEDIUM' }
      ]
    },
    {
      id: 'proj-portail', title: 'Portail client v2', category: 'Frontend',
      startDate: formatDateIso(addDays(new Date(), 3)), duration: 14, color: 'from-purple-500 to-fuchsia-600',
      tasks: [
        { id: 't-portail-1', title: 'Design system & tokens', assignee: 'Sophie T.', startDate: formatDateIso(addDays(new Date(), 3)), duration: 3, status: 'IN_REVIEW', priority: 'MEDIUM' },
        { id: 't-portail-2', title: 'Écrans de facturation', assignee: 'Sophie T.', startDate: formatDateIso(addDays(new Date(), 6)), duration: 6, status: 'TODO', priority: 'HIGH' }
      ]
    }
  ],
  planning: [
    { id: 'pe-1', title: 'Infra K8s', tag: 'Infrastructure', color: 'from-indigo-500 to-violet-600', assignee: 'Alexandre M.', startDate: TODAY_STR, slot: 'AM', duration: 1.5 },
    { id: 'pe-2', title: 'Audit SSL', tag: 'Infrastructure', color: 'from-cyan-500 to-blue-600', assignee: 'Alexandre M.', startDate: formatDateIso(addDays(new Date(), 2)), slot: 'PM', duration: 0.5 },
    { id: 'pe-3', title: 'Design system', tag: 'Frontend', color: 'from-purple-500 to-fuchsia-600', assignee: 'Sophie T.', startDate: TODAY_STR, slot: 'AM', duration: 2.5 },
    { id: 'pe-4', title: 'Revue de sprint', tag: 'Rituel', color: 'from-amber-500 to-orange-600', assignee: 'Nadia B.', startDate: formatDateIso(addDays(new Date(), 1)), slot: 'PM', duration: 0.5 }
  ]
});

const loadJson = (key, fallback) => {
  try {
    const raw = window.localStorage.getItem(key);
    if (!raw) return fallback;
    const parsed = JSON.parse(raw);
    return parsed && typeof parsed === 'object' ? parsed : fallback;
  } catch (e) {
    try { window.localStorage.removeItem(key); } catch (e2) { /* no-op */ }
    return fallback;
  }
};
const saveJson = (key, value) => {
  try { window.localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (e) { return false; }
};

const loadData = () => {
  const stored = loadJson(STORAGE_KEY, null);
  if (!stored) return SEED;
  const clean = normalizeData(stored);
  if (clean.projects.length === 0 && clean.planning.length === 0) return SEED;
  return clean;
};

/* ------------------------------ Composants UI ------------------------------ */
function Avatar({ name, size = 'md' }) {
  const s = size === 'sm' ? 'w-6 h-6 text-[9px]' : size === 'lg' ? 'w-10 h-10 text-xs' : 'w-8 h-8 text-[10px]';
  return (
    <span className={`${s} ${avatarColor(name)} rounded-xl flex items-center justify-center font-extrabold text-white shrink-0 shadow-sm`} title={name}>
      {initials(name)}
    </span>
  );
}

function Modal({ title, subtitle, onClose, children, footer, T, size = 'md' }) {
  const width = size === 'lg' ? 'max-w-2xl' : size === 'sm' ? 'max-w-sm' : 'max-w-lg';
  return (
    <div className="fixed inset-0 z-[80] flex items-start justify-center overflow-y-auto bg-black/70 p-4 backdrop-blur-sm sm:items-center" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className={`w-full ${width} rounded-2xl border ${T.panel} shadow-2xl`} onMouseDown={(e) => e.stopPropagation()}>
        <div className={`flex items-start justify-between gap-4 border-b ${T.border} px-5 py-4`}>
          <div>
            <h3 className="text-sm font-extrabold tracking-tight">{title}</h3>
            {subtitle ? <p className={`mt-0.5 text-[11px] ${T.muted}`}>{subtitle}</p> : null}
          </div>
          <button type="button" onClick={onClose} aria-label="Fermer" className={`rounded-lg px-2 py-1 text-sm ${T.muted} hover:bg-white/10`}>✕</button>
        </div>
        <div className="max-h-[70vh] overflow-y-auto px-5 py-4">{children}</div>
        {footer ? <div className={`flex items-center justify-between gap-3 border-t ${T.border} px-5 py-4`}>{footer}</div> : null}
      </div>
    </div>
  );
}

function Field({ label, hint, children, T }) {
  return (
    <label className="block">
      <span className={`mb-1 block text-[11px] font-semibold uppercase tracking-wide ${T.muted}`}>{label}</span>
      {children}
      {hint ? <span className={`mt-1 block text-[10px] ${T.muted}`}>{hint}</span> : null}
    </label>
  );
}

function Toasts({ items, onDismiss }) {
  return (
    <div className="pointer-events-none fixed bottom-5 right-5 z-[100] flex w-72 flex-col gap-2">
      {items.map((t) => (
        <div key={t.id} onClick={() => onDismiss(t.id)}
          className={`pointer-events-auto cursor-pointer rounded-xl border px-4 py-3 text-xs font-semibold shadow-2xl backdrop-blur
          ${t.tone === 'error' ? 'border-rose-500/40 bg-rose-950/90 text-rose-100'
            : t.tone === 'success' ? 'border-emerald-500/40 bg-emerald-950/90 text-emerald-100'
              : 'border-indigo-500/40 bg-slate-900/95 text-slate-100'}`}>
          {t.message}
        </div>
      ))}
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error('AuraPlan — erreur de rendu :', error, info); }
  render() {
    if (this.state.error) {
      return (
        <div className="mx-auto mt-24 max-w-xl rounded-2xl border border-rose-500/40 bg-slate-900 p-8 text-slate-100">
          <h1 className="mb-2 text-lg font-extrabold">L'affichage s'est interrompu</h1>
          <p className="mb-4 text-sm text-slate-400">
            Une donnée locale est probablement corrompue. Réinitialisez le stockage pour repartir d'une base saine —
            vos données GitHub ne sont pas touchées.
          </p>
          <pre className="mb-4 max-h-40 overflow-auto rounded-lg bg-black/40 p-3 text-[11px] text-rose-300">{String(this.state.error && this.state.error.message)}</pre>
          <button
            className="rounded-xl bg-indigo-600 px-4 py-2 text-xs font-bold text-white"
            onClick={() => { try { window.localStorage.removeItem(STORAGE_KEY); } catch (e) { /* no-op */ } window.location.reload(); }}>
            Réinitialiser et recharger
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

/* ------------------------------ Application ------------------------------ */
function AuraPlanApp() {
  const prefs = useRef(loadJson(PREFS_KEY, {})).current;

  const [isDark, setIsDark] = useState(prefs.isDark !== false);
  const [activeTab, setActiveTab] = useState(['roadmap', 'kanban', 'planning'].includes(prefs.tab) ? prefs.tab : 'planning');
  const [columnWidth, setColumnWidth] = useState(clamp(Number(prefs.columnWidth) || 120, 40, 240));

  const [data, setData] = useState(loadData);
  const dataRef = useRef(data);
  const undoStack = useRef([]);

  const projects = data.projects;
  const planning = data.planning;

  const [toasts, setToasts] = useState([]);
  const pushToast = useCallback((message, tone) => {
    const id = uid('toast');
    setToasts((prev) => [...prev.slice(-3), { id, message, tone: tone || 'info' }]);
    window.setTimeout(() => setToasts((prev) => prev.filter((t) => t.id !== id)), 4200);
  }, []);
  const dismissToast = useCallback((id) => setToasts((prev) => prev.filter((t) => t.id !== id)), []);

  const commit = useCallback((mutator, label) => {
    const prev = dataRef.current;
    const next = normalizeData(typeof mutator === 'function' ? mutator(prev) : mutator);
    undoStack.current.push(prev);
    if (undoStack.current.length > 60) undoStack.current.shift();
    dataRef.current = next;
    setData(next);
    if (label) pushToast(label, 'success');
    return next;
  }, [pushToast]);

  const undo = useCallback(() => {
    const prev = undoStack.current.pop();
    if (!prev) { pushToast('Rien à annuler', 'info'); return; }
    dataRef.current = prev;
    setData(prev);
    pushToast('Dernière action annulée', 'info');
  }, [pushToast]);

  useEffect(() => { dataRef.current = data; saveJson(STORAGE_KEY, data); }, [data]);
  useEffect(() => { saveJson(PREFS_KEY, { isDark, tab: activeTab, columnWidth }); }, [isDark, activeTab, columnWidth]);
  useEffect(() => { document.body.classList.toggle('theme-light', !isDark); }, [isDark]);

  /* --------------------------- Thème (classes) --------------------------- */
  const T = useMemo(() => (isDark ? {
    app: 'bg-[#070B12] text-slate-100',
    panel: 'bg-[#0E1523] border-[#1E2941]',
    sub: 'bg-[#0A1120]',
    head: 'bg-[#0B1220]',
    border: 'border-[#1E2941]',
    grid: 'border-slate-700/25',
    muted: 'text-slate-400',
    input: 'bg-[#0A1120] border-[#26314F] text-slate-100 placeholder-slate-500',
    hover: 'hover:bg-white/5',
    ghost: 'bg-white/5 hover:bg-white/10 text-slate-200 border-[#26314F]'
  } : {
    app: 'bg-slate-100 text-slate-900',
    panel: 'bg-white border-slate-200',
    sub: 'bg-slate-50',
    head: 'bg-white',
    border: 'border-slate-200',
    grid: 'border-slate-200',
    muted: 'text-slate-500',
    input: 'bg-white border-slate-300 text-slate-900 placeholder-slate-400',
    hover: 'hover:bg-slate-100',
    ghost: 'bg-slate-100 hover:bg-slate-200 text-slate-700 border-slate-300'
  }), [isDark]);

  const inputCls = `w-full rounded-xl border px-3 py-2 text-xs font-medium outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 ${T.input}`;
  const btnPrimary = 'rounded-xl bg-indigo-600 px-4 py-2 text-xs font-bold text-white shadow-lg shadow-indigo-900/30 transition hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-400';
  const btnGhost = `rounded-xl border px-3 py-2 text-xs font-semibold transition focus:outline-none focus:ring-2 focus:ring-indigo-400 ${T.ghost}`;

  /* ------------------------------ Sélections ------------------------------ */
  const [selectedProjectId, setSelectedProjectId] = useState(() => (SEED.projects[0] ? SEED.projects[0].id : null));
  const [expanded, setExpanded] = useState({});
  const [isLeftPanelOpen, setIsLeftPanelOpen] = useState(true);
  const [isRightPanelOpen, setIsRightPanelOpen] = useState(true);
  const [search, setSearch] = useState('');
  const [assigneeFilter, setAssigneeFilter] = useState('ALL');

  const [editingTask, setEditingTask] = useState(null);
  const [editingProject, setEditingProject] = useState(null);
  const [editingEntry, setEditingEntry] = useState(null);
  const [splitEntry, setSplitEntry] = useState(null);
  const [splitSegments, setSplitSegments] = useState([0.5, 0.5]);
  const [projectForm, setProjectForm] = useState(null);
  const [taskForm, setTaskForm] = useState(null);
  const [entryForm, setEntryForm] = useState(null);
  const [isConfigOpen, setIsConfigOpen] = useState(false);
  const [isHelpOpen, setIsHelpOpen] = useState(false);

  const anyModalOpen = !!(editingTask || editingProject || editingEntry || splitEntry || projectForm || taskForm || entryForm || isConfigOpen || isHelpOpen);

  const closeAllModals = useCallback(() => {
    setEditingTask(null); setEditingProject(null); setEditingEntry(null); setSplitEntry(null);
    setProjectForm(null); setTaskForm(null); setEntryForm(null); setIsConfigOpen(false); setIsHelpOpen(false);
  }, []);

  useEffect(() => {
    if (projects.length === 0) { setSelectedProjectId(null); return; }
    if (!projects.some((p) => p.id === selectedProjectId)) setSelectedProjectId(projects[0].id);
  }, [projects, selectedProjectId]);

  const selectedProject = projects.find((p) => p.id === selectedProjectId) || null;

  /* ------------------------- Données dérivées ------------------------- */
  const allTasks = useMemo(() => {
    const list = [];
    projects.forEach((p) => p.tasks.forEach((t) => list.push({ ...t, project: { id: p.id, title: p.title, color: p.color, category: p.category } })));
    return list;
  }, [projects]);

  const collaborators = useMemo(() => {
    const set = new Set();
    planning.forEach((e) => set.add(e.assignee));
    allTasks.forEach((t) => set.add(t.assignee));
    if (set.size === 0) set.add('Non assigné');
    return Array.from(set).sort((a, b) => a.localeCompare(b, 'fr'));
  }, [planning, allTasks]);

  const projectProgress = useCallback((project) => {
    if (!project || project.tasks.length === 0) return 0;
    const done = project.tasks.filter((t) => t.status === 'DONE').length;
    return Math.round((done / project.tasks.length) * 100);
  }, []);

  const projectHealth = useCallback((project) => {
    if (!project || project.tasks.length === 0) return { tone: 'neutral', label: 'Aucune tâche' };
    const end = addDays(parseDate(project.startDate), project.duration);
    let maxEnd = parseDate(project.startDate);
    project.tasks.forEach((t) => {
      const e = addDays(parseDate(t.startDate), t.duration);
      if (e > maxEnd) maxEnd = e;
    });
    const delta = diffDays(maxEnd, end);
    if (delta > 0) return { tone: 'danger', label: `Dépassement de ${delta} j` };
    if (delta < 0) return { tone: 'success', label: `${Math.abs(delta)} j de marge` };
    return { tone: 'success', label: 'Dans les temps' };
  }, []);

  /* --------------------- Bornes de la timeline (marges) --------------------- */
  const { timelineStart, totalDays } = useMemo(() => {
    let min = parseDate(TODAY_STR);
    let max = addDays(parseDate(TODAY_STR), 14);
    const consider = (startIso, duration) => {
      const s = parseDate(startIso);
      const e = addDays(s, Math.ceil(duration));
      if (s < min) min = s;
      if (e > max) max = e;
    };
    if (activeTab === 'planning') {
      planning.forEach((e) => consider(e.startDate, e.duration));
    } else {
      projects.forEach((p) => {
        consider(p.startDate, p.duration);
        p.tasks.forEach((t) => consider(t.startDate, t.duration));
      });
    }
    const start = getMonday(addDays(min, -3));       // 3 jours de marge avant
    const required = diffDays(addDays(max, 5), start); // 5 jours de marge après
    return { timelineStart: start, totalDays: clamp(required, 28, 730) };
  }, [projects, planning, activeTab]);

  const timelineWeeks = useMemo(() => {
    const weeks = [];
    let current = null;
    for (let i = 0; i < totalDays; i++) {
      const d = addDays(timelineStart, i);
      const w = getWeekNumber(d);
      if (!current || current.weekNum !== w) {
        current = { weekNum: w, days: 0, monthLabel: `${MONTHS_FR[d.getMonth()]} ${d.getFullYear()}` };
        weeks.push(current);
      }
      current.days++;
    }
    return weeks;
  }, [timelineStart, totalDays]);

  const timelineMonths = useMemo(() => {
    const months = [];
    let current = null;
    let key = '';
    for (let i = 0; i < totalDays; i++) {
      const d = addDays(timelineStart, i);
      const k = `${d.getFullYear()}-${d.getMonth()}`;
      if (k !== key) {
        key = k;
        current = { label: `${MONTHS_FR[d.getMonth()]} ${d.getFullYear()}`, days: 0 };
        months.push(current);
      }
      current.days++;
    }
    return months;
  }, [timelineStart, totalDays]);

  const todayOffset = diffDays(parseDate(TODAY_STR), timelineStart);

  /* ------------------------ Lignes de planning ------------------------ */
  const filteredPlanning = useMemo(() => {
    const q = search.trim().toLowerCase();
    return planning.filter((e) => {
      if (assigneeFilter !== 'ALL' && e.assignee !== assigneeFilter) return false;
      if (!q) return true;
      return (e.title + ' ' + e.tag + ' ' + e.assignee).toLowerCase().includes(q);
    });
  }, [planning, search, assigneeFilter]);

  const planningRows = useMemo(() => {
    const people = assigneeFilter === 'ALL' ? collaborators : collaborators.filter((c) => c === assigneeFilter);
    return people.map((person) => {
      const entries = filteredPlanning
        .filter((e) => e.assignee === person)
        .map((e) => {
          const startHalf = diffDays(parseDate(e.startDate), timelineStart) * 2 + (e.slot === 'PM' ? 1 : 0);
          const lenHalf = Math.max(1, Math.round(e.duration * 2));
          return { ...e, startHalf, lenHalf };
        })
        .sort((a, b) => a.startHalf - b.startHalf);

      const lanes = [];
      const load = new Map();
      entries.forEach((e) => {
        let lane = lanes.findIndex((freeAt) => freeAt <= e.startHalf);
        if (lane === -1) { lane = lanes.length; lanes.push(e.startHalf + e.lenHalf); }
        else lanes[lane] = e.startHalf + e.lenHalf;
        e.lane = lane;
        for (let h = e.startHalf; h < e.startHalf + e.lenHalf; h++) load.set(h, (load.get(h) || 0) + 1);
      });

      const laneCount = Math.max(1, lanes.length);
      const workload = entries.reduce((sum, e) => sum + e.lenHalf, 0) / 2;
      return { person, entries, laneCount, load, workload, height: Math.max(66, laneCount * 30 + 22) };
    });
  }, [filteredPlanning, collaborators, assigneeFilter, timelineStart]);

  const dayLoad = useMemo(() => {
    const map = new Map();
    filteredPlanning.forEach((e) => {
      const start = diffDays(parseDate(e.startDate), timelineStart);
      const days = Math.max(1, Math.ceil(e.duration));
      for (let i = 0; i < days; i++) map.set(start + i, (map.get(start + i) || 0) + 1);
    });
    return map;
  }, [filteredPlanning, timelineStart]);

  /* ------------------------------- Kanban ------------------------------- */
  const kanbanTasks = useMemo(() => {
    const q = search.trim().toLowerCase();
    return allTasks.filter((t) => {
      if (assigneeFilter !== 'ALL' && t.assignee !== assigneeFilter) return false;
      if (!q) return true;
      return (t.title + ' ' + t.assignee + ' ' + t.project.title).toLowerCase().includes(q);
    });
  }, [allTasks, search, assigneeFilter]);

  const [draggingTaskId, setDraggingTaskId] = useState(null);
  const [dragOverColumn, setDragOverColumn] = useState(null);

  const handleKanbanDragStart = (e, taskId) => {
    try { e.dataTransfer.setData('text/plain', taskId); e.dataTransfer.effectAllowed = 'move'; } catch (err) { /* no-op */ }
    window.setTimeout(() => setDraggingTaskId(taskId), 0);
  };
  const handleKanbanDragOver = (e, colId) => {
    e.preventDefault();
    try { e.dataTransfer.dropEffect = 'move'; } catch (err) { /* no-op */ }
    if (dragOverColumn !== colId) setDragOverColumn(colId);
  };
  const handleKanbanDragEnd = () => { setDraggingTaskId(null); setDragOverColumn(null); };
  const handleKanbanDrop = (e, status) => {
    e.preventDefault();
    let taskId = '';
    try { taskId = e.dataTransfer.getData('text/plain'); } catch (err) { taskId = draggingTaskId || ''; }
    if (!taskId) taskId = draggingTaskId || '';
    if (taskId) setTaskStatus(taskId, status);
    handleKanbanDragEnd();
  };

  /* --------------------------- Actions métier --------------------------- */
  const setTaskStatus = useCallback((taskId, status) => {
    let targetProjectId = null;
    const next = commit((prev) => ({
      ...prev,
      projects: prev.projects.map((p) => {
        if (!p.tasks.some((t) => t.id === taskId)) return p;
        targetProjectId = p.id;
        return { ...p, tasks: p.tasks.map((t) => (t.id === taskId ? { ...t, status } : t)) };
      })
    }));
    if (status === 'DONE' && targetProjectId) {
      const fresh = next.projects.find((p) => p.id === targetProjectId);
      if (fresh && fresh.tasks.length > 0 && fresh.tasks.every((t) => t.status === 'DONE')) {
        triggerConfetti();
        pushToast(`Projet « ${fresh.title} » terminé à 100 %`, 'success');
      }
    }
  }, [commit, pushToast]);

  const saveProject = (form) => {
    if (!form.title.trim()) { pushToast('Donnez un nom au projet', 'error'); return; }
    if (form.id) {
      commit((prev) => ({ ...prev, projects: prev.projects.map((p) => (p.id === form.id ? { ...p, ...form, duration: Number(form.duration) } : p)) }), 'Projet mis à jour');
    } else {
      const created = normalizeProject({ ...form, id: uid('proj'), tasks: [] });
      commit((prev) => ({ ...prev, projects: [...prev.projects, created] }), 'Projet créé');
      setSelectedProjectId(created.id);
    }
    setProjectForm(null); setEditingProject(null);
  };

  const deleteProject = (projectId) => {
    const p = projects.find((x) => x.id === projectId);
    if (!p) return;
    if (!window.confirm(`Supprimer « ${p.title} » et ses ${p.tasks.length} tâche(s) ? Vous pourrez annuler avec Ctrl+Z.`)) return;
    commit((prev) => ({ ...prev, projects: prev.projects.filter((x) => x.id !== projectId) }), 'Projet supprimé');
  };

  const saveTask = (form) => {
    if (!form.title.trim()) { pushToast('Donnez un titre à la tâche', 'error'); return; }
    const projectId = form.projectId || (projects[0] && projects[0].id);
    if (!projectId) { pushToast('Créez d’abord un projet', 'error'); return; }
    if (form.id) {
      commit((prev) => ({
        ...prev,
        projects: prev.projects.map((p) => ({ ...p, tasks: p.tasks.map((t) => (t.id === form.id ? { ...t, ...form } : t)) }))
      }), 'Tâche mise à jour');
    } else {
      const task = normalizeTask({ ...form, id: uid('t') });
      commit((prev) => ({ ...prev, projects: prev.projects.map((p) => (p.id === projectId ? { ...p, tasks: [...p.tasks, task] } : p)) }), 'Tâche créée');
    }
    setTaskForm(null); setEditingTask(null);
  };

  const deleteTask = (taskId) => {
    commit((prev) => ({ ...prev, projects: prev.projects.map((p) => ({ ...p, tasks: p.tasks.filter((t) => t.id !== taskId) })) }), 'Tâche supprimée');
    setEditingTask(null);
  };

  const saveEntry = (form) => {
    if (!form.title.trim()) { pushToast('Donnez un titre à l’entrée', 'error'); return; }
    if (form.id) {
      commit((prev) => ({ ...prev, planning: prev.planning.map((e) => (e.id === form.id ? normalizeEntry({ ...e, ...form }) : e)) }), 'Entrée mise à jour');
    } else {
      commit((prev) => ({ ...prev, planning: [...prev.planning, normalizeEntry({ ...form, id: uid('pe') })] }), 'Entrée planifiée');
    }
    setEntryForm(null); setEditingEntry(null);
  };

  const deleteEntry = (entryId) => {
    commit((prev) => ({ ...prev, planning: prev.planning.filter((e) => e.id !== entryId) }), 'Entrée supprimée');
    setEditingEntry(null);
  };

  const duplicateEntry = (entry) => {
    const copy = normalizeEntry({ ...entry, id: uid('pe'), startDate: formatDateIso(addDays(parseDate(entry.startDate), 1)) });
    commit((prev) => ({ ...prev, planning: [...prev.planning, copy] }), 'Entrée dupliquée (J+1)');
    setEditingEntry(null);
  };

  const openSplit = (entry) => {
    setEditingEntry(null);
    setSplitEntry(entry);
    if (entry.duration > 1) {
      const half = Math.max(0.5, Math.round(entry.duration / 2 * 2) / 2 - 0);
      const first = Math.min(entry.duration - 0.5, half);
      setSplitSegments([first, Number((entry.duration - first).toFixed(1))]);
    } else {
      setSplitSegments([0.5, 0.5]);
    }
  };

  const applySplit = (e) => {
    e.preventDefault();
    if (!splitEntry) return;
    const sum = splitSegments.reduce((a, b) => a + Number(b), 0);
    if (Math.abs(sum - splitEntry.duration) > 0.001) {
      pushToast(`La somme des tranches (${sum} j) doit égaler ${splitEntry.duration} j`, 'error');
      return;
    }
    let date = parseDate(splitEntry.startDate);
    let slot = splitEntry.slot;
    const parts = splitSegments.map((seg, idx) => {
      const part = normalizeEntry({
        ...splitEntry,
        id: uid('pe'),
        title: `${splitEntry.title} · ${idx + 1}/${splitSegments.length}`,
        startDate: formatDateIso(date),
        slot,
        duration: Number(seg)
      });
      let halves = Math.round(Number(seg) * 2);
      while (halves > 0) {
        if (slot === 'AM') slot = 'PM';
        else { slot = 'AM'; date = addDays(date, 1); }
        halves--;
      }
      return part;
    });
    commit((prev) => ({ ...prev, planning: prev.planning.filter((x) => x.id !== splitEntry.id).concat(parts) }), `Entrée scindée en ${parts.length} tranches`);
    setSplitEntry(null);
  };

  const openEntryCreator = (person, dayIndex, slot) => {
    setEntryForm({
      id: null, title: '', tag: 'Général', color: DEFAULT_COLOR,
      assignee: person, startDate: formatDateIso(addDays(timelineStart, dayIndex)), slot, duration: 0.5, notes: ''
    });
  };

  /* --------------------------- Zoom & cadrage --------------------------- */
  const nameColWidth = activeTab === 'planning' ? 240 : (isLeftPanelOpen ? 288 : 44);
  const nameColRef = useRef(nameColWidth);
  useEffect(() => { nameColRef.current = nameColWidth; }, [nameColWidth]);

  const fitAll = useCallback(() => {
    const vp = document.getElementById('timeline-viewport');
    if (!vp) return;
    const available = vp.clientWidth - nameColRef.current - 24;
    setColumnWidth(clamp(Math.floor(available / Math.max(1, totalDays)), 26, 240));
    vp.scrollLeft = 0;
  }, [totalDays]);

  const focusSprint = useCallback(() => {
    const vp = document.getElementById('timeline-viewport');
    if (!vp) return;
    const available = vp.clientWidth - nameColRef.current - 24;
    const width = clamp(Math.floor(available / 14), 48, 240);
    setColumnWidth(width);
    const offset = diffDays(getMonday(new Date()), timelineStart);
    window.requestAnimationFrame(() => { vp.scrollLeft = Math.max(0, offset * width); });
  }, [timelineStart]);

  const scrollToToday = useCallback(() => {
    const vp = document.getElementById('timeline-viewport');
    if (!vp) return;
    const target = todayOffset * columnWidth - (vp.clientWidth - nameColRef.current) / 3;
    vp.scrollTo({ left: Math.max(0, target), behavior: 'smooth' });
  }, [todayOffset, columnWidth]);

  useEffect(() => {
    if (activeTab !== 'planning') return;
    const id = window.setTimeout(focusSprint, 60);
    return () => window.clearTimeout(id);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [activeTab]);

  /* ------------------------- Glisser-déposer barres ------------------------- */
  const [drag, setDrag] = useState(null);
  const dragRef = useRef(null);
  const movedRef = useRef(false);
  const rafRef = useRef(null);
  const colWidthRef = useRef(columnWidth);
  useEffect(() => { colWidthRef.current = columnWidth; }, [columnWidth]);

  const updateDrag = useCallback((next) => { dragRef.current = next; setDrag(next); }, []);

  const startDrag = (e, payload) => {
    if (e.button !== 0) return;
    e.stopPropagation();
    e.preventDefault();
    movedRef.current = false;
    updateDrag({ ...payload, startX: e.clientX, deltaX: 0, snapStart: payload.startUnits, snapLen: payload.lenUnits });
  };

  useEffect(() => {
    const onMove = (event) => {
      const d = dragRef.current;
      if (!d) return;
      const dx = event.clientX - d.startX;
      if (Math.abs(dx) > 3) movedRef.current = true;
      if (rafRef.current) window.cancelAnimationFrame(rafRef.current);
      rafRef.current = window.requestAnimationFrame(() => {
        const cur = dragRef.current;
        if (!cur) return;
        const unitPx = colWidthRef.current * cur.unit;    // unit = 1 (jour) ou 0.5 (demi-journée)
        const steps = Math.round(dx / unitPx);
        let snapStart = cur.startUnits;
        let snapLen = cur.lenUnits;
        if (cur.action === 'move') {
          snapStart = Math.max(0, cur.startUnits + steps);
        } else if (cur.action === 'resize-right') {
          snapLen = Math.max(1, cur.lenUnits + steps);
        } else if (cur.action === 'resize-left') {
          const shift = Math.min(steps, cur.lenUnits - 1);
          snapStart = Math.max(0, cur.startUnits + shift);
          snapLen = cur.lenUnits - (snapStart - cur.startUnits);
        }
        updateDrag({ ...cur, deltaX: dx, snapStart, snapLen });
      });
    };

    const onUp = () => {
      const d = dragRef.current;
      if (rafRef.current) window.cancelAnimationFrame(rafRef.current);
      updateDrag(null);
      if (!d || !movedRef.current) return;
      if (d.snapStart === d.startUnits && d.snapLen === d.lenUnits) return;

      if (d.kind === 'entry') {
        const dayIndex = Math.floor(d.snapStart / 2);
        const slot = d.snapStart % 2 === 1 ? 'PM' : 'AM';
        const startDate = formatDateIso(addDays(timelineStart, dayIndex));
        const duration = d.snapLen / 2;
        commit((prev) => ({ ...prev, planning: prev.planning.map((e) => (e.id === d.id ? { ...e, startDate, slot, duration } : e)) }));
      } else if (d.kind === 'project') {
        const startDate = formatDateIso(addDays(timelineStart, d.snapStart));
        commit((prev) => ({ ...prev, projects: prev.projects.map((p) => (p.id === d.id ? { ...p, startDate, duration: d.snapLen } : p)) }));
      } else if (d.kind === 'task') {
        const startDate = formatDateIso(addDays(timelineStart, d.snapStart));
        commit((prev) => ({ ...prev, projects: prev.projects.map((p) => ({ ...p, tasks: p.tasks.map((t) => (t.id === d.id ? { ...t, startDate, duration: d.snapLen } : t)) })) }));
      }
    };

    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    return () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      if (rafRef.current) window.cancelAnimationFrame(rafRef.current);
    };
  }, [commit, timelineStart, updateDrag]);

  /* ---------------------------- Raccourcis clavier ---------------------------- */
  useEffect(() => {
    const onKey = (e) => {
      const tag = (e.target && e.target.tagName) || '';
      const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(tag) || (e.target && e.target.isContentEditable);
      if (e.key === 'Escape') { closeAllModals(); return; }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
      if (typing || anyModalOpen) return;
      if (e.key === '1') setActiveTab('roadmap');
      if (e.key === '2') setActiveTab('kanban');
      if (e.key === '3') setActiveTab('planning');
      if (e.key.toLowerCase() === 't') scrollToToday();
      if (e.key.toLowerCase() === 'f') fitAll();
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [undo, closeAllModals, anyModalOpen, scrollToToday, fitAll]);

  /* ------------------------------ Import / export ------------------------------ */
  const fileInputRef = useRef(null);

  const exportJson = () => {
    try {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `auraplan-${TODAY_STR}.json`;
      a.click();
      window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      pushToast('Sauvegarde exportée', 'success');
    } catch (err) { pushToast('Export impossible dans ce navigateur', 'error'); }
  };

  const importJson = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result));
        commit(normalizeData(parsed), 'Données importées');
      } catch (err) { pushToast('Fichier illisible : JSON invalide', 'error'); }
    };
    reader.onerror = () => pushToast('Lecture du fichier impossible', 'error');
    reader.readAsText(file);
  };

  /* -------------------------------- GitHub -------------------------------- */
  const [gh, setGh] = useState(() => {
    const stored = loadJson(GH_KEY, {});
    return { owner: stored.owner || '', repo: stored.repo || '', branch: stored.branch || 'main', path: stored.path || 'auraplan-data.json', token: stored.token || '' };
  });
  const [ghStatus, setGhStatus] = useState('');
  useEffect(() => { saveJson(GH_KEY, gh); }, [gh]);

  const ghUrl = () => `https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/${gh.path}`;
  const ghHeaders = () => ({ Authorization: `Bearer ${gh.token}`, Accept: 'application/vnd.github+json' });

  const ghPush = async () => {
    if (!gh.owner || !gh.repo || !gh.token) { setGhStatus('Renseignez le propriétaire, le dépôt et le jeton.'); return; }
    setGhStatus('Envoi en cours…');
    try {
      let sha = null;
      const head = await fetch(`${ghUrl()}?ref=${encodeURIComponent(gh.branch)}`, { headers: ghHeaders() });
      if (head.ok) { const json = await head.json(); sha = json.sha; }
      const res = await fetch(ghUrl(), {
        method: 'PUT',
        headers: { ...ghHeaders(), 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: `AuraPlan — mise à jour ${new Date().toLocaleString('fr-FR')}`,
          content: b64encode(JSON.stringify(data, null, 2)),
          branch: gh.branch,
          ...(sha ? { sha } : {})
        })
      });
      if (!res.ok) throw new Error(`GitHub a répondu ${res.status}`);
      setGhStatus('Enregistré sur GitHub.');
      pushToast('Données envoyées sur GitHub', 'success');
    } catch (err) {
      setGhStatus(`Échec de l'envoi : ${err.message}`);
    }
  };

  const ghPull = async () => {
    if (!gh.owner || !gh.repo) { setGhStatus('Renseignez au moins le propriétaire et le dépôt.'); return; }
    setGhStatus('Récupération en cours…');
    try {
      const res = await fetch(`${ghUrl()}?ref=${encodeURIComponent(gh.branch)}`, { headers: gh.token ? ghHeaders() : { Accept: 'application/vnd.github+json' } });
      if (!res.ok) throw new Error(`GitHub a répondu ${res.status}`);
      const json = await res.json();
      const text = b64decode(json.content || '');
      const parsed = JSON.parse(text);
      commit(normalizeData(parsed), 'Données récupérées depuis GitHub');
      setGhStatus('Données chargées depuis GitHub.');
    } catch (err) {
      setGhStatus(`Échec de la récupération : ${err.message}`);
    }
  };

  /* --------------------------------- Rendu --------------------------------- */
  const timelineWidth = totalDays * columnWidth;

  const DayHeader = ({ withHalves }) => (
    <div className="flex" style={{ width: `${timelineWidth}px` }}>
      {Array.from({ length: totalDays }).map((_, i) => {
        const d = addDays(timelineStart, i);
        const iso = formatDateIso(d);
        const isToday = iso === TODAY_STR;
        const isWeekend = d.getDay() === 0 || d.getDay() === 6;
        const isMonday = d.getDay() === 1;
        const count = dayLoad.get(i) || 0;
        return (
          <div key={i} style={{ width: `${columnWidth}px`, minWidth: `${columnWidth}px` }}
            className={`flex h-full flex-col justify-between border-r ${T.grid} ${isMonday ? 'border-l-2 border-l-indigo-500/40' : ''}
              ${isToday ? 'bg-indigo-500/15 text-indigo-300' : isWeekend ? (isDark ? 'bg-white/[0.02] text-slate-500' : 'bg-slate-100 text-slate-400') : T.muted}`}>
            <div className="flex items-center justify-between px-1.5 pt-1">
              <span className="flex items-baseline gap-1">
                <span className="text-[9px] font-bold uppercase">{d.toLocaleDateString('fr-FR', { weekday: 'short' }).slice(0, 2)}</span>
                <span className={`text-[11px] font-extrabold ${isToday ? 'text-indigo-300' : ''}`}>{d.getDate()}</span>
              </span>
              {withHalves && count > 0 && columnWidth >= 62 ? (
                <span className="rounded-full bg-indigo-600 px-1.5 text-[8px] font-extrabold text-white">{count}</span>
              ) : null}
            </div>
            {withHalves ? (
              <div className={`mt-1 flex border-t ${T.grid} text-[8px] font-bold`}>
                <div className={`w-1/2 border-r ${T.grid} py-0.5 text-center text-amber-400`}>{columnWidth >= 56 ? '☀ AM' : '☀'}</div>
                <div className="w-1/2 py-0.5 text-center text-indigo-300">{columnWidth >= 56 ? '☾ PM' : '☾'}</div>
              </div>
            ) : <div className="h-1" />}
          </div>
        );
      })}
    </div>
  );

  const GridBackground = ({ halves, rowKey }) => (
    <div className="pointer-events-none absolute inset-0 flex">
      {Array.from({ length: totalDays }).map((_, i) => {
        const d = addDays(timelineStart, i);
        const isToday = formatDateIso(d) === TODAY_STR;
        const isWeekend = d.getDay() === 0 || d.getDay() === 6;
        return (
          <div key={rowKey + '-' + i} style={{ width: `${columnWidth}px`, minWidth: `${columnWidth}px` }}
            className={`h-full border-r ${T.grid} ${d.getDay() === 1 ? 'border-l-2 border-l-indigo-500/25' : ''}
              ${isToday ? 'bg-indigo-500/10' : isWeekend ? (isDark ? 'bg-white/[0.02]' : 'bg-slate-100/70') : ''}`}>
            {halves ? <div className={`h-full w-1/2 border-r ${T.grid}`} /> : null}
          </div>
        );
      })}
    </div>
  );

  return (
    <div className={`flex h-screen flex-col overflow-hidden ${T.app} ${drag ? 'is-dragging' : ''}`}>

      {/* ------------------------------- En-tête ------------------------------- */}
      <header className={`flex shrink-0 flex-wrap items-center justify-between gap-3 border-b px-4 py-2.5 ${T.head} ${T.border}`}>
        <div className="flex items-center gap-5">
          <div className="flex items-center gap-2.5">
            <div className="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 to-fuchsia-600 text-lg font-black text-white shadow-lg shadow-indigo-900/40">Δ</div>
            <div className="leading-tight">
              <div className="text-sm font-extrabold tracking-tight">AuraPlan Studio</div>
              <div className={`text-[10px] font-medium ${T.muted}`}>Roadmap · Kanban · Planning demi-journée</div>
            </div>
          </div>

          <nav className={`flex rounded-xl border p-1 ${T.sub} ${T.border}`}>
            {[
              { id: 'roadmap', label: 'Roadmap', key: '1' },
              { id: 'kanban', label: 'Kanban', key: '2' },
              { id: 'planning', label: 'Planning', key: '3' }
            ].map((tab) => (
              <button key={tab.id} type="button" onClick={() => setActiveTab(tab.id)}
                className={`rounded-lg px-3.5 py-1.5 text-xs font-bold transition ${activeTab === tab.id ? 'bg-indigo-600 text-white shadow' : `${T.muted} hover:text-indigo-400`}`}>
                {tab.label}<span className="ml-1.5 hidden font-mono text-[9px] opacity-50 sm:inline">{tab.key}</span>
              </button>
            ))}
          </nav>
        </div>

        <div className="flex items-center gap-2">
          <input type="search" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Rechercher…"
            className={`hidden w-44 rounded-xl border px-3 py-2 text-xs outline-none focus:border-indigo-500 md:block ${T.input}`} />
          <select value={assigneeFilter} onChange={(e) => setAssigneeFilter(e.target.value)}
            className={`hidden rounded-xl border px-2 py-2 text-xs font-semibold outline-none focus:border-indigo-500 lg:block ${T.input}`}>
            <option value="ALL">Toute l'équipe</option>
            {collaborators.map((c) => <option key={c} value={c}>{c}</option>)}
          </select>
          <button type="button" onClick={() => setIsDark(!isDark)} className={btnGhost} title="Changer de thème">{isDark ? '☀' : '☾'}</button>
          <button type="button" onClick={() => setIsHelpOpen(true)} className={btnGhost} title="Raccourcis et aide">?</button>
          <button type="button" onClick={() => setIsConfigOpen(true)} className={btnGhost}>Synchroniser</button>
          <button type="button" className={btnPrimary}
            onClick={() => {
              if (activeTab === 'planning') openEntryCreator(collaborators[0] || 'Non assigné', Math.max(0, todayOffset), 'AM');
              else setProjectForm({ id: null, title: '', category: 'Général', startDate: TODAY_STR, duration: 10, color: DEFAULT_COLOR });
            }}>
            {activeTab === 'planning' ? 'Planifier' : 'Nouveau projet'}
          </button>
        </div>
      </header>

      {/* ------------------------------ Barre d'outils ------------------------------ */}
      <div className={`flex shrink-0 flex-wrap items-center justify-between gap-3 border-b px-4 py-2 text-xs ${T.sub} ${T.border}`}>
        <div className="flex flex-wrap items-center gap-2">
          {activeTab === 'roadmap' ? (
            <>
              <button type="button" onClick={() => setIsLeftPanelOpen(!isLeftPanelOpen)} className={btnGhost}>{isLeftPanelOpen ? 'Réduire les projets' : 'Afficher les projets'}</button>
              <button type="button" onClick={() => setIsRightPanelOpen(!isRightPanelOpen)} className={btnGhost}>{isRightPanelOpen ? 'Masquer le détail' : 'Afficher le détail'}</button>
              <button type="button" onClick={() => setExpanded(projects.reduce((acc, p) => ({ ...acc, [p.id]: true }), {}))} className={btnGhost}>Déplier tout</button>
              <button type="button" onClick={() => setExpanded({})} className={btnGhost}>Replier tout</button>
            </>
          ) : null}
          {activeTab === 'planning' ? (
            <>
              <button type="button" onClick={focusSprint} className={btnPrimary}>Sprint 2 semaines</button>
              <button type="button" onClick={scrollToToday} className={btnGhost}>Aujourd'hui</button>
              <span className={`ml-1 hidden text-[11px] xl:inline ${T.muted}`}>Cliquez une demi-case pour planifier · glissez pour déplacer au 0,5 j</span>
            </>
          ) : null}
          {activeTab === 'kanban' ? (
            <button type="button" className={btnPrimary}
              onClick={() => setTaskForm({ id: null, projectId: selectedProjectId || (projects[0] && projects[0].id) || '', title: '', assignee: collaborators[0] || 'Non assigné', startDate: TODAY_STR, duration: 2, status: 'TODO', priority: 'MEDIUM', notes: '' })}>
              Nouvelle tâche
            </button>
          ) : null}
        </div>

        <div className="flex items-center gap-3">
          <button type="button" onClick={undo} className={btnGhost} title="Ctrl+Z">Annuler</button>
          {activeTab !== 'kanban' ? (
            <>
              <span className={`font-semibold ${T.muted}`}>Zoom</span>
              <input type="range" min="26" max="240" value={columnWidth} onChange={(e) => setColumnWidth(Number(e.target.value))} className="w-28" aria-label="Zoom de la timeline" />
              <button type="button" onClick={fitAll} className={btnGhost}>Tout afficher</button>
            </>
          ) : null}
        </div>
      </div>

      {/* ------------------------------- Contenu ------------------------------- */}
      <main className="relative flex flex-1 overflow-hidden">

        {/* ============================= ROADMAP ============================= */}
        {activeTab === 'roadmap' ? (
          <>
            <div id="timeline-viewport" className={`flex-1 overflow-auto ${isDark ? 'bg-[#070B12]' : 'bg-slate-50'}`}>
              <div style={{ width: `${timelineWidth + nameColWidth}px`, minWidth: '100%' }}>

                {/* En-tête mois */}
                <div className={`sticky top-0 z-30 flex h-7 border-b ${T.head} ${T.border}`}>
                  <div style={{ width: `${nameColWidth}px` }} className={`sticky left-0 z-40 flex items-center border-r px-3 text-[10px] font-bold uppercase tracking-wide ${T.head} ${T.border} ${T.muted}`}>
                    {isLeftPanelOpen ? `Projets (${projects.length})` : '—'}
                  </div>
                  <div className="flex">
                    {timelineMonths.map((m, i) => (
                      <div key={i} style={{ width: `${m.days * columnWidth}px` }}
                        className={`flex h-full items-center justify-center border-r text-[10px] font-extrabold uppercase tracking-wider ${T.grid} ${T.muted}`}>
                        {m.days * columnWidth > 90 ? m.label : m.label.slice(0, 3)}
                      </div>
                    ))}
                  </div>
                </div>

                {/* En-tête jours */}
                <div className={`sticky top-7 z-30 flex h-11 border-b ${T.head} ${T.border}`}>
                  <div style={{ width: `${nameColWidth}px` }} className={`sticky left-0 z-40 flex items-center justify-between border-r px-3 text-[11px] font-bold ${T.head} ${T.border}`}>
                    {isLeftPanelOpen ? (
                      <>
                        <span>Avancement</span>
                        <button type="button" onClick={() => setIsLeftPanelOpen(false)} className={`text-[10px] ${T.muted}`}>◀</button>
                      </>
                    ) : (
                      <button type="button" onClick={() => setIsLeftPanelOpen(true)} className="text-[10px] font-bold text-indigo-400">▶</button>
                    )}
                  </div>
                  <DayHeader withHalves={false} />
                </div>

                {/* Lignes */}
                <div className="relative">
                  {projects.length === 0 ? (
                    <div className={`px-8 py-16 text-center text-sm ${T.muted}`}>
                      Aucun projet pour l'instant. Créez-en un pour dessiner votre première roadmap.
                    </div>
                  ) : null}

                  {projects.map((proj) => {
                    const pct = projectProgress(proj);
                    const health = projectHealth(proj);
                    const isOpen = !!expanded[proj.id];
                    const isSelected = proj.id === selectedProjectId;
                    const dragging = drag && drag.kind === 'project' && drag.id === proj.id;
                    const startUnits = diffDays(parseDate(proj.startDate), timelineStart);
                    let left = startUnits * columnWidth;
                    let width = proj.duration * columnWidth;
                    if (dragging) {
                      if (drag.action === 'move') left += drag.deltaX;
                      else if (drag.action === 'resize-left') { left += drag.deltaX; width -= drag.deltaX; }
                      else width += drag.deltaX;
                    }

                    return (
                      <React.Fragment key={proj.id}>
                        <div className={`flex h-14 border-b ${T.border} ${isSelected ? 'bg-indigo-500/[0.06]' : ''}`}>
                          <div style={{ width: `${nameColWidth}px` }}
                            className={`sticky left-0 z-20 flex items-center gap-2 border-r px-3 ${T.panel} ${isSelected ? 'shadow-[inset_3px_0_0_0_#6366F1]' : ''}`}>
                            {isLeftPanelOpen ? (
                              <>
                                <button type="button" onClick={() => setExpanded({ ...expanded, [proj.id]: !isOpen })}
                                  className={`w-4 shrink-0 text-[10px] ${T.muted}`} aria-label="Déplier le projet">{isOpen ? '▾' : '▸'}</button>
                                <button type="button" onClick={() => setSelectedProjectId(proj.id)} className="min-w-0 flex-1 text-left">
                                  <div className="flex items-center gap-2">
                                    <span className={`h-2.5 w-2.5 shrink-0 rounded-full bg-gradient-to-r ${proj.color}`} />
                                    <span className="truncate text-xs font-bold">{proj.title}</span>
                                  </div>
                                  <div className={`mt-0.5 truncate text-[10px] ${T.muted}`}>{proj.category} · {proj.tasks.length} tâche(s)</div>
                                </button>
                                <span className={`font-mono text-[11px] font-extrabold ${pct === 100 ? 'text-emerald-400' : 'text-indigo-400'}`}>{pct}%</span>
                              </>
                            ) : (
                              <span className={`h-2.5 w-2.5 rounded-full bg-gradient-to-r ${proj.color}`} />
                            )}
                          </div>

                          <div className="relative flex-1" style={{ width: `${timelineWidth}px` }}>
                            <GridBackground halves={false} rowKey={proj.id} />
                            {dragging ? (
                              <div style={{ left: `${drag.snapStart * columnWidth}px`, width: `${drag.snapLen * columnWidth}px` }}
                                className="absolute top-3 h-8 rounded-lg border-2 border-dashed border-indigo-400 bg-indigo-500/10" />
                            ) : null}
                            <div style={{ left: `${left}px`, width: `${Math.max(columnWidth * 0.6, width)}px` }}
                              onMouseDown={(e) => startDrag(e, { kind: 'project', id: proj.id, action: 'move', unit: 1, startUnits, lenUnits: proj.duration })}
                              onClick={() => { if (!movedRef.current) { setSelectedProjectId(proj.id); setIsRightPanelOpen(true); } }}
                              className={`group absolute top-3 flex h-8 cursor-grab items-center overflow-hidden rounded-lg border border-white/15 bg-slate-950/90 shadow-lg active:cursor-grabbing ${dragging ? 'z-[15] ring-2 ring-indigo-400' : 'z-10'}`}>
                              <div className={`absolute inset-y-0 left-0 bg-gradient-to-r ${proj.color}`} style={{ width: `${pct}%` }} />
                              <div onMouseDown={(e) => startDrag(e, { kind: 'project', id: proj.id, action: 'resize-left', unit: 1, startUnits, lenUnits: proj.duration })}
                                className="absolute inset-y-0 left-0 z-20 w-2.5 cursor-ew-resize bg-white/40 opacity-0 group-hover:opacity-100" />
                              <div className="pointer-events-none relative flex w-full items-center justify-between gap-2 px-2.5">
                                <span className="truncate text-[11px] font-extrabold text-white drop-shadow">{proj.title}</span>
                                <span className="shrink-0 rounded bg-black/50 px-1.5 py-0.5 font-mono text-[10px] font-bold text-white">{pct}%</span>
                              </div>
                              <div onMouseDown={(e) => startDrag(e, { kind: 'project', id: proj.id, action: 'resize-right', unit: 1, startUnits, lenUnits: proj.duration })}
                                className="absolute inset-y-0 right-0 z-20 w-2.5 cursor-ew-resize bg-white/40 opacity-0 group-hover:opacity-100" />
                            </div>
                            {dragging ? (
                              <div className="pointer-events-none absolute -top-1 z-[15] rounded-lg border border-indigo-500 bg-slate-900 px-2 py-1 font-mono text-[10px] text-slate-100 shadow-xl"
                                style={{ left: `${drag.snapStart * columnWidth}px` }}>
                                {formatDateFr(formatDateIso(addDays(timelineStart, drag.snapStart)))} · {drag.snapLen} j
                              </div>
                            ) : null}
                            <div className={`pointer-events-none absolute right-2 top-1 text-[10px] font-semibold ${health.tone === 'danger' ? 'text-rose-400' : health.tone === 'success' ? 'text-emerald-400' : T.muted}`} />
                          </div>
                        </div>

                        {isOpen ? proj.tasks.map((task) => {
                          const tDragging = drag && drag.kind === 'task' && drag.id === task.id;
                          const tStart = diffDays(parseDate(task.startDate), timelineStart);
                          let tLeft = tStart * columnWidth;
                          let tWidth = task.duration * columnWidth;
                          if (tDragging) {
                            if (drag.action === 'move') tLeft += drag.deltaX;
                            else if (drag.action === 'resize-left') { tLeft += drag.deltaX; tWidth -= drag.deltaX; }
                            else tWidth += drag.deltaX;
                          }
                          return (
                            <div key={task.id} className={`flex h-9 border-b ${T.border}`}>
                              <div style={{ width: `${nameColWidth}px` }} className={`sticky left-0 z-20 flex items-center gap-2 border-r pl-8 pr-3 ${T.sub}`}>
                                {isLeftPanelOpen ? (
                                  <>
                                    <input type="checkbox" checked={task.status === 'DONE'} onChange={(e) => setTaskStatus(task.id, e.target.checked ? 'DONE' : 'IN_PROGRESS')}
                                      className="h-3.5 w-3.5 rounded accent-emerald-500" aria-label={`Terminer ${task.title}`} />
                                    <button type="button" onClick={() => setEditingTask({ ...task, projectId: proj.id })}
                                      className={`min-w-0 flex-1 truncate text-left text-[11px] ${task.status === 'DONE' ? 'text-slate-500 line-through' : 'font-semibold'}`}>
                                      {task.title}
                                    </button>
                                    <Avatar name={task.assignee} size="sm" />
                                  </>
                                ) : null}
                              </div>
                              <div className="relative flex-1" style={{ width: `${timelineWidth}px` }}>
                                <GridBackground halves={false} rowKey={task.id} />
                                {tDragging ? (
                                  <div style={{ left: `${drag.snapStart * columnWidth}px`, width: `${drag.snapLen * columnWidth}px` }}
                                    className="absolute top-2 h-5 rounded border-2 border-dashed border-indigo-400 bg-indigo-500/10" />
                                ) : null}
                                <div style={{ left: `${tLeft}px`, width: `${Math.max(columnWidth * 0.5, tWidth)}px` }}
                                  onMouseDown={(e) => startDrag(e, { kind: 'task', id: task.id, action: 'move', unit: 1, startUnits: tStart, lenUnits: task.duration })}
                                  onClick={() => { if (!movedRef.current) setEditingTask({ ...task, projectId: proj.id }); }}
                                  className={`group absolute top-2 flex h-5 cursor-grab items-center rounded border border-white/20 bg-gradient-to-r ${proj.color} px-2 text-[10px] font-bold text-white shadow active:cursor-grabbing ${task.status === 'DONE' ? 'opacity-50' : ''}`}>
                                  <div onMouseDown={(e) => startDrag(e, { kind: 'task', id: task.id, action: 'resize-left', unit: 1, startUnits: tStart, lenUnits: task.duration })}
                                    className="absolute inset-y-0 left-0 w-2 cursor-ew-resize bg-white/40 opacity-0 group-hover:opacity-100" />
                                  <span className="pointer-events-none truncate">{task.title}</span>
                                  <div onMouseDown={(e) => startDrag(e, { kind: 'task', id: task.id, action: 'resize-right', unit: 1, startUnits: tStart, lenUnits: task.duration })}
                                    className="absolute inset-y-0 right-0 w-2 cursor-ew-resize bg-white/40 opacity-0 group-hover:opacity-100" />
                                </div>
                              </div>
                            </div>
                          );
                        }) : null}
                      </React.Fragment>
                    );
                  })}
                </div>
              </div>
            </div>

            {/* Panneau détail */}
            {isRightPanelOpen ? (
              <aside className={`hidden w-80 shrink-0 overflow-y-auto border-l p-4 lg:block ${T.panel}`}>
                {selectedProject ? (
                  <div className="space-y-4">
                    <div className={`rounded-2xl border p-4 ${T.border} ${T.sub}`}>
                      <div className="mb-2 flex items-center justify-between">
                        <span className="rounded-full border border-indigo-500/30 bg-indigo-500/10 px-2.5 py-1 text-[10px] font-bold text-indigo-300">{selectedProject.category}</span>
                        <button type="button" onClick={() => setIsRightPanelOpen(false)} className={`text-xs ${T.muted}`}>✕</button>
                      </div>
                      <h2 className="text-sm font-extrabold leading-snug">{selectedProject.title}</h2>
                      <div className={`mt-1 text-[11px] ${T.muted}`}>
                        {formatDayShort(selectedProject.startDate)} → {formatDayShort(formatDateIso(addDays(parseDate(selectedProject.startDate), selectedProject.duration)))} · {selectedProject.duration} j
                      </div>
                      <div className="mt-3 h-2 w-full overflow-hidden rounded-full bg-slate-700/40">
                        <div className={`h-full rounded-full bg-gradient-to-r ${selectedProject.color} transition-all`} style={{ width: `${projectProgress(selectedProject)}%` }} />
                      </div>
                      <div className="mt-2 flex items-center justify-between text-[11px]">
                        <span className={`font-bold ${projectProgress(selectedProject) === 100 ? 'text-emerald-400' : 'text-indigo-400'}`}>{projectProgress(selectedProject)} % terminé</span>
                        {(() => {
                          const h = projectHealth(selectedProject);
                          return <span className={`font-semibold ${h.tone === 'danger' ? 'text-rose-400' : h.tone === 'success' ? 'text-emerald-400' : T.muted}`}>{h.label}</span>;
                        })()}
                      </div>
                      {projectProgress(selectedProject) === 100 ? (
                        <div className="mt-3 rounded-xl border border-emerald-500/40 bg-emerald-500/10 px-3 py-2 text-center text-[11px] font-bold text-emerald-300">
                          Toutes les tâches sont terminées
                        </div>
                      ) : null}
                    </div>

                    <div className={`rounded-2xl border ${T.border} ${T.sub}`}>
                      <div className={`flex items-center justify-between border-b px-4 py-3 ${T.border}`}>
                        <h3 className="text-[11px] font-extrabold uppercase tracking-wide">Tâches</h3>
                        <button type="button" className="text-[11px] font-bold text-indigo-400"
                          onClick={() => setTaskForm({ id: null, projectId: selectedProject.id, title: '', assignee: collaborators[0] || 'Non assigné', startDate: selectedProject.startDate, duration: 2, status: 'TODO', priority: 'MEDIUM', notes: '' })}>
                          + Ajouter
                        </button>
                      </div>
                      <div className="space-y-1.5 p-3">
                        {selectedProject.tasks.length === 0 ? <p className={`px-1 py-2 text-[11px] ${T.muted}`}>Aucune tâche. Ajoutez-en une pour suivre l'avancement.</p> : null}
                        {selectedProject.tasks.map((task) => (
                          <div key={task.id} className={`flex items-center gap-2 rounded-xl border px-2.5 py-2 ${T.border} ${isDark ? 'bg-black/20' : 'bg-white'}`}>
                            <input type="checkbox" checked={task.status === 'DONE'} onChange={(e) => setTaskStatus(task.id, e.target.checked ? 'DONE' : 'IN_PROGRESS')}
                              className="h-4 w-4 shrink-0 rounded accent-emerald-500" aria-label={`Terminer ${task.title}`} />
                            <button type="button" onClick={() => setEditingTask({ ...task, projectId: selectedProject.id })} className="min-w-0 flex-1 text-left">
                              <div className={`truncate text-[11px] ${task.status === 'DONE' ? 'text-slate-500 line-through' : 'font-semibold'}`}>{task.title}</div>
                              <div className={`truncate text-[10px] ${T.muted}`}>{task.assignee} · {formatDayShort(task.startDate)} · {task.duration} j</div>
                            </button>
                            <span className={`shrink-0 rounded border px-1.5 py-0.5 text-[9px] font-bold ${PRIORITY_META[task.priority].cls}`}>{PRIORITY_META[task.priority].icon}</span>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="flex gap-2">
                      <button type="button" className={`flex-1 ${btnGhost}`} onClick={() => setProjectForm({ ...selectedProject })}>Modifier</button>
                      <button type="button" className="flex-1 rounded-xl border border-rose-500/40 bg-rose-500/10 px-3 py-2 text-xs font-bold text-rose-300 hover:bg-rose-500/20"
                        onClick={() => deleteProject(selectedProject.id)}>Supprimer</button>
                    </div>
                  </div>
                ) : (
                  <p className={`text-xs ${T.muted}`}>Sélectionnez un projet pour voir son détail.</p>
                )}
              </aside>
            ) : null}
          </>
        ) : null}

        {/* ============================== KANBAN ============================== */}
        {activeTab === 'kanban' ? (
          <div className={`flex-1 overflow-auto p-5 ${isDark ? 'bg-[#070B12]' : 'bg-slate-100'}`}>
            <div className="grid h-full min-w-[1000px] grid-cols-4 gap-4">
              {STATUSES.map((status) => {
                const meta = STATUS_META[status];
                const colTasks = kanbanTasks.filter((t) => t.status === status);
                const isOver = dragOverColumn === status;
                return (
                  <section key={status}
                    onDragOver={(e) => handleKanbanDragOver(e, status)}
                    onDragLeave={() => setDragOverColumn((c) => (c === status ? null : c))}
                    onDrop={(e) => handleKanbanDrop(e, status)}
                    className={`flex h-full flex-col rounded-2xl border p-3 transition ${T.panel} ${isOver ? 'border-indigo-500 ring-2 ring-indigo-500/30' : ''}`}>
                    <div className={`mb-3 flex items-center justify-between border-b-2 pb-2 ${meta.accent}`}>
                      <h3 className="flex items-center gap-2 text-xs font-extrabold">
                        <span className={`h-2 w-2 rounded-full ${meta.dot}`} />{meta.label}
                      </h3>
                      <span className={`rounded-full px-2 py-0.5 font-mono text-[10px] ${T.sub} ${T.muted}`}>{colTasks.length}</span>
                    </div>
                    <div className="flex-1 space-y-2.5 overflow-y-auto pr-1">
                      {colTasks.map((task) => (
                        <article key={task.id} draggable
                          onDragStart={(e) => handleKanbanDragStart(e, task.id)}
                          onDragEnd={handleKanbanDragEnd}
                          onClick={() => setEditingTask({ ...task, projectId: task.project.id })}
                          className={`cursor-grab rounded-xl border p-3 shadow-sm transition active:cursor-grabbing ${T.border} ${T.sub} ${T.hover} ${draggingTaskId === task.id ? 'opacity-40' : ''}`}>
                          <div className="mb-2 flex items-center justify-between gap-2">
                            <span className={`truncate rounded bg-gradient-to-r px-2 py-0.5 text-[9px] font-bold text-white ${task.project.color}`}>{task.project.title}</span>
                            <span className={`shrink-0 rounded border px-1.5 py-0.5 text-[9px] font-bold ${PRIORITY_META[task.priority].cls}`}>{PRIORITY_META[task.priority].icon} {PRIORITY_META[task.priority].label}</span>
                          </div>
                          <h4 className="mb-2 text-xs font-bold leading-snug">{task.title}</h4>
                          <div className={`flex items-center justify-between border-t pt-2 text-[10px] ${T.border} ${T.muted}`}>
                            <span className="flex items-center gap-1.5"><Avatar name={task.assignee} size="sm" />{task.assignee}</span>
                            <span className="font-mono">{formatDayShort(task.startDate)} · {task.duration} j</span>
                          </div>
                        </article>
                      ))}
                      {colTasks.length === 0 ? (
                        <div className={`rounded-xl border border-dashed py-8 text-center text-[11px] ${T.border} ${T.muted}`}>
                          {isOver ? 'Déposez ici' : 'Rien ici'}
                        </div>
                      ) : null}
                    </div>
                  </section>
                );
              })}
            </div>
          </div>
        ) : null}

        {/* ============================== PLANNING ============================== */}
        {activeTab === 'planning' ? (
          <div id="timeline-viewport" className={`flex-1 overflow-auto ${isDark ? 'bg-[#070B12]' : 'bg-slate-50'}`}>
            <div style={{ width: `${timelineWidth + 240}px`, minWidth: '100%' }}>

              {/* En-tête semaines */}
              <div className={`sticky top-0 z-30 flex h-7 border-b ${T.head} ${T.border}`}>
                <div style={{ width: '240px' }} className={`sticky left-0 z-40 flex items-center border-r px-4 text-[10px] font-bold uppercase tracking-wide ${T.head} ${T.border} ${T.muted}`}>Semaines</div>
                <div className="flex">
                  {timelineWeeks.map((w, i) => (
                    <div key={i} style={{ width: `${w.days * columnWidth}px` }}
                      className={`flex h-full items-center justify-center border-r border-indigo-500/20 text-[10px] font-extrabold uppercase text-indigo-400 ${i % 2 === 0 ? 'bg-indigo-500/[0.06]' : ''}`}>
                      {w.days * columnWidth > 110 ? `Semaine ${w.weekNum}` : `S${w.weekNum}`}
                    </div>
                  ))}
                </div>
              </div>

              {/* En-tête jours + AM/PM */}
              <div className={`sticky top-7 z-30 flex h-12 border-b ${T.head} ${T.border}`}>
                <div style={{ width: '240px' }} className={`sticky left-0 z-40 flex items-center justify-between border-r px-4 ${T.head} ${T.border}`}>
                  <span className="text-[11px] font-extrabold">Collaborateurs</span>
                  <span className={`font-mono text-[10px] ${T.muted}`}>{planningRows.length}</span>
                </div>
                <DayHeader withHalves />
              </div>

              {/* Lignes collaborateurs */}
              <div className="relative">
                {planningRows.map((row) => (
                  <div key={row.person} style={{ height: `${row.height}px` }} className={`flex border-b ${T.border}`}>
                    <div style={{ width: '240px' }} className={`sticky left-0 z-20 flex items-center gap-3 border-r px-4 ${T.panel}`}>
                      <Avatar name={row.person} />
                      <div className="min-w-0 flex-1">
                        <div className="truncate text-xs font-bold">{row.person}</div>
                        <div className={`text-[10px] ${T.muted}`}>{row.entries.length} entrée(s) · {row.workload} j planifiés</div>
                      </div>
                    </div>

                    <div className="relative" style={{ width: `${timelineWidth}px` }}>
                      {/* Fond : demi-cases cliquables AM / PM */}
                      <div className="absolute inset-0 flex">
                        {Array.from({ length: totalDays }).map((_, i) => {
                          const d = addDays(timelineStart, i);
                          const isToday = formatDateIso(d) === TODAY_STR;
                          const isWeekend = d.getDay() === 0 || d.getDay() === 6;
                          const amOver = (row.load.get(i * 2) || 0) > 1;
                          const pmOver = (row.load.get(i * 2 + 1) || 0) > 1;
                          return (
                            <div key={i} style={{ width: `${columnWidth}px`, minWidth: `${columnWidth}px` }}
                              className={`flex h-full border-r ${T.grid} ${d.getDay() === 1 ? 'border-l-2 border-l-indigo-500/25' : ''}
                                ${isToday ? 'bg-indigo-500/[0.08]' : isWeekend ? (isDark ? 'bg-white/[0.02]' : 'bg-slate-100/70') : ''}`}>
                              <button type="button" onClick={() => openEntryCreator(row.person, i, 'AM')}
                                title={`Planifier le matin du ${formatDateFr(formatDateIso(d))} pour ${row.person}`}
                                className={`group h-full w-1/2 border-r ${T.grid} transition hover:bg-indigo-500/20 ${amOver ? 'conflict-cell' : ''}`}>
                                <span className="text-[9px] font-bold text-amber-400 opacity-0 group-hover:opacity-100">+ AM</span>
                              </button>
                              <button type="button" onClick={() => openEntryCreator(row.person, i, 'PM')}
                                title={`Planifier l'après-midi du ${formatDateFr(formatDateIso(d))} pour ${row.person}`}
                                className={`group h-full w-1/2 transition hover:bg-indigo-500/20 ${pmOver ? 'conflict-cell' : ''}`}>
                                <span className="text-[9px] font-bold text-indigo-300 opacity-0 group-hover:opacity-100">+ PM</span>
                              </button>
                            </div>
                          );
                        })}
                      </div>

                      {/* Blocs */}
                      <div className="pointer-events-none relative h-full">
                        {row.entries.map((entry) => {
                          const dragging = drag && drag.kind === 'entry' && drag.id === entry.id;
                          const halfPx = columnWidth / 2;
                          let left = entry.startHalf * halfPx;
                          let width = entry.lenHalf * halfPx;
                          if (dragging) {
                            if (drag.action === 'move') left += drag.deltaX;
                            else if (drag.action === 'resize-left') { left += drag.deltaX; width -= drag.deltaX; }
                            else width += drag.deltaX;
                          }
                          const top = entry.lane * 30 + 10;
                          const ghostDate = dragging ? formatDateIso(addDays(timelineStart, Math.floor(drag.snapStart / 2))) : entry.startDate;
                          const ghostSlot = dragging ? (drag.snapStart % 2 === 1 ? 'PM' : 'AM') : entry.slot;
                          const ghostDuration = dragging ? drag.snapLen / 2 : entry.duration;

                          return (
                            <React.Fragment key={entry.id}>
                              {dragging ? (
                                <div style={{ left: `${drag.snapStart * halfPx}px`, width: `${drag.snapLen * halfPx}px`, top: `${top}px` }}
                                  className="absolute h-6 rounded-md border-2 border-dashed border-indigo-400 bg-indigo-500/10" />
                              ) : null}
                              <div
                                style={{ left: `${left}px`, width: `${Math.max(halfPx * 0.8, width)}px`, top: `${top}px` }}
                                onMouseDown={(e) => startDrag(e, { kind: 'entry', id: entry.id, action: 'move', unit: 0.5, startUnits: entry.startHalf, lenUnits: entry.lenHalf })}
                                onClick={(e) => { if (movedRef.current) { e.preventDefault(); return; } setEditingEntry(entry); }}
                                title={`${entry.title} — ${formatDateFr(entry.startDate)} ${entry.slot} · ${entry.duration} j`}
