<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jira Enterprise - Infinite Roadmap & Planning Pro</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            jira: {
              bg: '#0B0F19',
              card: '#151C2C',
              border: '#232D42',
              accent: '#3B82F6'
            }
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Yjs + y-webrtc (Temps réel P2P sans serveur) -->
  <script src="https://cdn.jsdelivr.net/npm/yjs@13/dist/yjs.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/y-webrtc@10/dist/y-webrtc.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0B0F19; }
    ::-webkit-scrollbar-thumb { background: #232D42; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #3B82F6; }
    .dragging-active { cursor: grabbing !important; user-select: none !important; }
  </style>
</head>
<body class="bg-jira-bg text-slate-100 font-sans antialiased min-h-screen overflow-hidden selection:bg-blue-500/30">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // --- HELPERS UTILS & DATES ---
    const utf8_to_b64 = (str) => window.btoa(unescape(encodeURIComponent(str)));
    const b64_to_utf8 = (str) => decodeURIComponent(escape(window.atob(str)));

    const parseDate = (str) => new Date(str + 'T00:00:00');
    const formatDateIso = (d) => d.toISOString().split('T')[0];
    const addDays = (d, days) => { const r = new Date(d); r.setDate(r.getDate() + days); return r; };
    const diffDays = (d1, d2) => Math.round((d1 - d2) / (1000 * 60 * 60 * 24));

    const formatDateFr = (isoStr) => {
      if (!isoStr) return '';
      const d = parseDate(isoStr);
      return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    };

    const MONTH_NAMES_FR = [
      'Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin',
      'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'
    ];

    const COLOR_OPTIONS = [
      { name: 'Bleu Jira', value: 'from-blue-600 to-indigo-600' },
      { name: 'Violet Cyber', value: 'from-purple-600 to-pink-600' },
      { name: 'Émeraude Tech', value: 'from-emerald-600 to-teal-600' },
      { name: 'Ambre Chaud', value: 'from-amber-500 to-orange-600' },
      { name: 'Rose Néon', value: 'from-rose-600 to-red-600' },
      { name: 'Cyan Futur', value: 'from-cyan-500 to-blue-500' }
    ];

    const TODAY_STR = formatDateIso(new Date());

    // DONNÉES INITIALES
    const INITIAL_PROJECTS = [
      {
        id: 'proj-1',
        title: 'Refonte Architecture Cloud & K8s',
        category: 'Infrastructure',
        startDate: TODAY_STR,
        duration: 14,
        color: 'from-blue-600 to-indigo-600',
        tasks: [
          { id: 't-1-1', title: 'Provisionner clusters Terraform', assignee: 'Alexandre M.', startDate: TODAY_STR, duration: 4, status: 'DONE' },
          { id: 't-1-2', title: 'Configuration Ingress Controller', assignee: 'Lucas R.', startDate: formatDateIso(addDays(new Date(), 4)), duration: 5, status: 'IN_PROGRESS' },
          { id: 't-1-3', title: 'Migration Microservices Auth', assignee: 'Alexandre M.', startDate: formatDateIso(addDays(new Date(), 9)), duration: 6, status: 'TODO' }
        ]
      },
      {
        id: 'proj-2',
        title: 'Design System & UI Components',
        category: 'Frontend',
        startDate: formatDateIso(addDays(new Date(), 2)),
        duration: 12,
        color: 'from-purple-600 to-pink-600',
        tasks: [
          { id: 't-2-1', title: 'Tokens de couleurs & Figma', assignee: 'Sophie T.', startDate: formatDateIso(addDays(new Date(), 2)), duration: 3, status: 'DONE' },
          { id: 't-2-2', title: 'Composants Formulaires React', assignee: 'Sophie T.', startDate: formatDateIso(addDays(new Date(), 5)), duration: 6, status: 'IN_PROGRESS' }
        ]
      },
      {
        id: 'proj-3',
        title: 'Optimisation API & Cache Redis',
        category: 'Backend',
        startDate: formatDateIso(addDays(new Date(), -3)),
        duration: 10,
        color: 'from-emerald-600 to-teal-600',
        tasks: [
          { id: 't-3-1', title: 'Mise en place Redis Cache', assignee: 'Thomas L.', startDate: formatDateIso(addDays(new Date(), -3)), duration: 5, status: 'IN_REVIEW' }
        ]
      }
    ];

    function RoadmapApp() {
      // 1. États Généraux
      const [projects, setProjects] = useState(() => {
        const saved = localStorage.getItem('jira_enterprise_projects_v4');
        return saved ? JSON.parse(saved) : INITIAL_PROJECTS;
      });

      const [activeTab, setActiveTab] = useState('roadmap'); // 'roadmap' | 'kanban' | 'planning'
      const [selectedProjectId, setSelectedProjectId] = useState('proj-1');
      const [editingTask, setEditingTask] = useState(null);
      const [columnWidth, setColumnWidth] = useState(48);
      const [extraTimelineDays, setExtraTimelineDays] = useState(30); // Buffer dynamique pour timeline infinie

      // Kanban Drag & Ghosting
      const [draggingKanbanTaskId, setDraggingKanbanTaskId] = useState(null);
      const [dragOverColumn, setDragOverColumn] = useState(null);

      // Modales & Configuration
      const [isProjectModalOpen, setIsProjectModalOpen] = useState(false);
      const [isConfigModalOpen, setIsConfigModalOpen] = useState(false);

      // Formulaires
      const [newProjectForm, setNewProjectForm] = useState({
        title: '', category: 'Tech', startDate: TODAY_STR, duration: 10, color: 'from-blue-600 to-indigo-600'
      });
      const [newTaskForm, setNewTaskForm] = useState({
        title: '', assignee: 'Alexandre M.', startDate: TODAY_STR, duration: 3, status: 'TODO'
      });

      // Drag State Engine
      const [dragState, setDragState] = useState(null);
      const dragAnimRef = useRef(null);

      // GitHub REST API & WebRTC P2P
      const [ghConfig, setGhConfig] = useState(() => {
        const saved = localStorage.getItem('gh_config');
        return saved ? JSON.parse(saved) : { owner: '', repo: '', path: 'data.json', token: '' };
      });
      const [syncStatus, setSyncStatus] = useState('');
      const [connectedPeers, setConnectedPeers] = useState(1);
      const yDocRef = useRef(null);

      // --- CALCUL DYNAMIQUE DE LA TIMELINE INFINIE ---
      const { timelineStartDate, totalTimelineDays } = useMemo(() => {
        let minDate = parseDate(TODAY_STR);
        let maxDate = addDays(parseDate(TODAY_STR), 30);

        projects.forEach(p => {
          const pStart = parseDate(p.startDate);
          const pEnd = addDays(pStart, p.duration);
          if (pStart < minDate) minDate = pStart;
          if (pEnd > maxDate) maxDate = pEnd;

          (p.tasks || []).forEach(t => {
            const tStart = parseDate(t.startDate || p.startDate);
            const tEnd = addDays(tStart, t.duration);
            if (tStart < minDate) minDate = tStart;
            if (tEnd > maxDate) maxDate = tEnd;
          });
        });

        const start = addDays(minDate, -3);
        const requiredDays = diffDays(maxDate, start) + extraTimelineDays;
        return { timelineStartDate: start, totalTimelineDays: Math.max(60, requiredDays) };
      }, [projects, extraTimelineDays]);

      // Calcul des Mois pour l'en-tête de calendrier
      const timelineMonths = useMemo(() => {
        const monthsMap = [];
        let currentMonthKey = '';
        let currentMonthObj = null;

        for (let i = 0; i < totalTimelineDays; i++) {
          const dayDate = addDays(timelineStartDate, i);
          const monthKey = `${dayDate.getFullYear()}-${dayDate.getMonth()}`;

          if (monthKey !== currentMonthKey) {
            currentMonthKey = monthKey;
            currentMonthObj = {
              name: `${MONTH_NAMES_FR[dayDate.getMonth()]} ${dayDate.getFullYear()}`,
              daysCount: 0
            };
            monthsMap.push(currentMonthObj);
          }
          currentMonthObj.daysCount++;
        }
        return monthsMap;
      }, [timelineStartDate, totalTimelineDays]);

      // Flat list de toutes les tâches avec leur projet parent
      const allFlatTasks = useMemo(() => {
        const list = [];
        projects.forEach(p => {
          (p.tasks || []).forEach(t => {
            list.push({ ...t, project: p });
          });
        });
        return list;
      }, [projects]);

      // Liste unique des collaborateurs
      const collaborators = useMemo(() => {
        const set = new Set();
        allFlatTasks.forEach(t => { if (t.assignee) set.add(t.assignee); });
        if (set.size === 0) set.add('Alexandre M.');
        return Array.from(set);
      }, [allFlatTasks]);

      // Persistance LocalStorage
      useEffect(() => localStorage.setItem('jira_enterprise_projects_v4', JSON.stringify(projects)), [projects]);
      useEffect(() => localStorage.setItem('gh_config', JSON.stringify(ghConfig)), [ghConfig]);

      // Sync WebRTC (Yjs)
      useEffect(() => {
        if (!window.Y || !window.YWebrtc) return;
        const ydoc = new window.Y.Doc();
        const provider = new window.YWebrtc.WebrtcProvider('jira-enterprise-room-2026', ydoc);
        const yProjects = ydoc.getArray('projects');

        yProjects.observe(() => {
          const remote = yProjects.toArray();
          if (remote.length > 0) setProjects(remote);
        });

        provider.on('peers', (e) => setConnectedPeers(e.webrtcPeers.length + 1));
        yDocRef.current = { ydoc, yProjects, provider };

        return () => { provider.destroy(); ydoc.destroy(); };
      }, []);

      const broadcastProjects = useCallback((updated) => {
        setProjects(updated);
        if (yDocRef.current && yDocRef.current.yProjects) {
          const { ydoc, yProjects } = yDocRef.current;
          ydoc.transact(() => {
            yProjects.delete(0, yProjects.length);
            yProjects.insert(0, updated);
          });
        }
      }, []);

      // PROGRESSION (%) PROJET
      const getProjectProgress = (project) => {
        if (!project.tasks || project.tasks.length === 0) return 0;
        const doneCount = project.tasks.filter(t => t.status === 'DONE').length;
        return Math.round((doneCount / project.tasks.length) * 100);
      };

      // HEALTH CHECK & DÉRIVE
      const getProjectHealth = (project) => {
        if (!project.tasks || project.tasks.length === 0) {
          return { status: 'NEUTRAL', label: '⚪ Non planifié', delay: 0 };
        }

        const projectTargetEnd = addDays(parseDate(project.startDate), project.duration - 1);
        let latestTaskEnd = parseDate(project.startDate);

        project.tasks.forEach(t => {
          const tStart = parseDate(t.startDate || project.startDate);
          const tEnd = addDays(tStart, (t.duration || 1) - 1);
          if (tEnd > latestTaskEnd) latestTaskEnd = tEnd;
        });

        const delay = diffDays(latestTaskEnd, projectTargetEnd);

        if (delay > 0) {
          return { status: 'DANGER', label: `🔴 Retard +${delay}j`, delay };
        } else if (delay < 0) {
          return { status: 'SUCCESS', label: `🟢 Avance ${Math.abs(delay)}j`, delay };
        } else {
          return { status: 'SUCCESS', label: '🟢 Dans les temps', delay: 0 };
        }
      };

      // ACTION : ALIGNER LA ROADMAP
      const rebaselineProject = (projectId) => {
        const proj = projects.find(p => p.id === projectId);
        if (!proj || !proj.tasks || proj.tasks.length === 0) return;

        let earliestStart = parseDate(proj.tasks[0].startDate || proj.startDate);
        let latestEnd = addDays(earliestStart, proj.tasks[0].duration - 1);

        proj.tasks.forEach(t => {
          const tStart = parseDate(t.startDate || proj.startDate);
          const tEnd = addDays(tStart, (t.duration || 1) - 1);
          if (tStart < earliestStart) earliestStart = tStart;
          if (tEnd > latestEnd) latestEnd = tEnd;
        });

        const newStartDate = formatDateIso(earliestStart);
        const newDuration = diffDays(latestEnd, earliestStart) + 1;

        const updated = projects.map(p => p.id === projectId ? { ...p, startDate: newStartDate, duration: newDuration } : p);
        broadcastProjects(updated);
      };

      // ENGINE DRAG & RESIZE HIGH-PERFORMANCE
      const handleMouseDown = (e, projectId, action) => {
        e.stopPropagation();
        e.preventDefault();
        const proj = projects.find(p => p.id === projectId);
        if (!proj) return;

        setDragState({
          projectId, action, startX: e.clientX,
          initialStartDate: proj.startDate, initialDuration: proj.duration,
          currentStartDate: proj.startDate, currentDuration: proj.duration
        });
      };

      useEffect(() => {
        const handleMouseMove = (e) => {
          if (!dragState) return;

          if (dragAnimRef.current) cancelAnimationFrame(dragAnimRef.current);

          dragAnimRef.current = requestAnimationFrame(() => {
            const deltaX = e.clientX - dragState.startX;
            const dayDelta = Math.round(deltaX / columnWidth);

            let newStart = dragState.initialStartDate;
            let newDur = dragState.initialDuration;

            if (dragState.action === 'move') {
              newStart = formatDateIso(addDays(parseDate(dragState.initialStartDate), dayDelta));
            } else if (dragState.action === 'resize-left') {
              const actualDays = Math.min(dayDelta, dragState.initialDuration - 1);
              newStart = formatDateIso(addDays(parseDate(dragState.initialStartDate), actualDays));
              newDur = dragState.initialDuration - actualDays;
            } else if (dragState.action === 'resize-right') {
              newDur = Math.max(1, dragState.initialDuration + dayDelta);
            }

            // AUTO-EXTENSION TIMELINE INFINIE PANDANT LE GLISSEMENT
            const endOffset = diffDays(parseDate(newStart), timelineStartDate) + newDur;
            if (endOffset > totalTimelineDays - 10) {
              setExtraTimelineDays(prev => prev + 15);
            }

            setDragState(prev => prev ? { ...prev, currentStartDate: newStart, currentDuration: newDur } : null);
          });
        };

        const handleMouseUp = () => {
          if (dragState) {
            const updated = projects.map(p => p.id === dragState.projectId ? { ...p, startDate: dragState.currentStartDate, duration: dragState.currentDuration } : p);
            broadcastProjects(updated);
          }
          setDragState(null);
        };

        if (dragState) {
          window.addEventListener('mousemove', handleMouseMove);
          window.addEventListener('mouseup', handleMouseUp);
        }
        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseup', handleMouseUp);
        };
      }, [dragState, columnWidth, projects, timelineStartDate, totalTimelineDays, broadcastProjects]);

      // KANBAN DRAG & GHOSTING HANDLERS
      const handleKanbanDragStart = (e, taskId) => {
        setDraggingKanbanTaskId(taskId);
        e.dataTransfer.setData('text/plain', taskId);
        e.dataTransfer.effectAllowed = 'move';
      };

      const handleKanbanDragOver = (e, colId) => {
        e.preventDefault();
        setDragOverColumn(colId);
      };

      const handleKanbanDrop = (e, targetStatus) => {
        e.preventDefault();
        const taskId = e.dataTransfer.getData('text/plain');
        setDraggingKanbanTaskId(null);
        setDragOverColumn(null);
        if (!taskId) return;

        const updatedProjects = projects.map(p => ({
          ...p,
          tasks: (p.tasks || []).map(t => t.id === taskId ? { ...t, status: targetStatus } : t)
        }));
        broadcastProjects(updatedProjects);
      };

      // ACTION : SCINDER UNE TÂCHE (SPLIT TASK)
      const splitTask = (taskId) => {
        const targetTask = allFlatTasks.find(t => t.id === taskId);
        if (!targetTask || targetTask.duration <= 1) {
          alert("Une tâche doit durer au moins 2 jours pour être scindée.");
          return;
        }

        const splitAt = Math.floor(targetTask.duration / 2);
        const durationPart1 = splitAt;
        const durationPart2 = targetTask.duration - splitAt;

        const task1 = { ...targetTask, duration: durationPart1 };
        const task2 = {
          id: `t-${targetTask.project.id}-${Date.now()}`,
          title: `${targetTask.title} (Partie 2)`,
          assignee: targetTask.assignee,
          startDate: formatDateIso(addDays(parseDate(targetTask.startDate), durationPart1)),
          duration: durationPart2,
          status: targetTask.status
        };

        const updatedProjects = projects.map(p => {
          if (p.id !== targetTask.project.id) return p;
          const newTasks = [];
          p.tasks.forEach(t => {
            if (t.id === taskId) {
              newTasks.push(task1, task2);
            } else {
              newTasks.push(t);
            }
          });
          return { ...p, tasks: newTasks };
        });

        broadcastProjects(updatedProjects);
        setEditingTask(null);
      };

      // VUE D'ENSEMBLE INTEGRALE (FIT ALL EXACT)
      const fitAllTasks = () => {
        const container = document.getElementById('gantt-container');
        if (!container) return;

        let earliest = parseDate(TODAY_STR);
        let latest = addDays(parseDate(TODAY_STR), 30);

        projects.forEach(p => {
          const pStart = parseDate(p.startDate);
          const pEnd = addDays(pStart, p.duration);
          if (pStart < earliest) earliest = pStart;
          if (pEnd > latest) latest = pEnd;

          (p.tasks || []).forEach(t => {
            const tStart = parseDate(t.startDate || p.startDate);
            const tEnd = addDays(tStart, t.duration);
            if (tStart < earliest) earliest = tStart;
            if (tEnd > latest) latest = tEnd;
          });
        });

        const spanDays = diffDays(latest, earliest) + 6;
        const calculatedWidth = Math.max(20, Math.floor(container.clientWidth / spanDays));
        setColumnWidth(calculatedWidth);

        // Reset scroll to left
        container.scrollLeft = 0;
      };

      // PROJETS & TÂCHES UPDATES
      const handleUpdateProjectField = (projId, field, value) => {
        const updated = projects.map(p => p.id === projId ? { ...p, [field]: value } : p);
        broadcastProjects(updated);
      };

      const handleCreateProject = (e) => {
        e.preventDefault();
        if (!newProjectForm.title.trim()) return;

        const newProj = {
          id: `proj-${Date.now()}`,
          ...newProjectForm,
          duration: Number(newProjectForm.duration),
          tasks: []
        };

        broadcastProjects([...projects, newProj]);
        setSelectedProjectId(newProj.id);
        setIsProjectModalOpen(false);
      };

      const handleAddTask = (e) => {
        e.preventDefault();
        if (!newTaskForm.title.trim() || !selectedProjectId) return;

        const proj = projects.find(p => p.id === selectedProjectId);

        const updated = projects.map(p => {
          if (p.id !== selectedProjectId) return p;
          return {
            ...p,
            tasks: [
              ...(p.tasks || []),
              {
                id: `t-${p.id}-${Date.now()}`,
                title: newTaskForm.title.trim(),
                assignee: newTaskForm.assignee || 'Alexandre M.',
                startDate: newTaskForm.startDate || proj.startDate,
                duration: Number(newTaskForm.duration) || 1,
                status: newTaskForm.status || 'TODO'
              }
            ]
          };
        });

        broadcastProjects(updated);
        setNewTaskForm({ title: '', assignee: 'Alexandre M.', startDate: TODAY_STR, duration: 3, status: 'TODO' });
      };

      const handleUpdateTask = (updatedTask) => {
        const updatedProjects = projects.map(p => ({
          ...p,
          tasks: (p.tasks || []).map(t => t.id === updatedTask.id ? updatedTask : t)
        }));
        broadcastProjects(updatedProjects);
        setEditingTask(null);
      };

      const handleDeleteTask = (taskId) => {
        const updatedProjects = projects.map(p => ({
          ...p,
          tasks: (p.tasks || []).filter(t => t.id !== taskId)
        }));
        broadcastProjects(updatedProjects);
        setEditingTask(null);
      };

      const deleteProject = (projId) => {
        if (confirm("Supprimer ce projet et toutes ses tâches ?")) {
          const updated = projects.filter(p => p.id !== projId);
          broadcastProjects(updated);
          if (selectedProjectId === projId) setSelectedProjectId(updated[0]?.id || null);
        }
      };

      // SAUVEGARDE GITHUB API
      const saveToGitHub = async () => {
        if (!ghConfig.owner || !ghConfig.repo || !ghConfig.token) {
          alert("Veuillez renseigner vos identifiants dans ⚙️ Config GitHub");
          return;
        }
        setSyncStatus('Commit en cours...');
        try {
          const url = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${ghConfig.path}`;
          const headers = { 'Authorization': `token ${ghConfig.token}`, 'Accept': 'application/vnd.github.v3+json' };
          
          let currentSha = null;
          const getRes = await fetch(url, { headers });
          if (getRes.ok) currentSha = (await getRes.json()).sha;

          const putRes = await fetch(url, {
            method: 'PUT',
            headers: { ...headers, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: `Update Roadmap ${new Date().toLocaleString('fr-FR')}`,
              content: utf8_to_b64(JSON.stringify(projects, null, 2)),
              ...(currentSha && { sha: currentSha })
            })
          });

          if (!putRes.ok) throw new Error();
          setSyncStatus('✅ Commité sur GitHub !');
          setTimeout(() => setSyncStatus(''), 3000);
          setIsConfigModalOpen(false);
        } catch {
          setSyncStatus('❌ Échec de sauvegarde');
        }
      };

      const selectedProject = projects.find(p => p.id === selectedProjectId);

      return (
        <div className={`flex flex-col h-screen overflow-hidden ${dragState ? 'dragging-active' : ''}`}>
          
          {/* HEADER PRINCIPAL */}
          <header className="bg-jira-card border-b border-jira-border px-6 py-3 flex items-center justify-between shrink-0">
            <div className="flex items-center gap-6">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-black text-white text-lg tracking-wider">J</div>
                <h1 className="text-base font-bold text-slate-100">Jira Enterprise</h1>
              </div>

              <div className="flex bg-jira-bg p-1 rounded-xl border border-jira-border text-xs font-semibold">
                <button 
                  onClick={() => setActiveTab('roadmap')}
                  className={`px-4 py-1.5 rounded-lg transition ${activeTab === 'roadmap' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                >
                  📊 Roadmap Macro
                </button>
                <button 
                  onClick={() => setActiveTab('kanban')}
                  className={`px-4 py-1.5 rounded-lg transition ${activeTab === 'kanban' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                >
                  📋 Kanban Tâches
                </button>
                <button 
                  onClick={() => setActiveTab('planning')}
                  className={`px-4 py-1.5 rounded-lg transition ${activeTab === 'planning' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                >
                  👥 Planning Collaborateurs
                </button>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <div className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-jira-bg border border-jira-border text-xs text-emerald-400">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>{connectedPeers} en direct</span>
              </div>

              <button 
                onClick={() => setIsConfigModalOpen(true)}
                className="px-3 py-2 bg-jira-bg hover:bg-slate-800 text-slate-200 border border-jira-border text-xs font-semibold rounded-xl transition"
              >

                <div className="space-y-4">
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Titre de la tâche</label>
                    <input 
                      type="text" 
                      value={editingTask.title} 
                      onChange={e => setEditingTask({...editingTask, title: e.target.value})}
                      className="w-full bg-jira-bg text-xs p-3 rounded-xl border border-jira-border text-slate-200" 
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Date de début réelle</label>
                      <input 
                        type="date" 
                        value={editingTask.startDate || TODAY_STR} 
                        onChange={e => setEditingTask({...editingTask, startDate: e.target.value})}
                        className="w-full bg-jira-bg text-xs p-3 rounded-xl border border-jira-border text-slate-200" 
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Durée (jours)</label>
                      <input 
                        type="number" min="1" 
                        value={editingTask.duration} 
                        onChange={e => setEditingTask({...editingTask, duration: Number(e.target.value)})}
                        className="w-full bg-jira-bg text-xs p-3 rounded-xl border border-jira-border text-slate-200" 
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Collaborateur assigné</label>
                      <input 
                        type="text" 
                        value={editingTask.assignee} 
                        onChange={e => setEditingTask({...editingTask, assignee: e.target.value})}
                        className="w-full bg-jira-bg text-xs p-3 rounded-xl border border-jira-border text-slate-200" 
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Statut Kanban</label>
                      <select 
                        value={editingTask.status} 
                        onChange={e => setEditingTask({...editingTask, status: e.target.value})}
                        className="w-full bg-jira-bg text-xs p-3 rounded-xl border border-jira-border text-slate-200"
                      >
                        <option value="TODO">À faire</option>
                        <option value="IN_PROGRESS">En cours</option>
                        <option value="IN_REVIEW">En revue</option>
                        <option value="DONE">Terminé</option>
                      </select>
                    </div>
                  </div>

                  {/* Bouton de Scission de Tâche */}
                  {editingTask.duration > 1 && (
                    <div className="p-3 bg-jira-bg rounded-xl border border-jira-border flex items-center justify-between">
                      <span className="text-xs text-slate-300">Découper cette tâche en 2 parties</span>
                      <button 
                        type="button"
                        onClick={() => splitTask(editingTask.id)}
                        className="px-3 py-1.5 bg-indigo-600/20 text-indigo-300 hover:bg-indigo-600/30 border border-indigo-500/30 text-xs font-semibold rounded-lg transition"
                      >
                        ✂️ Scinder
                      </button>
                    </div>
                  )}

                  <div className="flex justify-between items-center pt-4 border-t border-jira-border">
                    <button 
                      onClick={() => handleDeleteTask(editingTask.id)}
                      className="text-xs text-rose-400 hover:text-rose-300 font-semibold"
                    >
                      Supprimer
                    </button>
                    <div className="flex gap-2">
                      <button onClick={() => setEditingTask(null)} className="px-4 py-2 bg-jira-bg text-xs text-slate-300 rounded-xl">Annuler</button>
                      <button onClick={() => handleUpdateTask(editingTask)} className="px-4 py-2 bg-blue-600 text-xs font-semibold text-white rounded-xl">Enregistrer</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 2 : CONFIGURATION GITHUB */}
          {isConfigModalOpen && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-jira-card border border-jira-border rounded-2xl p-6 w-full max-w-md shadow-2xl">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-base font-bold text-slate-100">⚙️ Configuration Sauvegarde GitHub</h3>
                  <button onClick={() => setIsConfigModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Propriétaire Dépôt (Owner)</label>
                    <input type="text" placeholder="ex: mon-pseudo" value={ghConfig.owner} onChange={e => setGhConfig({...ghConfig, owner: e.target.value})} className="w-full bg-jira-bg p-3 rounded-xl border border-jira-border text-slate-200" />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Nom du Dépôt (Repo)</label>
                    <input type="text" placeholder="ex: ma-roadmap" value={ghConfig.repo} onChange={e => setGhConfig({...ghConfig, repo: e.target.value})} className="w-full bg-jira-bg p-3 rounded-xl border border-jira-border text-slate-200" />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">GitHub Personal Access Token (PAT)</label>
                    <input type="password" placeholder="github_pat_..." value={ghConfig.token} onChange={e => setGhConfig({...ghConfig, token: e.target.value})} className="w-full bg-jira-bg p-3 rounded-xl border border-jira-border text-slate-200" />
                  </div>

                  {syncStatus && <div className="text-blue-400 font-semibold">{syncStatus}</div>}

                  <div className="flex justify-end gap-3 pt-4 border-t border-jira-border">
                    <button onClick={() => setIsConfigModalOpen(false)} className="px-4 py-2 bg-jira-bg text-slate-300 rounded-xl">Fermer</button>
                    <button onClick={saveToGitHub} className="px-4 py-2 bg-blue-600 text-white rounded-xl font-semibold">Commiter data.json</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 3 : CRÉATION DE PROJET */}
          {isProjectModalOpen && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-jira-card border border-jira-border rounded-2xl p-6 w-full max-w-md shadow-2xl">
                <h3 className="text-lg font-bold text-slate-100 mb-4">Créer un Nouveau Projet</h3>
                <form onSubmit={handleCreateProject} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Nom du Projet</label>
                    <input type="text" required value={newProjectForm.title} onChange={e => setNewProjectForm({...newProjectForm, title: e.target.value})} className="w-full bg-jira-bg p-3 rounded-xl border border-jira-border text-slate-200" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Date Cible de début</label>
                      <input type="date" required value={newProjectForm.startDate} onChange={e => setNewProjectForm({...newProjectForm, startDate: e.target.value})} className="w-full bg-jira-bg p-3 rounded-xl border border-jira-border text-slate-200" />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Durée Cible (jours)</label>
                      <input type="number" min="1" required value={newProjectForm.duration} onChange={e => setNewProjectForm({...newProjectForm, duration: e.target.value})} className="w-full bg-jira-bg p-3 rounded-xl border border-jira-border text-slate-200" />
                    </div>
                  </div>
                  <div className="flex justify-end gap-3 pt-4 border-t border-jira-border">
                    <button type="button" onClick={() => setIsProjectModalOpen(false)} className="px-4 py-2 bg-jira-bg text-slate-300 rounded-xl">Annuler</button>
                    <button type="submit" className="px-4 py-2 bg-blue-600 text-white font-semibold rounded-xl">Créer Projet</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<RoadmapApp />);
  </script>
</body>
</html>
