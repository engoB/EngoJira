<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jira Enterprise - Roadmap, Kanban & Planning</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            jira: {
              bg: '#0B0F19',
              card: '#151C2C',
              border: '#232D42',
              accent: '#3B82F6'
            }
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Yjs + y-webrtc (Temps réel P2P sans serveur) -->
  <script src="https://cdn.jsdelivr.net/npm/yjs@13/dist/yjs.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/y-webrtc@10/dist/y-webrtc.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0B0F19; }
    ::-webkit-scrollbar-thumb { background: #232D42; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #3B82F6; }
  </style>
</head>
<body class="bg-jira-bg text-slate-100 font-sans antialiased min-h-screen overflow-hidden selection:bg-blue-500/30">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- HELPERS DATES EN FRANÇAIS ET UTILS ---
    const utf8_to_b64 = (str) => window.btoa(unescape(encodeURIComponent(str)));
    const b64_to_utf8 = (str) => decodeURIComponent(escape(window.atob(str)));

    const parseDate = (str) => new Date(str + 'T00:00:00');
    const formatDateIso = (d) => d.toISOString().split('T')[0];
    const addDays = (d, days) => { const r = new Date(d); r.setDate(r.getDate() + days); return r; };
    const diffDays = (d1, d2) => Math.round((d1 - d2) / (1000 * 60 * 60 * 24));

    const formatDateFr = (isoStr) => {
      if (!isoStr) return '';
      const d = parseDate(isoStr);
      return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    };

    const MONTH_NAMES_FR = [
      'Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin',
      'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'
    ];

    const COLOR_OPTIONS = [
      { name: 'Bleu Jira', value: 'from-blue-600 to-indigo-600' },
      { name: 'Violet Cyber', value: 'from-purple-600 to-pink-600' },
      { name: 'Émeraude Tech', value: 'from-emerald-600 to-teal-600' },
      { name: 'Ambre Chaud', value: 'from-amber-500 to-orange-600' },
      { name: 'Rose Néon', value: 'from-rose-600 to-red-600' },
      { name: 'Cyan Futur', value: 'from-cyan-500 to-blue-500' }
    ];

    const TODAY_STR = formatDateIso(new Date());

    // DONNÉES INITIALES (Projets & Tâches)
    const INITIAL_PROJECTS = [
      {
        id: 'proj-1',
        title: 'Refonte Architecture Cloud & K8s',
        category: 'Infrastructure',
        startDate: TODAY_STR,
        duration: 14,
        color: 'from-blue-600 to-indigo-600',
        tasks: [
          { id: 't-1-1', title: 'Provisionner clusters Terraform', assignee: 'Alexandre M.', duration: 4, status: 'DONE' },
          { id: 't-1-2', title: 'Configuration Ingress Controller', assignee: 'Lucas R.', duration: 5, status: 'IN_PROGRESS' },
          { id: 't-1-3', title: 'Migration Microservices Auth', assignee: 'Alexandre M.', duration: 6, status: 'TODO' }
        ]
      },
      {
        id: 'proj-2',
        title: 'Design System & UI Components',
        category: 'Frontend',
        startDate: formatDateIso(addDays(new Date(), 3)),
        duration: 12,
        color: 'from-purple-600 to-pink-600',
        tasks: [
          { id: 't-2-1', title: 'Tokens de couleurs & Figma', assignee: 'Sophie T.', duration: 3, status: 'DONE' },
          { id: 't-2-2', title: 'Composants Formulaires React', assignee: 'Sophie T.', duration: 10, status: 'IN_PROGRESS' } // Dépassement volontaire (3+10 = 13 > 12)
        ]
      },
      {
        id: 'proj-3',
        title: 'Optimisation API & Cache Redis',
        category: 'Backend',
        startDate: formatDateIso(addDays(new Date(), -4)),
        duration: 8,
        color: 'from-emerald-600 to-teal-600',
        tasks: [
          { id: 't-3-1', title: 'Mise en place Redis Cache', assignee: 'Thomas L.', duration: 4, status: 'IN_REVIEW' }
        ]
      }
    ];

    function RoadmapApp() {
      // 1. États Généraux
      const [projects, setProjects] = useState(() => {
        const saved = localStorage.getItem('jira_projects_data');
        return saved ? JSON.parse(saved) : INITIAL_PROJECTS;
      });

      const [activeTab, setActiveTab] = useState('roadmap'); // 'roadmap' | 'kanban' | 'planning'
      const [selectedProjectId, setSelectedProjectId] = useState('proj-1');
      const [editingTask, setEditingTask] = useState(null); // Tâche en cours de modification dans le modal
      const [columnWidth, setColumnWidth] = useState(48);

      // Modales & Drawers
      const [isProjectModalOpen, setIsProjectModalOpen] = useState(false);
      const [isConfigModalOpen, setIsConfigModalOpen] = useState(false);

      // Formulaire Nouveau Projet
      const [newProjectForm, setNewProjectForm] = useState({
        title: '', category: 'Tech', startDate: TODAY_STR, duration: 10, color: 'from-blue-600 to-indigo-600'
      });

      // Formulaire Nouvelle Tâche
      const [newTaskForm, setNewTaskForm] = useState({ title: '', assignee: 'Alexandre M.', duration: 3, status: 'TODO' });

      // Drag / Resize State
      const [dragState, setDragState] = useState(null);
      const [dragPreview, setDragPreview] = useState(null);

      // Configuration GitHub API
      const [ghConfig, setGhConfig] = useState(() => {
        const saved = localStorage.getItem('gh_config');
        return saved ? JSON.parse(saved) : { owner: '', repo: '', path: 'data.json', token: '' };
      });
      const [syncStatus, setSyncStatus] = useState('');
      const [connectedPeers, setConnectedPeers] = useState(1);
      const yDocRef = useRef(null);

      // Calcul de la timeline globale
      const timelineStartDate = useMemo(() => {
        if (projects.length === 0) return addDays(new Date(), -5);
        const dates = projects.map(p => parseDate(p.startDate).getTime());
        const minDate = new Date(Math.min(...dates, new Date().getTime()));
        return addDays(minDate, -5);
      }, [projects]);

      const TOTAL_TIMELINE_DAYS = 50;

      // Génération de la structure des Mois pour l'en-tête du calendrier
      const timelineMonths = useMemo(() => {
        const monthsMap = [];
        let currentMonthKey = '';
        let currentMonthObj = null;

        for (let i = 0; i < TOTAL_TIMELINE_DAYS; i++) {
          const dayDate = addDays(timelineStartDate, i);
          const monthKey = `${dayDate.getFullYear()}-${dayDate.getMonth()}`;

          if (monthKey !== currentMonthKey) {
            currentMonthKey = monthKey;
            currentMonthObj = {
              name: `${MONTH_NAMES_FR[dayDate.getMonth()]} ${dayDate.getFullYear()}`,
              daysCount: 0
            };
            monthsMap.push(currentMonthObj);
          }
          currentMonthObj.daysCount++;
        }
        return monthsMap;
      }, [timelineStartDate]);

      // Liste à plat de toutes les tâches (pour le Kanban et SoPlanning)
      const allFlatTasks = useMemo(() => {
        const list = [];
        projects.forEach(p => {
          (p.tasks || []).forEach(t => {
            list.push({ ...t, project: p });
          });
        });
        return list;
      }, [projects]);

      // Liste unique des collaborateurs
      const collaborators = useMemo(() => {
        const set = new Set();
        allFlatTasks.forEach(t => { if (t.assignee) set.add(t.assignee); });
        if (set.size === 0) set.add('Non assigné');
        return Array.from(set);
      }, [allFlatTasks]);

      // Persistance LocalStorage
      useEffect(() => localStorage.setItem('jira_projects_data', JSON.stringify(projects)), [projects]);
      useEffect(() => localStorage.setItem('gh_config', JSON.stringify(ghConfig)), [ghConfig]);

      // WebRTC P2P Sync (Yjs)
      useEffect(() => {
        if (!window.Y || !window.YWebrtc) return;
        const ydoc = new window.Y.Doc();
        const provider = new window.YWebrtc.WebrtcProvider('jira-enterprise-room-2026', ydoc);
        const yProjects = ydoc.getArray('projects');

        yProjects.observe(() => {
          const remote = yProjects.toArray();
          if (remote.length > 0) setProjects(remote);
        });

        provider.on('peers', (e) => setConnectedPeers(e.webrtcPeers.length + 1));
        yDocRef.current = { ydoc, yProjects, provider };

        return () => { provider.destroy(); ydoc.destroy(); };
      }, []);

      const broadcastProjects = (updated) => {
        setProjects(updated);
        if (yDocRef.current && yDocRef.current.yProjects) {
          const { ydoc, yProjects } = yDocRef.current;
          ydoc.transact(() => {
            yProjects.delete(0, yProjects.length);
            yProjects.insert(0, updated);
          });
        }
      };

      // VÉRIFICATION DÉPASSEMENT SOUS-TÂCHES
      const checkTasksOverflow = (project) => {
        if (!project.tasks || project.tasks.length === 0) return false;
        const totalTaskDuration = project.tasks.reduce((sum, t) => sum + Number(t.duration || 0), 0);
        return totalTaskDuration > project.duration;
      };

      // DRAG / RESIZE PROJET ENGINE
      const handleMouseDown = (e, projectId, action) => {
        e.stopPropagation();
        e.preventDefault();
        const proj = projects.find(p => p.id === projectId);
        if (!proj) return;

        setDragState({
          projectId, action, startX: e.clientX,
          initialStartDate: proj.startDate, initialDuration: proj.duration
        });

        setDragPreview({ projectId, startDate: proj.startDate, duration: proj.duration });
      };

      useEffect(() => {
        const handleMouseMove = (e) => {
          if (!dragState) return;
          const deltaX = e.clientX - dragState.startX;
          const dayDelta = Math.round(deltaX / columnWidth);

          let newStartDate = dragState.initialStartDate;
          let newDuration = dragState.initialDuration;

          if (dragState.action === 'move') {
            newStartDate = formatDateIso(addDays(parseDate(dragState.initialStartDate), dayDelta));
          } else if (dragState.action === 'resize-left') {
            const actualDays = Math.min(dayDelta, dragState.initialDuration - 1);
            newStartDate = formatDateIso(addDays(parseDate(dragState.initialStartDate), actualDays));
            newDuration = dragState.initialDuration - actualDays;
          } else if (dragState.action === 'resize-right') {
            newDuration = Math.max(1, dragState.initialDuration + dayDelta);
          }

          setDragPreview({ projectId: dragState.projectId, startDate: newStartDate, duration: newDuration });
        };

        const handleMouseUp = () => {
          if (dragState && dragPreview) {
            const updated = projects.map(p => p.id === dragState.projectId ? { ...p, startDate: dragPreview.startDate, duration: dragPreview.duration } : p);
            broadcastProjects(updated);
          }
          setDragState(null);
          setDragPreview(null);
        };

        if (dragState) {
          window.addEventListener('mousemove', handleMouseMove);
          window.addEventListener('mouseup', handleMouseUp);
        }
        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseup', handleMouseUp);
        };
      }, [dragState, dragPreview, columnWidth, projects]);

      // GESTION DES PROJETS & TÂCHES
      const handleCreateProject = (e) => {
        e.preventDefault();
        if (!newProjectForm.title.trim()) return;

        const newProj = {
          id: `proj-${Date.now()}`,
          ...newProjectForm,
          duration: Number(newProjectForm.duration),
          tasks: []
        };

        broadcastProjects([...projects, newProj]);
        setSelectedProjectId(newProj.id);
        setIsProjectModalOpen(false);
      };

      const handleAddTask = (e) => {
        e.preventDefault();
        if (!newTaskForm.title.trim() || !selectedProjectId) return;

        const updated = projects.map(p => {
          if (p.id !== selectedProjectId) return p;
          return {
            ...p,
            tasks: [
              ...(p.tasks || []),
              {
                id: `t-${p.id}-${Date.now()}`,
                title: newTaskForm.title.trim(),
                assignee: newTaskForm.assignee || 'Non assigné',
                duration: Number(newTaskForm.duration) || 1,
                status: newTaskForm.status || 'TODO'
              }
            ]
          };
        });

        broadcastProjects(updated);
        setNewTaskForm({ title: '', assignee: 'Alexandre M.', duration: 3, status: 'TODO' });
      };

      const handleUpdateTask = (updatedTask) => {
        const updatedProjects = projects.map(p => {
          if (!p.tasks) return p;
          const hasTask = p.tasks.some(t => t.id === updatedTask.id);
          if (!hasTask) return p;
          return {
            ...p,
            tasks: p.tasks.map(t => t.id === updatedTask.id ? updatedTask : t)
          };
        });
        broadcastProjects(updatedProjects);
        setEditingTask(null);
      };

      const handleDeleteTask = (taskId) => {
        const updatedProjects = projects.map(p => ({
          ...p,
          tasks: (p.tasks || []).filter(t => t.id !== taskId)
        }));
        broadcastProjects(updatedProjects);
        setEditingTask(null);
      };

      const updateTaskStatusQuick = (taskId, newStatus) => {
        const updatedProjects = projects.map(p => ({
          ...p,
          tasks: (p.tasks || []).map(t => t.id === taskId ? { ...t, status: newStatus } : t)
        }));
        broadcastProjects(updatedProjects);
      };

      const deleteProject = (projId) => {
        if (confirm("Supprimer ce projet et toutes ses tâches associees ?")) {
          const updated = projects.filter(p => p.id !== projId);
          broadcastProjects(updated);
          if (selectedProjectId === projId) setSelectedProjectId(updated[0]?.id || null);
        }
      };

      // SAUVEGARDE GITHUB REST API
      const saveToGitHub = async () => {
        if (!ghConfig.owner || !ghConfig.repo || !ghConfig.token) {
          alert("Veuillez renseigner votre Token dans le menu ⚙️ Configuration");
          return;
        }
        setSyncStatus('Commit en cours...');
        try {
          const url = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${ghConfig.path}`;
          const headers = { 'Authorization': `token ${ghConfig.token}`, 'Accept': 'application/vnd.github.v3+json' };
          
          let currentSha = null;
          const getRes = await fetch(url, { headers });
          if (getRes.ok) currentSha = (await getRes.json()).sha;

          const putRes = await fetch(url, {
            method: 'PUT',
            headers: { ...headers, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: `Update Roadmap ${new Date().toLocaleString('fr-FR')}`,
              content: utf8_to_b64(JSON.stringify(projects, null, 2)),
              ...(currentSha && { sha: currentSha })
            })
          });

          if (!putRes.ok) throw new Error();
          setSyncStatus('✅ Synchronisé sur GitHub');
          setTimeout(() => setSyncStatus(''), 3000);
          setIsConfigModalOpen(false);
        } catch {
          setSyncStatus('❌ Erreur de sauvegarde');
        }
      };

      const selectedProject = projects.find(p => p.id === selectedProjectId);

      return (
        <div className="flex flex-col h-screen overflow-hidden">
          {/* HEADER PRINCIPAL PREMIUM JIRA */}
          <header className="bg-jira-card border-b border-jira-border px-6 py-3 flex items-center justify-between shrink-0">
            <div className="flex items-center gap-6">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-black text-white text-lg tracking-wider">J</div>
                <h1 className="text-base font-bold text-slate-100">Jira Enterprise</h1>
              </div>

              {/* Navigation des 3 Vues Principales */}
              <div className="flex bg-jira-bg p-1 rounded-xl border border-jira-border text-xs font-semibold">
                <button 
                  onClick={() => setActiveTab('roadmap')}
                  className={`px-4 py-1.5 rounded-lg transition ${activeTab === 'roadmap' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                >
                  📊 Roadmap Projets
                </button>
                <button 
                  onClick={() => setActiveTab('kanban')}
                  className={`px-4 py-1.5 rounded-lg transition ${activeTab === 'kanban' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                >
                  📋 Kanban Tâches
                </button>
                <button 
                  onClick={() => setActiveTab('planning')}
                  className={`px-4 py-1.5 rounded-lg transition ${activeTab === 'planning' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                >
                  👥 Planning Collaborateurs
                </button>
              </div>
            </div>

            <div className="flex items-center gap-3">
              {/* Statut P2P & Synchro */}
              <div className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-jira-bg border border-jira-border text-xs text-emerald-400">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>{connectedPeers} en direct</span>
              </div>

              {/* Bouton Engrenage Configuration GitHub */}
              <button 
                onClick={() => setIsConfigModalOpen(true)}
                className="px-3 py-2 bg-jira-bg hover:bg-slate-800 text-slate-200 border border-jira-border text-xs font-semibold rounded-xl transition flex items-center gap-2"
                title="Configuration de la sauvegarde GitHub"
              >
                ⚙️ Config GitHub
              </button>

              <button 
                onClick={() => setIsProjectModalOpen(true)}
                className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-xl transition shadow-lg shadow-blue-600/20"
              >
                + Nouveau Projet
              </button>
            </div>
          </header>

          {/* MAIN CONTENT AREA */}
          <div className="flex-1 flex overflow-hidden">

            {/* VUE 1 : ROADMAP PROJETS & GANTT */}
            {activeTab === 'roadmap' && (
              <>
                {/* Panel Gauche: Liste des Projets */}
                <div className="w-80 border-r border-jira-border bg-jira-card flex flex-col shrink-0">
                  <div className="h-12 border-b border-jira-border px-4 flex items-center justify-between text-xs font-bold text-slate-400 uppercase tracking-wider bg-slate-900/50">
                    <span>Projets ({projects.length})</span>
                    <span>Tâches</span>
                  </div>

                  <div className="flex-1 overflow-y-auto divide-y divide-jira-border/50">
                    {projects.map(proj => {
                      const hasOverflow = checkTasksOverflow(proj);
                      const isSelected = proj.id === selectedProjectId;

                      return (
                        <div 
                          key={proj.id}
                          onClick={() => setSelectedProjectId(proj.id)}
                          className={`h-16 px-4 flex items-center justify-between cursor-pointer transition-colors ${
                            isSelected ? 'bg-blue-600/10 border-l-4 border-blue-500' : 'hover:bg-slate-800/40'
                          }`}
                        >
                          <div className="truncate pr-2">
                            <div className="flex items-center gap-2">
                              <span className={`w-2.5 h-2.5 rounded-full bg-gradient-to-r ${proj.color}`}></span>
                              <span className="text-xs font-semibold text-slate-200 truncate">{proj.title}</span>
                            </div>
                            <div className="text-[10px] text-slate-400 mt-1 flex items-center gap-2">
                              <span>Du {formatDateFr(proj.startDate)}</span>
                              <span>•</span>
                              <span>{proj.duration}j</span>
                            </div>
                          </div>

                          {hasOverflow ? (
                            <span className="px-2 py-0.5 rounded bg-rose-500/20 text-rose-400 border border-rose-500/30 text-[10px] font-bold animate-pulse" title="La somme des sous-tâches dépasse la durée du projet">
                              ⚠️ Dépassement
                            </span>
                          ) : (
                            <span className="text-[10px] font-mono bg-jira-bg px-2 py-0.5 rounded border border-jira-border text-slate-400">
                              {(proj.tasks || []).length} T
                            </span>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Panel Droit: Gantt Timeline avec Mois et Jours en Français */}
                <div className="flex-1 flex flex-col overflow-x-auto bg-jira-bg relative">
                  
                  {/* Ligne 1 : En-tête des Mois */}
                  <div className="h-6 border-b border-jira-border flex bg-slate-900/80 sticky top-0 z-20" style={{ width: `${TOTAL_TIMELINE_DAYS * columnWidth}px` }}>
                    {timelineMonths.map((m, idx) => (
                      <div 
                        key={idx} 
                        style={{ width: `${m.daysCount * columnWidth}px` }}
                        className="h-full border-r border-jira-border text-[11px] font-bold text-slate-300 flex items-center justify-center uppercase tracking-wider bg-slate-900/90"
                      >
                        {m.name}
                      </div>
                    ))}
                  </div>

                  {/* Ligne 2 : En-tête des Jours de la semaine */}
                  <div className="h-10 border-b border-jira-border flex items-center shrink-0 bg-slate-900/60 sticky top-6 z-10" style={{ width: `${TOTAL_TIMELINE_DAYS * columnWidth}px` }}>
                    {Array.from({ length: TOTAL_TIMELINE_DAYS }).map((_, i) => {
                      const dayDate = addDays(timelineStartDate, i);
                      const dayStr = formatDateIso(dayDate);
                      const isToday = dayStr === TODAY_STR;
                      const isWeekend = dayDate.getDay() === 0 || dayDate.getDay() === 6;

                      return (
                        <div 
                          key={i}
                          style={{ width: `${columnWidth}px` }}
                          className={`h-full border-r border-jira-border/60 flex flex-col justify-center items-center text-[10px] ${
                            isToday ? 'bg-blue-500/20 text-blue-400 font-bold border-b-2 border-blue-500' : isWeekend ? 'bg-slate-950/40 text-slate-600' : 'text-slate-400'
                          }`}
                        >
                          <span className="uppercase text-[9px] text-slate-500">
                            {dayDate.toLocaleDateString('fr-FR', { weekday: 'narrow' })}
                          </span>
                          <span>{dayDate.getDate()}</span>
                        </div>
                      );
                    })}
                  </div>

                  {/* Grille Gantt et Blocs de Projets */}
                  <div className="flex-1 relative" style={{ width: `${TOTAL_TIMELINE_DAYS * columnWidth}px` }}>
                    <div className="absolute inset-0 flex pointer-events-none">
                      {Array.from({ length: TOTAL_TIMELINE_DAYS }).map((_, i) => (
                        <div key={i} style={{ width: `${columnWidth}px` }} className="h-full border-r border-jira-border/20" />
                      ))}
                    </div>

                    <div className="relative">
                      {projects.map(proj => {
                        const isDraggingThis = dragState && dragState.projectId === proj.id;
                        const displayStartDate = isDraggingThis ? dragPreview.startDate : proj.startDate;
                        const displayDuration = isDraggingThis ? dragPreview.duration : proj.duration;

                        const offsetDays = diffDays(parseDate(displayStartDate), timelineStartDate);
                        const isSelected = proj.id === selectedProjectId;
                        const endDateStr = formatDateIso(addDays(parseDate(displayStartDate), displayDuration - 1));

                        return (
                          <div key={proj.id} className="h-16 border-b border-jira-border/40 relative flex items-center">
                            
                            {/* Bloc Projet */}
                            <div
                              style={{
                                left: `${offsetDays * columnWidth}px`,
                                width: `${displayDuration * columnWidth}px`
                              }}
                              onMouseDown={(e) => handleMouseDown(e, proj.id, 'move')}
                              onClick={() => setSelectedProjectId(proj.id)}
                              className={`absolute h-10 rounded-lg bg-gradient-to-r ${proj.color} shadow-lg cursor-grab active:cursor-grabbing flex items-center justify-between group border border-white/20 select-none ${
                                isSelected ? 'ring-2 ring-blue-400 ring-offset-2 ring-offset-jira-bg' : ''
                              }`}
                            >
                              <div onMouseDown={(e) => handleMouseDown(e, proj.id, 'resize-left')} className="absolute left-0 top-0 bottom-0 w-3 cursor-ew-resize bg-white/20 opacity-0 group-hover:opacity-100 rounded-l-lg hover:bg-white/50" />
                              
                              <div className="truncate px-3 pointer-events-none flex items-center justify-between w-full">
                                <span className="text-xs font-bold text-white truncate">{proj.title}</span>
                                <span className="text-[10px] text-white/90 font-mono ml-2 bg-black/30 px-1.5 py-0.5 rounded">
                                  {displayDuration}j
                                </span>
                              </div>

                              <div onMouseDown={(e) => handleMouseDown(e, proj.id, 'resize-right')} className="absolute right-0 top-0 bottom-0 w-3 cursor-ew-resize bg-white/20 opacity-0 group-hover:opacity-100 rounded-r-lg hover:bg-white/50" />

                              {/* Tooltip de précision lors du glissement */}
                              {isDraggingThis && (
                                <div className="absolute -top-10 left-1/2 -translate-x-1/2 bg-slate-900 border border-blue-500 text-slate-100 text-[10px] font-mono px-3 py-1 rounded-lg shadow-2xl z-30 whitespace-nowrap">
                                  📅 Du {formatDateFr(displayStartDate)} au {formatDateFr(endDateStr)} ({displayDuration} jours)
                                </div>
                              )}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              </>
            )}

            {/* VUE 2 : TABLEAU KANBAN (EXCLUSIVEMENT LES TÂCHES AVEC LE TAG DU PROJET) */}
            {activeTab === 'kanban' && (
              <div className="flex-1 p-6 bg-jira-bg overflow-x-auto">
                <div className="grid grid-cols-4 gap-6 min-w-[1100px] h-full">
                  {[
                    { id: 'TODO', title: 'À faire', color: 'border-slate-600' },
                    { id: 'IN_PROGRESS', title: 'En cours', color: 'border-blue-500' },
                    { id: 'IN_REVIEW', title: 'En revue', color: 'border-purple-500' },
                    { id: 'DONE', title: 'Terminé', color: 'border-emerald-500' }
                  ].map(col => {
                    const colTasks = allFlatTasks.filter(t => t.status === col.id);

                    return (
                      <div key={col.id} className="bg-jira-card border border-jira-border rounded-2xl p-4 flex flex-col h-full">
                        <div className={`flex items-center justify-between border-b-2 ${col.color} pb-3 mb-4`}>
                          <h3 className="font-bold text-sm text-slate-200">{col.title}</h3>
                          <span className="text-xs font-mono bg-jira-bg border border-jira-border px-2 py-0.5 rounded-full text-slate-400">
                            {colTasks.length}
                          </span>
                        </div>

                        <div className="flex-1 overflow-y-auto space-y-3 pr-1">
                          {colTasks.map(task => (
                            <div 
                              key={task.id}
                              className="bg-jira-bg border border-jira-border hover:border-slate-600 p-4 rounded-xl shadow-lg transition flex flex-col justify-between gap-3 group"
                            >
                              <div>
                                {/* Badge Tag du Projet Parent */}
                                <div className="flex items-center justify-between mb-2">
                                  <span className={`text-[10px] font-bold px-2 py-0.5 rounded text-white bg-gradient-to-r ${task.project.color}`}>
                                    {task.project.title}
                                  </span>
                                  <button 
                                    onClick={() => setEditingTask(task)} 
                                    className="text-[10px] text-blue-400 hover:underline opacity-0 group-hover:opacity-100 transition"
                                  >
                                    Éditer
                                  </button>
                                </div>

                                <h4 className="text-xs font-bold text-slate-100 mb-1">{task.title}</h4>
                                <p className="text-[10px] text-slate-400">Durée : {task.duration} jour(s)</p>
                              </div>

                              <div className="flex items-center justify-between pt-2 border-t border-jira-border/50 text-[10px] text-slate-400">
                                <span className="font-semibold text-slate-300">👤 {task.assignee}</span>
                                
                                {/* Selecteur de Statut */}
                                <select 
                                  value={task.status}
                                  onChange={e => updateTaskStatusQuick(task.id, e.target.value)}
                                  className="bg-jira-card border border-jira-border text-[10px] rounded px-1.5 py-0.5 text-slate-200"
                                >
                                  <option value="TODO">À faire</option>
                                  <option value="IN_PROGRESS">En cours</option>
                                  <option value="IN_REVIEW">En revue</option>
                                  <option value="DONE">Terminé</option>
                                </select>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* VUE 3 : PLANNING PAR COLLABORATEUR (SOPLANNING STYLE) */}
            {activeTab === 'planning' && (
              <div className="flex-1 flex flex-col overflow-x-auto bg-jira-bg">
                {/* Header Calendrier Mois & Jours */}
                <div className="h-10 border-b border-jira-border flex items-center shrink-0 bg-slate-900/80 sticky top-0 z-10" style={{ width: `${TOTAL_TIMELINE_DAYS * columnWidth + 240}px` }}>
                  <div className="w-60 px-4 font-bold text-xs text-slate-400 border-r border-jira-border">Collaborateurs</div>
                  <div className="flex-1 flex">
                    {Array.from({ length: TOTAL_TIMELINE_DAYS }).map((_, i) => {
                      const dayDate = addDays(timelineStartDate, i);
                      const isToday = formatDateIso(dayDate) === TODAY_STR;
                      return (
                        <div key={i} style={{ width: `${columnWidth}px` }} className={`h-full border-r border-jira-border/50 flex items-center justify-center text-[10px] ${isToday ? 'bg-blue-500/20 text-blue-400 font-bold' : 'text-slate-400'}`}>
                          {dayDate.getDate()}
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Lignes par Collaborateur */}
                <div className="flex-1 overflow-y-auto" style={{ width: `${TOTAL_TIMELINE_DAYS * columnWidth + 240}px` }}>
                  {collaborators.map(person => {
                    const personTasks = allFlatTasks.filter(t => t.assignee === person);

                    return (
                      <div key={person} className="flex border-b border-jira-border min-h-[72px]">
                        {/* Avatar & Nom */}
                        <div className="w-60 p-4 border-r border-jira-border bg-jira-card flex items-center gap-3 shrink-0">
                          <div className="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center font-bold text-xs text-white">
                            {person.charAt(0)}
                          </div>
                          <div>
                            <div className="text-xs font-bold text-slate-200">{person}</div>
                            <div className="text-[10px] text-slate-400">{personTasks.length} tâche(s)</div>
                          </div>
                        </div>

                        {/* Timeline de la personne */}
                        <div className="flex-1 relative flex items-center">
                          <div className="absolute inset-0 flex pointer-events-none">
                            {Array.from({ length: TOTAL_TIMELINE_DAYS }).map((_, i) => (
                              <div key={i} style={{ width: `${columnWidth}px` }} className="h-full border-r border-jira-border/20" />
                            ))}
                          </div>

                          <div className="relative w-full h-full flex items-center">
                            {personTasks.map(task => {
                              const projOffset = diffDays(parseDate(task.project.startDate), timelineStartDate);

                              return (
                                <div
                                  key={task.id}
                                  style={{
                                    left: `${projOffset * columnWidth}px`,
                                    width: `${task.duration * columnWidth}px`
                                  }}
                                  onClick={() => setEditingTask(task)}
                                  className={`absolute h-8 rounded bg-gradient-to-r ${task.project.color} px-2 flex items-center justify-between text-[10px] font-bold text-white shadow cursor-pointer hover:brightness-110 truncate border border-white/20`}
                                  title={`${task.title} (${task.project.title})`}
                                >
                                  <span className="truncate">{task.title}</span>
                                  <span className="ml-1 opacity-80 text-[9px] font-mono">{task.duration}j</span>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* PANNEAU INSPECTEUR ET GESTION DES TÂCHES (À Droite en mode Roadmap) */}
            {activeTab === 'roadmap' && selectedProject && (
              <div className="w-80 border-l border-jira-border bg-jira-card p-5 flex flex-col justify-between shrink-0 overflow-y-auto">
                <div>
                  <div className="flex items-center justify-between mb-4">
                    <span className="text-xs font-semibold px-2.5 py-1 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20">
                      {selectedProject.category}
                    </span>
                    <button onClick={() => deleteProject(selectedProject.id)} className="text-xs text-rose-400 hover:text-rose-300">
                      Supprimer Projet
                    </button>
                  </div>

                  <h2 className="text-sm font-bold text-slate-100 mb-4">{selectedProject.title}</h2>

                  {/* Warning Box si la somme des tâches dépasse le projet */}
                  {checkTasksOverflow(selectedProject) && (
                    <div className="mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs">
                      ⚠️ <strong>Alerte :</strong> La durée cumulée des sous-tâches ({selectedProject.tasks.reduce((s, t) => s + Number(t.duration || 0), 0)}j) dépasse la durée du projet ({selectedProject.duration}j).
                    </div>
                  )}

                  {/* Édition rapide du Projet */}
                  <div className="space-y-3 bg-jira-bg p-3 rounded-xl border border-jira-border mb-6 text-xs">
                    <div>
                      <label className="block text-[10px] text-slate-400 uppercase mb-1">Date de début du projet</label>
                      <input 
                        type="date" 
                        value={selectedProject.startDate}
                        onChange={e => {
                          const updated = projects.map(p => p.id === selectedProject.id ? { ...p, startDate: e.target.value } : p);
                          broadcastProjects(updated);
                        }}
                        className="w-full bg-jira-card border border-jira-border rounded p-1.5 text-slate-200"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-[10px] text-slate-400 uppercase mb-1">Durée (jours)</label>
                        <input 
                          type="number" min="1"
                          value={selectedProject.duration}
                          onChange={e => {
                            const updated = projects.map(p => p.id === selectedProject.id ? { ...p, duration: Number(e.target.value) } : p);
                            broadcastProjects(updated);
                          }}
                          className="w-full bg-jira-card border border-jira-border rounded p-1.5 text-slate-200"
                        />
                      </div>
                      <div>
                        <label className="block text-[10px] text-slate-400 uppercase mb-1">Couleur</label>
                        <select 
                          value={selectedProject.color}
                          onChange={e => {
                            const updated = projects.map(p => p.id === selectedProject.id ? { ...p, color: e.target.value } : p);
                            broadcastProjects(updated);
                          }}
                          className="w-full bg-jira-card border border-jira-border rounded p-1.5 text-slate-200"
                        >
                          {COLOR_OPTIONS.map(c => <option key={c.value} value={c.value}>{c.name}</option>)}
                        </select>
                      </div>
                    </div>
                  </div>

                  {/* Liste des Tâches du Projet */}
                  <div>
                    <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">
                      Tâches du Projet ({selectedProject.tasks?.length || 0})
                    </h3>

                    <div className="space-y-2 mb-4">
                      {(selectedProject.tasks || []).map(task => (
                        <div key={task.id} className="p-2.5 bg-jira-bg rounded-xl border border-jira-border flex items-center justify-between text-xs group">
                          <div className="truncate pr-2">
                            <div className="font-semibold text-slate-200 truncate">{task.title}</div>
                            <div className="text-[10px] text-slate-400">👤 {task.assignee} ({task.duration}j)</div>
                          </div>
                          <button 
                            onClick={() => setEditingTask(task)}
                            className="px-2 py-1 bg-jira-card hover:bg-slate-800 text-[10px] font-semibold text-blue-400 rounded border border-jira-border shrink-0"
                          >
                            Éditer
                          </button>
                        </div>
                      ))}
                    </div>

                    {/* Formulaire ajout Tâche */}
                    <form onSubmit={handleAddTask} className="space-y-2 bg-jira-bg p-3 rounded-xl border border-jira-border">
                      <input 
                        type="text" placeholder="Titre de la tâche..." required
                        value={newTaskForm.title}
                        onChange={e => setNewTaskForm({...newTaskForm, title: e.target.value})}
                        className="w-full bg-jira-card text-xs p-2 rounded border border-jira-border text-slate-200"
                      />
                      <div className="grid grid-cols-2 gap-2">
                        <input 
                          type="text" placeholder="Assigné à"
                          value={newTaskForm.assignee}
                          onChange={e => setNewTaskForm({...newTaskForm, assignee: e.target.value})}
                          className="bg-jira-card text-xs p-2 rounded border border-jira-border text-slate-200"
                        />
                        <input 
                          type="number" min="1" placeholder="Durée (j)"
                          value={newTaskForm.duration}
                          onChange={e => setNewTaskForm({...newTaskForm, duration: e.target.value})}
                          className="bg-jira-card text-xs p-2 rounded border border-jira-border text-slate-200"
                        />
                      </div>
                      <button type="submit" className="w-full py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded transition">
                        + Ajouter Tâche
                      </button>
                    </form>
                  </div>
                </div>
              </div>
            )}
          </div>

          {/* MODAL 1 : ÉDITION COMPLÈTE D'UNE TÂCHE */}
          {editingTask && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-jira-card border border-jira-border rounded-2xl p-6 w-full max-w-md shadow-2xl">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-base font-bold text-slate-100">Modifier la Tâche</h3>
                  <button onClick={() => setEditingTask(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="space-y-4">
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Titre de la tâche</label>
                    <input 
                      type="text" 
                      value={editingTask.title} 
                      onChange={e => setEditingTask({...editingTask, title: e.target.value})}
                      className="w-full bg-jira-bg text-xs p-3 rounded-xl border border-jira-border text-slate-200" 
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Membre assigné</label>
                      <input 
                        type="text" 
                        value={editingTask.assignee} 
                        onChange={e => setEditingTask({...editingTask, assignee: e.target.value})}
                        className="w-full bg-jira-bg text-xs p-3 rounded-xl border border-jira-border text-slate-200" 
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Durée (jours)</label>
                      <input 
                        type="number" min="1" 
                        value={editingTask.duration} 
                        onChange={e => setEditingTask({...editingTask, duration: Number(e.target.value)})}
                        className="w-full bg-jira-bg text-xs p-3 rounded-xl border border-jira-border text-slate-200" 
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Statut dans le Kanban</label>
                    <select 
                      value={editingTask.status} 
                      onChange={e => setEditingTask({...editingTask, status: e.target.value})}
                      className="w-full bg-jira-bg text-xs p-3 rounded-xl border border-jira-border text-slate-200"
                    >
                      <option value="TODO">À faire</option>
                      <option value="IN_PROGRESS">En cours</option>
                      <option value="IN_REVIEW">En revue</option>
                      <option value="DONE">Terminé</option>
                    </select>
                  </div>

                  <div className="flex justify-between items-center pt-4 border-t border-jira-border">
                    <button 
                      onClick={() => handleDeleteTask(editingTask.id)}
                      className="text-xs text-rose-400 hover:text-rose-300 font-semibold"
                    >
                      Supprimer
                    </button>
                    <div className="flex gap-2">
                      <button onClick={() => setEditingTask(null)} className="px-4 py-2 bg-jira-bg text-xs text-slate-300 rounded-xl">Annuler</button>
                      <button onClick={() => handleUpdateTask(editingTask)} className="px-4 py-2 bg-blue-600 text-xs font-semibold text-white rounded-xl">Enregistrer</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 2 : CONFIGURATION DISCRÈTE GITHUB */}
          {isConfigModalOpen && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-jira-card border border-jira-border rounded-2xl p-6 w-full max-w-md shadow-2xl">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-base font-bold text-slate-100">⚙️ Configuration Sauvegarde GitHub</h3>
                  <button onClick={() => setIsConfigModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Propriétaire Dépôt (Owner)</label>
                    <input type="text" placeholder="ex: mon-pseudo" value={ghConfig.owner} onChange={e => setGhConfig({...ghConfig, owner: e.target.value})} className="w-full bg-jira-bg p-3 rounded-xl border border-jira-border text-slate-200" />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Nom du Dépôt (Repo)</label>
                    <input type="text" placeholder="ex: ma-roadmap" value={ghConfig.repo} onChange={e => setGhConfig({...ghConfig, repo: e.target.value})} className="w-full bg-jira-bg p-3 rounded-xl border border-jira-border text-slate-200" />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">GitHub Personal Access Token (PAT)</label>
                    <input type="password" placeholder="github_pat_..." value={ghConfig.token} onChange={e => setGhConfig({...ghConfig, token: e.target.value})} className="w-full bg-jira-bg p-3 rounded-xl border border-jira-border text-slate-200" />
                  </div>

                  {syncStatus && <div className="text-blue-400 font-semibold">{syncStatus}</div>}

                  <div className="flex justify-end gap-3 pt-4 border-t border-jira-border">
                    <button onClick={() => setIsConfigModalOpen(false)} className="px-4 py-2 bg-jira-bg text-slate-300 rounded-xl">Fermer</button>
                    <button onClick={saveToGitHub} className="px-4 py-2 bg-blue-600 text-white rounded-xl font-semibold">Commiter data.json</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 3 : CRÉATION DE PROJET */}
          {isProjectModalOpen && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-jira-card border border-jira-border rounded-2xl p-6 w-full max-w-md shadow-2xl">
                <h3 className="text-lg font-bold text-slate-100 mb-4">Créer un Nouveau Projet</h3>
                <form onSubmit={handleCreateProject} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Nom du Projet</label>
                    <input type="text" required value={newProjectForm.title} onChange={e => setNewProjectForm({...newProjectForm, title: e.target.value})} className="w-full bg-jira-bg p-3 rounded-xl border border-jira-border text-slate-200" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Date de début</label>
                      <input type="date" required value={newProjectForm.startDate} onChange={e => setNewProjectForm({...newProjectForm, startDate: e.target.value})} className="w-full bg-jira-bg p-3 rounded-xl border border-jira-border text-slate-200" />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Durée (jours)</label>
                      <input type="number" min="1" required value={newProjectForm.duration} onChange={e => setNewProjectForm({...newProjectForm, duration: e.target.value})} className="w-full bg-jira-bg p-3 rounded-xl border border-jira-border text-slate-200" />
                    </div>
                  </div>
                  <div className="flex justify-end gap-3 pt-4 border-t border-jira-border">
                    <button type="button" onClick={() => setIsProjectModalOpen(false)} className="px-4 py-2 bg-jira-bg text-slate-300 rounded-xl">Annuler</button>
                    <button type="submit" className="px-4 py-2 bg-blue-600 text-white font-semibold rounded-xl">Créer Projet</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<RoadmapApp />);
  </script>
</body>
</html>
