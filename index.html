                                className={`group pointer-events-auto absolute flex h-6 cursor-grab items-center rounded-md border border-white/20 bg-gradient-to-r ${entry.color} px-1.5 text-[10px] font-bold text-white shadow-md transition hover:brightness-110 active:cursor-grabbing ${dragging ? 'z-[15] ring-2 ring-indigo-300' : 'z-10'}`}>
                                <div onMouseDown={(e) => startDrag(e, { kind: 'entry', id: entry.id, action: 'resize-left', unit: 0.5, startUnits: entry.startHalf, lenUnits: entry.lenHalf })}
                                  className="absolute inset-y-0 left-0 w-2 cursor-ew-resize rounded-l-md bg-white/40 opacity-0 group-hover:opacity-100" />
                                <div className="pointer-events-none flex w-full items-center justify-between gap-1 px-1">
                                  <span className="truncate">{entry.slot === 'PM' ? '☾' : '☀'} {entry.title}</span>
                                  {entry.lenHalf >= 2 ? <span className="shrink-0 rounded bg-black/35 px-1 font-mono text-[9px]">{entry.duration} j</span> : null}
                                </div>
                                <div onMouseDown={(e) => startDrag(e, { kind: 'entry', id: entry.id, action: 'resize-right', unit: 0.5, startUnits: entry.startHalf, lenUnits: entry.lenHalf })}
                                  className="absolute inset-y-0 right-0 w-2 cursor-ew-resize rounded-r-md bg-white/40 opacity-0 group-hover:opacity-100" />
                                {dragging ? (
                                  <div className="pointer-events-none absolute -top-7 left-0 whitespace-nowrap rounded-md border border-indigo-500 bg-slate-900 px-2 py-1 font-mono text-[10px] text-slate-100 shadow-xl">
                                    {formatDateFr(ghostDate)} · {ghostSlot} · {ghostDuration} j
                                  </div>
                                ) : null}
                              </div>
                            </React.Fragment>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                ))}

                {planningRows.length === 0 ? (
                  <div className={`px-8 py-16 text-center text-sm ${T.muted}`}>Aucun collaborateur ne correspond au filtre.</div>
                ) : null}
              </div>
            </div>
          </div>
        ) : null}
      </main>

      {/* ------------------------------- Modales ------------------------------- */}
      {entryForm ? (
        <Modal T={T} title={entryForm.id ? 'Modifier l’entrée' : 'Planifier une entrée'}
          subtitle={`${entryForm.assignee} · ${formatDayShort(entryForm.startDate)} · ${entryForm.slot === 'PM' ? 'après-midi' : 'matin'}`}
          onClose={() => setEntryForm(null)}
          footer={<>
            <span className={`text-[11px] ${T.muted}`}>Durée minimale : 0,5 jour</span>
            <div className="flex gap-2">
              <button type="button" className={btnGhost} onClick={() => setEntryForm(null)}>Annuler</button>
              <button type="button" className={btnPrimary} onClick={() => saveEntry(entryForm)}>{entryForm.id ? 'Enregistrer' : 'Planifier'}</button>
            </div>
          </>}>
          <div className="space-y-3">
            <div className={`rounded-xl border p-3 ${T.border} ${T.sub}`}>
              <Field T={T} label="Reprendre un projet ou une tâche" hint="Remplit le titre, l'étiquette et la couleur en un clic.">
                <select className={inputCls} value=""
                  onChange={(e) => {
                    const v = e.target.value;
                    if (!v) return;
                    const [type, id] = v.split(':');
                    if (type === 'proj') {
                      const p = projects.find((x) => x.id === id);
                      if (p) setEntryForm({ ...entryForm, title: p.title, tag: p.category, color: p.color });
                    } else {
                      const t = allTasks.find((x) => x.id === id);
                      if (t) setEntryForm({ ...entryForm, title: t.title, tag: t.project.category, color: t.project.color, assignee: t.assignee || entryForm.assignee });
                    }
                  }}>
                  <option value="">Choisir un modèle…</option>
                  <optgroup label="Projets">{projects.map((p) => <option key={p.id} value={`proj:${p.id}`}>{p.title}</option>)}</optgroup>
                  <optgroup label="Tâches">{allTasks.map((t) => <option key={t.id} value={`task:${t.id}`}>{t.title}</option>)}</optgroup>
                </select>
              </Field>
            </div>

            <Field T={T} label="Titre">
              <input className={inputCls} value={entryForm.title} autoFocus onChange={(e) => setEntryForm({ ...entryForm, title: e.target.value })} placeholder="Ex. Audit SSL" />
            </Field>
            <div className="grid grid-cols-2 gap-3">
              <Field T={T} label="Étiquette"><input className={inputCls} value={entryForm.tag} onChange={(e) => setEntryForm({ ...entryForm, tag: e.target.value })} /></Field>
              <Field T={T} label="Couleur">
                <select className={inputCls} value={entryForm.color} onChange={(e) => setEntryForm({ ...entryForm, color: e.target.value })}>
                  {COLOR_OPTIONS.map((c) => <option key={c.value} value={c.value}>{c.name}</option>)}
                </select>
              </Field>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <Field T={T} label="Collaborateur">
                <input className={inputCls} list="collab-list" value={entryForm.assignee} onChange={(e) => setEntryForm({ ...entryForm, assignee: e.target.value })} />
              </Field>
              <Field T={T} label="Durée (jours)">
                <input type="number" step="0.5" min="0.5" className={inputCls} value={entryForm.duration} onChange={(e) => setEntryForm({ ...entryForm, duration: e.target.value })} />
              </Field>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <Field T={T} label="Date"><input type="date" className={inputCls} value={entryForm.startDate} onChange={(e) => setEntryForm({ ...entryForm, startDate: e.target.value })} /></Field>
              <Field T={T} label="Créneau">
                <select className={inputCls} value={entryForm.slot} onChange={(e) => setEntryForm({ ...entryForm, slot: e.target.value })}>
                  <option value="AM">☀ Matin</option>
                  <option value="PM">☾ Après-midi</option>
                </select>
              </Field>
            </div>
          </div>
        </Modal>
      ) : null}

      {editingEntry ? (
        <Modal T={T} title="Entrée de planning" subtitle={`${editingEntry.assignee} · ${formatDayShort(editingEntry.startDate)}`}
          onClose={() => setEditingEntry(null)}
          footer={<>
            <button type="button" className="text-xs font-bold text-rose-400" onClick={() => deleteEntry(editingEntry.id)}>Supprimer</button>
            <div className="flex gap-2">
              <button type="button" className={btnGhost} onClick={() => duplicateEntry(editingEntry)}>Dupliquer</button>
              <button type="button" className={btnPrimary} onClick={() => saveEntry(editingEntry)}>Enregistrer</button>
            </div>
          </>}>
          <div className="space-y-3">
            <Field T={T} label="Titre"><input className={inputCls} value={editingEntry.title} onChange={(e) => setEditingEntry({ ...editingEntry, title: e.target.value })} /></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field T={T} label="Date"><input type="date" className={inputCls} value={editingEntry.startDate} onChange={(e) => setEditingEntry({ ...editingEntry, startDate: e.target.value })} /></Field>
              <Field T={T} label="Créneau">
                <select className={inputCls} value={editingEntry.slot} onChange={(e) => setEditingEntry({ ...editingEntry, slot: e.target.value })}>
                  <option value="AM">☀ Matin</option>
                  <option value="PM">☾ Après-midi</option>
                </select>
              </Field>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <Field T={T} label="Durée (jours)"><input type="number" step="0.5" min="0.5" className={inputCls} value={editingEntry.duration} onChange={(e) => setEditingEntry({ ...editingEntry, duration: Number(e.target.value) })} /></Field>
              <Field T={T} label="Collaborateur"><input className={inputCls} list="collab-list" value={editingEntry.assignee} onChange={(e) => setEditingEntry({ ...editingEntry, assignee: e.target.value })} /></Field>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <Field T={T} label="Étiquette"><input className={inputCls} value={editingEntry.tag} onChange={(e) => setEditingEntry({ ...editingEntry, tag: e.target.value })} /></Field>
              <Field T={T} label="Couleur">
                <select className={inputCls} value={editingEntry.color} onChange={(e) => setEditingEntry({ ...editingEntry, color: e.target.value })}>
                  {COLOR_OPTIONS.map((c) => <option key={c.value} value={c.value}>{c.name}</option>)}
                </select>
              </Field>
            </div>
            {editingEntry.duration > 0.5 ? (
              <button type="button" className={`w-full ${btnGhost}`} onClick={() => openSplit(editingEntry)}>Scinder en tranches de 0,5 j</button>
            ) : null}
          </div>
        </Modal>
      ) : null}

      {splitEntry ? (
        <Modal T={T} title="Scinder l’entrée" subtitle={`${splitEntry.title} · ${splitEntry.duration} j au total`} onClose={() => setSplitEntry(null)}
          footer={<>
            <button type="button" className={`text-[11px] font-bold text-indigo-400`} onClick={() => setSplitSegments([...splitSegments, 0.5])}>+ Ajouter une tranche</button>
            <div className="flex gap-2">
              <button type="button" className={btnGhost} onClick={() => setSplitEntry(null)}>Annuler</button>
              <button type="button" className={btnPrimary} onClick={applySplit}>Scinder</button>
            </div>
          </>}>
          <div className="space-y-2">
            {splitSegments.map((seg, idx) => (
              <div key={idx} className={`flex items-center gap-2 rounded-xl border px-3 py-2 ${T.border} ${T.sub}`}>
                <span className={`w-16 text-[11px] font-bold ${T.muted}`}>Tranche {idx + 1}</span>
                <input type="number" step="0.5" min="0.5" className={`${inputCls} flex-1 font-mono`} value={seg}
                  onChange={(e) => { const next = [...splitSegments]; next[idx] = Number(e.target.value); setSplitSegments(next); }} />
                {splitSegments.length > 2 ? (
                  <button type="button" className="px-2 text-xs font-bold text-rose-400" onClick={() => setSplitSegments(splitSegments.filter((_, i) => i !== idx))}>✕</button>
                ) : null}
              </div>
            ))}
            {(() => {
              const sum = splitSegments.reduce((a, b) => a + Number(b), 0);
              const ok = Math.abs(sum - splitEntry.duration) < 0.001;
              return (
                <div className={`flex items-center justify-between rounded-xl border px-3 py-2 text-[11px] ${T.border} ${T.sub}`}>
                  <span className={T.muted}>Total des tranches</span>
                  <span className={`font-mono font-bold ${ok ? 'text-emerald-400' : 'text-rose-400'}`}>{sum} / {splitEntry.duration} j</span>
                </div>
              );
            })()}
            <p className={`text-[11px] ${T.muted}`}>Les tranches s'enchaînent automatiquement de demi-journée en demi-journée. Le Kanban et la roadmap ne sont pas modifiés.</p>
          </div>
        </Modal>
      ) : null}

      {projectForm ? (
        <Modal T={T} title={projectForm.id ? 'Modifier le projet' : 'Nouveau projet'} onClose={() => setProjectForm(null)}
          footer={<>
            <span className={`text-[11px] ${T.muted}`}>Les barres restent déplaçables à la souris.</span>
            <div className="flex gap-2">
              <button type="button" className={btnGhost} onClick={() => setProjectForm(null)}>Annuler</button>
              <button type="button" className={btnPrimary} onClick={() => saveProject(projectForm)}>{projectForm.id ? 'Enregistrer' : 'Créer le projet'}</button>
            </div>
          </>}>
          <div className="space-y-3">
            <Field T={T} label="Nom du projet"><input className={inputCls} autoFocus value={projectForm.title} onChange={(e) => setProjectForm({ ...projectForm, title: e.target.value })} placeholder="Ex. Portail client v2" /></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field T={T} label="Catégorie"><input className={inputCls} value={projectForm.category} onChange={(e) => setProjectForm({ ...projectForm, category: e.target.value })} /></Field>
              <Field T={T} label="Couleur">
                <select className={inputCls} value={projectForm.color} onChange={(e) => setProjectForm({ ...projectForm, color: e.target.value })}>
                  {COLOR_OPTIONS.map((c) => <option key={c.value} value={c.value}>{c.name}</option>)}
                </select>
              </Field>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <Field T={T} label="Début"><input type="date" className={inputCls} value={projectForm.startDate} onChange={(e) => setProjectForm({ ...projectForm, startDate: e.target.value })} /></Field>
              <Field T={T} label="Durée (jours)"><input type="number" min="1" className={inputCls} value={projectForm.duration} onChange={(e) => setProjectForm({ ...projectForm, duration: e.target.value })} /></Field>
            </div>
          </div>
        </Modal>
      ) : null}

      {(taskForm || editingTask) ? (() => {
        const form = taskForm || editingTask;
        const setForm = taskForm ? setTaskForm : setEditingTask;
        return (
          <Modal T={T} title={form.id ? 'Modifier la tâche' : 'Nouvelle tâche'} onClose={() => { setTaskForm(null); setEditingTask(null); }}
            footer={<>
              {form.id ? <button type="button" className="text-xs font-bold text-rose-400" onClick={() => deleteTask(form.id)}>Supprimer</button> : <span />}
              <div className="flex gap-2">
                <button type="button" className={btnGhost} onClick={() => { setTaskForm(null); setEditingTask(null); }}>Annuler</button>
                <button type="button" className={btnPrimary} onClick={() => saveTask(form)}>{form.id ? 'Enregistrer' : 'Créer la tâche'}</button>
              </div>
            </>}>
            <div className="space-y-3">
              {!form.id ? (
                <Field T={T} label="Projet">
                  <select className={inputCls} value={form.projectId} onChange={(e) => setForm({ ...form, projectId: e.target.value })}>
                    {projects.map((p) => <option key={p.id} value={p.id}>{p.title}</option>)}
                  </select>
                </Field>
              ) : null}
              <Field T={T} label="Titre"><input className={inputCls} autoFocus value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} /></Field>
              <div className="grid grid-cols-2 gap-3">
                <Field T={T} label="Assigné à"><input className={inputCls} list="collab-list" value={form.assignee} onChange={(e) => setForm({ ...form, assignee: e.target.value })} /></Field>
                <Field T={T} label="Priorité">
                  <select className={inputCls} value={form.priority} onChange={(e) => setForm({ ...form, priority: e.target.value })}>
                    {PRIORITIES.map((p) => <option key={p} value={p}>{PRIORITY_META[p].label}</option>)}
                  </select>
                </Field>
              </div>
              <div className="grid grid-cols-3 gap-3">
                <Field T={T} label="Début"><input type="date" className={inputCls} value={form.startDate} onChange={(e) => setForm({ ...form, startDate: e.target.value })} /></Field>
                <Field T={T} label="Durée (j)"><input type="number" step="0.5" min="0.5" className={inputCls} value={form.duration} onChange={(e) => setForm({ ...form, duration: Number(e.target.value) })} /></Field>
                <Field T={T} label="Statut">
                  <select className={inputCls} value={form.status} onChange={(e) => setForm({ ...form, status: e.target.value })}>
                    {STATUSES.map((s) => <option key={s} value={s}>{STATUS_META[s].label}</option>)}
                  </select>
                </Field>
              </div>
              <Field T={T} label="Notes">
                <textarea rows="3" className={inputCls} value={form.notes || ''} onChange={(e) => setForm({ ...form, notes: e.target.value })} placeholder="Contexte, lien, critère d'acceptation…" />
              </Field>
            </div>
          </Modal>
        );
      })() : null}

      {isConfigOpen ? (
        <Modal T={T} title="Synchronisation & sauvegardes" subtitle="Vos données restent dans ce navigateur tant que vous ne les envoyez pas." onClose={() => setIsConfigOpen(false)}
          footer={<>
            <span className={`text-[11px] ${ghStatus ? 'text-indigo-400' : T.muted}`}>{ghStatus || 'Jeton stocké localement, jamais transmis ailleurs qu’à GitHub.'}</span>
            <button type="button" className={btnGhost} onClick={() => setIsConfigOpen(false)}>Fermer</button>
          </>}>
          <div className="space-y-4">
            <div className="flex gap-2">
              <button type="button" className={`flex-1 ${btnGhost}`} onClick={exportJson}>Exporter en JSON</button>
              <button type="button" className={`flex-1 ${btnGhost}`} onClick={() => fileInputRef.current && fileInputRef.current.click()}>Importer un JSON</button>
              <input ref={fileInputRef} type="file" accept="application/json,.json" className="hidden"
                onChange={(e) => { importJson(e.target.files && e.target.files[0]); e.target.value = ''; }} />
            </div>

            <div className={`space-y-3 rounded-xl border p-3 ${T.border} ${T.sub}`}>
              <h4 className="text-[11px] font-extrabold uppercase tracking-wide">Dépôt GitHub</h4>
              <div className="grid grid-cols-2 gap-3">
                <Field T={T} label="Propriétaire"><input className={inputCls} value={gh.owner} onChange={(e) => setGh({ ...gh, owner: e.target.value.trim() })} placeholder="mon-compte" /></Field>
                <Field T={T} label="Dépôt"><input className={inputCls} value={gh.repo} onChange={(e) => setGh({ ...gh, repo: e.target.value.trim() })} placeholder="auraplan" /></Field>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <Field T={T} label="Branche"><input className={inputCls} value={gh.branch} onChange={(e) => setGh({ ...gh, branch: e.target.value.trim() })} /></Field>
                <Field T={T} label="Chemin du fichier"><input className={inputCls} value={gh.path} onChange={(e) => setGh({ ...gh, path: e.target.value.trim() })} /></Field>
              </div>
              <Field T={T} label="Jeton d'accès (scope repo)" hint="Un jeton fin (fine-grained) limité à ce dépôt suffit.">
                <input type="password" className={inputCls} value={gh.token} onChange={(e) => setGh({ ...gh, token: e.target.value.trim() })} placeholder="github_pat_…" />
              </Field>
              <div className="flex gap-2">
                <button type="button" className={`flex-1 ${btnGhost}`} onClick={ghPull}>Récupérer</button>
                <button type="button" className={`flex-1 ${btnPrimary}`} onClick={ghPush}>Envoyer</button>
              </div>
            </div>
          </div>
        </Modal>
      ) : null}

      {isHelpOpen ? (
        <Modal T={T} title="Prise en main" onClose={() => setIsHelpOpen(false)}
          footer={<><span className={`text-[11px] ${T.muted}`}>Version autonome, aucune donnée ne quitte le navigateur.</span>
            <button type="button" className={btnGhost} onClick={() => setIsHelpOpen(false)}>Fermer</button></>}>
          <ul className="space-y-2 text-[12px] leading-relaxed">
            <li><strong>Planning</strong> — cliquez une demi-case (matin ou après-midi) pour planifier. Glissez un bloc pour le déplacer, ses bords pour l'allonger : tout s'aimante au 0,5 jour.</li>
            <li><strong>Superposition</strong> — plusieurs entrées le même créneau s'empilent en sous-lignes ; les créneaux surchargés apparaissent hachurés en rouge.</li>
            <li><strong>Roadmap</strong> — dépliez un projet pour déplacer ses tâches, cochez-les pour les terminer. À 100 %, les confettis se déclenchent.</li>
            <li><strong>Kanban</strong> — glissez une carte d'une colonne à l'autre pour changer son statut.</li>
            <li className="pt-2"><strong>Raccourcis</strong> — <span className="font-mono">1 2 3</span> changent de vue, <span className="font-mono">T</span> recentre sur aujourd'hui, <span className="font-mono">F</span> affiche toute la période, <span className="font-mono">Ctrl+Z</span> annule, <span className="font-mono">Échap</span> ferme.</li>
          </ul>
        </Modal>
      ) : null}

      <datalist id="collab-list">{collaborators.map((c) => <option key={c} value={c} />)}</datalist>
      <Toasts items={toasts} onDismiss={dismissToast} />
    </div>
  );
}

/* --------------------------------- Montage --------------------------------- */
(function mount() {
  const root = document.getElementById('root');
  if (!root) return;
  try {
    ReactDOM.createRoot(root).render(
      <ErrorBoundary>
        <AuraPlanApp />
      </ErrorBoundary>
    );
  } catch (err) {
    root.innerHTML = '<div class="boot-error"><h1 style="font-size:18px;font-weight:800;margin:0 0 8px">Démarrage impossible</h1>'
      + '<p style="color:#94A3B8;font-size:13px;margin:0">' + String(err && err.message) + '</p></div>';
  }
})();
</script>

<script>
  // Filet de sécurité : si un CDN n'a pas répondu, on l'explique au lieu d'afficher une page blanche.
  window.setTimeout(function () {
    var root = document.getElementById('root');
    if (!root || root.childElementCount > 0) return;
    var missing = [];
    if (!window.React) missing.push('React');
    if (!window.ReactDOM) missing.push('ReactDOM');
    if (!window.Babel) missing.push('Babel');
    if (!window.tailwind) missing.push('Tailwind');
    root.innerHTML = '<div class="boot-error">'
      + '<h1 style="font-size:18px;font-weight:800;margin:0 0 8px;color:#E2E8F0">L\'application n\'a pas pu démarrer</h1>'
      + '<p style="color:#94A3B8;font-size:13px;line-height:1.6;margin:0 0 12px">'
      + (missing.length
        ? 'Ces bibliothèques n\'ont pas pu être téléchargées : <strong>' + missing.join(', ') + '</strong>. Vérifiez votre connexion, un bloqueur de scripts ou une politique de sécurité (CSP) qui empêcherait les CDN de se charger.'
        : 'Le script a échoué au démarrage. Ouvrez la console du navigateur pour voir le détail.')
      + '</p><p style="color:#64748B;font-size:12px;margin:0">Astuce : ouvrez le fichier via une URL http(s) plutôt qu\'en double-clic si votre navigateur restreint les fichiers locaux.</p></div>';
  }, 6000);
</script>
</body>
</html>
