<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraPlan Studio - Project & Resource OS</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            aura: {
              bg: '#080C14',
              card: '#111827',
              border: '#1F293D',
              accent: '#6366F1'
            }
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Yjs + y-webrtc -->
  <script src="https://cdn.jsdelivr.net/npm/yjs@13/dist/yjs.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/y-webrtc@10/dist/y-webrtc.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    .dragging-active { cursor: grabbing !important; user-select: none !important; }
  </style>
</head>
<body class="font-sans antialiased min-h-screen overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // --- HELPERS UTILS & DATES ---
    const utf8_to_b64 = (str) => window.btoa(unescape(encodeURIComponent(str)));
    const b64_to_utf8 = (str) => decodeURIComponent(escape(window.atob(str)));

    const parseDate = (str) => new Date(str + 'T00:00:00');
    const formatDateIso = (d) => d.toISOString().split('T')[0];
    const addDays = (d, days) => { const r = new Date(d); r.setDate(r.getDate() + days); return r; };
    const diffDays = (d1, d2) => Math.round((d1 - d2) / (1000 * 60 * 60 * 24));

    const formatDateFr = (isoStr) => {
      if (!isoStr) return '';
      const d = parseDate(isoStr);
      return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    };

    const getMonday = (d) => {
      const date = new Date(d.getTime());
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    };

    const getWeekNumber = (d) => {
      const date = new Date(d.getTime());
      date.setHours(0, 0, 0, 0);
      date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
      const week1 = new Date(date.getFullYear(), 0, 4);
      return 1 + Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
    };

    const triggerConfetti = () => {
      if (window.confetti) {
        window.confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });
      }
    };

    const MONTH_NAMES_FR = [
      'Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin',
      'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'
    ];

    const COLOR_OPTIONS = [
      { name: 'Indigo Aura', value: 'from-indigo-600 to-violet-600' },
      { name: 'Cyber Neon', value: 'from-purple-600 to-fuchsia-600' },
      { name: 'Émeraude Deep', value: 'from-emerald-500 to-teal-600' },
      { name: 'Ambre Chaud', value: 'from-amber-500 to-orange-600' },
      { name: 'Rose Flash', value: 'from-rose-600 to-pink-600' },
      { name: 'Cyan Futur', value: 'from-cyan-500 to-blue-600' }
    ];

    const TODAY_STR = formatDateIso(new Date());

    // DONNÉES INITIALES
    const INITIAL_PROJECTS = [
      {
        id: 'proj-1',
        title: 'Refonte Microservices Cloud',
        category: 'Infrastructure',
        startDate: TODAY_STR,
        duration: 14,
        color: 'from-indigo-600 to-violet-600',
        tasks: [
          { id: 't-1-1', title: 'Provisionner clusters Kubernetes', assignee: 'Alexandre M.', startDate: TODAY_STR, duration: 4, status: 'DONE' },
          { id: 't-1-2', title: 'Security Audit & Ingress Controller', assignee: 'Alexandre M.', startDate: TODAY_STR, duration: 3, status: 'IN_PROGRESS' }
        ]
      }
    ];

    const INITIAL_PLANNING_ENTRIES = [
      { id: 'pe-1', title: 'Infra K8s', tag: 'Infrastructure', color: 'from-indigo-600 to-violet-600', assignee: 'Alexandre M.', startDate: TODAY_STR, slot: 'AM', duration: 1.5 },
      { id: 'pe-2', title: 'Audit SSL', tag: 'Infrastructure', color: 'from-indigo-600 to-violet-600', assignee: 'Alexandre M.', startDate: formatDateIso(addDays(new Date(), 1)), slot: 'PM', duration: 0.5 },
      { id: 'pe-3', title: 'UI React', tag: 'Frontend', color: 'from-purple-600 to-fuchsia-600', assignee: 'Sophie T.', startDate: TODAY_STR, slot: 'AM', duration: 2.5 }
    ];

    function AuraPlanApp() {
      const [isDark, setIsDark] = useState(true);

      const [projects, setProjects] = useState(() => {
        const saved = localStorage.getItem('auraplan_projects_v15');
        return saved ? JSON.parse(saved) : INITIAL_PROJECTS;
      });

      const [planningEntries, setPlanningEntries] = useState(() => {
        const saved = localStorage.getItem('auraplan_entries_v15');
        return saved ? JSON.parse(saved) : INITIAL_PLANNING_ENTRIES;
      });

      const [activeTab, setActiveTab] = useState('planning'); // 'roadmap' | 'kanban' | 'planning'
      const [selectedProjectId, setSelectedProjectId] = useState('proj-1');
      const [editingTask, setEditingTask] = useState(null);
      const [editingPlanningEntry, setEditingPlanningEntry] = useState(null);

      const [splittingPlanningEntry, setSplittingPlanningEntry] = useState(null);
      const [splitSegments, setSplitSegments] = useState([0.5, 0.5]);

      const [columnWidth, setColumnWidth] = useState(120);

      const [isLeftPanelOpen, setIsLeftPanelOpen] = useState(true);
      const [isRightPanelOpen, setIsRightPanelOpen] = useState(true);

      const [isAddTaskFolded, setIsAddTaskFolded] = useState(true);
      const [isProjectEditFolded, setIsProjectEditFolded] = useState(true);

      const [draggingKanbanTaskId, setDraggingKanbanTaskId] = useState(null);
      const [dragOverColumn, setDragOverColumn] = useState(null);

      const [isProjectModalOpen, setIsProjectModalOpen] = useState(false);
      const [isConfigModalOpen, setIsConfigModalOpen] = useState(false);
      const [isKanbanAddTaskModalOpen, setIsKanbanAddTaskModalOpen] = useState(false);
      const [isCreatePlanningModalOpen, setIsCreatePlanningModalOpen] = useState(false);

      const [newProjectForm, setNewProjectForm] = useState({
        title: '', category: 'Tech', startDate: TODAY_STR, duration: 10, color: 'from-indigo-600 to-violet-600'
      });
      const [newTaskForm, setNewTaskForm] = useState({
        projectId: '', title: '', assignee: 'Alexandre M.', startDate: TODAY_STR, duration: 2, status: 'TODO'
      });
      const [newPlanningForm, setNewPlanningForm] = useState({
        title: '', tag: 'Général', color: 'from-indigo-600 to-violet-600', assignee: 'Alexandre M.', startDate: TODAY_STR, slot: 'AM', duration: 0.5
      });

      // DRAG ENGINES (Smooth & Snap)
      const [dragState, setDragState] = useState(null); 
      const [planningDragState, setPlanningDragState] = useState(null); 
      const hasDraggedPlanningTask = useRef(false);
      const dragAnimRef = useRef(null);

      const [ghConfig, setGhConfig] = useState(() => {
        const saved = localStorage.getItem('gh_config');
        return saved ? JSON.parse(saved) : { owner: '', repo: '', path: 'data.json', token: '' };
      });
      const [syncStatus, setSyncStatus] = useState('');
      const [connectedPeers, setConnectedPeers] = useState(1);
      const yDocRef = useRef(null);

      useEffect(() => {
        if (isDark) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [isDark]);

      // CALENDRIER BORNES (AVEC MARGE SÉCURISÉE)
      const { timelineStartDate, totalTimelineDays } = useMemo(() => {
        let minDate = parseDate(TODAY_STR);
        let maxDate = addDays(parseDate(TODAY_STR), 14);

        if (activeTab === 'roadmap' || activeTab === 'kanban') {
          projects.forEach(p => {
            const pStart = parseDate(p.startDate);
            const pEnd = addDays(pStart, Math.ceil(p.duration));
            if (pStart < minDate) minDate = pStart;
            if (pEnd > maxDate) maxDate = pEnd;
          });
        } else if (activeTab === 'planning') {
          planningEntries.forEach(pe => {
            const pStart = parseDate(pe.startDate);
            const pEnd = addDays(pStart, Math.ceil(pe.duration));
            if (pStart < minDate) minDate = pStart;
            if (pEnd > maxDate) maxDate = pEnd;
          });
        }

        const start = getMonday(addDays(minDate, -3));
        const requiredDays = diffDays(addDays(maxDate, 5), start);
        return { timelineStartDate: start, totalTimelineDays: Math.max(28, requiredDays) };
      }, [projects, planningEntries, activeTab]);

      const timelineWeeks = useMemo(() => {
        const weeksMap = [];
        let currentWeekNum = null;
        let currentWeekObj = null;

        for (let i = 0; i < totalTimelineDays; i++) {
          const dayDate = addDays(timelineStartDate, i);
          const weekNum = getWeekNumber(dayDate);

          if (weekNum !== currentWeekNum) {
            currentWeekNum = weekNum;
            currentWeekObj = { weekNum, startDate: dayDate, daysCount: 0 };
            weeksMap.push(currentWeekObj);
          }
          currentWeekObj.daysCount++;
        }
        return weeksMap;
      }, [timelineStartDate, totalTimelineDays]);

      const allFlatTasks = useMemo(() => {
        const list = [];
        projects.forEach(p => {
          const safeProj = { id: p.id, title: p.title, category: p.category, color: p.color };
          (p.tasks || []).forEach(t => { list.push({ ...t, project: safeProj }); });
        });
        return list;
      }, [projects]);

      const kanbanGroupedTasks = useMemo(() => {
        const map = new Map();
        allFlatTasks.forEach(task => {
          const rootKey = task.id;
          if (!map.has(rootKey)) map.set(rootKey, { ...task });
        });
        return Array.from(map.values());
      }, [allFlatTasks]);

      const collaborators = useMemo(() => {
        const set = new Set();
        planningEntries.forEach(pe => { if (pe.assignee) set.add(pe.assignee); });
        allFlatTasks.forEach(t => { if (t.assignee) set.add(t.assignee); });
        if (set.size === 0) set.add('Alexandre M.');
        return Array.from(set);
      }, [planningEntries, allFlatTasks]);

      useEffect(() => localStorage.setItem('auraplan_projects_v15', JSON.stringify(projects)), [projects]);
      useEffect(() => localStorage.setItem('auraplan_entries_v15', JSON.stringify(planningEntries)), [planningEntries]);
      useEffect(() => localStorage.setItem('gh_config', JSON.stringify(ghConfig)), [ghConfig]);

      useEffect(() => {
        try {
          if (!window.Y || !window.YWebrtc) return;
          const ydoc = new window.Y.Doc();
          const provider = new window.YWebrtc.WebrtcProvider('auraplan-studio-room-2026', ydoc);
          const yProjects = ydoc.getArray('projects');
          const yPlanning = ydoc.getArray('planningEntries');

          yProjects.observe(() => {
            const remote = yProjects.toArray();
            if (remote.length > 0) setProjects(remote);
          });

          yPlanning.observe(() => {
            const remote = yPlanning.toArray();
            if (remote.length > 0) setPlanningEntries(remote);
          });

          provider.on('peers', (e) => setConnectedPeers(e.webrtcPeers.length + 1));
          yDocRef.current = { ydoc, yProjects, yPlanning, provider };

          return () => { provider.destroy(); ydoc.destroy(); };
        } catch (e) {
          console.warn("Yjs P2P non initialisé", e);
        }
      }, []);

      const broadcastProjects = useCallback((updated) => {
        setProjects(updated);
        if (yDocRef.current && yDocRef.current.yProjects) {
          yDocRef.current.ydoc.transact(() => {
            yDocRef.current.yProjects.delete(0, yDocRef.current.yProjects.length);
            yDocRef.current.yProjects.insert(0, updated);
          });
        }
      }, []);

      const broadcastPlanning = useCallback((updated) => {
        setPlanningEntries(updated);
        if (yDocRef.current && yDocRef.current.yPlanning) {
          yDocRef.current.ydoc.transact(() => {
            yDocRef.current.yPlanning.delete(0, yDocRef.current.yPlanning.length);
            yDocRef.current.yPlanning.insert(0, updated);
          });
        }
      }, []);

      const getProjectProgress = (project) => {
        if (!project || !project.tasks || project.tasks.length === 0) return 0;
        const doneCount = project.tasks.filter(t => t.status === 'DONE').length;
        return Math.round((doneCount / project.tasks.length) * 100);
      };

      const fitAllTasks = useCallback(() => {
        const viewport = document.getElementById('timeline-viewport');
        if (!viewport) return;
        const offsetLeft = activeTab === 'planning' ? 240 : 0;
        const containerWidth = viewport.clientWidth - offsetLeft - 20;
        const computedWidth = Math.max(24, Math.floor(containerWidth / totalTimelineDays));
        setColumnWidth(computedWidth);
        viewport.scrollLeft = 0;
      }, [totalTimelineDays, activeTab]);

      const focusCurrentSprint = useCallback(() => {
        const currentMonday = getMonday(new Date());
        const viewport = document.getElementById('timeline-viewport');
        if (!viewport) return;
        const containerWidth = viewport.clientWidth - 240 - 20;
        const computedWidth = Math.max(60, Math.floor(containerWidth / 14));
        setColumnWidth(computedWidth);

        const daysDiff = diffDays(currentMonday, timelineStartDate);
        if (daysDiff >= 0) viewport.scrollLeft = daysDiff * computedWidth;
      }, [timelineStartDate]);

      // Calcul des Lignes de Planning
      const calculateCollaboratorLanes = (personEntries) => {
        const sorted = [...personEntries].sort((a, b) => {
          const tA = parseDate(a.startDate).getTime() + (a.slot === 'PM' ? 43200000 : 0);
          const tB = parseDate(b.startDate).getTime() + (b.slot === 'PM' ? 43200000 : 0);
          return tA - tB;
        });

        const lanes = [];
        const placedEntries = sorted.map(entry => {
          const startDays = diffDays(parseDate(entry.startDate), timelineStartDate) + (entry.slot === 'PM' ? 0.5 : 0);
          const endDays = startDays + Number(entry.duration);

          let laneIndex = lanes.findIndex(freeDay => freeDay <= startDays);
          if (laneIndex === -1) {
            laneIndex = lanes.length;
            lanes.push(endDays);
          } else {
            lanes[laneIndex] = endDays;
          }
          return { ...entry, laneIndex, startDays, endDays };
        });

        const totalLanes = Math.max(1, lanes.length);
        return { placedEntries, totalLanes, rowHeight: totalLanes * 32 + 16 };
      };

      // ROADMAP DRAG & DROP SMOOTH
      const handleRoadmapMouseDown = (e, projectId, action) => {
        e.stopPropagation(); e.preventDefault();
        const proj = projects.find(p => p.id === projectId);
        if (!proj) return;

        setDragState({
          projectId, action, startX: e.clientX,
          initialStartDays: diffDays(parseDate(proj.startDate), timelineStartDate),
          initialDuration: proj.duration,
          pixelOffset: 0,
          snappedStartDays: diffDays(parseDate(proj.startDate), timelineStartDate),
          snappedDuration: proj.duration
        });
      };

      useEffect(() => {
        const handleMouseMove = (e) => {
          if (!dragState) return;
          if (dragAnimRef.current) cancelAnimationFrame(dragAnimRef.current);

          dragAnimRef.current = requestAnimationFrame(() => {
            const deltaX = e.clientX - dragState.startX;
            const dayDelta = Math.round(deltaX / columnWidth);

            if (dragState.action === 'move') {
              const snapped = Math.max(0, dragState.initialStartDays + dayDelta);
              setDragState(prev => ({ ...prev, pixelOffset: deltaX, snappedStartDays: snapped }));
            } else if (dragState.action === 'resize-left') {
              const actualDays = Math.min(dayDelta, dragState.initialDuration - 1);
              const snapped = Math.max(0, dragState.initialStartDays + actualDays);
              const dur = dragState.initialDuration - actualDays;
              setDragState(prev => ({ ...prev, pixelOffset: deltaX, snappedStartDays: snapped, snappedDuration: dur }));
            } else if (dragState.action === 'resize-right') {
              const dur = Math.max(1, dragState.initialDuration + dayDelta);
              setDragState(prev => ({ ...prev, pixelOffset: deltaX, snappedDuration: dur }));
            }
          });
        };

        const handleMouseUp = () => {
          if (dragState) {
            const newStartDate = formatDateIso(addDays(timelineStartDate, dragState.snappedStartDays));
            const updated = projects.map(p => p.id === dragState.projectId ? { ...p, startDate: newStartDate, duration: dragState.snappedDuration } : p);
            broadcastProjects(updated);
          }
          setDragState(null);
        };

        if (dragState) {
          window.addEventListener('mousemove', handleMouseMove);
          window.addEventListener('mouseup', handleMouseUp);
        }
        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseup', handleMouseUp);
        };
      }, [dragState, columnWidth, projects, timelineStartDate, broadcastProjects]);

      // PLANNING DRAG & DROP SMOOTH
      const handlePlanningMouseDown = (e, entry, action = 'move') => {
        e.stopPropagation(); e.preventDefault();
        hasDraggedPlanningTask.current = false;

        const startDays = diffDays(parseDate(entry.startDate), timelineStartDate) + (entry.slot === 'PM' ? 0.5 : 0);

        setPlanningDragState({
          entryId: entry.id, action, startX: e.clientX,
          initialStartDays: startDays, initialDuration: entry.duration,
          pixelOffset: 0, snappedStartDays: startDays, snappedDuration: entry.duration
        });
      };

      useEffect(() => {
        const handleMouseMovePlanning = (e) => {
          if (!planningDragState) return;
          if (Math.abs(e.clientX - planningDragState.startX) > 3) hasDraggedPlanningTask.current = true;
          if (dragAnimRef.current) cancelAnimationFrame(dragAnimRef.current);

          dragAnimRef.current = requestAnimationFrame(() => {
            const deltaX = e.clientX - planningDragState.startX;
            const halfWidth = columnWidth / 2;
            const halfSlotsDelta = Math.round(deltaX / halfWidth);

            if (planningDragState.action === 'move') {
              const snapped = Math.max(0, planningDragState.initialStartDays + halfSlotsDelta * 0.5);
              setPlanningDragState(prev => ({ ...prev, pixelOffset: deltaX, snappedStartDays: snapped }));
            } else if (planningDragState.action === 'resize-right') {
              const dur = Math.max(0.5, planningDragState.initialDuration + halfSlotsDelta * 0.5);
              setPlanningDragState(prev => ({ ...prev, pixelOffset: deltaX, snappedDuration: dur }));
            } else if (planningDragState.action === 'resize-left') {
              const actualShift = Math.min(halfSlotsDelta * 0.5, planningDragState.initialDuration - 0.5);
              const snappedStart = Math.max(0, planningDragState.initialStartDays + actualShift);
              const dur = Math.max(0.5, planningDragState.initialDuration - actualShift);
              setPlanningDragState(prev => ({ ...prev, pixelOffset: deltaX, snappedStartDays: snappedStart, snappedDuration: dur }));
            }
          });
        };

        const handleMouseUpPlanning = () => {
          if (planningDragState && hasDraggedPlanningTask.current) {
            const fullDays = Math.floor(planningDragState.snappedStartDays);
            const isPM = (planningDragState.snappedStartDays % 1) >= 0.45;
            const newStart = formatDateIso(addDays(timelineStartDate, fullDays));

            const updated = planningEntries.map(pe => pe.id === planningDragState.entryId ? {
              ...pe, startDate: newStart, slot: isPM ? 'PM' : 'AM', duration: planningDragState.snappedDuration
            } : pe);
            broadcastPlanning(updated);
          }
          setPlanningDragState(null);
        };

        if (planningDragState) {
          window.addEventListener('mousemove', handleMouseMovePlanning);
          window.addEventListener('mouseup', handleMouseUpPlanning);
        }
        return () => {
          window.removeEventListener('mousemove', handleMouseMovePlanning);
          window.removeEventListener('mouseup', handleMouseUpPlanning);
        };
      }, [planningDragState, columnWidth, planningEntries, timelineStartDate, broadcastPlanning]);

      // KANBAN DRAG
      const handleKanbanDragStart = (e, taskId) => {
        e.dataTransfer.setData('text/plain', taskId);
        e.dataTransfer.effectAllowed = 'move';
        setTimeout(() => setDraggingKanbanTaskId(taskId), 0); // Rend le ghost HTML5 transparent sans bugger le drag
      };
      const handleKanbanDragEnd = () => {
        setDraggingKanbanTaskId(null);
        setDragOverColumn(null);
      };
      const handleKanbanDrop = (e, targetStatus) => {
        e.preventDefault();
        const taskId = e.dataTransfer.getData('text/plain');
        if (taskId) {
          const updatedProjects = projects.map(p => ({
            ...p, tasks: (p.tasks || []).map(t => t.id === taskId ? { ...t, status: targetStatus } : t)
          }));
          broadcastProjects(updatedProjects);
        }
        handleKanbanDragEnd();
      };

      // CREATION PLANNING (DOUBLE CLIC)
      const handleCellDoubleClick = (person, dayDate, slot) => {
        setNewPlanningForm({
          title: '', tag: 'Général', color: 'from-indigo-600 to-violet-600',
          assignee: person, startDate: formatDateIso(dayDate), slot: slot, duration: 0.5, notes: ''
        });
        setIsCreatePlanningModalOpen(true);
      };

      const handleCreatePlanningEntry = (e) => {
        e.preventDefault();
        if (!newPlanningForm.title.trim()) return;
        const newEntry = { id: `pe-${Date.now()}`, ...newPlanningForm, duration: Number(newPlanningForm.duration) };
        broadcastPlanning([...planningEntries, newEntry]);
        setIsCreatePlanningModalOpen(false);
      };

      const handleDeletePlanningEntry = (entryId) => {
        broadcastPlanning(planningEntries.filter(pe => pe.id !== entryId));
        setEditingPlanningEntry(null);
      };

      // SCISSION PLANNING
      const executePlanningSplit = (e) => {
        e.preventDefault();
        if (!splittingPlanningEntry) return;

        const sum = splitSegments.reduce((a, b) => a + Number(b), 0);
        if (Math.abs(sum - splittingPlanningEntry.duration) > 0.01) {
          alert(`La somme des tranches (${sum}j) doit être égale à la durée initiale (${splittingPlanningEntry.duration}j).`);
          return;
        }

        const newEntries = [];
        let currDate = parseDate(splittingPlanningEntry.startDate);
        let currSlot = splittingPlanningEntry.slot || 'AM';

        splitSegments.forEach((segDuration, idx) => {
          newEntries.push({
            id: `pe-${Date.now()}-part-${idx}`,
            title: `${splittingPlanningEntry.title} (Partie ${idx + 1}/${splitSegments.length})`,
            tag: splittingPlanningEntry.tag || 'Planning',
            color: splittingPlanningEntry.color,
            assignee: splittingPlanningEntry.assignee,
            startDate: formatDateIso(currDate),
            slot: currSlot,
            duration: Number(segDuration)
          });

          const addedDays = Math.floor(segDuration);
          const remainder = segDuration % 1;
          
          currDate = addDays(currDate, addedDays);
          if (remainder >= 0.5) {
            if (currSlot === 'AM') currSlot = 'PM';
            else { currSlot = 'AM'; currDate = addDays(currDate, 1); }
          }
        });

        broadcastPlanning(planningEntries.filter(pe => pe.id !== splittingPlanningEntry.id).concat(newEntries));
        setSplittingPlanningEntry(null);
        setEditingPlanningEntry(null);
      };

      return (
        <div className={`flex flex-col h-screen overflow-hidden ${dragState || planningDragState ? 'dragging-active' : ''} ${isDark ? 'dark bg-aura-bg text-slate-100' : 'bg-slate-100 text-slate-900'}`}>
          
          {/* HEADER */}
          <header className={`border-b px-6 py-3 flex items-center justify-between shrink-0 ${isDark ? 'bg-aura-card border-aura-border' : 'bg-white border-slate-200 shadow-sm'}`}>
            <div className="flex items-center gap-6">
              <div className="flex items-center gap-3">

                              return (
                                <div key={i} style={{ width: `${columnWidth}px`, minWidth: `${columnWidth}px` }} className={`h-full border-r ${isMonday ? 'border-l-2 border-l-indigo-500/30' : ''} ${isToday ? 'bg-indigo-500/10 border-x-2 border-x-indigo-500/40' : 'border-r-slate-800/20'} flex relative`}>
                                  <div onClick={() => handleCellClickPlanning(person, dayDate, 'AM')} className="w-1/2 border-r border-slate-700/20 bg-amber-500/[0.03] hover:bg-indigo-500/20 transition cursor-pointer group flex justify-center pointer-events-auto items-center"><span className="text-[9px] font-bold text-amber-400 opacity-0 group-hover:opacity-100">+ AM</span></div>
                                  <div onClick={() => handleCellClickPlanning(person, dayDate, 'PM')} className="w-1/2 bg-indigo-500/[0.03] hover:bg-indigo-500/20 transition cursor-pointer group flex justify-center pointer-events-auto items-center"><span className="text-[9px] font-bold text-indigo-300 opacity-0 group-hover:opacity-100">+ PM</span></div>
                                </div>
                              );
                            })}
                          </div>

                          {/* Blocs Tâches Planning */}
                          <div className="relative w-full h-full z-10 pointer-events-none">
                            {placedEntries.map(entry => {
                              const isDraggingThis = planningDragState && planningDragState.entryId === entry.id;
                              
                              let leftPx = entry.startDays * columnWidth;
                              let widthPx = entry.duration * columnWidth;
                              const topPx = entry.laneIndex * 32 + 8; // Hauteur bloc 24px (h-6) + 8px margin = 32px
                              
                              let tooltipText = `${formatDateFr(entry.startDate)} (${entry.slot === 'PM' ? '🌙 PM' : '☀️ AM'}) • ${entry.duration}j`;

                              if (isDraggingThis) {
                                if (planningDragState.action === 'move') leftPx += planningDragState.pixelOffset;
                                else if (planningDragState.action === 'resize-right') widthPx += planningDragState.pixelOffset;
                                else if (planningDragState.action === 'resize-left') { leftPx += planningDragState.pixelOffset; widthPx -= planningDragState.pixelOffset; }
                                tooltipText = `${formatDateFr(planningDragState.snappedStartDate)} (${planningDragState.snappedSlot === 'PM' ? '🌙 PM' : '☀️ AM'}) • ${planningDragState.snappedDuration}j`;
                              }

                              return (
                                <React.Fragment key={entry.id}>
                                  {isDraggingThis && (
                                    <div style={{ left: `${planningDragState.snappedStartDays * columnWidth}px`, width: `${planningDragState.snappedDuration * columnWidth}px`, top: `${topPx}px` }} className="absolute h-6 rounded-md bg-indigo-950/80 border-2 border-dashed border-indigo-400 opacity-40 z-0 pointer-events-none" />
                                  )}
                                  <div
                                    style={{ left: `${leftPx}px`, width: `${widthPx}px`, top: `${topPx}px` }}
                                    onMouseDown={(e) => handlePlanningMouseDown(e, entry, 'move')}
                                    onClick={() => { if (!hasDraggedPlanningTask.current) setEditingPlanningEntry(entry); }}
                                    className={`absolute h-6 rounded-md bg-gradient-to-r ${entry.color || 'from-indigo-600 to-violet-600'} px-2 flex items-center justify-between text-[9px] font-bold text-white shadow-md cursor-grab active:cursor-grabbing hover:brightness-110 truncate border border-white/20 select-none group transition-shadow pointer-events-auto ${isDraggingThis ? 'ring-2 ring-indigo-400 z-30 scale-[1.02] shadow-xl opacity-95' : ''}`}
                                  >
                                    <div onMouseDown={(e) => handlePlanningMouseDown(e, entry, 'resize-left')} className="absolute left-0 top-0 bottom-0 w-2.5 cursor-ew-resize bg-white/30 opacity-0 group-hover:opacity-100 rounded-l-md hover:bg-white/70 transition" />
                                    
                                    <div className="truncate flex items-center justify-between w-full pointer-events-none">
                                      <span className="truncate flex items-center gap-1">
                                        <span>{entry.slot === 'PM' ? '🌙' : '☀️'}</span>
                                        <span className="truncate">{entry.title}</span>
                                      </span>
                                      {entry.duration > 0.5 && <span className="opacity-90 font-mono bg-black/40 px-1 rounded ml-1 shrink-0">{entry.duration}j</span>}
                                    </div>

                                    <div onMouseDown={(e) => handlePlanningMouseDown(e, entry, 'resize-right')} className="absolute right-0 top-0 bottom-0 w-2.5 cursor-ew-resize bg-white/30 opacity-0 group-hover:opacity-100 rounded-r-md hover:bg-white/70 transition" />
                                    
                                    {isDraggingThis && <div className="absolute -top-7 left-1/2 -translate-x-1/2 bg-slate-900 border border-indigo-500 text-slate-100 text-[10px] font-mono px-2 py-0.5 rounded shadow-2xl z-40 whitespace-nowrap">📅 {tooltipText}</div>}
                                  </div>
                                </React.Fragment>
                              );
                            })}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </div>

          {/* MODAL : CRÉATION DÉDIÉE AU PLANNING */}
          {isCreatePlanningModalOpen && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-aura-card border border-aura-border rounded-2xl p-6 w-full max-w-md shadow-2xl text-slate-100">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-base font-bold">+ Nouvelle Entrée au Planning</h3>
                  <button onClick={() => setIsCreatePlanningModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <form onSubmit={handleCreatePlanningEntry} className="space-y-4 text-xs">
                  <div className="p-3 bg-indigo-950/30 border border-indigo-500/30 rounded-xl space-y-1">
                    <label className="block font-bold text-indigo-300 text-[11px]">⚡ Copier un projet/tâche existant :</label>
                    <select 
                      onChange={(e) => {
                        const val = e.target.value;
                        if (!val) return;
                        const [type, id] = val.split(':');
                        if (type === 'proj') { const p = projects.find(item => item.id === id); if (p) applySuggestionToPlanningForm(p); } 
                        else if (type === 'task') { const t = allFlatTasks.find(item => item.id === id); if (t) applySuggestionToPlanningForm(t); }
                      }}
                      className="w-full bg-slate-900 border border-indigo-500/40 p-2 rounded-lg text-slate-200"
                    >
                      <option value="">-- Choisir un modèle --</option>
                      <optgroup label="Projets">{projects.map(p => <option key={p.id} value={`proj:${p.id}`}>{p.title}</option>)}</optgroup>
                      <optgroup label="Tâches">{allFlatTasks.map(t => <option key={t.id} value={`task:${t.id}`}>{t.title}</option>)}</optgroup>
                    </select>
                  </div>
                  <input type="text" required placeholder="Titre..." value={newPlanningForm.title} onChange={e => setNewPlanningForm({...newPlanningForm, title: e.target.value})} className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100 font-bold" />
                  <div className="grid grid-cols-2 gap-3">
                    <input type="text" placeholder="Tag..." value={newPlanningForm.tag} onChange={e => setNewPlanningForm({...newPlanningForm, tag: e.target.value})} className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100" />
                    <select value={newPlanningForm.color} onChange={e => setNewPlanningForm({...newPlanningForm, color: e.target.value})} className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100">{COLOR_OPTIONS.map(c => <option key={c.value} value={c.value}>{c.name}</option>)}</select>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <input type="date" required value={newPlanningForm.startDate} onChange={e => setNewPlanningForm({...newPlanningForm, startDate: e.target.value})} className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100" />
                    <select value={newPlanningForm.slot} onChange={e => setNewPlanningForm({...newPlanningForm, slot: e.target.value})} className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100"><option value="AM">☀️ Matin (AM)</option><option value="PM">🌙 Après-midi (PM)</option></select>
                  </div>
                  <input type="number" step="0.5" min="0.5" required placeholder="Durée (j)" value={newPlanningForm.duration} onChange={e => setNewPlanningForm({...newPlanningForm, duration: e.target.value})} className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100 font-bold" />
                  <button type="submit" className="w-full py-2 bg-indigo-600 text-white font-bold rounded-xl shadow">+ Planifier</button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL 2 : ÉDITION / MODIFICATION ENTRÉE PLANNING */}
          {editingPlanningEntry && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-aura-card border border-aura-border rounded-2xl p-6 w-full max-w-md shadow-2xl text-slate-100">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-base font-bold">Modifier l'Entrée Planning</h3>
                  <button onClick={() => setEditingPlanningEntry(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <div className="space-y-4 text-xs">
                  <input type="text" value={editingPlanningEntry.title} onChange={e => setEditingPlanningEntry({...editingPlanningEntry, title: e.target.value})} className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100 font-bold" />
                  <div className="grid grid-cols-2 gap-3">
                    <input type="date" value={editingPlanningEntry.startDate || TODAY_STR} onChange={e => setEditingPlanningEntry({...editingPlanningEntry, startDate: e.target.value})} className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100" />
                    <select value={editingPlanningEntry.slot || 'AM'} onChange={e => setEditingPlanningEntry({...editingPlanningEntry, slot: e.target.value})} className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100"><option value="AM">☀️ Matin (AM)</option><option value="PM">🌙 Après-midi (PM)</option></select>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <input type="number" step="0.5" min="0.5" value={editingPlanningEntry.duration} onChange={e => setEditingPlanningEntry({...editingPlanningEntry, duration: Number(e.target.value)})} className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100 font-bold" />
                    <input type="text" value={editingPlanningEntry.assignee} onChange={e => setEditingPlanningEntry({...editingPlanningEntry, assignee: e.target.value})} className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100" />
                  </div>
                  {editingPlanningEntry.duration > 0.5 && (
                    <button type="button" onClick={() => openSplitModal(editingPlanningEntry)} className="w-full py-2 bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 font-semibold rounded-xl text-center">✂️ Scinder l'entrée en tranches (0.5j)</button>
                  )}
                  <div className="flex justify-between items-center pt-4 border-t border-slate-700">
                    <button onClick={() => handleDeletePlanningEntry(editingPlanningEntry.id)} className="text-rose-400 font-semibold">Supprimer</button>
                    <div className="flex gap-2">
                      <button onClick={() => setEditingPlanningEntry(null)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl">Annuler</button>
                      <button onClick={() => handleUpdatePlanningEntry(editingPlanningEntry)} className="px-4 py-2 bg-indigo-600 font-semibold text-white rounded-xl">Enregistrer</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 3 : SCISSION PLANNING */}
          {splittingPlanningEntry && (
            <div className="fixed inset-0 bg-black/75 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-aura-card border border-aura-border rounded-2xl p-6 w-full max-w-md shadow-2xl text-slate-100">
                <h3 className="text-base font-bold mb-2">✂️ Scission Planning</h3>
                <p className="text-xs text-slate-400 mb-4">Entrée : <strong>{splittingPlanningEntry.title}</strong> ({splittingPlanningEntry.duration} jours)</p>
                <form onSubmit={executePlanningSplit} className="space-y-4 text-xs">
                  <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                    {splitSegments.map((seg, idx) => (
                      <div key={idx} className="flex items-center gap-2 bg-slate-900 p-2 rounded-xl border border-slate-700">
                        <span className="text-[10px] font-bold text-slate-400 w-16">Partie {idx + 1} :</span>
                        <input type="number" step="0.5" min="0.5" max={splittingPlanningEntry.duration} required value={seg} onChange={e => { const newSegs = [...splitSegments]; newSegs[idx] = Number(e.target.value); setSplitSegments(newSegs); }} className="flex-1 bg-slate-950 p-2 rounded border border-slate-700 text-slate-100 font-mono font-bold" />
                        {splitSegments.length > 2 && <button type="button" onClick={() => setSplitSegments(splitSegments.filter((_, i) => i !== idx))} className="text-rose-400 font-bold px-2">✕</button>}
                      </div>
                    ))}
                  </div>
                  <button type="button" onClick={() => setSplitSegments([...splitSegments, 0.5])} className="text-indigo-400 font-semibold hover:underline">+ Ajouter tranche (+0.5j)</button>
                  <div className="p-3 bg-slate-900 rounded-xl border border-slate-700 flex items-center justify-between text-[11px]">
                    <span className="text-slate-400">Somme des tranches :</span>
                    <span className={`font-mono font-bold ${Math.abs(splitSegments.reduce((a,b) => a+Number(b), 0) - splittingPlanningEntry.duration) < 0.01 ? 'text-emerald-400' : 'text-rose-400'}`}>
                      {splitSegments.reduce((a,b) => a+Number(b), 0)} / {splittingPlanningEntry.duration} jours
                    </span>
                  </div>
                  <div className="flex justify-end gap-3 pt-4 border-t border-slate-700">
                    <button type="button" onClick={() => setSplittingPlanningEntry(null)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl">Annuler</button>
                    <button type="submit" className="px-4 py-2 bg-indigo-600 text-white font-bold rounded-xl shadow">Découper la tâche</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AuraPlanApp />);
  </script>
</body>
</html>
