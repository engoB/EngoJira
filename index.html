<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraPlan Studio - Project & Resource OS</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            aura: {
              bg: '#080C14',
              card: '#111827',
              border: '#1F293D',
              accent: '#6366F1'
            }
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Yjs + y-webrtc (Temps réel P2P sans serveur) -->
  <script src="https://cdn.jsdelivr.net/npm/yjs@13/dist/yjs.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/y-webrtc@10/dist/y-webrtc.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    .dragging-active { cursor: grabbing !important; user-select: none !important; }
  </style>
</head>
<body class="font-sans antialiased min-h-screen overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // --- HELPERS UTILS & DATES ---
    const utf8_to_b64 = (str) => window.btoa(unescape(encodeURIComponent(str)));
    const b64_to_utf8 = (str) => decodeURIComponent(escape(window.atob(str)));

    const parseDate = (str) => new Date(str + 'T00:00:00');
    const formatDateIso = (d) => d.toISOString().split('T')[0];
    const addDays = (d, days) => { const r = new Date(d); r.setDate(r.getDate() + days); return r; };
    const diffDays = (d1, d2) => Math.round((d1 - d2) / (1000 * 60 * 60 * 24));

    const formatDateFr = (isoStr) => {
      if (!isoStr) return '';
      const d = parseDate(isoStr);
      return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    };

    const getMonday = (d) => {
      const date = new Date(d.getTime());
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    };

    const getWeekNumber = (d) => {
      const date = new Date(d.getTime());
      date.setHours(0, 0, 0, 0);
      date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
      const week1 = new Date(date.getFullYear(), 0, 4);
      return 1 + Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
    };

    const MONTH_NAMES_FR = [
      'Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin',
      'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'
    ];

    const COLOR_OPTIONS = [
      { name: 'Indigo Aura', value: 'from-indigo-600 to-violet-600' },
      { name: 'Cyber Neon', value: 'from-purple-600 to-fuchsia-600' },
      { name: 'Émeraude Deep', value: 'from-emerald-500 to-teal-600' },
      { name: 'Ambre Chaud', value: 'from-amber-500 to-orange-600' },
      { name: 'Rose Flash', value: 'from-rose-600 to-pink-600' },
      { name: 'Cyan Futur', value: 'from-cyan-500 to-blue-600' }
    ];

    const TODAY_STR = formatDateIso(new Date());

    // DONNÉES INITIALES ROADMAP & KANBAN
    const INITIAL_PROJECTS = [
      {
        id: 'proj-1',
        title: 'Refonte Microservices Cloud',
        category: 'Infrastructure',
        startDate: TODAY_STR,
        duration: 14,
        color: 'from-indigo-600 to-violet-600',
        tasks: [
          { id: 't-1-1', title: 'Provisionner clusters Kubernetes Terraform V2', assignee: 'Alexandre M.', startDate: TODAY_STR, duration: 4, status: 'DONE' },
          { id: 't-1-2', title: 'Security Audit & Ingress Controller', assignee: 'Alexandre M.', startDate: TODAY_STR, duration: 3, status: 'IN_PROGRESS' },
          { id: 't-1-3', title: 'Migration Gateway Auth OAuth2', assignee: 'Lucas R.', startDate: formatDateIso(addDays(new Date(), 4)), duration: 5, status: 'TODO' }
        ]
      },
      {
        id: 'proj-2',
        title: 'Design System & UI React',
        category: 'Frontend',
        startDate: formatDateIso(addDays(new Date(), 2)),
        duration: 12,
        color: 'from-purple-600 to-fuchsia-600',
        tasks: [
          { id: 't-2-1', title: 'Tokens Figma & Couleurs Globale', assignee: 'Sophie T.', startDate: formatDateIso(addDays(new Date(), 2)), duration: 3, status: 'DONE' },
          { id: 't-2-2', title: 'Composants Formulaires React Pro', assignee: 'Sophie T.', startDate: formatDateIso(addDays(new Date(), 5)), duration: 6, status: 'IN_PROGRESS' }
        ]
      }
    ];

    // DONNÉES INITIALES PLANNING (SO PLANNING STYLE)
    const INITIAL_PLANNING_ENTRIES = [
      { id: 'pe-1', title: 'Infra K8s Terraform', tag: 'Infrastructure', color: 'from-indigo-600 to-violet-600', assignee: 'Alexandre M.', startDate: TODAY_STR, slot: 'AM', duration: 3.5, notes: 'Deploy cluster prod' },
      { id: 'pe-2', title: 'Audit Ingress SSL', tag: 'Infrastructure', color: 'from-indigo-600 to-violet-600', assignee: 'Alexandre M.', startDate: TODAY_STR, slot: 'PM', duration: 2, notes: 'Verification certs' },
      { id: 'pe-3', title: 'Tokens Figma', tag: 'Frontend', color: 'from-purple-600 to-fuchsia-600', assignee: 'Sophie T.', startDate: formatDateIso(addDays(new Date(), 2)), slot: 'AM', duration: 2.5, notes: 'Export JSON' }
    ];

    function AuraPlanApp() {
      const [isDark, setIsDark] = useState(true);

      const [projects, setProjects] = useState(() => {
        const saved = localStorage.getItem('auraplan_projects_v12');
        return saved ? JSON.parse(saved) : INITIAL_PROJECTS;
      });

      const [planningEntries, setPlanningEntries] = useState(() => {
        const saved = localStorage.getItem('auraplan_entries_v12');
        return saved ? JSON.parse(saved) : INITIAL_PLANNING_ENTRIES;
      });

      const [activeTab, setActiveTab] = useState('roadmap');
      const [selectedProjectId, setSelectedProjectId] = useState('proj-1');
      const [editingTask, setEditingTask] = useState(null);
      const [editingPlanningEntry, setEditingPlanningEntry] = useState(null);

      const [splittingPlanningEntry, setSplittingPlanningEntry] = useState(null);
      const [splitSegments, setSplitSegments] = useState([1, 1]);

      const [columnWidth, setColumnWidth] = useState(100);

      const [isLeftPanelOpen, setIsLeftPanelOpen] = useState(true);
      const [isRightPanelOpen, setIsRightPanelOpen] = useState(true);

      const [isAddTaskFolded, setIsAddTaskFolded] = useState(true);
      const [isProjectEditFolded, setIsProjectEditFolded] = useState(true);

      const [draggingKanbanTaskId, setDraggingKanbanTaskId] = useState(null);
      const [dragOverColumn, setDragOverColumn] = useState(null);

      const [isProjectModalOpen, setIsProjectModalOpen] = useState(false);
      const [isConfigModalOpen, setIsConfigModalOpen] = useState(false);
      const [isKanbanAddTaskModalOpen, setIsKanbanAddTaskModalOpen] = useState(false);
      const [isCreatePlanningModalOpen, setIsCreatePlanningModalOpen] = useState(false);

      const [newProjectForm, setNewProjectForm] = useState({
        title: '', category: 'Tech', startDate: TODAY_STR, duration: 10, color: 'from-indigo-600 to-violet-600'
      });
      const [newTaskForm, setNewTaskForm] = useState({
        projectId: '', title: '', assignee: 'Alexandre M.', startDate: TODAY_STR, duration: 2, status: 'TODO'
      });
      const [newPlanningForm, setNewPlanningForm] = useState({
        title: '', tag: 'Général', color: 'from-indigo-600 to-violet-600', assignee: 'Alexandre M.', startDate: TODAY_STR, slot: 'AM', duration: 1, notes: ''
      });

      const [dragState, setDragState] = useState(null);
      const [planningDragState, setPlanningDragState] = useState(null);
      const hasDraggedPlanningTask = useRef(false);
      const dragAnimRef = useRef(null);

      const [ghConfig, setGhConfig] = useState(() => {
        const saved = localStorage.getItem('gh_config');
        return saved ? JSON.parse(saved) : { owner: '', repo: '', path: 'data.json', token: '' };
      });
      const [syncStatus, setSyncStatus] = useState('');
      const [connectedPeers, setConnectedPeers] = useState(1);
      const yDocRef = useRef(null);

      useEffect(() => {
        if (isDark) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [isDark]);

      // CALENDRIER & BORNES DYNAMIQUES AVEC MARGE
      const { timelineStartDate, totalTimelineDays } = useMemo(() => {
        let minDate = parseDate(TODAY_STR);
        let maxDate = addDays(parseDate(TODAY_STR), 30);

        if (activeTab === 'roadmap' || activeTab === 'kanban') {
          projects.forEach(p => {
            const pStart = parseDate(p.startDate);
            const pEnd = addDays(pStart, Math.ceil(p.duration));
            if (pStart < minDate) minDate = pStart;
            if (pEnd > maxDate) maxDate = pEnd;
          });
        } else if (activeTab === 'planning') {
          planningEntries.forEach(pe => {
            const pStart = parseDate(pe.startDate);
            const pEnd = addDays(pStart, Math.ceil(pe.duration));
            if (pStart < minDate) minDate = pStart;
            if (pEnd > maxDate) maxDate = pEnd;
          });
        }

        const mondayStart = getMonday(addDays(minDate, -3));
        const requiredDays = diffDays(addDays(maxDate, 5), mondayStart);
        return { timelineStartDate: mondayStart, totalTimelineDays: Math.max(30, requiredDays) };
      }, [projects, planningEntries, activeTab]);

      const timelineWeeks = useMemo(() => {
        const weeksMap = [];
        let currentWeekNum = null;
        let currentWeekObj = null;

        for (let i = 0; i < totalTimelineDays; i++) {
          const dayDate = addDays(timelineStartDate, i);
          const weekNum = getWeekNumber(dayDate);

          if (weekNum !== currentWeekNum) {
            currentWeekNum = weekNum;
            currentWeekObj = { weekNum, startDate: dayDate, daysCount: 0 };
            weeksMap.push(currentWeekObj);
          }
          currentWeekObj.daysCount++;
        }
        return weeksMap;
      }, [timelineStartDate, totalTimelineDays]);

      const timelineMonths = useMemo(() => {
        const monthsMap = [];
        let currentMonthKey = '';
        let currentMonthObj = null;

        for (let i = 0; i < totalTimelineDays; i++) {
          const dayDate = addDays(timelineStartDate, i);
          const monthKey = `${dayDate.getFullYear()}-${dayDate.getMonth()}`;

          if (monthKey !== currentMonthKey) {
            currentMonthKey = monthKey;
            currentMonthObj = { name: `${MONTH_NAMES_FR[dayDate.getMonth()]} ${dayDate.getFullYear()}`, daysCount: 0 };
            monthsMap.push(currentMonthObj);
          }
          currentMonthObj.daysCount++;
        }
        return monthsMap;
      }, [timelineStartDate, totalTimelineDays]);

      const allFlatTasks = useMemo(() => {
        const list = [];
        projects.forEach(p => {
          const safeProj = {
            id: p.id || 'proj-default',
            title: p.title || 'Projet',
            category: p.category || 'Général',
            color: p.color || 'from-indigo-600 to-violet-600'
          };
          (p.tasks || []).forEach(t => {
            list.push({ ...t, project: safeProj });
          });
        });
        return list;
      }, [projects]);

      const kanbanGroupedTasks = useMemo(() => {
        const map = new Map();
        allFlatTasks.forEach(task => {
          const rootKey = task.parentId || task.id.replace(/-part-\d+$/, '');
          if (!map.has(rootKey)) {
            map.set(rootKey, { ...task });
          } else {
            const existing = map.get(rootKey);
            if (task.status === 'IN_PROGRESS' && existing.status === 'TODO') {
              existing.status = 'IN_PROGRESS';
            }
          }
        });
        return Array.from(map.values());
      }, [allFlatTasks]);

      const collaborators = useMemo(() => {
        const set = new Set();
        planningEntries.forEach(pe => { if (pe.assignee) set.add(pe.assignee); });
        allFlatTasks.forEach(t => { if (t.assignee) set.add(t.assignee); });
        if (set.size === 0) set.add('Alexandre M.');
        return Array.from(set);
      }, [planningEntries, allFlatTasks]);

      useEffect(() => localStorage.setItem('auraplan_projects_v12', JSON.stringify(projects)), [projects]);
      useEffect(() => localStorage.setItem('auraplan_entries_v12', JSON.stringify(planningEntries)), [planningEntries]);
      useEffect(() => localStorage.setItem('gh_config', JSON.stringify(ghConfig)), [ghConfig]);

      useEffect(() => {
        try {
          if (!window.Y || !window.YWebrtc) return;
          const ydoc = new window.Y.Doc();
          const provider = new window.YWebrtc.WebrtcProvider('auraplan-studio-room-2026', ydoc);
          const yProjects = ydoc.getArray('projects');
          const yPlanning = ydoc.getArray('planningEntries');

          yProjects.observe(() => {
            const remote = yProjects.toArray();
            if (remote.length > 0) setProjects(remote);
          });

          yPlanning.observe(() => {
            const remote = yPlanning.toArray();
            if (remote.length > 0) setPlanningEntries(remote);
          });

          provider.on('peers', (e) => setConnectedPeers(e.webrtcPeers.length + 1));
          yDocRef.current = { ydoc, yProjects, yPlanning, provider };

          return () => { provider.destroy(); ydoc.destroy(); };
        } catch (e) {
          console.warn("Yjs P2P non initialisé", e);
        }
      }, []);

      const broadcastProjects = useCallback((updated) => {
        setProjects(updated);
        if (yDocRef.current && yDocRef.current.yProjects) {
          const { ydoc, yProjects } = yDocRef.current;
          ydoc.transact(() => {
            yProjects.delete(0, yProjects.length);
            yProjects.insert(0, updated);
          });
        }
      }, []);

      const broadcastPlanning = useCallback((updated) => {
        setPlanningEntries(updated);
        if (yDocRef.current && yDocRef.current.yPlanning) {
          const { ydoc, yPlanning } = yDocRef.current;
          ydoc.transact(() => {
            yPlanning.delete(0, yPlanning.length);
            yPlanning.insert(0, updated);
          });
        }
      }, []);

      // PROGRESSION PROJET (%) DYNAMIQUE
      const getProjectProgress = (project) => {
        if (!project || !project.tasks || project.tasks.length === 0) return 0;
        const doneCount = project.tasks.filter(t => t.status === 'DONE').length;
        return Math.round((doneCount / project.tasks.length) * 100);
      };

      const getProjectHealth = (project) => {
        if (!project || !project.tasks || project.tasks.length === 0) return { status: 'NEUTRAL', label: '⚪ Pas de tâches' };
        const pStart = parseDate(project.startDate);
        const pEnd = addDays(pStart, Number(project.duration));

        let maxTaskEnd = pStart;
        project.tasks.forEach(t => {
          const tEnd = addDays(parseDate(t.startDate || project.startDate), Number(t.duration || 1));
          if (tEnd > maxTaskEnd) maxTaskEnd = tEnd;
        });

        const delay = diffDays(maxTaskEnd, pEnd);
        if (delay > 0) return { status: 'DANGER', label: `🔴 Retard +${delay}j` };
        if (delay < 0) return { status: 'SUCCESS', label: `🟢 Avance ${Math.abs(delay)}j` };
        return { status: 'SUCCESS', label: '🟢 Dans les temps' };
      };

      const fitAllTasks = useCallback(() => {
        const viewport = document.getElementById('timeline-viewport');
        if (!viewport) return;

        const containerWidth = viewport.clientWidth - 20;
        const computedWidth = Math.max(24, Math.floor(containerWidth / totalTimelineDays));

        setColumnWidth(computedWidth);
        viewport.scrollLeft = 0;
      }, [totalTimelineDays]);

      const focusCurrentSprint = useCallback(() => {
        const currentMonday = getMonday(new Date());
        const viewport = document.getElementById('timeline-viewport');
        if (!viewport) return;

        const containerWidth = viewport.clientWidth - 20;
        const computedWidth = Math.max(45, Math.floor(containerWidth / 14));
        setColumnWidth(computedWidth);

        const daysDiff = diffDays(currentMonday, timelineStartDate);
        if (daysDiff >= 0) {
          viewport.scrollLeft = daysDiff * computedWidth;
        }
      }, [timelineStartDate]);

      const calculateCollaboratorLanes = (personEntries) => {
        const sorted = [...personEntries].sort((a, b) => {
          const tA = parseDate(a.startDate).getTime() + (a.slot === 'PM' ? 43200000 : 0);
          const tB = parseDate(b.startDate).getTime() + (b.slot === 'PM' ? 43200000 : 0);
          return tA - tB;
        });

        const lanes = [];

        const placedEntries = sorted.map(entry => {
          const startDays = diffDays(parseDate(entry.startDate), timelineStartDate) + (entry.slot === 'PM' ? 0.5 : 0);
          const endDays = startDays + Number(entry.duration);

          let laneIndex = lanes.findIndex(freeDay => freeDay <= startDays);
          if (laneIndex === -1) {
            laneIndex = lanes.length;
            lanes.push(endDays);
          } else {
            lanes[laneIndex] = endDays;
          }

          return { ...entry, laneIndex, startDays, endDays };
        });

        const totalLanes = Math.max(1, lanes.length);
        return { placedEntries, totalLanes, rowHeight: totalLanes * 38 + 24 };
      };

      const handleMouseDown = (e, projectId, action) => {
        e.stopPropagation();
        e.preventDefault();
        const proj = projects.find(p => p.id === projectId);
        if (!proj) return;

        setDragState({
          projectId, action, startX: e.clientX,
          initialStartDate: proj.startDate, initialDuration: proj.duration,
          currentStartDate: proj.startDate, currentDuration: proj.duration
        });
      };

      useEffect(() => {
        const handleMouseMove = (e) => {
          if (!dragState) return;

          if (dragAnimRef.current) cancelAnimationFrame(dragAnimRef.current);

          dragAnimRef.current = requestAnimationFrame(() => {
            const deltaX = e.clientX - dragState.startX;
            const dayDelta = Math.round(deltaX / columnWidth);

            let newStart = dragState.initialStartDate;
            let newDur = dragState.initialDuration;

            if (dragState.action === 'move') {
              newStart = formatDateIso(addDays(parseDate(dragState.initialStartDate), dayDelta));
            } else if (dragState.action === 'resize-left') {
              const actualDays = Math.min(dayDelta, dragState.initialDuration - 1);
              newStart = formatDateIso(addDays(parseDate(dragState.initialStartDate), actualDays));
              newDur = dragState.initialDuration - actualDays;
            } else if (dragState.action === 'resize-right') {
              newDur = Math.max(1, dragState.initialDuration + dayDelta);
            }

            setDragState(prev => prev ? { ...prev, currentStartDate: newStart, currentDuration: newDur } : null);
          });
        };

        const handleMouseUp = () => {
          if (dragState) {
            const updated = projects.map(p => p.id === dragState.projectId ? { ...p, startDate: dragState.currentStartDate, duration: dragState.currentDuration } : p);
            broadcastProjects(updated);
          }
          setDragState(null);
        };

        if (dragState) {
          window.addEventListener('mousemove', handleMouseMove);
          window.addEventListener('mouseup', handleMouseUp);
        }
        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseup', handleMouseUp);
        };
      }, [dragState, columnWidth, projects, broadcastProjects]);

      const handlePlanningMouseDown = (e, entry, action = 'move') => {
        e.stopPropagation();
        e.preventDefault();
        hasDraggedPlanningTask.current = false;

        const initialSlotOffset = entry.slot === 'PM' ? 0.5 : 0;
        const initialStartDays = diffDays(parseDate(entry.startDate || TODAY_STR), timelineStartDate) + initialSlotOffset;

        setPlanningDragState({
          entryId: entry.id,
          action,
          startX: e.clientX,
          initialStartDays,
          initialDuration: entry.duration,
          currentStartDays: initialStartDays,
          currentDuration: entry.duration,
          currentStartDate: entry.startDate || TODAY_STR,
          currentSlot: entry.slot || 'AM'
        });
      };

      useEffect(() => {
        const handleMouseMovePlanning = (e) => {
          if (!planningDragState) return;

          if (Math.abs(e.clientX - planningDragState.startX) > 4) {
            hasDraggedPlanningTask.current = true;
          }

          if (dragAnimRef.current) cancelAnimationFrame(dragAnimRef.current);

          dragAnimRef.current = requestAnimationFrame(() => {
            const deltaX = e.clientX - planningDragState.startX;
            const halfWidth = columnWidth / 2;
            const halfSlotsDelta = Math.round(deltaX / halfWidth);

            if (planningDragState.action === 'move') {
              const newStartDays = Math.max(0, planningDragState.initialStartDays + halfSlotsDelta * 0.5);
              const fullDays = Math.floor(newStartDays);
              const isPM = (newStartDays % 1) >= 0.45;

              setPlanningDragState(prev => prev ? {
                ...prev,
                currentStartDays: newStartDays,
                currentStartDate: formatDateIso(addDays(timelineStartDate, fullDays)),
                currentSlot: isPM ? 'PM' : 'AM'
              } : null);
            } else if (planningDragState.action === 'resize-right') {
              const newDur = Math.max(0.5, planningDragState.initialDuration + halfSlotsDelta * 0.5);
              setPlanningDragState(prev => prev ? { ...prev, currentDuration: newDur } : null);
            } else if (planningDragState.action === 'resize-left') {
              const actualShift = Math.min(halfSlotsDelta * 0.5, planningDragState.initialDuration - 0.5);
              const newStartDays = Math.max(0, planningDragState.initialStartDays + actualShift);
              const newDur = Math.max(0.5, planningDragState.initialDuration - actualShift);

              const fullDays = Math.floor(newStartDays);
              const isPM = (newStartDays % 1) >= 0.45;

              setPlanningDragState(prev => prev ? {
                ...prev,
                currentStartDays: newStartDays,
                currentDuration: newDur,
                currentStartDate: formatDateIso(addDays(timelineStartDate, fullDays)),
                currentSlot: isPM ? 'PM' : 'AM'
              } : null);
            }
          });
        };

        const handleMouseUpPlanning = () => {
          if (planningDragState) {
            if (hasDraggedPlanningTask.current) {
              const updated = planningEntries.map(pe => pe.id === planningDragState.entryId ? {
                ...pe,
                startDate: planningDragState.currentStartDate,
                slot: planningDragState.currentSlot,
                duration: planningDragState.currentDuration
              } : pe);
              broadcastPlanning(updated);
            }
          }
          setPlanningDragState(null);
        };

        if (planningDragState) {
          window.addEventListener('mousemove', handleMouseMovePlanning);
          window.addEventListener('mouseup', handleMouseUpPlanning);
        }
        return () => {
          window.removeEventListener('mousemove', handleMouseMovePlanning);
          window.removeEventListener('mouseup', handleMouseUpPlanning);
        };
      }, [planningDragState, columnWidth, planningEntries, timelineStartDate, broadcastPlanning]);

      const handleKanbanDragStart = (e, taskId) => {
        setDraggingKanbanTaskId(taskId);
        e.dataTransfer.setData('text/plain', taskId);
        e.dataTransfer.effectAllowed = 'move';
      };

      const handleKanbanDragOver = (e, colId) => {
        e.preventDefault();
        setDragOverColumn(colId);
      };

      const handleKanbanDrop = (e, targetStatus) => {
        e.preventDefault();
        const taskId = e.dataTransfer.getData('text/plain');
        setDraggingKanbanTaskId(null);
        setDragOverColumn(null);
        if (!taskId) return;

        const updatedProjects = projects.map(p => ({
          ...p,
          tasks: (p.tasks || []).map(t => t.id === taskId ? { ...t, status: targetStatus } : t)
        }));
        broadcastProjects(updatedProjects);
      };

      const handleCellClickPlanning = (person, dayDate, slot) => {
        setNewPlanningForm({
          title: '',
          tag: 'Général',
          color: 'from-indigo-600 to-violet-600',
          assignee: person,
          startDate: formatDateIso(dayDate),
          slot: slot,

          const half = Number((Math.floor(entry.duration / 0.5 / 2) * 0.5).toFixed(1));
          setSplitSegments([half, Number((entry.duration - half).toFixed(1))]);

        e.preventDefault();
        if (!splittingPlanningEntry) return;

        const sum = splitSegments.reduce((a, b) => a + Number(b), 0);
        if (Math.abs(sum - splittingPlanningEntry.duration) > 0.01) {
          alert(`La somme des tranches (${sum}j) doit être égale à la durée initiale (${splittingPlanningEntry.duration}j).`);
          return;
        }

        const newEntries = [];
        let currDate = parseDate(splittingPlanningEntry.startDate);
        let currSlot = splittingPlanningEntry.slot || 'AM';

        splitSegments.forEach((segDuration, idx) => {
          newEntries.push({
            id: `pe-${Date.now()}-part-${idx}`,
            title: `${splittingPlanningEntry.title} (Partie ${idx + 1}/${splitSegments.length})`,
            tag: splittingPlanningEntry.tag || 'Planning',
            color: splittingPlanningEntry.color,
            assignee: splittingPlanningEntry.assignee,
            startDate: formatDateIso(currDate),
            slot: currSlot,
            duration: Number(segDuration)
          });

          const addedDays = Math.floor(segDuration);
          const remainder = segDuration % 1;
          
          currDate = addDays(currDate, addedDays);
          if (remainder >= 0.5) {
            if (currSlot === 'AM') {
              currSlot = 'PM';
            } else {
              currSlot = 'AM';
              currDate = addDays(currDate, 1);
            }
          }
        });

        const updated = planningEntries.filter(pe => pe.id !== splittingPlanningEntry.id).concat(newEntries);
        broadcastPlanning(updated);
        setSplittingPlanningEntry(null);
        setEditingPlanningEntry(null);

        if (!ghConfig.owner || !ghConfig.repo || !ghConfig.token) {
          alert("Veuillez renseigner vos identifiants dans ⚙️ Config GitHub");
          return;
        }
        setSyncStatus('Commit...');
        try {
          const url = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${ghConfig.path}`;
          const headers = { 'Authorization': `token ${ghConfig.token}`, 'Accept': 'application/vnd.github.v3+json' };
          
          let currentSha = null;
          const getRes = await fetch(url, { headers });
          if (getRes.ok) currentSha = (await getRes.json()).sha;

          const payload = { projects, planningEntries };

          const putRes = await fetch(url, {
            method: 'PUT',
            headers: { ...headers, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: `Update AuraPlan ${new Date().toLocaleString('fr-FR')}`,
              content: utf8_to_b64(JSON.stringify(payload, null, 2)),
              ...(currentSha && { sha: currentSha })
            })
          });

          if (!putRes.ok) throw new Error();
          setSyncStatus('✅ Commité !');
          setTimeout(() => setSyncStatus(''), 3000);
          setIsConfigModalOpen(false);

          setSyncStatus('❌ Erreur');

                        }
                      }}
                      className="w-full bg-slate-900 border border-indigo-500/40 p-2 rounded-lg text-slate-200 text-xs font-semibold"
                    >
                      <option value="">-- Choisir un modèle --</option>
                      <optgroup label="Projets Roadmap">
                        {projects.map(p => <option key={p.id} value={`proj:${p.id}`}>{p.title}</option>)}
                      </optgroup>
                      <optgroup label="Tâches Backlog">
                        {allFlatTasks.map(t => <option key={t.id} value={`task:${t.id}`}>{t.title} ({t.project?.title || 'Projet'})</option>)}
                      </optgroup>
                    </select>
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1 font-semibold">Titre de l'entrée Planning</label>
                    <input 
                      type="text" required placeholder="ex: Infra Terraform K8s"
                      value={newPlanningForm.title}
                      onChange={e => setNewPlanningForm({...newPlanningForm, title: e.target.value})}
                      className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100 font-bold"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Tag / Catégorie</label>
                      <input 
                        type="text"
                        value={newPlanningForm.tag}
                        onChange={e => setNewPlanningForm({...newPlanningForm, tag: e.target.value})}
                        className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Couleur</label>
                      <select 
                        value={newPlanningForm.color}
                        onChange={e => setNewPlanningForm({...newPlanningForm, color: e.target.value})}
                        className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100"
                      >
                        {COLOR_OPTIONS.map(c => <option key={c.value} value={c.value}>{c.name}</option>)}
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Assigné à</label>
                      <input 
                        type="text" required
                        value={newPlanningForm.assignee}
                        onChange={e => setNewPlanningForm({...newPlanningForm, assignee: e.target.value})}
                        className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Date de début</label>
                      <input 
                        type="date" required
                        value={newPlanningForm.startDate}
                        onChange={e => setNewPlanningForm({...newPlanningForm, startDate: e.target.value})}
                        className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Créneau</label>
                      <select 
                        value={newPlanningForm.slot}
                        onChange={e => setNewPlanningForm({...newPlanningForm, slot: e.target.value})}
                        className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100"
                      >
                        <option value="AM">☀️ Matin (AM)</option>
                        <option value="PM">🌙 Après-midi (PM)</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Durée (jours - pas 0.5j)</label>
                      <input 
                        type="number" step="0.5" min="0.5" required
                        value={newPlanningForm.duration}
                        onChange={e => setNewPlanningForm({...newPlanningForm, duration: e.target.value})}
                        className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100 font-bold"
                      />
                    </div>
                  </div>

                  <div className="flex justify-end gap-3 pt-4 border-t border-slate-700">
                    <button type="button" onClick={() => setIsCreatePlanningModalOpen(false)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl">Annuler</button>
                    <button type="submit" className="px-4 py-2 bg-indigo-600 text-white font-bold rounded-xl shadow">+ Planifier</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL 2 : ÉDITION / MODIFICATION ENTRÉE PLANNING */}
          {editingPlanningEntry && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-aura-card border border-aura-border rounded-2xl p-6 w-full max-w-md shadow-2xl text-slate-100">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-base font-bold">Modifier l'Entrée Planning</h3>
                  <button onClick={() => setEditingPlanningEntry(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1 font-semibold">Titre</label>
                    <input 
                      type="text" 
                      value={editingPlanningEntry.title} 
                      onChange={e => setEditingPlanningEntry({...editingPlanningEntry, title: e.target.value})}
                      className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100 font-bold" 
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Tag / Catégorie</label>
                      <input 
                        type="text" 
                        value={editingPlanningEntry.tag || ''} 
                        onChange={e => setEditingPlanningEntry({...editingPlanningEntry, tag: e.target.value})}
                        className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100" 
                      />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Couleur</label>
                      <select 
                        value={editingPlanningEntry.color || 'from-indigo-600 to-violet-600'} 
                        onChange={e => setEditingPlanningEntry({...editingPlanningEntry, color: e.target.value})}
                        className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100"
                      >
                        {COLOR_OPTIONS.map(c => <option key={c.value} value={c.value}>{c.name}</option>)}
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Date de début</label>
                      <input 
                        type="date" 
                        value={editingPlanningEntry.startDate || TODAY_STR} 
                        onChange={e => setEditingPlanningEntry({...editingPlanningEntry, startDate: e.target.value})}
                        className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100" 
                      />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Créneau</label>
                      <select 
                        value={editingPlanningEntry.slot || 'AM'} 
                        onChange={e => setEditingPlanningEntry({...editingPlanningEntry, slot: e.target.value})}
                        className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100"
                      >
                        <option value="AM">☀️ Matin (AM)</option>
                        <option value="PM">🌙 Après-midi (PM)</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Durée (jours - pas 0.5j)</label>
                      <input 
                        type="number" step="0.5" min="0.5"
                        value={editingPlanningEntry.duration} 
                        onChange={e => setEditingPlanningEntry({...editingPlanningEntry, duration: Number(e.target.value)})}
                        className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100 font-bold" 
                      />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Collaborateur assigné</label>
                      <input 
                        type="text" 
                        value={editingPlanningEntry.assignee} 
                        onChange={e => setEditingPlanningEntry({...editingPlanningEntry, assignee: e.target.value})}
                        className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100" 
                      />
                    </div>
                  </div>

                  {editingPlanningEntry.duration > 0.5 && (
                    <button 
                      type="button"
                      onClick={() => openSplitModal(editingPlanningEntry)}
                      className="w-full py-2 bg-indigo-600/20 text-indigo-300 hover:bg-indigo-600/30 border border-indigo-500/30 font-semibold rounded-xl transition text-center"
                    >
                      ✂️ Scinder l'entrée en tranches (0.5j)
                    </button>
                  )}

                  <div className="flex justify-between items-center pt-4 border-t border-slate-700">
                    <button onClick={() => handleDeletePlanningEntry(editingPlanningEntry.id)} className="text-rose-400 font-semibold">Supprimer</button>
                    <div className="flex gap-2">
                      <button onClick={() => setEditingPlanningEntry(null)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl">Annuler</button>
                      <button onClick={() => handleUpdatePlanningEntry(editingPlanningEntry)} className="px-4 py-2 bg-indigo-600 font-semibold text-white rounded-xl">Enregistrer</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 3 : ÉDITION TÂCHE KANBAN/ROADMAP */}
          {editingTask && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-aura-card border border-aura-border rounded-2xl p-6 w-full max-w-md shadow-2xl text-slate-100">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-base font-bold">Modifier Tâche Backlog</h3>
                  <button onClick={() => setEditingTask(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1 font-semibold">Titre complet</label>
                    <input 
                      type="text" 
                      value={editingTask.title} 
                      onChange={e => setEditingTask({...editingTask, title: e.target.value})}
                      className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100" 
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Date de début</label>
                      <input 
                        type="date" 
                        value={editingTask.startDate || TODAY_STR} 
                        onChange={e => setEditingTask({...editingTask, startDate: e.target.value})}
                        className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100" 
                      />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Durée (jours)</label>
                      <input 
                        type="number" min="1"
                        value={editingTask.duration} 
                        onChange={e => setEditingTask({...editingTask, duration: Number(e.target.value)})}
                        className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100" 
                      />
                    </div>
                  </div>

                  <div className="flex justify-between items-center pt-4 border-t border-slate-700">
                    <button onClick={() => handleDeleteTask(editingTask.id)} className="text-rose-400 font-semibold">Supprimer</button>
                    <div className="flex gap-2">
                      <button onClick={() => setEditingTask(null)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl">Annuler</button>
                      <button onClick={() => handleUpdateTask(editingTask)} className="px-4 py-2 bg-indigo-600 font-semibold text-white rounded-xl">Enregistrer</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 4 : SCISSION ENTRÉE PLANNING */}
          {splittingPlanningEntry && (
            <div className="fixed inset-0 bg-black/75 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-aura-card border border-aura-border rounded-2xl p-6 w-full max-w-md shadow-2xl text-slate-100">
                <h3 className="text-base font-bold mb-2">✂️ Scission Planning Sur-Mesure</h3>
                <p className="text-xs text-slate-400 mb-4">Entrée : <strong>{splittingPlanningEntry.title}</strong> ({splittingPlanningEntry.duration} jours)</p>

                <form onSubmit={executePlanningSplit} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-300 mb-2 font-medium">Tranches de découpage (pas de 0,5j) :</label>
                    <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                      {splitSegments.map((seg, idx) => (
                        <div key={idx} className="flex items-center gap-2 bg-slate-900 p-2 rounded-xl border border-slate-700">
                          <span className="text-[10px] font-bold text-slate-400 w-16">Tranche {idx + 1} :</span>
                          <input 
                            type="number" step="0.5" min="0.5" max={splittingPlanningEntry.duration} required
                            value={seg}
                            onChange={e => {
                              const val = Number(e.target.value);
                              const newSegs = [...splitSegments];
                              newSegs[idx] = val;
                              setSplitSegments(newSegs);
                            }}
                            className="flex-1 bg-slate-950 p-2 rounded border border-slate-700 text-slate-100 text-xs font-mono font-bold"
                          />
                          <span className="text-[10px] text-slate-400">jour(s)</span>
                          {splitSegments.length > 2 && (
                            <button 
                              type="button" 
                              onClick={() => setSplitSegments(splitSegments.filter((_, i) => i !== idx))}
                              className="text-rose-400 font-bold px-2"
                            >
                              ✕
                            </button>
                          )}
                        </div>
                      ))}
                    </div>

                    <button 
                      type="button"
                      onClick={() => setSplitSegments([...splitSegments, 0.5])}
                      className="mt-2 text-indigo-400 font-semibold hover:underline text-[11px]"
                    >
                      + Ajouter une tranche (+0.5j)
                    </button>
                  </div>

                  <div className="p-3 bg-slate-900 rounded-xl border border-slate-700 flex items-center justify-between text-[11px]">
                    <span className="text-slate-400">Somme des tranches :</span>
                    <span className={`font-mono font-bold ${
                      Math.abs(splitSegments.reduce((a,b) => a+Number(b), 0) - splittingPlanningEntry.duration) < 0.01 ? 'text-emerald-400' : 'text-rose-400'
                    }`}>
                      {splitSegments.reduce((a,b) => a+Number(b), 0)} / {splittingPlanningEntry.duration} jours
                    </span>
                  </div>

                  <div className="flex justify-end gap-3 pt-4 border-t border-slate-700">
                    <button type="button" onClick={() => setSplittingPlanningEntry(null)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl">Annuler</button>
                    <button type="submit" className="px-4 py-2 bg-indigo-600 text-white font-bold rounded-xl shadow">Découper la tâche</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL 5 : CONFIGURATION GITHUB */}
          {isConfigModalOpen && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-aura-card border border-aura-border rounded-2xl p-6 w-full max-w-md shadow-2xl text-slate-100">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-base font-bold">⚙️ Config GitHub Sync</h3>
                  <button onClick={() => setIsConfigModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Propriétaire Dépôt (Owner)</label>
                    <input type="text" placeholder="ex: mon-pseudo" value={ghConfig.owner} onChange={e => setGhConfig({...ghConfig, owner: e.target.value})} className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100" />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Nom du Dépôt (Repo)</label>
                    <input type="text" placeholder="ex: ma-roadmap" value={ghConfig.repo} onChange={e => setGhConfig({...ghConfig, repo: e.target.value})} className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100" />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Token GitHub (PAT)</label>
                    <input type="password" placeholder="github_pat_..." value={ghConfig.token} onChange={e => setGhConfig({...ghConfig, token: e.target.value})} className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100" />
                  </div>

                  {syncStatus && <div className="text-indigo-400 font-semibold">{syncStatus}</div>}

                  <div className="flex justify-end gap-3 pt-4 border-t border-slate-700">
                    <button onClick={() => setIsConfigModalOpen(false)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl">Fermer</button>
                    <button onClick={saveToGitHub} className="px-4 py-2 bg-indigo-600 text-white rounded-xl font-semibold">Commiter data.json</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 6 : CRÉATION DE PROJET */}
          {isProjectModalOpen && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-aura-card border border-aura-border rounded-2xl p-6 w-full max-w-md shadow-2xl text-slate-100">
                <h3 className="text-lg font-bold mb-4">Créer un Nouveau Projet</h3>
                <form onSubmit={handleCreateProject} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Nom du Projet</label>
                    <input type="text" required value={newProjectForm.title} onChange={e => setNewProjectForm({...newProjectForm, title: e.target.value})} className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100" />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Catégorie / Tag (ex: Mobile, Design...)</label>
                    <input type="text" placeholder="ex: Frontend" value={newProjectForm.category} onChange={e => setNewProjectForm({...newProjectForm, category: e.target.value})} className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Date Cible de début</label>
                      <input type="date" required value={newProjectForm.startDate} onChange={e => setNewProjectForm({...newProjectForm, startDate: e.target.value})} className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100" />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Durée Cible (jours)</label>
                      <input type="number" min="1" required value={newProjectForm.duration} onChange={e => setNewProjectForm({...newProjectForm, duration: e.target.value})} className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100" />
                    </div>
                  </div>
                  <div className="flex justify-end gap-3 pt-4 border-t border-slate-700">
                    <button type="button" onClick={() => setIsProjectModalOpen(false)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl">Annuler</button>
                    <button type="submit" className="px-4 py-2 bg-indigo-600 text-white font-semibold rounded-xl">Créer Projet</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL 7 : CRÉATION DE TÂCHE KANBAN */}
          {isKanbanAddTaskModalOpen && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-aura-card border border-aura-border rounded-2xl p-6 w-full max-w-md shadow-2xl text-slate-100">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-base font-bold">+ Créer Tâche Kanban</h3>
                  <button onClick={() => setIsKanbanAddTaskModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={handleAddTask} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1 font-semibold">Projet Parent</label>
                    <select 
                      value={newTaskForm.projectId || (projects[0]?.id || '')}
                      onChange={e => setNewTaskForm({...newTaskForm, projectId: e.target.value})}
                      className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100 font-bold"
                    >
                      {projects.map(p => <option key={p.id} value={p.id}>{p.title}</option>)}
                    </select>
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1 font-semibold">Titre de la tâche</label>
                    <input 
                      type="text" required placeholder="ex: Intégration SSL Ngress"
                      value={newTaskForm.title}
                      onChange={e => setNewTaskForm({...newTaskForm, title: e.target.value})}
                      className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Assigné à</label>
                      <input 
                        type="text" required
                        value={newTaskForm.assignee}
                        onChange={e => setNewTaskForm({...newTaskForm, assignee: e.target.value})}
                        className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Date de début</label>
                      <input 
                        type="date" required
                        value={newTaskForm.startDate}
                        onChange={e => setNewTaskForm({...newTaskForm, startDate: e.target.value})}
                        className="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-slate-100"
                      />
                    </div>
                  </div>

                  <div className="flex justify-end gap-3 pt-4 border-t border-slate-700">
                    <button type="button" onClick={() => setIsKanbanAddTaskModalOpen(false)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl">Annuler</button>
                    <button type="submit" className="px-4 py-2 bg-indigo-600 text-white font-bold rounded-xl shadow">+ Créer Tâche</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AuraPlanApp />);
  </script>
</body>
</html>
