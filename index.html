                              <div className="absolute inset-0 bg-slate-950/60" />
                              <div className={`absolute inset-y-0 left-0 bg-gradient-to-r ${proj.color}`} style={{ width: `${pct}%` }} />
                              <div onMouseDown={(e) => startDrag(e, { kind: 'project', id: proj.id, action: 'resize-left', unit: 1, startUnits, lenUnits: proj.duration })} className="absolute inset-y-0 left-0 z-20 w-2.5 cursor-ew-resize bg-white/40 opacity-0 group-hover:opacity-100" />
                              <div className="pointer-events-none relative flex w-full items-center justify-between gap-2 px-2.5">
                                <span className="truncate text-[11px] font-extrabold text-white drop-shadow">{proj.title}</span>
                                <span className="shrink-0 rounded bg-black/50 px-1.5 py-0.5 font-mono text-[10px] font-bold text-white">{pct}%</span>
                              </div>
                              <div onMouseDown={(e) => startDrag(e, { kind: 'project', id: proj.id, action: 'resize-right', unit: 1, startUnits, lenUnits: proj.duration })} className="absolute inset-y-0 right-0 z-20 w-2.5 cursor-ew-resize bg-white/40 opacity-0 group-hover:opacity-100" />
                            </div>
                            {dragging ? (
                              <div className="pointer-events-none absolute -top-1 z-[15] rounded-lg border border-indigo-500 bg-slate-900 px-2 py-1 font-mono text-[10px] text-slate-100 shadow-xl" style={{ left: `${drag.snapStart * columnWidth}px` }}>
                                {formatDateFr(formatDateIso(addDays(timelineStart, drag.snapStart)))} · {drag.snapLen} j
                              </div>
                            ) : null}
                          </div>
                        </div>

                        {/* Niveau 2 — tâches */}
                        {isOpen ? proj.tasks.map((task) => {
                          const tOpen = !!openTasks[task.id];
                          const tDragging = drag && drag.kind === 'task' && drag.id === task.id;
                          const tStart = diffDays(parseDate(task.startDate), timelineStart);
                          const tGeo = barGeometry(tStart, task.duration, tDragging);
                          const doneSub = task.subtasks.filter((s) => s.status === 'DONE').length;
                          // Cohérence des préalables, façon OpenProject : on signale sans rien bloquer.
                          const incoherente = (task.bloquePar || []).map((id) => allTasks.find((x) => x.id === id))
                            .filter(Boolean)
                            .find((b) => addDays(parseDate(b.startDate), Math.ceil(b.duration)) > parseDate(task.startDate));
                          return (
                            <React.Fragment key={task.id}>
                              <div className={`flex h-10 border-b ${T.border} ${isDark ? 'bg-white/[0.015]' : 'bg-slate-50/60'}`}
                                title={incoherente ? `Démarre avant la fin de ${incoherente.ref} · ${incoherente.title}` : undefined}>
                                <div style={{ width: `${nameColWidth}px` }} data-nopan className={`sticky left-0 z-20 flex items-center gap-2 border-r pl-6 pr-3 ${T.panel} shadow-[inset_14px_0_0_-12px_rgba(99,102,241,.7)]`}>
                                  {isLeftPanelOpen ? (
                                    <>
                                      <button type="button" disabled={!task.subtasks.length}
                                        onClick={() => setOpenTasks({ ...openTasks, [task.id]: !tOpen })}
                                        className={`flex h-6 shrink-0 items-center justify-center gap-0.5 rounded-md border px-1 text-[10px] font-black leading-none transition
                                          ${!task.subtasks.length ? 'invisible'
                                            : tOpen ? 'border-cyan-400/70 bg-cyan-600 text-white'
                                                    : `${T.border} ${isDark ? 'bg-white/10' : 'bg-slate-200'} text-cyan-400 hover:border-cyan-400 hover:bg-cyan-500/20`}`}
                                        aria-label={tOpen ? 'Replier la tâche' : 'Déplier la tâche'}
                                        title={tOpen ? 'Replier les sous-tâches' : `Déplier ${task.subtasks.length} sous-tâches`}>
                                        <span>{tOpen ? '−' : '+'}</span>
                                        <span className="font-mono opacity-80">{task.subtasks.length}</span>
                                      </button>
                                      <input type="checkbox" checked={task.status === 'DONE'} onChange={(e) => setTaskStatus(task.id, e.target.checked ? 'DONE' : 'IN_PROGRESS')}
                                        className="h-3.5 w-3.5 shrink-0 rounded accent-emerald-500" aria-label={`Valider ${task.title}`} />
                                      <button type="button" onClick={() => setEditingTask({ ...task, projectId: proj.id })}
                                        className={`min-w-0 flex-1 truncate text-left text-[11px] ${task.status === 'DONE' ? 'text-slate-500 line-through' : 'font-bold'}`}>{task.title}</button>
                                      {incoherente ? <span className="shrink-0 text-[11px] text-amber-400" title={`Démarre avant la fin de ${incoherente.ref}`}>⚠</span> : null}
                                      {task.subtasks.length ? <span className={`shrink-0 rounded px-1.5 py-0.5 font-mono text-[9px] ${T.raise} ${T.muted}`}>{doneSub}/{task.subtasks.length}</span> : null}
                                      <button type="button" title="Ajouter une sous-tâche"
                                        onClick={() => setSubtaskForm({ id: null, taskId: task.id, projectId: proj.id, title: '', assignee: task.assignee, status: 'TODO', startDate: task.startDate, duration: 1, notes: '' })}
                                        className={`shrink-0 rounded px-1 text-[11px] font-bold ${T.muted} hover:text-indigo-400`}>+</button>
                                    </>
                                  ) : null}
                                </div>
                                <div className="relative" style={{ width: `${timelineWidth}px` }}>
                                  {fondGrille}
                                  {tDragging ? <div style={{ left: `${drag.snapStart * columnWidth}px`, width: `${drag.snapLen * columnWidth}px` }} className="absolute top-2 h-6 rounded border-2 border-dashed border-indigo-400 bg-indigo-500/10" /> : null}
                                  <div style={{ left: `${tGeo.left}px`, width: `${Math.max(columnWidth * 0.5, tGeo.width)}px` }}
                                  data-nopan
                                    onMouseDown={(e) => startDrag(e, { kind: 'task', id: task.id, action: 'move', unit: 1, startUnits: tStart, lenUnits: task.duration })}
                                    onClick={() => { if (!movedRef.current) setEditingTask({ ...task, projectId: proj.id }); }}
                                    className={`group absolute top-2 flex h-6 cursor-grab items-center rounded border bg-gradient-to-r ${proj.color} px-2 text-[10px] font-bold text-white shadow active:cursor-grabbing ${isEventBar(task.startDate, task.duration) ? 'jour-j-bar border-rose-300/80' : 'border-white/20'} ${task.status === 'DONE' ? 'opacity-50' : ''} ${tDragging ? 'z-[15]' : ''}`}>
                                    <div onMouseDown={(e) => startDrag(e, { kind: 'task', id: task.id, action: 'resize-left', unit: 1, startUnits: tStart, lenUnits: task.duration })} className="absolute inset-y-0 left-0 w-2 cursor-ew-resize bg-white/40 opacity-0 group-hover:opacity-100" />
                                    <span className="pointer-events-none truncate">{task.title}</span>
                                    <div onMouseDown={(e) => startDrag(e, { kind: 'task', id: task.id, action: 'resize-right', unit: 1, startUnits: tStart, lenUnits: task.duration })} className="absolute inset-y-0 right-0 w-2 cursor-ew-resize bg-white/40 opacity-0 group-hover:opacity-100" />
                                  </div>
                                </div>
                              </div>

                              {/* Niveau 3 — sous-tâches */}
                              {tOpen ? task.subtasks.map((sub) => {
                                const sDragging = drag && drag.kind === 'subtask' && drag.id === sub.id;
                                const sStart = diffDays(parseDate(sub.startDate), timelineStart);
                                const sGeo = barGeometry(sStart, sub.duration, sDragging);
                                return (
                                  <div key={sub.id} className={`flex h-8 border-b ${T.border} ${isDark ? 'bg-black/20' : 'bg-slate-100/60'}`}>
                                    <div style={{ width: `${nameColWidth}px` }} data-nopan className={`sticky left-0 z-20 flex items-center gap-2 border-r pl-12 pr-3 ${T.panel} shadow-[inset_28px_0_0_-26px_rgba(34,211,238,.7)]`}>
                                      {isLeftPanelOpen ? (
                                        <>
                                          <input type="checkbox" checked={sub.status === 'DONE'} onChange={(e) => setSubtaskStatus(sub.id, e.target.checked ? 'DONE' : 'TODO')}
                                            className="h-3 w-3 shrink-0 rounded accent-emerald-500" aria-label={`Valider ${sub.title}`} />
                                          <button type="button" onClick={() => setSubtaskForm({ ...sub, taskId: task.id, projectId: proj.id })}
                                            className={`min-w-0 flex-1 truncate text-left text-[10px] ${sub.status === 'DONE' ? 'text-slate-500 line-through' : T.muted}`}>{sub.title}</button>
                                          <span className={`shrink-0 rounded border px-1 py-0.5 text-[8px] font-bold ${STATUS_META[sub.status].tint}`}>{statusLabel(sub.status)}</span>
                                        </>
                                      ) : null}
                                    </div>
                                    <div className="relative" style={{ width: `${timelineWidth}px` }}>
                                      {fondGrille}
                                      {sDragging ? <div style={{ left: `${drag.snapStart * columnWidth}px`, width: `${drag.snapLen * columnWidth}px` }} className="absolute top-2 h-4 rounded border-2 border-dashed border-indigo-400 bg-indigo-500/10" /> : null}
                                      <div style={{ left: `${sGeo.left}px`, width: `${Math.max(columnWidth * 0.4, sGeo.width)}px` }}
                                  data-nopan
                                        onMouseDown={(e) => startDrag(e, { kind: 'subtask', id: sub.id, action: 'move', unit: 1, startUnits: sStart, lenUnits: sub.duration })}
                                        onClick={() => { if (!movedRef.current) setSubtaskForm({ ...sub, taskId: task.id, projectId: proj.id }); }}
                                        className={`group absolute top-2 flex h-4 cursor-grab items-center rounded border px-1.5 text-[9px] font-bold active:cursor-grabbing
                                          ${sub.status === 'DONE' ? 'border-emerald-500/40 bg-emerald-500/20 text-emerald-200' : `${isDark ? 'border-white/15 bg-white/10 text-slate-200' : 'border-slate-300 bg-white text-slate-700'}`} ${sDragging ? 'z-[15]' : ''}`}>
                                        <span className="pointer-events-none truncate">{sub.title}</span>
                                        <div onMouseDown={(e) => startDrag(e, { kind: 'subtask', id: sub.id, action: 'resize-right', unit: 1, startUnits: sStart, lenUnits: sub.duration })} className="absolute inset-y-0 right-0 w-2 cursor-ew-resize bg-white/40 opacity-0 group-hover:opacity-100" />
                                      </div>
                                    </div>
                                  </div>
                                );
                              }) : null}
                            </React.Fragment>
                          );
                        }) : null}
                      </React.Fragment>
                    );
                  })}

                  {/* Prolongement de la grille : sans lui, le bas de l'écran est une zone morte */}
                  {projects.length ? (
                    <div className="flex min-h-[40vh]">
                      <div style={{ width: `${nameColWidth}px` }} data-nopan className={`sticky left-0 z-20 shrink-0 border-r ${T.panel}`} />
                      <div className="relative flex-1" style={{ width: `${timelineWidth}px` }}>{fondGrille}</div>
                    </div>
                  ) : null}
                </div>
              </div>
            </div>

            {isRightPanelOpen ? (
              <aside className={`hidden w-80 shrink-0 overflow-y-auto border-l p-4 xl:block ${T.panel}`}>
                {selectedProject ? (
                  <div className="space-y-4">
                    <div className={`overflow-hidden rounded-2xl border ${T.raise}`}>
                      <div className={`flex items-center justify-between border-b px-4 py-2.5 ${T.border} ${T.inset}`}>
                        <span className="rounded-full border border-indigo-500/30 bg-indigo-500/10 px-2.5 py-0.5 text-[10px] font-bold text-indigo-300">{selectedProject.category}</span>
                        <button type="button" onClick={() => setIsRightPanelOpen(false)} className={`text-xs ${T.faint}`}>✕</button>
                      </div>
                      <div className="p-4">
                        <h2 className="text-sm font-extrabold leading-snug">{selectedProject.title}</h2>
                        <div className={`mt-1 text-[11px] ${T.faint}`}>
                          {formatDayShort(selectedProject.startDate)} → {formatDayShort(formatDateIso(addDays(parseDate(selectedProject.startDate), selectedProject.duration)))} · {selectedProject.duration} j
                        </div>
                        <div className={`mt-3 h-2 w-full overflow-hidden rounded-full ${T.inset}`}>
                          <div className={`h-full rounded-full bg-gradient-to-r ${selectedProject.color}`} style={{ width: `${projectProgress(selectedProject)}%` }} />
                        </div>
                        <div className="mt-2 flex items-center justify-between text-[11px]">
                          <span className={`font-bold ${projectProgress(selectedProject) === 100 ? 'text-emerald-400' : 'text-indigo-400'}`}>{projectProgress(selectedProject)} %</span>
                          {(() => { const h = projectHealth(selectedProject); return <span className={`font-semibold ${h.tone === 'danger' ? 'text-rose-400' : h.tone === 'success' ? 'text-emerald-400' : T.faint}`}>{h.label}</span>; })()}
                        </div>
                      </div>
                    </div>

                    <div className={`overflow-hidden rounded-2xl border ${T.raise}`}>
                      <div className={`flex items-center justify-between border-b px-4 py-2.5 ${T.border} ${T.inset}`}>
                        <h3 className="text-[11px] font-extrabold uppercase tracking-wide">Tâches</h3>
                        <button type="button" className="text-[11px] font-bold text-indigo-400"
                          onClick={() => setTaskForm({ id: null, projectId: selectedProject.id, title: '', assignee: collaborators[0] || 'Moi', startDate: selectedProject.startDate, duration: 5, status: 'TODO', priority: 'MEDIUM', notes: '' })}>+ Ajouter</button>
                      </div>
                      <div className="space-y-1.5 p-3">
                        {selectedProject.tasks.length === 0 ? <p className={`px-1 py-2 text-[11px] ${T.faint}`}>Aucune tâche pour l'instant.</p> : null}
                        {selectedProject.tasks.map((task) => (
                          <div key={task.id} className={`flex items-center gap-2 rounded-xl border px-2.5 py-2 ${T.border} ${isDark ? 'bg-black/25' : 'bg-white'}`}>
                            <input type="checkbox" checked={task.status === 'DONE'} onChange={(e) => setTaskStatus(task.id, e.target.checked ? 'DONE' : 'IN_PROGRESS')} className="h-4 w-4 shrink-0 rounded accent-emerald-500" aria-label={`Valider ${task.title}`} />
                            <button type="button" onClick={() => setEditingTask({ ...task, projectId: selectedProject.id })} className="min-w-0 flex-1 text-left">
                              <div className={`truncate text-[11px] ${task.status === 'DONE' ? 'text-slate-500 line-through' : 'font-semibold'}`}>{task.title}</div>
                              <div className={`truncate text-[10px] ${T.faint}`}>{task.assignee} · {task.subtasks.length ? `${task.subtasks.filter((s) => s.status === 'DONE').length}/${task.subtasks.length} sous-tâches` : `${task.duration} j`}</div>
                            </button>
                            <span className={`shrink-0 rounded border px-1.5 py-0.5 text-[9px] font-bold ${PRIORITY_META[task.priority].cls}`}>{PRIORITY_META[task.priority].icon}</span>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="flex gap-2">
                      <button type="button" className={`flex-1 ${btnSecondary}`} onClick={() => setProjectForm({ ...selectedProject })}>Modifier</button>
                      <button type="button" className={`flex-1 ${btnDanger}`} onClick={() => deleteProject(selectedProject.id)}>Supprimer</button>
                    </div>
                    <button type="button" className={`w-full ${btnQuiet}`} onClick={() => createNote({ title: `Notes — ${selectedProject.title}`, projectId: selectedProject.id })}>Ouvrir un bloc-notes pour ce projet</button>
                  </div>
                ) : <p className={`text-xs ${T.faint}`}>Sélectionnez un projet.</p>}
              </aside>
            ) : null}
          </>
        ) : null}

        {/* ============================== KANBAN ============================== */}
        {activeTab === 'kanban' ? (
          <div className={`flex-1 overflow-auto p-5 ${isDark ? 'bg-[#05080F]' : 'bg-[#EEF1F6]'}`}>
            <div className="flex h-full gap-4" style={{ minWidth: `${colonnesKanban.length * 268}px` }}>
              {colonnesKanban.map((colonne) => {
                const colTasks = kanbanTasks.filter(colonne.filtre);
                const isOver = dropTarget && dropTarget.status === colonne.id;
                const repere = (i) => (isOver && dropTarget.index === i && draggingTaskId
                  ? <div key={`ph-${i}`} className="h-1.5 rounded-full bg-indigo-500 shadow-[0_0_12px_2px_rgba(99,102,241,.5)]" /> : null);
                const enAjout = ajoutRapide && ajoutRapide.colonne === colonne.id;
                return (
                  <section key={colonne.id}
                    onDragOver={(e) => handleColumnDragOver(e, colonne.id, colTasks.length)}
                    onDrop={(e) => handleColumnDrop(e, colonne.id, colTasks.length)}
                    className={`flex h-full w-[258px] shrink-0 flex-col overflow-hidden rounded-2xl border transition ${T.panel} ${isOver ? 'border-indigo-500 ring-2 ring-indigo-500/25' : ''}`}>

                    <div className={`flex items-center justify-between gap-2 border-b px-3 py-2.5 ${T.border} ${T.inset}`}>
                      {editingColumn === colonne.id ? (
                        <input autoFocus value={columnDraft}
                          onChange={(e) => setColumnDraft(e.target.value)}
                          onBlur={() => saveColumnLabel(colonne.statut)}
                          onKeyDown={(e) => { if (e.key === 'Enter') saveColumnLabel(colonne.statut); if (e.key === 'Escape') setEditingColumn(null); }}
                          className={`min-w-0 flex-1 rounded-lg border px-2 py-1 text-xs font-extrabold outline-none focus:border-indigo-500 ${isDark ? 'bg-[#0A1220] border-[#28344F] text-slate-100' : 'bg-white border-slate-300 text-slate-900'}`} />
                      ) : (
                        <h3 className="flex min-w-0 items-center gap-2 text-xs font-extrabold">
                          {colonne.avatar ? <Avatar name={colonne.avatar} size="sm" /> : <span className={`h-2 w-2 shrink-0 rounded-full ${colonne.point || 'bg-slate-400'}`} />}
                          {colonne.statut ? (
                            <button type="button" title="Cliquez pour renommer la colonne"
                              onClick={() => { setColumnDraft(colonne.titre); setEditingColumn(colonne.id); }}
                              className="truncate rounded px-0.5 hover:text-indigo-400">{colonne.titre}</button>
                          ) : <span className="truncate">{colonne.titre}</span>}
                          <span className={`shrink-0 rounded-full px-2 py-0.5 font-mono text-[10px] ${T.raise} ${T.muted}`}>{colTasks.length}</span>
                        </h3>
                      )}
                      <button type="button" title={`Ajouter dans « ${colonne.titre} »`}
                        onClick={() => setAjoutRapide({ colonne: colonne.id, texte: '' })}
                        className={`shrink-0 rounded-lg px-2 py-1 text-sm font-bold ${T.raise} ${T.muted} hover:text-indigo-400`}>+</button>
                    </div>
                    <div className={`h-1 ${colonne.barre}`} />

                    <div className="flex-1 space-y-2 overflow-y-auto p-3">
                      {colTasks.map((task, index) => {
                        const bloqueurs = (task.bloquePar || []).map((id) => allTasks.find((x) => x.id === id)).filter(Boolean);
                        const enAttente = bloqueurs.filter((b) => b.status !== 'DONE');
                        return (
                          <React.Fragment key={task.id}>
                            {repere(index)}
                            <article draggable
                              onDragStart={(e) => handleCardDragStart(e, task.id)}
                              onDragEnd={handleDragEnd}
                              onDragOver={(e) => handleCardDragOver(e, colonne.id, index)}
                              onClick={() => setEditingTask({ ...task, projectId: task.project.id })}
                              className={`cursor-grab rounded-xl border p-3 shadow-sm transition active:cursor-grabbing ${T.raise} hover:border-indigo-500/50 ${draggingTaskId === task.id ? 'opacity-40' : ''}`}>
                              <div className="mb-2 flex items-center justify-between gap-2">
                                <span className={`truncate rounded bg-gradient-to-r px-2 py-0.5 text-[9px] font-bold text-white ${task.project.color}`}>{task.project.title}</span>
                                <span className={`shrink-0 rounded border px-1.5 py-0.5 text-[9px] font-bold ${PRIORITY_META[task.priority].cls}`}>{PRIORITY_META[task.priority].icon}</span>
                              </div>
                              <h4 className="mb-2 text-xs font-bold leading-snug">{task.title}</h4>
                              {task.subtasks.length ? (
                                <div className={`mb-2 h-1.5 w-full overflow-hidden rounded-full ${T.inset}`}>
                                  <div className="h-full rounded-full bg-emerald-500" style={{ width: `${Math.round(taskProgress(task) * 100)}%` }} />
                                </div>
                              ) : null}
                              {enAttente.length ? (
                                <div className="mb-2 rounded-lg border border-amber-500/40 bg-amber-500/10 px-1.5 py-0.5 text-[9px] font-bold text-amber-300">
                                  En attente de {enAttente.map((b) => b.ref).join(', ')}
                                </div>
                              ) : null}
                              <div className={`flex items-center justify-between border-t pt-2 text-[10px] ${T.border} ${T.faint}`}>
                                <span className="flex items-center gap-1.5">
                                  <Avatar name={task.assignee} size="sm" />
                                  <span className="font-mono font-bold">{task.ref}</span>
                                </span>
                                <span className="flex items-center gap-2 font-mono">
                                  {(task.commentaires || []).length ? <span title="commentaires">{(task.commentaires || []).length} 💬</span> : null}
                                  {task.subtasks.length ? `${task.subtasks.filter((sb) => sb.status === 'DONE').length}/${task.subtasks.length}` : formatDayShort(task.startDate)}
                                </span>
                              </div>
                            </article>
                          </React.Fragment>
                        );
                      })}
                      {repere(colTasks.length)}

                      {enAjout ? (
                        <div className={`rounded-xl border p-2 ${T.border} ${T.raise}`}>
                          <textarea autoFocus rows="2" value={ajoutRapide.texte}
                            onChange={(e) => setAjoutRapide({ ...ajoutRapide, texte: e.target.value })}
                            onKeyDown={(e) => {
                              if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); creerDepuisColonne(colonne, ajoutRapide.texte); }
                              if (e.key === 'Escape') setAjoutRapide(null);
                            }}
                            placeholder="Titre de la tâche, puis Entrée"
                            className={`w-full resize-none rounded-lg border px-2 py-1.5 text-xs outline-none focus:border-indigo-500 ${isDark ? 'bg-[#0A1220] border-[#28344F] text-slate-100' : 'bg-white border-slate-300 text-slate-900'}`} />
                          <div className="mt-1.5 flex items-center justify-between">
                            <span className={`text-[10px] ${T.faint}`}>Entrée pour ajouter · Échap pour fermer</span>
                            <button type="button" className="text-[11px] font-bold text-indigo-400" onClick={() => creerDepuisColonne(colonne, ajoutRapide.texte)}>Ajouter</button>
                          </div>
                        </div>
                      ) : (
                        <button type="button" onClick={() => setAjoutRapide({ colonne: colonne.id, texte: '' })}
                          className={`w-full rounded-xl border border-dashed py-2.5 text-center text-[11px] ${T.border} ${T.faint} hover:border-indigo-500/50 hover:text-indigo-400`}>
                          {isOver ? 'Déposez ici' : '+ Ajouter une tâche'}
                        </button>
                      )}
                    </div>
                  </section>
                );
              })}
            </div>
          </div>
        ) : null}

        {/* ============================== PLANNING ============================== */}
        {activeTab === 'planning' ? (
          <div id="timeline-viewport" onMouseDown={startPan} onScroll={onTimelineScroll}
            className={`flex-1 overflow-auto ${panning ? 'cursor-grabbing select-none' : ''} ${isDark ? 'bg-[#05080F]' : 'bg-[#EEF1F6]'}`}>
            <div style={{ width: `${timelineWidth + 240}px`, minWidth: '100%' }}>

              <div className={`sticky top-0 z-30 flex h-7 border-b ${T.rail} ${T.border}`}>
                <div style={{ width: '240px' }} className={`sticky left-0 z-40 flex items-center border-r px-4 text-[10px] font-bold uppercase tracking-wide ${T.rail} ${T.border} ${T.faint}`}>Semaines</div>
                <div className="flex">
                  {timelineWeeks.map((w, i) => (
                    <div key={i} style={{ width: `${w.days * columnWidth}px` }}
                      className={`flex h-full items-center justify-center border-r border-indigo-500/20 text-[10px] font-extrabold uppercase text-indigo-400 ${i % 2 === 0 ? 'bg-indigo-500/[0.07]' : ''}`}>
                      {w.days * columnWidth > 110 ? `Semaine ${w.weekNum}` : w.days * columnWidth > 24 ? `S${w.weekNum}` : ''}
                    </div>
                  ))}
                </div>
              </div>

              <div className={`sticky top-7 z-30 flex h-12 border-b ${T.rail} ${T.border}`}>
                <div style={{ width: '240px' }} className={`sticky left-0 z-40 flex items-center justify-between border-r px-4 ${T.rail} ${T.border}`}>
                  <span className="text-[11px] font-extrabold">Collaborateurs</span>
                  <button type="button" onClick={() => setIsEquipeOpen(true)} title="Gérer l'équipe"
                    className={`rounded-lg px-2 py-0.5 text-[11px] font-bold ${T.raise} ${T.muted} hover:text-indigo-400`}>+</button>
                </div>
                {dayHeaderHalves}
              </div>

              <div className="relative">
                {planningRows.map((row) => {
                  const isDropTarget = drag && drag.kind === 'entry' && drag.targetPerson === row.person && drag.person !== row.person;
                  return (
                    <div key={row.person} data-person={row.person} ref={(el) => { rowRefs.current[row.person] = el; }} style={{ height: `${row.height}px` }}
                      className={`flex border-b ${T.border} ${isDropTarget ? 'bg-indigo-500/10 ring-1 ring-inset ring-indigo-500/40' : ''}`}>
                      <div style={{ width: '240px' }} className={`sticky left-0 z-20 flex items-center gap-3 border-r px-4 ${T.panel}`}>
                        <Avatar name={row.person} />
                        <div className="min-w-0 flex-1">
                          <div className="truncate text-xs font-bold">{row.person}</div>
                          <div className={`text-[10px] ${T.faint}`}>{row.entries.length} entrée(s) · {row.workload} j</div>
                        </div>
                        {isDropTarget ? <span className="rounded bg-indigo-600 px-1.5 py-0.5 text-[9px] font-bold text-white">ici</span> : null}
                      </div>

                      <div className="relative" style={{ width: `${timelineWidth}px` }}>
                        {/* Fond + zone de création : une seule surface, la demi-journée est
                            déduite de la position du clic (des milliers de boutons sinon). */}
                        <div className="absolute inset-0" style={gridStyle} />
                        <div className="pointer-events-none absolute inset-0 flex">
                          {row.conflicts.map((c) => (
                            <div key={c.half} className="conflict-cell absolute inset-y-0"
                              style={{ left: `${c.half * (columnWidth / 2)}px`, width: `${columnWidth / 2}px` }} />
                          ))}
                        </div>
                        {todayOffset >= 0 ? (
                          <div className="pointer-events-none absolute inset-y-0 bg-indigo-500/[0.08]"
                            style={{ left: `${todayOffset * columnWidth}px`, width: `${columnWidth}px` }} />
                        ) : null}
                        <div
                          className="absolute inset-0"
                          onMouseMove={(e) => {
                            const survol = survolRefs.current[row.person];
                            if (!survol) return;
                            const rect = e.currentTarget.getBoundingClientRect();
                            const demi = Math.max(0, Math.floor((e.clientX - rect.left) / (columnWidth / 2)));
                            survol.style.display = 'block';
                            survol.style.left = `${demi * (columnWidth / 2)}px`;
                            survol.style.width = `${columnWidth / 2}px`;
                          }}
                          onMouseLeave={() => { const h = survolRefs.current[row.person]; if (h) h.style.display = 'none'; }}
                          onClick={(e) => {
                            if (movedRef.current) return;
                            const rect = e.currentTarget.getBoundingClientRect();
                            const demi = Math.max(0, Math.floor((e.clientX - rect.left) / (columnWidth / 2)));
                            openEntryCreator(row.person, Math.floor(demi / 2), demi % 2 === 1 ? 'PM' : 'AM');
                          }}
                          title={`Cliquez une demi-journée pour planifier ${row.person}`} />
                        <div ref={(el) => { survolRefs.current[row.person] = el; }}
                          className="pointer-events-none absolute inset-y-0 hidden bg-indigo-500/20" />

                        {isDropTarget ? (
                          <div className="pointer-events-none absolute" style={{ left: `${drag.snapStart * (columnWidth / 2)}px`, width: `${drag.snapLen * (columnWidth / 2)}px`, top: '10px' }}>
                            <div className="h-6 rounded-md border-2 border-dashed border-indigo-400 bg-indigo-500/20" />
                          </div>
                        ) : null}

                        <div className="pointer-events-none relative h-full">
                          {row.entries.map((entry) => {
                            const dragging = drag && drag.kind === 'entry' && drag.id === entry.id;
                            const halfPx = columnWidth / 2;
                            let left = entry.startHalf * halfPx;
                            let width = entry.lenHalf * halfPx;
                            if (dragging) {
                              if (drag.action === 'move') left += drag.deltaX;
                              else if (drag.action === 'resize-left') { left += drag.deltaX; width -= drag.deltaX; }
                              else width += drag.deltaX;
                            }
                            const top = entry.lane * 30 + 10;
                            const shownWidth = Math.max(halfPx * 0.8, width);
                            const tiny = shownWidth < 54;      // le titre ne tient pas dedans
                            const compact = shownWidth < 96;   // pas la place pour l'icône et le badge
                            return (
                              <React.Fragment key={entry.id}>
                                {dragging && (!drag.targetPerson || drag.targetPerson === row.person) ? (
                                  <div style={{ left: `${drag.snapStart * halfPx}px`, width: `${drag.snapLen * halfPx}px`, top: `${top}px` }}
                                    className="absolute h-6 rounded-md border-2 border-dashed border-indigo-400 bg-indigo-500/10" />
                                ) : null}
                                <div
                                  style={{ left: `${left}px`, width: `${Math.max(halfPx * 0.8, width)}px`, top: `${top}px` }}
                                  data-nopan
                                  onMouseDown={(e) => startDrag(e, { kind: 'entry', id: entry.id, action: 'move', unit: 0.5, startUnits: entry.startHalf, lenUnits: entry.lenHalf, person: row.person })}
                                  onClick={(e) => { if (movedRef.current) { e.preventDefault(); return; } setEditingEntry(entry); }}
                                  title={`${entry.title} — ${formatDateFr(entry.startDate)} ${entry.slot} · ${entry.duration} j`}
                                  className={`group pointer-events-auto absolute flex h-6 cursor-grab items-center rounded-md border border-white/20 bg-gradient-to-r ${entry.color} px-1.5 text-[10px] font-bold text-white shadow-md transition hover:brightness-110 active:cursor-grabbing ${dragging ? 'z-[15] ring-2 ring-indigo-300' : 'z-10'}`}>
                                  <div onMouseDown={(e) => startDrag(e, { kind: 'entry', id: entry.id, action: 'resize-left', unit: 0.5, startUnits: entry.startHalf, lenUnits: entry.lenHalf, person: row.person })} className="absolute inset-y-0 left-0 w-2 cursor-ew-resize rounded-l-md bg-white/40 opacity-0 group-hover:opacity-100" />
                                  <div className="pointer-events-none flex w-full items-center justify-between gap-1 px-1">
                                    <span className="truncate">{tiny || compact ? '' : (entry.slot === 'PM' ? '☾ ' : '☀ ')}{entry.title}</span>
                                    {!compact && entry.lenHalf >= 2 ? <span className="shrink-0 rounded bg-black/35 px-1 font-mono text-[9px]">{entry.duration} j</span> : null}
                                  </div>

                                  <div onMouseDown={(e) => startDrag(e, { kind: 'entry', id: entry.id, action: 'resize-right', unit: 0.5, startUnits: entry.startHalf, lenUnits: entry.lenHalf, person: row.person })} className="absolute inset-y-0 right-0 w-2 cursor-ew-resize rounded-r-md bg-white/40 opacity-0 group-hover:opacity-100" />
                                  {dragging ? (
                                    <div className="pointer-events-none absolute -top-7 left-0 whitespace-nowrap rounded-md border border-indigo-500 bg-slate-900 px-2 py-1 font-mono text-[10px] text-slate-100 shadow-xl">
                                      {formatDateFr(formatDateIso(addDays(timelineStart, Math.floor(drag.snapStart / 2))))} · {drag.snapStart % 2 === 1 ? 'PM' : 'AM'} · {drag.snapLen / 2} j
                                      {drag.targetPerson && drag.targetPerson !== row.person ? ` → ${drag.targetPerson}` : ''}
                                    </div>
                                  ) : null}
                                </div>
                              </React.Fragment>
                            );
                          })}
                        </div>
                      </div>
                    </div>
                  );
                })}
                {planningRows.length === 0 ? <div className={`px-8 py-16 text-center text-sm ${T.faint}`}>Aucun collaborateur ne correspond au filtre.</div> : null}
              </div>
            </div>
          </div>
        ) : null}

        {/* =============================== NOTES =============================== */}
        {activeTab === 'notes' ? (
          <div className="flex flex-1 overflow-hidden">
            <aside className={`flex w-72 shrink-0 flex-col border-r ${T.panel}`}>
              <div className={`flex items-center justify-between border-b px-4 py-3 ${T.border} ${T.inset}`}>
                <h2 className="text-[11px] font-extrabold uppercase tracking-wide">Bloc-notes</h2>
                <button type="button" onClick={() => createNote(null)} className={`rounded-lg px-2 py-1 text-sm font-bold ${T.raise} ${T.muted} hover:text-indigo-400`}>+</button>
              </div>
              <div className="flex-1 overflow-y-auto p-2">
                {sortedNotes.length === 0 ? <p className={`p-4 text-[11px] ${T.faint}`}>Aucune note. Utilisez cet espace pour vos devis, questions et comparatifs.</p> : null}
                {sortedNotes.map((note) => {
                  const proj = projects.find((p) => p.id === note.projectId);
                  return (
                    <button key={note.id} type="button" onClick={() => setSelectedNoteId(note.id)}
                      className={`mb-1.5 flex w-full gap-2 rounded-xl border px-3 py-2.5 text-left transition ${note.id === selectedNoteId ? `border-indigo-500/60 ${isDark ? 'bg-indigo-500/10' : 'bg-indigo-50'}` : `${T.border} ${T.hover}`}`}>
                      <span className={`mt-0.5 h-full w-1 shrink-0 rounded-full ${noteBar(note.color)}`} />
                      <span className="min-w-0 flex-1">
                        <span className="flex items-center gap-1.5">
                          {note.pinned ? <span className="text-[10px]">📌</span> : null}
                          <span className="truncate text-[12px] font-bold">{note.title || 'Note sans titre'}</span>
                        </span>
                        <span className={`mt-0.5 block truncate text-[10px] ${T.faint}`}>{proj ? proj.title + ' · ' : ''}{(note.body || '').split('\n')[0] || 'Vide'}</span>
                      </span>
                    </button>
                  );
                })}
              </div>
            </aside>

            <section className={`flex flex-1 flex-col overflow-hidden ${isDark ? 'bg-[#05080F]' : 'bg-[#EEF1F6]'}`}>
              {selectedNote ? (
                <>
                  <div className={`flex flex-wrap items-center gap-2 border-b px-5 py-3 ${T.border} ${T.rail}`}>
                    <input value={selectedNote.title} placeholder="Titre de la note"
                      onChange={(e) => patchNote(selectedNote.id, { title: e.target.value }, true)}
                      onBlur={(e) => patchNote(selectedNote.id, { title: e.target.value })}
                      className={`min-w-0 flex-1 bg-transparent text-base font-extrabold outline-none ${isDark ? 'placeholder-slate-600' : 'placeholder-slate-400'}`} />
                    <select value={selectedNote.projectId} onChange={(e) => patchNote(selectedNote.id, { projectId: e.target.value })} className={`w-44 shrink-0 ${champBase}`}>
                      <option value="">Sans projet</option>
                      {projects.map((p) => <option key={p.id} value={p.id}>{p.title}</option>)}
                    </select>
                    <select value={selectedNote.color} onChange={(e) => patchNote(selectedNote.id, { color: e.target.value })} className={`w-28 shrink-0 ${champBase}`}>
                      {NOTE_COLORS.map((c) => <option key={c.value} value={c.value}>{c.name}</option>)}
                    </select>
                    <button type="button" onClick={() => patchNote(selectedNote.id, { pinned: !selectedNote.pinned })} className={selectedNote.pinned ? btnPrimary : btnSecondary}>📌</button>
                    <button type="button" onClick={() => deleteNote(selectedNote.id)} className={btnDanger}>Supprimer</button>
                  </div>
                  <textarea
                    value={selectedNote.body}
                    onChange={(e) => patchNote(selectedNote.id, { body: e.target.value }, true)}
                    onBlur={(e) => patchNote(selectedNote.id, { body: e.target.value })}
                    placeholder="Devis, contacts, questions à poser, comparatifs… Tout ce qui encombrerait la roadmap va ici."
                    className={`flex-1 resize-none bg-transparent p-6 font-mono text-[13px] leading-relaxed outline-none ${isDark ? 'placeholder-slate-600' : 'placeholder-slate-400'}`} />
                  <div className={`border-t px-5 py-2 text-[10px] ${T.border} ${T.faint}`}>
                    Sauvegarde automatique · modifiée le {new Date(selectedNote.updatedAt).toLocaleString('fr-FR')}
                  </div>
                </>
              ) : (
                <div className="flex flex-1 items-center justify-center">
                  <button type="button" onClick={() => createNote(null)} className={btnPrimary}>Créer votre première note</button>
                </div>
              )}
            </section>
          </div>
        ) : null}
      </main>

      {/* ------------------------------- Modales ------------------------------- */}
      {entryForm ? (
        <Modal T={T} title={entryForm.id ? 'Modifier l’entrée' : 'Planifier une entrée'}
          subtitle={`${entryForm.assignee} · ${formatDayShort(entryForm.startDate)} · ${entryForm.slot === 'PM' ? 'après-midi' : 'matin'}`}
          onClose={() => setEntryForm(null)}
          footer={<>
            <span className={`text-[11px] ${T.faint}`}>Durée minimale : 0,5 jour</span>
            <div className="flex gap-2">
              <button type="button" className={btnSecondary} onClick={() => setEntryForm(null)}>Annuler</button>
              <button type="button" className={btnPrimary} onClick={() => saveEntry(entryForm)}>{entryForm.id ? 'Enregistrer' : 'Planifier'}</button>
            </div>
          </>}>
          <div className="space-y-3">
            <div className={`rounded-xl border p-3 ${T.raise}`}>
              <Field T={T} label="Reprendre un projet, une tâche ou une sous-tâche" hint="Remplit le titre, l'étiquette et la couleur en un clic.">
                <select className={inputCls} value=""
                  onChange={(e) => {
                    const v = e.target.value;
                    if (!v) return;
                    const [type, id] = v.split(':');
                    if (type === 'proj') { const p = projects.find((x) => x.id === id); if (p) setEntryForm({ ...entryForm, title: p.title, tag: p.category, color: p.color }); }
                    else if (type === 'task') { const t = allTasks.find((x) => x.id === id); if (t) setEntryForm({ ...entryForm, title: t.title, tag: t.project.category, color: t.project.color }); }
                    else {
                      let found = null; let parent = null;
                      allTasks.forEach((t) => t.subtasks.forEach((s) => { if (s.id === id) { found = s; parent = t; } }));
                      if (found) setEntryForm({ ...entryForm, title: found.title, tag: parent.title, color: parent.project.color, assignee: entryForm.assignee });
                    }
                  }}>
                  <option value="">Choisir un modèle…</option>
                  <optgroup label="Projets">{projects.map((p) => <option key={p.id} value={`proj:${p.id}`}>{p.title}</option>)}</optgroup>
                  <optgroup label="Tâches">{allTasks.map((t) => <option key={t.id} value={`task:${t.id}`}>{t.title}</option>)}</optgroup>
                  <optgroup label="Sous-tâches">
                    {allTasks.flatMap((t) => t.subtasks.map((s) => <option key={s.id} value={`sub:${s.id}`}>{t.title} › {s.title}</option>))}
                  </optgroup>
                </select>
              </Field>
            </div>
            <Field T={T} label="Titre"><input className={inputCls} value={entryForm.title} autoFocus onChange={(e) => setEntryForm({ ...entryForm, title: e.target.value })} placeholder="Ex. Visite du domaine" /></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field T={T} label="Étiquette"><input className={inputCls} value={entryForm.tag} onChange={(e) => setEntryForm({ ...entryForm, tag: e.target.value })} /></Field>
              <Field T={T} label="Couleur">
                <select className={inputCls} value={entryForm.color} onChange={(e) => setEntryForm({ ...entryForm, color: e.target.value })}>
                  {COLOR_OPTIONS.map((c) => <option key={c.value} value={c.value}>{c.name}</option>)}
                </select>
              </Field>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <Field T={T} label="Collaborateur">
                <ChoixMembre T={T} inputCls={inputCls} valeur={entryForm.assignee} membres={collaborators}
                  onChange={(v) => setEntryForm({ ...entryForm, assignee: v })} onGerer={() => setIsEquipeOpen(true)} />
              </Field>
              <Field T={T} label="Durée (jours)"><input type="number" step="0.5" min="0.5" className={inputCls} value={entryForm.duration} onChange={(e) => setEntryForm({ ...entryForm, duration: e.target.value })} /></Field>
            </div>
            <div className="grid grid-cols-3 gap-3">
              <Field T={T} label="Date"><input type="date" className={inputCls} value={entryForm.startDate} onChange={(e) => setEntryForm({ ...entryForm, startDate: e.target.value })} /></Field>
              <Field T={T} label="Créneau">
                <select className={inputCls} value={entryForm.slot} onChange={(e) => setEntryForm({ ...entryForm, slot: e.target.value })}>
                  <option value="AM">☀ Matin</option><option value="PM">☾ Après-midi</option>
                </select>
              </Field>
              <Field T={T} label="Fin (incluse)">
                <input type="date" className={inputCls} min={entryForm.startDate} value={endFromDuration(entryForm.startDate, entryForm.duration)}
                  onChange={(e) => { if (!isIsoDate(e.target.value)) return; setEntryForm({ ...entryForm, duration: durationFromEnd(entryForm.startDate, e.target.value, 0.5) }); }} />
              </Field>
            </div>
          </div>
        </Modal>
      ) : null}

      {editingEntry ? (
        <Modal T={T} title="Entrée de planning" subtitle={`${editingEntry.assignee} · ${formatDayShort(editingEntry.startDate)}`} onClose={() => setEditingEntry(null)}
          footer={<>
            <button type="button" className="text-xs font-bold text-rose-400" onClick={() => deleteEntry(editingEntry.id)}>Supprimer</button>
            <div className="flex gap-2">
              <button type="button" className={btnSecondary} onClick={() => duplicateEntry(editingEntry)}>Dupliquer</button>
              <button type="button" className={btnPrimary} onClick={() => saveEntry(editingEntry)}>Enregistrer</button>
            </div>
          </>}>
          <div className="space-y-3">
            <Field T={T} label="Titre"><input className={inputCls} value={editingEntry.title} onChange={(e) => setEditingEntry({ ...editingEntry, title: e.target.value })} /></Field>
            <div className={`rounded-xl border p-3 ${T.raise}`}>
              <Field T={T} label="Basculer vers un autre collaborateur" hint="Vous pouvez aussi glisser le bloc vers une autre ligne du planning.">
                <div className="flex flex-wrap gap-1.5">
                  {collaborators.map((c) => (
                    <button key={c} type="button" onClick={() => { reassignEntry(editingEntry.id, c); setEditingEntry({ ...editingEntry, assignee: c }); }}
                      className={`flex items-center gap-1.5 rounded-lg border px-2 py-1 text-[10px] font-bold transition ${c === editingEntry.assignee ? 'border-indigo-500 bg-indigo-600 text-white' : `${T.border} ${T.hover} ${T.muted}`}`}>
                      <Avatar name={c} size="sm" />{c}
                    </button>
                  ))}
                </div>
              </Field>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <Field T={T} label="Date"><input type="date" className={inputCls} value={editingEntry.startDate} onChange={(e) => setEditingEntry({ ...editingEntry, startDate: e.target.value })} /></Field>
              <Field T={T} label="Créneau">
                <select className={inputCls} value={editingEntry.slot} onChange={(e) => setEditingEntry({ ...editingEntry, slot: e.target.value })}>
                  <option value="AM">☀ Matin</option><option value="PM">☾ Après-midi</option>
                </select>
              </Field>
            </div>
            <div className="grid grid-cols-3 gap-3">
              <Field T={T} label="Fin (incluse)">
                <input type="date" className={inputCls} min={editingEntry.startDate} value={endFromDuration(editingEntry.startDate, editingEntry.duration)}
                  onChange={(e) => { if (!isIsoDate(e.target.value)) return; setEditingEntry({ ...editingEntry, duration: durationFromEnd(editingEntry.startDate, e.target.value, 0.5) }); }} />
              </Field>

                  <button type="button" className="text-[11px] font-bold text-indigo-400" onClick={copierAdresse}>Copier</button>
                </div>
                <code className="block break-all font-mono text-[10px] text-indigo-300">{adresseTableau}</code>
                <p className={`mt-1.5 text-[10px] leading-relaxed ${T.faint}`}>
                  Dépôt : <span className="font-mono">{sync.owner || '?'}/{sync.repo || '?'}</span> · fichier <span className="font-mono">{FICHIER}</span>
                  {' '}sur la branche <span className="font-mono">{sync.branch}</span>
                  {sync.branch !== sync.brancheSite ? <span className="text-emerald-400"> (séparée du site : aucune reconstruction déclenchée)</span> : null}
                  {syncEtat.poids ? <> · taille actuelle <span className="font-mono">{(syncEtat.poids / 1024).toFixed(1)} ko</span></> : null}
                </p>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <Field T={T} label="Votre prénom">
                  <input className={inputCls} value={sync.nom} onChange={(e) => setSync({ ...sync, nom: e.target.value.slice(0, 40) })} />
                </Field>
                <Field T={T} label="Mot de passe du tableau" hint="Il chiffre le fichier.">
                  <input type="password" className={inputCls} value={password}
                    onChange={(e) => { setPassword(e.target.value); saveJson(PASS_KEY, { value: e.target.value }); }} />
                </Field>
              </div>

              <Field T={T} label="Jeton GitHub" hint="Nécessaire uniquement pour enregistrer. Sans lui, vous êtes en lecture seule.">
                <input type="password" className={inputCls} value={sync.token}
                  onChange={(e) => setSync({ ...sync, token: e.target.value.trim() })} placeholder="github_pat_…" />
              </Field>

              {(!sync.owner || !sync.repo) ? (
                <div className="space-y-2 rounded-lg border border-amber-500/40 bg-amber-500/10 p-2.5">
                  <p className="text-[11px] text-amber-200">Dépôt non détecté : cette page n'est pas servie par GitHub Pages. Renseignez-le à la main.</p>
                  <div className="grid grid-cols-2 gap-2">
                    <input className={inputCls} value={sync.owner} onChange={(e) => setSync({ ...sync, owner: e.target.value.trim() })} placeholder="votre-compte" />
                    <input className={inputCls} value={sync.repo} onChange={(e) => setSync({ ...sync, repo: e.target.value.trim() })} placeholder="mon-tableau" />
                  </div>
                </div>
              ) : null}

              <div className="flex gap-2">
                <button type="button" className={`flex-1 ${btnSecondary}`} onClick={() => setSync({ ...sync, actif: !sync.actif })}>
                  {sync.actif ? 'Désactiver le partage' : 'Activer le partage'}
                </button>
                <button type="button" className={`flex-1 ${btnQuiet}`} onClick={leaveBoard}>Oublier le mot de passe</button>
              </div>
            </div>

            {/* Remise à zéro */}
            <div className={`space-y-2 rounded-xl border p-3 ${T.raise}`}>
              <h4 className="text-[11px] font-extrabold uppercase tracking-wide">Repartir de zéro</h4>
              <p className={`text-[11px] leading-relaxed ${T.faint}`}>
                Vider le tableau, recharger l'exemple, ou effacer tout ce que cet appareil retient.
              </p>
              <button type="button" className={`w-full ${btnSecondary}`} onClick={() => { setIsConfigOpen(false); setIsResetOpen(true); }}>Remise à zéro…</button>
            </div>

            {/* Entretien du dépôt */}
            <div className={`space-y-2 rounded-xl border p-3 ${T.raise}`}>
              <h4 className="text-[11px] font-extrabold uppercase tracking-wide">Entretien</h4>
              <p className={`text-[11px] leading-relaxed ${T.faint}`}>
                Chaque enregistrement ajoute une version au dépôt : quelques kilo-octets, sur une branche
                qui ne touche pas au site. Après des mois d'usage, vous pouvez repartir d'un historique vierge
                sans rien perdre du tableau.
              </p>
              <button type="button" className={`w-full ${btnSecondary}`} onClick={compacterHistorique}>Repartir d'un historique vierge</button>
            </div>

            {/* Sauvegarde sur le disque */}
            <div className={`space-y-2 rounded-xl border p-3 ${T.raise}`}>
              <h4 className="text-[11px] font-extrabold uppercase tracking-wide">Copie sur votre ordinateur</h4>
              <div className="flex gap-2">
                <button type="button" className={`flex-1 ${btnSecondary}`} onClick={exportJson}>Exporter</button>
                <button type="button" className={`flex-1 ${btnSecondary}`} onClick={() => fileInputRef.current && fileInputRef.current.click()}>Importer</button>
                <input ref={fileInputRef} type="file" accept="application/json,.json" className="hidden" onChange={(e) => { importJson(e.target.files && e.target.files[0]); e.target.value = ''; }} />
              </div>
            </div>

            {/* Identité du tableau et échéance */}
            <div className={`space-y-3 rounded-xl border p-3 ${T.raise}`}>
              <h4 className="text-[11px] font-extrabold uppercase tracking-wide">Votre tableau</h4>
              <div className="grid grid-cols-2 gap-3">
                <Field T={T} label="Nom du tableau" hint="Affiché en haut à gauche.">
                  <input className={inputCls} value={data.board.titre}
                    onChange={(e) => commit((prev) => ({ ...prev, board: { ...prev.board, titre: e.target.value } }))} />
                </Field>
                <Field T={T} label="Préfixe des références" hint="Les tâches existantes gardent la leur.">
                  <input className={inputCls} value={data.board.prefixe}
                    onChange={(e) => commit((prev) => ({ ...prev, board: { ...prev.board, prefixe: e.target.value } }))} />
                </Field>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <Field T={T} label="Date d'échéance" hint="Repère animé sur la roadmap.">
                  <input type="date" className={inputCls} value={event.date}
                    onChange={(e) => { if (isIsoDate(e.target.value)) commit((prev) => ({ ...prev, event: { ...prev.event, date: e.target.value } })); }} />
                </Field>
                <Field T={T} label="Nom de l'échéance" hint="Ex. livraison, mariage, examen…">
                  <input className={inputCls} value={event.label} onChange={(e) => commit((prev) => ({ ...prev, event: { ...prev.event, label: e.target.value } }))} />
                </Field>
              </div>
            </div>
          </div>
        </Modal>
      ) : null}

      {isGuideOpen ? (
        <Modal T={T} size="lg" title="Obtenir un jeton GitHub" subtitle="Trois minutes, une seule fois" onClose={() => setIsGuideOpen(false)}
          footer={<><span className={`text-[11px] ${T.faint}`}>Le jeton reste sur votre appareil.</span>
            <button type="button" className={btnSecondary} onClick={() => setIsGuideOpen(false)}>Fermer</button></>}>
          <ol className="space-y-3 text-[12px] leading-relaxed">
            <li><strong>1.</strong> Sur GitHub, cliquez votre photo en haut à droite, puis <strong>Settings</strong> (tout en bas du menu).</li>
            <li><strong>2.</strong> Dans la colonne de gauche, descendez jusqu'à <strong>Developer settings</strong>, le dernier élément.</li>
            <li><strong>3.</strong> <strong>Personal access tokens</strong> › <strong>Fine-grained tokens</strong> › bouton <strong>Generate new token</strong>.</li>
            <li><strong>4.</strong> Donnez-lui un nom (« mon tableau »), une expiration longue, puis dans <strong>Repository access</strong> choisissez <em>Only select repositories</em> et cochez votre dépôt <span className="font-mono">{sync.repo || 'mon-tableau'}</span>.</li>
            <li><strong>5.</strong> Dans <strong>Repository permissions</strong>, cherchez la ligne <strong>Contents</strong> et mettez-la sur <strong>Read and write</strong>. Ne touchez à rien d'autre.</li>
            <li><strong>6.</strong> <strong>Generate token</strong>, puis copiez la longue chaîne affichée — elle ne sera plus jamais montrée.</li>
            <li><strong>7.</strong> Collez-la dans le champ « Jeton GitHub » de la fenêtre précédente. C'est terminé.</li>
          </ol>
          <div className={`mt-4 rounded-xl border p-3 text-[11px] leading-relaxed ${T.border} ${T.inset} ${T.muted}`}>
            Ce jeton autorise uniquement la lecture et l'écriture de fichiers dans ce dépôt.
            Le même jeton peut être collé sur tous vos appareils et sur ceux de vos collaborateurs.
            Les personnes sans jeton peuvent quand même consulter le tableau : elles ont juste besoin du mot de passe.
          </div>
        </Modal>
      ) : null}

      {isEquipeOpen ? (
        <Modal T={T} title="L'équipe" subtitle="Les personnes à qui vous pouvez confier tâches et créneaux"
          onClose={() => { setIsEquipeOpen(false); setMembreEnEdition(null); }}
          footer={<>
            <span className={`text-[11px] ${T.faint}`}>Renommer met à jour toutes les affectations.</span>
            <button type="button" className={btnSecondary} onClick={() => { setIsEquipeOpen(false); setMembreEnEdition(null); }}>Fermer</button>
          </>}>
          <div className="space-y-4">

            {/* Ajout */}
            <form className={`flex flex-wrap items-end gap-2 rounded-xl border p-3 ${T.raise}`}
              onSubmit={(e) => { e.preventDefault();
                if (ajouterMembre(nouveauMembre.nom, nouveauMembre.role, nouveauMembre.couleur))
                  setNouveauMembre({ nom: '', role: '', couleur: COULEURS_MEMBRE[((data.equipe || []).length + 1) % COULEURS_MEMBRE.length].valeur }); }}>
              <div className="min-w-[9rem] flex-1">
                <Field T={T} label="Prénom ou nom">
                  <input className={inputCls} value={nouveauMembre.nom} placeholder="Ex. Camille"
                    onChange={(e) => setNouveauMembre({ ...nouveauMembre, nom: e.target.value })} />
                </Field>
              </div>
              <div className="min-w-[9rem] flex-1">
                <Field T={T} label="Rôle (facultatif)">
                  <input className={inputCls} value={nouveauMembre.role} placeholder="Ex. graphiste"
                    onChange={(e) => setNouveauMembre({ ...nouveauMembre, role: e.target.value })} />
                </Field>
              </div>
              <div className="flex items-center gap-1.5 pb-1">
                {COULEURS_MEMBRE.map((c) => (
                  <button key={c.valeur} type="button" title={c.valeur}
                    onClick={() => setNouveauMembre({ ...nouveauMembre, couleur: c.valeur })}
                    className={`h-5 w-5 rounded-lg ${c.classe} transition ${nouveauMembre.couleur === c.valeur ? 'ring-2 ring-indigo-400' : 'opacity-60 hover:opacity-100'}`} />
                ))}
              </div>
              <button type="submit" className={btnPrimary}>Ajouter</button>
            </form>

            {/* Membres déclarés */}
            <div className={`overflow-hidden rounded-xl border ${T.raise}`}>
              <div className={`border-b px-3 py-2 text-[11px] font-extrabold uppercase tracking-wide ${T.border} ${T.inset}`}>
                Équipe ({(data.equipe || []).length})
              </div>
              <div className="divide-y divide-white/5">
                {(data.equipe || []).length === 0 ? (
                  <p className={`px-3 py-4 text-[11px] ${T.faint}`}>Personne pour l'instant. Ajoutez au moins vous-même.</p>
                ) : null}
                {(data.equipe || []).map((m) => {
                  const enEdition = membreEnEdition && membreEnEdition.id === m.id;
                  const charge = chargeParPersonne.get(m.nom) || 0;
                  const autres = collaborators.filter((c) => c !== m.nom);
                  return (
                    <div key={m.id} className="px-3 py-2.5">
                      {enEdition ? (
                        <div className="space-y-2">
                          <div className="flex flex-wrap gap-2">
                            <input autoFocus className={`${inputCls} min-w-[8rem] flex-1`} value={membreEnEdition.nom}
                              onChange={(e) => setMembreEnEdition({ ...membreEnEdition, nom: e.target.value })} />
                            <input className={`${inputCls} min-w-[8rem] flex-1`} value={membreEnEdition.role || ''} placeholder="Rôle"
                              onChange={(e) => setMembreEnEdition({ ...membreEnEdition, role: e.target.value })} />
                          </div>
                          <div className="flex flex-wrap items-center gap-1.5">
                            <span className={`text-[10px] font-bold uppercase tracking-wide ${T.faint}`}>Couleur</span>
                            {COULEURS_MEMBRE.map((c) => (
                              <button key={c.valeur} type="button" title={c.valeur}
                                onClick={() => setMembreEnEdition({ ...membreEnEdition, couleur: c.valeur })}
                                className={`h-5 w-5 rounded-lg ${c.classe} transition ${membreEnEdition.couleur === c.valeur ? 'ring-2 ring-offset-2 ring-indigo-400 ring-offset-transparent' : 'opacity-60 hover:opacity-100'}`} />
                            ))}
                          </div>
                          <div className="flex items-center justify-between gap-2">
                            <span className={`text-[10px] ${T.faint}`}>{charge} élément(s) suivront le nouveau nom</span>
                            <span className="flex gap-2">
                              <button type="button" className={btnQuiet} onClick={() => setMembreEnEdition(null)}>Annuler</button>
                              <button type="button" className={btnPrimary}
                                onClick={() => { renommerMembre(m.id, membreEnEdition.nom, membreEnEdition.role, membreEnEdition.couleur); setMembreEnEdition(null); }}>Enregistrer</button>
                            </span>
                          </div>
                        </div>
                      ) : (
                        <div className="flex items-center gap-3">
                          <Avatar name={m.nom} />
                          <div className="min-w-0 flex-1">
                            <div className="flex items-center gap-2">
                              <span className="truncate text-xs font-bold">{m.nom}</span>
                              {sync.nom === m.nom ? <span className="rounded bg-indigo-600 px-1.5 py-0.5 text-[9px] font-bold text-white">vous</span> : null}
                            </div>
                            <div className={`truncate text-[10px] ${T.faint}`}>
                              {m.role ? m.role + ' · ' : ''}{charge} élément(s) attribué(s)
                            </div>
                          </div>
                          <button type="button" className={btnQuiet} onClick={() => setMembreEnEdition({ id: m.id, nom: m.nom, role: m.role || '', couleur: m.couleur })}>Modifier</button>
                          <button type="button" className="rounded-xl px-2 py-2 text-xs font-bold text-rose-400 hover:bg-rose-500/10"
                            onClick={() => {
                              if (charge > 0) {
                                const propose = autres[0] || 'Non assigné';
                                const cible = window.prompt(
                                  `${m.nom} a ${charge} élément(s).\n\nÀ qui les confier ? Laissez « Non assigné » si personne ne reprend.\n\nNoms possibles : ${autres.join(', ') || 'aucun'}`,
                                  propose);
                                if (cible === null) return;
                                retirerMembre(m.id, cible);
                              } else {
                                if (!window.confirm(`Retirer ${m.nom} de l'équipe ?`)) return;
                                retirerMembre(m.id, 'Non assigné');
                              }
                            }}>Retirer</button>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Noms rencontrés hors équipe */}
            {(() => {
              const declares = new Set((data.equipe || []).map((m) => m.nom.toLowerCase()));
              const orphelins = collaborators.filter((c) => !declares.has(c.toLowerCase()));
              if (!orphelins.length) return null;
              return (
                <div className={`space-y-2 rounded-xl border p-3 ${T.raise}`}>
                  <h4 className={`text-[11px] font-extrabold uppercase tracking-wide ${T.muted}`}>Noms trouvés dans le tableau</h4>
                  <p className={`text-[11px] ${T.faint}`}>Ces personnes apparaissent dans des tâches ou des créneaux sans figurer dans l'équipe.</p>
                  <div className="flex flex-wrap gap-1.5">
                    {orphelins.map((n) => (
                      <button key={n} type="button" onClick={() => integrerMembre(n)}
                        className={`flex items-center gap-1.5 rounded-lg border px-2 py-1 text-[11px] font-bold ${T.border} ${T.hover}`}>
                        <Avatar name={n} size="sm" />{n}
                        <span className="text-indigo-400">+ intégrer</span>
                      </button>
                    ))}
                  </div>
                </div>
              );
            })()}

            <div className={`rounded-xl border p-3 ${T.raise}`}>
              <Field T={T} label="Qui êtes-vous ?" hint="Sert à signer vos messages et au filtre « Mes tâches ».">
                <select className={inputCls} value={sync.nom || ''} onChange={(e) => setSync({ ...sync, nom: e.target.value })}>
                  <option value="">— choisir —</option>
                  {collaborators.map((c) => <option key={c} value={c}>{c}</option>)}
                </select>
              </Field>
            </div>
          </div>
        </Modal>
      ) : null}

      {isResetOpen ? (
        <Modal T={T} title="Repartir de zéro" subtitle="Trois portées, de la plus douce à la plus radicale"
          onClose={() => { setIsResetOpen(false); setResetConfirme(''); }}
          footer={<>
            <button type="button" className="text-[11px] font-bold text-indigo-400" onClick={exportJson}>Exporter d'abord une copie</button>
            <button type="button" className={btnSecondary} onClick={() => { setIsResetOpen(false); setResetConfirme(''); }}>Annuler</button>
          </>}>
          <div className="space-y-3">
            <p className={`rounded-xl border p-3 text-[11px] leading-relaxed ${T.border} ${T.inset} ${T.muted}`}>
              Le tableau contient actuellement <strong>{projects.length} projet(s)</strong>,{' '}
              <strong>{allTasks.length} tâche(s)</strong>, <strong>{planning.length} créneau(x)</strong> et{' '}
              <strong>{notes.length} note(s)</strong>. Pensez à exporter une copie avant, c'est irréversible.
            </p>

            <div className={`space-y-2 rounded-xl border p-3 ${T.raise}`}>
              <h4 className="text-[12px] font-extrabold">Vider le tableau</h4>
              <p className={`text-[11px] leading-relaxed ${T.faint}`}>
                Supprime tous les projets, tâches, créneaux et notes. Le nom du tableau, l'équipe et les
                colonnes sont conservés — vous repartez d'une page blanche, prête à l'emploi.
              </p>
              <button type="button" className={`w-full ${btnSecondary}`} onClick={viderTableau}>Vider le tableau</button>
            </div>

            <div className={`space-y-2 rounded-xl border p-3 ${T.raise}`}>
              <h4 className="text-[12px] font-extrabold">Recharger l'exemple</h4>
              <p className={`text-[11px] leading-relaxed ${T.faint}`}>
                Remplace le contenu par le tableau de démonstration, celui qui explique chaque fonction.
                Utile pour reprendre en main l'outil.
              </p>
              <button type="button" className={`w-full ${btnSecondary}`} onClick={rechargerExemple}>Recharger l'exemple</button>
            </div>

            <div className="space-y-2 rounded-xl border border-rose-500/40 bg-rose-500/5 p-3">
              <h4 className="text-[12px] font-extrabold text-rose-300">Oublier cet appareil</h4>
              <p className={`text-[11px] leading-relaxed ${T.faint}`}>
                Efface tout ce que ce navigateur retient : le tableau local, les réglages, le mot de passe
                et le jeton. {peutEcrire || syncEtat.etat === 'lecture'
                  ? <>La copie enregistrée dans votre dépôt <strong>n'est pas touchée</strong> : vous la retrouverez en revenant avec le mot de passe.</>
                  : <>Comme le partage est inactif, <strong>ces données ne seront récupérables que depuis votre export</strong>.</>}
              </p>
              <Field T={T} label="Tapez EFFACER pour confirmer">
                <input className={inputCls} value={resetConfirme} onChange={(e) => setResetConfirme(e.target.value)} placeholder="EFFACER" />
              </Field>
              <button type="button" disabled={resetConfirme.trim().toUpperCase() !== 'EFFACER'}
                onClick={oublierAppareil}
                className={`w-full ${btnDanger} ${resetConfirme.trim().toUpperCase() !== 'EFFACER' ? 'cursor-not-allowed opacity-40' : ''}`}>
                Tout effacer sur cet appareil
              </button>
            </div>
          </div>
        </Modal>
      ) : null}

      {isHelpOpen ? (
        <Modal T={T} title="Prise en main" onClose={() => setIsHelpOpen(false)}
          footer={<><span className={`text-[11px] ${T.faint}`}>Tout est stocké dans votre navigateur.</span><button type="button" className={btnSecondary} onClick={() => setIsHelpOpen(false)}>Fermer</button></>}>
          <ul className="space-y-2 text-[12px] leading-relaxed">
            <li><strong>Roadmap</strong> — trois niveaux : projet › tâche › sous-tâche. Chaque ligne se plie avec son propre bouton <span className="font-mono">+</span> / <span className="font-mono">−</span>, indépendamment des autres.</li>
            <li><strong>Se déplacer dans le temps</strong> — clic maintenu sur la grille pour la faire glisser, flèches <span className="font-mono">←</span> <span className="font-mono">→</span> pour avancer d'une semaine, molette du milieu enfoncée aussi. Le repère rose marque l'échéance ; si elle est hors écran, une pastille discrète apparaît sur le bord.</li>
            <li><strong>Planning</strong> — cliquez une demi-case pour planifier. Glissez un bloc horizontalement pour changer de date, verticalement pour le confier à un autre collaborateur.</li>
            <li><strong>Kanban</strong> — tapez un titre dans une colonne et faites Entrée : la tâche est créée au bon endroit, et vous pouvez enchaîner. « Grouper par » réorganise le tableau par statut, par personne ou par priorité. Les cartes se réordonnent à la souris.</li>
            <li><strong>Chaque tâche a une référence</strong> (TSK-12) : pratique pour se dire « regarde TSK-12 ». La recherche la reconnaît.</li>
            <li><strong>Échanges et historique</strong> — ouvrez une tâche : vous pouvez vous y répondre par écrit, et l'application consigne qui a fait quoi.</li>
            <li><strong>Tâches préalables</strong> — indiquez qu'une tâche en attend une autre. La carte affiche « En attente de TSK-3 », et la roadmap signale ⚠ si les dates se contredisent.</li>
            <li><strong>Équipe</strong> — bouton « Équipe » en haut à droite : ajoutez, renommez ou retirez quelqu'un. Renommer met à jour toutes ses tâches et ses créneaux ; retirer demande à qui confier son travail. Une personne sans aucune tâche apparaît quand même dans le planning.</li>
            <li><strong>Notes</strong> — l'endroit pour les devis, contacts et comparatifs, afin de garder les autres vues lisibles. Une note peut être rattachée à un projet.</li>
            <li><strong>À plusieurs</strong> — envoyez l'adresse du site et le mot de passe. Le tableau est enregistré, chiffré, dans votre dépôt GitHub : chacun le retrouve depuis n'importe quel ordinateur, à tout moment. Pour pouvoir enregistrer ses propres modifications, il faut aussi coller un jeton (bouton « Partager », guide fourni).</li>
            <li><strong>Repartir de zéro</strong> — dans « Partager », le bouton « Remise à zéro » permet de vider le tableau, de recharger l'exemple, ou d'effacer ce que cet appareil retient. Pensez à exporter une copie avant.</li>
            <li className="pt-2"><strong>Raccourcis</strong> — <span className="font-mono">1 2 3 4</span> changent de vue, <span className="font-mono">T</span> recentre sur aujourd'hui, <span className="font-mono">F</span> affiche toute la période, <span className="font-mono">Ctrl+Z</span> annule, <span className="font-mono">Échap</span> ferme.</li>
          </ul>
        </Modal>
      ) : null}

      <datalist id="collab-list">{collaborators.map((c) => <option key={c} value={c} />)}</datalist>
      <Toasts items={toasts} onDismiss={dismissToast} />
    </div>
  );
}

(function mount() {
  const root = document.getElementById('root');
  if (!root) return;
  try {
    ReactDOM.createRoot(root).render(<ErrorBoundary><AuraPlanApp /></ErrorBoundary>);
  } catch (err) {
    root.innerHTML = '<div class="boot-error"><h1 style="font-size:18px;font-weight:800;margin:0 0 8px">Démarrage impossible</h1>'
      + '<p style="color:#94A3B8;font-size:13px;margin:0">' + String(err && err.message) + '</p></div>';
  }
})();
</script>

<script>
  window.setTimeout(function () {
    var root = document.getElementById('root');
    if (!root || root.childElementCount > 0) return;
    var missing = [];
    if (!window.React) missing.push('React');
    if (!window.ReactDOM) missing.push('ReactDOM');
    if (!window.Babel) missing.push('Babel');
    if (!window.tailwind) missing.push('Tailwind');
    root.innerHTML = '<div class="boot-error">'
      + '<h1 style="font-size:18px;font-weight:800;margin:0 0 8px;color:#E2E8F0">L\'application n\'a pas pu démarrer</h1>'
      + '<p style="color:#94A3B8;font-size:13px;line-height:1.6;margin:0 0 12px">'
      + (missing.length
        ? 'Ces bibliothèques n\'ont pas pu être téléchargées : <strong>' + missing.join(', ') + '</strong>. Vérifiez votre connexion ou un bloqueur de scripts.'
        : 'Le script a échoué au démarrage. Ouvrez la console du navigateur pour voir le détail.')
      + '</p><p style="color:#64748B;font-size:12px;margin:0">Astuce : ouvrez le fichier via une URL http(s) plutôt qu\'en double-clic si votre navigateur restreint les fichiers locaux.</p></div>';
  }, 6000);
</script>
</body>
</html>
