<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraPlan Studio - Operating System pour Projets & Planning</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            aura: {
              bg: '#080C14',
              card: '#111827',
              border: '#1F293D',
              accent: '#6366F1',
              cyan: '#06B6D4',
              purple: '#A855F7'
            }
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Yjs + y-webrtc (Temps réel P2P sans serveur) -->
  <script src="https://cdn.jsdelivr.net/npm/yjs@13/dist/yjs.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/y-webrtc@10/dist/y-webrtc.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #080C14; }
    ::-webkit-scrollbar-thumb { background: #1F293D; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #6366F1; }
    .dragging-active { cursor: grabbing !important; user-select: none !important; }
  </style>
</head>
<body class="bg-aura-bg text-slate-100 font-sans antialiased min-h-screen overflow-hidden selection:bg-indigo-500/30">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // --- HELPERS DATES & UTILS ---
    const utf8_to_b64 = (str) => window.btoa(unescape(encodeURIComponent(str)));
    const b64_to_utf8 = (str) => decodeURIComponent(escape(window.atob(str)));

    const parseDate = (str) => new Date(str + 'T00:00:00');
    const formatDateIso = (d) => d.toISOString().split('T')[0];
    const addDays = (d, days) => { const r = new Date(d); r.setDate(r.getDate() + days); return r; };
    const diffDays = (d1, d2) => Math.round((d1 - d2) / (1000 * 60 * 60 * 24));

    const formatDateFr = (isoStr) => {
      if (!isoStr) return '';
      const d = parseDate(isoStr);
      return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    };

    const getWeekNumber = (d) => {
      const date = new Date(d.getTime());
      date.setHours(0, 0, 0, 0);
      date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
      const week1 = new Date(date.getFullYear(), 0, 4);
      return 1 + Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
    };

    const MONTH_NAMES_FR = [
      'Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin',
      'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'
    ];

    const COLOR_OPTIONS = [
      { name: 'Indigo Aura', value: 'from-indigo-600 to-violet-600' },
      { name: 'Cyber Neon', value: 'from-purple-600 to-fuchsia-600' },
      { name: 'Émeraude Deep', value: 'from-emerald-500 to-teal-600' },
      { name: 'Ambre Chaud', value: 'from-amber-500 to-orange-600' },
      { name: 'Rose Flash', value: 'from-rose-600 to-pink-600' },
      { name: 'Cyan Futur', value: 'from-cyan-500 to-blue-600' }
    ];

    const TODAY_STR = formatDateIso(new Date());

    // DONNÉES INITIALES
    const INITIAL_PROJECTS = [
      {
        id: 'proj-1',
        title: 'Refonte Microservices Cloud',
        category: 'Infrastructure',
        startDate: TODAY_STR,
        duration: 14,
        color: 'from-indigo-600 to-violet-600',
        tasks: [
          { id: 't-1-1', title: 'Provisionner clusters Kubernetes Terraform V2', planningTitle: 'Infra K8s Terraform', assignee: 'Alexandre M.', startDate: TODAY_STR, slot: 'AM', duration: 3.5, status: 'DONE' },
          { id: 't-1-2', title: 'Security Audit & Ingress Controller', planningTitle: 'Audit Ingress SSL', assignee: 'Alexandre M.', startDate: TODAY_STR, slot: 'PM', duration: 2, status: 'IN_PROGRESS' },
          { id: 't-1-3', title: 'Migration Gateway Auth OAuth2', planningTitle: 'Gateway Auth OAuth2', assignee: 'Lucas R.', startDate: formatDateIso(addDays(new Date(), 4)), slot: 'AM', duration: 5, status: 'TODO' }
        ]
      },
      {
        id: 'proj-2',
        title: 'Design System & UI React',
        category: 'Frontend',
        startDate: formatDateIso(addDays(new Date(), 2)),
        duration: 12,
        color: 'from-purple-600 to-fuchsia-600',
        tasks: [
          { id: 't-2-1', title: 'Tokens Figma & Couleurs Globale', planningTitle: 'Tokens Figma', assignee: 'Sophie T.', startDate: formatDateIso(addDays(new Date(), 2)), slot: 'AM', duration: 2.5, status: 'DONE' },
          { id: 't-2-2', title: 'Composants Formulaires React Pro', planningTitle: 'Formulaires React', assignee: 'Sophie T.', startDate: formatDateIso(addDays(new Date(), 4)), slot: 'PM', duration: 5, status: 'IN_PROGRESS' }
        ]
      },
      {
        id: 'proj-3',
        title: 'Optimisation API & Cache',
        category: 'Backend',
        startDate: formatDateIso(addDays(new Date(), -4)),
        duration: 10,
        color: 'from-emerald-500 to-teal-600',
        tasks: [
          { id: 't-3-1', title: 'Cluster Redis In-Memory Performance', planningTitle: 'Redis Cache', assignee: 'Thomas L.', startDate: formatDateIso(addDays(new Date(), -4)), slot: 'AM', duration: 4.5, status: 'IN_REVIEW' }
        ]
      }
    ];

    function AuraPlanApp() {
      // 1. États Généraux
      const [projects, setProjects] = useState(() => {
        const saved = localStorage.getItem('auraplan_projects_v9');
        return saved ? JSON.parse(saved) : INITIAL_PROJECTS;
      });

      const [activeTab, setActiveTab] = useState('roadmap'); // 'roadmap' | 'kanban' | 'planning'
      const [selectedProjectId, setSelectedProjectId] = useState('proj-1');
      const [editingTask, setEditingTask] = useState(null);
      const [splittingTask, setSplittingTask] = useState(null);
      const [splitMode, setSplitMode] = useState('half_day');
      const [splitSegments, setSplitSegments] = useState([1, 1]);

      const [columnWidth, setColumnWidth] = useState(110);
      const [planningScope, setPlanningScope] = useState(14); // Sprint 2 semaines par défaut

      // Contrôle des Panneaux Gauche & Droit (Roadmap)
      const [isLeftPanelOpen, setIsLeftPanelOpen] = useState(true);
      const [isRightPanelOpen, setIsRightPanelOpen] = useState(true);

      // Accordions Inspecteur Droit
      const [isAddTaskFolded, setIsAddTaskFolded] = useState(true);
      const [isProjectEditFolded, setIsProjectEditFolded] = useState(true);

      // Kanban Drag & Ghosting
      const [draggingKanbanTaskId, setDraggingKanbanTaskId] = useState(null);
      const [dragOverColumn, setDragOverColumn] = useState(null);

      // Modales
      const [isProjectModalOpen, setIsProjectModalOpen] = useState(false);
      const [isConfigModalOpen, setIsConfigModalOpen] = useState(false);
      const [isKanbanAddTaskModalOpen, setIsKanbanAddTaskModalOpen] = useState(false);
      const [kanbanTargetStatus, setKanbanTargetStatus] = useState('TODO');

      // Formulaires
      const [newProjectForm, setNewProjectForm] = useState({
        title: '', category: 'Tech', startDate: TODAY_STR, duration: 10, color: 'from-indigo-600 to-violet-600'
      });
      const [newTaskForm, setNewTaskForm] = useState({
        projectId: '', title: '', planningTitle: '', assignee: 'Alexandre M.', startDate: TODAY_STR, slot: 'AM', duration: 2, status: 'TODO'
      });

      // Drag Engines
      const [dragState, setDragState] = useState(null); // Roadmap
      const [planningDragState, setPlanningDragState] = useState(null); // Planning Move / Resize
      const hasDraggedPlanningTask = useRef(false);
      const dragAnimRef = useRef(null);

      // GitHub REST API & WebRTC P2P
      const [ghConfig, setGhConfig] = useState(() => {
        const saved = localStorage.getItem('gh_config');
        return saved ? JSON.parse(saved) : { owner: '', repo: '', path: 'data.json', token: '' };
      });
      const [syncStatus, setSyncStatus] = useState('');
      const [connectedPeers, setConnectedPeers] = useState(1);
      const yDocRef = useRef(null);

      // --- CALCUL DYNAMIQUE TIMELINE INFINIE ---
      const { timelineStartDate, totalTimelineDays } = useMemo(() => {
        let minDate = parseDate(TODAY_STR);
        let maxDate = addDays(parseDate(TODAY_STR), 30);

        projects.forEach(p => {
          const pStart = parseDate(p.startDate);
          const pEnd = addDays(pStart, Math.ceil(p.duration));
          if (pStart < minDate) minDate = pStart;
          if (pEnd > maxDate) maxDate = pEnd;

          (p.tasks || []).forEach(t => {
            const tStart = parseDate(t.startDate || p.startDate);
            const tEnd = addDays(tStart, Math.ceil(t.duration));
            if (tStart < minDate) minDate = tStart;
            if (tEnd > maxDate) maxDate = tEnd;
          });
        });

        // Alignement du début au Lundi de la semaine courante
        const dayOfWeek = minDate.getDay();
        const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
        const start = addDays(minDate, mondayOffset - 7);

        const daysForScope = activeTab === 'planning' ? Math.max(planningScope, diffDays(maxDate, start) + 14) : diffDays(maxDate, start) + 25;
        return { timelineStartDate: start, totalTimelineDays: Math.max(14, daysForScope) };
      }, [projects, activeTab, planningScope]);

      // Structuration des Semaines pour l'en-tête du Planning
      const timelineWeeks = useMemo(() => {
        const weeksMap = [];
        let currentWeekNum = null;
        let currentWeekObj = null;

        for (let i = 0; i < totalTimelineDays; i++) {
          const dayDate = addDays(timelineStartDate, i);
          const weekNum = getWeekNumber(dayDate);

          if (weekNum !== currentWeekNum) {
            currentWeekNum = weekNum;
            currentWeekObj = {
              weekNum,
              startDate: dayDate,
              daysCount: 0
            };
            weeksMap.push(currentMonthObj = currentWeekObj);
          }
          currentWeekObj.daysCount++;
        }
        return weeksMap;
      }, [timelineStartDate, totalTimelineDays]);

      // En-tête des Mois
      const timelineMonths = useMemo(() => {
        const monthsMap = [];
        let currentMonthKey = '';
        let currentMonthObj = null;

        for (let i = 0; i < totalTimelineDays; i++) {
          const dayDate = addDays(timelineStartDate, i);
          const monthKey = `${dayDate.getFullYear()}-${dayDate.getMonth()}`;

          if (monthKey !== currentMonthKey) {
            currentMonthKey = monthKey;
            currentMonthObj = {
              name: `${MONTH_NAMES_FR[dayDate.getMonth()]} ${dayDate.getFullYear()}`,
              daysCount: 0
            };
            monthsMap.push(currentMonthObj);
          }
          currentMonthObj.daysCount++;
        }
        return monthsMap;
      }, [timelineStartDate, totalTimelineDays]);

      // Flat list de toutes les tâches
      const allFlatTasks = useMemo(() => {
        const list = [];
        projects.forEach(p => {
          (p.tasks || []).forEach(t => {
            list.push({ ...t, project: p });
          });
        });
        return list;
      }, [projects]);

      // Regroupement Kanban (Isolation de la scission)
      const kanbanGroupedTasks = useMemo(() => {
        const map = new Map();
        allFlatTasks.forEach(task => {
          const rootKey = task.parentId || task.id.replace(/-part-\d+$/, '');
          if (!map.has(rootKey)) {
            map.set(rootKey, { ...task });
          } else {
            const existing = map.get(rootKey);
            if (task.status === 'IN_PROGRESS' && existing.status === 'TODO') {
              existing.status = 'IN_PROGRESS';
            }
          }
        });
        return Array.from(map.values());
      }, [allFlatTasks]);

      // Collaborateurs uniques
      const collaborators = useMemo(() => {
        const set = new Set();
        allFlatTasks.forEach(t => { if (t.assignee) set.add(t.assignee); });
        if (set.size === 0) set.add('Alexandre M.');
        return Array.from(set);
      }, [allFlatTasks]);

      // Persistance LocalStorage
      useEffect(() => localStorage.setItem('auraplan_projects_v9', JSON.stringify(projects)), [projects]);
      useEffect(() => localStorage.setItem('gh_config', JSON.stringify(ghConfig)), [ghConfig]);

      // WebRTC Sync (Yjs)
      useEffect(() => {
        if (!window.Y || !window.YWebrtc) return;
        const ydoc = new window.Y.Doc();
        const provider = new window.YWebrtc.WebrtcProvider('auraplan-studio-room-2026', ydoc);
        const yProjects = ydoc.getArray('projects');

        yProjects.observe(() => {
          const remote = yProjects.toArray();
          if (remote.length > 0) setProjects(remote);
        });

        provider.on('peers', (e) => setConnectedPeers(e.webrtcPeers.length + 1));
        yDocRef.current = { ydoc, yProjects, provider };

        return () => { provider.destroy(); ydoc.destroy(); };
      }, []);

      const broadcastProjects = useCallback((updated) => {
        setProjects(updated);
        if (yDocRef.current && yDocRef.current.yProjects) {
          const { ydoc, yProjects } = yDocRef.current;
          ydoc.transact(() => {
            yProjects.delete(0, yProjects.length);
            yProjects.insert(0, updated);
          });
        }
      }, []);

      // PROGRESSION PROJET (%)
      const getProjectProgress = (project) => {
        if (!project.tasks || project.tasks.length === 0) return 0;
        const doneCount = project.tasks.filter(t => t.status === 'DONE').length;
        return Math.round((doneCount / project.tasks.length) * 100);
      };

      // SPAN RÉEL DU PLANNING
      const getProjectActualSpan = (project) => {
        if (!project.tasks || project.tasks.length === 0) return null;

        let minStart = parseDate(project.tasks[0].startDate || project.startDate);
        let maxEnd = addDays(minStart, Math.ceil(project.tasks[0].duration || 1));

        project.tasks.forEach(t => {
          const tStart = parseDate(t.startDate || project.startDate);
          const tEnd = addDays(tStart, Math.ceil(t.duration || 1));
          if (tStart < minStart) minStart = tStart;
          if (tEnd > maxEnd) maxEnd = tEnd;
        });

        const actualStartDate = formatDateIso(minStart);
        const actualDuration = Math.max(1, diffDays(maxEnd, minStart));

        return { actualStartDate, actualDuration, minStart, maxEnd };
      };

      // HEALTH CHECK
      const getProjectHealth = (project) => {
        const span = getProjectActualSpan(project);
        if (!span) return { status: 'NEUTRAL', label: '⚪ Non planifié', delay: 0 };

        const targetStart = parseDate(project.startDate);
        const targetEnd = addDays(targetStart, Number(project.duration));

        const delayEnd = diffDays(span.maxEnd, targetEnd);

        if (delayEnd > 0) return { status: 'DANGER', label: `🔴 Retard +${delayEnd}j`, delay: delayEnd };
        else if (delayEnd < 0) return { status: 'SUCCESS', label: `🟢 Avance ${Math.abs(delayEnd)}j`, delay: delayEnd };
        else return { status: 'SUCCESS', label: '🟢 Dans les temps', delay: 0 };
      };

      // ALIGNEMENT ROADMAP
      const rebaselineProject = (projectId) => {
        const proj = projects.find(p => p.id === projectId);
        if (!proj) return;
        
        const span = getProjectActualSpan(proj);
        if (!span) return;

        const updated = projects.map(p => p.id === projectId ? {
          ...p,
          startDate: span.actualStartDate,
          duration: span.actualDuration
        } : p);

        broadcastProjects(updated);
      };

      const toggleTaskDoneStatus = (taskId, isDone) => {
        const newStatus = isDone ? 'DONE' : 'IN_PROGRESS';
        const updatedProjects = projects.map(p => ({
          ...p,
          tasks: (p.tasks || []).map(t => t.id === taskId ? { ...t, status: newStatus } : t)
        }));
        broadcastProjects(updatedProjects);
      };

      // DUPLICATION DE TÂCHE
      const duplicateTask = (task) => {
        const newTask = {
          ...task,
          id: `t-${task.project.id}-${Date.now()}`,
          title: `${task.title} (Copie)`,
          planningTitle: task.planningTitle ? `${task.planningTitle} (Copie)` : `${task.title} (Copie)`
        };

        const updatedProjects = projects.map(p => {
          if (p.id !== task.project.id) return p;
          return { ...p, tasks: [...(p.tasks || []), newTask] };
        });

        broadcastProjects(updatedProjects);
        setEditingTask(null);
      };

      // ALGORITHME DE PLANNING EXPLICITE PAR COLLABORATEUR
      const calculateCollaboratorLanes = (personTasks) => {
        const sorted = [...personTasks].sort((a, b) => {
          const tA = parseDate(a.startDate || a.project.startDate).getTime() + (a.slot === 'PM' ? 43200000 : 0);
          const tB = parseDate(b.startDate || b.project.startDate).getTime() + (b.slot === 'PM' ? 43200000 : 0);
          return tA - tB;
        });

        const lanes = [];

        const placedTasks = sorted.map(task => {
          const startDays = diffDays(parseDate(task.startDate || task.project.startDate), timelineStartDate) + (task.slot === 'PM' ? 0.5 : 0);
          const endDays = startDays + Number(task.duration);

          let laneIndex = lanes.findIndex(freeDay => freeDay <= startDays);
          if (laneIndex === -1) {
            laneIndex = lanes.length;
            lanes.push(endDays);
          } else {
            lanes[laneIndex] = endDays;
          }

          return { ...task, laneIndex, startDays, endDays };
        });

        const totalLanes = Math.max(1, lanes.length);
        return {
          placedTasks,
          totalLanes,
          rowHeight: totalLanes * 38 + 28
        };
      };

      // DÉCOMPTE DES TÂCHES PAR JOUR DANS L'EN-TÊTE DU PLANNING
      const getTasksCountForDayGlobal = (dayDate) => {
        return allFlatTasks.filter(t => {
          const tStart = parseDate(t.startDate);
          const tEnd = addDays(tStart, Math.ceil(t.duration) - 1);
          return dayDate >= tStart && dayDate <= tEnd;
        }).length;
      };

      // DRAG ENGINE ROADMAP
      const handleMouseDown = (e, projectId, action) => {
        e.stopPropagation();
        e.preventDefault();
        const proj = projects.find(p => p.id === projectId);
        if (!proj) return;

        setDragState({
          projectId, action, startX: e.clientX,
          initialStartDate: proj.startDate, initialDuration: proj.duration,
          currentStartDate: proj.startDate, currentDuration: proj.duration
        });
      };

      useEffect(() => {
        const handleMouseMove = (e) => {
          if (!dragState) return;

          if (dragAnimRef.current) cancelAnimationFrame(dragAnimRef.current);

          dragAnimRef.current = requestAnimationFrame(() => {
            const deltaX = e.clientX - dragState.startX;
            const dayDelta = Math.round(deltaX / columnWidth);

            let newStart = dragState.initialStartDate;
            let newDur = dragState.initialDuration;

            if (dragState.action === 'move') {
              newStart = formatDateIso(addDays(parseDate(dragState.initialStartDate), dayDelta));
            } else if (dragState.action === 'resize-left') {
              const actualDays = Math.min(dayDelta, dragState.initialDuration - 1);
              newStart = formatDateIso(addDays(parseDate(dragState.initialStartDate), actualDays));
              newDur = dragState.initialDuration - actualDays;
            } else if (dragState.action === 'resize-right') {
              newDur = Math.max(1, dragState.initialDuration + dayDelta);
            }

            setDragState(prev => prev ? { ...prev, currentStartDate: newStart, currentDuration: newDur } : null);
          });
        };

        const handleMouseUp = () => {
          if (dragState) {
            const updated = projects.map(p => p.id === dragState.projectId ? { ...p, startDate: dragState.currentStartDate, duration: dragState.currentDuration } : p);
            broadcastProjects(updated);
          }
          setDragState(null);
        };

        if (dragState) {
          window.addEventListener('mousemove', handleMouseMove);
          window.addEventListener('mouseup', handleMouseUp);
        }
        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseup', handleMouseUp);
        };
      }, [dragState, columnWidth, projects, broadcastProjects]);

      // DRAG ENGINE PLANNING AVEC SNAP AM/PM EXTREMEMENT PRÉCIS
      const handlePlanningMouseDown = (e, task, action = 'move') => {
        e.stopPropagation();
        e.preventDefault();
        hasDraggedPlanningTask.current = false;

        const initialSlotOffset = task.slot === 'PM' ? 0.5 : 0;
        const initialStartDays = diffDays(parseDate(task.startDate || TODAY_STR), timelineStartDate) + initialSlotOffset;

        setPlanningDragState({
          taskId: task.id,
          action,
          startX: e.clientX,
          initialStartDays,
          initialDuration: task.duration,
          currentStartDays: initialStartDays,
          currentDuration: task.duration,
          currentStartDate: task.startDate || TODAY_STR,
          currentSlot: task.slot || 'AM'
        });
      };

      useEffect(() => {
        const handleMouseMovePlanning = (e) => {
          if (!planningDragState) return;

          if (Math.abs(e.clientX - planningDragState.startX) > 4) {
            hasDraggedPlanningTask.current = true;
          }

          if (dragAnimRef.current) cancelAnimationFrame(dragAnimRef.current);

          dragAnimRef.current = requestAnimationFrame(() => {
            const deltaX = e.clientX - planningDragState.startX;
            const halfWidth = columnWidth / 2;
            const halfSlotsDelta = Math.round(deltaX / halfWidth);

            if (planningDragState.action === 'move') {
              const newStartDays = Math.max(0, planningDragState.initialStartDays + halfSlotsDelta * 0.5);
              const fullDays = Math.floor(newStartDays);
              const isPM = (newStartDays % 1) >= 0.45;

              setPlanningDragState(prev => prev ? {
                ...prev,
                currentStartDays: newStartDays,
                currentStartDate: formatDateIso(addDays(timelineStartDate, fullDays)),
                currentSlot: isPM ? 'PM' : 'AM'
              } : null);
            } else if (planningDragState.action === 'resize-right') {
              const newDur = Math.max(0.5, planningDragState.initialDuration + halfSlotsDelta * 0.5);
              setPlanningDragState(prev => prev ? { ...prev, currentDuration: newDur } : null);
            } else if (planningDragState.action === 'resize-left') {
              const actualShift = Math.min(halfSlotsDelta * 0.5, planningDragState.initialDuration - 0.5);
              const newStartDays = Math.max(0, planningDragState.initialStartDays + actualShift);
              const newDur = Math.max(0.5, planningDragState.initialDuration - actualShift);

              const fullDays = Math.floor(newStartDays);
              const isPM = (newStartDays % 1) >= 0.45;

              setPlanningDragState(prev => prev ? {
                ...prev,
                currentStartDays: newStartDays,
                currentDuration: newDur,
                currentStartDate: formatDateIso(addDays(timelineStartDate, fullDays)),
                currentSlot: isPM ? 'PM' : 'AM'
              } : null);
            }
          });
        };

        const handleMouseUpPlanning = () => {
          if (planningDragState) {
            if (hasDraggedPlanningTask.current) {
              const updatedProjects = projects.map(p => ({
                ...p,
                tasks: (p.tasks || []).map(t => t.id === planningDragState.taskId ? {
                  ...t,
                  startDate: planningDragState.currentStartDate,
                  slot: planningDragState.currentSlot,
                  duration: planningDragState.currentDuration
                } : t)
              }));
              broadcastProjects(updatedProjects);
            }
          }
          setPlanningDragState(null);
        };

        if (planningDragState) {
          window.addEventListener('mousemove', handleMouseMovePlanning);
          window.addEventListener('mouseup', handleMouseUpPlanning);
        }
        return () => {
          window.removeEventListener('mousemove', handleMouseMovePlanning);
          window.removeEventListener('mouseup', handleMouseUpPlanning);
        };
      }, [planningDragState, columnWidth, projects, timelineStartDate, broadcastProjects]);

      // KANBAN DRAG & GHOSTING
      const handleKanbanDragStart = (e, taskId) => {
        setDraggingKanbanTaskId(taskId);
        e.dataTransfer.setData('text/plain', taskId);
        e.dataTransfer.effectAllowed = 'move';
      };

      const handleKanbanDragOver = (e, colId) => {
        e.preventDefault();
        setDragOverColumn(colId);
      };

      const handleKanbanDrop = (e, targetStatus) => {
        e.preventDefault();
        const taskId = e.dataTransfer.getData('text/plain');
        setDraggingKanbanTaskId(null);
        setDragOverColumn(null);
        if (!taskId) return;

        const updatedProjects = projects.map(p => ({
          ...p,
          tasks: (p.tasks || []).map(t => t.id === taskId ? { ...t, status: targetStatus } : t)
        }));
        broadcastProjects(updatedProjects);
      };

      // FIT ALL ULTIME ADAPTÉ AUX PANNEAUX
      const fitAllTasks = useCallback(() => {
        const container = document.getElementById('timeline-viewport');
        if (!container) return;

        let earliest = parseDate(TODAY_STR);
        let latest = addDays(parseDate(TODAY_STR), 15);

        projects.forEach(p => {
          const pStart = parseDate(p.startDate);
          const pEnd = addDays(pStart, Math.ceil(p.duration));
          if (pStart < earliest) earliest = pStart;
          if (pEnd > latest) latest = pEnd;

          (p.tasks || []).forEach(t => {
            const tStart = parseDate(t.startDate || p.startDate);
            const tEnd = addDays(tStart, Math.ceil(t.duration));
            if (tStart < earliest) earliest = tStart;
            if (tEnd > latest) latest = tEnd;
          });
        });

        const spanDays = diffDays(latest, earliest) + 4;
        const availableWidth = container.clientWidth - 10;
        const calculatedWidth = Math.max(28, Math.floor(availableWidth / spanDays));

        setColumnWidth(calculatedWidth);
        container.scrollLeft = 0;
      }, [projects]);

      // Auto Recalcul Fit All quand les panneaux s'ouvrent ou se ferment
      useEffect(() => {
        if (activeTab === 'roadmap') {
          setTimeout(fitAllTasks, 150);
        }

      // INIT MODAL SCISSION PAR PAS STRICTS DE 0.5J
      const openSplitModal = (task) => {
        setSplittingTask(task);
        if (task.duration === 5.5) {
          setSplitSegments([4, 0.5, 1]);
        } else if (task.duration > 1) {
          const half = Number((Math.floor(task.duration / 0.5 / 2) * 0.5).toFixed(1));
          setSplitSegments([half, Number((task.duration - half).toFixed(1))]);
        } else {
          setSplitSegments([0.5, 0.5]);
        }
      };

      const executeFlexibleSplit = (e) => {
        e.preventDefault();
        if (!splittingTask) return;

        const sum = splitSegments.reduce((a, b) => a + Number(b), 0);
        if (Math.abs(sum - splittingTask.duration) > 0.01) {
          alert(`La somme des tranches (${sum}j) doit être strictement égale à la durée initiale (${splittingTask.duration}j).`);
          return;
        }

        const newCreatedTasks = [];
        let currDate = parseDate(splittingTask.startDate);
        let currSlot = splittingTask.slot || 'AM';

        splitSegments.forEach((segDuration, idx) => {
          newCreatedTasks.push({
            id: `t-${splittingTask.project.id}-${Date.now()}-part-${idx}`,
            parentId: splittingTask.parentId || splittingTask.id,
            title: `${splittingTask.title} (Partie ${idx + 1}/${splitSegments.length})`,
            planningTitle: splittingTask.planningTitle ? `${splittingTask.planningTitle} P${idx + 1}` : `${splittingTask.title} P${idx + 1}`,
            assignee: splittingTask.assignee,
            startDate: formatDateIso(currDate),
            slot: currSlot,
            duration: Number(segDuration),
            status: splittingTask.status
          });

          const addedDays = Math.floor(segDuration);
          const remainder = segDuration % 1;
          
          currDate = addDays(currDate, addedDays);
          if (remainder >= 0.5) {
            if (currSlot === 'AM') {
              currSlot = 'PM';
            } else {
              currSlot = 'AM';
              currDate = addDays(currDate, 1);
            }
          }
        });

        const updatedProjects = projects.map(p => {
          if (p.id !== splittingTask.project.id) return p;
          const newTasks = [];
          p.tasks.forEach(t => {
            if (t.id === splittingTask.id) newTasks.push(...newCreatedTasks);
            else newTasks.push(t);
          });
          return { ...p, tasks: newTasks };
        });

        broadcastProjects(updatedProjects);
        setSplittingTask(null);
        setEditingTask(null);
      };

      // SAUVEGARDE GITHUB REST API
      const saveToGitHub = async () => {
        if (!ghConfig.owner || !ghConfig.repo || !ghConfig.token) {
          alert("Veuillez renseigner vos identifiants dans ⚙️ Config GitHub");
          return;
        }
        setSyncStatus('Commit en cours...');
        try {
          const url = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${ghConfig.path}`;
          const headers = { 'Authorization': `token ${ghConfig.token}`, 'Accept': 'application/vnd.github.v3+json' };
          
          let currentSha = null;
          const getRes = await fetch(url, { headers });
          if (getRes.ok) currentSha = (await getRes.json()).sha;

          const putRes = await fetch(url, {
            method: 'PUT',
            headers: { ...headers, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: `Update AuraPlan ${new Date().toLocaleString('fr-FR')}`,
              content: utf8_to_b64(JSON.stringify(projects, null, 2)),
              ...(currentSha && { sha: currentSha })
            })
          });

          if (!putRes.ok) throw new Error();
          setSyncStatus('✅ Commité sur GitHub !');
          setTimeout(() => setSyncStatus(''), 3000);
          setIsConfigModalOpen(false);
        } catch {
          setSyncStatus('❌ Échec de sauvegarde');
        }
      };

        setIsKanbanAddTaskModalOpen(false);

                                  >
                                    <div onMouseDown={(e) => handlePlanningMouseDown(e, task, 'resize-left')} className="absolute left-0 top-0 bottom-0 w-2.5 cursor-ew-resize bg-white/30 opacity-0 group-hover:opacity-100 rounded-l-lg hover:bg-white/70 transition" />

                                    <div className="truncate px-1.5 flex items-center justify-between w-full pointer-events-none">
                                      <span className="truncate flex items-center gap-1.5">
                                        {/* BADGE LISIBLE AM/PM NÉON */}
                                        <span className={`px-1 py-0.2 text-[8px] font-black rounded border ${
                                          displaySlot === 'PM' ? 'bg-indigo-950/90 text-indigo-300 border-indigo-400/50' : 'bg-amber-950/90 text-amber-300 border-amber-400/50'
                                        }`}>
                                          {displaySlot === 'PM' ? 'PM' : 'AM'}
                                        </span>
                                        <span className={`truncate font-extrabold ${isDone ? 'line-through opacity-80' : ''}`}>
                                          {task.planningTitle || task.title}
                                        </span>
                                      </span>

                                      <div className="flex items-center gap-1 shrink-0 ml-1">
                                        {isDone && (
                                          <span className="bg-emerald-500 text-slate-950 font-black text-[8px] px-1 py-0.2 rounded shadow">
                                            ✓ Terminé
                                          </span>
                                        )}
                                        <span className="opacity-90 text-[9px] font-mono bg-black/40 px-1 py-0.5 rounded border border-white/10">
                                          {displayTaskDuration}j
                                        </span>
                                      </div>
                                    </div>

                                    <div onMouseDown={(e) => handlePlanningMouseDown(e, task, 'resize-right')} className="absolute right-0 top-0 bottom-0 w-2.5 cursor-ew-resize bg-white/30 opacity-0 group-hover:opacity-100 rounded-r-lg hover:bg-white/70 transition" />

                                    {/* TOOLTIP TARGET SNAP AIMANTÉ EN DIRECT */}
                                    {isDraggingThis && (
                                      <div className="absolute -top-8 left-1/2 -translate-x-1/2 bg-slate-900 border border-indigo-500 text-slate-100 text-[10px] font-mono px-2.5 py-0.5 rounded shadow-2xl z-40 whitespace-nowrap font-bold">
                                        📅 {formatDateFr(displayStartDate)} ({displaySlot === 'PM' ? '🌙 PM' : '☀️ AM'}) • {displayTaskDuration}j
                                      </div>
                                    )}
                                  </div>
                                </React.Fragment>
                              );
                            })}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

          </div>

          {/* MODAL 1 : ÉDITION D'UNE TÂCHE ET DUPLICATION */}
          {editingTask && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-aura-card border border-aura-border rounded-2xl p-6 w-full max-w-md shadow-2xl">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-base font-bold text-slate-100">Modifier la Tâche</h3>
                  <button onClick={() => setEditingTask(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1 font-semibold">Titre complet (Roadmap & Kanban)</label>
                    <input 
                      type="text" 
                      value={editingTask.title} 
                      onChange={e => setEditingTask({...editingTask, title: e.target.value})}
                      className="w-full bg-aura-bg p-3 rounded-xl border border-aura-border text-slate-200" 
                    />
                  </div>

                  <div>
                    <label className="block text-indigo-400 mb-1 font-semibold font-mono">Nom d'affichage Planning (Court)</label>
                    <input 
                      type="text" 
                      placeholder="ex: Infra K8s (Exclusif Planning)"
                      value={editingTask.planningTitle || ''} 
                      onChange={e => setEditingTask({...editingTask, planningTitle: e.target.value})}
                      className="w-full bg-aura-bg p-3 rounded-xl border border-indigo-500/40 text-slate-200 font-bold" 
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Date de début</label>
                      <input 
                        type="date" 
                        value={editingTask.startDate || TODAY_STR} 
                        onChange={e => setEditingTask({...editingTask, startDate: e.target.value})}
                        className="w-full bg-aura-bg p-3 rounded-xl border border-aura-border text-slate-200" 
                      />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Créneau</label>
                      <select 
                        value={editingTask.slot || 'AM'} 
                        onChange={e => setEditingTask({...editingTask, slot: e.target.value})}
                        className="w-full bg-aura-bg p-3 rounded-xl border border-aura-border text-slate-200"
                      >
                        <option value="AM">☀️ Matin (AM)</option>
                        <option value="PM">🌙 Après-midi (PM)</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Durée (jours - pas 0.5j)</label>
                      <input 
                        type="number" step="0.5" min="0.5"
                        value={editingTask.duration} 
                        onChange={e => setEditingTask({...editingTask, duration: Number(e.target.value)})}
                        className="w-full bg-aura-bg p-3 rounded-xl border border-aura-border text-slate-200" 
                      />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Collaborateur assigné</label>
                      <input 
                        type="text" 
                        value={editingTask.assignee} 
                        onChange={e => setEditingTask({...editingTask, assignee: e.target.value})}
                        className="w-full bg-aura-bg p-3 rounded-xl border border-aura-border text-slate-200" 
                      />
                    </div>
                  </div>

                  <div className="flex gap-2">
                    {editingTask.duration > 0.5 && (
                      <button 
                        type="button"
                        onClick={() => openSplitModal(editingTask)}
                        className="flex-1 py-2 bg-indigo-600/20 text-indigo-300 hover:bg-indigo-600/30 border border-indigo-500/30 font-semibold rounded-xl transition text-center"
                      >
                        ✂️ Scinder (0,5j)
                      </button>
                    )}
                    <button 
                      type="button"
                      onClick={() => duplicateTask(editingTask)}
                      className="flex-1 py-2 bg-purple-600/20 text-purple-300 hover:bg-purple-600/30 border border-purple-500/30 font-semibold rounded-xl transition text-center"
                    >
                      📋 Dupliquer
                    </button>
                  </div>

                  <div className="flex justify-between items-center pt-4 border-t border-aura-border">
                    <button onClick={() => handleDeleteTask(editingTask.id)} className="text-rose-400 font-semibold">Supprimer</button>
                    <div className="flex gap-2">
                      <button onClick={() => setEditingTask(null)} className="px-4 py-2 bg-aura-bg text-slate-300 rounded-xl">Annuler</button>
                      <button onClick={() => handleUpdateTask(editingTask)} className="px-4 py-2 bg-indigo-600 font-semibold text-white rounded-xl">Enregistrer</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODAL DE CRÉATION DE TÂCHE KANBAN / PLANNING DIRECTE */}
          {isKanbanAddTaskModalOpen && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-aura-card border border-aura-border rounded-2xl p-6 w-full max-w-md shadow-2xl">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-base font-bold text-slate-100">+ Planifier / Créer une Tâche</h3>
                  <button onClick={() => setIsKanbanAddTaskModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={handleAddTask} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1 font-semibold">Sélectionner le Projet Parent</label>
                    <select 
                      value={newTaskForm.projectId || (projects[0]?.id || '')}
                      onChange={e => setNewTaskForm({...newTaskForm, projectId: e.target.value})}
                      className="w-full bg-aura-bg p-3 rounded-xl border border-aura-border text-slate-200 font-bold"
                    >
                      {projects.map(p => <option key={p.id} value={p.id}>{p.title}</option>)}
                    </select>
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1 font-semibold">Titre complet de la tâche</label>
                    <input 
                      type="text" required placeholder="ex: Configurer SSL Nginx Ingress Controller"
                      value={newTaskForm.title}
                      onChange={e => setNewTaskForm({...newTaskForm, title: e.target.value})}
                      className="w-full bg-aura-bg p-3 rounded-xl border border-aura-border text-slate-200"
                    />
                  </div>

                  <div>
                    <label className="block text-indigo-400 mb-1 font-semibold">Nom d'affichage Planning (Court)</label>
                    <input 
                      type="text" placeholder="ex: SSL Ingress"
                      value={newTaskForm.planningTitle}
                      onChange={e => setNewTaskForm({...newTaskForm, planningTitle: e.target.value})}
                      className="w-full bg-aura-bg p-3 rounded-xl border border-indigo-500/40 text-slate-200"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Assigné à</label>
                      <input 
                        type="text" required
                        value={newTaskForm.assignee}
                        onChange={e => setNewTaskForm({...newTaskForm, assignee: e.target.value})}
                        className="w-full bg-aura-bg p-3 rounded-xl border border-aura-border text-slate-200"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Date de début</label>
                      <input 
                        type="date" required
                        value={newTaskForm.startDate}
                        onChange={e => setNewTaskForm({...newTaskForm, startDate: e.target.value})}
                        className="w-full bg-aura-bg p-3 rounded-xl border border-aura-border text-slate-200"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Créneau</label>
                      <select 
                        value={newTaskForm.slot}
                        onChange={e => setNewTaskForm({...newTaskForm, slot: e.target.value})}
                        className="w-full bg-aura-bg p-3 rounded-xl border border-aura-border text-slate-200"
                      >
                        <option value="AM">☀️ Matin (AM)</option>
                        <option value="PM">🌙 Après-midi (PM)</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Durée (jours - pas 0.5j)</label>
                      <input 
                        type="number" step="0.5" min="0.5" required
                        value={newTaskForm.duration}
                        onChange={e => setNewTaskForm({...newTaskForm, duration: e.target.value})}
                        className="w-full bg-aura-bg p-3 rounded-xl border border-aura-border text-slate-200"
                      />
                    </div>
                  </div>

                  <div className="flex justify-end gap-3 pt-4 border-t border-aura-border">
                    <button type="button" onClick={() => setIsKanbanAddTaskModalOpen(false)} className="px-4 py-2 bg-aura-bg text-slate-300 rounded-xl">Annuler</button>
                    <button type="submit" className="px-4 py-2 bg-indigo-600 text-white font-bold rounded-xl shadow">+ Créer & Planifier</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL DE SCISSION PAR TRANCHES DE 0.5J */}
          {splittingTask && (
            <div className="fixed inset-0 bg-black/75 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-aura-card border border-aura-border rounded-2xl p-6 w-full max-w-md shadow-2xl">
                <h3 className="text-base font-bold text-slate-100 mb-2">✂️ Scission Planning Sur-Mesure</h3>
                <p className="text-xs text-slate-400 mb-4">Tâche : <strong>{splittingTask.title}</strong> ({splittingTask.duration} jours)</p>

                <form onSubmit={executeFlexibleSplit} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-300 mb-2 font-medium">Tranches de découpage (pas de 0,5j) :</label>
                    <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                      {splitSegments.map((seg, idx) => (
                        <div key={idx} className="flex items-center gap-2 bg-aura-bg p-2 rounded-xl border border-aura-border">
                          <span className="text-[10px] font-bold text-slate-400 w-16">Tranche {idx + 1} :</span>
                          <input 
                            type="number" step="0.5" min="0.5" max={splittingTask.duration} required
                            value={seg}
                            onChange={e => {
                              const val = Number(e.target.value);
                              const newSegs = [...splitSegments];
                              newSegs[idx] = val;
                              setSplitSegments(newSegs);
                            }}
                            className="flex-1 bg-aura-card p-2 rounded border border-aura-border text-slate-200 text-xs font-mono font-bold"
                          />
                          <span className="text-[10px] text-slate-400">jour(s)</span>
                          {splitSegments.length > 2 && (
                            <button 
                              type="button" 
                              onClick={() => setSplitSegments(splitSegments.filter((_, i) => i !== idx))}
                              className="text-rose-400 font-bold px-2"
                            >
                              ✕
                            </button>
                          )}
                        </div>
                      ))}
                    </div>

                    <button 
                      type="button"
                      onClick={() => setSplitSegments([...splitSegments, 0.5])}
                      className="mt-2 text-indigo-400 font-semibold hover:underline text-[11px]"
                    >
                      + Ajouter une tranche (+0.5j)
                    </button>
                  </div>

                  <div className="p-3 bg-aura-bg rounded-xl border border-aura-border flex items-center justify-between text-[11px]">
                    <span className="text-slate-400">Somme des tranches :</span>
                    <span className={`font-mono font-bold ${
                      Math.abs(splitSegments.reduce((a,b) => a+Number(b), 0) - splittingTask.duration) < 0.01 ? 'text-emerald-400' : 'text-rose-400'
                    }`}>
                      {splitSegments.reduce((a,b) => a+Number(b), 0)} / {splittingTask.duration} jours
                    </span>
                  </div>

                  <div className="flex justify-end gap-3 pt-4 border-t border-aura-border">
                    <button type="button" onClick={() => setSplittingTask(null)} className="px-4 py-2 bg-aura-bg text-slate-300 rounded-xl">Annuler</button>
                    <button type="submit" className="px-4 py-2 bg-indigo-600 text-white font-bold rounded-xl shadow">Découper la tâche</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL 2 : CONFIGURATION GITHUB */}
          {isConfigModalOpen && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-aura-card border border-aura-border rounded-2xl p-6 w-full max-w-md shadow-2xl">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-base font-bold text-slate-100">⚙️ Config GitHub Sync</h3>
                  <button onClick={() => setIsConfigModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Propriétaire Dépôt (Owner)</label>
                    <input type="text" placeholder="ex: mon-pseudo" value={ghConfig.owner} onChange={e => setGhConfig({...ghConfig, owner: e.target.value})} className="w-full bg-aura-bg p-3 rounded-xl border border-aura-border text-slate-200" />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Nom du Dépôt (Repo)</label>
                    <input type="text" placeholder="ex: ma-roadmap" value={ghConfig.repo} onChange={e => setGhConfig({...ghConfig, repo: e.target.value})} className="w-full bg-aura-bg p-3 rounded-xl border border-aura-border text-slate-200" />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Token GitHub (PAT)</label>
                    <input type="password" placeholder="github_pat_..." value={ghConfig.token} onChange={e => setGhConfig({...ghConfig, token: e.target.value})} className="w-full bg-aura-bg p-3 rounded-xl border border-aura-border text-slate-200" />
                  </div>

                  {syncStatus && <div className="text-indigo-400 font-semibold">{syncStatus}</div>}

                  <div className="flex justify-end gap-3 pt-4 border-t border-aura-border">
                    <button onClick={() => setIsConfigModalOpen(false)} className="px-4 py-2 bg-aura-bg text-slate-300 rounded-xl">Fermer</button>
                    <button onClick={saveToGitHub} className="px-4 py-2 bg-indigo-600 text-white rounded-xl font-semibold">Commiter data.json</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 3 : CRÉATION DE PROJET */}
          {isProjectModalOpen && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-aura-card border border-aura-border rounded-2xl p-6 w-full max-w-md shadow-2xl">
                <h3 className="text-lg font-bold text-slate-100 mb-4">Créer un Nouveau Projet</h3>
                <form onSubmit={handleCreateProject} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Nom du Projet</label>
                    <input type="text" required value={newProjectForm.title} onChange={e => setNewProjectForm({...newProjectForm, title: e.target.value})} className="w-full bg-aura-bg p-3 rounded-xl border border-aura-border text-slate-200" />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Catégorie / Tag (ex: Mobile, Design...)</label>
                    <input type="text" placeholder="ex: Frontend" value={newProjectForm.category} onChange={e => setNewProjectForm({...newProjectForm, category: e.target.value})} className="w-full bg-aura-bg p-3 rounded-xl border border-aura-border text-slate-200" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Date Cible de début</label>
                      <input type="date" required value={newProjectForm.startDate} onChange={e => setNewProjectForm({...newProjectForm, startDate: e.target.value})} className="w-full bg-aura-bg p-3 rounded-xl border border-aura-border text-slate-200" />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Durée Cible (jours)</label>
                      <input type="number" min="1" required value={newProjectForm.duration} onChange={e => setNewProjectForm({...newProjectForm, duration: e.target.value})} className="w-full bg-aura-bg p-3 rounded-xl border border-aura-border text-slate-200" />
                    </div>
                  </div>
                  <div className="flex justify-end gap-3 pt-4 border-t border-aura-border">
                    <button type="button" onClick={() => setIsProjectModalOpen(false)} className="px-4 py-2 bg-aura-bg text-slate-300 rounded-xl">Annuler</button>
                    <button type="submit" className="px-4 py-2 bg-indigo-600 text-white font-semibold rounded-xl">Créer Projet</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AuraPlanApp />);
  </script>
</body>
</html>
