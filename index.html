        const isToday = iso === TODAY_STR;
        const isEvent = iso === event.date;
        const isWeekend = d.getDay() === 0 || d.getDay() === 6;
        const count = dayLoad.get(i) || 0;
        return (
          <div key={i} style={{ width: `${columnWidth}px`, minWidth: `${columnWidth}px` }}
            className={`relative flex h-full flex-col justify-between overflow-visible border-r ${T.grid} ${d.getDay() === 1 ? 'border-l-2 border-l-indigo-500/40' : ''}
              ${isEvent ? 'jour-j-col border-x-2 border-x-rose-400/80 text-rose-300' : isToday ? 'bg-indigo-500/25 text-indigo-300' : isWeekend ? (isDark ? 'bg-white/[0.03] text-slate-500' : 'bg-slate-100 text-slate-400') : T.muted}`}>
            {isEvent ? (
              <span className="jour-j-pin pointer-events-none absolute -top-0.5 left-1/2 z-20 -translate-x-1/2 text-[10px]" title={`${event.label} — ${formatDateFr(event.date)}`}>💍</span>
            ) : null}
            {ultra ? (
              <div className="flex h-full items-end justify-center pb-1">
                {d.getDate() === 1 ? <span className="h-2 w-0.5 rounded bg-indigo-400" /> : null}
              </div>
            ) : (
              <>
                <div className={`flex items-center justify-between pt-1 ${dense ? 'px-0 justify-center' : 'px-1.5'}`}>
                  <span className="flex items-baseline gap-1">
                    {dense ? null : <span className="text-[9px] font-bold uppercase">{d.toLocaleDateString('fr-FR', { weekday: 'short' }).slice(0, 2)}</span>}
                    <span className={`${dense ? 'text-[9px]' : 'text-[11px]'} font-extrabold`}>{d.getDate()}</span>
                  </span>
                  {withHalves && count > 0 && columnWidth >= 62 ? <span className="rounded-full bg-indigo-600 px-1.5 text-[8px] font-extrabold text-white">{count}</span> : null}
                </div>
                {withHalves ? (
                  <div className={`mt-1 flex border-t ${T.grid} text-[8px] font-bold`}>
                    <div className={`w-1/2 border-r ${T.grid} py-0.5 text-center text-amber-400`}>{columnWidth >= 56 ? '☀ AM' : dense ? '' : '☀'}</div>
                    <div className="w-1/2 py-0.5 text-center text-indigo-300">{columnWidth >= 56 ? '☾ PM' : dense ? '' : '☾'}</div>
                  </div>
                ) : <div className="h-1" />}
              </>
            )}
          </div>
        );
      })}
    </div>
  );

  const GridBackground = ({ rowKey }) => (
    <div className="pointer-events-none absolute inset-0 flex">
      {Array.from({ length: totalDays }).map((_, i) => {
        const d = addDays(timelineStart, i);
        const iso = formatDateIso(d);
        const isToday = iso === TODAY_STR;
        const isEvent = iso === event.date;
        const isWeekend = d.getDay() === 0 || d.getDay() === 6;
        return (
          <div key={rowKey + '-' + i} style={{ width: `${Math.max(2, columnWidth)}px`, minWidth: `${columnWidth}px` }}
            className={`h-full border-r ${T.grid} ${d.getDay() === 1 ? 'border-l-2 border-l-indigo-500/25' : ''}
              ${isEvent ? 'jour-j-col border-x-2 border-x-rose-400/80' : isToday ? 'bg-indigo-500/10' : isWeekend ? (isDark ? 'bg-white/[0.03]' : 'bg-slate-100/70') : ''}`} />
        );
      })}
    </div>
  );

  const isEventBar = (startIso, duration) => {
    const s = parseDate(startIso);
    const e = addDays(s, Math.max(0, Math.ceil(duration) - 1));
    const ev = parseDate(event.date);
    return ev >= s && ev <= e;
  };

  const barGeometry = (startUnits, lenUnits, isDragging) => {
    let left = startUnits * columnWidth;
    let width = lenUnits * columnWidth;
    if (isDragging) {
      if (drag.action === 'move') left += drag.deltaX;
      else if (drag.action === 'resize-left') { left += drag.deltaX; width -= drag.deltaX; }
      else width += drag.deltaX;
    }
    return { left, width };
  };

  return (
    <div className={`flex h-screen flex-col overflow-hidden ${T.app} ${drag ? 'is-dragging' : ''}`}>

      {/* ------------------------------ En-tête ------------------------------ */}
      <header className={`flex shrink-0 flex-wrap items-center justify-between gap-3 border-b px-4 py-2.5 ${T.rail} ${T.border}`}>
        <div className="flex items-center gap-5">
          <div className="flex items-center gap-2.5">
            <div className="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 to-fuchsia-600 text-lg font-black text-white shadow-lg shadow-indigo-950/50">Δ</div>
            <div className="leading-tight">
              <div className="text-sm font-extrabold tracking-tight">AuraPlan Studio</div>
              <div className={`text-[10px] font-medium ${T.faint}`}>Projet › tâche › sous-tâche</div>
            </div>
          </div>
          <nav className={`flex rounded-xl border p-1 ${T.raise}`}>
            {[
              { id: 'roadmap', label: 'Roadmap', key: '1' },
              { id: 'kanban', label: 'Kanban', key: '2' },
              { id: 'planning', label: 'Planning', key: '3' },
              { id: 'notes', label: 'Notes', key: '4' }
            ].map((tab) => (
              <button key={tab.id} type="button" onClick={() => setActiveTab(tab.id)}
                className={`rounded-lg px-3.5 py-1.5 text-xs font-bold transition ${activeTab === tab.id ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-950/40' : `${T.muted} hover:text-indigo-400`}`}>
                {tab.label}<span className="ml-1.5 hidden font-mono text-[9px] opacity-50 sm:inline">{tab.key}</span>
              </button>
            ))}
          </nav>
        </div>

        <div className="flex items-center gap-2">
          <input type="search" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Rechercher…"
            className={`hidden w-44 rounded-xl border px-3 py-2 text-xs outline-none focus:border-indigo-500 md:block ${inputCls}`} />
          {activeTab !== 'notes' ? (
            <select value={assigneeFilter} onChange={(e) => setAssigneeFilter(e.target.value)} className={`hidden w-36 lg:block ${inputCls}`}>
              <option value="ALL">Toute l'équipe</option>
              {collaborators.map((c) => <option key={c} value={c}>{c}</option>)}
            </select>
          ) : null}
          <button type="button" onClick={() => setIsDark(!isDark)} className={btnQuiet} title="Changer de thème">{isDark ? '☀' : '☾'}</button>
          <button type="button" onClick={() => setIsHelpOpen(true)} className={btnQuiet} title="Aide">?</button>
          <button type="button" onClick={() => setIsConfigOpen(true)} className={btnSecondary}
            title={collabState.status === 'connected' ? `${collabState.names.join(', ')} — salon ${collab.room}`
              : collabState.status === 'error' ? `Collaboration indisponible : ${collabState.error}`
                : collab.enabled ? 'Connexion au salon en cours…' : 'Travailler à plusieurs en temps réel'}>
            <span className="flex items-center gap-1.5">
              <span className={`h-2 w-2 rounded-full ${collabState.status === 'connected' ? 'bg-emerald-400 animate-pulse'
                : collabState.status === 'connecting' || collabState.status === 'loading' ? 'bg-amber-400 animate-pulse'
                  : collabState.status === 'error' ? 'bg-rose-500' : 'bg-slate-500'}`} />
              {collab.enabled ? (collabState.peers > 0 ? `${collabState.peers + 1} en ligne` : 'Partagé') : 'Partager'}
            </span>
          </button>
          <button type="button" className={btnPrimary}
            onClick={() => {
              if (activeTab === 'planning') openEntryCreator(collaborators[0] || 'Moi', Math.max(0, todayOffset), 'AM');
              else if (activeTab === 'notes') createNote(null);
              else if (activeTab === 'kanban') setTaskForm({ id: null, projectId: selectedProjectId || (projects[0] && projects[0].id) || '', title: '', assignee: collaborators[0] || 'Moi', startDate: TODAY_STR, duration: 2, status: 'TODO', priority: 'MEDIUM', notes: '' });
              else setProjectForm({ id: null, title: '', category: 'Général', startDate: TODAY_STR, duration: 30, color: DEFAULT_COLOR });
            }}>
            {activeTab === 'planning' ? 'Planifier' : activeTab === 'notes' ? 'Nouvelle note' : activeTab === 'kanban' ? 'Nouvelle tâche' : 'Nouveau projet'}
          </button>
        </div>
      </header>

      {/* --------------------------- Barre d'outils --------------------------- */}
      {activeTab !== 'notes' ? (
        <div className={`flex shrink-0 flex-wrap items-center justify-between gap-3 border-b px-4 py-2 text-xs ${T.panel}`}>
          <div className="flex flex-wrap items-center gap-2">
            {activeTab === 'roadmap' ? (
              <>
                <button type="button" onClick={() => setIsLeftPanelOpen(!isLeftPanelOpen)} className={btnSecondary}>{isLeftPanelOpen ? 'Réduire la colonne' : 'Afficher la colonne'}</button>
                <button type="button" onClick={() => setIsRightPanelOpen(!isRightPanelOpen)} className={btnSecondary}>{isRightPanelOpen ? 'Masquer le détail' : 'Afficher le détail'}</button>
                <button type="button" onClick={scrollToEvent} className={btnSecondary} title={`Aller au ${event.label}`}>💍 Jour J</button>
                <button type="button" onClick={scrollToToday} className={btnSecondary}>Aujourd'hui</button>
                <span className={`ml-1 hidden text-[11px] 2xl:inline ${T.faint}`}>Clic maintenu sur la grille pour faire défiler · ← → pour avancer d'une semaine</span>
              </>
            ) : null}
            {activeTab === 'planning' ? (
              <>
                <button type="button" onClick={focusSprint} className={btnPrimary}>Sprint 2 semaines</button>
                <button type="button" onClick={scrollToToday} className={btnSecondary}>Aujourd'hui</button>
                <span className={`ml-1 hidden text-[11px] xl:inline ${T.faint}`}>Glissez un bloc vers une autre ligne pour changer de collaborateur</span>
              </>
            ) : null}
            {activeTab === 'kanban' ? (
              <span className={`text-[11px] ${T.faint}`}>Glissez les cartes pour changer de colonne <em>et</em> pour les réordonner dans la colonne</span>
            ) : null}
          </div>

          <div className="flex items-center gap-3">
            <button type="button" onClick={() => setIsConfigOpen(true)}
              title={`${event.label} — ${formatDateFr(event.date)} (cliquez pour changer la date)`}
              className="flex items-center gap-1.5 rounded-xl border border-rose-500/40 bg-rose-500/10 px-2.5 py-1.5 text-[11px] font-extrabold text-rose-300 transition hover:bg-rose-500/20">
              <span className="jour-j-pin">💍</span>
              {daysToEvent > 0 ? `J-${daysToEvent}` : daysToEvent === 0 ? "C'est aujourd'hui" : `J+${Math.abs(daysToEvent)}`}
              <span className="hidden font-mono font-medium opacity-70 xl:inline">{formatDateFr(event.date)}</span>
            </button>
            <button type="button" onClick={undo} className={btnQuiet} title="Ctrl+Z">Annuler</button>
            {activeTab !== 'kanban' ? (
              <>
                <span className={`font-semibold ${T.faint}`}>Zoom</span>
                <input type="range" min="3" max="240" value={columnWidth} onChange={(e) => setColumnWidth(Number(e.target.value))} className="w-28" aria-label="Zoom" />
                <button type="button" onClick={fitAll} className={btnSecondary}>Tout afficher</button>
              </>
            ) : null}
          </div>
        </div>
      ) : null}

      {/* ------------------------------ Contenu ------------------------------ */}
      <main className="relative flex flex-1 overflow-hidden">

        {/* Rappel discret du Jour J lorsqu'il est hors de l'écran */}
        {activeTab === 'roadmap' && viewport.width > 0 && eventOffset >= 0 ? (() => {
          const eventX = nameColWidth + eventOffset * columnWidth;
          const gauche = eventX < viewport.left + nameColWidth;
          const droite = eventX > viewport.left + viewport.width - 12;
          if (!gauche && !droite) return null;
          return (
            <button type="button" onClick={scrollToEvent}
              title={`${event.label} — ${formatDateFr(event.date)} · cliquez pour y aller`}
              className={`group absolute top-1/2 z-[45] flex -translate-y-1/2 items-center gap-1 rounded-full border border-rose-400/40 bg-rose-500/15 px-2 py-1.5 text-[10px] font-bold text-rose-300 opacity-60 backdrop-blur transition hover:opacity-100
                ${droite ? 'right-2' : 'left-2'} ${isRightPanelOpen && droite ? 'lg:right-[21rem]' : ''}`}>
              {gauche ? <span>‹</span> : null}
              <span className="jour-j-pin">💍</span>
              <span className="hidden font-mono group-hover:inline">{daysToEvent > 0 ? `J-${daysToEvent}` : formatDateFr(event.date)}</span>
              {droite ? <span>›</span> : null}
            </button>
          );
        })() : null}

        {/* ============================= ROADMAP ============================= */}
        {activeTab === 'roadmap' ? (
          <>
            <div id="timeline-viewport" onMouseDown={startPan} onScroll={syncViewport}
              className={`flex-1 overflow-auto ${panning ? 'cursor-grabbing select-none' : 'cursor-grab'} ${isDark ? 'bg-[#05080F]' : 'bg-[#EEF1F6]'}`}>
              <div style={{ width: `${timelineWidth + nameColWidth}px`, minWidth: '100%' }}>

                <div className={`sticky top-0 z-30 flex h-7 border-b ${T.rail} ${T.border}`}>
                  <div style={{ width: `${nameColWidth}px` }} className={`sticky left-0 z-40 flex items-center border-r px-3 text-[10px] font-bold uppercase tracking-wide ${T.rail} ${T.border} ${T.faint}`}>
                    {isLeftPanelOpen ? `${projects.length} projet(s)` : '—'}
                  </div>
                  <div className="flex">
                    {timelineMonths.map((m, i) => (
                      <div key={i} style={{ width: `${m.days * columnWidth}px` }} className={`flex h-full items-center justify-center border-r text-[10px] font-extrabold uppercase tracking-wider ${T.grid} ${T.faint}`}>
                        {m.days * columnWidth > 90 ? m.label : m.days * columnWidth > 26 ? m.label.slice(0, 3) : ''}
                      </div>
                    ))}
                  </div>
                </div>

                <div className={`sticky top-7 z-30 flex h-11 border-b ${T.rail} ${T.border}`}>
                  <div style={{ width: `${nameColWidth}px` }} className={`sticky left-0 z-40 flex items-center justify-between border-r px-3 text-[11px] font-bold ${T.rail} ${T.border}`}>
                    {isLeftPanelOpen ? (<><span>Structure</span><button type="button" onClick={() => setIsLeftPanelOpen(false)} className={`text-[10px] ${T.faint}`}>◀</button></>)
                      : <button type="button" onClick={() => setIsLeftPanelOpen(true)} className="text-[10px] font-bold text-indigo-400">▶</button>}
                  </div>
                  <DayHeader withHalves={false} />
                </div>

                <div className="relative">
                  {/* Repère du Jour J, traversant toutes les lignes */}
                  {eventOffset >= 0 && eventOffset < totalDays ? (
                    <div className="pointer-events-none absolute inset-y-0 z-[8]"
                      style={{ left: `${nameColWidth + eventOffset * columnWidth}px`, width: `${Math.max(3, columnWidth)}px` }}>
                      <div className="jour-j-pin absolute inset-y-0 left-1/2 w-0.5 -translate-x-1/2 bg-rose-400" />
                      <div className="absolute -top-0.5 left-1/2 -translate-x-1/2 whitespace-nowrap rounded-b-lg border border-t-0 border-rose-400/70 bg-rose-500/95 px-2 py-0.5 text-[10px] font-extrabold text-white shadow-lg">
                        💍 {event.label} · {formatDateFr(event.date)}
                      </div>
                    </div>
                  ) : null}
                  {projects.length === 0 ? <div className={`px-8 py-16 text-center text-sm ${T.faint}`}>Aucun projet. Créez-en un pour démarrer votre roadmap.</div> : null}

                  {projects.map((proj) => {
                    const pct = projectProgress(proj);
                    const isOpen = !!openProjects[proj.id];
                    const isSelected = proj.id === selectedProjectId;
                    const dragging = drag && drag.kind === 'project' && drag.id === proj.id;
                    const startUnits = diffDays(parseDate(proj.startDate), timelineStart);
                    const geo = barGeometry(startUnits, proj.duration, dragging);

                    return (
                      <React.Fragment key={proj.id}>
                        {/* Niveau 1 — projet */}
                        <div className={`flex h-14 border-b ${T.border} ${isSelected ? 'bg-indigo-500/[0.07]' : ''}`}>
                          <div style={{ width: `${nameColWidth}px` }}
                            data-nopan className={`sticky left-0 z-20 flex items-center gap-2 border-r px-3 ${T.panel} ${isSelected ? 'shadow-[inset_3px_0_0_0_#6366F1]' : ''}`}>
                            {isLeftPanelOpen ? (
                              <>
                                <button type="button" onClick={() => setOpenProjects({ ...openProjects, [proj.id]: !isOpen })}
                                  className={`flex h-7 w-7 shrink-0 items-center justify-center rounded-lg border text-[12px] font-black leading-none transition
                                    ${isOpen ? 'border-indigo-400/70 bg-indigo-600 text-white shadow-md shadow-indigo-950/40'
                                             : `${T.border} ${isDark ? 'bg-white/10' : 'bg-slate-200'} text-indigo-400 hover:border-indigo-400 hover:bg-indigo-500/20`}`}
                                  aria-label={isOpen ? 'Replier le projet' : 'Déplier le projet'}
                                  title={isOpen ? 'Replier ce projet' : `Déplier ce projet (${proj.tasks.length} tâches)`}>
                                  {isOpen ? '−' : '+'}
                                </button>
                                <button type="button" onClick={() => setSelectedProjectId(proj.id)} className="min-w-0 flex-1 text-left">
                                  <div className="flex items-center gap-2">
                                    <span className={`h-2.5 w-2.5 shrink-0 rounded-full bg-gradient-to-r ${proj.color}`} />
                                    <span className="truncate text-xs font-extrabold">{proj.title}</span>
                                  </div>
                                  <div className={`mt-0.5 truncate text-[10px] ${T.faint}`}>{proj.category} · {proj.tasks.length} tâche(s)</div>
                                </button>
                                <span className={`font-mono text-[11px] font-extrabold ${pct === 100 ? 'text-emerald-400' : 'text-indigo-400'}`}>{pct}%</span>
                              </>
                            ) : <span className={`h-2.5 w-2.5 rounded-full bg-gradient-to-r ${proj.color}`} />}
                          </div>

                          <div className="relative" style={{ width: `${timelineWidth}px` }}>
                            <GridBackground rowKey={proj.id} />
                            {dragging ? <div style={{ left: `${drag.snapStart * columnWidth}px`, width: `${drag.snapLen * columnWidth}px` }} className="absolute top-3 h-8 rounded-lg border-2 border-dashed border-indigo-400 bg-indigo-500/10" /> : null}
                            <div style={{ left: `${geo.left}px`, width: `${Math.max(columnWidth * 0.6, geo.width)}px` }}
                                  data-nopan
                              onMouseDown={(e) => startDrag(e, { kind: 'project', id: proj.id, action: 'move', unit: 1, startUnits, lenUnits: proj.duration })}
                              onClick={() => { if (!movedRef.current) { setSelectedProjectId(proj.id); setIsRightPanelOpen(true); } }}
                              className={`group absolute top-3 flex h-8 cursor-grab items-center overflow-hidden rounded-lg border bg-gradient-to-r ${proj.color} shadow-lg active:cursor-grabbing ${isEventBar(proj.startDate, proj.duration) ? 'jour-j-bar border-rose-300/80' : 'border-white/20'} ${dragging ? 'z-[15] ring-2 ring-indigo-400' : 'z-10'}`}>
                              <div className="absolute inset-0 bg-slate-950/60" />
                              <div className={`absolute inset-y-0 left-0 bg-gradient-to-r ${proj.color}`} style={{ width: `${pct}%` }} />
                              <div onMouseDown={(e) => startDrag(e, { kind: 'project', id: proj.id, action: 'resize-left', unit: 1, startUnits, lenUnits: proj.duration })} className="absolute inset-y-0 left-0 z-20 w-2.5 cursor-ew-resize bg-white/40 opacity-0 group-hover:opacity-100" />
                              <div className="pointer-events-none relative flex w-full items-center justify-between gap-2 px-2.5">
                                <span className="truncate text-[11px] font-extrabold text-white drop-shadow">{proj.title}</span>
                                <span className="shrink-0 rounded bg-black/50 px-1.5 py-0.5 font-mono text-[10px] font-bold text-white">{pct}%</span>
                              </div>
                              <div onMouseDown={(e) => startDrag(e, { kind: 'project', id: proj.id, action: 'resize-right', unit: 1, startUnits, lenUnits: proj.duration })} className="absolute inset-y-0 right-0 z-20 w-2.5 cursor-ew-resize bg-white/40 opacity-0 group-hover:opacity-100" />
                            </div>
                            {dragging ? (
                              <div className="pointer-events-none absolute -top-1 z-[15] rounded-lg border border-indigo-500 bg-slate-900 px-2 py-1 font-mono text-[10px] text-slate-100 shadow-xl" style={{ left: `${drag.snapStart * columnWidth}px` }}>
                                {formatDateFr(formatDateIso(addDays(timelineStart, drag.snapStart)))} · {drag.snapLen} j
                              </div>
                            ) : null}
                          </div>
                        </div>

                        {/* Niveau 2 — tâches */}
                        {isOpen ? proj.tasks.map((task) => {
                          const tOpen = !!openTasks[task.id];
                          const tDragging = drag && drag.kind === 'task' && drag.id === task.id;
                          const tStart = diffDays(parseDate(task.startDate), timelineStart);
                          const tGeo = barGeometry(tStart, task.duration, tDragging);
                          const doneSub = task.subtasks.filter((s) => s.status === 'DONE').length;
                          return (
                            <React.Fragment key={task.id}>
                              <div className={`flex h-10 border-b ${T.border} ${isDark ? 'bg-white/[0.015]' : 'bg-slate-50/60'}`}>
                                <div style={{ width: `${nameColWidth}px` }} data-nopan className={`sticky left-0 z-20 flex items-center gap-2 border-r pl-6 pr-3 ${T.panel} shadow-[inset_14px_0_0_-12px_rgba(99,102,241,.7)]`}>
                                  {isLeftPanelOpen ? (
                                    <>
                                      <button type="button" disabled={!task.subtasks.length}
                                        onClick={() => setOpenTasks({ ...openTasks, [task.id]: !tOpen })}
                                        className={`flex h-6 shrink-0 items-center justify-center gap-0.5 rounded-md border px-1 text-[10px] font-black leading-none transition
                                          ${!task.subtasks.length ? 'invisible'
                                            : tOpen ? 'border-cyan-400/70 bg-cyan-600 text-white'
                                                    : `${T.border} ${isDark ? 'bg-white/10' : 'bg-slate-200'} text-cyan-400 hover:border-cyan-400 hover:bg-cyan-500/20`}`}
                                        aria-label={tOpen ? 'Replier la tâche' : 'Déplier la tâche'}
                                        title={tOpen ? 'Replier les sous-tâches' : `Déplier ${task.subtasks.length} sous-tâches`}>
                                        <span>{tOpen ? '−' : '+'}</span>
                                        <span className="font-mono opacity-80">{task.subtasks.length}</span>
                                      </button>
                                      <input type="checkbox" checked={task.status === 'DONE'} onChange={(e) => setTaskStatus(task.id, e.target.checked ? 'DONE' : 'IN_PROGRESS')}
                                        className="h-3.5 w-3.5 shrink-0 rounded accent-emerald-500" aria-label={`Valider ${task.title}`} />
                                      <button type="button" onClick={() => setEditingTask({ ...task, projectId: proj.id })}
                                        className={`min-w-0 flex-1 truncate text-left text-[11px] ${task.status === 'DONE' ? 'text-slate-500 line-through' : 'font-bold'}`}>{task.title}</button>
                                      {task.subtasks.length ? <span className={`shrink-0 rounded px-1.5 py-0.5 font-mono text-[9px] ${T.raise} ${T.muted}`}>{doneSub}/{task.subtasks.length}</span> : null}
                                      <button type="button" title="Ajouter une sous-tâche"
                                        onClick={() => setSubtaskForm({ id: null, taskId: task.id, projectId: proj.id, title: '', assignee: task.assignee, status: 'TODO', startDate: task.startDate, duration: 1, notes: '' })}
                                        className={`shrink-0 rounded px-1 text-[11px] font-bold ${T.muted} hover:text-indigo-400`}>+</button>
                                    </>
                                  ) : null}
                                </div>
                                <div className="relative" style={{ width: `${timelineWidth}px` }}>
                                  <GridBackground rowKey={task.id} />

                                  {dragging ? (

                                      {formatDateFr(formatDateIso(addDays(timelineStart, Math.floor(drag.snapStart / 2))))} · {drag.snapStart % 2 === 1 ? 'PM' : 'AM'} · {drag.snapLen / 2} j
                                      {drag.targetPerson && drag.targetPerson !== row.person ? ` → ${drag.targetPerson}` : ''}
                                    </div>
                                  ) : null}
                                </div>
                              </React.Fragment>
                            );
                          })}
                        </div>
                      </div>
                    </div>
                  );
                })}
                {planningRows.length === 0 ? <div className={`px-8 py-16 text-center text-sm ${T.faint}`}>Aucun collaborateur ne correspond au filtre.</div> : null}
              </div>
            </div>
          </div>
        ) : null}

        {/* =============================== NOTES =============================== */}
        {activeTab === 'notes' ? (
          <div className="flex flex-1 overflow-hidden">
            <aside className={`flex w-72 shrink-0 flex-col border-r ${T.panel}`}>
              <div className={`flex items-center justify-between border-b px-4 py-3 ${T.border} ${T.inset}`}>
                <h2 className="text-[11px] font-extrabold uppercase tracking-wide">Bloc-notes</h2>
                <button type="button" onClick={() => createNote(null)} className={`rounded-lg px-2 py-1 text-sm font-bold ${T.raise} ${T.muted} hover:text-indigo-400`}>+</button>
              </div>
              <div className="flex-1 overflow-y-auto p-2">
                {sortedNotes.length === 0 ? <p className={`p-4 text-[11px] ${T.faint}`}>Aucune note. Utilisez cet espace pour vos devis, questions et comparatifs.</p> : null}
                {sortedNotes.map((note) => {
                  const proj = projects.find((p) => p.id === note.projectId);
                  return (
                    <button key={note.id} type="button" onClick={() => setSelectedNoteId(note.id)}
                      className={`mb-1.5 flex w-full gap-2 rounded-xl border px-3 py-2.5 text-left transition ${note.id === selectedNoteId ? `border-indigo-500/60 ${isDark ? 'bg-indigo-500/10' : 'bg-indigo-50'}` : `${T.border} ${T.hover}`}`}>
                      <span className={`mt-0.5 h-full w-1 shrink-0 rounded-full ${noteBar(note.color)}`} />
                      <span className="min-w-0 flex-1">
                        <span className="flex items-center gap-1.5">
                          {note.pinned ? <span className="text-[10px]">📌</span> : null}
                          <span className="truncate text-[12px] font-bold">{note.title || 'Note sans titre'}</span>
                        </span>
                        <span className={`mt-0.5 block truncate text-[10px] ${T.faint}`}>{proj ? proj.title + ' · ' : ''}{(note.body || '').split('\n')[0] || 'Vide'}</span>
                      </span>
                    </button>
                  );
                })}
              </div>
            </aside>

            <section className={`flex flex-1 flex-col overflow-hidden ${isDark ? 'bg-[#05080F]' : 'bg-[#EEF1F6]'}`}>
              {selectedNote ? (
                <>
                  <div className={`flex flex-wrap items-center gap-2 border-b px-5 py-3 ${T.border} ${T.rail}`}>
                    <input value={selectedNote.title} placeholder="Titre de la note"
                      onChange={(e) => patchNote(selectedNote.id, { title: e.target.value }, true)}
                      onBlur={(e) => patchNote(selectedNote.id, { title: e.target.value })}
                      className={`min-w-0 flex-1 bg-transparent text-base font-extrabold outline-none ${isDark ? 'placeholder-slate-600' : 'placeholder-slate-400'}`} />
                    <select value={selectedNote.projectId} onChange={(e) => patchNote(selectedNote.id, { projectId: e.target.value })} className={`w-44 ${inputCls}`}>
                      <option value="">Sans projet</option>
                      {projects.map((p) => <option key={p.id} value={p.id}>{p.title}</option>)}
                    </select>
                    <select value={selectedNote.color} onChange={(e) => patchNote(selectedNote.id, { color: e.target.value })} className={`w-28 ${inputCls}`}>
                      {NOTE_COLORS.map((c) => <option key={c.value} value={c.value}>{c.name}</option>)}
                    </select>
                    <button type="button" onClick={() => patchNote(selectedNote.id, { pinned: !selectedNote.pinned })} className={selectedNote.pinned ? btnPrimary : btnSecondary}>📌</button>
                    <button type="button" onClick={() => deleteNote(selectedNote.id)} className={btnDanger}>Supprimer</button>
                  </div>
                  <textarea
                    value={selectedNote.body}
                    onChange={(e) => patchNote(selectedNote.id, { body: e.target.value }, true)}
                    onBlur={(e) => patchNote(selectedNote.id, { body: e.target.value })}
                    placeholder="Devis, contacts, questions à poser, comparatifs… Tout ce qui encombrerait la roadmap va ici."
                    className={`flex-1 resize-none bg-transparent p-6 font-mono text-[13px] leading-relaxed outline-none ${isDark ? 'placeholder-slate-600' : 'placeholder-slate-400'}`} />
                  <div className={`border-t px-5 py-2 text-[10px] ${T.border} ${T.faint}`}>
                    Sauvegarde automatique · modifiée le {new Date(selectedNote.updatedAt).toLocaleString('fr-FR')}
                  </div>
                </>
              ) : (
                <div className="flex flex-1 items-center justify-center">
                  <button type="button" onClick={() => createNote(null)} className={btnPrimary}>Créer votre première note</button>
                </div>
              )}
            </section>
          </div>
        ) : null}
      </main>

      {/* ------------------------------- Modales ------------------------------- */}
      {entryForm ? (
        <Modal T={T} title={entryForm.id ? 'Modifier l’entrée' : 'Planifier une entrée'}
          subtitle={`${entryForm.assignee} · ${formatDayShort(entryForm.startDate)} · ${entryForm.slot === 'PM' ? 'après-midi' : 'matin'}`}
          onClose={() => setEntryForm(null)}
          footer={<>
            <span className={`text-[11px] ${T.faint}`}>Durée minimale : 0,5 jour</span>
            <div className="flex gap-2">
              <button type="button" className={btnSecondary} onClick={() => setEntryForm(null)}>Annuler</button>
              <button type="button" className={btnPrimary} onClick={() => saveEntry(entryForm)}>{entryForm.id ? 'Enregistrer' : 'Planifier'}</button>
            </div>
          </>}>
          <div className="space-y-3">
            <div className={`rounded-xl border p-3 ${T.raise}`}>
              <Field T={T} label="Reprendre un projet, une tâche ou une sous-tâche" hint="Remplit le titre, l'étiquette et la couleur en un clic.">
                <select className={inputCls} value=""
                  onChange={(e) => {
                    const v = e.target.value;
                    if (!v) return;
                    const [type, id] = v.split(':');
                    if (type === 'proj') { const p = projects.find((x) => x.id === id); if (p) setEntryForm({ ...entryForm, title: p.title, tag: p.category, color: p.color }); }
                    else if (type === 'task') { const t = allTasks.find((x) => x.id === id); if (t) setEntryForm({ ...entryForm, title: t.title, tag: t.project.category, color: t.project.color }); }
                    else {
                      let found = null; let parent = null;
                      allTasks.forEach((t) => t.subtasks.forEach((s) => { if (s.id === id) { found = s; parent = t; } }));
                      if (found) setEntryForm({ ...entryForm, title: found.title, tag: parent.title, color: parent.project.color, assignee: entryForm.assignee });
                    }
                  }}>
                  <option value="">Choisir un modèle…</option>
                  <optgroup label="Projets">{projects.map((p) => <option key={p.id} value={`proj:${p.id}`}>{p.title}</option>)}</optgroup>
                  <optgroup label="Tâches">{allTasks.map((t) => <option key={t.id} value={`task:${t.id}`}>{t.title}</option>)}</optgroup>
                  <optgroup label="Sous-tâches">
                    {allTasks.flatMap((t) => t.subtasks.map((s) => <option key={s.id} value={`sub:${s.id}`}>{t.title} › {s.title}</option>))}
                  </optgroup>
                </select>
              </Field>
            </div>
            <Field T={T} label="Titre"><input className={inputCls} value={entryForm.title} autoFocus onChange={(e) => setEntryForm({ ...entryForm, title: e.target.value })} placeholder="Ex. Visite du domaine" /></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field T={T} label="Étiquette"><input className={inputCls} value={entryForm.tag} onChange={(e) => setEntryForm({ ...entryForm, tag: e.target.value })} /></Field>
              <Field T={T} label="Couleur">
                <select className={inputCls} value={entryForm.color} onChange={(e) => setEntryForm({ ...entryForm, color: e.target.value })}>
                  {COLOR_OPTIONS.map((c) => <option key={c.value} value={c.value}>{c.name}</option>)}
                </select>
              </Field>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <Field T={T} label="Collaborateur"><input className={inputCls} list="collab-list" value={entryForm.assignee} onChange={(e) => setEntryForm({ ...entryForm, assignee: e.target.value })} /></Field>
              <Field T={T} label="Durée (jours)"><input type="number" step="0.5" min="0.5" className={inputCls} value={entryForm.duration} onChange={(e) => setEntryForm({ ...entryForm, duration: e.target.value })} /></Field>
            </div>
            <div className="grid grid-cols-3 gap-3">
              <Field T={T} label="Date"><input type="date" className={inputCls} value={entryForm.startDate} onChange={(e) => setEntryForm({ ...entryForm, startDate: e.target.value })} /></Field>
              <Field T={T} label="Créneau">
                <select className={inputCls} value={entryForm.slot} onChange={(e) => setEntryForm({ ...entryForm, slot: e.target.value })}>
                  <option value="AM">☀ Matin</option><option value="PM">☾ Après-midi</option>
                </select>
              </Field>
              <Field T={T} label="Fin (incluse)">
                <input type="date" className={inputCls} min={entryForm.startDate} value={endFromDuration(entryForm.startDate, entryForm.duration)}
                  onChange={(e) => { if (!isIsoDate(e.target.value)) return; setEntryForm({ ...entryForm, duration: durationFromEnd(entryForm.startDate, e.target.value, 0.5) }); }} />
              </Field>
            </div>
          </div>
        </Modal>
      ) : null}

      {editingEntry ? (
        <Modal T={T} title="Entrée de planning" subtitle={`${editingEntry.assignee} · ${formatDayShort(editingEntry.startDate)}`} onClose={() => setEditingEntry(null)}

            <button type="button" className="text-xs font-bold text-rose-400" onClick={() => deleteEntry(editingEntry.id)}>Supprimer</button>
            <div className="flex gap-2">
              <button type="button" className={btnSecondary} onClick={() => duplicateEntry(editingEntry)}>Dupliquer</button>
              <button type="button" className={btnPrimary} onClick={() => saveEntry(editingEntry)}>Enregistrer</button>
            </div>
          </>}>
          <div className="space-y-3">
            <Field T={T} label="Titre"><input className={inputCls} value={editingEntry.title} onChange={(e) => setEditingEntry({ ...editingEntry, title: e.target.value })} /></Field>
            <div className={`rounded-xl border p-3 ${T.raise}`}>
              <Field T={T} label="Basculer vers un autre collaborateur" hint="Vous pouvez aussi glisser le bloc vers une autre ligne du planning.">
                <div className="flex flex-wrap gap-1.5">
                  {collaborators.map((c) => (
                    <button key={c} type="button" onClick={() => { reassignEntry(editingEntry.id, c); setEditingEntry({ ...editingEntry, assignee: c }); }}
                      className={`flex items-center gap-1.5 rounded-lg border px-2 py-1 text-[10px] font-bold transition ${c === editingEntry.assignee ? 'border-indigo-500 bg-indigo-600 text-white' : `${T.border} ${T.hover} ${T.muted}`}`}>
                      <Avatar name={c} size="sm" />{c}
                    </button>
                  ))}
                </div>
              </Field>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <Field T={T} label="Date"><input type="date" className={inputCls} value={editingEntry.startDate} onChange={(e) => setEditingEntry({ ...editingEntry, startDate: e.target.value })} /></Field>
              <Field T={T} label="Créneau">
                <select className={inputCls} value={editingEntry.slot} onChange={(e) => setEditingEntry({ ...editingEntry, slot: e.target.value })}>
                  <option value="AM">☀ Matin</option><option value="PM">☾ Après-midi</option>
                </select>
              </Field>
            </div>
            <div className="grid grid-cols-3 gap-3">
              <Field T={T} label="Fin (incluse)">
                <input type="date" className={inputCls} min={editingEntry.startDate} value={endFromDuration(editingEntry.startDate, editingEntry.duration)}
                  onChange={(e) => { if (!isIsoDate(e.target.value)) return; setEditingEntry({ ...editingEntry, duration: durationFromEnd(editingEntry.startDate, e.target.value, 0.5) }); }} />
              </Field>
              <Field T={T} label="Durée (jours)"><input type="number" step="0.5" min="0.5" className={inputCls} value={editingEntry.duration} onChange={(e) => setEditingEntry({ ...editingEntry, duration: Number(e.target.value) })} /></Field>
              <Field T={T} label="Couleur">
                <select className={inputCls} value={editingEntry.color} onChange={(e) => setEditingEntry({ ...editingEntry, color: e.target.value })}>
                  {COLOR_OPTIONS.map((c) => <option key={c.value} value={c.value}>{c.name}</option>)}
                </select>
              </Field>
            </div>
            {editingEntry.duration > 0.5 ? <button type="button" className={`w-full ${btnSecondary}`} onClick={() => openSplit(editingEntry)}>Scinder en tranches de 0,5 j</button> : null}
          </div>
        </Modal>
      ) : null}

      {splitEntry ? (
        <Modal T={T} title="Scinder l’entrée" subtitle={`${splitEntry.title} · ${splitEntry.duration} j`} onClose={() => setSplitEntry(null)}
          footer={<>
            <button type="button" className="text-[11px] font-bold text-indigo-400" onClick={() => setSplitSegments([...splitSegments, 0.5])}>+ Ajouter une tranche</button>
            <div className="flex gap-2">
              <button type="button" className={btnSecondary} onClick={() => setSplitEntry(null)}>Annuler</button>
              <button type="button" className={btnPrimary} onClick={applySplit}>Scinder</button>
            </div>
          </>}>
          <div className="space-y-2">
            {splitSegments.map((seg, idx) => (
              <div key={idx} className={`flex items-center gap-2 rounded-xl border px-3 py-2 ${T.raise}`}>
                <span className={`w-16 text-[11px] font-bold ${T.faint}`}>Tranche {idx + 1}</span>
                <input type="number" step="0.5" min="0.5" className={`${inputCls} flex-1 font-mono`} value={seg}
                  onChange={(e) => { const next = [...splitSegments]; next[idx] = Number(e.target.value); setSplitSegments(next); }} />
                {splitSegments.length > 2 ? <button type="button" className="px-2 text-xs font-bold text-rose-400" onClick={() => setSplitSegments(splitSegments.filter((_, i) => i !== idx))}>✕</button> : null}
              </div>
            ))}
            {(() => {
              const sum = splitSegments.reduce((a, b) => a + Number(b), 0);
              const ok = Math.abs(sum - splitEntry.duration) < 0.001;
              return (
                <div className={`flex items-center justify-between rounded-xl border px-3 py-2 text-[11px] ${T.raise}`}>
                  <span className={T.faint}>Total</span>
                  <span className={`font-mono font-bold ${ok ? 'text-emerald-400' : 'text-rose-400'}`}>{sum} / {splitEntry.duration} j</span>
                </div>
              );
            })()}
          </div>
        </Modal>
      ) : null}

      {projectForm ? (
        <Modal T={T} title={projectForm.id ? 'Modifier le projet' : 'Nouveau projet'} onClose={() => setProjectForm(null)}
          footer={<><span className={`text-[11px] ${T.faint}`}>Les barres restent déplaçables à la souris.</span>
            <div className="flex gap-2">
              <button type="button" className={btnSecondary} onClick={() => setProjectForm(null)}>Annuler</button>
              <button type="button" className={btnPrimary} onClick={() => saveProject(projectForm)}>{projectForm.id ? 'Enregistrer' : 'Créer le projet'}</button>
            </div></>}>
          <div className="space-y-3">
            <Field T={T} label="Nom du projet"><input className={inputCls} autoFocus value={projectForm.title} onChange={(e) => setProjectForm({ ...projectForm, title: e.target.value })} placeholder="Ex. Mariage — prestataires" /></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field T={T} label="Catégorie"><input className={inputCls} value={projectForm.category} onChange={(e) => setProjectForm({ ...projectForm, category: e.target.value })} /></Field>
              <Field T={T} label="Couleur">
                <select className={inputCls} value={projectForm.color} onChange={(e) => setProjectForm({ ...projectForm, color: e.target.value })}>
                  {COLOR_OPTIONS.map((c) => <option key={c.value} value={c.value}>{c.name}</option>)}
                </select>
              </Field>
            </div>
            <div className="grid grid-cols-3 gap-3">
              <Field T={T} label="Début"><input type="date" className={inputCls} value={projectForm.startDate} onChange={(e) => setProjectForm({ ...projectForm, startDate: e.target.value })} /></Field>
              <Field T={T} label="Fin (incluse)">
                <input type="date" className={inputCls} min={projectForm.startDate} value={endFromDuration(projectForm.startDate, projectForm.duration)}
                  onChange={(e) => { if (!isIsoDate(e.target.value)) return; setProjectForm({ ...projectForm, duration: durationFromEnd(projectForm.startDate, e.target.value, 1) }); }} />
              </Field>
              <Field T={T} label="Durée (jours)"><input type="number" min="1" className={inputCls} value={projectForm.duration} onChange={(e) => setProjectForm({ ...projectForm, duration: e.target.value })} /></Field>
            </div>
          </div>
        </Modal>
      ) : null}

      {(taskForm || editingTask) ? (() => {
        const form = taskForm || editingTask;
        const setForm = taskForm ? setTaskForm : setEditingTask;
        const parent = form.id ? projects.find((p) => p.tasks.some((t) => t.id === form.id)) : null;
        const liveTask = parent ? parent.tasks.find((t) => t.id === form.id) : null;
        return (
          <Modal T={T} size="lg" title={form.id ? 'Tâche' : 'Nouvelle tâche'} subtitle={parent ? parent.title : null}
            onClose={() => { setTaskForm(null); setEditingTask(null); }}
            footer={<>
              {form.id ? <button type="button" className="text-xs font-bold text-rose-400" onClick={() => deleteTask(form.id)}>Supprimer</button> : <span />}
              <div className="flex gap-2">
                <button type="button" className={btnSecondary} onClick={() => { setTaskForm(null); setEditingTask(null); }}>Annuler</button>
                <button type="button" className={btnPrimary} onClick={() => saveTask(form)}>{form.id ? 'Enregistrer' : 'Créer la tâche'}</button>
              </div>
            </>}>
            <div className="space-y-3">
              {!form.id ? (
                <Field T={T} label="Projet">
                  <select className={inputCls} value={form.projectId} onChange={(e) => setForm({ ...form, projectId: e.target.value })}>
                    {projects.map((p) => <option key={p.id} value={p.id}>{p.title}</option>)}
                  </select>
                </Field>
              ) : null}
              <Field T={T} label="Titre"><input className={inputCls} autoFocus value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} /></Field>
              <div className="grid grid-cols-2 gap-3">
                <Field T={T} label="Assigné à"><input className={inputCls} list="collab-list" value={form.assignee} onChange={(e) => setForm({ ...form, assignee: e.target.value })} /></Field>
                <Field T={T} label="Priorité">
                  <select className={inputCls} value={form.priority} onChange={(e) => setForm({ ...form, priority: e.target.value })}>
                    {PRIORITIES.map((p) => <option key={p} value={p}>{PRIORITY_META[p].label}</option>)}
                  </select>
                </Field>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <Field T={T} label="Début"><input type="date" className={inputCls} value={form.startDate} onChange={(e) => setForm({ ...form, startDate: e.target.value })} /></Field>
                <Field T={T} label="Fin (incluse)">
                  <input type="date" className={inputCls} min={form.startDate} value={endFromDuration(form.startDate, form.duration)}
                    onChange={(e) => { if (!isIsoDate(e.target.value)) return; setForm({ ...form, duration: durationFromEnd(form.startDate, e.target.value, 0.5) }); }} />
                </Field>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <Field T={T} label="Durée (j)"><input type="number" step="0.5" min="0.5" className={inputCls} value={form.duration} onChange={(e) => setForm({ ...form, duration: Number(e.target.value) })} /></Field>
                <Field T={T} label="Colonne Kanban">
                  <select className={inputCls} value={form.status} onChange={(e) => setForm({ ...form, status: e.target.value })}>
                    {STATUSES.map((s) => <option key={s} value={s}>{statusLabel(s)}</option>)}
                  </select>
                </Field>
              </div>

              {liveTask ? (
                <div className={`overflow-hidden rounded-xl border ${T.raise}`}>
                  <div className={`flex items-center justify-between border-b px-3 py-2 ${T.border} ${T.inset}`}>
                    <span className="text-[11px] font-extrabold uppercase tracking-wide">Sous-tâches ({liveTask.subtasks.length})</span>
                    <button type="button" className="text-[11px] font-bold text-indigo-400"
                      onClick={() => setSubtaskForm({ id: null, taskId: liveTask.id, projectId: parent.id, title: '', assignee: liveTask.assignee, status: 'TODO', startDate: liveTask.startDate, duration: 1, notes: '' })}>+ Ajouter</button>
                  </div>
                  <div className="max-h-48 space-y-1 overflow-y-auto p-2">
                    {liveTask.subtasks.length === 0 ? <p className={`px-2 py-2 text-[11px] ${T.faint}`}>Aucune sous-tâche.</p> : null}
                    {liveTask.subtasks.map((s) => (
                      <div key={s.id} className={`flex items-center gap-2 rounded-lg border px-2 py-1.5 ${T.border}`}>
                        <input type="checkbox" checked={s.status === 'DONE'} onChange={(e) => setSubtaskStatus(s.id, e.target.checked ? 'DONE' : 'TODO')} className="h-3.5 w-3.5 accent-emerald-500" />
                        <button type="button" className={`min-w-0 flex-1 truncate text-left text-[11px] ${s.status === 'DONE' ? 'line-through opacity-60' : ''}`}
                          onClick={() => setSubtaskForm({ ...s, taskId: liveTask.id, projectId: parent.id })}>{s.title}</button>
                        <span className={`shrink-0 rounded border px-1.5 py-0.5 text-[9px] font-bold ${STATUS_META[s.status].tint}`}>{statusLabel(s.status)}</span>
                      </div>
                    ))}
                  </div>
                </div>
              ) : null}

              <Field T={T} label="Notes rapides" hint="Pour les longs comparatifs, préférez l'onglet Notes.">
                <textarea rows="3" className={inputCls} value={form.notes || ''} onChange={(e) => setForm({ ...form, notes: e.target.value })} />
              </Field>
            </div>
          </Modal>
        );
      })() : null}

      {subtaskForm ? (
        <Modal T={T} title={subtaskForm.id ? 'Sous-tâche' : 'Nouvelle sous-tâche'} onClose={() => setSubtaskForm(null)}
          footer={<>
            {subtaskForm.id ? <button type="button" className="text-xs font-bold text-rose-400" onClick={() => deleteSubtask(subtaskForm)}>Supprimer</button> : <span />}
            <div className="flex gap-2">
              <button type="button" className={btnSecondary} onClick={() => setSubtaskForm(null)}>Annuler</button>
              <button type="button" className={btnPrimary} onClick={() => saveSubtask(subtaskForm)}>{subtaskForm.id ? 'Enregistrer' : 'Ajouter'}</button>
            </div>
          </>}>
          <div className="space-y-3">
            <Field T={T} label="Titre"><input className={inputCls} autoFocus value={subtaskForm.title} onChange={(e) => setSubtaskForm({ ...subtaskForm, title: e.target.value })} placeholder="Ex. Demander le devis" /></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field T={T} label="Assigné à"><input className={inputCls} list="collab-list" value={subtaskForm.assignee} onChange={(e) => setSubtaskForm({ ...subtaskForm, assignee: e.target.value })} /></Field>
              <Field T={T} label="Statut">
                <select className={inputCls} value={subtaskForm.status} onChange={(e) => setSubtaskForm({ ...subtaskForm, status: e.target.value })}>
                  {STATUSES.map((s) => <option key={s} value={s}>{statusLabel(s)}</option>)}
                </select>
              </Field>
            </div>
            <div className="grid grid-cols-3 gap-3">
              <Field T={T} label="Début"><input type="date" className={inputCls} value={subtaskForm.startDate} onChange={(e) => setSubtaskForm({ ...subtaskForm, startDate: e.target.value })} /></Field>
              <Field T={T} label="Fin (incluse)">
                <input type="date" className={inputCls} min={subtaskForm.startDate} value={endFromDuration(subtaskForm.startDate, subtaskForm.duration)}
                  onChange={(e) => { if (!isIsoDate(e.target.value)) return; setSubtaskForm({ ...subtaskForm, duration: durationFromEnd(subtaskForm.startDate, e.target.value, 0.5) }); }} />
              </Field>
              <Field T={T} label="Durée (j)"><input type="number" step="0.5" min="0.5" className={inputCls} value={subtaskForm.duration} onChange={(e) => setSubtaskForm({ ...subtaskForm, duration: Number(e.target.value) })} /></Field>
            </div>
            <Field T={T} label="Détail (tarif, contact…)"><textarea rows="3" className={inputCls} value={subtaskForm.notes || ''} onChange={(e) => setSubtaskForm({ ...subtaskForm, notes: e.target.value })} /></Field>
          </div>
        </Modal>
      ) : null}

      {isConfigOpen ? (
        <Modal T={T} title="Synchronisation & sauvegardes" subtitle="Vos données restent dans ce navigateur tant que vous ne les envoyez pas." onClose={() => setIsConfigOpen(false)}
          footer={<>
            <span className={`text-[11px] ${ghStatus ? 'text-indigo-400' : T.faint}`}>{ghStatus || 'Jeton stocké localement, transmis uniquement à GitHub.'}</span>
            <button type="button" className={btnSecondary} onClick={() => setIsConfigOpen(false)}>Fermer</button>
          </>}>
          <div className="space-y-4">
            <div className="flex gap-2">
              <button type="button" className={`flex-1 ${btnSecondary}`} onClick={exportJson}>Exporter en JSON</button>
              <button type="button" className={`flex-1 ${btnSecondary}`} onClick={() => fileInputRef.current && fileInputRef.current.click()}>Importer un JSON</button>
              <input ref={fileInputRef} type="file" accept="application/json,.json" className="hidden" onChange={(e) => { importJson(e.target.files && e.target.files[0]); e.target.value = ''; }} />
            </div>
            <div className={`space-y-3 rounded-xl border p-3 ${T.raise}`}>
              <div className="flex items-center justify-between">
                <h4 className="text-[11px] font-extrabold uppercase tracking-wide">Travail à plusieurs, en direct</h4>
                <button type="button" onClick={() => setCollab({ ...collab, enabled: !collab.enabled })}
                  className={collab.enabled ? btnPrimary : btnSecondary}>{collab.enabled ? 'Activé' : 'Activer'}</button>
              </div>
              <p className={`text-[11px] leading-relaxed ${T.faint}`}>
                Connexion directe entre navigateurs (WebRTC + Yjs) : les frappes au clavier et les déplacements de cartes
                apparaissent chez les autres instantanément. Aucun serveur à gérer, aucune donnée stockée ailleurs que
                sur vos machines — seul un annuaire de mise en relation est contacté.
              </p>

              <div className="grid grid-cols-2 gap-3">
                <Field T={T} label="Votre nom" hint="Affiché aux autres participants.">
                  <input className={inputCls} value={collab.name} onChange={(e) => setCollab({ ...collab, name: e.target.value.slice(0, 40) })} />
                </Field>
                <Field T={T} label="Salon">
                  <div className="flex gap-1.5">
                    <input className={inputCls} value={collab.room} onChange={(e) => setCollab({ ...collab, room: e.target.value.trim().slice(0, 80) })} />
                    <button type="button" className={btnSecondary} title="Générer un nouveau salon"
                      onClick={() => setCollab({ ...collab, room: randomRoom() })}>↻</button>
                  </div>
                </Field>
              </div>

              <Field T={T} label="Phrase secrète (facultative)" hint="Chiffre les échanges : seuls ceux qui l'ont peuvent lire le tableau.">
                <input className={inputCls} value={collab.key} onChange={(e) => setCollab({ ...collab, key: e.target.value.slice(0, 80) })} placeholder="ex. maucaillou2027" />
              </Field>

              <div className={`rounded-xl border p-2.5 ${T.border} ${T.inset}`}>
                <div className="mb-1.5 flex items-center justify-between gap-2">
                  <span className={`text-[10px] font-bold uppercase tracking-wide ${T.faint}`}>Lien d'invitation</span>
                  <button type="button" className="text-[11px] font-bold text-indigo-400" onClick={copyShareUrl}>Copier</button>
                </div>
                <code className="block break-all font-mono text-[10px] text-indigo-300">{shareUrl}</code>
              </div>

              <div className="flex items-center justify-between gap-2 text-[11px]">
                <span className={
                  collabState.status === 'connected' ? 'font-bold text-emerald-400'
                    : collabState.status === 'error' ? 'font-bold text-rose-400'
                      : collabState.status === 'off' ? T.faint : 'font-bold text-amber-400'}>
                  {collabState.status === 'connected' ? `Connecté — ${collabState.peers + 1} participant(s)`
                    : collabState.status === 'connecting' ? 'Connexion au salon…'
                      : collabState.status === 'loading' ? 'Chargement de la bibliothèque…'
                        : collabState.status === 'error' ? `Indisponible : ${collabState.error}`
                          : 'Désactivé — vous travaillez seul, en local'}
                </span>
                {collabState.names.length ? (
                  <span className="flex -space-x-1.5">
                    {collabState.names.slice(0, 6).map((n, i) => <Avatar key={n + i} name={n} size="sm" />)}
                  </span>
                ) : null}
              </div>
            </div>

            <div className={`space-y-3 rounded-xl border p-3 ${T.raise}`}>
              <h4 className="text-[11px] font-extrabold uppercase tracking-wide">Jour J</h4>
              <div className="grid grid-cols-2 gap-3">
                <Field T={T} label="Date" hint="Repère animé sur la roadmap.">
                  <input type="date" className={inputCls} value={event.date}
                    onChange={(e) => { if (isIsoDate(e.target.value)) commit((prev) => ({ ...prev, event: { ...prev.event, date: e.target.value } })); }} />
                </Field>
                <Field T={T} label="Libellé">
                  <input className={inputCls} value={event.label} onChange={(e) => commit((prev) => ({ ...prev, event: { ...prev.event, label: e.target.value } }))} />
                </Field>
              </div>
            </div>

            <div className={`space-y-3 rounded-xl border p-3 ${T.raise}`}>
              <h4 className="text-[11px] font-extrabold uppercase tracking-wide">Dépôt GitHub</h4>
              <div className="grid grid-cols-2 gap-3">
                <Field T={T} label="Propriétaire"><input className={inputCls} value={gh.owner} onChange={(e) => setGh({ ...gh, owner: e.target.value.trim() })} /></Field>
                <Field T={T} label="Dépôt"><input className={inputCls} value={gh.repo} onChange={(e) => setGh({ ...gh, repo: e.target.value.trim() })} /></Field>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <Field T={T} label="Branche"><input className={inputCls} value={gh.branch} onChange={(e) => setGh({ ...gh, branch: e.target.value.trim() })} /></Field>
                <Field T={T} label="Chemin du fichier"><input className={inputCls} value={gh.path} onChange={(e) => setGh({ ...gh, path: e.target.value.trim() })} /></Field>
              </div>
              <Field T={T} label="Jeton d'accès (scope repo)"><input type="password" className={inputCls} value={gh.token} onChange={(e) => setGh({ ...gh, token: e.target.value.trim() })} placeholder="github_pat_…" /></Field>
              <div className="flex gap-2">
                <button type="button" className={`flex-1 ${btnSecondary}`} onClick={ghPull}>Récupérer</button>
                <button type="button" className={`flex-1 ${btnPrimary}`} onClick={ghPush}>Envoyer</button>
              </div>
            </div>
          </div>
        </Modal>
      ) : null}

      {isHelpOpen ? (
        <Modal T={T} title="Prise en main" onClose={() => setIsHelpOpen(false)}
          footer={<><span className={`text-[11px] ${T.faint}`}>Tout est stocké dans votre navigateur.</span><button type="button" className={btnSecondary} onClick={() => setIsHelpOpen(false)}>Fermer</button></>}>
          <ul className="space-y-2 text-[12px] leading-relaxed">
            <li><strong>Roadmap</strong> — trois niveaux : projet › tâche › sous-tâche. Chaque ligne se plie avec son propre bouton <span className="font-mono">+</span> / <span className="font-mono">−</span>, indépendamment des autres.</li>
            <li><strong>Se déplacer dans le temps</strong> — clic maintenu sur la grille pour la faire glisser, flèches <span className="font-mono">←</span> <span className="font-mono">→</span> pour avancer d'une semaine, molette du milieu enfoncée aussi. Le repère rose marque le Jour J ; s'il est hors écran, une pastille discrète apparaît sur le bord.</li>
            <li><strong>Planning</strong> — cliquez une demi-case pour planifier. Glissez un bloc horizontalement pour changer de date, verticalement pour le confier à un autre collaborateur.</li>
            <li><strong>Kanban</strong> — le « + » de chaque colonne crée une tâche déjà dans le bon statut. Les cartes se réordonnent à la souris dans leur colonne.</li>
            <li><strong>Notes</strong> — l'endroit pour les devis, contacts et comparatifs, afin de garder les autres vues lisibles. Une note peut être rattachée à un projet.</li>
            <li><strong>À plusieurs</strong> — bouton « Partager » : activez la collaboration, envoyez le lien d'invitation. Les modifications de chacun apparaissent en direct, en connexion directe de navigateur à navigateur.</li>
            <li className="pt-2"><strong>Raccourcis</strong> — <span className="font-mono">1 2 3 4</span> changent de vue, <span className="font-mono">T</span> recentre sur aujourd'hui, <span className="font-mono">F</span> affiche toute la période, <span className="font-mono">Ctrl+Z</span> annule, <span className="font-mono">Échap</span> ferme.</li>
          </ul>
        </Modal>
      ) : null}

      <datalist id="collab-list">{collaborators.map((c) => <option key={c} value={c} />)}</datalist>
      <Toasts items={toasts} onDismiss={dismissToast} />
    </div>
  );
}

(function mount() {
  const root = document.getElementById('root');
  if (!root) return;
  try {
    ReactDOM.createRoot(root).render(<ErrorBoundary><AuraPlanApp /></ErrorBoundary>);
  } catch (err) {
    root.innerHTML = '<div class="boot-error"><h1 style="font-size:18px;font-weight:800;margin:0 0 8px">Démarrage impossible</h1>'
      + '<p style="color:#94A3B8;font-size:13px;margin:0">' + String(err && err.message) + '</p></div>';
  }
})();
</script>

<script>
  window.setTimeout(function () {
    var root = document.getElementById('root');
    if (!root || root.childElementCount > 0) return;
    var missing = [];
    if (!window.React) missing.push('React');
    if (!window.ReactDOM) missing.push('ReactDOM');
    if (!window.Babel) missing.push('Babel');
    if (!window.tailwind) missing.push('Tailwind');
    root.innerHTML = '<div class="boot-error">'
      + '<h1 style="font-size:18px;font-weight:800;margin:0 0 8px;color:#E2E8F0">L\'application n\'a pas pu démarrer</h1>'
      + '<p style="color:#94A3B8;font-size:13px;line-height:1.6;margin:0 0 12px">'
      + (missing.length
        ? 'Ces bibliothèques n\'ont pas pu être téléchargées : <strong>' + missing.join(', ') + '</strong>. Vérifiez votre connexion ou un bloqueur de scripts.'
        : 'Le script a échoué au démarrage. Ouvrez la console du navigateur pour voir le détail.')
      + '</p><p style="color:#64748B;font-size:12px;margin:0">Astuce : ouvrez le fichier via une URL http(s) plutôt qu\'en double-clic si votre navigateur restreint les fichiers locaux.</p></div>';
  }, 6000);
</script>
</body>
</html>
